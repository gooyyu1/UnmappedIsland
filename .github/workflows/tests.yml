name: Tests

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'public/world-codex/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'eslint.config.js'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'public/world-codex/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'eslint.config.js'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

jobs:
  test:
    name: lint / build / vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # ランナー画像がツールキャッシュに持つNodeは稼働中のLTS系列だけ（ubuntu-24.04では22系と24系）で、
      # 系列を指定すればそのキャッシュがそのまま使われる。26系はまだLTSではないためどの画像にも無く、
      # 指定すると毎回ダウンロードと展開に約5秒かかっていた。26系がLTS化して画像へ載ったら26へ上げてよい。
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build (typecheck + bundle)
        run: npm run build

      - name: Run tests
        run: npx vitest run --reporter=default --reporter=github-actions
