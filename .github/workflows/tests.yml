name: Tests

# 走らせるかどうかを置き場の一覧で選ばない。**4つのコマンドの入力は追跡ファイル全部**なので、除ける
# 置き場が無く、拒否リスト（`paths-ignore`）は空になる。
#
# - `npm run format:check` … `prettier --check .` はリポジトリ全体を見る。除外を持つのは `.prettierignore`。
# - `npm run lint` … `eslint .` は `.claude/skills/**/*.mjs` も対象にする。
# - `npm test` … `docMemberReferences.test.ts` が `git ls-files` の一覧を「これは参照ではなくファイル名だ」の
#   判定に使うため、**どこのファイルを改名・追加・削除しても結果が変わりうる**。`exports.test.ts` は
#   `.claude` 配下を輸入する側として読む。
#
# 許可リスト（`paths`）に戻すと、入力の置き場が増えるたびにこのファイルも直す運用に戻り、直し忘れが
# 黙って素通しになる（issue #829 で `stats/` が実際に抜けていた）。
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: lint / build / vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # ランナー画像がツールキャッシュに持つNodeは稼働中のLTS系列だけ（ubuntu-24.04では22系と24系）で、
      # 系列を指定すればそのキャッシュがそのまま使われる。26系はまだLTSではないためどの画像にも無く、
      # 指定すると毎回ダウンロードと展開に約5秒かかっていた。26系がLTS化して画像へ載ったら26へ上げてよい。
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build (typecheck + bundle)
        run: npm run build

      - name: Run tests
        run: npx vitest run --reporter=default --reporter=github-actions

  # PRを出したセッションが名乗っているか（[`.claude/board-design.md`](../../.claude/board-design.md)
  # 2.11）。**盤面は差し戻す相手をコミットの `Claude-Session:` トレーラで引く**ので、名乗っていない
  # PRは、CIが赤くてもコンフリクトしても誰にも回らない。**促すだけにしないのは、書き忘れが既に
  # 実害を出しているから**（#1083・#1177 で本文の脚注が落ち、#1538 は差し戻す相手が引けなかった。
  # [`.claude/policies.md`](../../.claude/policies.md)「仕組みの作り方」）。
  #
  # 上の `test` と分けるのは、**止まる理由を混ぜないため**。名乗り忘れは中身の誤りではないので、
  # 直し方も直す人も別。
  claimed:
    name: 名乗り
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: コミットが Claude-Session で名乗っているか
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          claims=$(gh pr view "$PR" --repo "$REPO" --json commits --jq '
            [ .commits[].messageBody | split("\n")[]
              | select(startswith("Claude-Session:")) ] | length')
          if [ "$claims" -gt 0 ]; then
            echo "名乗っているコミット: $claims"
            exit 0
          fi
          # **1行で出す。** `::error::` は行ごとに別の注記になるので、分けると読む側で散らばる。
          echo "::error::このPRのコミットに Claude-Session: のトレーラがありません。コミットメッセージの末尾（Co-Authored-By: と同じ段）へ 'Claude-Session: https://claude.ai/code/session_<自分のID>' を入れて push し直してください。クラウドのセッションは自分がPR本文へ書くURLと同じもの、手元のブリッジは作業ツリーの名前 .claude/worktrees/bridge-cse_<ID> の <ID> がそのまま session_<ID> になります。盤面はこの行で差し戻す相手を引くので、無いPRは直しが要るときに誰にも回りません。"
          exit 1
