name: Tests

# 走らせるかどうかを置き場の一覧で選ばない。**4つのコマンドの入力は追跡ファイル全部**なので、除ける
# 置き場が無く、拒否リスト（`paths-ignore`）は空になる。
#
# - `npm run format:check` … `prettier --check .` はリポジトリ全体を見る。除外を持つのは `.prettierignore`。
# - `npm run lint` … `eslint .` は `.claude/skills/**/*.mjs` も対象にする。
# - `npm test` … `docMemberReferences.test.ts` が `git ls-files` の一覧を「これは参照ではなくファイル名だ」の
#   判定に使うため、**どこのファイルを改名・追加・削除しても結果が変わりうる**。`exports.test.ts` は
#   `.claude` 配下を輸入する側として読む。
#
# 許可リスト（`paths`）に戻すと、入力の置き場が増えるたびにこのファイルも直す運用に戻り、直し忘れが
# 黙って素通しになる（issue #829 で `stats/` が実際に抜けていた）。
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: lint / build / vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # ランナー画像がツールキャッシュに持つNodeは稼働中のLTS系列だけ（ubuntu-24.04では22系と24系）で、
      # 系列を指定すればそのキャッシュがそのまま使われる。26系はまだLTSではないためどの画像にも無く、
      # 指定すると毎回ダウンロードと展開に約5秒かかっていた。26系がLTS化して画像へ載ったら26へ上げてよい。
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build (typecheck + bundle)
        run: npm run build

      - name: Run tests
        run: npx vitest run --reporter=default --reporter=github-actions
