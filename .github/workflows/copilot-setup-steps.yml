name: 'Copilot Setup Steps'

# 変更時にすぐ検証でき、Actionsタブから手動でも走らせられるようにする。
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # ジョブ名は `copilot-setup-steps` 固定（それ以外だとCopilotに拾われない）。
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # tests.yml と同じ理由（node-version: 24）で揃えてある。26系がLTS化してランナー画像へ
      # 載ったら、そちらと合わせて上げる。
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
