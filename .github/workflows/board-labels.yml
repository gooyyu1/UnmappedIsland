name: Board labels

# 盤面のラベルと依存を付け外しする。**モデルのセッションが手で付けていたぶん**を引き取る
# （[`.claude/board-design.md`](../../.claude/board-design.md) 2.2・段3）。
#
# ラベルは**事実**しか持たない（1.3）。ここが動かすのは次。
#
# - レビューの結論 … `直し待ち` / `通してよい`（人の判断が要るなら `判断待ち` も。2.13.4）
# - 新しいコミットが載ったこと … 前の差分に付いていた印を全部外す
# - 3周目の判定が「直しが要る」だったこと … `収束せず`（4.6）
# - 人がPRのラベルを外したこと … `却下`（2.13.1）
# - ワーカーが自分の行き先を名乗ったこと … `判断待ち`（2.15）・`env:bridge`（2.16）
# - 棚卸しが順序を張ると決めたこと … `blockedBy`（2.17.3）
#
# **手で付ける形だと、付ける者が止まった瞬間に盤面が嘘になる**ことが、これを移す理由。2026-09-04 の
# 時点で PR #1512 はレビューが3周「直しが要る」を出しているのに `直し待ち` が付いていなかった——
# 付けるのが手作業で、それが止まっていたため。**盤面の見え方が正しくないと、デーモン（段4）の判定を
# 確かめられない。**
#
# `GITHUB_TOKEN` で足りる。他のワークフローを起こす必要が無いのはラベルだけで、**マージには
# PAT が要る**（2.2。段5）。

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [synchronize, unlabeled]

permissions:
  pull-requests: write
  issues: write

# 同じPRへの操作を直列に並べる。結論のコメントと push が近い時刻に来ると、片方が読んだラベルの
# 集合がもう片方の書き込みで置き換わる。
concurrency:
  group: board-labels-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  # レビューの結論を、コメントの1行目から読む（`.claude/review-prompt.md`「書き方」）。
  # **投稿者を絞る**——誰でもコメントできる場所なので、書き込み権のある者の発言だけを見る。
  verdict:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: 結論の行をラベルへ
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          # **本文はシェルへ展開しない。** `${{ }}` で埋めると、コメントの中身がそのままスクリプトに
          # なる。環境変数なら値のまま渡る。
          BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          # **1行目を取るのに `head` へ流さない。** `printf` の書き出しは4KiBずつなので、それを超える
          # 本文では、1行目を読んだ `head` が先に終わり、**書き切れなかった `printf` が
          # `Broken pipe` で落ちる**（`pipefail` があるのでステップごと落ち、ラベルが付かない）。
          # 長いレビューのコメントで実際に起きた（#1538、2026-09-05）。展開で取れば流れが無い。
          verdict=${BODY%%$'\n'*}
          verdict=$(printf '%s' "$verdict" | tr -d '\r' | sed 's/[[:space:]]*$//')
          # **同じ1行を、盤面の側も読む**（`scripts/agent/review-verdicts.mjs`。そのレビューが
          # 書き終えたかの判定に使う）。ここに node は持ち込めないので実装は別だが、**緩めた
          # ほうだけが余計なコメントを判定と読む**ので、下の文字列は向こうと揃っていること。
          #
          # **`通してよい（人の判断が要る）` は、通したうえで人へ回す形**（`board-design.md` 2.13.4）。
          # 差分を読まないと判定できないもの——宣言文法・スキーマ・ゲームコンセプト・確定節に抵触するか
          # ——をレビュアーが引き取ったので、`判断待ち` を付ける口がここに要る。
          case "$verdict" in
          '[レビュー] 通してよい')
            add=(通してよい)
            remove=直し待ち
            ;;
          '[レビュー] 通してよい（人の判断が要る）')
            add=(通してよい 判断待ち)
            remove=直し待ち
            ;;
          '[レビュー] 直しが要る')
            add=(直し待ち)
            remove=通してよい
            ;;
          *)
            echo "結論の行ではない: $verdict"
            exit 0
            ;;
          esac
          adds=()
          for label in "${add[@]}"; do adds+=(--add-label "$label"); done
          gh pr edit "$PR" --repo "$REPO" "${adds[@]}" --remove-label "$remove"

          # **3周目の判定が「直しが要る」なら、そこで人へ上げる**（`.claude/board-design.md` 4.6）。
          # **上限を持つのはここ。** レビュアーへの指示にしか書いていなかったので、書き忘れれば
          # 誰も止めず、実際に PR #1527 で4周目が走った。
          #
          # 数えるのは**結論のコメント**で、状態は持たない（2.9）。数え方も見分け方も上の `verdict`
          # と同じ——1行目が結論の文そのもの。緩めると、ラベルが付かなかったコメントで数が進む。
          #
          # **`直し待ち` を一緒に外す。** 残すと盤面が差し戻しを打ち、人が答える前に次の周が走る
          # ——`収束せず` の効き目は「レビューを出さない」の1つだけにしてある（2.13）。人が
          # 書き直させたいときは、直してほしいことを書いて `収束せず` を外す（2.13.1）。
          [ "${add[0]}" = 直し待ち ] || exit 0
          rounds=$(gh pr view "$PR" --repo "$REPO" --json comments --jq '
            [ .comments[]
              | select(.authorAssociation == "OWNER" or .authorAssociation == "MEMBER"
                       or .authorAssociation == "COLLABORATOR")
              | .body | split("\n")[0] | sub("[ \t\r]+$"; "")
              | select(test("^\\[レビュー\\] (通してよい(（人の判断が要る）)?|直しが要る)$")) ] | length')
          echo "結論のコメント: $rounds 件"
          if [ "$rounds" -ge 3 ]; then
            gh pr edit "$PR" --repo "$REPO" --add-label 収束せず --remove-label 直し待ち
          fi

  # セッションが自分の行き先や、張ると決めた順序を名乗ったことを、issue のコメントの1行目から読む
  # （[`.claude/board-design.md`](../../.claude/board-design.md) 2.15・2.16・2.17.3）。**PRではなく
  # issue の側**——名乗るのはPRを出す手前で詰まったときなので、そこにはまだPRが無い。
  #
  # **ラベルを直に付けさせず、名乗りを訳すのは、理由の置き場がコメントにしか無いから**——ラベルは
  # 事実しか持たない（1.3）ので、**なぜブリッジが要るのか・なぜ返すのか**は付けた側が名乗らないと
  # 残らない。`[順序]` はそれに加えて**唯一の経路**でもある。クラウドのセッションには依存
  # （`blockedBy`）を張る道具が無い（2.17.3）。
  #
  # **分類（`kind:`）は動かさない。** 「もうやる必要が無い」は分類ではなく人の手番の印で、軸が違う
  # （2.17.1）。外すと戻すのに2タップ要るうえ、外した issue は未整理として棚卸しへ戻る。配らない
  # 判定は投入する側が持つので（1.4、[`dispatch-task.sh`](../../scripts/agent/dispatch-task.sh)）、
  # ここは事実を1つ置くだけでよい。人は `判断待ち` を外せば列へ戻せる。
  #
  # **1行目は前方一致で見る。** レビューの結論は選択肢が閉じているので綴りちょうどで見分けられるが、
  # 名乗りの理由は閉じていない——1行目の残りがそのまま要約になる。
  declared:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request == null &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: 名乗りの行を盤面へ
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          # 1行目の取り方は上の `verdict` と同じ（`head` へ流さない理由もあちら）。
          head=${BODY%%$'\n'*}
          head=$(printf '%s' "$head" | tr -d '\r' | sed 's/[[:space:]]*$//')
          case "$head" in
          '[返却]'*) label=判断待ち ;;
          '[ブリッジ]'*) label=env:bridge ;;
          '[順序]'*)
            # **コメントを置いた issue が待つ側**で、1行目が挙げる番号が先に要るほう
            # （`[順序] #1234 の後（理由）`）。**張るかどうかを決めるのは棚卸し**なので、ここは
            # 決まったことを打つだけ（2.17.3）。
            blocker=$(printf '%s' "$head" | sed -n 's/^\[順序\][^#]*#\([0-9][0-9]*\).*$/\1/p')
            # **番号が読めなければ落とす。** 黙って何もしないと、申告した側は張られたと思ったまま
            # 進み、順序がどこにも無いことに誰も気づかない。
            [ -n "$blocker" ] || {
              echo "先に要るほうの番号が読めない: $head" >&2
              exit 1
            }
            # 渡すのは**REST の数値 ID**（`--jq .id`）で、`I_kwDO...` の node ID では通らない。
            # 循環は GitHub が 422 で拒む。
            gh api --method POST "repos/$REPO/issues/$ISSUE/dependencies/blocked_by" \
              -F issue_id="$(gh api "repos/$REPO/issues/$blocker" --jq .id)"
            exit 0
            ;;
          *)
            echo "名乗りの行ではない: $head"
            exit 0
            ;;
          esac
          gh issue edit "$ISSUE" --repo "$REPO" --add-label "$label"

  # 新しいコミットが載ったら、前の差分に付いていた印はどれも嘘になる。**`通してよい` も外す**
  # ——残すと、レビューを受けていないコミットが段5のマージに拾われる。
  #
  # **`判断待ち` も外す。出どころが2つあり、どちらも前の差分にしか掛かっていない。**
  #
  # - `needs-user-review.sh` が**差分から導出する事実**（`【確定】` の印が動いた。2.13.3）。
  #   `merge-pr.sh` がマージを試みるたびに付け直す（1.1）。**副作用として、`通してよい` が
  #   付いたままの push では盤面がマージを1回試みて `HELD` で跳ね返され、そこで付き直る。**
  # - レビュアーが `[レビュー] 通してよい（人の判断が要る）` で付けたもの（2.13.4）。**こちらは
  #   付け直さない**——次の周のレビューが同じことを言えば、また付く。**差分が変われば人へ回す理由も
  #   無くなりうるので、これは正しい振る舞い。**
  #
  # **`却下` と `収束せず` も外す。** どちらも前の差分に対する人の手番の印で、直しが載れば終わる。
  synchronized:
    if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    steps:
      - name: 前の差分への結論を外す
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr edit "$PR" --repo "$REPO" \
            --remove-label 直し待ち --remove-label 通してよい \
            --remove-label 判断待ち --remove-label 収束せず --remove-label 却下

  # **人がPRのラベルを外したこと**を、差し戻しへ訳す（[`.claude/board-design.md`](../../.claude/board-design.md)
  # 2.13.1）。人がすることは2つだけ——**外す＝書いた本人に直してもらう**、**マージする＝それでよい**。
  # だから外れたPRに残る仕事は差し戻しの1つで、`却下` はその事実を持つ。
  #
  # **「外れている状態」では書けない**（外れていることと、最初から付いていないことが同じに見える。
  # 1.1）。`unlabeled` は**出来事**なので、ここで受けて事実へ変える。名乗りをラベルへ訳す `declared`
  # と同じ形で、**訳した先のラベルを付けるのは機械。**
  #
  # **理由は写さない。** ユーザーは外す前に直してほしいことをPRへ書くので、**それがそのまま
  # 差し戻しの文面**になる（[`resume-prompt.md`](../../.claude/resume-prompt.md) の `## reject` が
  # そこを読ませる）。ラベルは事実しか持たない（1.3）ので、理由の置き場はコメントのまま動かさない。
  unlabeled_by_hand:
    if: github.event_name == 'pull_request' && github.event.action == 'unlabeled'
    runs-on: ubuntu-latest
    steps:
      - name: 外されたことを差し戻しへ
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          LABEL: ${{ github.event.label.name }}
          # **外したのが機械かを、出来事の側から見る。** push で前の差分の印を落とす段（上の
          # `synchronized`）が同じ `unlabeled` を起こすので、分けられないとその push が差し戻しに
          # なる。`GITHUB_TOKEN` の書き込みはワークフローを起こさない決まりだが、**それに頼ると
          # 動く証拠がここに残らない**ので、見分けは自分で持つ。
          SENDER: ${{ github.event.sender.type }}
        run: |
          set -euo pipefail
          # 外して意味があるのは、人の手番でPRを止めている印だけ（1.3）。`直し待ち` と `却下` は
          # 既に差し戻し中の印なので、外しても打つ手は変わらない。
          case "$LABEL" in
          通してよい | 判断待ち | 収束せず) ;;
          *)
            echo "PRを止めている印ではない: $LABEL"
            exit 0
            ;;
          esac
          if [ "$SENDER" = Bot ]; then
            echo "外したのは機械（$LABEL）。差し戻さない。"
            exit 0
          fi
          gh pr edit "$PR" --repo "$REPO" --add-label 却下
