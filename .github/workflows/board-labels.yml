name: Board labels

# 盤面のラベルを付け外しする。**司令塔のモデルセッションが手で付けていたぶん**を引き取る
# （[`.claude/board-design.md`](../../.claude/board-design.md) 2.2・段3）。
#
# ラベルは**事実**しか持たない（1.3）。ここが動かすのは次。
#
# - レビューの結論 … `直し待ち` / `通してよい`
# - 新しいコミットが載ったこと … どちらも外す
# - 3周目の判定が「直しが要る」だったこと … `判断待ち`（4.6）
#
# **司令塔が止まると盤面が嘘になる**ことが、これを移す理由。2026-09-04 の時点で PR #1512 は
# レビューが3周「直しが要る」を出しているのに `直し待ち` が付いていなかった——付けていたのが
# 司令塔で、それが止まっていたため。**盤面の見え方が正しくないと、デーモン（段4）の判定を
# 確かめられない。**
#
# `GITHUB_TOKEN` で足りる。他のワークフローを起こす必要が無いのはラベルだけで、**マージには
# PAT が要る**（2.2。段5）。

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [synchronize]

permissions:
  pull-requests: write

# 同じPRへの操作を直列に並べる。結論のコメントと push が近い時刻に来ると、片方が読んだラベルの
# 集合がもう片方の書き込みで置き換わる。
concurrency:
  group: board-labels-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  # レビューの結論を、コメントの1行目から読む（`.claude/review-prompt.md`「書き方」）。
  # **投稿者を絞る**——誰でもコメントできる場所なので、書き込み権のある者の発言だけを見る。
  verdict:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: 結論の行をラベルへ
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          # **本文はシェルへ展開しない。** `${{ }}` で埋めると、コメントの中身がそのままスクリプトに
          # なる。環境変数なら値のまま渡る。
          BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          verdict=$(printf '%s' "$BODY" | head -1 | tr -d '\r' | sed 's/[[:space:]]*$//')
          case "$verdict" in
          '[レビュー] 通してよい')
            add=通してよい
            remove=直し待ち
            ;;
          '[レビュー] 直しが要る')
            add=直し待ち
            remove=通してよい
            ;;
          *)
            echo "結論の行ではない: $verdict"
            exit 0
            ;;
          esac
          gh pr edit "$PR" --repo "$REPO" --add-label "$add" --remove-label "$remove"

          # **3周目の判定が「直しが要る」なら、そこで人へ上げる**（`.claude/board-design.md` 4.6）。
          # **上限を持つのはここ。** レビュアーへの指示にしか書いていなかったので、書き忘れれば
          # 誰も止めず、実際に PR #1527 で4周目が走った。
          #
          # 数えるのは**結論のコメント**で、状態は持たない（2.9）。数え方も見分け方も上の `verdict`
          # と同じ——1行目が結論の文そのもの。緩めると、ラベルが付かなかったコメントで数が進む。
          #
          # `判断待ち` は push では外れない（下の `synchronized`）。**下ろすのは人だけ。**
          [ "$add" = 直し待ち ] || exit 0
          rounds=$(gh pr view "$PR" --repo "$REPO" --json comments --jq '
            [ .comments[]
              | select(.authorAssociation == "OWNER" or .authorAssociation == "MEMBER"
                       or .authorAssociation == "COLLABORATOR")
              | .body | split("\n")[0] | sub("[ \t\r]+$"; "")
              | select(test("^\\[レビュー\\] (通してよい|直しが要る)$")) ] | length')
          echo "結論のコメント: $rounds 件"
          if [ "$rounds" -ge 3 ]; then
            gh pr edit "$PR" --repo "$REPO" --add-label 判断待ち
          fi

  # 新しいコミットが載ったら、前の差分に対する結論はどちらも嘘になる。**`通してよい` も外す**
  # ——残すと、レビューを受けていないコミットが段5のマージに拾われる。
  #
  # **`判断待ち` は外さない。** あれは差分への結論ではなく「人の手番に入った」という事実で、
  # 直しを push しても人の手番は終わらない（外すと4周目以降が走り出す）。
  synchronized:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 前の差分への結論を外す
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr edit "$PR" --repo "$REPO" --remove-label 直し待ち --remove-label 通してよい
