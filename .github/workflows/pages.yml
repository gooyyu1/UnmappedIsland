name: Publish docs and game to GitHub Pages

# ドキュメントのHTMLとビルドしたゲームをsite/へ出力し、GitHub Pagesへ直接デプロイする。
#
# 生成物はリポジトリへコミットしない（site/は.gitignore）。以前はmainのdocs/を配信する設定で、
# ワークフローが生成物をコミットしていたが、それだとマージのたびに生成物一式が履歴へ積まれ、
# ドキュメント側とゲーム側のpushでPagesのビルドも2回走っていた。
#
# 前提: リポジトリ設定のPagesのソースが「GitHub Actions」になっていること。
# 「Deploy from a branch」のままだとdeploy-pagesが失敗する。

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'codex/**'
      - 'typedoc.json'
      - 'typedoc.readme.md'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'vite.codex.config.ts'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# ここの宣言は全ジョブへ継承される。ジョブ側でpermissionsを宣言すると、継承ではなくここの置き換えに
# なる。deployにもid-token: write（Pagesへのデプロイに要る）が渡るよう、ジョブ側には置かない。
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # 走っているデプロイは止めない（公開途中で打ち切ると中途半端な状態になるため）。
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: docs / game
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 系列で指定する理由はtests.ymlのコメントを参照。2つのワークフローで揃えること。
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare site output directories
        run: |
          # サブフォルダごとの出力先は後続の変換ループが`mkdir -p "$out_dir"`で都度作成するため、
          # ここではdocs/配下のフォルダ名をハードコードしない（フォルダ構成が変わっても壊れない）。
          rm -rf site
          mkdir -p site/docs

      - name: Prepare shared page header
        run: |
          # 変換したページと索引ページで同じ見た目にするため、追加のスタイルはここだけに書く
          # （変換スクリプトと、後続の索引ページの生成が同じファイルを読む）。
          cat > /tmp/docs-header.html <<'EOF'
          <style>
            /*
             * github-markdown-cssが暗い地を敷くのは.markdown-bodyの内側だけで、その外側は
             * ブラウザ既定の白のまま残る。articleの余白（margin）がそこに白い枠として出るため、
             * ページ全体にも同じ地の色を敷く（色はgithub-markdown-darkの地の色と同じ値）。
             */
            html,
            body {
              margin: 0;
              background: #0d1117;
            }
            /* スマホでの表示崩れ対策（狭い画面でも余白を詰めてはみ出させない）。 */
            @media (max-width: 600px) {
              .markdown-body {
                padding: 1rem !important;
              }
            }
          </style>
          EOF

      - name: Convert markdown files to HTML
        # 見出しのアンカーIDと、ドキュメント同士のリンクの張り替えはスクリプト側が担う
        # （アンカーの規則はscripts/githubSlugs.mjsに集約し、テストと同じものを使う）。
        run: node scripts/buildDocsSite.mjs docs site/docs /tmp/docs-header.html

      - name: Copy HTML mocks and assets to site/docs
        run: |
          # Copy standalone HTML mocks and screenshots from docs/ into the site
          find docs -name '*.html' -o -name '*.png' -o -name '*.jpg' -o -name '*.gif' | while read asset; do
            rel="${asset#docs/}"
            dest="site/docs/${rel}"
            mkdir -p "$(dirname "$dest")"
            cp "$asset" "$dest"
            echo "Copied: $dest"
          done

      - name: Generate source reference with TypeDoc
        # 出力先（site/reference）はtypedoc.jsonに書いてある。
        run: npm run docs:reference

      # viteのビルドは型エラーを無視するため、壊れたものを公開しないよう先に型検査する。
      - name: Typecheck
        run: npm run typecheck

      - name: Build game into site/game
        # baseを相対パスにすると、リポジトリ名・サブフォルダ名を成果物へ埋め込まずに済む
        # （https://<user>.github.io/<repo>/game/ でそのまま動く）。
        run: npx vite build --mode publish --base=./ --outDir=site/game --emptyOutDir

      - name: Build WorldCodex viewer into site/codex
        # 出力先（site/codex）はvite.codex.config.tsに書いてある。ゲームと同じソース・同じYAMLを読む
        # 別ページなので、ビルドだけを分ける。
        run: npx vite build --config vite.codex.config.ts --mode publish --base=./

      - name: Generate missing index.html files
        run: |
          # site/ 配下の全ディレクトリを走査し、index.html が存在しないフォルダにのみ生成する。
          # すでにindex.htmlがあるフォルダ（Markdownから変換済みのものを含む）は上書きしない。
          generate_index() {
            local dir="$1"
            # サイトルート自身はrelが空になる（前置きを外すだけでは"site"のまま残るため2段で削る）。
            local rel="${dir#site}"
            rel="${rel#/}"
            local title="${rel:-UnmappedIsland}"

            if [ -f "$dir/index.html" ]; then
              echo "Skipped (already exists): $dir/index.html"
              return
            fi

            {
              echo '<!DOCTYPE html>'
              echo '<html lang="ja"><head><meta charset="utf-8" />'
              echo '<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />'
              echo "<title>${title}</title>"
              echo '<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown-dark.min.css" />'
              cat /tmp/docs-header.html
              echo '</head><body>'
              echo '<article class="markdown-body" style="max-width:900px;margin:2rem auto;padding:1rem 2rem;box-sizing:border-box">'
              echo "<h1>${title}</h1>"
              echo '<ul>'
              if [ -n "$rel" ]; then
                echo '<li><a href="../">.. (親フォルダ)</a></li>'
              fi

              find "$dir" -mindepth 1 -maxdepth 1 -type d | sort | while read -r sub; do
                name="$(basename "$sub")"
                echo "<li><a href=\"${name}/\">${name}/</a></li>"
              done

              find "$dir" -mindepth 1 -maxdepth 1 -type f ! -name 'index.html' | sort | while read -r f; do
                name="$(basename "$f")"
                echo "<li><a href=\"${name}\">${name}</a></li>"
              done

              echo '</ul>'
              echo '</article>'
              echo '</body></html>'
            } > "$dir/index.html"
            echo "Generated: $dir/index.html"
          }

          # site/game・site/codexはViteの、site/referenceはTypeDocのビルド成果物で、どれも自前の
          # 入口ページを持つので索引ページを混ぜない（サイト直下のindex.htmlからは、他のフォルダと
          # 同じくgame/・codex/・reference/へのリンクが張られる）。
          find site -type d \
            -not -path 'site/game' -not -path 'site/game/*' \
            -not -path 'site/codex' -not -path 'site/codex/*' \
            -not -path 'site/reference' -not -path 'site/reference/*' \
            | sort | while read -r d; do
            generate_index "$d"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
