name: Publish docs and game to GitHub Pages

# ドキュメントのHTMLとビルドしたゲームをsite/へ出力し、GitHub Pagesへ直接デプロイする。
#
# 生成物はリポジトリへコミットしない（site/は.gitignore）。以前はmainのdocs/を配信する設定で、
# ワークフローが生成物をコミットしていたが、それだとマージのたびに生成物一式が履歴へ積まれ、
# ドキュメント側とゲーム側のpushでPagesのビルドも2回走っていた。
#
# 前提: リポジトリ設定のPagesのソースが「GitHub Actions」になっていること。
# 「Deploy from a branch」のままだとdeploy-pagesが失敗する。

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'typedoc.json'
      - 'typedoc.readme.md'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# ここの宣言は全ジョブへ継承される。ジョブ側でpermissionsを宣言すると、継承ではなくここの置き換えに
# なる。deployにもid-token: write（Pagesへのデプロイに要る）が渡るよう、ジョブ側には置かない。
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # 走っているデプロイは止めない（公開途中で打ち切ると中途半端な状態になるため）。
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: docs / game
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pandoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pandoc

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare site output directories
        run: |
          # サブフォルダごとの出力先は後続の変換ループが`mkdir -p "$out_dir"`で都度作成するため、
          # ここではdocs/配下のフォルダ名をハードコードしない（フォルダ構成が変わっても壊れない）。
          rm -rf site
          mkdir -p site/docs

      - name: Convert markdown files to HTML
        run: |
          # スマホでの表示崩れ対策（狭い画面でも余白を詰めてはみ出させない）。githubのviewport meta
          # 自体はpandocの既定テンプレートが常に出力するため、ここではarticleラッパーの余白だけ補正する。
          cat > /tmp/docs-mobile-header.html <<'EOF'
          <style>
            @media (max-width: 600px) {
              .markdown-body { padding: 1rem !important; }
            }
          </style>
          EOF

          PANDOC_OPTS=(
            --standalone
            --metadata charset=utf-8
            --css=https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown-dark.min.css
            --include-in-header=/tmp/docs-mobile-header.html
            --variable=include-before='<article class="markdown-body" style="max-width:900px;margin:2rem auto;padding:1rem 2rem;box-sizing:border-box">'
            --variable=include-after='</article>'
          )

          find docs -name '*.md' | while read md_file; do
            # Derive output path: docs/engine/Foo.md -> site/docs/engine/Foo.html
            rel="${md_file#docs/}"               # strip leading "docs/"
            out_dir="site/docs/$(dirname "$rel")"
            out_file="site/docs/${rel%.md}.html"
            mkdir -p "$out_dir"
            pandoc "${PANDOC_OPTS[@]}" \
              --metadata title="$(basename "${rel%.md}")" \
              -o "$out_file" \
              "$md_file"
            echo "Generated: $out_file"
          done

      - name: Rewrite internal .md links to .html
        run: |
          # Pandoc does not rewrite links between converted documents, so a link that
          # pointed at another Markdown file (e.g. href="./Design/README.md") is left
          # untouched even though only Design/README.html exists in the output. Rewrite
          # every such relative href (anything without a ":" is treated as relative,
          # so http(s):// and mailto: links are left alone) from .md to .html.
          find site/docs -name '*.html' | while read -r html_file; do
            sed -i -E 's/href="([^":]+)\.md(#[^"]*)?"/href="\1.html\2"/g' "$html_file"
          done
          echo "Rewrote internal .md links to .html across site/docs/"

      - name: Copy HTML mocks and assets to site/docs
        run: |
          # Copy standalone HTML mocks and screenshots from docs/ into the site
          find docs -name '*.html' -o -name '*.png' -o -name '*.jpg' -o -name '*.gif' | while read asset; do
            rel="${asset#docs/}"
            dest="site/docs/${rel}"
            mkdir -p "$(dirname "$dest")"
            cp "$asset" "$dest"
            echo "Copied: $dest"
          done

      - name: Generate source reference with TypeDoc
        # 出力先（site/reference）はtypedoc.jsonに書いてある。
        run: npm run docs:reference

      # viteのビルドは型エラーを無視するため、壊れたものを公開しないよう先に型検査する。
      - name: Typecheck
        run: npm run typecheck

      - name: Build game into site/game
        # baseを相対パスにすると、リポジトリ名・サブフォルダ名を成果物へ埋め込まずに済む
        # （https://<user>.github.io/<repo>/game/ でそのまま動く）。
        run: npx vite build --base=./ --outDir=site/game --emptyOutDir

      - name: Generate missing index.html files
        run: |
          # site/ 配下の全ディレクトリを走査し、index.html が存在しないフォルダにのみ生成する。
          # すでにindex.htmlがあるフォルダ（Pandoc変換済みを含む）は上書きしない。
          generate_index() {
            local dir="$1"
            # サイトルート自身はrelが空になる（前置きを外すだけでは"site"のまま残るため2段で削る）。
            local rel="${dir#site}"
            rel="${rel#/}"
            local title="${rel:-UnmappedIsland}"

            if [ -f "$dir/index.html" ]; then
              echo "Skipped (already exists): $dir/index.html"
              return
            fi

            {
              echo '<!DOCTYPE html>'
              echo '<html lang="ja"><head><meta charset="utf-8" />'
              echo '<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />'
              echo "<title>${title}</title>"
              echo '<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown-dark.min.css" />'
              echo '<style>@media (max-width: 600px) { .markdown-body { padding: 1rem !important; } }</style>'
              echo '</head><body>'
              echo '<article class="markdown-body" style="max-width:900px;margin:2rem auto;padding:1rem 2rem;box-sizing:border-box">'
              echo "<h1>${title}</h1>"
              echo '<ul>'
              if [ -n "$rel" ]; then
                echo '<li><a href="../">.. (親フォルダ)</a></li>'
              fi

              find "$dir" -mindepth 1 -maxdepth 1 -type d | sort | while read -r sub; do
                name="$(basename "$sub")"
                echo "<li><a href=\"${name}/\">${name}/</a></li>"
              done

              find "$dir" -mindepth 1 -maxdepth 1 -type f ! -name 'index.html' | sort | while read -r f; do
                name="$(basename "$f")"
                echo "<li><a href=\"${name}\">${name}</a></li>"
              done

              echo '</ul>'
              echo '</article>'
              echo '</body></html>'
            } > "$dir/index.html"
            echo "Generated: $dir/index.html"
          }

          # site/gameはViteの、site/referenceはTypeDocのビルド成果物で、どちらも自前の入口ページを
          # 持つので索引ページを混ぜない（サイト直下のindex.htmlからは、他のフォルダと同じく
          # game/・reference/へのリンクが張られる）。
          find site -type d \
            -not -path 'site/game' -not -path 'site/game/*' \
            -not -path 'site/reference' -not -path 'site/reference/*' \
            | sort | while read -r d; do
            generate_index "$d"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
