# 島からの脱出（docs/world/Voyage.md）を通しで試すための開始状態。筏は組み上がっていて、
# 水と食料を兼ねる青いヤシの実が積んであり、金の聖杯も載っている。筏のカードから「航海に出る」を
# 選べばすぐ出航できる。
#
# **出航してからは、時間を送っても進まない。** 海区ごとに、外側の場所（筏を載せている海区）の札から
# 「見張り」を繰り返して航路を出し、その航路の「渡る」で次の海区へ移る——島影の海から本土の島影まで
# 14の海区を渡ると本土に着く（Voyage.md 3節）。見張りは航路のほかに、その海区の顔ぶれに応じた
# 拾い物と、魚の群れのような漁り場も返す。
#
# 追い風の多い乾季から始める（風向きは8時間ごとに引き直されるので、そのまま続くとは限らない）。
# 青い実は刃物で穴を開けて飲むので、尖った石を持たせておく——無いと水が1滴も飲めない。
#
# 書式はsrc/scenario/Scenario.ts、位置づけはSaveDataManagement.md「テスト用シナリオ」節を参照。

title: 出航のしたく

# 3は開始地点が砂浜になるシード（海に面した土地からしか出航できない）。
seed: 3

player:
  # 帆は組み込み前の状態で持たせる（筏へ乗り込んで、部品の枠へ差す）。
  hand: [sharp_stone, stone_axe, rawhide_sail]

location:
  type: sandy_beach
  fixtures: [raft]
  # 筏の中へ積む（Scenario.tsのinside）。
  inside:
    raft:
      # 水と食料を兼ねる青いヤシの実。1個で水分20（＝5時間ぶん）なので、これで12日ほど保つ。
      - green_coconut x60
      # 熟した実。水は無いが、割れば果肉が採れる。
      - coconut x10
      # 持ち帰るアーティファクト（docs/concept/GameEndings.md 6節）。到達すると棚に収まる。
      - golden_chalice

world:
  props:
    season: dry
    wind: tailwind
