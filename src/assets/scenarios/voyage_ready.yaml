# 島からの脱出（docs/world/Voyage.md）を通しで試すための開始状態。筏は組み上がっていて、
# 水と食料を兼ねる青いヤシの実が積んであり、金の聖杯も載っている。筏のカードから「航海に出る」を
# 選べばすぐ出航できる。
#
# **出航してからは、時間を送っても進まない。** 海区ごとに、外側の場所（筏を載せている海区）の札から
# 「見張り」を繰り返して航路を出し、その航路の「渡る」で次の海区へ移る——島影の海から本土の島影まで
# 14の海区を渡ると本土に着く（Voyage.md 3節）。見張りは航路のほかに、その海区の顔ぶれに応じた
# 拾い物と、魚の群れのような漁り場も返す。
#
# **見張りは進む航路と一緒に、島の側へ戻る航路も返す**（Voyage.md 3.5節）。どこまで進んでも、渡ってきた
# 航路を戻れば島の浜へ帰れる——代償は戻るぶんの時間だけで、積荷は減らない。
#
# **本土まで行かずに引き返す遊び方もそのまま試せる**（GameEndings.md 11節の沿岸航海）。砂浜から4区間先の
# 海鳥の岩には上陸できる小島が立ち、歩けば**錫鉱石**が採れる——島では採れない材料はここにしか無い
# （Voyage.md 3.4節）。
#
# **航海の食料の半分は海の上で釣る**（Voyage.md 3.9節）ので、突き銛を持たせておく。見張りが立てた
# 魚の群れの札へ銛をドラッグすれば30分で突ける（群れの居ない海面も、筏の札へ重ねれば60分で突ける）。
#
# 追い風の多い乾季から始める（風向きは8時間ごとに引き直されるので、そのまま続くとは限らない）。
# 青い実は刃物で穴を開けて飲むので、尖った石を持たせておく——無いと水が1滴も飲めない。
#
# 書式はsrc/scenario/Scenario.ts、位置づけはSaveDataManagement.md「テスト用シナリオ」節を参照。

title: 出航のしたく

# 3は開始地点が砂浜になるシード（海に面した土地からしか出航できない）。
seed: 3

player:
  # 帆は組み込み前の状態で持たせる（筏へ乗り込んで、部品の枠へ差す）。
  # 銛は紐が要るので海の上では作れない（Voyage.md 3.9.4節）。持って出ないと釣りへ手が届かない。
  hand: [sharp_stone, stone_axe, rawhide_sail, fishing_harpoon]

location:
  type: sandy_beach
  fixtures: [raft]
  # 筏の中へ積む（Scenario.tsのinside）。
  inside:
    raft:
      # 水と食料を兼ねる青いヤシの実。1個で水分20（＝5時間ぶん）なので、これで12日ほど保つ。
      - green_coconut x60
      # 熟した実。水は無いが、割れば果肉が採れる。
      - coconut x10
      # 持ち帰るアーティファクト（docs/concept/GameEndings.md 6節）。到達すると棚に収まる。
      - golden_chalice
      # 銛の予備3組（Voyage.md 3.9.4節）。**積むのは銛ではなく穂先と紐**——柄になる太い枝は見張りの
      # 流木が返すが、石と紐は返らない。
      #
      # 3組なのは突く回数から。砂浜からは12区間で、群れの立ちうる海区は4つ（同3.9.3節）。群れは
      # 6時間で去るまで12回突けるので、群れの卓だけで48回——同3.9.4節の「1航海に1本ほど」はこの数。
      # 群れの出ない区間で海面も押せば70回ほどになり、50回に1回失う卓では1.4本が期待値になる。
      # 4本目まで失うのはそこで6%、群れだけを突く50回なら2%で、切らして釣りが終わる目はほぼ無い。
      - sharp_stone x3
      - cord x3

world:
  props:
    season: dry
    wind: tailwind
