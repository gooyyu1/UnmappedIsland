# 嵐（ScreenLayout.md 7.5.3節）の見え方を確かめるための開始状態。
# 雨季の嵐の中から始め、斜めに降る雨と風の筋、翳りの濃さを見る。
#
# 書式はsrc/scenario/Scenario.ts、位置づけはSaveDataManagement.md「テスト用シナリオ」節を参照。

title: 嵐の砂浜

# 3は開始地点が砂浜になるシード。
seed: 3

world:
  props:
    weather: storm
    # 見ている途中で晴れないよう、雨季の飽和した大気から始める。天気はweather_remainingが
    # 尽きるたび大気水分量の段が持つ重みで選び直されるので、乾いた状態のままだと次は晴れ系になる
    # （ClimateSystem.md 4.3節）。飽和（saturated）ではsunny/clearの重みが無いので、次に来るのは
    # 嵐・大雨・小雨か、稀に曇りだけになる。
    season: wet
    atmospheric_moisture: 90
