# 火を起こし、保ち、その熱を他の物へ渡す仕組み（docs/engine/FireSystem.md）。
#
# 炉は薪（fuel）と火力（heat）の2つの数を持つ。薪をくべれば火力が育ち、火力が高いほど薪を速く食って
# 速く冷める。この2つが釣り合ったところで火力が落ち着くので、「薪の量が火の大きさを決める」は上限を
# どこかへ書いた結果ではない（同2.2節）。
#
# 火が生きているかを表すフラグは持たない。火力が0より大きいことがそれで、一番下の段（ember）が
# 種火——料理には使えないが、薪をくべれば育つ火力（同3節）。
#
# 着火は2段構え。火起こし具を火口へ重ねて火種を作り、火種を炉へ重ねて種火を立てる。火種は1tickで
# 燃え尽きるので、届くのは同じ土地の中まで——洞窟の中で起こして外の炉へ運ぶことはできるが、
# 土地は移動できない（同3.1節）。
#
# 直火で焼く物（roastable）と火にかけた器（cookware）はfireスロットへ入るが、薪は入らない。くべた薪は
# 物として残らず、炉のfuelへ溶けて消える（同2.1節）。
#
# 加熱は炉が子のcooking_progressを進めるだけで、何分で何になるかは料理側の型が持つ（同7節）。
# 生肉→焼けた肉→焦げた塊の鎖はanimals.yamlにある。
#
# 炉が渡す熱にはもう1本の受け口があり、そちらは石が受ける。溜め切った石（hot_stone）は炉から
# 持ち出せて、水を張った器へ落とせば器を焦がさずに湯が沸く（同9.1節）。

traits:
  # 炉へくべられる物。fuelは「くべると炉のfuelへ移る量」で、値は物ごとに違う。
  burnable:
    tags: [fuel]
    props:
      fuel: {}

  # 火起こし具で火が付けられる物。摩擦で得られるのは米粒ほどの熾なので、受け止められるのは
  # ほぐした繊維・綿状のものだけ（docs/engine/FireSystem.md 3.2節）。
  ignitable:
    tags: [tinder]
    props:
      # 1回の火起こしが成功する重み。失敗の重み（40）との比が成功率になる。
      # スキルの段で動かすのは今後の課題（同3.1節）。天気はここではなく可否で効く（下のlight）。
      ignition_chance: {}
    interactions:
      # 火起こし具を重ねて火を移す。外した回も火口は失われる。
      #
      # どちらの回もsignal（9.8節）で結果を告げる。火口はどちらの回も同じように消えるので、
      # レーンの上では30分かけて札が1枚減っただけに見え、成否が付かない。
      # **明るさの条件は持たない**（IlluminationSystem.md 5.1節）。摩擦発火は手と耳の作業で、
      # 受け止める熾は自分で光るため、暗さで難しくならない。暗さで塞ぐと、日が落ちた後に
      # 明かりを取り戻す道が無くなる。**閉じるのは雨だけ**で、それも屋根の下なら開いている
      # （下のconditions）。
      light:
        trigger: {drag: {object: fire_drill}}
        duration: 30
        conditions:
          # 雨に打たれた火口は熾を受け止められないので、雨天の屋外では起こせない
          # （docs/engine/FireSystem.md 3.1.1節）。確率ではなく可否なので、pickの重みではなく
          # 条件で閉じる。屋根の下（浅い洞窟のsheltered）なら降っていても起こせる。
          #
          # **葉2つは炉の雨（下のhearth）と同じ**で、そちらが削るのは火力、こちらが閉じるのは可否。
          # 束ねてnotで包むのは、祖先に天候の概念が無いときに閉じないため
          # （GameElementDefinition.md 14.1節）。
          - reason: raining
            not:
              all:
                - {subject: ancestor, prop: sheltered, eq: 0}
                - {subject: ancestor, prop: weather, in: [light_rain, heavy_rain, storm]}
        # **火の腕はここから立ち上がる**（docs/engine/SkillSystem.md 3節の実行経路、量の置き方は
        # characters/player_character.yaml）。きりもみ式は道具も紐も要求しない（docs/world/SurvivalItems.md
        # 1.1節）ので、何も持たない状態から回る。**pickの外に置く**ので、火が移らなかった回も同じだけ
        # 伸びる——外した回も火口は失われており、払った手間は変わらない。
        add: {agent: {skill_firecraft: 2}}
        pick:
          - weight: {prop: ignition_chance}
            destroy: self
            spawn: {object: burning_tinder}
            signal: lit
          - weight: 40
            destroy: self
            signal: not_lit

  # 火の中で熱を溜められる物（docs/engine/FireSystem.md 9.1節）。溜めるのは炉で、速さは火力の段が
  # 決める（下のhearthのheat）。炉の外では抜けていく。
  #
  # 溜め切って何になるか（on_max）と、抜け切って何に戻るか（on_min）は型ごとに違うので持たない。
  heat_soaking:
    tags: [roastable]
    props:
      heat_soak:
        value: 0
        # 炎（3/tick）なら4tick＝1時間、熾火（1/tick）なら3時間で溜まり切る。
        range: {min: 0, max: 12}
        stages:
          # 湯を沸かすには、溜め切った石の半分が要る（hot_stoneのboil）。炉から出して30分が持ち時間。
          - {name: cool}
          - {name: searing, min: 6}
        passives:
          # 炉の外では冷める。**祖先に火力が無いとき＝どこにも火が無いときも冷ます**必要があるので、
          # 否定形の演算子ではなくnotで包む（GameElementDefinition.md 14.1節）。炉に入れたまま火が
          # 消えた場合も、同じこの1行で冷める。
          - conditions:
              - not: {subject: ancestor, prop: heat, gt: 0}
            add: {self: {heat_soak: -3}}

  # 炉。薪と火力を持ち、火にかけた物を子として加熱する。
  #
  # fuel/heatのrangeとfireスロットの枠は炉ごとに違うので、ここでは宣言しない。
  hearth:
    tags: [fixture, hearth]
    # 火にかけている物のスロット（docs/engine/FireSystem.md 1.1節）。押せば開き、重ねれば入る。
    # 外から見えるもの（7.11節）。何が燃えているかは炎を見れば分かる。
    visible_slots: [fire]
    # 火力で絵が差し替わる（CardView.md 5.1節）。絵は消えている・種火・ついているの3つ（heat参照）。
    art_by_stage: heat
    props:
      # くべた薪。カードにバーで見せる（同3節、CardView.md 8節のgaugeタグ）。段は火力の育ちを決める——
      # 薪が多いほど火は速く育ち、その炉の上限（heatのrange.max）まで上がる。薪が少なければ、
      # 上がりきる前に燃え尽きる。
      fuel:
        # 尽きると火が消えるので、満タン側がgood。
        gauge: {min: bad, max: good}
        stages:
          - {name: none}
          # 薪が火を育てる。火が消えている炉は、薪を積んでも育たない。
          - name: few
            min: 1
            passives:
              - conditions: [{prop: heat, gt: 0}]
                add: {self: {heat: 2}}
          - name: some
            min: 10
            passives:
              - conditions: [{prop: heat, gt: 0}]
                add: {self: {heat: 6}}
          - name: many
            min: 40
            passives:
              - conditions: [{prop: heat, gt: 0}]
                add: {self: {heat: 16}}
      # 火力。0が消えている状態で、段が加熱の速さ・薪の減り・薪が尽きた後の衰えを決める。
      #
      # **育ちと衰えは同時に効かない。** 育ちは薪がある間（fuelの段）、衰えは薪が尽きている間
      # （fuelがnone）だけで、passivesのaddは登録順に値を書き換えながら適用されるため、同じtickで
      # 正負が混ざると段の境目で打ち消し合って火が育たなくなる。
      heat:
        value: 0
        stages:
          - {name: out}
          # 種火。料理はできない。衰える速さは炉ごとに違うので、各炉のpassivesが持つ。
          #
          # **絵は3つ、段は4つ。** 見た目で知りたいのは「料理に使えるか」と「まだ火が生きているか」の
          # 2つなので、種火だけを分け、coals〜blazeは同じ「ついている」絵を指す。段を割った意味の
          # 粒度と絵を割る粒度は一致させなくてよい（GameElementDefinition.md 6.4節）。
          - name: ember
            min: 1
            art: ember
            passives:
              - add: {self: {fuel: -0.1}}
          - name: coals
            min: 5
            art: lit
            passives:
              # 子へ渡す熱は2つ。料理は進み（cooking_progress、7節）として受け、石は蓄熱
              # （heat_soak、9.1節）として受ける。持たない側では黙って捨てられる。
              - add:
                  self: {fuel: -0.5}
                  child: {cooking_progress: 1, heat_soak: 1}
              - conditions: [{prop: fuel, in_stage: none}]
                add: {self: {heat: -2}}
          - name: flame
            min: 20
            art: lit
            passives:
              - add:
                  self: {fuel: -1.5}
                  child: {cooking_progress: 3, heat_soak: 3}
              - conditions: [{prop: fuel, in_stage: none}]
                add: {self: {heat: -6}}
          - name: blaze
            min: 60
            art: lit
            passives:
              - add:
                  self: {fuel: -4}
                  child: {cooking_progress: 5, heat_soak: 5}
              - conditions: [{prop: fuel, in_stage: none}]
                add: {self: {heat: -6}}
    passives:
      # 燃えている炉が周りへ与える、暖と明かり（docs/engine/FireSystem.md 9.2節）。どちらも親の
      # プロパティをmodifyするだけで、**届き先は置かれた場所だけが決める**——据えた炉の親は土地で、
      # 土地は気温を持つのでその土地だけが暖まり、視界の明るさは持たないので明かりは手元にしか
      # 届かない（docs/engine/IlluminationSystem.md 3節）。炉自身はどこへ効くのかを知らない。
      #
      # どちらも段では見ない。種火も炎も同じ値として扱い、持つのは線を1本跨がせる量だけ——明かりは
      # 暗闇から作業できる明るさへ持ち上げる+11（ContentSkeleton.md 8.1.1.1節）、暖は世界が最も
      # 冷えるとき（涼しい季節-5＋夜-3、core.yaml）をちょうど平年の気温へ戻す+8。
      - conditions: [{prop: heat, gt: 0}]
        modify: {parent: {hand_brightness: 11, looking_brightness: 11, ambient_temperature: 8}}
      # 雨。野ざらしの炉は火力を余分に削られる。守られた場所（sheltered）なら効かない
      # （docs/engine/ContainerSystem.md 6節）。
      - conditions:
          - {subject: ancestor, prop: sheltered, eq: 0}
          - {subject: ancestor, prop: weather, in: [light_rain, heavy_rain, storm]}
        add: {self: {heat: -4}}
    interactions:
      # 薪をくべる。燃料が持つfuelを炉のfuelへ移し、燃料そのものは消す（同2節）。
      # transferの後にdestroyが走るので、移した分が失われることはない。
      #
      # 束ねた薪はまとめてくべられる（allow_multiple、GameElementDefinition.md 12.4節）。何本入るかも、
      # 満杯の炉を拒むことも、fuelのrangeの残りからエンジンが決めるので、ここには書かない。
      add_fuel:
        trigger: {drag: {tag: fuel}, allow_multiple: true}
        duration: 1
        transfer:
          amount: 999
          from: instrument
          from_prop: fuel
          to_prop: fuel
        destroy: instrument
      # 火種を落として着火する。置くのは種火1つぶんだけで、そこから先は薪が育てる。
      ignite:
        trigger: {drag: {object: burning_tinder}}
        conditions:
          - {reason: no_fuel, prop: fuel, gt: 0}
        destroy: instrument
        set: {self: {heat: 1}}

object_defs:
  # きりもみ式の火起こし具。拾った木だけで作れるので、道具も紐も要らない
  # （docs/world/SurvivalItems.md 1.1節）。使っても無くならないのでtoolタグを持つ。
  fire_drill:
    tags: [item, tool]
    props:
      weight: {value: 900}
      volume: {value: 1200}
    recipes:
      # **解放条件を持たない。** これが作れないと火の腕を伸ばす操作（上のlight）に手が届かず、
      # きりもみ式が道具も紐も要求しないことで保証されている立ち上がり
      # （docs/world/SurvivalItems.md 1.1節、docs/engine/SkillSystem.md 3.2節）が崩れる。
      carved:
        steps:
          - requires:
              - {object: twig, count: 1, consume: true}
              - {object: thick_branch, count: 1, consume: true}
            duration: 60

  # 枯れ草。乾いた土地で拾える、道具の要らない唯一の火口。これが無いと火が石器の後ろへ回り、
  # きりもみ式が道具を要求しないことで保証されている火スキルの立ち上がりが崩れる
  # （docs/engine/FireSystem.md 3.2節）。
  dry_grass:
    tags: [item]
    traits: [ignitable]
    props:
      weight: {value: 100}
      # ふわりと束ねた枯れ草。詰めても縮まないので嵩そのままで見る。
      volume: {value: 2000}
      ignition_chance: {value: 60}

  # 火のついた火口。炉へ運ぶためだけに在る（docs/engine/FireSystem.md 3.1節）。
  # 炉に残る種火とは別のもので、こちらは持ち運べる物。
  burning_tinder:
    tags: [item]
    # 個体ごとに残り時間が違うので束ねない。
    stackable: false
    props:
      weight: {value: 50}
      volume: {value: 500}
      # 1tickで燃え尽きる。運べるのは同じ土地の中まで（道は最低15分＝1tick）。
      life:
        value: 1
        range: {min: 0, max: 1}
        passives:
          - add: {self: {life: -1}}
        on_min:
          destroy: self

  # 松明。太い枝の先へ繊維を巻いたもので、**持ち歩ける唯一の明かり**
  # （docs/engine/IlluminationSystem.md 3節）。据えた炉と同じ2行を書き、手に持っている間だけ
  # 視界にも届く——夜の道を歩けるのはこれを持ったときだけになる。
  #
  # 燃料タグは持たない。炉へ重ねるとくべられてしまい、明かりとして持ち出す物ではなくなる。
  torch:
    tags: [item]
    # 燃え残りが個体ごとに違うので束ねない。
    stackable: false
    props:
      weight: {value: 1100}
      volume: {value: 1400}
      # 灯っているか。火種を移すと立ち、燃え尽きると物ごと消えるので0へは戻らない。
      lit:
        value: 0
        range: {min: 0, max: 1}
      # 燃え残り（tick）。灯している間だけ減り、2時間で燃え尽きる。
      life:
        value: 8
        range: {min: 0, max: 8}
        passives:
          - conditions: [{prop: lit, eq: 1}]
            add: {self: {life: -1}}
        on_min:
          destroy: self
    passives:
      - conditions: [{prop: lit, eq: 1}]
        modify: {parent: {hand_brightness: 11, looking_brightness: 11}}
    recipes:
      # 枝へ繊維を巻くだけ。道具も解放条件も要らない。
      wrapped:
        steps:
          - requires:
              - {object: thick_branch, count: 1, consume: true}
              - {object: plant_fiber, count: 1, consume: true}
            duration: 15
    interactions:
      # 火種を移して灯す。炉の着火（hearthのignite）と同じ形で、火種は1tickで燃え尽きるので
      # 火を起こした土地でしか灯せない。
      light:
        trigger: {drag: {object: burning_tinder}}
        duration: 1
        destroy: instrument
        set: {self: {lit: 1}}

  # 焼け石。炉で熱を溜め切った石で、**炉から取り出せる唯一の産物**（docs/engine/FireSystem.md 9.1節）。
  # 石そのものは locations.yaml が定義し、溜め切った瞬間にこの型へ置き換わる。
  #
  # 水を張った器へ落とせば、器に耐火性が無くても湯が沸く。器を持たない段階の煮炊きはこれで成立する
  # （docs/world/SurvivalItems.md 4節）。
  hot_stone:
    tags: [item]
    traits: [heat_soaking]
    props:
      weight: {value: 1000}
      volume: {value: 700}
      heat_soak:
        # 焼き上がった時点で溜め切っている（置き換わりは値を運ばない、
        # docs/engine/FireSystem.md 7.2節）。
        value: 12
        # 残りの熱が湯を沸かせるかを決める（searingの段）ので、バーで見せる。
        gauge: {min: bad, max: good}
        on_min:
          destroy: self
          spawn: {object: stone}
    interactions:
      # 水を張った器へ落として湯を沸かす。溜めた熱は一度に使い切るので、石はその場で冷めて普通の石へ
      # 戻る（heat_soakのon_min）。器の側は何も宣言しない——沸くのに耐火性は要らない。
      boil:
        trigger: {drag: {tag: water}}
        conditions:
          - {reason: not_hot_enough, prop: heat_soak, in_stage: searing}
        duration: 5
        become: {subject: instrument, content: hot_water_liquid}
        set: {self: {heat_soak: 0}}

  # 焚き火。枝を積んだだけの炉。器を載せる枠を持たず、種火は30分で死ぬ。
  campfire:
    traits: [hearth]
    recipes:
      # 小枝を組むだけ。道具も解放条件も要らない。
      stacked:
        steps:
          - requires:
              - {object: twig, count: 3, consume: true}
            duration: 15
    props:
      # 組んだ小枝3本ぶん。据えた炉も、筏に載せれば積荷として効く（ContainerSystem.md 1節）。
      weight: {value: 900}
      fuel:
        value: 0
        range: {min: 0, max: 30}
      # 火力の上限。開いた焚き火はこれ以上大きくならないので、薪を積んでも高温には届かない。
      heat:
        range: {min: 0, max: 30}
      # 石を積んだ数。3つ目を置いた瞬間に三石のかまどへ置き換わる（同5節）。
      stones:
        value: 0
        range: {min: 0, max: 3}
        on_max:
          destroy: self
          spawn: {object: three_stone_hearth}
    slots:
      fire:
        cells:
          - {accept: {tag: roastable}}
          - {accept: {tag: roastable}}
    passives:
      # 種火が冷める速さ。薪が尽きている間だけ効く——薪が載っていれば火は育つ側になる。
      - conditions:
          - {prop: heat, in_stage: ember}
          - {prop: fuel, in_stage: none}
        add: {self: {heat: -2}}
    interactions:
      add_stone:
        trigger: {drag: {object: stone}}
        duration: 5
        destroy: instrument
        add: {self: {stones: 1}}

  # 三石のかまど。石が支点になって、初めて器を火にかけられる。
  three_stone_hearth:
    traits: [hearth]
    props:
      # 焚き火（900）に石3つ（1,000×3）。
      weight: {value: 3900}
      fuel:
        value: 0
        range: {min: 0, max: 30}
      # 火力の上限。開いた焚き火はこれ以上大きくならないので、薪を積んでも高温には届かない。
      heat:
        range: {min: 0, max: 30}
      # 石を8つ足すと石囲いの炉になる。
      stones:
        value: 0
        range: {min: 0, max: 8}
        on_max:
          destroy: self
          spawn: {object: stone_hearth}
    slots:
      fire:
        cells:
          - {accept: {tag: roastable}}
          - {accept: {tag: roastable}}
          - {accept: {tag: cookware}}
    passives:
      - conditions:
          - {prop: heat, in_stage: ember}
          - {prop: fuel, in_stage: none}
        add: {self: {heat: -1}}
    interactions:
      add_stone:
        trigger: {drag: {object: stone}}
        duration: 5
        destroy: instrument
        add: {self: {stones: 1}}

  # 石囲いの炉。料理の最上段。種火が翌朝まで生き、薪を多く積め、火床が広いので器を2つ置ける。
  stone_hearth:
    traits: [hearth]
    props:
      # 三石のかまど（3,900）に石8つ。囲いごと運ぶ物ではないが、重さは名乗る。
      weight: {value: 11900}
      fuel:
        value: 0
        range: {min: 0, max: 120}
      # 石で囲うと高温まで上がる。**ここで土器は焼けない**——内径40〜60cmの囲いに壺を燃料ごと
      # 埋める空間が無く、水を含んだ石は長時間の高温で爆ぜる。焼成は使い捨ての覆い焼き
      # （pottery.yaml）が担うので、この上限が決めるのは料理の速さだけ。
      heat:
        range: {min: 0, max: 100}
    slots:
      fire:
        cells:
          - {accept: {tag: roastable}}
          - {accept: {tag: roastable}}
          - {accept: {tag: roastable}}
          - {accept: {tag: cookware}}
          - {accept: {tag: cookware}}
    passives:
      # 灰をかぶって空気を絞られた種火は8時間もつ。これが炉を常設する唯一にして最大の利得。
      - conditions:
          - {prop: heat, in_stage: ember}
          - {prop: fuel, in_stage: none}
        add: {self: {heat: -0.125}}
