# ヤシの実の加工の連鎖（GameElementDefinition.md 11節・12節参照）。ヤシの木から実を採り、割り、
# 中身を得るまでの一続きを1ファイルにまとめる。
#
# 連鎖は熟度で2本に分かれる。入手経路も採れる物も別で、これは実の生態そのままの分岐。
#
#   - 青い実（green_coconut）: まだ落ちないので、木を登って切り落とすしかない。穴を開ければその場で
#     飲める水が取れる。果肉はゼリー状で水分が主。殻は薄く、器にならない。
#   - 熟した実（coconut）: 熟すと自分から落ちるので、木ではなく土地に落ちている。探索で見つかる
#     （locations.yamlのexplore）。飲める水は残っていない。果肉は脂質が多い。皮は繊維
#     （coconut_husk）に、殻は液体の器（coconut_bowl）になる。
#
# つまり、水が欲しければ登って捻挫の危険を負い、素材と脂質は歩いて探す。
#
# 生の実はどちらも食べられない。食べられるのは連鎖の終端の果肉（coconut_meat・coconut_jelly）だけ。
#
# 塩蔵（salt.yamlのcure軸）を名乗るのは、**殻から出した生の果肉だけ**（coconut_meat・coconut_jelly）。
# 殻に入ったままの実——丸のままも、穴を開けたものも、割った半分も——には付けない。塩が身に届かない。
#
# 熟した実の重さは連鎖を通して差が合う: 1400g = 皮600g + 実800g、実800g = 割れた実300g×2 + 水200g、
# 割れた実300g = 果肉200g + 殻100g。失われるのは割るときにこぼれる水だけで、これは飲用には足りない
# （熟した実の水は果肉に吸われて200mLほどしか残らない）。値を変えるときはこの内訳を崩さないこと。
#
# 液体の入れ物になる殻（coconut_bowl）は液体容器の一員なので、liquid_containers.yamlが持つ。
#
# 今後の課題: 花序を切って樹液（トディ）を採る。1本から1日1L以上採れ、数時間で発酵して酒になり
# 数日で酢になるため、「器を木に括って一晩置く」形の、腐敗に必然性がある再生する液体源になる。

object_defs:
  # ヤシの木。青い実と葉の採取ポイント。探索で見つかる設置物（locations.yamlのexplore）。
  # 木から採れるのは登って採る物だけで、落ちた熟した実は土地の探索が受け持つ。
  palm_tree:
    tags: [fixture]
    props:
      # 立ち木1本ぶん。運ぶ物ではないが、重さを名乗らないと載せた物の重さが消える
      # （ContainerSystem.md 1節）。細長い幹に葉と実を頂部だけに付ける姿ぶん、広葉樹より軽い。
      weight: {value: 200000}
    interactions:
      # 青い実を採る。熟していない実は自分から落ちないので、幹を登って切り落とすしかない。
      # 足場の無い幹を登る以上、たまに踏み外す。失敗した回は何も採れない。
      #
      # 1回登るのに30分かけて1個だけ持って降りることはしないので、成功した回はまとめて採る。
      # 葉より数が少ないのは、水を抱えた青い実が重く、房から外すのに手間がかかるため
      # （採取ポイントの枯渇は今後の課題）。
      pick_green_coconut:
        trigger: menu
        # 頂部の房を見上げて、採れる実を選びながら切り落とす屋外の行動なので、見るのは視界の側
        # （docs/engine/IlluminationSystem.md 5節）。嵐の日は明るさが足りていても採れない
        # （docs/world/ContentSkeleton.md 8.1.4節）。
        conditions:
          - reason: too_dark
            subject: agent
            prop: looking_brightness
            in_stage_or_above: bright
          - reason: too_stormy
            not: {subject: agent, prop: wind_speed, in_stage_or_above: gale}
        duration: 30
        pick:
          - weight: 90
            spawn: {object: green_coconut, count: 2, into: agent}
          - weight: 10
            spawn: {object: sprained_ankle, into: agent}

      # 葉を採る。枯れた葉は落ちる前に幹へ垂れ下がるので、刃物が無くても引き落とせる。
      # 実採りと同じく幹を登るため、同じだけ踏み外す。葉はweaving.yamlが定義する。
      pick_frond:
        trigger: menu
        conditions:
          - reason: too_dark
            subject: agent
            prop: looking_brightness
            in_stage_or_above: bright
          - reason: too_stormy
            not: {subject: agent, prop: wind_speed, in_stage_or_above: gale}
        duration: 30
        pick:
          - weight: 90
            spawn: {object: palm_frond, count: 3, into: agent}
          - weight: 10
            spawn: {object: sprained_ankle, into: agent}

  # 青いヤシの実。皮も殻も柔らかく、中に飲める水を抱えている。皮ごと刃先を通せるので、熟した実の
  # ように皮をはぐ工程を挟まない。
  green_coconut:
    tags: [item, food]
    # 腐敗（foods.yamlのtrait）。**殻に包まれた丸のままの実は保つ**ので、芋と同じ20日。刃を入れた
    # 先（drained_green_coconut以降）は中身が空気に触れるため、野菜の5日へ落ちる。
    traits: [perishable, spoils_slow]
    props:
      weight: {value: 2200}
      # 湿った皮と500mLの水を抱えるので、乾いた熟した実より重く、少し大きい。
      volume: {value: 4900}
    interactions:
      # 穴を開けて、その場で水を飲む。開けた実の水は数時間で発酵するため、汲み置きはできない
      # ——だから水は液体（liquid_containers.yaml）として持たず、飲用をこの操作へ畳んでいる。
      #
      # 満水でも実行できる。飲みきれない分はhydrationのクランプに任せてこぼれる。条件で塞ぐと、
      # 満水の間だけ連鎖が進まなくなる。
      #
      # **明るさの条件は書かない**——柔らかい芽の窪みへ刃先を落として飲むだけで、仕上がる形が無い
      # （docs/engine/IlluminationSystem.md 5節）。
      bore:
        trigger: {drag: {tag: cutting_tool}}
        duration: 15
        add:
          agent:
            satiety: 60
            carbohydrate: 2
            vitamin: 5
            hydration: 20
        destroy: self
        spawn: {object: drained_green_coconut}

  # 水を飲んだ青い実。殻が薄く柔らかいので刃物だけで割れ、割ればゼリー状の果肉がそのまま取れる。
  # 熟した実のように掻き出す工程が要らない代わりに、器になる殻も残らない。
  drained_green_coconut:
    tags: [item]
    traits: [perishable, spoils_normal]
    props:
      weight: {value: 1600}
      # 水が抜けても外寸は変わらない。
      volume: {value: 4900}
    interactions:
      # **明るさの条件は書かない**——割れさえすればゼリーは取れるので、暗くて損なう形が無い
      # （docs/engine/IlluminationSystem.md 5節。husked_coconutのcrack・pry_openも同じ）。
      split:
        trigger: {drag: {tag: cutting_tool}}
        duration: 15
        destroy: self
        spawn: {object: coconut_jelly, count: 2}

  # 青い実のゼリー状の果肉。ほとんどが水分で、熟した果肉ほどのカロリーは無い。
  coconut_jelly:
    tags: [item, food]
    traits: [perishable, spoils_normal, dryable]
    props:
      weight: {value: 150}
      volume: {value: 250}
    variation_axes:
      cure: {of: {tag: cured}}
    interactions:
      eat:
        trigger: menu
        conditions:
          - reason: too_full
            not: {subject: agent, prop: satiety, in_stage_or_above: full}
        duration: 15
        add:
          agent:
            satiety: 150
            carbohydrate: 4
            lipid: 1
            vitamin: 5
            hydration: 5.2
            happiness: 4
        pick:
          - weight: 100
          - weight: {prop: spoilage}
            set: {agent: {satiety: 0}}
            add: {agent: {carbohydrate: -40, protein: -40, lipid: -40}}
          - weight: {prop: spoilage}
            add: {agent: {carbohydrate: -40, protein: -40, lipid: -40, hydration: -48}}
        destroy: self

  # 熟したヤシの実。厚い繊維質の皮に覆われていて、このままでは食べられない。
  # 皮をはぐと、中の実（husked_coconut）と皮（coconut_husk）に分かれる。
  coconut:
    tags: [item]
    traits: [perishable, spoils_slow]
    props:
      weight: {value: 1400}
      volume: {value: 3800}
    interactions:
      # 厚い繊維を刃で起こしては引き剥がす手元の作業（docs/engine/IlluminationSystem.md 5節）。
      # 据え付けの光源も効くので、焚き火のそばなら夜でもはげる。
      husk:
        trigger: {drag: {tag: cutting_tool}}
        conditions:
          - reason: too_dark
            subject: agent
            prop: hand_brightness
            in_stage_or_above: bright
        duration: 30
        destroy: self
        spawn:
          - {object: husked_coconut}
          - {object: coconut_husk}

  # ヤシの実の皮。はぎ取った繊維の塊。ほぐせば火口になり、塊のままなら燃料になる
  # （docs/engine/FireSystem.md 3.2節）。叩き解せばコイア＝植物繊維になる（fiber.yaml）。
  coconut_husk:
    tags: [item]
    traits: [burnable, ignitable]
    props:
      # よく燃える繊維で、火口としては最良の部類。
      ignition_chance: {value: 100}
      # 塊のままくべると、熾火を1時間ほど保てる。
      fuel: {value: 2}
      # 実の各部で一番重いのは皮（丸ごとの4割強）。
      weight: {value: 600}
      # ばらけた繊維は詰めても縮まないので、嵩そのままで見る。
      volume: {value: 4000}
    interactions:
      # 水に漬けて柔らかくし、石で叩いて繊維を解す（コイア）。**植物繊維の2つ目の入口**で、
      # 違うのは道具ではなく採れる土地——バショウ属の草（fiber.yaml）が生えない島でも、ヤシの実さえ
      # あれば繊維へ届く。**刃物の段は飛ばない**（皮を出すのは上のhuskで、そこがcutting_toolを要求する）。
      #
      # 漬けておく時間はこの1工程へ畳んである。掻き取り（30分）より長いのはそのぶん。600gの皮から
      # 繊維2束（120g）で、残りは叩き落とす髄。
      #
      # **明るさの条件は書かない**——叩いて解すだけで、暗くて損なう形が無い（crackと同じ理由）。
      ret:
        trigger: {drag: {object: stone}}
        duration: 120
        # 繊維・編みの腕（docs/engine/SkillSystem.md 3節の実行経路、量の置き方は
        # characters/player_character.yaml）。**掻き取り（fiber.yamlのstrip）と同じだけ配る**
        # ——同じ植物繊維を出す2つの入口で、違うのは採れる土地だけ（上のコメント）。
        add: {agent: {skill_cordage: 2}}
        destroy: self
        spawn: {object: plant_fiber, count: 2}

  # 皮を剥いだ熟したヤシの実。硬い殻は、石で叩いても刃物をこじ入れても割れるので、道具のタグごとに
  # 1つずつcombinationを持つ（withは1つのタグしか取らないため）。
  #
  # 割れた実は2つ生まれるが、同種は1スタックにまとまるため、2つとも元の実が居た場所へ置き換わる。
  husked_coconut:
    tags: [item]
    # 皮は無くなっても硬い殻は閉じたままなので、丸のままの実と同じだけ保つ。
    traits: [perishable, spoils_slow]
    props:
      weight: {value: 800}
      volume: {value: 900}
    interactions:
      # どちらも**明るさの条件を書かない**（drained_green_coconutのsplitと同じ理由）。
      crack:
        trigger: {drag: {object: stone}}
        duration: 15
        destroy: self
        spawn: {object: coconut_half, count: 2}
      pry_open:
        trigger: {drag: {tag: cutting_tool}}
        duration: 15
        destroy: self
        spawn: {object: coconut_half, count: 2}

  # 割れたヤシの実。刃物で果肉を掻き出すと、果肉と器になる殻が残る。
  coconut_half:
    tags: [item]
    traits: [perishable, spoils_normal]
    props:
      weight: {value: 300}
      volume: {value: 900}
    interactions:
      # 殻を割らないよう刃を内側の丸みに沿わせて送る手元の作業（docs/engine/IlluminationSystem.md
      # 5節）。掻き方が雑だと器になる殻を損なう。
      scrape:
        trigger: {drag: {tag: cutting_tool}}
        conditions:
          - reason: too_dark
            subject: agent
            prop: hand_brightness
            in_stage_or_above: bright
        duration: 30
        destroy: self
        spawn:
          - {object: coconut_meat}
          - {object: coconut_bowl}

  # 熟したヤシの果肉。実1個から2個採れる。脂質が多くカロリーは高いが、水分は青い実に及ばない
  # （熟した果肉の水分は半分ほどで、まとまった水が飲めるのは青い実だけ）。
  coconut_meat:
    tags: [item, food]
    traits: [perishable, spoils_normal, dryable]
    props:
      weight: {value: 200}
      volume: {value: 400}
    variation_axes:
      cure: {of: {tag: cured}}
    interactions:
      eat:
        trigger: menu
        conditions:
          - reason: too_full
            not: {subject: agent, prop: satiety, in_stage_or_above: full}
        duration: 15
        add:
          agent:
            satiety: 200
            carbohydrate: 4
            protein: 3
            lipid: 26
            vitamin: 7
            hydration: 6
            happiness: 4
        pick:
          - weight: 100
          - weight: {prop: spoilage}
            set: {agent: {satiety: 0}}
            add: {agent: {carbohydrate: -40, protein: -40, lipid: -40}}
          - weight: {prop: spoilage}
            add: {agent: {carbohydrate: -40, protein: -40, lipid: -40, hydration: -48}}
        destroy: self
