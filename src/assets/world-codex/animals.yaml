# 動物の定義。どんな動物をどの土地にどんな役割で置くかは docs/world/Animals.md、動物と対峙する
# 仕組みは docs/engine/HuntingSystem.md 参照。
#
# 動物はitemタグを持ち、土地のitemsスロットへ普通のカードとして並ぶ（HuntingSystem.md 1.1節）。
# 専用のレーンも専用の画面も持たない。狩猟専用の数値（体力・命中率）も作らず、攻撃は怪我
# （injuries.yaml）を1つ足すことで表す（同3節）。
#
# 死体と、それを解体して得られる素材（同1.5節）も、獲物から続く一続きの連鎖なのでこのファイルが持つ。
#
# 塩蔵（salt.yamlのcure軸）は**生のまま腐る物だけが名乗る**——死体と生肉には付け、焼いた物
# （roasted_meat・roasted_rat）には付けない（foods.yamlと同じ線）。

traits:
  # 獣が共通して持つもの。**体格に依らない値だけ**をここへ置く（VitalsSystem.md 7節）。体格が
  # 決めるもの——weight・volume・blood（maxが体格）・shock（maxが体格）——と、仕留めたときに
  # 何になるかは、動物ごとに宣言する。
  beast:
    # animalは枠の色を決める種別（CardView.md 2節 枠の色は種別で変える）。itemと兼ねるのは、
    # 動物が「持ち運べるか」ではなく「動かせるか」でitemsに並ぶため（HuntingSystem.md 1.1節）。
    #
    # quarryは「狩りの成果として数える物」——生きた獲物と死体の両方が持つ。罠の枠がこれを受け、
    # タイマーのゲートがこれで「何か入っているか」を問う（docs/engine/TrapSystem.md 1.1節）。
    # 掛かった獲物がその場で死んでも、死体は罠の中に残る。
    tags: [item, animal, quarry]
    # 押すと刺さっている怪我が並ぶ（7.8節）。キャラクタの怪我と同じ見え方になる（同3節）。
    # 外から見えるもの（7.11節）。傷は見れば分かるし、くわえている物も見れば分かる。
    visible_slots: [injuries, spoils]
    # 気を失っている間は、絵が倒れた姿へ変わる（consciousnessのunconscious段、CardView.md 5.1節）。
    art_by_stage: consciousness
    # 警戒している間は持ち主を持てない（HuntingSystem.md 4節）。手持ち・かご・台車・罠の枠は
    # 何も知らず、抵抗する側が拒む。読むのは実効値（7.13節）なので、罠に掛かっている間も気を
    # 失っている間も打ち消されて成立しない——**掴めるのは、落ち着いた個体か、動けなくした個体だけ**。
    #
    # **しきい値は動物によらず同じ。** 1手の配分の合計を100に揃えるのと同じ理由で、同じ警戒の値が
    # 動物によって別の意味を持たないようにする。
    resists: [{prop: wariness, gte: 1}]
    slots:
      # 負っている怪我。プレイヤーは出し入れできず、付けるのは攻撃・外すのは怪我自身
      # （characters/player_character.yamlのinjuriesと同じ扱い）。
      injuries:
        cell: {accept: {tag: injury}}
      # 持ち去った物（HuntingSystem.md 5節）。**枠は1つだけ**——口や前肢で運べるのは1つで、
      # 塞がっている間はもう持ち去れない（下のpassivesがsnatchの重みを打ち消す）。
      #
      # 倒せば中身は地面へこぼれる（destroyの規約、9.3節）ので、**追いつけば取り返せる**
      # ——壊されるのと違い、持ち去りだけは取り返しが付く（docs/world/Animals.md 4.1節）。
      spoils:
        cell_count: 1
        cell: {accept: {tag: item}}
        # 入れるのは獣自身（snatch）だけ。**外から見えるが、渡せはしない**（7.7節・7.11節）。
        placement: [auto]
    props:
      # 警戒（HuntingSystem.md 3.1節）。攻撃してくるか逃げるかを乱数の分岐にせず、この1つの
      # 連続量で駆動する。安全域を外れている間はカードの輪郭が明滅する
      # （CardView.md 3節 警戒している動物は輪郭を明滅させる）。
      #
      # **野生の個体は警戒した状態で現れる。** 放っておけば落ち着くが、減り方は自然治癒と同じ
      # 基準レート（-1/tick、docs/engine/InjurySystem.md 2節の値の決め方）なので10時間かかる。
      # 待つより追い払うほうが速い、が値だけで成り立つ。
      wariness:
        value: 40
        range: {min: 0, max: 100}
        stages:
          - {name: calm}
          - {name: wary, min: 20, alert: caution}
          - {name: enraged, min: 70, alert: danger}
        passives:
          - add:
              self:
                wariness: -1
      # 今感じている痛み（VitalsSystem.md 2節）。自分では動かず、刺さっている怪我がmodifyで
      # 押し上げる。段が意識へ寄与する——ただし痛みだけでは気絶させない（最も深い段でもdazedに
      # 留める）。刻みはキャラクタと同じ規約（docs/world/Characters.md 値の刻み方節）。
      #
      # **深手ほど逃げに転じる**（HuntingSystem.md 5.5節）。段が上がるごとに逃走の重みを押し上げる
      # のはここ1箇所で、動物の種類によらない——素の配分がどうであれ、痛めつければ逃げる。
      # 押し上げる量は素の配分（合計100）と同じ目盛りで、最も深い段では他の候補を飲み込む。
      pain:
        value: 0
        range: {min: 0, max: 100}
        stages:
          - {name: painless}
          - name: sore
            min: 25
            alert: watch
            passives:
              - modify: {self: {flee: 25}}
          - name: hurting
            min: 50
            alert: caution
            passives:
              - modify: {self: {consciousness: -20, flee: 60}}
          - name: unbearable
            min: 83
            alert: danger
            passives:
              - modify: {self: {consciousness: -45, flee: 120}}
      # 無防備さ（HuntingSystem.md 1.4節）。仕留めの候補の重みそのもので、自分では動かず、状態が
      # 押し上げる。起きている間も0にはしない——暴れる相手でも、まれに急所へ入る。
      vulnerability: {value: 5}

      # 立ち去りまでの残り（HuntingSystem.md 5.6節）。動物は探索が際限なく湧かせるので、消える口が
      # 無いと島に溜まり続ける。**土地の地面に居て、同じ土地に誰も居ない間だけ**減り、尽きた個体は
      # 世界から消える——人口は湧く速さ×平均寿命で自動的に釣り合う。
      #
      # 同じ土地に人が居る間は止まる（リセットではなく一時停止）ので、**目の前では絶対に消えない**。
      # 罠・入れ物の中でも止まる（in_slot: itemsが「土地の地面に居る」を言う）ので、掛かった獲物は
      # 取りに戻るまで残る。罠のcatch_remainingと同じ見えないタイマー（カードの状態バーは名前で
      # 決まった量だけを映す、CardView.md 8節）。
      #
      # 消えるとき、くわえていた物（spoils）はその土地へこぼれる（destroyの規約、9.3節）。
      # 逃げ込んだ先を突き止めれば、本体が消えた後でも盗品は落ちている。
      stay_remaining:
        value: 96
        # 0に達したところで立ち去る（6.3節のon_min）。
        range: {min: 0, max: 96}
        passives:
          - conditions:
              - {in_slot: items}
              - not: {subject: parent, slot: characters, matches: {tag: character}}
            add:
              self:
                stay_remaining: -1
        on_min:
          destroy: self

      # 1手の重み配分（HuntingSystem.md 5節）。**候補は「その1手が何だったか」の型で、動物ごとに
      # 変わるのはこの配分だけ**——武器が一撃の当たり所の配分だけを宣言するのと同じ形
      # （同1.2節、tools.yamlのweapon trait）。素の配分がその動物の性分で、警戒・傷・その場の状況は
      # 下のpassivesが押し引きする。
      #
      # 配分の合計は動物によらず100に揃える。傷が押し上げる量（painの段）と並ぶ目盛りが動物ごとに
      # 変わると、同じ深手が動物によって別の意味を持ってしまうため。
      #
      # 8つとも値を持たないので、**宣言し忘れた動物はロードで落ちる**（5節）。0も明示して書く——
      # 「この動物はしないこと」は書き忘れと同じ0になるため、並べて読めるようにする。
      lurk: {}
      bite: {}
      gore: {}
      crush: {}
      snatch: {}
      smash: {}
      devour: {}
      flee: {}

      # 意識（VitalsSystem.md 2節）。自分では動かず、痛み・衝撃・失血の段が押し下げる。常にカードに
      # バーが出る（CardView.md 8節のgauge宣言）。unconsciousの段の名前は固定（同6節）。
      consciousness:
        # 尽きると倒れるので、満タン側がgood。
        gauge: {min: bad, max: good}
        value: 100
        range: {min: 0, max: 100}
        stages:
          # 気を失っている間はカードに覆いが出て（CardView.md 9.1節）、絵も倒れた姿へ差し替わる
          # （art_by_stage、beast trait・GameElementDefinition.md 6.4節）。
          #
          # **接尾辞が`carcass`なのは、死体の絵をそのまま借りるため。** 倒れた個体と死にたての死体は
          # 同じ姿なので、絵を1枚に共有する（CardView.md 5.1節）。この型の死体は`<この型>_carcass`と
          # 名付ける規約なので、接尾辞を足した名前がちょうどその絵を指す——規約が崩れると絵は黙って
          # 生きた姿のままになるため、tests/game/objectArt.test.tsで検査する。
          #
          # 警戒はここで打ち消す。気を失った動物は警戒しておらず、放っておいてよい相手なので、
          # 縁の明滅（CardView.md 3節）も止まる。実効値への寄与なので、目覚めれば元の警戒へ戻る。
          - name: unconscious
            alert: danger
            art: carcass
            passives:
              # 気を失った相手は狙って急所を打てる。仕留めの重みが跳ね上がり、警戒は消える。
              - modify: {self: {wariness: -100, vulnerability: 200}}
          - {name: dazed, min: 25, alert: caution}
          - {name: foggy, min: 60, alert: watch}
          - {name: clear, min: 80}

      # 渇き（VitalsSystem.md 7節）。**減るのはcatchの枠に閉じ込められている間だけ**で、野生の個体では
      # 減らない（TrapSystem.md 5.4節）。獣が自分で水を探す仕組みは無いので、無条件に減らせば島中の獣が
      # 3日半で死ぬ——**ゲート1つが「飲めない状況に置いたのは誰か」を言い分ける**。
      #
      # **閉じ込めている側は1行も宣言しない。** 渇くのは獣自身のことなので、宣言は獣の側だけに置く。
      # 枠の名前はくくり罠も檻も家畜の囲いも catch なので、ゲートは罠の型を問わない（同1.2節）。
      #
      # 刻みは人と同じ（docs/world/Characters.md 値の刻み方節）で、体格では変えない（TrapSystem.md 8節）。
      # 尽きたときに名乗る死因も人と同じ dehydrated なので、死に方は増えない（VitalsSystem.md 8節）。
      hydration:
        # **満たされた状態で現れる。** 野生の個体は自分で飲んでいるので、渇きは捕らえた時点から始まる。
        value: 336
        range: {min: 0, max: 336}
        stages:
          - {name: dehydrated, alert: fatal}
          - {name: parched, min: 24, alert: danger}
          - {name: thirsty, min: 96, alert: caution}
          - {name: dryish, min: 192, alert: watch}
          - {name: hydrated, min: 269}
          - {name: full, min: 336}
        # **死体は残らない。** 死体になる唯一の道はblood（動物ごとのon_min）で、渇きで失うのは個体
        # そのもの——掛けたまま忘れれば、生かして獲った意味が消える（TrapSystem.md 5.4節）。
        on_min:
          destroy: {subject: self, reason: dehydrated}
        passives:
          - conditions: [{in_slot: catch}]
            add:
              self:
                hydration: -1
          # 囲いの飲み水から自分で飲む（docs/world/Animals.md 3.1節）。**飲むのは飲む当人**なので、
          # 頭数がそのまま減りの速さになる——飼葉を減らすのが獣自身なのと同じ形。25mLで1 tickぶんという
          # 換算も人が飲むときと同じ（liquid_containers.yamlのdrink）。
          #
          # 罠の枠には飲み水が無いので、掛かったままの獲物は渇いていく——**この輸送が空振りすることが、
          # 檻を家畜の囲いに変える操作そのもの**になる。
          - conditions: [{in_slot: catch}]
            transfer:
              from: parent
              from_prop: drinking_water
              to_prop: hydration
              amount: 25
              to_amount: 1
      # 飢え（同節）。渇きとまったく同じゲートで減り、尽きれば人と同じ starved を名乗る。
      #
      # **獣は太らない**（食べさせる仕組みは飼葉しか無く、飼葉は繁殖を数えるだけ）ので、捕らえた時点が
      # 蓄えの満ちた状態にあたる——人のように段ごとに基礎代謝を変える平衡点（Characters.md）は立たず、
      # 減りは一定。段のしきい値は人と同じ位置（残り1日を割れば starved、残り5日を割れば gaunt）に置く。
      #
      # **67日は罠の時間の桁から外れている**（TrapSystem.md 5.4節）。檻を放置した罰として働くのは渇きの
      # ほうで、飢えをここへ置くのは、血の戻る条件を人と獣へ同じ形で配るため（VitalsSystem.md 3.1節）。
      body_fat:
        value: 6432
        range: {min: 0, max: 6432}
        stages:
          - {name: starved, alert: fatal}
          - {name: gaunt, min: 96}
          - {name: nourished, min: 480}
        on_min:
          destroy: {subject: self, reason: starved}
        passives:
          - conditions: [{in_slot: catch}]
            add:
              self:
                body_fat: -1
      # 全身の菌（docs/engine/DigestionSystem.md 6節）。**人とまったく同じ物差し**（log₁₀ CFU）で、
      # 増える速さも段の境目も同じ——同じ菌が獣では別の意味を持つ、ということにしない。
      #
      # 削る先も人と同じ水と血で、死に方は増えない（VitalsSystem.md 8節）。**カードに出すバーは
      # 意識1本のまま**（同9節）なので、gaugeは宣言しない。
      #
      # **熱のぶんの水は、渇きと同じゲートの中でしか削らない**（上のhydration）。野生の個体は自分で
      # 飲んでいて水分が動かないので、ゲートの外から削ると「飲めない状況に置いたのは誰か」の言い分けが
      # 崩れ、島中の獣が熱で渇いていくことになる。**血のほうは無条件**——こちらは野生でも失われる。
      pathogen:
        value: 0
        range: {min: 0, max: 9}
        stages:
          - {name: sterile}
          - {name: latent, min: 0.1}
          - name: feverish
            min: 5
            alert: caution
            passives:
              - conditions: [{in_slot: catch}]
                add: {self: {hydration: -1}}
          - name: septicemic
            min: 7
            alert: danger
            passives:
              - conditions: [{in_slot: catch}]
                add: {self: {hydration: -2}}
              - add: {self: {blood: -40}}
        passives:
          # **免疫は上げない**——下のimmunityが動かないので、獣には獲得免疫が無い。
          - conditions: [{not: {prop: pathogen, in_stage: sterile}}]
            add: {self: {pathogen: 0.15}}
      # 免疫（同6節）。**獣では固定値**で、生活では上下しない——ビタミンも睡眠も幸福度も獣は持たず、
      # 持たせる当てもないため。動かないので段は1つで足り、人の健康時と同じ高さ（robust、除去0.2が
      # 増殖0.15を上回る）に置く。
      #
      # **野生の獣の免疫が実際どの程度かは分からない**ので、これは仮決め。人と同じ高さにするのは、
      # 自分では手当てのできない獣が、負った傷から菌を回されて自壊しない最低条件がこれだから。
      #
      # **rangeは人と同じ**——値は動かないが、60が何の目盛りの60なのかは物差しが決めるので、獣だけ
      # 底も天井も無いことにはしない。
      immunity:
        value: 60
        range: {min: 20, max: 100}
        stages:
          - name: robust
            passives:
              - add: {self: {pathogen: -0.2}}
    # 1手の重み配分（上のprops）を、その場の状況で押し引きする（HuntingSystem.md 5.5節）。
    #
    # **打ち消しは重みが0でクランプされること（10節）を使う。** 素の配分より桁の大きい負の寄与を
    # 当てれば、その候補は抽選から丸ごと外れる——「できないことは起こらない」を、候補ごとの
    # conditionsではなく重み1つで表せる。動物ごとに書く必要も無い。
    passives:
      # 落ち着いている相手には手を出さず、逃げもしない。**警戒しているかどうかで1手の顔ぶれが
      # 変わる**のがこの2つで、落ち着いていれば足元の物へ手を出すか、様子をうかがうかだけになる。
      - conditions: [{prop: wariness, in_stage: calm}]
        modify: {self: {bite: -1000, gore: -1000, crush: -1000, flee: -1000}}
      # 荒ぶっている間は物どころではない。逃げるか、向かってくるかの二択になる。
      - conditions: [{prop: wariness, in_stage: enraged}]
        modify: {self: {snatch: -1000, smash: -1000}}
      # 既に1つくわえていれば、次は持てない（spoilsは1枠）。
      - conditions: [{slot: spoils, matches: {tag: item}}]
        modify: {self: {snatch: -1000}}
    interactions:
      # 動物の1手（HuntingSystem.md 5節）。**プレイヤーが押すものではない**ので画面のボタンには
      # 出さず（trigger: tick、11.1節）、tickの後処理が1手ずつ与える（WorldObject.runTickActions）。
      # 15分の行動は1手、90分の行動は6手ぶんの時間になる（同2節）。
      #
      # どの回もsignal（9.8節）で結果を告げる。刺さった傷は相手の怪我スロットの中に入り、持ち去りは
      # 自分の中へ入るので、**レーンの上では何も変わらない回がある**——告げなければ「何も起きなかった」
      # ように見える。様子をうかがった回だけは、実際に何も起きていないので告げない。
      turn:
        trigger: tick
        pick:
          # 様子をうかがった回。**必ず先頭に置く**——他の候補がすべて抽選から外れた回に選ばれるのが
          # これになる（全候補の重みが0なら先頭が選ばれる、10節）。逃走や攻撃を先頭に置くと、
          # 逃げ道も相手も無い土地でそれが起きてしまう。
          - weight: {prop: lurk}
          # 噛みついた回。小さい獣が持てる唯一の攻め手で、浅いが血は流れる。
          # 相手は同じ土地に居る人（10.3節のamong）。誰も居なければこの候補は抽選に出ない。
          - weight: {prop: bite}
            among: {subject: parent, slot: characters, matches: {tag: character}}
            spawn: {object: bite_wound, into: picked}
            signal: bit
          # 牙を突き上げた回。大型だけが持つ一撃で、深く刺さって血が速く流れる。
          - weight: {prop: gore}
            among: {subject: parent, slot: characters, matches: {tag: character}}
            spawn: {object: gore_wound, into: picked}
            signal: gored
          # 圧し掛かった回。**骨折（injuries.yamlのfracture）を残すのはこの候補だけ**で、重みを
          # 立てるのは大型の獣だけなので、小型では候補ごと抽選に出ない——「重い獣に踏まれたときだけ
          # 折れる」を、傷の側に「大型からしか出ない」と書かずに表せる（HuntingSystem.md 5節）。
          #
          # 血は流れず、代わりに相手の荷重が押し上がる（injuries.yamlのfracture）。突かれた相手が
          # その場を離れても倒れるのに対し、こちらは**離れられても、しばらく何も運べない**。
          - weight: {prop: crush}
            among: {subject: parent, slot: characters, matches: {tag: character}}
            spawn: {object: fracture, into: picked}
            signal: crushed
          # 足元の物をくわえた回。倒せば地面へこぼれる（9.3節）ので、追えば取り返せる。
          # **かさが大きい物ほど狙われる**——地面に大きな物を広げていると危ない（5.4節）。
          # 獲物（quarry）は持ち去るものではないので外す（動物と死体、そして自分自身）。
          - weight: {prop: snatch}
            among:
              subject: parent
              slot: items
              matches: {not: {tag: quarry}}
              weight: {subject: picked, prop: volume}
            move: {subject: picked, to: self}
            signal: snatched
          # ぶつかって壊した回。中身は地面に散らばる（同）ので、壊された籠の中の物は残る。
          # **壊れうると著者が明示した物だけ**を候補にする（5.4節）——durabilityを持つ物すべてに
          # すると、置いておいた道具まで一撃で消える。
          - weight: {prop: smash}
            among:
              subject: parent
              slot: items
              matches: {tag: fragile}
              weight: {subject: picked, prop: volume}
            destroy: picked
            signal: smashed
          # くわえていた食べ物を食べてしまった回。取り返しの道はここで断たれる。
          # **食べ物でない物は食べない**——盗まれた道具は立ち去り（stay_remaining）まで
          # くわえたまま残り、取り返しが付く（HuntingSystem.md 5.6節）。
          - weight: {prop: devour}
            among: {slot: spoils, matches: {tag: food}}
            destroy: picked
            signal: devoured
          # 隣の土地へ逃げた回。くわえている物も一緒に運ばれる（中身は親に付いて動く）。
          # 発見済みの道1本につき1つで、どれも同じ確からしさ——気まぐれに選ぶので近い遠いを見ない。
          # 1本も無ければ候補が空になり、逃走が抽選から外れる（追い詰められた獣は逃げずに襲う、5.3節）。
          - weight: {prop: flee}
            among: {subject: parent, slot: fixtures, matches: {tag: path}}
            move: {subject: self, to: {subject: picked, prop: destination_id}}
            signal: fled
      # 武器を重ねて殴る（HuntingSystem.md 1.2節）。**候補は「一撃がどう入ったか」の型**で、どれを
      # 引くかは武器が宣言する重み配分（tools.yamlのweapon trait）が決める。動物の側は体格
      # （shockのmax）だけを持ち、どんな武器が在るかを知らない——武器を足してもここは1行も変わらない。
      #
      # **衝撃の量は候補が持つ。** 武器から読むことはできない（addの値はリテラルだけ、9.2節）ので、
      # 与える量の刻みがそのまま候補の数になる。どの体格が何撃で沈むかはHuntingSystem.md 1.2節。
      #
      # 警戒の上がりと刃の摩耗は当たり外れによらず起きるが、pickとaddを併記できないため
      # 各候補へ複製している（issue #415。動詞を順に並べられるようになったら1箇所へ寄せる）。
      #
      # どの回もsignal（9.8節）で結果を告げる。当たった回の傷は押して開くinjuriesスロットへ入り、
      # 外した回は世界の形が何も変わらないため、どちらもレーンの上では見分けが付かない。
      #
      # **打撲の成分はshockが持ち、怪我としては表さない。** 一撃で「裂傷」と「打撲」の2枚を刺すと
      # 怪我スロットが溢れる。裂けた皮膚が傷（injuries.yaml）、殴られた揺れがshock、という分け方で足りる。
      #
      # **明るさの条件は書かない**（docs/engine/IlluminationSystem.md 5節）。相手は既に目の前に居て
      # 探す作業が無く、当たり外れは上の重み配分が表している。塞ぐと、夜に襲われた側が手を出せない。
      strike:
        trigger: {drag: {tag: weapon}}
        duration: 15
        # 狩猟の腕（docs/engine/SkillSystem.md 3節の実行経路、量の置き方は
        # characters/player_character.yaml）。**pickの外に置く**ので、外した回も同じだけ伸びる
        # ——腕が上がるのは獲物が獲れたからではなく、その場に立って手を出したからなので。
        add: {agent: {skill_hunting: 2}}
        pick:
          # 打ち砕いた回。柄の遠心力が乗る武器（石斧）だけが引く。当たれば中型はその場で崩れ落ちる
          # （VitalsSystem.md 5節 決着は死ではなく気絶で付く）。
          - weight: {subject: instrument, prop: heavy_blow}
            add:
              self: {wariness: 25, shock: 250}
              instrument: {durability: -20}
            spawn: {object: laceration, into: self}
            signal: hit
          # 浅く当たった回。皮は裂けるが、体格の大きい相手はほとんど揺れない。
          - weight: {subject: instrument, prop: light_blow}
            add:
              self: {wariness: 25, shock: 30}
              instrument: {durability: -20}
            spawn: {object: laceration, into: self}
            signal: grazed
          # 突き通した回。衝撃はほとんど生まれず、代わりに深く刺さった傷が血を速く流す
          # （injuries.yamlのpuncture_wound）。その場では倒れないが、放っておけば失血で倒れる。
          - weight: {subject: instrument, prop: thrust}
            add:
              self: {wariness: 25, shock: 30}
              instrument: {durability: -20}
            spawn: {object: puncture_wound, into: self}
            signal: pierced
          # 外した回。傷は付かないが、殴られたこと自体で警戒は上がる。
          - weight: {subject: instrument, prop: whiff}
            add:
              self: {wariness: 25}
              instrument: {durability: -20}
            signal: missed
          # 仕留めた回（HuntingSystem.md 1.4節）。急所——首・後頭部——へ入れば、傷が残る間もなく
          # 死ぬ。**怪我としては表さない**（手当てできず、残らないものだから。InjurySystem.md 4節）。
          # 重みは無防備さそのものなので、気を失っている相手ではここが最も太くなる。
          #
          # **仕留めは血を空にすることで表す。** 死体へ置き換えるのはbloodのon_min（動物ごとの
          # 宣言）で、**死体の名前を知っているのは動物だけ**になる——この候補は獲物の種類を知らない。
          # 頸を落とすとは実際に血を失わせることなので、失血死と別の道を用意する必要も無い。
          - weight: {prop: vulnerability}
            add:
              instrument: {durability: -20}
            set:
              self: {blood: 0}
            signal: killed

object_defs:
  # サル。物を持ち去る中型（Animals.md 4.1節）。危険は低いが、放っておくと足元の物を持っていく。
  monkey:
    traits: [beast]
    props:
      weight: {value: 5000}
      volume: {value: 12000}
      # 1手の配分（合計100、beast trait）。**持ち去りと盗み食いを持つ唯一の動物**で、警戒して
      # いなくても足元の物へ手を出し、くわえた食べ物はやがて食べてしまう。噛むのは追い詰められた
      # ときの手で、太くはない。
      lurk: {value: 20}
      bite: {value: 15}
      gore: {value: 0}
      crush: {value: 0}
      snatch: {value: 35}
      smash: {value: 0}
      devour: {value: 10}
      flee: {value: 20}
      # 殴られた衝撃（VitalsSystem.md 2.1節）。攻撃がaddで即座に上げ、自分で引いていく。
      # **maxが体格**（体重の1/50）で、5kgのサルは浅い一撃（30）3つで気を失う。
      #
      # 引く速さも体格に比例する（max ÷ 25 ＝ 満タンから6時間で引き切る）。比例させないと、
      # 大きい相手ほど殴った端から溜まっていき、弱い武器でも殴り続ければ倒せることになる。
      shock:
        value: 0
        range: {min: 0, max: 100}
        stages:
          - {name: steady}
          - name: rattled
            min: 30
            passives:
              - modify: {self: {consciousness: -30}}
          - name: reeling
            min: 70
            passives:
              - modify: {self: {consciousness: -80}}
        passives:
          - add:
              self:
                shock: -4
      # 体に残っている血（VitalsSystem.md 3節）。**maxが体格**で、5kgのサルは体重のおよそ1/13＝
      # 400mL——ヒトの1/12しかないので、同じ傷でもよく効く。段のしきい値は失った割合（出血性
      # ショックの分類）から引くので、ヒトの5,000mLと同じ比率になる。
      #
      # 戻る速さも体格に比例する（ヒトの+2/tickに対し400/5000で+0.16）。
      blood:
        value: 400
        range: {min: 0, max: 400}
        stages:
          # 助からない域。ここまで失えば意識は無い——最も深い段が最も強く奪う。
          - name: exsanguinated
            alert: fatal
            passives:
              - modify: {self: {consciousness: -100}}
          - name: hemorrhaging
            min: 160
            alert: danger
            passives:
              - modify: {self: {consciousness: -70}}
          - name: bled
            min: 240
            alert: caution
            passives:
              - modify: {self: {consciousness: -30}}
          - {name: low, min: 280, alert: watch}
          - {name: replete, min: 320}
        # 血が尽きれば、自分が居た枠がそのまま死体に変わる（destroyをspawnより先に書く、9.4節）。
        # **この型が死体になる唯一の道**で、仕留めの一撃（beast traitのstrike）も、逃げられた個体が
        # 後で倒れる道も、どちらもここへ合流する——だから死体の名前はここにしか書かれていない。
        on_min:
          destroy: self
          spawn: {object: monkey_carcass}
        passives:
          # **戻るのは水分と体脂肪がともに安全域にある間だけ**（VitalsSystem.md 3.1節）。判定は段の
          # 名前で行い、**閾値を条件の側へ書き写さない**——域（alert）そのものを条件から読む術が無いので、
          # 安全域の下端の段を名指す。人の側もまったく同じ形（characters/player_character.yaml）で、
          # ここが「渇きと飢えを人と獣の両方が持つ」ことの見返りにあたる。
          #
          # **野生の個体では水分も体脂肪も減らない**（beast trait）ので、条件は常に満たされる
          # ——手負いのまま逃げた個体は、追いつけなければ癒えてしまう。効くのは閉じ込めた獣にだけ。
          - conditions:
              - {prop: hydration, in_stage_or_above: hydrated}
              - {prop: body_fat, in_stage_or_above: gaunt}
            add:
              self:
                blood: 0.16

  # サルの死体。仕留めた個体が、その枠のまま置き換わる（destroyをspawnより先に書く、9.4節）。
  # 刺さっていた傷は持ち主から離れられないので道連れに消え、当てていた治療具だけが地面へ落ちる。
  #
  # 腐敗（foods.yamlのtrait）は生肉と同じ速さで、放っておけば解体する前に消える。**死体も肉も
  # 同じ2.5日**なので、解体を急ぐ理由は「腐る前に」ではなく「軽くして運ぶために」のまま
  # （HuntingSystem.md 1.5節）。他の獣の死体も同じ（rat_carcassまで）。
  monkey_carcass:
    tags: [item, quarry]
    traits: [perishable, spoils_fast, dryable]
    props:
      weight: {value: 5000}
      volume: {value: 12000}
    # 塩漬けにできる（salt.yaml）。**解体して出る生肉は漬かっていない**——spawnは新しい個体を
    # 作るので、塩は掛けた個体にしか残らない。丸のまま漬けるのは、解体する時間を後へ回すため
    # （他の獣の死体も同じ）。
    variation_axes:
      cure: {of: {tag: cured}}
    interactions:
      # 刃物を重ねて解体する（HuntingSystem.md 1.5節）。
      #
      # 5000gの内訳: 生肉500g×4 + 獣骨500g + 生皮600g = 3100g。残る1900gは血と内臓・頭で、
      # 使い道が無いのでカードにしない。値を変えるときはこの内訳を崩さないこと。
      #
      # 皮を破らず剥ぎ、関節を探って刃を入れる手元の作業なので、明るさの条件が要る
      # （docs/engine/IlluminationSystem.md 5節。他の獣の死体も同じ）。据え付けの光源も効くので、
      # 焚き火のそばなら夜でも捌ける。
      butcher:
        trigger: {drag: {tag: cutting_tool}}
        conditions:
          - reason: too_dark
            subject: agent
            prop: hand_brightness
            in_stage_or_above: bright
        duration: 60
        # 皮革の腕（docs/engine/SkillSystem.md 3節の実行経路、量の置き方は
        # characters/player_character.yaml）。**皮を剥ぐ手つきがなめしへ移る**（Skills.md 2節の
        # 皮革の最初の一歩）ので、獣の大小によらずどの解体も同じだけ伸ばす。
        add: {agent: {skill_leatherwork: 2}}
        destroy: self
        spawn:
          - {object: raw_meat, count: 4}
          - {object: animal_bone}
          - {object: rawhide}

  # ヤケイ。くくり罠で捕れる中型（Animals.md 3節）。危険が低く、飼いならしの学習台になる。
  # 草の実をついばむので、罠では草食の卓に載る（TrapSystem.md 4節）。
  junglefowl:
    traits: [beast]
    props:
      weight: {value: 1000}
      volume: {value: 2400}
      # 1手の配分（合計100、beast trait）。**攻め手を1つも持たない**——警戒すれば藪へ走るだけで、
      # 物にも手を出さない。危険が低いことが、飼いならしの学習台という役割そのものになっている
      # （docs/world/Animals.md 3節）。
      lurk: {value: 30}
      bite: {value: 0}
      gore: {value: 0}
      crush: {value: 0}
      snatch: {value: 0}
      smash: {value: 0}
      devour: {value: 0}
      flee: {value: 70}
      # maxが体格（サル5kgの100に対して1kg）。どんな武器でも一撃で気を失う大きさで、引く速さも
      # 体格に比例する（max ÷ 25、サルの-4に対して-0.8）。
      shock:
        value: 0
        range: {min: 0, max: 20}
        stages:
          - {name: steady}
          - name: rattled
            min: 6
            passives:
              - modify: {self: {consciousness: -30}}
          - name: reeling
            min: 14
            passives:
              - modify: {self: {consciousness: -80}}
        passives:
          - add:
              self:
                shock: -0.8
      # maxが体格（体重のおよそ1/13＝80mL）。段のしきい値も戻る速さも、サルと同じ割合で刻む。
      #
      # **くくり罠の傷（injuries.yamlのsnare_laceration）が奪うのは30〜60mL**なので血は尽きないが、
      # 最も深く掛かると残り20mLで、下のexsanguinated（32mL未満）に入る（TrapSystem.md 5.1節）。
      blood:
        value: 80
        range: {min: 0, max: 80}
        stages:
          - name: exsanguinated
            alert: fatal
            passives:
              - modify: {self: {consciousness: -100}}
          - name: hemorrhaging
            min: 32
            alert: danger
            passives:
              - modify: {self: {consciousness: -70}}
          - name: bled
            min: 48
            alert: caution
            passives:
              - modify: {self: {consciousness: -30}}
          - {name: low, min: 56, alert: watch}
          - {name: replete, min: 64}
        on_min:
          destroy: self
          spawn: {object: junglefowl_carcass}
        passives:
          # 戻る条件もサルと同じ形（VitalsSystem.md 3.1節）。**囲いで水を切らせば、増えないだけでなく
          # 負った傷も癒えなくなる**——飲み水はこの獣の繁殖と回復の両方を止める。
          - conditions:
              - {prop: hydration, in_stage_or_above: hydrated}
              - {prop: body_fat, in_stage_or_above: gaunt}
            add:
              self:
                blood: 0.032
      # 囲いの中で1羽増えるまでの残り（docs/world/Animals.md 3.1節）。**増えるのは獣自身の仕事**なので、
      # 囲い（farming.yamlのpen）はこれを知らない——家畜になる獣を足しても、囲いの側は
      # 1行も変わらない。
      #
      # 罠のcatch_remaining（TrapSystem.md 2節）と同じ見えないタイマーで、初期値の幅は待ち時間では
      # なく**位相**（同2.1節）。同じ日に入れた群れが同じtickに一斉に増えるのを防ぐためだけのもの。
      breeding_remaining:
        value: {min: 1, max: 480}
        range: {min: 0, max: 480}
        passives:
          - conditions:
              # 囲いの枠に居る間だけ（farming.yaml）。地面に立っている個体は増えない——罠が地面の
              # itemsスロットだけで作動するのと同じ形（TrapSystem.md 1節）。
              #
              # **枠の名前は罠と同じcatch**（同5.4節）なので、くくり罠に掛かった個体もここを通る。
              # 増えないのは飼葉のほうが止めている——罠は飼葉を持たない。
              - {in_slot: catch}
              # 飼葉が残っている間だけ。
              - {subject: parent, prop: fodder, gte: 1}
            add:
              self:
                breeding_remaining: -1
              # **食べるのは食べる当人。** 囲いは中身を数えられない（条件は存在判定だけ、14.3節）ので、
              # 頭数が飼葉の減りに効くのはこの1行が獣の側にあるからで、4羽居れば4倍の速さで尽きる。
              parent:
                fodder: -0.05
        on_min:
          add: {self: {breeding_remaining: 480}}
          # **仔ではなく成体が1羽増える。** 幼体の型を作ると、解体・警戒・resistsがすべて二重になる
          # （罠が獲物の型を差し替えないのと同じ理由、TrapSystem.md 5.3節）。
          #
          # intoを省くと自分と同じ枠＝囲いの中へ（9.4節のsame_slot）。枠が埋まっていれば土地へ
          # こぼれるので、**囲いが手狭になると仔は外に出る**。
          spawn: {object: junglefowl}

  # ネズミ。罠の最小単位（Animals.md 3節）。何でも齧るので、罠では草食・肉食どちらの卓にも載る
  # （TrapSystem.md 4.1節の雑食）。血が6mLしかないので、罠に掛かればまず死ぬ。
  rat:
    traits: [beast]
    props:
      weight: {value: 80}
      volume: {value: 200}
      # 1手の配分（合計100、beast trait）。**逃げ足が配分のほとんどを占める**——警戒した瞬間に
      # 物陰へ走るので、追い払うのは易しく捕まえるのは難しい。噛むのは逃げ道が無いときだけで、
      # そのときは逃走の重みが抽選から外れるぶん相対的に太くなる（5.3節）。
      lurk: {value: 15}
      bite: {value: 5}
      gore: {value: 0}
      crush: {value: 0}
      snatch: {value: 0}
      smash: {value: 0}
      devour: {value: 0}
      flee: {value: 80}
      # maxが体格（体重の1/50）。引く速さも体格に比例する（max ÷ 25）。
      shock:
        value: 0
        range: {min: 0, max: 2}
        stages:
          - {name: steady}
          - name: rattled
            min: 0.6
            passives:
              - modify: {self: {consciousness: -30}}
          - name: reeling
            min: 1.4
            passives:
              - modify: {self: {consciousness: -80}}
        passives:
          - add:
              self:
                shock: -0.08
      blood:
        value: 6
        range: {min: 0, max: 6}
        stages:
          - name: exsanguinated
            alert: fatal
            passives:
              - modify: {self: {consciousness: -100}}
          - name: hemorrhaging
            min: 2.4
            alert: danger
            passives:
              - modify: {self: {consciousness: -70}}
          - name: bled
            min: 3.6
            alert: caution
            passives:
              - modify: {self: {consciousness: -30}}
          - {name: low, min: 4.2, alert: watch}
          - {name: replete, min: 4.8}
        on_min:
          destroy: self
          spawn: {object: rat_carcass}
        passives:
          # 戻る条件もサルと同じ形（VitalsSystem.md 3.1節）。
          - conditions:
              - {prop: hydration, in_stage_or_above: hydrated}
              - {prop: body_fat, in_stage_or_above: gaunt}
            add:
              self:
                blood: 0.0024

  # イノシシ。狩猟システムの基準個体（Animals.md 5節）。60kgの大型で、**上位の武器でなければ
  # 手が出ない**——石斧なら4撃で沈み、槍なら4突きで血を失って倒れるが、尖った石では衝撃が
  # 溜まる前に引いてしまう（下のshock）。
  #
  wild_boar:
    traits: [beast]
    props:
      weight: {value: 60000}
      # 通れなくなる線（too_heavyの下限。担ぎ手ごとに22.5〜30kg）を大きく越えるので、倒しても丸ごとは
      # 運べない（Animals.md 5節）。
      volume: {value: 144000}
      # 1手の配分（合計100、beast trait）。**牙が配分の中で最も太い唯一の動物**で、警戒した時点から
      # 向かってくる。落ち着いている間は藪を割って進むついでに足元の物を壊すだけだが、警戒させれば
      # そのぶんが攻めへ回る（荒ぶれば体当たりの候補が抽選から外れる）。
      #
      # **圧し掛かりの重みを立てる唯一の動物**（HuntingSystem.md 5節）。牙の40から10を振り替えた
      # ——合計を100に揃えるためで、牙が減ったぶんだけ結末が重くなる（骨折は治るまで14日）。
      lurk: {value: 15}
      bite: {value: 0}
      gore: {value: 30}
      crush: {value: 10}
      snatch: {value: 0}
      smash: {value: 25}
      devour: {value: 0}
      flee: {value: 20}
      # maxが体格（体重の1/50）。**サルの12倍**なので、打ち砕く一撃（250）でも4撃を要する。
      # 引く速さも体格に比例する（max ÷ 25）ため、浅い一撃（30）は溜まる前に引いてしまう。
      shock:
        value: 0
        range: {min: 0, max: 1200}
        stages:
          - {name: steady}
          - name: rattled
            min: 360
            passives:
              - modify: {self: {consciousness: -30}}
          - name: reeling
            min: 840
            passives:
              - modify: {self: {consciousness: -80}}
        passives:
          - add:
              self:
                shock: -48
      # maxが体格（体重のおよそ1/13＝4,600mL）。ヒトに近い量なので、**裂傷1つ（60mL）は
      # ほとんど響かない**——刺し傷（1,000mL、injuries.yamlのpuncture_wound）だけが釣り合う。
      # 段のしきい値も戻る速さも、サルと同じ割合で刻む。
      blood:
        value: 4600
        range: {min: 0, max: 4600}
        stages:
          - name: exsanguinated
            alert: fatal
            passives:
              - modify: {self: {consciousness: -100}}
          - name: hemorrhaging
            min: 1840
            alert: danger
            passives:
              - modify: {self: {consciousness: -70}}
          - name: bled
            min: 2760
            alert: caution
            passives:
              - modify: {self: {consciousness: -30}}
          - {name: low, min: 3220, alert: watch}
          - {name: replete, min: 3680}
        on_min:
          destroy: self
          spawn: {object: wild_boar_carcass}
        passives:
          # 戻る条件もサルと同じ形（VitalsSystem.md 3.1節）。
          - conditions:
              - {prop: hydration, in_stage_or_above: hydrated}
              - {prop: body_fat, in_stage_or_above: gaunt}
            add:
              self:
                blood: 1.84

  # イノシシの死体。60,000gの内訳: 生肉500g×40 + 獣骨500g×6 + 生皮600g×6 = 26,600g。残る33,400gは
  # 血と内臓・頭・骨の大半で、使い道が無いのでカードにしない（monkey_carcassと同じ規約）。
  #
  # **獲物の大きさは個数が表す**（HuntingSystem.md 1.5節）ので、サルと同じ物が12倍の数だけ出る。
  # 取り分は合わせて26.6kgあり、通れなくなる線（too_heavyの下限。担ぎ手ごとに22.5〜30kg）を越える側は
  # 一度に持ち帰れない。肉だけの20kgなら4人とも運べるが、全員heavyの段に入る。
  wild_boar_carcass:
    tags: [item, quarry]
    traits: [perishable, spoils_fast, dryable]
    props:
      weight: {value: 60000}
      volume: {value: 144000}
    variation_axes:
      cure: {of: {tag: cured}}
    interactions:
      # 大きいぶん時間がかかるが、1kgあたりで見ればサル（60分/5kg）より速い——同じ手数で
      # 大きく取れるため。
      butcher:
        trigger: {drag: {tag: cutting_tool}}
        conditions:
          - reason: too_dark
            subject: agent
            prop: hand_brightness
            in_stage_or_above: bright
        duration: 240
        add: {agent: {skill_leatherwork: 2}}
        destroy: self
        spawn:
          - {object: raw_meat, count: 40}
          - {object: animal_bone, count: 6}
          - {object: rawhide, count: 6}

  # ヤケイの死体。1000gの内訳: 生肉500g + 羽40g + 小さな骨10g = 550g。残る450gは残りの骨と内臓・血で、
  # 使い道が無いのでカードにしない。値を変えるときはこの内訳を崩さないこと（monkey_carcassと同じ規約）。
  #
  # **鶏肉も獣肉も同じ生肉になる**（HuntingSystem.md 1.5節）。栄養と味の違いが実際に効くように
  # なるまでは、獲物の種類で肉を分けない——分けると、それを使う側（料理）が獲物の数だけ分岐する。
  junglefowl_carcass:
    tags: [item, quarry]
    traits: [perishable, spoils_fast, dryable]
    props:
      weight: {value: 1000}
      volume: {value: 2400}
    variation_axes:
      cure: {of: {tag: cured}}
    interactions:
      butcher:
        trigger: {drag: {tag: cutting_tool}}
        conditions:
          - reason: too_dark
            subject: agent
            prop: hand_brightness
            in_stage_or_above: bright
        duration: 20
        add: {agent: {skill_leatherwork: 2}}
        destroy: self
        spawn:
          - {object: raw_meat}
          - {object: feather}
          - {object: small_bone}

  # ネズミの死体。**解体しない**——80gの体から肉の塊は取れないので、丸ごと火にかけて、骨から
  # こそぎ落とすように食べる（roasted_rat）。
  #
  # 小さすぎる肉を1枚のカードにすると、料理で生肉と競合する。同じ「肉」でありながら大きさが違うと、
  # レシピは「どちらでもよい」と書けない（HuntingSystem.md 1.5節が獲物の大きさを個数で表すのと同じ理由で、
  # 刻みを増やさない）。
  rat_carcass:
    tags: [item, quarry, roastable]
    traits: [perishable, spoils_fast, dryable]
    props:
      weight: {value: 80}
      volume: {value: 200}
      # 小さいので早く焼ける。炎（3/tick）なら3tick＝45分。
      cooking_progress:
        value: 0
        range: {min: 0, max: 6}
        on_max:
          destroy: self
          spawn: {object: roasted_rat}
    variation_axes:
      cure: {of: {tag: cured}}

  # 丸焼きのネズミ。食べると小さな骨が残る（骨針の材料、docs/world/SurvivalItems.md 1.2節の
  # 繊維 → 罠 → 小動物 → 小骨 → 骨針）。**罠だけを起点に、刃物を1つも経由せず縫製へ届く。**
  roasted_rat:
    tags: [item, food, roastable]
    traits: [perishable, spoils_fast]
    props:
      weight: {value: 60}
      volume: {value: 160}
      cooking_progress:
        value: 0
        range: {min: 0, max: 4}
        on_max:
          destroy: self
          spawn: {object: charred_lump}
    interactions:
      eat:
        trigger: menu
        conditions:
          - reason: too_full
            not: {subject: agent, prop: satiety, in_stage_or_above: full}
        duration: 15
        add:
          agent:
            satiety: 60
            protein: 3
            lipid: 1
            # 小さくても火の通った1食（docs/world/Characters.md 幸福度節の表）。
            happiness: 6
        pick:
          - weight: 100
          - weight: {prop: spoilage}
            set: {agent: {satiety: 0}}
            add: {agent: {carbohydrate: -40, protein: -40, lipid: -40}}
          - weight: {prop: spoilage}
            add: {agent: {carbohydrate: -40, protein: -40, lipid: -40, hydration: -48}}
        # 食べ終わって残る骨。agentの手が塞がっていれば足元へ落ちる（9.4節のフォールバック）。
        spawn: {object: small_bone, into: agent}
        destroy: self

  # 羽。鳥1羽ぶんをまとめた1枚。**使い道はまだ無い**が、獣骨（animal_bone）と同じく素材として
  # 溜まる——飾り・矢羽・火口・詰め物のいずれへ延ばすかは docs/world/Animals.md 10節。
  feather:
    tags: [item]
    props:
      weight: {value: 40}
      # ばらけた羽は詰めても縮まないので、嵩そのままで見る（plant_fiberと同じ扱い）。
      volume: {value: 1200}

  # 小さな骨。削れば針になる細い骨1本ぶん。獣骨（animal_bone、500g）のように道具の頭部にはできない
  # ——荷重のかかる頭部に向かないのが、細い骨と中空の鳥骨に共通する制約。
  #
  # **鳥からも出す。** 得られる素材は獲物の種類によらず同じ（HuntingSystem.md 1.5節）で、中空で薄壁の
  # 鳥骨はむしろ割って針にしやすい。獲物の大きさは個数で表すので、より大きい鳥を足すときは数を増やす。
  small_bone:
    tags: [item]
    props:
      weight: {value: 10}
      volume: {value: 15}
    interactions:
      # 削って針にする（tools.yamlのbone_needle）。刃物を当てる側（instrument）は残り、削られる骨だけが
      # 針へ置き換わる——石を打ち割って尖った石を作るのと同じ形（locations.yamlのknap）。
      # 明るさの条件も同じで、削り出す形が手元の明るさに掛かる（docs/engine/IlluminationSystem.md 5節）。
      whittle:
        trigger: {drag: {tag: cutting_tool}}
        conditions:
          - reason: too_dark
            subject: agent
            prop: hand_brightness
            in_stage_or_above: bright
        duration: 40
        # **伸びるのは木材加工**（docs/engine/SkillSystem.md 3節の実行経路）。スキルを分ける軸は素材
        # ではなく技術（docs/world/Skills.md 1節）で、刃を当てて削り出す手つきは、太い枝を削る
        # 木材加工の最初の一歩と同じもの——骨であることは転移の向きを変えない。
        add: {agent: {skill_woodwork: 2}}
        destroy: self
        spawn: {object: bone_needle}

  # 解体して得られる素材。獲物の種類によらず同じ物が出て、獲物の大きさは個数で表す
  # （HuntingSystem.md 1.5節）。骨と皮の使い道は docs/world/SurvivalItems.md 参照。

  # 生肉。1切れで4時間の腹持ちと、ヤシガニ1匹分の肉の栄養——ヤシガニ2kgのうち食べられるのが
  # およそこの1切れぶん、という対応で揃えている。
  #
  # 炉の火にかけると焼ける（docs/engine/FireSystem.md 7節）。**炉のことは何も知らない**——
  # 加熱の進み（cooking_progress）を持つだけで、進めるのは炉の側。
  raw_meat:
    tags: [item, food, meat_bait, roastable]
    traits: [perishable, spoils_fast, dryable]
    props:
      weight: {value: 500}
      # 罠へ仕掛けると肉食の卓が引かれやすくなる（docs/engine/TrapSystem.md 4節）。
      meat_bait: {value: 12}
      volume: {value: 500}
      # 炎（3/tick）なら9tick＝2時間15分で焼き上がる。maxちょうどに乗る8tick目ではまだ溢れない
      # （溢れは`> max`、6.3節）ので、割り算より1tick長い。火から出せば止まり、戻せば続きから進む。
      cooking_progress:
        value: 0
        range: {min: 0, max: 24}
        on_max:
          destroy: self
          spawn: {object: roasted_meat}
    # 塩漬けにできる（salt.yaml）。**塩蔵の本来の相手がここ**で、2.5日しか保たない肉が20日になる
    # ——狩った肉を、その日のうちに焼き切らずに持ち帰れるようになる。
    variation_axes:
      cure: {of: {tag: cured}}
    interactions:
      eat:
        trigger: menu
        conditions:
          - reason: too_full
            not: {subject: agent, prop: satiety, in_stage_or_above: full}
        duration: 15
        add:
          agent:
            satiety: 500
            protein: 20
            lipid: 4
            vitamin: 2
            # 本来は火を通すもの（docs/world/Characters.md 幸福度節の表）。下の菌と併せて、生で
            # 食べない理由になる。
            happiness: 1
            # **火を通していない身が抱えている菌**（docs/engine/DigestionSystem.md 6節）。腐敗とは
            # 独立していて、採れたての1切れでも入る——**当たるかどうかは、入った菌と食べた側の免疫で
            # 決まる**ので、ここでは抽選を引かない。
            #
            # 3は生の食肉の表面菌数（10³ CFU/g の桁）から。焼けば菌は死ぬので、焼いた肉（roasted_meat）
            # は名乗らない。
            pathogen: 3
        pick:
          - weight: 100
          - weight: {prop: spoilage}
            set: {agent: {satiety: 0}}
            add: {agent: {carbohydrate: -40, protein: -40, lipid: -40}}
          - weight: {prop: spoilage}
            add: {agent: {carbohydrate: -40, protein: -40, lipid: -40, hydration: -48}}
        destroy: self

  # 焼けた肉。生より腹に残り、栄養も出る。焼き上がっても火の中の枠に居続けるので、
  # 放っておくと焦げる（docs/engine/FireSystem.md 7.2節）。
  roasted_meat:
    tags: [item, food, roastable]
    traits: [perishable, spoils_fast]
    props:
      # 水が飛んだぶん軽くなる。
      weight: {value: 400}
      volume: {value: 450}
      # 焦げるまでの猶予は生から焼きより短い。炎なら5tick＝1時間15分。
      cooking_progress:
        value: 0
        range: {min: 0, max: 12}
        on_max:
          destroy: self
          spawn: {object: charred_lump}
    interactions:
      eat:
        trigger: menu
        conditions:
          - reason: too_full
            not: {subject: agent, prop: satiety, in_stage_or_above: full}
        duration: 15
        add:
          agent:
            satiety: 450
            protein: 24
            lipid: 7
            happiness: 6
        pick:
          - weight: 100
          - weight: {prop: spoilage}
            set: {agent: {satiety: 0}}
            add: {agent: {carbohydrate: -40, protein: -40, lipid: -40}}
          - weight: {prop: spoilage}
            add: {agent: {carbohydrate: -40, protein: -40, lipid: -40, hydration: -48}}
        destroy: self

  # 焦げた塊。加熱の進みを持たないので、ここで鎖が終わる。
  #
  # **栄養素を1つも持たない。** 肉も芋もここへ落ちる（foods.yamlのタロイモ・ヤシガニ）ので、元が
  # 何だったかによらない終端でなければならない。炭になった物から得られるのは腹の嵩だけ、という
  # 一点だけを表す。
  #
  # 進みが無くてもroastableを持つのは、焦げた瞬間に火の中の枠を引き継ぐため——枠が受け入れないと、
  # 置き換えが土地のアイテムへこぼれる（docs/engine/FireSystem.md 7.2節）。
  #
  # **腐らない。** 水も栄養素も残っていない炭なので、腐敗のtrait（foods.yaml）を持たない。
  # したがって**吐き下しのpick（docs/engine/DigestionSystem.md 6節）も持たない**——他の食べ物が
  # 全部持っているのに、ここだけ書かない理由がこれ。引く重みは腐敗の段が押し上げるspoilageなので、
  # 腐らない物には常に0の抽選しか書けない。
  charred_lump:
    tags: [item, food, roastable]
    props:
      weight: {value: 250}
      volume: {value: 300}
    interactions:
      eat:
        trigger: menu
        conditions:
          - reason: too_full
            not: {subject: agent, prop: satiety, in_stage_or_above: full}
        duration: 15
        add:
          agent:
            satiety: 200
            # **喜びも残っていない。** 栄養素と同じ理由で、炭になった物から得られるのは腹の嵩だけ。
            # 焦がした罰は既に「身になるものが消える」ことで付いているので、負の値は入れない。
            happiness: 0
        destroy: self

  # 獣骨。1頭ぶんの骨をまとめた1枚。
  animal_bone:
    tags: [item]
    props:
      weight: {value: 500}
      # 形の揃わない骨の束なので、詰めても縮まない嵩で見る（ヤシの実の皮と同じ扱い）。
      volume: {value: 700}

  # 生皮。剥いだままの皮。樹皮の渋に漬ければなめし革になる（clothing.yamlのtanned_leather）。
  rawhide:
    tags: [item]
    props:
      weight: {value: 600}
      volume: {value: 1500}
