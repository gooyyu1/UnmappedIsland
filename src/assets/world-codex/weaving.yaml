# ヤシの葉を編む連鎖（docs/world/Skills.md「繊維・編み」）。
#
# ヤシの葉は羽状複葉で、1本の中軸に細長い小葉が左右2列に並んでいる。編むとは、その小葉を
# 互い違いに組むこと。短冊が最初から軸に整列しているため、素手でも編める。
#
# 中軸で縦に割ると同じ葉から2枚取れるが、中軸は木質で丈夫なので刃物が要る。刃物は新しい物を
# 解放するのではなく、同じ材料からの歩留まりを倍にする。
#
# 葉を採るヤシの木（palm_tree）はcoconut.yamlが定義する。

object_defs:
  # ヤシの葉。重さの大半は中軸で、編むときに捨てる（1枚4000g → パネル400g×2）。
  # かさばるので、拠点へ運ぶ前にその場で編むと運ぶ重さが減る。
  palm_frond:
    tags: [item]
    props:
      weight: {value: 4000}
      # かさは編み籠の容量を超える。葉は籠に入れず手で運ぶ。
      volume: {value: 22000}
      # 編むのにかかる時間。**どの腕がどの段からどれだけ縮めるかは、この操作が自分で宣言する**
      # （docs/world/Skills.md 7節）。編み葉は籠にも衣類にも何枚も要るので、届いた段で縮む。
      #
      # **割ってから編むほう（下）と同じ1時間で、刃物が変えるのは採れる枚数だけ**——1枚あたりに直すと
      # ちょうど倍で、ファイル冒頭の「歩留まりを倍にする」がそのまま時間にも出る。1回を1時間に
      # 収めているのは docs/engine/ActionSystem.md 6.3節の線。
      weave_minutes:
        value: 60
        passives:
          - conditions:
              - {subject: agent, prop: skill_cordage, in_stage_or_above: skilled}
            modify: {self: {weave_minutes: -15}}
      # 割ってから編むほうの時間。同じ葉の別の手順なので、効き方も上と揃える。
      split_and_weave_minutes:
        value: 60
        passives:
          - conditions:
              - {subject: agent, prop: skill_cordage, in_stage_or_above: skilled}
            modify: {self: {split_and_weave_minutes: -15}}
    interactions:
      # 素手で編む。中軸を残したまま左右の小葉を組むので、幅広のパネルが1枚できる。
      #
      # 小葉を1本ずつ互い違いに通す手元の作業（docs/engine/IlluminationSystem.md 5節）。1本
      # 飛ばせば目が抜ける。据え付けの光源も効くので、焚き火のそばなら夜でも編める。
      weave:
        trigger: menu
        conditions:
          - reason: too_dark
            subject: agent
            prop: hand_brightness
            in_stage_or_above: bright
          - reason: too_stormy
            not: {subject: agent, prop: wind_speed, in_stage_or_above: gale}
        # 編む人の腕で縮む分はweave_minutes自身のpassivesが持つので、ここはその1つを読むだけ。
        duration: {prop: weave_minutes}
        # **繊維・編みの腕はここから立ち上がる**（docs/engine/SkillSystem.md 3節の実行経路、量の
        # 置き方は characters/player_character.yaml）。**繊維を伸ばす口のうち、道具を1つも要求しない
        # のはここだけ**（掻き取り・葉割りは刃物、叩き解しは殻を出す刃物が先に要る）なので、この1つが
        # 編み籠・くくり罠の解放条件の立ち上がり（同3.2節）を支えている。
        add: {agent: {skill_cordage: 2}}
        destroy: self
        spawn: {object: woven_leaf}
      # 中軸で割ってから左右をそれぞれ編む。細長いパネルが2枚とれる。屋根を葺くときは
      # 軒から棟へ段を重ねるので、細長いほうが扱いやすい。
      split_and_weave:
        trigger: {drag: {tag: cutting_tool}}
        conditions:
          - reason: too_dark
            subject: agent
            prop: hand_brightness
            in_stage_or_above: bright
          - reason: too_stormy
            not: {subject: agent, prop: wind_speed, in_stage_or_above: gale}
        duration: {prop: split_and_weave_minutes}
        add: {agent: {skill_cordage: 2}}
        destroy: self
        # **余分の卓は持たない。** 2枚取れるのは中軸で割ったからで、葉に3枚目は無い
        # （docs/world/Skills.md 7節）。
        spawn: {object: woven_leaf, count: 2}

  # 編んだ葉。面が要るところなら、どの連鎖でも共通で使う中間素材。
  # 中間素材なので解放条件を持たない（docs/engine/SkillSystem.md 4.2節）。
  woven_leaf:
    # fragileは、動物がぶつかって壊しうる物（docs/engine/HuntingSystem.md 5.4節）。
    tags: [item, fragile]
    props:
      weight: {value: 400}
      # 平たい板なので重ねられる。
      volume: {value: 1500}
