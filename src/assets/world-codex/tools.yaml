# 道具（tool）の定義（GameElementDefinition.md 12節・RecipeSystem.md参照）。
#
# 道具は「何ができるか」をタグで表し、使う側は型の指定（GameElementDefinition.md 4.1節）でそのタグを探す。
# 素材そのものを名指ししないことで、同じ用途の別の道具（後から追加されるもの・アセットパック）へそのまま置き換わる。
#
# toolタグは「道具であること」そのもので、能力のタグと重ねて付ける。何ができるかではなく何のための物かを
# 言うタグなので、能力が増えても1つのままになる。付ける相手は、他の物の操作が使う側として指名し、
# **使っても無くならない**物（CardView.md 2.1節）。注ぎ込む水のように指名されても移ってしまう物は付けない。

traits:
  # 動物へ重ねて殴れる物（animals.yamlのstrikeがweaponタグで探す、docs/engine/HuntingSystem.md 1.2節）。
  #
  # **武器が宣言するのは威力ではなく、一撃がどこへ入るかの重み配分。** 殴った結果（衝撃の量・付く傷）は
  # 動物の側が候補として持ち、武器はそのどれを引きやすいかだけを言う——`add`の量はリテラルしか書けない
  # （9.2節）ので、威力を武器から読むことはできず、`pick`の重み（10.2節）だけが武器を指せる。
  # 配分の合計は100に揃える。仕留めの重み（無防備さ）と並ぶ目盛りが武器ごとに変わらないようにするため。
  #
  # どれも値を持たないので、**宣言し忘れた武器はロードで落ちる**（5節）。0も明示して書く——
  # 「この武器では起こらない一撃」は、書き忘れと同じ0になるため、並べて読めるようにする。
  weapon:
    tags: [weapon]
    props:
      # 当たり所の重み。**値を名乗るのは武器の側**で、その武器が最も太く名乗る当たり方1つだけが、
      # 殴る人の狙い（hunting_aim）をbaseの土台として積む（docs/world/Skills.md 5節）。
      #
      # **積むのを1つに限るのは、下の「合計100」を実効値でも保つため。** 当たり方の数だけ積むと、
      # 2つ名乗る石斧だけが倍受け取り、仕留めの重みと並ぶ目盛りが武器ごとに変わる。1つに限れば
      # どの武器も同じだけ伸びる（105 → 145）。
      #
      # **ここには土台を置かない**——0を宣言した当たり方（尖った石の強打）にまで積むと、腕が上がる
      # だけでその武器に無いはずの一撃が出る。火口のignition_chanceと同じ置き方（fire.yaml）。
      #
      # 打ち砕く一撃。柄の遠心力が乗る物だけが太い重みを持つ。
      heavy_blow: {}
      # 浅く当たる一撃。握って殴るだけの物はここしか持てない。
      light_blow: {}
      # 突き通す一撃。衝撃は小さいが、深く刺さって血が速く流れる。
      thrust: {}
      # 空を切る。リーチのある物ほど太い。**ここへは積まない**——外すのは腕の問題だが、押すのは
      # 当たる側だけにして、卓が増えるぶんで外れの割合が落ちる形にしている（Skills.md 5節）。
      whiff: {}
      # 刃こぼれするまでの余力。上限は種類によらず960で統一する（DurabilitySystem.md 1節）。
      # 減らすのは殴ったときだけで、屋外に置いた劣化はまだ扱わない（同5節の未決事項）。
      durability:
        # 尽きると使えなくなるので、満タン側がgood（CardView.md 8節）。
        gauge: {min: bad, max: good}
        value: 960
        range: {min: 0, max: 960}

object_defs:
  # 尖った石。石同士を打ち合わせて作る最初の刃物（locations.yamlのstone.combinations.knap）。
  # 刃物と武器は別のタグで、片方だけを持つ物もありうる。
  #
  # **握って殴るだけなので、獲物を沈められない。** 浅く当たる一撃しか持たず、衝撃はネズミ・ヤケイの
  # 体格を越える程度で止まる。サルには数撃、イノシシには何撃当てても足りない。
  sharp_stone:
    traits: [weapon]
    tags: [item, tool, cutting_tool]
    props:
      weight: {value: 400}
      volume: {value: 300}
      heavy_blow: {value: 0}
      light_blow: {value: 70, base: {subject: agent, prop: hunting_aim}}
      thrust: {value: 0}
      whiff: {value: 30}

  # 石斧。石の頭部を太い枝へ紐で縛った物（docs/world/SurvivalItems.md 1節）。
  #
  # **柄が乗せる遠心力が、そのまま打ち砕く一撃になる。** サルなら一撃で沈み、イノシシでも数撃で届く。
  # 頭部は刃なので解体にも使える。
  #
  # **木を倒せる唯一の道具**（chopping_tool、timber.yaml）。尖った石では幹の木部を断てないため、
  # 丸太＝筏（voyage.yaml）への道はここを通る。
  #
  # **材料より軽い。** 頭部400＋柄600＋紐200＝1200gで、太い枝1000gのうち400gは削り落とす木屑。
  # 撚る工程（fiber.yaml）が重さを保つのと違い、削る工程では減る。
  stone_axe:
    traits: [weapon]
    tags: [item, tool, cutting_tool, chopping_tool]
    props:
      weight: {value: 1200}
      volume: {value: 1800}
      # 積むのは強打だけ（trait の注記）。**腕が上がるほど、この武器が得意な当たり方へ寄る。**
      heavy_blow: {value: 60, base: {subject: agent, prop: hunting_aim}}
      light_blow: {value: 15}
      thrust: {value: 0}
      whiff: {value: 25}
    recipes:
      hafted:
        # 柄付けはスキルにしない（docs/world/Skills.md 3節）。「刃を作れて、紐も作れるようになったら
        # 斧が作れる」を、そのまま2本の腕の連言で書く。「その段以上」の書き方は
        # characters/player_character.yaml。
        conditions:
          - {reason: needs_knapping, subject: agent, prop: skill_knapping, in_stage_or_above: basic}
          - {reason: needs_cordage, subject: agent, prop: skill_cordage, in_stage_or_above: basic}
        steps:
          # 柄をこしらえる。枝の先を割り、刃を落とし込む溝を作る。
          - requires:
              - {object: thick_branch, count: 1, consume: true}
            duration: 60
          # 刃を溝へ据え、紐で締め上げる（柄付け、docs/world/Skills.md 3節）。
          - requires:
              - {object: sharp_stone, count: 1, consume: true}
              - {object: cord, count: 1, consume: true}
            duration: 120

  # 骨針。小さな骨を削って穴を開けた縫い針（docs/world/SurvivalItems.md 1.2節）。
  #
  # **縫うための道具で、縫っても減らない**（レシピでは consume: false で要求する）。繊維 → 罠 →
  # 小動物 → 小骨 → 骨針 → 縫製、という浅い経路の終点で、大型動物を狩らずに皮革へ届く。
  #
  # 武器にはならない（weapon traitを持たない）。獣骨（animal_bone）と違って荷重のかかる頭部に
  # できない細い骨から作るので、刺すための物ではあっても殴るための物ではない。
  bone_needle:
    tags: [item, tool, sewing_tool]
    props:
      weight: {value: 5}
      volume: {value: 5}

  # 槍。長い棒の先へ石の穂先を固定した物（docs/world/SurvivalItems.md 3節）。
  #
  # **突くか、空を切るかの二択。** 浅く当たるということが無い代わりに、当たれば深く刺さって血が速く
  # 流れる（injuries.yamlのpuncture_wound）。その場で沈めるのではなく、深手を負わせて弱らせる武器。
  #
  # **解体には使えない**（cutting_toolを持たない）。穂先は柄の先に固定されていて、皮を剥ぐ手つきには
  # ならない——狩れても捌けないので、刃物を別に持つ理由が残る。
  #
  # 2mの棒なので、重さのわりにかさばる（同0節 長さの違いはかさで効かせる）。
  spear:
    traits: [weapon]
    tags: [item, tool]
    props:
      weight: {value: 900}
      volume: {value: 6000}
      heavy_blow: {value: 0}
      light_blow: {value: 0}
      thrust: {value: 55, base: {subject: agent, prop: hunting_aim}}
      whiff: {value: 45}

  # 突き銛。太い枝の先へ石の穂先を紐で締めた漁具（docs/world/Voyage.md 3.9.4節）。
  #
  # **釣りの入力はfishing_toolタグで、型を名指ししない**（voyage.yamlのspear_shoal・spear_sea）。
  # 木を倒せるのがchopping_toolだけであるのと同じ形で、釣り針や網が後から増えても釣りの手そのものは
  # 書き換わらない。
  #
  # **柄は長い棒ではなく太い枝**（同3.9.4節）。筏の縁から真下へ突くので、獣を狙う長さが要らない。
  # 材料も工程も石斧と同じ柄付け（docs/world/Skills.md 3節）なので、目方とかさも石斧に同じ。
  #
  # 武器にはならない（weapon traitを持たない）。獣を突く道具ではない。
  fishing_harpoon:
    tags: [item, tool, fishing_tool]
    props:
      weight: {value: 1200}
      volume: {value: 1800}
    recipes:
      hafted:
        # 材料も工程も石斧と同じ柄付けなので、解放条件も同じ2本の連言になる。
        conditions:
          - {reason: needs_knapping, subject: agent, prop: skill_knapping, in_stage_or_above: basic}
          - {reason: needs_cordage, subject: agent, prop: skill_cordage, in_stage_or_above: basic}
        steps:
          # 柄をこしらえる。枝の先を割り、穂先を落とし込む溝を作る。
          - requires:
              - {object: thick_branch, count: 1, consume: true}
            duration: 60
          # 穂先を溝へ据え、紐で締め上げる（柄付け、docs/world/Skills.md 3節）。
          - requires:
              - {object: sharp_stone, count: 1, consume: true}
              - {object: cord, count: 1, consume: true}
            duration: 120
