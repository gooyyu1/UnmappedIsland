# 寝床（docs/world/Bedding.md）。敷物（同2節の段1）・骨組み（段2）・詰め物（段3）と、
# ハンモックが入っている。
#
# **段ごとの上積みは、ブロックを1つ足すことで届く**（同4節）。量は定数しか書けないので
# （docs/concept/DesignPrinciples.md「計算式はエンジンに取っておき、宣言へ開かない」）、1箇所へ
# 集めずに段ごとのブロックへ散らしてある。有効なブロックはすべて重なる（8.5節）。
#
# **睡眠（sleep）を配るのは寝床だけ**（docs/world/Bedding.md 4.1節）。地面に直に寝る段0で取れるのは仮眠まで
# （characters/player_character.yaml の nap）で、寝床の上の nap/sleep はこちらが配る。

object_defs:
  # 編んだ葉を広げただけの敷物に、骨組みを差し込める枠を持たせたもの。**敷物は部品ではなく寝床
  # そのもの**なので、差し替える枠を持たない（docs/world/Bedding.md 1.1節）。
  bed:
    # 編んだ葉は短命な素材（weathering.yaml）。**屋根の下へ敷けば止まる**ので、浅い洞窟に寝床を
    # 置く値打ちが、眠れること以外にも出る。
    traits: [short_lived_material]
    tags: [fixture, bed]
    # 差した部品は外から見える（7.11節。筏の帆と同じ）。段が上がっているかを札から読めないと、
    # 差したかどうかを憶えておくことになる。
    visible_slots: [structure]
    props:
      # 編んだ葉3枚ぶん（weaving.yaml）。部品を差せば、その重さが子の重さとして乗る
      # （docs/engine/ContainerSystem.md 1節）。
      weight: {value: 1200}
    slots:
      # 下へ差し込む骨組みと、上へ載せる詰め物。**枠は部品ごとに分ける**——1つの枠に両方を
      # 受けさせると、骨組みを差した寝台へ詰め物を足せなくなる（段は重なるもので、
      # 差し替えではない。docs/world/Bedding.md 2節）。
      structure:
        cells:
          - {accept: {tag: bed_frame}, max: 1}
          - {accept: {tag: stuffing}, max: 1}
    interactions:
      # **回復は経過の間ずっと効く宣言が積む**（11.7節。docs/world/Bedding.md 4節）。アクションの
      # 側に置くのは、キャラクタ自身の休息とまったく同じ形にするため（characters/player_character.yaml）。
      #
      # **段ごとに1つの定数なので、寝床のぶんは長さに正比例する。** キャラクタ側が持つ「まとめて休む
      # ほど得」が効くのは地面の上だけで、寝床の上では nap 2回と sleep 1回がちょうど同じだけ戻る。
      #
      # **量は1日に削られる体力から逆算してある**（docs/world/Bedding.md 4節）。骨組みを差した 3/tick が、
      # 一晩（24tick）で heavy を担ぎ通した1日ぶん（-72）をちょうど返す位置で、敷物だけの 2/tick は
      # そこへ届かない。**どの段の一晩も、いちばん薄い体力の上限を下回る**ので（characters/engineer.yaml
      # の90）、段の差は通しの睡眠にそのまま出る。
      #
      # **覚醒度は段で動かない**——sleep で戻るのは段によらず同じで、18時間起きて6時間眠るとちょうど
      # 元へ戻るという釣り合いを寝床の上でも保つ（docs/world/Characters.md 休息節）。
      #
      # **同じブロックが、寝ている間だけ寒さの入口（chill_point）も押し下げる**
      # （docs/engine/VitalsSystem.md 8.3節。深さは docs/world/Bedding.md 4.2節）。押し下げるのは
      # 眠っている当人なので対象は agent で、効くのは duration を進めている間だけ——「眠っている間か」を
      # 問うゲートは要らない（11.7節）。**衣類の modify と加算で重なる**（clothing.yaml）。
      #
      # **1℃は体の下の乾いた層、もう1℃は地面から離れること、3つ目は潰れない厚み**（同4.2節）。
      # 敷物が1つ目を、差した骨組みが2つ目を、差した詰め物が3つ目を持つ。
      #
      # **段3のブロックは中身を見ない。** 見るのは `stuffing` を名乗っていることだけで、羽毛か
      # 植物繊維かでは分かれない（同5節。分かれるのは集め方のほう）——いちばん寒い土地の夜を火なしで
      # 越せるのは詰め物まで仕上げた者、という約束（同4.2.1節【確定】）が、詰め物として世界に現れる
      # 物すべてに掛かるため。**型ごとにブロックを分けると、同じ枠へ入る物どうしが排他なことを
      # 収支の解析が読めず、どの寝床でも起きない量を出す**（src/analysis/balanceTables.ts の
      # expectedDeltas は条件を見ずに足す）。
      nap:
        trigger: menu
        duration: 180
        passives:
          - add: {agent: {stamina: 2, wakefulness: 4}}
            modify: {agent: {chill_point: -1}}
          - conditions:
              - {slot: structure, matches: {tag: bed_frame}}
            add: {agent: {stamina: 1}}
            modify: {agent: {chill_point: -1}}
          - conditions:
              - {slot: structure, matches: {tag: stuffing}}
            add: {agent: {stamina: 0.5}}
            modify: {agent: {chill_point: -1}}
      sleep:
        trigger: menu
        duration: 360
        passives:
          - add: {agent: {stamina: 2, wakefulness: 4}}
            modify: {agent: {chill_point: -1}}
          - conditions:
              - {slot: structure, matches: {tag: bed_frame}}
            add: {agent: {stamina: 1}}
            modify: {agent: {chill_point: -1}}
          - conditions:
              - {slot: structure, matches: {tag: stuffing}}
            add: {agent: {stamina: 0.5}}
            modify: {agent: {chill_point: -1}}
    recipes:
      # 編んだ葉を3枚、端を重ねて広げる。道具も紐も要らない。
      #
      # **手際も名乗らない**（docs/world/Skills.md 7.1節）。広げるだけで、撚る工程も組む工程も
      # 持たない——編む仕事は素材の側（weaving.yamlのweave）で既に済んでいる。
      spread:
        steps:
          - requires:
              - {object: woven_leaf, count: 3, consume: true}
            duration: 15

  # 寝台の骨組み。杭4本を打ち、縦材を渡し、簀の子を縛る。軽いがかさばる。
  #
  # **湿気・虫・浸水から一度に離れるのが段2**（docs/world/Bedding.md 2節）で、寝床の段のうち跳躍が
  # 最も大きい。数字の大小でしか表していないのは、乾きと虫を寝床のプロパティとして持つかが
  # まだ決まっていないため（同8節）。
  #
  # **自分では何も宣言しない。** 差さっていることを見るのは寝床の側のブロックで、部品は
  # 「そこへ入れる物である」ことをタグで名乗るだけ（同4節）。
  bed_frame:
    tags: [item, bed_frame]
    props:
      weight: {value: 6600}
      # ヤシの葉と同じく、籠には入らない嵩にする。
      volume: {value: 24000}
    recipes:
      # 杭を打ち、縦材を渡し、簀の子を縛る。**解放は要求しないが、手際は名乗る**
      # （docs/world/Skills.md 7.1節）。木を縛って組む物は木材加工の側（同2.1節、そりと同じ
      # containers.yaml）で、腕が0でも組めて、上げた者だけが速くなる。
      lashed:
        deftness: {skill: skill_woodwork, from_stage: expert, minutes: -15}
        # **工程は1時間ずつ**（docs/engine/ActionSystem.md 6.3節）。材料は、その工程で実際に使うものへ
        # 割り当ててある。
        steps:
          # 杭を4本打つ。
          - requires:
              - {object: thick_branch, count: 4, consume: true}
            duration: 60
          # 縦材を渡す。
          - requires:
              - {object: thick_branch, count: 2, consume: true}
            duration: 60
          # 簀の子を縛る。
          - requires:
              - {object: cord, count: 3, consume: true}
            duration: 60

  # 羽毛の詰め物。なめし革の袋へ羽を詰めたもの。**効きは植物繊維の詰め物と同じ**
  # （docs/world/Bedding.md 5節）——分かれるのは集め方で、こちらは獲物を捌いた副産物が溜まるのを
  # 待つ側。寝床への効きは、寝床の側が `stuffing` タグで受ける1つのブロックが持つ。
  #
  # **袋がなめし革なのは、目の詰んだ面でないと羽軸が抜けるため**（同5節）。布は対象外
  # （docs/world/SurvivalItems.md 7節）なので、受け皿はここに決まる。革は熱帯では蒸れるが、
  # 段を置くことは決まっているので（docs/world/Bedding.md 4.2.1節）、蒸れは詰め物まで通すことの
  # 代償になる。
  #
  # **素材は名乗らない。** 名乗るのは手に持って使う物・身につける物・入れ物・寝床までで、寝床へ差す
  # 部品はその外（docs/engine/DurabilitySystem.md 2節。骨組みと同じ扱い）。
  feather_stuffing:
    tags: [item, stuffing]
    props:
      # なめし革2枚（1000g）と羽30枚（1200g）。
      weight: {value: 2200}
      # 嵩は中身ではなく袋の形で決まるので、植物繊維の詰め物と同じ。籠には入らない
      # （containers.yaml）。
      volume: {value: 30000}
    recipes:
      # 革を裁って袋に縫い、羽を詰めて口を閉じる。**解放条件はなめし革の衣類と同じ連言**
      # （clothing.yamlのsewn）——裁って縫う仕事そのものなので、革が縫える者と糸が撚れる者の
      # 両方であることが要る。いちばん深い一着がこの段の前提でもある
      # （docs/world/Bedding.md 4.2.1節）ので、開く順は揃う。
      stuffed:
        conditions:
          - {reason: needs_leatherwork, subject: agent, prop: skill_leatherwork, in_stage_or_above: skilled}
          - {reason: needs_cordage, subject: agent, prop: skill_cordage, in_stage_or_above: basic}
        # 速さを決めるのは縫う側の1本（docs/world/Skills.md 7節）。
        deftness: {skill: skill_leatherwork, from_stage: expert, minutes: -15}
        # **工程は1時間ずつ**（docs/engine/ActionSystem.md 6.3節）。材料は、その工程で実際に使う
        # ものへ割り当ててある。
        steps:
          # 型を取り、革を裁つ。面は衣類1着ぶんと同じ2枚（clothing.yamlのsewn）。
          - requires:
              - {object: tanned_leather, count: 2, consume: true}
            duration: 60
          # 三方を縫って袋にする。骨針は道具なので縫っても減らない（tools.yamlのbone_needle）。
          - requires:
              - {object: yarn, count: 2, consume: true}
              - {tag: sewing_tool, count: 1, consume: false}
            duration: 60
          # 羽を詰めて口を閉じる。**40g/羽なので30枚で1.2kg**（docs/world/Bedding.md 5節）
          # ——ヤケイ30羽ぶんで、罠を回し続けた者だけが届く。解体の副産物なので、肉を採る仕事の
          # ついでに溜まる（animals.yamlのbutcher）。
          - requires:
              - {object: feather, count: 30, consume: true}
              - {object: yarn, count: 1, consume: true}
              - {tag: sewing_tool, count: 1, consume: false}
            duration: 60

  # 植物繊維の詰め物。同じなめし革の袋へ、掻き取った繊維・叩き解したコイア（fiber.yaml・
  # coconut.yaml）を詰めたもの。**獲物を待たずに集まる代わりに、紐・ロープと同じ原資を食う**
  # （docs/world/Bedding.md 5節。筏との競合は同3節）——払う先が罠から手間へ移るだけで、
  # 寝床への効きは羽毛と同じ。
  plant_fiber_stuffing:
    tags: [item, stuffing]
    props:
      # なめし革2枚（1000g）と繊維15束（900g）。
      weight: {value: 1900}
      volume: {value: 30000}
    recipes:
      stuffed:
        conditions:
          - {reason: needs_leatherwork, subject: agent, prop: skill_leatherwork, in_stage_or_above: skilled}
          - {reason: needs_cordage, subject: agent, prop: skill_cordage, in_stage_or_above: basic}
        deftness: {skill: skill_leatherwork, from_stage: expert, minutes: -15}
        steps:
          - requires:
              - {object: tanned_leather, count: 2, consume: true}
            duration: 60
          - requires:
              - {object: yarn, count: 2, consume: true}
              - {tag: sewing_tool, count: 1, consume: false}
            duration: 60
          # 繊維を詰めて口を閉じる。**60g/束なので15束で0.9kg**——羽より嵩が詰むので、同じ厚みを
          # 作るのに要る目方が軽い。
          - requires:
              - {object: plant_fiber, count: 15, consume: true}
              - {object: yarn, count: 1, consume: true}
              - {tag: sewing_tool, count: 1, consume: false}
            duration: 60

  # ハンモックの網。紐を編んだだけの物で、木材はゼロ。**伸ばしろを持たない**ので、寝床と違って
  # 段のブロックは1つだけ（docs/world/Bedding.md 6節）。
  #
  # **籠・そり（containers.yaml）と同じく item と fixture を兼ねる**ので、持ち歩くことも土地へ
  # 据えることもできる（設置物レーンとアイテムレーンの間を端の▲▼で行き来する）。**巻いた網と
  # 吊った網を型で分けない**——分けると据えるたびに個体が入れ替わり、傷んだぶんが消える（9.4節）。
  #
  # **寝台の上位ではなく別系統。** 回復量は骨組みを差した寝台と同じで、差は寝床になる場所・保温・
  # 伸ばしろ・持ち出しのほうにある——支点の要る土地でしか寝床にならない代わりに、そのまま次の
  # 土地へ持っていけて、寒さの入口を寝台ほど押し下げず（同4.2節）、詰め物を足す先を持たない（同6節）。
  hammock:
    # 網は紐だけでできているので、綯った紐＝長持ちする素材（weathering.yaml。形の大半を占める
    # 素材で決まる）。眠る側が湿気と虫から離れることと、網そのものが屋外で傷むことは別
    # （docs/world/Bedding.md 6節）。
    traits: [long_lived_material]
    tags: [item, fixture, bed]
    props:
      # 紐5本ぶん（fiber.yaml）。骨組みの1/6以下なので、遠出の荷に混ぜられる。
      weight: {value: 1000}
      volume: {value: 1250}
    interactions:
      # 背中の下を風が抜けるので、虫にも湿気にも最も強い（docs/world/Bedding.md 6節）。骨組みを
      # 差した寝台（2+1）と並ぶ量を、段が1つしかないので1行で持つ。
      #
      # **寒さの入口の押し下げだけは、寝台と並ばない**（同4.2節）。地面からは離れるが、網は体重で
      # 潰れて体の下に層が残らないので、取れるのは2つのうち1つぶん——敷物だけの寝床と同じ1℃で、
      # 骨組みを差した寝台の2℃には届かない。**虫と湿気に最も強い理由（背中の下を風が抜ける）が、
      # そのまま保温で並べない理由になる**（同6節）。
      #
      # **寝床になるのは、支点のある土地へ据えている間だけ**（同6.1節）。担いだままでは寝られない
      # ので、その土地の設置物レーンに在ることを要件が見る。支点のほうは今いる土地の宣言で、
      # `ancestor`＝`hanging_anchor`を宣言している最初の祖先（GameElementDefinition.md 8.6節）。
      nap:
        trigger: menu
        conditions:
          - reason: not_slung
            in_slot: fixtures
          - reason: no_anchor
            subject: ancestor
            prop: hanging_anchor
            gt: 0
        duration: 180
        passives:
          - add: {agent: {stamina: 3, wakefulness: 4}}
            modify: {agent: {chill_point: -1}}
      sleep:
        trigger: menu
        conditions:
          - reason: not_slung
            in_slot: fixtures
          - reason: no_anchor
            subject: ancestor
            prop: hanging_anchor
            gt: 0
        duration: 360
        passives:
          - add: {agent: {stamina: 3, wakefulness: 4}}
            modify: {agent: {chill_point: -1}}
    recipes:
      # 紐を結んで網にする。くくり罠（traps.yaml）と同じ結ぶ仕事なので、**解放は要求しないまま
      # 手際だけを名乗る**（docs/world/Skills.md 7.1節）。
      knotted:
        deftness: {skill: skill_cordage, from_stage: expert, minutes: -15}
        steps:
          # 縦糸を張る。
          - requires:
              - {object: cord, count: 3, consume: true}
            duration: 60
          # 目を結んでいく。
          - requires:
              - {object: cord, count: 2, consume: true}
            duration: 60
