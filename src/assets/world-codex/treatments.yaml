# 怪我に当てる治療具（treatmentタグ）の定義。怪我のtreatmentスロットへ入れて使う
# （injuries.yaml・docs/engine/InjurySystem.md 3節の手当て）。
#
# 効き目は「当てている間だけ」なので、すべてpassivesで書く。治した量を実体値へ焼き付けると、
# 外したときに戻せない。
#
# **明るさの条件は持たない**（docs/engine/IlluminationSystem.md 5節）。手当ては操作ではなく枠へ
# 入れること（injuries.yamlのtreatable）なので条件を書く場所が無く、傷を手で押さえて巻くのは
# 手が覚えている動作でもある。

object_defs:
  # 包帯。清潔に保ちやすく、長く当てておける。捻挫や骨折にも多少効く。
  bandage:
    tags: [item, treatment]
    props:
      weight: {value: 60}
      volume: {value: 300}
    passives:
      # **当てている間だけ**に絞る。conditionsが無いと、手持ちに入れているだけで効いてしまう
      # （ancestorはスロットを問わず祖先を辿るので、鞄の中の包帯が痛みを止める）。
      # parentは当てている怪我、痛みを持つのはそれを負った本人なのでancestorで辿る（8.6節）。
      - conditions:
          - {in_slot: treatment}
        add:
          parent:
            # 押さえていれば血は早く固まる。ただし**止めるのではなく早めるだけ**——止血帯
            # （hemostatic、未実装）と違って出血のゲートは閉じないので、当てても失血はゼロに
            # ならない（injuries.yamlのbleeding、InjurySystem.md 3.1節）。
            bleeding: -25
            severity: -0.4
        modify:
          ancestor:
            pain: -10

  # 添え木。枝から削り出した副木2枚を紐で巻き留め、折れた骨を挟んで動かなくする
  # （docs/engine/InjurySystem.md 3.1節）。
  #
  # **止血の口を持たない**（hemostaticタグが無く、bleedingへも書かない）。皮膚の下で折れる傷に
  # 止める血は流れていないので、出血に効かないことは不足ではなく性格そのもの（同3.1節）。痛みも
  # 和らげない——当てて得られるのは治りの速さと、骨折が押し上げる荷重の緩みの2つだけで、
  # 血の流れる傷には包帯を選ぶ理由がここに残る。
  splint:
    # immobilizingは「固定する治療具」の印。**押し上げを緩める量はここではなく骨折が持つ**
    # （injuries.yamlのfracture）——押し上げているのは骨折なので、緩んだ後の量も骨折が知っている。
    # 出血のゲートをhemostaticで開け閉めするのと同じ形（同3.1節）。
    tags: [item, treatment, immobilizing]
    props:
      # **材料より軽い**（tools.yamlの石斧と同じ）。太い枝2本（2,000g）から削り出した副木2枚に
      # 紐200gを足した重さで、差の800gは削り落とした木屑。
      weight: {value: 1400}
      volume: {value: 1800}
    passives:
      # 包帯と同じく**当てている間だけ**に絞る（in_slot、8.6節）。
      - conditions:
          - {in_slot: treatment}
        add:
          parent:
            # 固定していれば治りは速い。自然治癒の-1/tickと合わせて-1.6/tickで、包帯の-1.4/tickを
            # 上回る。**倍（-1）にはしない**——骨折の別格さを支えているのは原因の少なさと、
            # そのあいだずっと荷を運べないことの2つ（docs/engine/InjurySystem.md 5節）で、後者は
            # 当てているだけで既に半分に緩んでいる（injuries.yamlのfracture）。長さまで半分にすると、
            # 支えが原因の少なさだけになる。
            severity: -0.6
    # **解放条件を持たない。** 手当てを担うスキルは一覧（docs/world/Skills.md 2節）に無く、木材加工の
    # 腕を求めると、折れてから作れないことがある——上の「折れてから材料を集めに行くことにはならない」を
    # 腕の側から崩すことになる。
    recipes:
      lashed:
        steps:
          # 拾った枝と撚った紐だけで、削る工程も組み立ての道具も要らない。骨折を出すのは重い罠と
          # 大型の獣（docs/engine/InjurySystem.md 5節）——どちらもここより後ろにある段なので、
          # 折れてから材料を集めに行くことにはならない（素材込みの手間はstats/balance.yaml）。
          - requires:
              - {object: thick_branch, count: 2, consume: true}
              - {object: cord, count: 1, consume: true}
            duration: 60
