# 薪を割って積み、乾かす（docs/world/ContentSkeleton.md 4節の火の山、docs/engine/FireSystem.md 2.5節）。
#
# **開けるのは「伐った木から、取り出せる上限まで熱を取れること」。** 木から取り出せるのはいちばん良くて
# 20 fuel/kgで、拾った太い枝（locations.yamlのthick_branch）と若木の棒（timber.yamlのlong_pole）が
# この率。伐ったばかりの丸太は20kgでfuel 200——**半分しか出ない**（水を含み、丸太のままでは空気が
# 回らない。docs/engine/FireSystem.md 2.5節）。割って積んでおけば水が抜け、同じ木がその上限へ届く。
#
# **丸太のままでは、率が半分なだけでなく、火を焚く炉に入り切らない。** 焚き火と三石のかまどのfuelの
# 上限は30、石囲いの炉でも120（fire.yaml）で、丸太1本の200はくべても残りが失われる
# （docs/engine/FireSystem.md 2節）。受け切れるのは土器を焼く覆い焼きの炉（200、pottery.yaml）だけで、
# あれは土器しか載らない使い捨ての炉。**割り薪1本は乾いても30なので、いちばん小さい炉にも入り切る。**
#
# **乾くのは薪棚に積んであるあいだだけ。** 地面へ直に積んだ薪は下から湿気を吸い、雨のたびに濡れて
# 乾き切らない。棚が地面から離して風を通し、屋根が雨を防ぐ——**だから雨の条件を1つも持たない**
# （干し場・塩田が雨で振り出しへ戻るのとは、そこが違う）。
#
# 罠・畑・塩田・干し場・燻し小屋とまったく同じ「仕掛けて待つ」形で、新しい文法は1つも足していない。
# **乾きの残りを持つのは薪で、それを進めるのは棚**——炉が火にかけた物を進めるのと同じ向き（fire.yaml）。
# 途中で降ろしてまた積んでも、乾いたぶんはそのまま残る。
#
# **干し場・燻し小屋とは向きが逆**（drying.yaml・smoking.yaml。あちらは掛けた物の側が自分で進み、設備は
# 何も宣言しない）。あちらが逆向きなのは、**保存済みの物では止めなければならず、その見分けが個体ごと
# だから**（同）。こちらは枠が受けるのが割り薪だけで、積んだ全部を同じに進めてよいので、押す側を棚へ
# 置ける——**置くと、乾き上がりが「設備が回す工程」として収支表に値段を持つ**（stats/balance.yamlの
# `supply` の `driver: firewood_rack`）。物の側に置くと、乾いた薪は入手経路の無い物として出る。

object_defs:
  # 割ったばかりの薪。まだ水を含んでいるので、出る熱は丸太のまま燃やすのと変わらない。
  #
  # **割る操作は丸太の側が持つ**（timber.yamlのlogのsplit）——割られるのは丸太なので、その手は
  # 丸太に付く（docs/engine/GameElementDefinition.md の「自分のことは自分でする」）。
  # **薪のタグは生木と乾いたもので共有する**（下のfirewood_rackのwoodpileの枠がこれで受ける）
  # ——乾き切ると別の型へ置き換わるので、生木だけを受ける枠にすると、乾いた瞬間に置き場が無くなって
  # 消える。
  green_firewood:
    tags: [item, firewood]
    traits: [burnable]
    props:
      # 丸太（20kg）を10本に割った1本ぶん。**2mの丸太を玉切ってから割る**ので、1本は炉へくべられる
      # 大きさになる。
      weight: {value: 2000}
      # 割り口の隙間ができるので、寄せても丸太の嵩（35,000）へは戻らない。
      volume: {value: 3600}
      # 10本で丸太1本ぶん（200）。**割っただけでは増えない**——空気が回る形になるだけで、水はまだ
      # 中に在る。
      fuel: {value: 20}
      # 乾き切るまでの残り。罠のcatch_remaining・塩田や食べ物のdrying_remainingと同じ見えない
      # タイマー（docs/engine/TrapSystem.md 2節）で、**棚に積んであるtickの数だけを数える**。
      #
      # 576は6日ぶん（1日96tick）。現実には細く割って風を通しても3〜4週かかるので、日をまたいで
      # 進む長いものとして4分の1へ縮めたもの（docs/concept/DesignPrinciples.md の「長くかかるものだけ、
      # 現実の4分の1へ縮める」節）。**干物（1日）・燻製（1日）・素焼き前の壺（1日）より遅い**
      # ——薪はいちばん厚く、抜く水がいちばん多い。
      #
      # **初期値に幅を持たせない**（干し場・燻し小屋と同じ、drying.yaml）——薪は自分が積まれた
      # ところから数え始めるので、設備どうしの位相をずらす必要が無い。
      #
      # **減らすのは棚のほう**（下のfirewood_rack）。自分では1つも進まないので、地面へ積んでも
      # 鞄へ入れても乾かない。
      seasoning_remaining:
        value: 576
        range: {min: 0, max: 576}
        # 乾き切る。焼け石が冷めて石へ戻るのと同じ置き換わりで（fire.yamlのhot_stone）、別の型に
        # なる——**目方とfuelの両方が動く**ので、変種の軸では表せない。
        on_min:
          destroy: self
          spawn: {object: seasoned_firewood}

  # 乾いた薪。水が抜けて目方が4分の1落ち、出る熱は木から取り出せる上限の率になる。
  #
  # **上限を超えない。** 20 fuel/kgが太い枝・若木の棒と同じ率で（locations.yamlのthick_branch）、
  # 乾かして得られるのはそこへ届くことまで。tests/world-codex/firewoodYaml.test.tsが見張る。
  seasoned_firewood:
    tags: [item, firewood]
    traits: [burnable]
    props:
      # 生木の割り薪（2,000）から水が抜けたもの。丸太1本ぶんの10本で15kgになる。
      weight: {value: 1500}
      # 乾いても縮みはわずかなので、嵩は割ったときのまま。
      volume: {value: 3600}
      # 1.5kgで30。**太い枝（1kgで20）と同じ率**で、10本＝丸太1本ぶんで300になる。
      # **いちばん小さい炉（焚き火のfuelの上限30）にも、1本がそのまま入る。**
      fuel: {value: 30}

  # 薪棚。枝を組んで地面から離した台に薪を積み、編んだ葉の屋根を掛けたもの。
  #
  # **据える場所は縛らない**（干し場・燻し小屋と同じ）。日差しも雨も見ないので、樹冠の下でも雨季でも
  # 同じに進む。
  firewood_rack:
    tags: [fixture]
    # 押すと積んである薪が並ぶ（7.11節）。**棚は何も告げない**ので、見に来なければ乾いたことは
    # 分からない——罠・畑・塩田・干し場と同じ沈黙（docs/engine/TrapSystem.md 5節）。
    visible_slots: [woodpile]
    # 中身が個体ごとに違うので束ねない（SlotSystem.md 4節）。
    stackable: false
    slots:
      # 積んである薪。**受けるのは割った薪だけ**——拾った枝も丸太も積めないので、乾かす対象が
      # 割り薪だけであることは積む口が無いことで分かる。**乾いた薪も積める**（上のタグは生木と共有）
      # ——乾き切った1本はそのまま枠に残るので、受けない枠にすると置き換わった先の置き場が無くなる。
      #
      # **枠ごとに1つ**（maxを置く、7.2節）——薪は束ねられるので、maxが無いと1つの枠に何本でも
      # 積まれて、棚の広さが何も意味しなくなる（干し場・燻し小屋と同じ、drying.yaml）。
      # **枠の数は丸太1本ぶん**——割った10本をそのまま積める。
      woodpile:
        cell_count: 10
        cell: {accept: {tag: firewood}, max: 1}
    props:
      # 太い枝6本（1,000×6）＋編んだ葉3枚（400×3）＋縄1本（600）。**据えた物も目方を名乗る**
      # （core.yaml）。
      weight: {value: 7800}
    passives:
      # **積んだ薪を乾かす。これがこの棚の全部。** 炉が火にかけた物を進めるのと同じ向き
      # （fire.yamlのhearthのheat）で、乾きの残りを持つのは薪のほう。
      #
      # **条件を1つも持たない。** 屋根が雨を防ぎ、台が地面から離して風を通すので、天気も時刻も
      # 見るものが無い——**干し場が日差しを数えるのに対し、こちらは経過時間そのもの**（燻し小屋の
      # smoking_remainingと同じ数え方、smoking.yaml）。
      #
      # **乾きの残りを持たない薪（乾き切ったほう）では、黙って捨てられる**（炉が石と料理へ同じ1行で
      # 渡すのと同じ、fire.yaml）ので、積んだままでも何も起きない。
      - add: {child: {seasoning_remaining: -1}}
    # **解放条件を持たない。** 積んでも腕は伸びない（この型は操作を1つも持たない）ので、腕を求めると
    # 棚がその腕の入口より後ろでしか開かない（干し場と同じ、drying.yaml）。火の腕が担うのは着火だけ
    # なので（docs/world/Skills.md 2.2節）、そもそも求める先も無い。
    recipes:
      # 枝を組んで葉を掛け、縄で締めるだけ。**掘削具も刃物も要らない**——刃物が要るのは薪のほうで、
      # 丸太を割るのに斧が要る（timber.yamlのlogのsplit）。
      #
      # **解放は要求しないまま、手際だけを名乗る**（docs/world/Skills.md 7.1節）。組む仕事なので、
      # 同じく枝と縄で組む家畜の囲い・そり（farming.yaml・containers.yaml）と同じ腕が速さを決める。
      built:
        deftness: {skill: skill_woodwork, from_stage: expert, minutes: -15}
        steps:
          # 台を組んで地面から離す。
          - requires:
              - {object: thick_branch, count: 6, consume: true}
            duration: 60
          # 編んだ葉で屋根を掛ける。
          - requires:
              - {object: woven_leaf, count: 3, consume: true}
            duration: 60
          # 縄で締める。
          - requires:
              - {object: rope, count: 1, consume: true}
            duration: 60
