# 粘土を採り、壺を成形して焼く連鎖（docs/world/SurvivalItems.md 4節）。焼き上がった甕（jar、
# liquid_containers.yaml）が、汲み置きできる最初の容器になる。
#
# **土器は料理の炉では焼かない。** 石囲いの炉（fire.yaml）は石12個で囲った内径40〜60cmの火床で、
# 壺を燃料ごと埋めて全周から包む空間が無い。加えて、水を含んだ石を何時間も高温に晒せば爆ぜる。
# 現実でも料理の炉と焼成の設備は別の構造物なので、ここでも分ける。
#
# **焼くのは使い捨ての覆い焼き（earth_kiln）。** 器と燃料をまとめて濡れた土で覆い、空気穴だけ残して
# 数時間焼き、冷めたら覆いを壊して取り出す。素焼きに要る600〜900℃はこれで届く——窯が1100℃超を
# 狙うのは炻器（焼き締め）のためで、水を溜めるだけの素焼きの壺には要らない。
#
# **レンガの炉は作らない。** 焼成レンガを作るにはレンガを焼く窯が先に要る。現実の順序は
# 「覆い焼き → そこでレンガを焼く → 恒久的な窯を建てる」なので、恒久窯を上位設備として足すなら、
# この順序ごと足すことになる。日干しレンガなら焼かずに作れるが、高温と熱衝撃で崩れるため
# 恒久窯にはならない。
#
# **割れるのは、乾かさずに焼いたときだけ。** 現実には乾かしても1〜3割が割れるが、その取りこぼしは
# 上のレンガの窯を入れるときに「割れにくい」という差分として渡したいので、乾き切った壺は必ず焼き
# 上がるようにしてある（unfired_jarのcooking_progress参照）。

object_defs:
  # 粘土。水際に堆積したものを手で掘り取る（掘り棒もシャベルも未実装なので、石と同じく素手）。
  #
  # **土・泥は挟まない。** どちらもオブジェクトとして存在せず、挟めば他に使い道の無い中間物が2つ
  # 増える。専用素材を最小限に抑える方針（docs/world/SurvivalItems.md 6節）に反する。
  clay:
    tags: [item]
    props:
      weight: {value: 800}
      # 練った土なので、重さのわりに嵩は小さい。
      volume: {value: 500}

  # 未焼成の壺。形になっただけの土で、水を入れれば崩れる。作った直後は濡れていて、置いておくと乾く。
  #
  # **重さの帳尻**: 粘土2個1600gから、乾燥で自由水が200g、焼成で結晶水がさらに200g抜けて、
  # 甕（jar）の1200gになる。**乾く前後で重さは変えない**——weightをtickごとに削る受動効果は書けるが、
  # 端数が出るだけで得るものが無いので、乾いた後の1400gで通す。
  #
  # **混和材（砂・貝殻）は入れない。** 現実には収縮割れを防ぐため2〜3割の混和材が要り、縄文土器にも
  # 砂や繊維が入っているが、砂も貝殻もオブジェクトとして存在せず、足せば使用先1つの専用素材になる
  # （樹脂を同じ理由で外したdocs/world/SurvivalItems.md 7節に倣う）。
  #
  # **potteryタグは焼く前と後の両方が持つ。** 覆い焼きの炉のfireスロットが見るタグで、焼き上がった
  # 甕がそのまま同じ枠に残るために要る——生肉と焼けた肉がどちらもroastableなのと同じ形
  # （どちらか一方だけに付けると、置き換わった側は枠に居られず地面へこぼれる）。
  unfired_jar:
    tags: [item, pottery]
    props:
      weight: {value: 1400}
      volume: {value: 15000}
      # 残っている水。日陰に置くだけで抜けていき、96tick＝24時間で乾き切る。
      #
      # **持つのは「残った水」1本だけで、乾燥度は持たない。** 下の焼成が、残った水をそのまま割れの
      # 重みとして使う（乾き切れば重み0＝割れない）ので、2つ目の値を置くと同じことを2箇所が
      # 言うことになる。
      #
      # **乾燥は工程ではなく、この受動効果。** 工程のdurationはキャラクタの時間なので、乾燥を工程に
      # すると1日じゅう乾くのを見ていることになる。焼成が炉の受動効果なのと揃える。
      moisture:
        value: 96
        range: {min: 0, max: 96}
        # 濡れているほど割れるので、空の側がgood。
        gauge: {min: good, max: bad}
        # 焼いてよいかは段で読ませる。乾き切るまでの残りではなく、今どれだけ危ないかを見せる。
        stages:
          - {name: bone_dry}
          - {name: leather_hard, min: 1, alert: watch}
          - {name: wet, min: 49, alert: caution}
        passives:
          - add: {self: {moisture: -1}}
      # 覆い焼きの炉が進める（docs/engine/FireSystem.md 7節）。高温（blaze、5/tick）なら
      # 24tick＝6時間。
      cooking_progress:
        value: 0
        range: {min: 0, max: 120}
        # **焼き上がりは、残っている水との賭け。** 成功の重みは満水と同じ96なので、乾き切って
        # いれば必ず甕になり、半乾き（48）で2/3、成形直後（96）で半々。濡れたまま火へ入れると、
        # 内に残った水が水蒸気になって器を割る。
        #
        # 炉の中でも水は抜け続ける（moistureの受動効果は場所を問わない）が、焼成が26tickなのに対し
        # 乾燥は96tickかかるので追いつかない。成形直後に火へ入れると、溢れる時点でまだ70残っていて、
        # 賭けは6割弱になる——現実の「あぶり焚き」（水を抜きながら焼く）がそのまま出ている。
        on_max:
          pick:
            - weight: {prop: moisture}
              signal: cracked
              destroy: self
            - weight: 96
              signal: fired
              destroy: self
              spawn: {object: jar}
    # 解放条件（conditions、13.3節）はまだ置かない。土器のスキルのプロパティと、それを伸ばす経路が
    # 未実装のため、今条件を置くと永久に作れなくなる（containers.yamlの編み籠と同じ）。
    recipes:
      coiled:
        steps:
          # 粘土の紐を巻き上げて壺の形にする。乾燥はここに含めない（moisture参照）。
          - requires:
              - {object: clay, count: 2, consume: true}
            duration: 90

  # 覆い焼きの炉。器と燃料を濡れた土で覆っただけの、一度きりの焼成設備。
  #
  # **「石囲いの炉では焼けない」の実体はこの枠。** 火力に条件を付けるのではなく、fireスロットが
  # 土器（pottery）しか受けないことで分けている。炉の梯子は既に「火に何を載せられるか」で差を付けている
  # （焚き火は器を載せられず、三石でcookwareが増える、docs/engine/FireSystem.md 6節）ので、
  # 新しい仕組みは要らない。覆って塞ぐぶん、逆にここでは焼き物も煮炊きもできない。
  earth_kiln:
    traits: [hearth]
    recipes:
      heaped:
        steps:
          # 器と薪を積み、練った粘土をかぶせて空気穴を突く。
          - requires:
              - {object: clay, count: 3, consume: true}
            duration: 90
    props:
      # かぶせた粘土3個ぶん（800×3）。
      weight: {value: 2400}
      # 丸太1本（fuel 200）でちょうど満ちる。太い枝なら10本——斧を持たない経路でも焚ける。
      fuel:
        value: 0
        range: {min: 0, max: 200}
      # 土をかぶせた火は熱を逃がさない。上限は石囲いの炉と同じで、違うのは何を載せられるかだけ。
      heat:
        range: {min: 0, max: 100}
    slots:
      fire:
        cells:
          - {accept: {tag: pottery}}
          - {accept: {tag: pottery}}
          - {accept: {tag: pottery}}
          - {accept: {tag: pottery}}
    passives:
      # 種火の衰え。土の覆いは熱を抱えるが、灰へ埋めて空気を絞る石囲いの炉ほどは保たない。
      - conditions:
          - {prop: heat, in_stage: ember}
          - {prop: fuel, in_stage: none}
        add: {self: {heat: -0.5}}
    interactions:
      # 覆いを壊して取り出す。中身は消える自分ではなく自分の親——炉が置かれた土地——へこぼれる
      # （9.3節）ので、焼き上がった壺は残る。
      break_open:
        trigger: menu
        duration: 15
        destroy: self
