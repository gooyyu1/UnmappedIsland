# 粘土を採り、壺と蓋を成形して焼く連鎖（docs/world/SurvivalItems.md 4節）。焼き上がった甕（jar、
# liquid_containers.yaml）が、汲み置きできる最初の容器になる。
#
# **土器は料理の炉では焼かない。** 石囲いの炉（fire.yaml）は石12個で囲った内径40〜60cmの火床で、
# 壺を燃料ごと埋めて全周から包む空間が無い。加えて、水を含んだ石を何時間も高温に晒せば爆ぜる。
# 現実でも料理の炉と焼成の設備は別の構造物なので、ここでも分ける。
#
# **焼くのは使い捨ての覆い焼き（earth_kiln）。** 器と燃料をまとめて濡れた土で覆い、空気穴だけ残して
# 数時間焼き、冷めたら覆いを壊して取り出す。素焼きに要る600〜900℃はこれで届く——窯が1100℃超を
# 狙うのは炻器（焼き締め）のためで、水を溜めるだけの素焼きの壺には要らない。
#
# **レンガの炉は作らない。** 焼成レンガを作るにはレンガを焼く窯が先に要り、現実の順序は
# 「覆い焼き → そこでレンガを焼く → 恒久的な窯を建てる」になる。上位の恒久窯は足さないと決めて
# あるので（docs/world/SurvivalItems.md 4節）、この順序ごと入らない。日干しレンガなら焼かずに
# 作れるが、高温と熱衝撃で崩れるため恒久窯にはならない。
#
# **割れるのは、乾かさずに焼いたときだけ。** 現実には乾かしても1〜3割が割れるが、その取りこぼしは
# 入れない。乾かして焼いた壺が抽選で割れると、罰が「もう一度同じ壺を作る」になり、判断が1つも
# 増えないため（docs/concept/DesignPrinciples.md「失敗の罰に、同じ作業のやり直しを課さない」）。
# 乾き切った壺は必ず焼き上がる（unfired_jarのcooking_progress参照）。

traits:
  # 焼く前の土器。**乾き方も焼き上がるまでの速さも、器の形では変わらない**——同じ覆い焼きの炉へ
  # 一緒に入れて一度に焼くものなので、壺も蓋もここが持つ値を共有する。型ごとに違うのは
  # 「焼き上がって何になるか」だけで、それは各型がcooking_progressのon_maxとして書く。
  #
  # **potteryタグは焼く前と後の両方が持つ。** 覆い焼きの炉のfireスロットが見るタグで、焼き上がった
  # 器がそのまま同じ枠に残るために要る——生肉と焼けた肉がどちらもroastableなのと同じ形
  # （どちらか一方だけに付けると、置き換わった側は枠に居られず地面へこぼれる）。
  greenware:
    tags: [item, pottery]
    props:
      # 残っている水。日陰に置くだけで抜けていき、96 tick（24時間）で乾き切る。
      #
      # **持つのは「残った水」1本だけで、乾燥度は持たない。** 下の焼成が、残った水をそのまま割れの
      # 重みとして使う（乾き切れば重み0＝割れない）ので、2つ目の値を置くと同じことを2箇所が
      # 言うことになる。
      #
      # **乾燥は工程ではなく、この受動効果。** 工程のdurationはキャラクタの時間なので、乾燥を工程に
      # すると1日じゅう乾くのを見ていることになる。焼成が炉の受動効果なのと揃える。
      moisture:
        value: 96
        range: {min: 0, max: 96}
        # 濡れているほど割れるので、空の側がgood。
        gauge: {min: good, max: bad}
        # 焼いてよいかは段で読ませる。乾き切るまでの残りではなく、今どれだけ危ないかを見せる。
        stages:
          - {name: bone_dry}
          - {name: leather_hard, min: 1, alert: watch}
          - {name: wet, min: 49, alert: caution}
        passives:
          - add: {self: {moisture: -1}}
      # 覆い焼きの炉が進める（docs/engine/FireSystem.md 7節）。高温（blaze、5/tick）なら
      # 24 tick（6時間）。
      #
      # **焼き上がりは、残っている水との賭け。** 各型のon_maxが並べる成功の重みは満水と同じ96なので、
      # 乾き切っていれば必ず焼き上がり、半乾き（48）で2/3、成形直後（96）で半々。濡れたまま火へ
      # 入れると、内に残った水が水蒸気になって器を割る。
      #
      # 炉の中でも水は抜け続ける（moistureの受動効果は場所を問わない）が、焼成が26tickなのに対し
      # 乾燥は96tickかかるので追いつかない。成形直後に火へ入れると、溢れる時点でまだ70残っていて、
      # 賭けは6割弱になる——現実の「あぶり焚き」（水を抜きながら焼く）がそのまま出ている。
      cooking_progress:
        value: 0
        range: {min: 0, max: 120}

object_defs:
  # 粘土。水際に堆積したものを手で掘り取る（掘り棒もシャベルも未実装なので、石と同じく素手）。
  #
  # **土・泥は挟まない。** どちらもオブジェクトとして存在せず、挟めば他に使い道の無い中間物が2つ
  # 増える。専用素材を最小限に抑える方針（docs/world/SurvivalItems.md 6節）に反する。
  clay:
    tags: [item]
    props:
      weight: {value: 800}
      # 練った土なので、重さのわりに嵩は小さい。
      volume: {value: 500}

  # 未焼成の壺。形になっただけの土で、水を入れれば崩れる。作った直後は濡れていて、置いておくと乾く。
  #
  # **重さの帳尻**: 粘土2個1600gから、乾燥で自由水が200g、焼成で結晶水がさらに200g抜けて、
  # 甕（jar）の1200gになる。**乾く前後で重さは変えない**——weightをtickごとに削る受動効果は書けるが、
  # 端数が出るだけで得るものが無いので、乾いた後の1400gで通す。
  #
  # **混和材（砂・貝殻）は入れない。** 現実には収縮割れを防ぐため2〜3割の混和材が要り、縄文土器にも
  # 砂や繊維が入っているが、砂も貝殻もオブジェクトとして存在せず、足せば使用先1つの専用素材になる
  # （樹脂を同じ理由で外したdocs/world/SurvivalItems.md 7節に倣う）。
  unfired_jar:
    traits: [greenware]
    props:
      weight: {value: 1400}
      volume: {value: 15000}
      cooking_progress:
        on_max:
          pick:
            - weight: {prop: moisture}
              signal: cracked
              destroy: self
            - weight: 96
              signal: fired
              destroy: self
              spawn: {object: jar}
    # **解放条件を持たない。** 器を挽く腕を担うスキルが一覧（docs/world/Skills.md 2節）に無い。
    # 火が担うのは本焼きの温度だけで、成形はどの本にも属していない。**手際も同じ理由で名乗らない**
    # （同7.1節）——名乗れる先がそもそも無い。
    recipes:
      coiled:
        steps:
          # 粘土の紐を巻き上げて壺の形にする。乾燥はここに含めない（moisture参照）。
          # **底と胴で工程を分けてある**（1回は1時間まで、docs/engine/ActionSystem.md 6.3節）。
          - requires:
              - {object: clay, count: 1, consume: true}
            duration: 45
          - requires:
              - {object: clay, count: 1, consume: true}
            duration: 45

  # 未焼成の甕の蓋。壺と同じ粘土を平たく伸ばしただけのもので、乾かして焼けば蓋（jar_lid、
  # liquid_containers.yaml）になる。
  #
  # **重さの帳尻**: 甕は口が狭いので、蓋は粘土1個を使い切らない。800gのうち200gを削り落とした600gから、
  # 乾燥で自由水が100g、焼成で結晶水がさらに100g抜けて、蓋の400gになる（粘土1個あたり乾燥100g・
  # 焼成100gは壺と同じ）。**削った土を粘土へ戻さない**のは、そりの削り落としと同じ扱い
  # （containers.yaml）——1個より細かい粘土は物として存在しない。
  #
  # **工程は1つ。** 巻き上げる胴を持たないので、平たく伸ばして縁を立てるだけで形になる。
  #
  # **蓋のために炉は増えない。** 覆い焼きの炉のfire枠は個数の上限を書いていない（下のearth_kiln）ので、
  # 甕と蓋を並べて一度に焼ける。蓋の代価は粘土1個と成形の時間だけで、上限を書けば
  # tests/world-codex/potteryYaml.test.tsが落ちる。
  unfired_jar_lid:
    traits: [greenware]
    props:
      weight: {value: 500}
      # 甕の口を覆う円板。重ねて置けるので、1枚ぶんの外寸より小さく見る（ヤシの殻と同じ）。
      volume: {value: 300}
      cooking_progress:
        on_max:
          pick:
            - weight: {prop: moisture}
              signal: cracked
              destroy: self
            - weight: 96
              signal: fired
              destroy: self
              spawn: {object: jar_lid}
    # 壺と同じ理由で解放条件も手際も名乗らない（上）。
    recipes:
      pressed:
        steps:
          - requires:
              - {object: clay, count: 1, consume: true}
            duration: 30

  # 覆い焼きの炉。器と燃料を濡れた土で覆っただけの、一度きりの焼成設備。
  #
  # **「石囲いの炉では焼けない」の実体はこの枠。** 火力に条件を付けるのではなく、fireスロットが
  # 土器（pottery）しか受けないことで分けている。炉の梯子は既に「火に何を載せられるか」で差を付けている
  # （焚き火は器を載せられず、三石でcookwareが増える、docs/engine/FireSystem.md 6節）ので、
  # 新しい仕組みは要らない。覆って塞ぐぶん、逆にここでは焼き物も煮炊きもできない。
  earth_kiln:
    traits: [hearth]
    # **解放条件を持たない。** 火の腕が効くのは着火の重みだけで、火力にも炉の作り方にも効かない
    # （docs/engine/FireSystem.md 10節）。本焼きに要る高温を分けているのは、この型のheatとfireスロット
    # そのもの（上）。**手際も名乗らない**（docs/world/Skills.md 7.1節）——器と薪を積んで粘土を
    # かぶせるだけで、削る工程も縛る工程も持たない。
    recipes:
      heaped:
        steps:
          # 器と薪を積み、練った粘土をかぶせる。
          - requires:
              - {object: clay, count: 2, consume: true}
            duration: 45
          # 目張りして空気穴を突く。
          - requires:
              - {object: clay, count: 1, consume: true}
            duration: 45
    props:
      # かぶせた粘土3個ぶん（800×3）。
      weight: {value: 2400}
      # 丸太1本（fuel 200）でちょうど満ちる。太い枝なら10本——斧を持たない経路でも焚ける。
      fuel:
        value: 0
        range: {min: 0, max: 200}
      # 土をかぶせた火は熱を逃がさない。上限は石囲いの炉と同じで、違うのは何を載せられるかだけ。
      heat:
        range: {min: 0, max: 100}
    slots:
      fire:
        cells:
          - {accept: {tag: pottery}}
          - {accept: {tag: pottery}}
          - {accept: {tag: pottery}}
          - {accept: {tag: pottery}}
    passives:
      # 種火の衰え。土の覆いは熱を抱えるが、灰へ埋めて空気を絞る石囲いの炉ほどは保たない。
      - conditions:
          - {prop: heat, in_stage: ember}
          - {prop: fuel, in_stage: none}
        add: {self: {heat: -0.5}}
    interactions:
      # 満杯なら断る理由を出す（fire.yamlのhearthのadd_fuel）。値は上のfuelのrange.max。
      add_fuel:
        conditions:
          - {reason: hearth_full, prop: fuel, lt: 200}
      # 覆いを壊して取り出す。中身は消える自分ではなく自分の親——炉が置かれた土地——へこぼれる
      # （9.3節）ので、焼き上がった壺は残る。
      break_open:
        trigger: menu
        duration: 15
        destroy: self
