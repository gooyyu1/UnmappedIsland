# 怪我（injuryタグ）の定義。キャラクタと動物のinjuriesスロットに入る
# （characters/player_character.yaml・animals.yamlのbeast trait）。
# 種類ごとの値の決め方は docs/engine/InjurySystem.md 2節 参照。

traits:
  # 負った怪我そのもの。**身体の一部として振る舞う**——本人から剥がせず、束ねられず、それ自体には
  # 重さが無い。残る長さ・痛みの重さ・血の流れ方は種類ごとに違う（docs/engine/InjurySystem.md 2節）。
  injury:
    tags: [injury]
    # 身体から離れた「捻挫」は存在しない（7.9節）。負った本人から剥がせず、本人が消えれば
    # 一緒に消える。当てていた治療具は道連れにならず、こぼれ出る。
    bound_to_owner: true
    # 同じ怪我を2つ負っても束ねない。手当ては1つずつ当てるものなので、束ねると代表の1つにしか
    # 治療具を当てられなくなる（かごと同じ理由。SlotSystem.md 4節）。
    stackable: false
    props:
      # 傷そのものに目方は無い。それでも宣言が要るのは、当てた治療具の重さを負った本人へ渡す口に
      # なるため（ContainerSystem.md 1節）——実効値は中身から来るので、実体値は0のまま。
      weight: {value: 0}

  # 手当てのできる怪我。治療具（treatments.yaml）を1つだけ当てておける。
  treatable:
    # 怪我を代表する物のスロット（7.8節）。カードを押すと治療具が並ぶ——付け外しの唯一の経路。
    # 外から見えるもの（7.11節）。当てている手当ては傷の上に見えている。
    visible_slots: [treatment]
    slots:
      # 当てている治療具。**1枠に1つだけ**——包帯の上から添え木を、のような重ね掛けは、効き目の
      # 足し合わせ方が決まっていない（docs/engine/InjurySystem.md 3節の手当て）。maxが要るのは、包帯は
      # 手持ちでは束ねたい物（stackable）だから。当てる場所は1つしかない。
      treatment:
        cell_count: 1
        cell: {accept: {tag: treatment}, max: 1}
        # 当てるのに手間がかかる（7.11節）。どの経路で入れても同じ値段になるので、怪我のカードへ
        # 重ねても子ウィンドウの枠へ落としても30分。外すのは一瞬（枠は入る側にしか時間を課さない）。
        put_in: {duration: 30}

  # 皮膚が破れた傷（docs/engine/InjurySystem.md 6節）。**bleedingを持つ傷にだけ配る**——捻挫・骨折・
  # 打ち身は皮膚の下で起きるので、汚れの入る傷口も、洗う水の届く傷口も無い。
  open_wound:
    props:
      # 膿み具合。**局所の値**で、全身へ回った菌はキャラクタ・獣の側が持つ（pathogen、
      # DigestionSystem.md 6節）。増えるほど悪いのでseverityと同じ向き（CardView.md 8.1節）。
      #
      # **負った瞬間は清潔で、開いたままの時間が汚す**（InjurySystem.md 6節の未決事項に対する仮決め）。
      # 健康な体では1時間で1（0.25/tick）なので、放っておけば1.7日でfestering、3.3日でsepticへ届く
      # ——**最も短く残る傷（bite_wound、360 tick）でも、治りきる前に敗血症へ入る**位置。洗う1杯（-25）は
      # ちょうど1日ぶんの汚れを落とすので、**開いた傷1つにつき1日1杯**が保つための代償になる（同 6.2節）。
      infection:
        gauge: {min: good, max: bad}
        value: 0
        range: {min: 0, max: 100}
        stages:
          - {name: clean}
          - {name: festering, min: 40, alert: caution}
          - {name: septic, min: 80, alert: danger}
        passives:
          # 素の速さは、免疫が菌の増殖に負けている体のもの。
          - add:
              self:
                infection: 0.30
          # **免疫は傷を下げず、汚れる速さを鈍らせるだけ**（InjurySystem.md 6.2節）。下げる手立てを
          # 洗うことだけに保つためで、免疫が傷そのものを引くと水の乏しさが効かなくなる。局所の免疫応答
          # としても、傷口の汚れが免疫で消えるわけではない。
          #
          # **鈍るのは、全身で増殖を抑え込めている段から上**（DigestionSystem.md 6.2節の除去 > 増殖）。
          # 段が1つ上がるごとに0.05で、健康な体（robust）がちょうど上の1時間で1、罹って高まった体
          # （primed）はその8割。**増殖に負けている段では素の速さのまま**——弱った体では傷も速く膿む、
          # が段の並びからそのまま出る。
          #
          # 宛先を持たない相手（immunityを宣言していない物）では鈍らないだけで、素の速さは残る。
          - conditions: [{subject: parent, prop: immunity, in_stage_or_above: robust}]
            add:
              self:
                infection: -0.05
          - conditions: [{subject: parent, prop: immunity, in_stage_or_above: primed}]
            add:
              self:
                infection: -0.05
    interactions:
      # 水を掛けて洗う（docs/engine/InjurySystem.md 6.2節）。**下げる手立てはこれだけ**で、治療具が
      # 効くのは上がり方の側。
      #
      # **宣言は傷の側**（12.3節）——水は自分が何を洗えるかを知らない。真水と湯の区別も持たない
      # （落とすのは傷口に入った汚れなので、沸かしてあるかは効き目を変えない。liquid_containers.yaml）。
      #
      # **治療具を当てたままでも洗える。** 外させると1回ごとに付け直しの30分（InjurySystem.md 3節）が
      # 乗り、手間の本体が水から時間へすり替わる。
      wash:
        trigger: {drag: {tag: cleansing}}
        # 治療具を当てる30分の半分。**重さを時間ではなく水に持たせる**——時間の側を重くすると、
        # 水の乏しさと関わりなく手間だけが増える（InjurySystem.md 6.2節）。
        duration: 15
        conditions:
          - {reason: not_enough_water, subject: instrument, prop: fill, gte: 250}
          - {reason: already_clean, subject: self, prop: infection, gte: 1}
        # 250mLは飲用1回ぶん（liquid_containers.yamlのdrink）。**洗うとはその1杯を飲まずに捨てること**
        # なので、器へ戻さず捨てる（水をやる操作のようなtransferではない）。
        add:
          instrument: {fill: -250}
          self: {infection: -25}
    passives:
      # 膿んだ傷は、宿主の全身へ菌を押し出す（docs/engine/InjurySystem.md 6.3節）。**傷が削るのは
      # ここまで**で、水と血を削るのは全身の菌の側（characters/player_character.yaml・animals.yamlの
      # pathogen）。傷は局所の膿み具合だけを持ち、そこから先の症状も死に方も知らない。
      #
      # 押し上げる量は、全身の除去（免疫の段ごとの定数）と増殖（+0.15/tick）に対して読む。膿んだだけの
      # 傷が向かう先は、**体の状態と傷の数で分かれる**。
      #
      # - **健康な体（robust、除去0.20）に傷1つでは届かない。** 菌ゼロのあいだ増殖は止まっている
      #   （DigestionSystem.md 6.1節）ので、除去だけで打ち消されて0に留まる。
      # - **弱った体（増殖を抑え込めていない段、除去は最も高くて0.10）では1つでも入り込む。** 入れば
      #   増殖（+0.15）が加わって除去を大きく上回るので、免疫を戻すのでは追いつかない——止めるのは
      #   洗うことだけ。
      # - **2つ負えば流入も2倍で、健康な体でも越える**（0.24 > 0.20）。しかも最も高い免疫でも
      #   抑え込めない（0.24 + 0.15 > 0.30）ので、洗う以外に止まらない——多発外傷が危険なのは、
      #   傷ごとの特別扱いではなくこの足し合わせから出る。
      - conditions: [{prop: infection, in_stage: festering}]
        add:
          parent:
            pathogen: 0.12
      # 腐り切った傷は、いちばん高い免疫（primed、-0.3）でも抑え込めない量を送り込む——健康な体では
      # 正味+0.3/tick（免疫が高まっても+0.2/tick）で押し上がり、危険域（septicemic、7）まで6時間。
      # そこから先は全身の菌が血を削る。
      # **気づいてから原因を断つ時間はある**（2杯・30分で安全域へ戻る、InjurySystem.md 6.2節）。
      - conditions: [{prop: infection, in_stage: septic}]
        add:
          parent:
            pathogen: 0.35

object_defs:
  # 足首の捻挫。ヤシの木から降りそこねたときに負う（coconut.yamlのpick_green_coconut）。
  sprained_ankle:
    traits: [injury, treatable]
    props:
      # 残っている傷の重さ。自然に治る速さを基準レートに置き（-1/tick、6.0節）、maxが「その速さで
      # 何tickぶんか」＝ 960 tick（10日）を表す。
      #
      # **痛みの割に長い。** 関節の傷は塞がって終わらず、動かすたびにやり直しになるので、痛みが
      # 軽くてもどの皮膚の傷より長く残る（docs/engine/InjurySystem.md 2節）。
      severity:
        # 残っている傷は減るほど良いので、耐久度とは向きが逆（CardView.md 8節）。
        gauge: {min: good, max: bad}
        value: 960
        range: {min: 0, max: 960}
        # 段はそのまま怪我カードのバーの色になる（CardView.md 8節 カードの状態バー）。捻挫は
        # 負った直後でも要注意域までで、危険域は骨折のようなより重い怪我のために空けておく。
        stages:
          - {name: mending}
          - {name: sore, min: 320, alert: watch}
          - {name: acute, min: 640, alert: caution}
        passives:
          - add:
              self:
                severity: -1
        on_min:
          destroy: self
    passives:
      # 怪我はinjuriesスロットにしか入らないので、親は常にそれを負った本人。
      - modify:
          parent:
            pain: 40

  # 裂傷。**鈍い刃で裂かれた傷**——尖った石のように切れ味の悪い物で殴ると、皮膚は切られるのではなく
  # 潰されて裂ける。打撲の成分は傷ではなくshockが持つ（docs/engine/VitalsSystem.md 2.1節）ので、
  # 一撃で2つの怪我を作る必要はない。切れる刃で作る切創は、その刃が実装されたときに別の型を足す。
  #
  # キャラクタと動物が同じ物を負う（docs/engine/HuntingSystem.md 3節）ので、負わせる側
  # （animals.yamlのstrike）は相手がどちらかを知らない。
  laceration:
    traits: [injury, treatable, open_wound]
    props:
      # 自然に治るまで480 tick（5日）。捻挫より浅い傷なので、同じ-1/tickでも早く引く。
      severity:
        # 残っている傷は減るほど良いので、耐久度とは向きが逆（CardView.md 8節）。
        gauge: {min: good, max: bad}
        value: 480
        range: {min: 0, max: 480}
        stages:
          - {name: mending}
          - {name: sore, min: 160, alert: watch}
          - {name: acute, min: 320, alert: caution}
        passives:
          - add:
              self:
                severity: -1
        on_min:
          destroy: self
      # 今この傷から流れている血の勢い（docs/engine/VitalsSystem.md 4節）。
      #
      # **傷の重さとは別の時間で動く。** 血は放っておいても固まって止まるので、傷が塞がるより
      # ずっと早く——4 tick（1時間）で——0になる。severityの段で出血を表すと、傷が治るまで
      # 何日も流れ続けることになり、掠り傷でも必ず死ぬ。
      bleeding:
        value: 100
        range: {min: 0, max: 100}
        passives:
          - add:
              self:
                bleeding: -25
    passives:
      # 痛みを宣言していない相手に刺さった場合、この寄与は宛先が無いので効かない。怪我の側は
      # 相手を選ばず、同じ1つの定義でキャラクタにも動物にも刺さる。
      - modify:
          parent:
            pain: 50
      # 流れている間だけ、負った本人の血が減る（VitalsSystem.md 4節）。-15は毎時60mL——
      # **潰れた血管は縮んで塞がるので、切創ほどは出ない**。固まるまでの合計は60mLで、ヒトの
      # 5,000mLには響かないが、サル（400mL）には1割半に当たる。**同じ傷が、体格で意味を変える。**
      #
      # 止血できる治療具（hemostatic）を当てている間はここが閉じる。包帯はそのタグを持たず、
      # 代わりに固まるのを早める（treatments.yaml、InjurySystem.md 3.1節）。
      - conditions:
          - {prop: bleeding, gte: 1}
          - not: {slot: treatment, matches: {tag: hemostatic}}
        add:
          parent:
            blood: -15

  # 刺し傷。**穂先が深く突き通した傷**——槍で突かれたときに負う（tools.yamlのspear、
  # animals.yamlのstrikeの刺突の候補）。杭を打った落とし穴（traps.yaml）に落ちた獣も同じ傷を負う
  # ——上から落ちて杭に貫かれるのは、突かれるのと同じ深さの傷（docs/engine/TrapSystem.md 5.2節）。
  #
  # **裂傷との違いは血の流れる速さで、桁で書き分ける**（docs/engine/VitalsSystem.md 4節）。潰れた
  # 血管が縮んで塞がる裂傷（-15/tick）に対し、刺し傷は深部の血管を開いたまま残すので-250/tick。
  # 固まるまでの4tickで合計1,000mL——サル（400mL）なら30分で死に、イノシシ（4,600mL）でも数突きで
  # 危機に届く。**同じ傷が、体格で意味を変える。**
  #
  # 衝撃（shock）はほとんど生まれないので、**突かれた獲物はその場では倒れない**。深手を負ったまま
  # 逃げる相手を追うことになる。
  puncture_wound:
    traits: [injury, treatable, open_wound]
    props:
      # 自然に治るまで720 tick（7.5日）。裂傷より深いぶん、捻挫と同じ桁まで長引く。
      severity:
        # 残っている傷は減るほど良いので、耐久度とは向きが逆（CardView.md 8節）。
        gauge: {min: good, max: bad}
        value: 720
        range: {min: 0, max: 720}
        stages:
          - {name: mending}
          - {name: sore, min: 240, alert: watch}
          - {name: acute, min: 480, alert: caution}
        passives:
          - add:
              self:
                severity: -1
        on_min:
          destroy: self
      # 固まるまでの速さは裂傷と同じ4 tick。変わるのは下の流れる量だけ。
      bleeding:
        value: 100
        range: {min: 0, max: 100}
        passives:
          - add:
              self:
                bleeding: -25
    passives:
      - modify:
          parent:
            pain: 60
      - conditions:
          - {prop: bleeding, gte: 1}
          - not: {slot: treatment, matches: {tag: hemostatic}}
        add:
          parent:
            blood: -250

  # 噛まれた傷。動物の1手（docs/engine/HuntingSystem.md 5節）のうち、小さい獣が持つ攻め手が残す。
  # 歯が並んで食い込むので、裂傷より浅い代わりに縁が細かく、血は同じ速さで止まる。
  #
  # **同じ傷が、噛んだ相手によらず同じ深さになる。** 傷の種類は候補（噛む・牙で突く）が持ち、
  # どちらを引きやすいかだけが動物ごとに違う（重み配分）——武器の側が威力ではなく当たり所の配分だけを
  # 宣言するのと同じ形（同1.2節）。
  bite_wound:
    traits: [injury, treatable, open_wound]
    props:
      # 自然に治るまで360 tick（3.75日）。裂傷（480）より浅い。
      severity:
        # 残っている傷は減るほど良いので、耐久度とは向きが逆（CardView.md 8節）。
        gauge: {min: good, max: bad}
        value: 360
        range: {min: 0, max: 360}
        stages:
          - {name: mending}
          - {name: sore, min: 120, alert: watch}
          - {name: acute, min: 240, alert: caution}
        passives:
          - add:
              self:
                severity: -1
        on_min:
          destroy: self
      # 固まるまでの速さは裂傷と同じ4 tick。
      bleeding:
        value: 100
        range: {min: 0, max: 100}
        passives:
          - add:
              self:
                bleeding: -25
    passives:
      - modify:
          parent:
            pain: 40
      # 固まるまでの合計は40mL。ヒトには響かないが、噛まれた側が小動物なら1割を超える。
      - conditions:
          - {prop: bleeding, gte: 1}
          - not: {slot: treatment, matches: {tag: hemostatic}}
        add:
          parent:
            blood: -10

  # 牙で突かれた傷。イノシシの1手（docs/engine/HuntingSystem.md 5節）が残す、この島で最も重い傷。
  # 下から突き上げる牙が深部を裂くので、**刺し傷と同じ桁で血が流れる**（injuries.yamlの中で
  # puncture_woundと並ぶ2つだけ）。手当てが間に合わなければ、その場を離れても倒れる。
  gore_wound:
    traits: [injury, treatable, open_wound]
    props:
      # 自然に治るまで720 tick（7.5日）。刺し傷と同じ深さの傷として扱う。
      severity:
        # 残っている傷は減るほど良いので、耐久度とは向きが逆（CardView.md 8節）。
        gauge: {min: good, max: bad}
        value: 720
        range: {min: 0, max: 720}
        stages:
          - {name: mending}
          - {name: sore, min: 240, alert: watch}
          - {name: acute, min: 480, alert: caution}
        passives:
          - add:
              self:
                severity: -1
        on_min:
          destroy: self
      bleeding:
        value: 100
        range: {min: 0, max: 100}
        passives:
          - add:
              self:
                bleeding: -25
    passives:
      - modify:
          parent:
            pain: 60
      # 固まるまでの4tickで合計600mL。ヒトの5,000mLの1割強で、2度突かれれば意識が薄れ始める。
      - conditions:
          - {prop: bleeding, gte: 1}
          - not: {slot: treatment, matches: {tag: hemostatic}}
        add:
          parent:
            blood: -150

  # くくり罠の傷（docs/engine/TrapSystem.md 5.1節）。縄が食い込んで裂ける傷で、鈍器で裂かれる
  # laceration より浅い。
  #
  # **掛かり方の深さを生成時に1回だけロールする**（6.2節）。奪うのは30〜60mLで、生死が分かれるのは
  # 血がこの幅に収まる獣だけ——今の顔ぶれではネズミ（6mL）が必ず死に、ヤケイ（80mL）以上は生き残る。
  snare_laceration:
    traits: [injury, treatable, open_wound]
    props:
      # 自然に治るまで240〜480 tick（2.5〜5日）。深く食い込んだ個体ほど長く残る。
      severity:
        # 残っている傷は減るほど良いので、耐久度とは向きが逆（CardView.md 8節）。
        gauge: {min: good, max: bad}
        value: {min: 240, max: 480}
        range: {min: 0, max: 480}
        stages:
          - {name: mending}
          - {name: sore, min: 160, alert: watch}
          - {name: acute, min: 320, alert: caution}
        passives:
          - add:
              self:
                severity: -1
        on_min:
          destroy: self
      # 2〜4 tickで固まり、その間に30〜60mLを奪う。レートは laceration と同じ-15/tickで、
      # 変わるのは初期値の幅だけ——罠は傷の勢いではなく、掛かりの深さでばらつく。
      bleeding:
        value: {min: 40, max: 100}
        range: {min: 0, max: 100}
        passives:
          - add:
              self:
                bleeding: -25
    passives:
      - modify:
          parent:
            pain: 50
      - conditions:
          - {prop: bleeding, gte: 1}
          - not: {slot: treatment, matches: {tag: hemostatic}}
        add:
          parent:
            blood: -15

  # 骨折（docs/engine/InjurySystem.md 5節）。**残すのは重い罠と大型の獣だけ**と決めてある——別格で
  # あることを支えているのは量ではなく原因の少なさなので、どこからでも出る傷にしない。部位でも原因でも
  # 分けず、島にある骨折はこの1枚だけ。
  #
  # **血ではなく動きを奪う。** 皮膚の下で折れるのでbleedingを持たず、代わりに宿主のload（荷重）を
  # 押し上げる。**担げる量が減るのではなく、同じ荷が重く感じる**向きなので、荷重が駆動する3つ
  # ——移動の可否・歩みの速さ・staminaの削り（docs/world/Characters.md 荷重の効き方節）——へ
  # まとめて効く。傷の側に移動の規則は1行も無い。
  #
  # **ただし負えるのは人だけ。** 奪う動きを駆動するのはloadで、loadを持つのはキャラクタだけ
  # （ContainerSystem.md 2節）なので、獣へ刺しても痛み以外は何も動かない。罠に掛かるのは獣なので、
  # **今この島で骨折を刺しているのは大型の獣の1手だけ**（animals.yamlのcrush）で、落とし穴が獣へ
  # 残すのは檻と同じ打ち身（下のbruise）になる。
  fracture:
    traits: [injury, treatable]
    props:
      # 自然に治るまで1,008〜1,344 tick（10.5〜14日）。**島にある傷の中で最も長い**——次に長い
      # 捻挫（960 tick）を、最も軽い折れ方でも上回る。骨折が別格であることをロールの下振れで
      # 崩さないため、幅の下端を捻挫より上に置く。
      #
      # 14日は現実の6〜12週を4分の1へ縮めた長さ（docs/concept/DesignPrinciples.md）。幅そのものは
      # **折れ方の違い**を生成時に1回ロールしたもの（6.2節）で、部位を分ける代わりにここが引き受ける。
      severity:
        # 残っている傷は減るほど良いので、耐久度とは向きが逆（CardView.md 8節）。
        gauge: {min: good, max: bad}
        value: {min: 1008, max: 1344}
        range: {min: 0, max: 1344}
        # **危険域まで刻む唯一の傷。** 他の傷が負った直後でも要注意域までに留まるのは、この段を
        # 骨折のために空けておいたから（docs/engine/InjurySystem.md 2節）。
        stages:
          - {name: mending}
          - {name: sore, min: 448, alert: caution}
          - {name: acute, min: 896, alert: danger}
        passives:
          - add:
              self:
                severity: -1
        on_min:
          destroy: self
    passives:
      # **1枚で危険域へ届く痛み**（player_characterのunbearableは83）。2節が「1つで危険域に届く量は
      # 重い怪我のために取っておく」と空けておいた枠がここで、他の傷は最も重いgore_woundでも60。
      - modify:
          parent:
            pain: 85
      # 同じ荷が重く感じる（docs/engine/InjurySystem.md 5節）。**空身なら歩けるが、普段どおりの荷では
      # too_heavyに届く**位置に置く。18,000gは、担げる量が最も少ない技師（27,000g）から最も多い農夫
      # （36,000g）まで、**空身ならどのキャラクタもheavyの段**（道は通れる）に収まる位置で、そこから
      # too_heavyまでの残りは4.5〜12kg——担ぎ慣れの個人差（loadのmax）が、そのまま折れた脚で運べる
      # 量の差になる。
      #
      # 量そのものの釣り合いは、荷重が移動の速さと疲れへ効く形が入って初めて見える（同 未決事項）。
      #
      # **添え木で固定している間は半分に緩む**（immobilizing、treatments.yaml）。緩んだ後の量を
      # 押し上げている側が持つのは、hemostaticで出血のゲートを開け閉めするのと同じ形（同3.1節）
      # ——治療具の側に「-9,000」と書くと、押し上げていない傷（捻挫）へ当てたときに無傷より軽くなる。
      # 9,000gなら、空身は通れる段まで戻り、普段どおりの荷（ヤシの実5つ）でも道を通れる。
      - conditions:
          - not: {slot: treatment, matches: {tag: immobilizing}}
        modify:
          parent:
            load: 18000
      - conditions:
          - {slot: treatment, matches: {tag: immobilizing}}
        modify:
          parent:
            load: 9000

  # 生かす罠の打ち身（docs/engine/TrapSystem.md 5.1節・5.2節）。閉じ込められた獣が丸太へ、落ちた獣が
  # 穴の底へ体を打ちつけて負う傷で、**bleedingを持たない**。
  #
  # 生かす罠の性格は、この空白そのものでできている（同5.2節）。血を奪わないので体格によらず死なず、
  # 60kgのイノシシも1kgのヤケイも、痛みを抱えたまま生きて枠の中に残る——**無傷では捕らえないが、
  # 殺しもしない**。
  bruise:
    traits: [injury, treatable]
    props:
      # 自然に治るまで120〜240 tick（1.25〜2.5日）。裂ける傷（snare_laceration）より浅いので短い。
      # 幅は**ぶつかり方の激しさ**を生成時に1回ロールしたもの（6.2節）で、深さが失う血の量を分ける
      # 裂傷と違い、ここで変わるのは落ち着くまでの長さだけ。
      severity:
        # 残っている傷は減るほど良いので、耐久度とは向きが逆（CardView.md 8節）。
        gauge: {min: good, max: bad}
        value: {min: 120, max: 240}
        range: {min: 0, max: 240}
        stages:
          - {name: mending}
          - {name: sore, min: 80, alert: watch}
          - {name: acute, min: 160, alert: caution}
        passives:
          - add:
              self:
                severity: -1
        on_min:
          destroy: self
    passives:
      - modify:
          parent:
            pain: 30
