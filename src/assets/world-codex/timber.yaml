# 木を伐って木材を採る連鎖（docs/world/SurvivalItems.md 0節）。**採れる木材は太さで分かれ、
# 分かれ目は採るのに要る道具**（同0節「分けるのは、採るのに要る物が変わるときだけ」）。
#
# 太った幹は柄の遠心力が乗る道具でなければ断てないので、石斧を作ることがそのまま丸太＝筏
# （voyage.yaml）への入口になる。**丸太を出すものは2つある**（立ち木と、海岸へ打ち上げられた
# 流木の幹）が、**どちらも斧を要求する**ので、この入口は1つのまま。若木の幹はまだ細く、草の茎
# （fiber.yaml）・ヤシの葉（weaving.yaml）と同じく刃物で断てるため、こちらは斧を待たない。
#
# 丸太は1本20kgで、荷重の限界（キャラクタのload、docs/world/Characters.md）に対して1本ずつしか
# 運べない重さにしてある。筏に6本要るので、拠点をどこに置くかが運搬の手間を決める。
#
# 同じ木から樹皮も剥ぐ。倒さずに立ったまま剥げるので、丸太とは別の入口になる（なめし革へ繋がる
# 先はclothing.yaml）。

object_defs:
  # 広葉樹。幹が太く、倒せば丸太が採れる唯一の木。
  # ヤシの木（coconut.yaml）は幹が繊維の束で丸太にならないため、こちらは別の物として置く。
  broadleaf_tree:
    tags: [fixture]
    props:
      # 立ち木1本ぶん。倒して採れるのは丸太2本と太枝3本（43kg）で、残りは根と梢と枝葉。
      weight: {value: 150000}
      # 斧を入れる作業1回ぶんにかかる時間（docs/engine/ActionSystem.md 6.3節）。**どの腕がどの段から
      # どれだけ縮めるかは、この操作が自分で宣言する**（docs/world/Skills.md 7節）。丸太を要る物は
      # 数えるほどなので、効き始めるのは最上段。
      fell_minutes:
        value: 60
        passives:
          - conditions:
              - {subject: agent, prop: skill_woodwork, in_stage_or_above: expert}
            modify: {self: {fell_minutes: -15}}
      # まだ断ち切れずに残っている幹。**斧を入れるたびに減り、残り1つまで削れば次の一撃で倒れる。**
      # 1回で倒れる木を置かないのは、押している間プレイヤーの手が止まるため
      # （docs/engine/ActionSystem.md 6.3節）——途中で止めて別のことをし、後から続きを刻める。
      trunk_integrity:
        value: 4
        range: {min: 1, max: 4}
        # 札の桟に出す（docs/ui/CardView.md 8節）。**どこまで刻んだかが見えないと、途中で止めて
        # 戻ってくることができない。** 向きは道具の耐久度と同じで、満ちている側が健全
        # （weathering.yamlのdurability）。
        gauge: {min: bad, max: good}
    interactions:
      # 受け口を刻む。幹が減るだけで、何も採れない——倒れるのは下のfellで、そちらは残り1つでしか
      # 立たない。**同じ相手（斧）に対して同時に成立しないのは、この2つが幹の残りで排他だから**
      # （12.1節「条件で分ける」）。
      chop:
        trigger: {drag: {tag: chopping_tool}}
        duration: {prop: fell_minutes}
        conditions:
          # 残り1つまで削ったら、次はfellの側。**理由を宣言しない**——断っているのではなく、
          # そこから先は別の操作が受け持つ（画面に出るのはfellのほう）。
          - {prop: trunk_integrity, gte: 2}
          # **倒し切れる余力が無ければ、刻み始められない**（docs/engine/DurabilitySystem.md 2.1節）。
          # 線は1本ぶん（下のfellが食う120）で、**この手そのものは刃を食わない**——何も返さない手に
          # 刃を食わせると、倒れないまま斧だけが折れる形ができる。
          - reason: too_worn
            subject: instrument
            prop: durability
            gte: 120
          # 受け口を見ながら斧を同じ傷へ入れ続ける屋外の行動なので、見るのは視界の側
          # （docs/engine/IlluminationSystem.md 5節）。倒れる向きも見えていなければ決められない。
          - reason: too_dark
            subject: agent
            prop: looking_brightness
            in_stage_or_above: bright
          # 嵐の日は明るさが足りていても採れない（docs/world/ContentSkeleton.md 8.1.4節）。
          - reason: too_stormy
            not: {subject: agent, prop: wind_speed, in_stage_or_above: gale}
        # 木材加工の腕（docs/engine/SkillSystem.md 3節の実行経路、量の置き方は
        # characters/player_character.yaml）。**この口は斧を要求するが、立ち上がりはここではない**
        # ——刃物1本で回る伐り（下のsapling）と削り出し（animals.yamlのwhittle）が石器の先にあるので、
        # 木材加工は斧より手前から伸び始める。どれも循環しない（同3.2節）。
        #
        # **腕の伸びは割らない**——1手あたりの量はどの操作でも一律で（docs/engine/SkillSystem.md 7節）、
        # 繰り返しの稼ぎを抑えるのは時間のコストのほう。
        add:
          self:
            trunk_integrity: -1
          agent:
            skill_woodwork: 2

      # 最後の一撃。根元を断ち、倒した幹を運べる長さに玉切りするところまでを1つの作業として扱う。
      fell:
        trigger: {drag: {tag: chopping_tool}}
        duration: {prop: fell_minutes}
        conditions:
          # 受け口を刻み切った木にだけ立つ（上のchopと排他）。
          - {prop: trunk_integrity, lte: 1}
          # **木1本ぶんの刃の目方は、断ち切るこの1回がまとめて食う**（上のchopの注記）。線もその量。
          - reason: too_worn
            subject: instrument
            prop: durability
            gte: 120
          - reason: too_dark
            subject: agent
            prop: looking_brightness
            in_stage_or_above: bright
          - reason: too_stormy
            not: {subject: agent, prop: wind_speed, in_stage_or_above: gale}
        add:
          agent:
            skill_woodwork: 2
          instrument:
            durability: -120
        # 倒した場所に落ちる。木は中に物を持てないので、`into: self`は必ず親（土地）のアイテム
        # スロットへ伝播する（9.4節）。重いので、運ぶかどうかはその場で決める。
        #
        # **spawnを先に書く。** destroyを先にすると木の親が無くなり、伝播先が決まらないまま消える。
        spawn:
          - {object: log, count: 2, into: self}
          - {object: thick_branch, count: 3, into: self}
        destroy: self

      # 幹に縦の切れ目を入れ、内樹皮ごと帯で剥がす。**要るのは握りの刃**（handheld_blade、
      # tools.yaml）——刃を幹へ沿わせて長く走らせる手つきなので、柄の先へ据えて打ち込む石斧では
      # 帯にならない。**斧を待たない入口であることは変わらない**——尖った石さえあれば剥げるので、
      # 斧を要求する丸太（上のfell）とは別の入口のまま。木は立ったままなので、後から倒して丸太も採れる。
      #
      # **上のfellと同時に成立させない**（GameElementDefinition.md 12.1節）。石斧はcutting_toolでも
      # あるので、ここをcutting_toolで受けると斧では必ず先頭のfellになり、樹皮を剥ぐ道が消える。
      #
      # 剥いでも木は減らない。採取ポイントの枯渇はヤシの木（coconut.yaml）と同じく今後の課題で、
      # ここだけ先に持ち込むと木ごとに枯れ方の違う世界になる。
      strip_bark:
        trigger: {drag: {tag: handheld_blade}}
        # 立ち木を回りながら剥ぐ屋外の行動なので、見るのは視界の側
        # （docs/engine/IlluminationSystem.md 5節）。
        conditions:
          - reason: too_dark
            subject: agent
            prop: looking_brightness
            in_stage_or_above: bright
          - reason: too_stormy
            not: {subject: agent, prop: wind_speed, in_stage_or_above: gale}
        duration: 30
        spawn: {object: tree_bark, count: 3, into: agent}

  # 打ち上げられた流木の幹。どの海岸の探索でも見つかる（locations.yaml）。**丸太の2つ目の入口**で、
  # 森も密林も無い島で筏の材料が絶えないようにする（docs/concept/DesignPrinciples.md「要るものは、
  # 名指しの鍵ではなく、部分的に代替できる資源で作る」節）。
  #
  # 倒す手間が要らない代わりに、採れるのは丸太2本だけ——波に洗われた幹には枝も樹皮も残っていない。
  driftwood_trunk:
    tags: [fixture]
    # 絵は丸太を借りる（GameElementDefinition.md 4.3節）。枝も皮も落ちた幹は玉切り前の丸太そのもので、
    # 同じ絵しか持ちようがない。
    art: log
    props:
      # 丸太2本（40kg）に、玉切りで落ちる末口と割れた部分を足した重さ。
      weight: {value: 60000}
      # 玉切り1回ぶんにかかる時間（上のfell_minutesと同じ形）。**立ち木と同じ1回60分で、違うのは
      # 回数のほう**——既に倒れているので、受け口を刻む手間（chop）が要らない。
      buck_minutes:
        value: 60
        passives:
          - conditions:
              - {subject: agent, prop: skill_woodwork, in_stage_or_above: expert}
            modify: {self: {buck_minutes: -15}}
      # まだ切り分けていない幹。**1回の玉切りで丸太が1本ずつ採れ、切り終われば幹は残らない**
      # （立ち木のtrunk_integrityと同じ形。docs/engine/ActionSystem.md 6.3節）。
      trunk_integrity:
        value: 2
        range: {min: 1, max: 2}
        gauge: {min: bad, max: good}
    interactions:
      # 運べる長さに玉切りする。既に倒れているので、立ち木を倒すより半分の手間で済む。
      # **残り1本になったら下のbuck_lastへ移る**（12.1節「条件で分ける」）。
      buck:
        trigger: {drag: {tag: chopping_tool}}
        conditions:
          - {prop: trunk_integrity, gte: 2}
          # 1回ぶんの余力（下のadd と同じ30）が残っていなければ始められない。**こちらは1回ごとに
          # 丸太が1本返るので、手ごとに刃を食い、線も1回ぶん**（立ち木のchopと違う理由は
          # docs/engine/DurabilitySystem.md 2.1節）。**倒せなくなった斧でも玉切りはできる。**
          - reason: too_worn
            subject: instrument
            prop: durability
            gte: 30
          # 木目を読みながら刃を同じ傷へ入れ続ける屋外の行動なので、見るのは視界の側
          # （docs/engine/IlluminationSystem.md 5節）。
          - reason: too_dark
            subject: agent
            prop: looking_brightness
            in_stage_or_above: bright
          - reason: too_stormy
            not: {subject: agent, prop: wind_speed, in_stage_or_above: gale}
        duration: {prop: buck_minutes}
        add:
          self:
            trunk_integrity: -1
          agent:
            skill_woodwork: 2
          instrument:
            durability: -30
        spawn: {object: log, count: 1, into: self}

      # 最後の1本を切り離す。幹はここで無くなる。
      buck_last:
        trigger: {drag: {tag: chopping_tool}}
        conditions:
          - {prop: trunk_integrity, lte: 1}
          - reason: too_worn
            subject: instrument
            prop: durability
            gte: 30
          - reason: too_dark
            subject: agent
            prop: looking_brightness
            in_stage_or_above: bright
          - reason: too_stormy
            not: {subject: agent, prop: wind_speed, in_stage_or_above: gale}
        duration: {prop: buck_minutes}
        add:
          agent:
            skill_woodwork: 2
          instrument:
            durability: -30
        # **spawnを先に書く**（broadleaf_treeのfellと同じ理由）。
        spawn: {object: log, count: 1, into: self}
        destroy: self

  # 若木。幹がまだ細く、刃物で切り倒せる木（docs/world/SurvivalItems.md 0節）。**2mの長い棒の
  # 唯一の出どころ**で、まっすぐな2mの枯れ枝は落ちていない（同0節）ので、拾って済ませる道は無い。
  #
  # 採るのは真っ直ぐな根元の2mだけで、残りは根と梢と枝葉。**切れば無くなる**——広葉樹の樹皮
  # （立ったまま剥げる）と違い、根元を断つ操作なので木そのものが残らない。
  sapling:
    tags: [fixture]
    props:
      # 細い木1本ぶん。幹（3.5mほど、根元で3cm）に枝葉を足した重さで、採れる2m（長い棒600g）は
      # そのおよそ半分。残りは根と梢と枝葉になる。
      weight: {value: 1200}
      # 断って棒に切るのにかかる時間。**どの腕がどの段からどれだけ縮めるかは、この操作が自分で
      # 宣言する**（docs/world/Skills.md 7節）。長い棒は槍にもそりにも要るので、届いた段で縮む。
      cut_pole_minutes:
        value: 60
        passives:
          - conditions:
              - {subject: agent, prop: skill_woodwork, in_stage_or_above: skilled}
            modify: {self: {cut_pole_minutes: -15}}
    interactions:
      # 根元を刃物で断ち、枝を払って2mの棒に切る。斧は要らない（ファイル冒頭）。
      cut_pole:
        trigger: {drag: {tag: cutting_tool}}
        # 倒す向きを見ながら屋外で採る行動なので、見るのは視界の側
        # （docs/engine/IlluminationSystem.md 5節）。嵐の日は明るさが足りていても採れない
        # （docs/world/ContentSkeleton.md 8.1.4節）。
        conditions:
          - reason: too_dark
            subject: agent
            prop: looking_brightness
            in_stage_or_above: bright
          - reason: too_stormy
            not: {subject: agent, prop: wind_speed, in_stage_or_above: gale}
        duration: {prop: cut_pole_minutes}
        # **木部を断つので木材加工が伸びる**（docs/engine/SkillSystem.md 3節の実行経路）。同じ
        # cutting_toolで断つバショウ属・バナナの株（fiber.yaml）が何も配らないのは、あちらが草だから
        # ——スキルを分ける軸は素材ではなく技術（docs/world/Skills.md 1節）で、伐るのは木に対してだけ
        # 起きる。**若木さえ見つかれば刃物1本で回る**——同じく斧を要らない削り出し（animals.yamlの
        # whittle）が小骨＝罠か狩りを待つのに対して、こちらは探索で見つけた木だけで伸びる。
        add: {agent: {skill_woodwork: 2}}
        spawn: {object: long_pole, count: 1, into: agent}
        destroy: self

  # 丸太。幹を運べる長さ（2mほど）に切ったもの。筏の浮力を担う。
  log:
    tags: [item]
    # 焚き付けから育てた火に入れれば、一晩保つ大きさ（docs/engine/FireSystem.md 2.3節）。
    traits: [burnable]
    props:
      weight: {value: 20000}
      volume: {value: 35000}
      # 太い枝（fuel 20）10本ぶん。
      fuel: {value: 200}

  # 長い棒。若木を切って採った2mの棒（docs/world/SurvivalItems.md 0節）。槍の軸（tools.yaml）になる。
  long_pole:
    tags: [item]
    # 丸太と同じく、火に入れれば燃える（docs/engine/FireSystem.md 2.3節）。
    traits: [burnable]
    props:
      # 若木の根元の2m。太いほうの端で3cm、細いほうで親指ほど。**太い枝（70cmで1kg）より軽いのに
      # かさばる**——長さの違いは目方ではなく
      # かさで効く（docs/world/SurvivalItems.md 0節）。
      weight: {value: 600}
      volume: {value: 5000}
      # 太い枝（fuel 20）の目方ぶん。炎を1時間ほど保てる。
      fuel: {value: 12}

  # 樹皮。剥いだ帯を丸めたひと巻き（docs/world/SurvivalItems.md 0節）。渋（タンニン）を含むので、
  # 生皮をなめす剤になる（clothing.yamlのtanned_leather）。
  tree_bark:
    tags: [item]
    props:
      weight: {value: 700}
      # 丸まった帯は詰めても縮まないので、嵩そのままで見る。
      volume: {value: 2500}
