  rocky_field:
    object_def: rocky_field
    variants:
      - {id: cave, props: {cave_find: 36}}
      - {id: scattered}
      - {id: cracked}
      - {id: flat}
      - {id: mossy}
      - {id: white_rock}
    applicable_scopes: [island]
    move_cost: 1.4
    axis_preferences:
      ruggedness: {ideal: 85, tolerance: 25, weight: 100}
      humidity:   {ideal: 35, tolerance: 30, weight: 50}
    hard_limits:
      coastal_distance: {min: 16}
      elevation: {max: 84}

  wasteland:
    object_def: wasteland
    variants:
      - {id: stone, props: {stone_find: 60}}
      - {id: deadwood, props: {wood_find: 40}}
      - {id: cracked}
      - {id: dusty}
      - {id: bleached}
