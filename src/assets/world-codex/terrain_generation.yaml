# 地形生成の定義（TerrainGeneration.md参照）。土地・道そのもののobject_defsはlocations.yamlが持ち、
# このファイルは軸・LocationType・生成スコープだけを定義する。ルートキー axes / location_types /
# generation_scopes は地形生成専用のトップレベルキー（WorldCodexYamlLoader.Generation.cs が解釈する）。
#
# 数値の規約: 軸の値は 0〜100 の整数（百分率）。「プロパティ値は32bit整数のみ」の規約
# （GameElementDefinition.md 6節）に合わせ、YAMLにfloatを書かせない。ノイズ等の計算の内部だけ
# 実数を使い、サイトへ値を与える時点で整数へ量子化する。move_costは倍率そのまま（1=等倍）で、
# weightは相対値（合計で正規化されるので単位を持たない）。

# ------------------------------------------------------------------
# axes: 地点が持つ連続値パラメータ（TerrainGeneration.md 3.1節）。
# generatorは汎用プリミティブの重み合成（blend）:
# - distance_field: 島の縁からの距離（reference: edge。中心=100、縁=0）
# - layered_noise: シード付き格子値ノイズ（octaves/frequency/seed_offset）
# blob_scatter・modifiers（3.1節）は未実装。
# ------------------------------------------------------------------
axes:
  # 標高。内陸ほど高くなる距離場を主成分に、ノイズで起伏を加える。「海岸に囲まれた島で、
  # 内陸に山がある」という島の基本形はこの軸が作る。
  # この軸だけはメートルへ読み替える（generation_scopes.island.elevation_top_meters）ので、
  # 宣言した両端（海面0m・最高点400m）が実際に出るよう引き伸ばす。ノイズの重みが低いのは、
  # 加算で乗せた起伏がそのまま海岸の高さのばらつきになるため（3.1節）。
  elevation:
    range: {min: 0, max: 100}
    stretch_sites_to_range: true
    generator:
      blend:
        - {type: distance_field, reference: edge, weight: 90}
        - {type: layered_noise, octaves: 3, frequency: 2, seed_offset: 11, weight: 10}

  # 湿り気。純粋なノイズで、島のどこが湿りどこが乾くかをシードごとに変える。
  # 草原（中庸）・密林（高湿）・荒野（乾燥）の配置を分ける。
  humidity:
    range: {min: 0, max: 100}
    generator:
      blend:
        - {type: layered_noise, octaves: 2, frequency: 3, seed_offset: 23, weight: 100}

  # 海岸からの距離（縁=0、中心=100）。海岸帯の判定（coast_band）とhard_limitsに使う。
  coastal_distance:
    range: {min: 0, max: 100}
    generator:
      blend:
        - {type: distance_field, reference: edge, weight: 100}

  # 岩がちさ。海岸のバリエーション（砂浜/岩海岸/岸壁）と、内陸の岩場の判別に使う。
  ruggedness:
    range: {min: 0, max: 100}
    generator:
      blend:
        - {type: layered_noise, octaves: 4, frequency: 4, seed_offset: 37, weight: 100}

# ------------------------------------------------------------------
# location_types: 軸空間上の「理想点+許容範囲」としてのLocationType定義
# （TerrainGeneration.md 3.2節）。マッチングは正規化した重み付き距離の最近傍探索:
#   D = sqrt( Σ w_i * ((v_i - ideal_i) / tolerance_i)^2 / Σ w_i )
# 言及した軸だけで正規化するため、言及軸が少ない型が有利になる次元数バイアスは生じない。
# toleranceは距離のスケールであり、超えたら除外というゲートではない。絶対的な除外は
# hard_limitsだけが担う（3.2〜3.3節）。
#
# - object_def: この型が実体化するときのobject_defs（locations.yaml）のid。Build時に存在検証する。
# - variants: 同じ型が複数あるときに配る亜種（3.6節）。idがその土地の名前を引くキーになり（表示名は
#   locale/ja.yamlのlocation_texts、Localization.md）、propsは実体化した土地へ書き込まれて発見量を
#   変える（locations.yamlの`weight: {prop: ...}`の候補）。propsを持たない素の亜種は名前だけが変わる。
#   - **島のどこに在るかが分かる語を入れないこと。** 地形の把握はプレイヤー自身の仕事なので、
#     方角や「島の奥の」のような語を名前に出すと、行き先の名前を見ただけで島の形が割れてしまう。
#   - **名前と中身を合わせること。** 「木苺の森」で木苺が増えないなら、名前はただの飾りになる。
#     逆に合っていれば、プレイヤーが名前から中身を覚えられる（地図を持たないゲームなので効く）。
#   - **その亜種にしか無いものを作らないこと。** 同じ型は島に高々max_sites_per_type個で、型ごとの
#     出現率も5割前後。亜種に固有の発見物を紐づけると「島のどこにも無い」が普通に起きる。
#     倍率も控えめ（素の重みの0.5〜2倍程度）にとどめる。
#   - 1つの島で使うのはmax_sites_per_type個までだが、多く書いておくと島ごとに違う亜種が出る。
#     足りない分は通し番号で埋まる（名前としては読めないので、余裕を持って用意する）。
# - move_cost: その土地を進む遅さの倍率（1=開けた土地＝generation_scopesのwalk_meters_per_hour
#   そのままの速さ）。両端の平均が水平移動の時間へ掛かる（TerrainGeneration.md 3.5節）。
# - is_fallback/priority: どの型もhard_limitsで弾かれたサイトの受け皿（3.3節）。
#   priorityが最も高いfallbackが選ばれる。
# - 海岸過多の防止: 海岸3種はhard_limits(coastal_distance.max=coast_band)で海岸帯にしか出ず、
#   内陸型はmin=coast_band+1で海岸帯に出ない。海岸帯のサイト数自体を絞るのはサイト配置側
#   （generation_scopes.island.interior_bias と hull_coast）。
# ------------------------------------------------------------------
location_types:
  sandy_beach:
    object_def: sandy_beach
    variants:
      - {id: palm, props: {palm_find: 26}}
      - {id: crab, props: {crab_find: 16}}
      - {id: driftwood, props: {driftwood_find: 26}}
      - {id: white_sand}
      - {id: shallow}
      - {id: rough_surf}
      - {id: quiet}
    applicable_scopes: [island]
    move_cost: 1
    axis_preferences:
      ruggedness: {ideal: 15, tolerance: 30, weight: 100}
    hard_limits:
      coastal_distance: {max: 15}

  rocky_coast:
    object_def: rocky_coast
    variants:
      - {id: cave, props: {cave_find: 26}}
      - {id: crab, props: {crab_find: 24}}
      - {id: boulder}
      - {id: black_rock}
      - {id: tide_pool}
      - {id: wave_washed}
      - {id: crumbling}
      - {id: mossy}
      - {id: white_rock}
    applicable_scopes: [island]
    move_cost: 1.3
    axis_preferences:
      ruggedness: {ideal: 60, tolerance: 30, weight: 100}
      elevation:  {ideal: 3, tolerance: 8, weight: 60}
    hard_limits:
      coastal_distance: {max: 15}

  cliff_coast:
    object_def: cliff_coast
    variants:
      - {id: cave, props: {cave_find: 40}}
      - {id: layered}
      - {id: sheared}
      - {id: windy}
    applicable_scopes: [island]
    move_cost: 1.7
    axis_preferences:
      ruggedness: {ideal: 90, tolerance: 25, weight: 100}
      elevation:  {ideal: 16, tolerance: 5, weight: 80}
    hard_limits:
      coastal_distance: {max: 15}

  grassland:
    object_def: grassland
    variants:
      - {id: berry, props: {berry_find: 30}}
      - {id: spring, props: {spring_find: 22}}
      - {id: tall_grass}
      - {id: flowering}
      - {id: windswept}
      - {id: withered}
      - {id: dewy}
      - {id: low_grass}
      - {id: rippling}
      - {id: quiet}
      - {id: wide}
      - {id: rough}
      - {id: insects}
    applicable_scopes: [island]
    move_cost: 1
    axis_preferences:
      humidity:  {ideal: 45, tolerance: 20, weight: 100}
      elevation: {ideal: 30, tolerance: 25, weight: 80}
    hard_limits:
      coastal_distance: {min: 16}
      elevation: {max: 68}

  forest:
    object_def: forest
    variants:
      - {id: berry, props: {berry_find: 30}}
      - {id: spring, props: {spring_find: 22}}
      - {id: tall_trees}
      - {id: undergrowth}
      - {id: mossy}
      - {id: fallen_trees}
      - {id: young_trees}
      - {id: dark}
      - {id: dappled}
      - {id: deep}
      - {id: silent}
      - {id: leaf_litter}
      - {id: thin_trees}
    applicable_scopes: [island]
    move_cost: 1.2
    axis_preferences:
      humidity:  {ideal: 65, tolerance: 20, weight: 100}
      elevation: {ideal: 40, tolerance: 30, weight: 80}
    hard_limits:
      coastal_distance: {min: 16}
      elevation: {max: 78}

  jungle:
    object_def: jungle
    variants:
      - {id: palm, props: {palm_find: 30}}
      - {id: taro, props: {taro_find: 22}}
      - {id: humid}
      - {id: broad_leaf}
      - {id: vines}
      - {id: dense}
      - {id: damp}
      - {id: birds}
    applicable_scopes: [island]
    move_cost: 1.6
    axis_preferences:
      humidity:  {ideal: 90, tolerance: 20, weight: 120}
      elevation: {ideal: 30, tolerance: 30, weight: 60}
    hard_limits:
      coastal_distance: {min: 16}
      humidity: {min: 65}
