  mountain_peak:
    object_def: mountain_peak
    variants:
      - {id: bare_rock}
      - {id: windy}
      - {id: flat}
    applicable_scopes: [island]
    move_cost: 2.5
    axis_preferences:
      elevation: {ideal: 100, tolerance: 15, weight: 100}
    hard_limits:
      # 山頂は島の最高点そのもの。stretch_sites_to_rangeで最高点だけが軸の上端に来る。
      coastal_distance: {min: 16}
      elevation: {min: 100}

# ------------------------------------------------------------------
# generation_scopes: 生成スコープごとのパラメータプリセット（TerrainGeneration.md 3.7節）。
# 島の生成と構造物内部の生成は同一の生成ロジックを共有し、違いはこのプリセットの差だけにする。
# structure_interiorは洞窟内部の再帰生成とあわせて「いつか」（docs/Someday.md）。
# ------------------------------------------------------------------
generation_scopes:
  island:
    # 生成する土地の数（この範囲からシードで抽選）。
    site_count: {min: 10, max: 20}
    # coastal_distanceがこの値以下のサイトを「海岸帯」とみなす（海岸型のhard_limitsと対で使う）。
    coast_band: 15
    # 外周リング（島を囲む海岸候補の配置枠、SitePlacer参照）のサイトのcoastal_distanceを
    # 海岸帯へクランプし、島が必ず海岸で囲まれることを保証する。
    hull_coast: true
    # サイト配置の内陸バイアス（0=一様、100=最大）。島の縁に張り付くサイトを減らし、
    # 海岸が多くなりすぎないようにする（普通に円盤へ一様散布すると面積比で外周が多数になるため）。
    interior_bias: 0.6
    # MST以外のDelaunay辺を復活させる迂回率の閾値（%）。現グラフでの2点間最短距離が
    # 直結距離のこの割合を超えるなら、その辺を近道として復活させる。上げるほど道は減る
    # （下限は全土地を繋ぐMSTの平均次数≒1.9）。200で平均次数2.5・行き止まり15%ほど。
    # 変えたら stats/terrain.yaml を再生成する（npm run stats:terrain）。
    extra_edge_detour_factor: 2
    # 同じ土地を何個まで置いてよいか（0で無制限）。同じ地形は環境も発見物も見た目も同じなので、
    # 並べても島は広くならない。海岸帯のサイトは最大7個で海岸型は3種類、内陸は最大13個で内陸型は
    # 7種類あるので、3なら数の上で必ず収まる（実測は stats/terrain.yaml）。
    max_sites_per_type: 3
    # 同じ型が1個増えるごとにマッチング距離へ乗せる割増（%）。上限に当たる前から他の型へ譲らせ、
    # 「上限で打ち切られた」島ばかりにならないようにする。
    crowding_penalty: 0.6
    # 島の差し渡し（m）。抽象座標の直径（SitePlacer.ISLAND_RADIUSの2倍＝200単位）がこの長さに当たり、
    # 抽象1単位＝33.5mになる。山がひとつある島として自然な大きさ（面積およそ35km²で、
    # ロビンソン・クルーソー島の約48km²よりやや小さい）。
    diameter_meters: 6700
    # move_cost 1.0 の土地を歩く速さ（m/時）。道の無い熱帯の地面を歩く速さ。
    walk_meters_per_hour: 4000
    # 高低差を登り下りする速さ（m/時）。水平移動とは別に、両端の高低差ぶんの時間が乗る。
    # ネイスミスの法則（登り600m/時）の値を、登りにも下りにも同じだけ課す（3.5節）。
    climb_meters_per_hour: 600
    # 標高として読む軸と、その軸の上端（100）が海抜何メートルか。軸は0〜100の整数のまま
    # （数値の規約）で、メートルへの読み替えをここが持つ。同じ縮尺で自然な高さ
    # （青ヶ島は8.7km²で423m、ボラボラ島は30km²で727m）。
    elevation_axis: elevation
    elevation_top_meters: 400
    # カバレッジ保証（TerrainGeneration.md 3.4節・6節）。軸の分布だけでは個数を保証できないため、
    # 「指定軸が最大/最小のサイトへこの型を強制割当する」処理をマッチングの前に行う。
    # 島には必ず山がひとつと、木の茂る土地がひとつある。
    guarantees:
      - {location_type: mountain_peak, count: 1, axis: elevation, pick: max}
      # 島を出る鎖の入口（繊維・丸太・革・骨）はどれも木の茂る土地にしか無いので、森を1つ置くことが
      # 「どの島からも出られる」を成り立たせている（docs/diagnostics/IslandEscapeReachStats.md）。
      # **最も低い内陸のサイトへ置く**——水の集まる低みが茂るのは自然で、湿り気の高い側へ置くと
      # 密林と場所を奪い合い、密林を持つ島が目に見えて減る。
      - {location_type: forest, count: 1, axis: elevation, pick: min}
