# 栽培と飼育の定義（docs/world/ContentSkeleton.md 4節の食の調達、docs/world/Animals.md 3.1節）。
#
# **罠（docs/engine/TrapSystem.md）とまったく同じ「留守番の設備」の形で、新しい文法は1つも足していない。**
# 仕掛ける（撒く・入れる）→ 別の土地へ行く → 戻ると増えている、という往復が1単位で、設備の側は
# 見に来たかどうかを知らない。
#
# 違うのは、**時間を数えるのが設備か中身か**の1点だけ。
#
# | | 時間を数えるもの | そうなる理由 |
# |---|---|---|
# | 罠 | 罠自身 | 掛かる獲物は**まだ物として在らない**ので、数えさせる相手が居ない |
# | 畑 | 畑自身 | 撒いた種は撒いた瞬間に物でなくなる（下の`*_sown`）ので、同じく数える相手が居ない |
# | 囲い | **両方** | 檻として数えるのは囲い自身、増えるのを数えるのは中の獣（animals.yaml） |
#
# 囲いが両方を数えるのは、**檻（TrapSystem.md 1.2節の`pen`）と同じ型だから**——空いている間は
# 大型を生かして捕らえる罠で、埋まっている間は家畜を置いておく設備になる。分けているのは
# 「中に何か居るか」の条件1つで、それは罠が既に持っているもの（同6節）。
#
# **畑が課すのは時間と食料だけで、運は無い**（撒いたものは必ず実る）。囲いは檻でもあるので、
# 空けておけば罠の運（同7節）を、埋めておけば飼育の確実さを取る——同じ設備で賭けるものが入れ替わる。
#
# 数値はいずれも目安で、tick = 15分・1日 = 96 tickを前提とする。

object_defs:
  # 畑。掘り返して均した土そのものなので、持ち歩けない設置物（fixture）になる。
  #
  # **作物の種類は増やさない**（ContentSkeleton.md 概要「個々のレシピは決めません」）。既にある芋と
  # 葉物（foods.yaml）を育てられるところまでで、品目の幅出しは別の仕事。
  field:
    tags: [fixture]
    # 押すと実ったものが並ぶ（7.11節）。**畑は何も告げない**ので、見に来なければ実ったことは分からない
    # ——罠と同じ沈黙（TrapSystem.md 5節）で、告げる経路を開けると畑は待つ物ではなく報せる物になる。
    visible_slots: [crop]
    # 撒いたものが個体ごとに違うので束ねない（SlotSystem.md 4節）。
    stackable: false
    slots:
      # 実ったもの。**プレイヤーは入れられない**（placementからmanualを外す、7.7節）——ここを開けると、
      # 撒くつもりで重ねた芋が、撒かれずに枠へ収まってしまう（カードへ重ねた物は、manualを許す枠が
      # あればそちらへ入る、7.8節）。撒くのは下のsow_*で、取り出すのはいつでもできる。
      crop:
        cell_count: 6
        cell: {accept: {tag: item}}
        placement: [auto]
    props:
      # **耕した土そのものなので、運べる目方を持たない**（道・湧き水と同じ、locations.yaml）。
      # 0は宣言漏れではなく、そう決めた印。
      weight: {value: 0}
      # 次に1株が実るまでの残り（罠のcatch_remainingと同じ見えないタイマー、TrapSystem.md 2節）。
      # カードの状態バーは名前で決まった量だけを映す（CardView.md 8節）ので、隠す仕掛けは要らない。
      #
      # 初期値の幅は待ち時間ではなく**位相**（同2.1節）。複数の畑が同じtickに一斉に実るのを防ぐ
      # ためだけのもの。**待たされる長さにばらつきは無い**——罠と違って空振りが無いため。
      growth_remaining:
        value: {min: 1, max: 192}
        range: {min: 0, max: 192}
        # **置かれている場所で分岐しない。** 畑は持ち歩けないので、罠の`{in_slot: items}`にあたる
        # 「仕掛かっているか」の区別がそもそも立たない。
        passives:
          - add:
              self:
                growth_remaining: -1
        # 周期の置き直しは、どの候補が選ばれても起こるのでpickの外へ1つだけ置く（9.7節）。
        on_min:
          add: {self: {growth_remaining: 192}}
          pick:
            # 何も撒かれていない回。**重みは0**——全候補の重みが0なら先頭が選ばれる規約（10節）
            # だけで拾うので、1株でも撒いてあれば必ずそれが実る。罠の空振り（miss_weight）に
            # あたるものを畑は持たない。
            - weight: 0
            # 実った回。撒いた株が1つ減り、種芋1つから親芋と子芋が採れる。
            - weight: {prop: taro_sown}
              add: {self: {taro_sown: -1}}
              spawn: {object: taro, count: 3, into: self}
            # 葉物は摘んでも脇芽が伸びるが、株そのものは1度で終わりにする——**作物ごとに育ち方を
            # 変えない**（畑が持つタイマーは1つなので、周期を作物ごとに変えると「前に実った物が
            # 次の周期を決める」ことになる）。
            - weight: {prop: water_spinach_sown}
              add: {self: {water_spinach_sown: -1}}
              spawn: {object: water_spinach, count: 3, into: self}
      # 撒いてある株の数。罠が土地から継承する`<動物>_catch`（TrapSystem.md 3節）と同じ立ち位置で、
      # **宣言していない（＝撒いていない）作物は重みが0になり、候補ごと抽選から外れる**。
      #
      # 罠のつまみとの違いは、こちらが撒くたびに増え実るたびに減ることだけ。土地が宣言するのは
      # 「そこに何が居るか」で動かないが、畑に何が植わっているかはプレイヤーが決める。
      taro_sown: {value: 0, range: {min: 0, max: 8}}
      water_spinach_sown: {value: 0, range: {min: 0, max: 8}}
    interactions:
      # 種を撒く（罠へ餌を仕掛けるのと同じドラッグ型、TrapSystem.md 4節）。
      #
      # **移る量は畑の側が持つ。** 餌がtransferで「仕掛けると増える量」を食べ物の側から運ぶ
      # （FireSystem.md 2節の燃料と同じ形）のに対し、こちらは1個が1株にしかならない——分けても
      # 増えない量なので、運ぶものが無い。
      #
      # **これが畑の代償で、罠の餌とまったく同じ性質**（TrapSystem.md 4節）。撒くのは自分が
      # 食べられる食料で、序盤ほど重く、蓄えができるほど軽くなる。
      sow_taro:
        trigger: {drag: {object: taro}}
        duration: 15
        conditions:
          - {reason: field_sown, prop: taro_sown, lt: 8}
        add: {self: {taro_sown: 1}}
        destroy: instrument
      sow_water_spinach:
        trigger: {drag: {object: water_spinach}}
        duration: 15
        conditions:
          - {reason: field_sown, prop: water_spinach_sown, lt: 8}
        add: {self: {water_spinach_sown: 1}}
        destroy: instrument
    # **解放条件を持たない。** 土を起こす腕を担うスキルが一覧（docs/world/Skills.md 2節）に無く、
    # 半日を掘り返すこと自体がゲートになっている（docs/engine/SkillSystem.md 4.2節）。
    recipes:
      # 掘り返して均すだけで、土は元からそこにある。**掘削具はまだ無い**（TrapSystem.md 8節の
      # 落とし穴と同じ空白）ので、掘り棒にする太い枝を1本折り込む形で置いてある。
      tilled:
        steps:
          - requires:
              - {object: thick_branch, count: 1, consume: true}
            duration: 240

  # 囲い。丸太を並べて縄で結んだ柵で、**罠の檻（TrapSystem.md 1.2節、大型・生かす）と家畜の囲いが
  # 同じ1つの型**。空いている間は掛かるのを待ち、埋まっている間は置いておく。
  #
  # **役目を切り替えているのは、下のcatch_remainingが持つ条件1つ**（中に獲物が居るか）で、罠が
  # 「回収するまで次は掛からない」ために既に持っているもの（同6節）。**檻として捕らえた個体を
  # 家畜へ移し替える操作は要らない**——同じ枠に居たまま警戒が引き切れば、そこが囲いになる。
  #
  # 残る差はすべて型ごとのパラメータで、罠の側が既に「ここが持つ」と決めている場所にある。
  #
  # | 差 | 決めている場所 |
  # |---|---|
  # | 据え置きで、仕掛け直せない | `fixture`（TrapSystem.md 1節の落とし穴と同じ） |
  # | 大型まで掛かり、ネズミは掛からない | 下のpickに並べた候補の一覧（同1.1節） |
  # | 掛けても殺さない | 刺す怪我（injuries.yamlの`pen_bruise`、同5.1・5.2節） |
  # | 何頭まで置けるか | `cell_count` |
  #
  # **囲いは何が中に居るかを知らない。** 増えるかどうかは獣自身が名乗る（animals.yamlのヤケイ）ので、
  # 家畜になる獣を足しても、この型は1行も変わらない。
  pen:
    tags: [fixture]
    # 押すと中の獣が並ぶ（7.11節）。畑と同じで、見に来なければ増えたことは分からない
    # ——罠が掛かったことを告げないのと同じ沈黙（TrapSystem.md 5節）。
    visible_slots: [catch]
    stackable: false
    slots:
      # 囲われている獣。**枠の名前は罠と同じcatch**——檻と家畜の囲いが1つの型である（TrapSystem.md
      # 1.2節）以上、枠も1つで、閉じ込められた獣が渇くゲートが罠の型を問わずに書ける（同5.4節）。
      #
      # **枠ごとに1頭**（maxを置く、7.2節）——獣は束ねられる型なので、maxが無いと
      # 1つの枠に何頭でも積まれて、囲いの広さが何も意味しなくなる。
      #
      # **capacityは宣言しない**（TrapSystem.md 1.1節）。上限を宣言すると容量のバーが出て
      # （CardView.md 8節）、比例するバーの長さが中身の体積＝ほぼ種類を、開ける前に漏らす。
      #
      # 受けるのはquarry（生きた獲物と死体の両方が持つ、animals.yaml）。animalで受けると、中の獣が
      # 死んだ瞬間に死体が枠から弾かれて地面へ落ちる——**締めた家畜も、掛かって死んだ獲物も、
      # 囲いの中に残る**。下のタイマーが「何か入っているか」を問うのも同じタグ。
      #
      # プレイヤーが入れられるのは**落ち着いた個体だけ**。荒ぶっている間はどの持ち主にも付けない
      # （resists、7.13節・animals.yamlのbeast）ので、手で入れるなら生け捕りにして待つことになる
      # （docs/engine/VitalsSystem.md 7節・TrapSystem.md 5.2節）。掛かった個体は下の拘束が
      # 警戒を打ち消しているので、そのまま留まる。
      catch:
        cell_count: 4
        cell: {accept: {tag: quarry}, max: 1}
    props:
      # 丸太4本（20,000g）＋縄2本（600g）。**据えた物も目方を名乗る**（core.yaml）ので、筏へ載せれば
      # 積荷として効き、中の獣の重さもここを通る。
      weight: {value: 81200}
      # 次の判定までの残り（TrapSystem.md 2節）。**見えないタイマー**で、カードの状態バーは
      # 名前で決まった量だけを映す（CardView.md 8節）ので隠す仕掛けは要らない。
      #
      # 初期値の幅は待ち時間ではなく**位相**（同2.1節）。複数の囲いが同じtickに一斉に判定するのを
      # 防ぐためだけのもの。
      catch_remaining:
        value: {min: 1, max: 16}
        range: {min: 0, max: 16}
        passives:
          - conditions:
              # **空いている間だけ**（TrapSystem.md 6節）。獲物も死体も家畜も同じquarryなので、
              # 「掛かったら止まる」と「家畜を入れたら罠でなくなる」がこれ1つで揃う。
              #
              # **置かれている場所では分岐しない。** 囲いは持ち歩けないので、罠の`{in_slot: items}`に
              # あたる「仕掛かっているか」の区別がそもそも立たない（畑と同じ）。
              - not: {slot: catch, matches: {tag: quarry}}
            add:
              self:
                catch_remaining: -1
        # 周期の置き直しは、どの候補が選ばれても起こるのでpickの外へ1つだけ置く（9.7節）。
        on_min:
          add: {self: {catch_remaining: 16}}
          pick:
            # 何も寄って来なかった回。先頭に置く（TrapSystem.md 3節）。
            - weight: {prop: miss_weight}
            - weight: {prop: herbivore_weight}
              pick:
                # 寄ってはきたが掛からなかった回。その土地が1種も宣言していなければ必ずここへ落ちる
                # （全候補0だと先頭が選ばれるため、先頭に置く）。
                - weight: 8
                - weight: {prop: junglefowl_catch}
                  spawn:
                    - {object: junglefowl, into: self}
                    # 直前に生んだ獲物のinjuriesスロットへ（into: child、9.4節）。**囲いの子は
                    # このとき1つだけ**——空でなければタイマーが減らないので、掛かった個体しか居ない。
                    - {object: pen_bruise, into: child}
                - weight: {prop: wild_boar_catch}
                  spawn:
                    - {object: wild_boar, into: self}
                    - {object: pen_bruise, into: child}
      # その土地でその動物が掛かる重み。素の値は0で、祖先（＝据えた土地、locations.yaml）が宣言して
      # いればその実効値が土台になる（base、6.5節）。**宣言していない土地ではその候補が抽選から
      # 外れる**ので、囲いの側は1行も書き換えずに、どこに建てたかだけで掛かる相手が決まる。
      #
      # **ネズミは候補に無い。** 丸太の隙間から出ていく大きさで、これが「檻は大型まで」を言う
      # 唯一の場所（TrapSystem.md 1.1節）。
      junglefowl_catch: {value: 0, base: {subject: ancestor}}
      wild_boar_catch: {value: 0, base: {subject: ancestor}}
      # 寄ってきた回の重み。素は罠と同じで、飼葉が押し上げる。
      herbivore_weight: {value: 10, range: {min: 0, max: 35}}
      # 何も寄って来なかった回の重み。飼葉が下げるが、range.minが5で止めるので必中にはならない
      # （8.3節。合成結果の下限はプロパティ側のrangeが持つ）。
      miss_weight: {value: 40, range: {min: 5, max: 40}}
      # 与えてある飼葉。罠の餌（TrapSystem.md 4節）とまったく同じ形で、食べ物の側が持つ
      # 「草の餌になる量」（foods.yamlのplant_bait）をそのまま受け取る。
      #
      # **寄せる餌と飼葉は同じ1つの量。** 草食の獣が寄ってくる量と、草食の獣が食べる量は同じ量
      # ——「草の食べ物としてどれだけあるか」——なので、2つに割らない。
      #
      # **減らすのは囲いではなく中の獣**（animals.yaml）。囲いの側は中身を数えられない（条件は
      # 存在判定だけ、14.3節）ので、頭数が効く形はこれでしか書けない——そして**食べるのは食べる
      # 当人の仕事**なので、そちらが正しい置き場所でもある。
      #
      # **時間では傷まない。** 罠の餌が6時間で切れる（TrapSystem.md 4節）のは、持ち歩ける罠が
      # 見回りの速さを代償にしているから。据え置きの囲いが払うのは材料（丸太4本＋縄2本）で、
      # 時間ではない——空けておけば飼葉は誘い餌のまま残り、獣が入れば食われて減る。
      fodder:
        value: 0
        range: {min: 0, max: 96}
      # 与えてある飲み水（mL）。**飼葉とまったく同じ形**で、減らすのは囲いではなく中の獣
      # （animals.yamlのbeast）——頭数がそのまま減りの速さになる。
      #
      # **飼葉と違って、切らせば死ぬ。** 閉じ込められた獣は catch の枠に居る間ずっと渇き
      # （docs/engine/TrapSystem.md 5.4節）、満水から3日半で死ぬ。飼葉が尽きても増えなくなるだけなので、
      # **留守番の設備に「見に戻る」を課しているのはこちら**（docs/world/Animals.md 3.1節）。
      #
      # **寄せる餌にはならない。** 飼葉が誘い餌を兼ねる（同じ1つの量、上のfodder）のに対し、水は
      # 罠の卓の重みへ触れない——水場は島のどこにでもあり、それで寄って来るなら罠は要らない。
      #
      # maxは甕1杯ぶん（liquid_containers.yamlのjar）。1頭あたり25mL/tickなので、満たせば1頭で40時間
      # 保つ。時間では減らない（飼葉と同じ。蒸発は器の口の広さが決めるもので、囲いは器ではない）。
      drinking_water:
        value: 0
        range: {min: 0, max: 4000}
    passives:
      # 中の獣は暴れない。罠の拘束（TrapSystem.md 5節）と同じ1ブロックで、3つを同時に決める
      # ——掛かった獲物がresists（7.13節）で飛び出さない・その場で締められる・出せば暴れる。
      #
      # **生まれた仔がその場に留まる**のもこれ。警戒したまま生まれると、resistsが成立して生まれた
      # 直後に土地までこぼれ出る。
      - modify:
          child:
            wariness: -100
            vulnerability: 200
      # 飼葉は「寄ってくる回が増える」と「何も寄って来ない回が減る」を同時に言う（TrapSystem.md 4節）。
      # 動物ごとの重みには触れない——触れると宣言していない土地でも重みが立ち、そうさせない条件は
      # 自分の実効値を見ることになって循環する（14.1節）。
      - conditions:
          - {prop: fodder, gte: 1}
        modify:
          self:
            herbivore_weight: 25
            miss_weight: -25
    interactions:
      # 飼葉を与える（罠へ餌を仕掛けるのとまったく同じ、TrapSystem.md 4節）。移る量は食べ物の側が
      # 1箇所で持つ（FireSystem.md 2節の燃料と同じ形）。
      #
      # **肉の餌は受けない。** 肉で寄る相手が上の候補に居ないので、受け口を開けても肉を捨てる道に
      # しかならない。肉食の卓は、それで寄る大型が出たときに足す（TrapSystem.md 8節）。
      feed:
        trigger: {drag: {tag: plant_bait}}
        duration: 5
        conditions:
          - {reason: pen_fed, prop: fodder, lt: 96}
        transfer:
          amount: 999
          from: instrument
          from_prop: plant_bait
          to_prop: fodder
        # 中途半端に残った飼葉を作らない。入りきらなかった分は失われるが、満杯を拒む条件があるので
        # 失うのは高々1個ぶん（罠の餌と同じ）。
        destroy: instrument
      # 水をやる（飼葉と同じドラッグ型）。**容器は返す**——液体は容器の変種として在る
      # （liquid_containers.yaml）ので、注いだぶんfillが減り、空になれば中身の軸が落ちて空の器に戻る。
      # 入りきらなかった分は器に残る（transferの既定のallow_overflow: false）ので、水は1mLも捨てない。
      #
      # **湯も茶も受けない。** 受けるのはwaterタグだけで、沸かした湯・煎じた茶は人が飲むためのもの。
      water:
        trigger: {drag: {tag: water}}
        duration: 5
        conditions:
          - {reason: pen_watered, prop: drinking_water, lt: 4000}
        transfer:
          amount: 999999
          from: instrument
          from_prop: fill
          to_prop: drinking_water
    # **解放条件を持たない。** 丸太は斧でしか採れず（timber.yaml）、その斧が既に石器と繊維・編みの
    # 腕を要求している（docs/engine/SkillSystem.md 4.2節、筏と同じ）。
    recipes:
      # 丸太を並べて縄で結ぶ。**生かして扱う設備は常に高くつく**（TrapSystem.md 1.2節）という線の
      # 上に乗っていて、大型で最も開く差がこれ。
      fenced:
        steps:
