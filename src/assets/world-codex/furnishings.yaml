# 里心を抑える設え（docs/world/ContentSkeleton.md 3節の系統12、docs/world/Characters.md ホームシック節）。
#
# **どれも据えるためだけの物で、他に使い道を持たない。** 生きるのに要る物が居心地を兼ねると、
# 対策がどうせ作る物になって圧が素通りする（同節）。**どうせ建てる家が押せるのは homely まで**に
# 抑えてある（docs/world/Dwellings.md 2.1節）ので、**家だけでは snug へ届かない**。
#
# **押し上げるのは据えた場所のほうで、キャラクタは base で継ぐだけ**（core.yaml の comfort）。
# **持ち歩ける慰めは書こうとしても書けない**——fixture は手持ちの枠に入らない（受けるのは item タグ
# だけ、characters/player_character.yaml）ので、遠征に出ればどれも効かない（同節）。
#
# **点数は、その物に掛かる手間に比例させる**（stats/balance.yaml の object_costs）。設えは積むほど
# 効いてよい（同節）ので同じ物を並べても効き、**どれを並べても点あたりの手間はおおむね揃う**
# ——比例させてあるのはそのため。**どこまでの開きを「おおむね」と呼ぶかの線は試験が持つ**
# （tests/world-codex/furnishingsYaml.test.ts）——点数は整数で手間は素材の連鎖から出るので、ぴったり
# 揃う組み合わせは選べず、**上流のレシピが動けば設えを触らなくても開く。**
# **それでも払う総手間は並べ方で上へ振れる**——点あたりの手間は型ごとに
# 少しずつ違い、そのうえ1つあたりの点数も違うので、snug を越える手前で行き過ぎる量まで変わる。
# いちばん安い積み方（stats/terrain.yaml の work_piles）が下限で、そこから下へは振れない。
# **単体で snug（50）へ届く物は無く、積んで初めて届く**
# （tests/world-codex/furnishingsYaml.test.ts）。
#
# **前提の道具だけは並べ方で変わる。** 彫り物だけで積めば刃物1本で届き、丸太を使う物は斧、太鼓は
# さらに狩りを通る。**里心の対策を、ほかの系統の進み具合に縛らないため**の道が要るので、いちばん軽い
# 経路が刃物1本で済むことは意図した形（docs/world/Characters.md ホームシック節）。
#
# **解放条件を持たない。** 丸太は斧でしか採れず、その斧と縄が既に石器・繊維・編みの腕を要求している
# （囲いと同じ、farming.yaml）。**指物の腕は要求しない**——伸ばす行動が世界に1つも無いので、要求すれば
# 永久に開かないレシピになる（docs/engine/SkillSystem.md 3.2節）。ここに在るのは縛りと削り出しで、
# ほぞで組む物ではない（docs/world/Skills.md 2.1節）。
#
# **そのうえで、どれも手際は名乗る**（同7.1節）——縛りも削り出しも木材加工の仕事で、**指物ではない**
# のは上と同じ理由。解放と速さは別の宣言なので、腕が0でも据えられるまま、上げた者だけが早く据える。

object_defs:
  # 丸太の腰掛け。丸太を割り、座面を平らに削っただけの物。
  #
  # **furnishing は「里心を抑えるために据える物である」ことを言うタグ**（docs/ui/ScreenLayout.md
  # 8.1.2節）。フィルターのボタンは住まい（core.yaml の filter_shelter）と分け合う。
  log_stool:
    tags: [fixture, furnishing]
    props:
      # 丸太20,000gのうち、割って削り落としたぶんだけ軽い（timber.yaml）。
      weight: {value: 12000}
    passives:
      # 据えた場所の居心地（core.yaml）。押すのは ancestor で、キャラクタはそこから継ぐ（8.6節。
      # 囲いの company と同じ形、farming.yaml）。
      - modify:
          ancestor:
            comfort: 8
    recipes:
      # 斧で割り、座面を削る。
      hewn:
        # **1つ据えれば済む設えなので、効き始めるのは最上段**（docs/world/Skills.md 7節）。
        deftness: {skill: skill_woodwork, from_stage: expert, minutes: -15}
        steps:
          - requires:
              - {object: log, count: 1, consume: true}
              - {tag: chopping_tool, count: 1, consume: false}
            duration: 60

  # 枝の卓。太い枝を組んで縄で締めた低い卓。
  #
  # **荷重を受けるほぞ組みの卓ではない**（docs/world/Skills.md 2.1節）——縛って組む物なので、指物の
  # 腕を待たずに据えられる。
  branch_table:
    tags: [fixture, furnishing]
    props:
      # 太い枝6本（1,000×6）＋縄1本（200）。
      weight: {value: 6200}
    passives:
      - modify:
          ancestor:
            comfort: 15
    recipes:
      lashed:
        deftness: {skill: skill_woodwork, from_stage: expert, minutes: -15}
        steps:
          # 脚と天板の枝を組む。
          - requires:
              - {object: thick_branch, count: 6, consume: true}
            duration: 60
          # 紐で締め上げる。
          - requires:
              - {object: cord, count: 1, consume: true}
            duration: 60

  # 木彫りの像。太い枝1本から削り出した彫り物。
  #
  # **材料はほとんど要らず、掛けた時間だけが値打ちになる。** 娯楽の側はこの形で入る——手を動かして
  # いること自体が慰めなので、点数の出どころが材料ではなく手間だけになる。
  wood_carving:
    tags: [fixture, furnishing]
    props:
      # 太い枝1,000gから彫り落とした残り。
      weight: {value: 300}
    passives:
      - modify:
          ancestor:
            comfort: 8
    recipes:
      whittled:
        deftness: {skill: skill_woodwork, from_stage: expert, minutes: -15}
        steps:
          # **要るのは握りの刃**（handheld_blade、tools.yaml）——枝を押さえて刃を面へ沿わせ、像の形が
          # 出るまで削ぎ続ける手つきで、骨針の削り出し（animals.yamlのwhittle）と同じ持ち方。下の
          # 太鼓のくり抜きが刃物なら何でもよいのと、そこが違う。
          #
          # **削り続ける工程が並ぶ**（1回は1時間まで、docs/engine/ActionSystem.md 6.3節）。刃は同じ1本が通る
          # （consume: falseは工程を跨いで数えない、crafting.remainingRequirements）。
          - requires:
              - {object: thick_branch, count: 1, consume: true}
              - {tag: handheld_blade, count: 1, consume: false}
            duration: 60
          - requires:
              - {tag: handheld_blade, count: 1, consume: false}
            duration: 60
          - requires:
              - {tag: handheld_blade, count: 1, consume: false}
            duration: 60
          # 面を整えて仕上げる。
          - requires:
              - {tag: handheld_blade, count: 1, consume: false}
            duration: 30

  # 木の太鼓。丸太をくり抜き、生皮を張って縄で締めた物。
  #
  # **獣を仕留めていないと張れない**（生皮、animals.yaml）。**狩りは snug の前提ではない**——点あたりの
  # 手間は他と揃えてあるので、狩らない周回では他の物を並べれば同じだけ払って同じだけ届く。
  log_drum:
    tags: [fixture, furnishing]
    props:
      # くり抜いた丸太（20,000gの残り）＋生皮（600）＋縄（200）。
      weight: {value: 8800}
    passives:
      - modify:
          ancestor:
            comfort: 20
    recipes:
      hollowed:
        # くり抜きも皮張りも同じ1つの手際で縮む（名乗れるのは1つ、
        # docs/engine/GameElementDefinition.md 13.5節）。**丸太を刻む工程の
        # ほうが長い**ので、木材加工を名乗る。
        deftness: {skill: skill_woodwork, from_stage: expert, minutes: -15}
        steps:
          # 丸太の芯をくり抜く。**刃物なら何でもよい**（cutting_tool）——刃を打ち込んでは屑を起こす
          # 手つきで、面へ沿わせる必要が無いので石斧でも通る（分け方は tools.yaml の sharp_stone）。
          - requires:
              - {object: log, count: 1, consume: true}
              - {tag: cutting_tool, count: 1, consume: false}
            duration: 60
          - requires:
              - {tag: cutting_tool, count: 1, consume: false}
            duration: 60
          - requires:
              - {tag: cutting_tool, count: 1, consume: false}
            duration: 60
          # 生皮を張り、縄で締め上げる。
          - requires:
              - {object: rawhide, count: 1, consume: true}
              - {object: cord, count: 1, consume: true}
            duration: 60
