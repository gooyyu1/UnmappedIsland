# 身につける衣類（docs/world/SurvivalItems.md 5節）。素材の系統ごとに置く。
#
# どれも「素材が何か」だけで分かれていて、1着で全身を覆う。**覆う部位（body）も重ね着の階層
# （base）も共通**なので、身につけられるのは同時に1着だけになる（排他制御、covers / layer、
# docs/engine/GameElementDefinition.md 7.5節）。部位を分けるのも重ね着も、衣類が増えてからでよい。
#
# **身につけられることはequippableタグが言う。** 着る先のequipmentスロット
# （characters/player_character.yaml）はこのタグだけを受け入れる。
#
# **身につけている間、寒さの入口（chill_point、characters/player_character.yaml）を押し下げる。**
# 押し下げるのは着ている側で、気温そのものを上げるのは火——効き方は違うが、合流先は同じ1つの比較
# （docs/engine/VitalsSystem.md 8.3節）。**眠っている間は寝床の押し下げも同じ境目へ重なる**
# （bedding.yaml。深さは docs/world/Bedding.md 4.2節）ので、着たまま寝れば加算になる。
#
# **深さは素材ごとに違い、手のかかる一着ほど深い**（docs/world/SurvivalItems.md 5.1節）。両端は
# 空が作る気温の刻みへ合わせてある——最も安い一着が海沿いの薄明と雨天の昼に、最も高い一着が海沿いの
# 最も寒い夜にちょうど釣り合う（同節。刻みそのものは docs/engine/VitalsSystem.md 8.4節）。
# **間の1℃ずつを見分けさせるのは土地の海抜ぶんの差**で、一着ごとに釣り合う土地が別にある
# （docs/engine/ClimateSystem.md 1.1節）。
#
# 重さは材料の和で置く（中軸のように捨てる部分だけを引く）。値を変えるときは、材料側の重さ
# （weaving.yaml・fiber.yaml・animals.yaml）と釣り合っているかを見ること。

object_defs:
  # なめし革。生皮を樹皮のなめし剤で処理した革で、皮袋・帆にも使う中間素材。
  tanned_leather:
    tags: [item]
    props:
      # 生皮（600g）から、毛と肉を落としたぶん軽くなる。**樹皮は重さに足さない**——渋が革へ入る
      # 代わりに樹皮そのものは搾りかすとして捨てるので、材料の和にならない唯一の材料。
      weight: {value: 500}
      volume: {value: 1200}
    recipes:
      tanned:
        # 皮革が最初に開ける物（docs/world/Skills.md 2節）。腕は死体を捌く操作（animals.yaml）が配る
        # ので、なめしへ進めるのは獣を捌いてきた者だけになる。「その段以上」の書き方は
        # characters/player_character.yaml。
        conditions:
          - {reason: needs_leatherwork, subject: agent, prop: skill_leatherwork, in_stage_or_above: basic}
        # 掻き落としも漬け込みも皮革の手仕事なので、速さを決めるのはその1本
        # （docs/world/Skills.md 7節）。**余分の卓は持たない**——皮1枚からは革1枚しか出ない。
        deftness: {skill: skill_leatherwork, from_stage: skilled, minutes: -15}
        # 合計480分は、同梱の世界で最も手間のかかる仕事（traps.yamlの落とし穴・farming.yamlの囲い）に
        # 並べた値。実際のなめしは日をまたぐ漬け込みだが、**1回の工程が1時間を超えられない**
        # （docs/engine/ActionSystem.md 6.3節）ので、その長さは工程の数で表す。
        steps:
          # 毛と肉を落とす。掻き落とすだけなので刃物は減らない（tools.yamlのsharp_stone）。
          # **要るのは握りの刃**（handheld_blade、tools.yaml）——皮を張って刃を寝かせ、面を端から端まで
          # 送る手つきなので、石斧では掻けない。皮を剥ぐ解体（animals.yamlのbutcher）と同じ持ち方で、
          # なめしへ進める者が解体してきた者であることと辻褄が合う。
          - requires:
              - {object: rawhide, count: 1, consume: true}
              - {tag: handheld_blade, count: 1, consume: false}
            duration: 60
          # 裏へ返して脂を掻き落とす。刃は同じ1本で足りる（consume: falseは工程を跨いで数えない、
          # crafting.remainingRequirements）。
          - requires:
              - {tag: handheld_blade, count: 1, consume: false}
            duration: 60
          # 砕いた樹皮の渋に漬ける。ひと剥ぎぶん（timber.yamlのstrip_bark）で革1枚なので、渋を替える
          # たびに1つずつ使う。
          - requires:
              - {object: tree_bark, count: 1, consume: true}
            duration: 60
          - requires:
              - {object: tree_bark, count: 1, consume: true}
            duration: 60
          - requires:
              - {object: tree_bark, count: 1, consume: true}
            duration: 60
          # 揉みながら乾かす。**何も要求しない工程**（13.1節）——渋はもう入れ終えていて、残りは手を
          # 動かす時間だけ。
          - duration: 60
          - duration: 60
          - duration: 60

  # 束ねた葉の衣類。ヤシの葉の小葉を中軸から外し、繊維で腰へ束ねただけの腰蓑。
  # 加工がほとんど要らないので、刃物も火も無いうちから作れる。
  bundled_leaf_clothing:
    # 束ねただけの葉は短命な素材（weathering.yaml）。
    traits: [short_lived_material]
    tags: [item, equippable]
    covers: [body]
    layer: base
    props:
      # 葉1枚のうち身につけるのは小葉だけで、重さの大半を占める中軸は捨てる（weaving.yaml）。
      weight: {value: 900}
      # ばらけた葉は詰めても縮まないので、嵩そのままで見る。
      volume: {value: 4000}
    passives:
      # 束ねただけの小葉は隙間だらけで、風がそのまま通る——留められる空気の層がいちばん薄い。
      - conditions: [{in_slot: equipment}]
        modify: {parent: {chill_point: -1}}
    recipes:
      # **解放条件を持たない。** 束ねるだけで編む工程が無く、刃物も火も無いうちから作れることが
      # この1着の存在意義（上のコメント）。腕を求めると、最初に着られる物が無くなる。
      #
      # **手際は名乗る**（docs/world/Skills.md 7.1節）。葉を束ねて繊維で結ぶ仕事なので、速さを
      # 決めるのは繊維・編み——腕が0でも作れることは解放条件の側が守るので、最初の1着は塞がれない。
      bundled:
        deftness: {skill: skill_cordage, from_stage: skilled, minutes: -15}
        steps:
          - requires:
              - {object: palm_frond, count: 1, consume: true}
              - {object: plant_fiber, count: 1, consume: true}
            duration: 30

  # 生皮の衣類。剥いだ皮に頭と腕を通す穴を開け、そのまま羽織る。縫わないので早いが、
  # 生皮のまま乾いた革は固く、濡らせば傷む（animals.yamlのrawhide）。
  rawhide_clothing:
    # なめしていない皮は短命な素材（weathering.yaml）。なめせば長持ちする素材へ移る（下のsewn）
    # ——手間をかける値打ちが、保つ日数としてそのまま出る。
    traits: [short_lived_material]
    tags: [item, equippable]
    covers: [body]
    layer: base
    props:
      weight: {value: 1200}
      volume: {value: 3000}
    passives:
      # 皮そのものは風を通さないが、乾いた生皮は固く、体から浮いたまま隙間が残る。
      - conditions: [{in_slot: equipment}]
        modify: {parent: {chill_point: -2}}
    recipes:
      # **解放条件を持たない。** 剥いだ皮を羽織るだけで縫わないので、皮革の腕が開ける物の一覧
      # （docs/world/Skills.md 2節）にも入っていない——腕の要らない一着として残す。
      #
      # **手際は名乗る**（同7.1節）。縫わなくても皮を扱う仕事なので、穴を開けて形を取る速さは
      # 皮革が決める——開ける腕と速さを決める腕は別の宣言で、こちらは腕が0でも作れる。
      draped:
        deftness: {skill: skill_leatherwork, from_stage: skilled, minutes: -15}
        steps:
          - requires:
              - {object: rawhide, count: 2, consume: true}
            duration: 60

  # 編んだ葉の衣類。編んだパネルを繊維で綴じ合わせる。束ねた葉より手はかかるが、
  # 編んである分だけ形が保たれる。
  woven_leaf_clothing:
    # 編んであっても素材は葉のままなので、短命な素材（weathering.yaml）。
    traits: [short_lived_material]
    tags: [item, equippable]
    covers: [body]
    layer: base
    props:
      weight: {value: 1300}
      volume: {value: 4000}
    passives:
      # 編んだ面は形を保って体へ沿うので、束ねただけの葉より厚い層を抱える。素材は葉のままなので、
      # 縫い合わせた革には届かない。
      - conditions: [{in_slot: equipment}]
        modify: {parent: {chill_point: -3}}
    recipes:
      stitched:
        # 編んだ葉の衣類は繊維・編みが開ける（docs/world/Skills.md 2節）。材料は葉と繊維だけで
        # 素材の側は初日から揃うので、編み籠と同じ位置にある（SkillSystem.md 4.2節）。
        conditions:
          - {reason: needs_cordage, subject: agent, prop: skill_cordage, in_stage_or_above: basic}
        # 綴じ合わせる手は繊維・編み（docs/world/Skills.md 7節）。
        deftness: {skill: skill_cordage, from_stage: skilled, minutes: -15}
        steps:
          # 小葉を中軸から外し、腰に回る幅へ裁つ。
          - requires:
              - {object: woven_leaf, count: 3, consume: true}
            duration: 60
          # 繊維で腰へ綴じ合わせる。
          - requires:
              - {object: plant_fiber, count: 2, consume: true}
            duration: 60

  # なめし革の衣類。裁った革を糸で縫い合わせる。骨針は道具なので**縫っても**減らない
  # （tools.yamlのbone_needle、voyage.yamlの帆と同じ要求の書き方）——減るのは屋外に置いた間だけで、
  # そちらは素材の trait が持つ（weathering.yaml）。
  tanned_leather_clothing:
    # なめし革は長持ちする素材（weathering.yaml）。**同じ1着でも生皮の10倍保つ**ので、なめしに
    # かけた手間は寿命と、下の押し下げの深さの両方で返る。
    traits: [long_lived_material]
    tags: [item, equippable]
    covers: [body]
    layer: base
    props:
      weight: {value: 1300}
      volume: {value: 3000}
    passives:
      # 裁って縫った革は体に沿い、隙間が残らない。**空が作る最も寒い夜とちょうど釣り合う深さ**なので、
      # 海抜ぶんだけ寒い山の夜には届かない（docs/engine/ClimateSystem.md 1.1節）。
      - conditions: [{in_slot: equipment}]
        modify: {parent: {chill_point: -4}}
    recipes:
      sewn:
        # 皮革の上位（docs/engine/SkillSystem.md 4.1節）。**スキルを積み上げず、同じ1本の上の段と
        # 別の1本の連言で表す**——なめし革が作れるだけでは足りず、糸を撚れることも要る。
        conditions:
          - {reason: needs_leatherwork, subject: agent, prop: skill_leatherwork, in_stage_or_above: skilled}
          - {reason: needs_cordage, subject: agent, prop: skill_cordage, in_stage_or_above: basic}
        # **速さを決めるのは連言の2本ではなく、名乗った1本**（docs/world/Skills.md 7節）。裁って縫うのは
        # 革の仕事で、糸は先に撚ってある物として入ってくる。
        deftness: {skill: skill_leatherwork, from_stage: expert, minutes: -15}
        steps:
          # 型を取り、革を裁つ。
          - requires:
              - {object: tanned_leather, count: 2, consume: true}
            duration: 60
          # 裁った革を縫い合わせる。骨針は道具なので縫っても減らない（同じ1本が3工程を通す）。
          - requires:
              - {object: yarn, count: 2, consume: true}
              - {tag: sewing_tool, count: 1, consume: false}
            duration: 60
          - requires:
              - {object: yarn, count: 1, consume: true}
              - {tag: sewing_tool, count: 1, consume: false}
            duration: 60
          # 縫い代を始末して縫い止める。
          - requires:
              - {tag: sewing_tool, count: 1, consume: false}
            duration: 60
