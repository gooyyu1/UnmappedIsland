# 身につける衣類（docs/world/SurvivalItems.md 5節）。素材の系統ごとに4種を置く。
#
# 4種は「素材が何か」だけで分かれていて、どれも1着で全身を覆う。**覆う部位（body）も重ね着の階層
# （base）も4種で共通**なので、身につけられるのは同時に1着だけになる（排他制御、covers / layer、
# docs/engine/GameElementDefinition.md 7.5節）。部位を分けるのも重ね着も、衣類が増えてからでよい。
#
# **身につけられることはequippableタグが言う。** 着る先のequipmentスロット
# （characters/player_character.yaml）はこのタグだけを受け入れる。
#
# **保温の効果もまだ無い。** 受け取る側（キャラクタのwarmthとchill_point、
# characters/player_character.yaml）は入ったが、衣類がchill_pointを押し下げる側はまだ書いていない
# ——寒さを防ぐ手段は今のところ火と洞窟だけ（docs/engine/VitalsSystem.md 8.3節）。
#
# 重さは材料の和で置く（中軸のように捨てる部分だけを引く）。値を変えるときは、材料側の重さ
# （weaving.yaml・fiber.yaml・animals.yaml）と釣り合っているかを見ること。

object_defs:
  # なめし革。生皮を樹皮のなめし剤で処理した革で、皮袋・帆にも使う中間素材。
  tanned_leather:
    tags: [item]
    props:
      # 生皮（600g）から、毛と肉を落としたぶん軽くなる。**樹皮は重さに足さない**——渋が革へ入る
      # 代わりに樹皮そのものは搾りかすとして捨てるので、材料の和にならない唯一の材料。
      weight: {value: 500}
      volume: {value: 1200}
    recipes:
      tanned:
        # 皮革が最初に開ける物（docs/world/Skills.md 2節）。腕は皮を剥ぐ操作（animals.yamlのbutcher）
        # が配るので、なめしへ進めるのは獣を捌いてきた者だけになる。段の並べ方は
        # characters/player_character.yaml。
        conditions:
          - reason: needs_leatherwork
            any:
              - {subject: agent, prop: skill_leatherwork, in_stage: basic}
              - {subject: agent, prop: skill_leatherwork, in_stage: skilled}
              - {subject: agent, prop: skill_leatherwork, in_stage: expert}
        # 合計480分は、同梱の世界で最も長い1つの作業（farming.yamlの畑を起こす480分）に並べた値。
        # 実際のなめしは日をまたぐ漬け込みだが、途中で止められない工程として持つ以上これ以上は
        # 伸ばさない（GameElementDefinition.md 11.3節）。工程を2つに割ってあるのも同じ理由。
        steps:
          # 毛と肉を落とす。掻き落とすだけなので刃物は減らない（tools.yamlのsharp_stone）。
          - requires:
              - {object: rawhide, count: 1, consume: true}
              - {tag: cutting_tool, count: 1, consume: false}
            duration: 120
          # 砕いた樹皮の渋に漬け、揉みながら乾かす。ひと剥ぎぶん（timber.yamlのstrip_bark）で革1枚。
          - requires:
              - {object: tree_bark, count: 3, consume: true}
            duration: 360

  # 束ねた葉の衣類。ヤシの葉の小葉を中軸から外し、繊維で腰へ束ねただけの腰蓑。
  # 加工がほとんど要らないので、刃物も火も無いうちから作れる。
  bundled_leaf_clothing:
    tags: [item, equippable]
    covers: [body]
    layer: base
    props:
      # 葉1枚のうち身につけるのは小葉だけで、重さの大半を占める中軸は捨てる（weaving.yaml）。
      weight: {value: 900}
      # ばらけた葉は詰めても縮まないので、嵩そのままで見る。
      volume: {value: 4000}
    recipes:
      # **解放条件を持たない。** 束ねるだけで編む工程が無く、刃物も火も無いうちから作れることが
      # この1着の存在意義（上のコメント）。腕を求めると、最初に着られる物が無くなる。
      bundled:
        steps:
          - requires:
              - {object: palm_frond, count: 1, consume: true}
              - {object: plant_fiber, count: 1, consume: true}
            duration: 30

  # 生皮の衣類。剥いだ皮に頭と腕を通す穴を開け、そのまま羽織る。縫わないので早いが、
  # 生皮のまま乾いた革は固く、濡らせば傷む（animals.yamlのrawhide）。
  rawhide_clothing:
    tags: [item, equippable]
    covers: [body]
    layer: base
    props:
      weight: {value: 1200}
      volume: {value: 3000}
    recipes:
      # **解放条件を持たない。** 剥いだ皮を羽織るだけで縫わないので、皮革の腕が開ける物の一覧
      # （docs/world/Skills.md 2節）にも入っていない——腕の要らない一着として残す。
      draped:
        steps:
          - requires:
              - {object: rawhide, count: 2, consume: true}
            duration: 60

  # 編んだ葉の衣類。編んだパネルを繊維で綴じ合わせる。束ねた葉より手はかかるが、
  # 編んである分だけ形が保たれる。
  woven_leaf_clothing:
    tags: [item, equippable]
    covers: [body]
    layer: base
    props:
      weight: {value: 1300}
      volume: {value: 4000}
    recipes:
      stitched:
        # 編んだ葉の衣類は繊維・編みが開ける（docs/world/Skills.md 2節）。材料は葉と繊維だけで
        # 素材の側は初日から揃うので、編み籠と同じ位置にある（SkillSystem.md 4.2節）。
        conditions:
          - reason: needs_cordage
            any:
              - {subject: agent, prop: skill_cordage, in_stage: basic}
              - {subject: agent, prop: skill_cordage, in_stage: skilled}
              - {subject: agent, prop: skill_cordage, in_stage: expert}
        steps:
          - requires:
              - {object: woven_leaf, count: 3, consume: true}
              - {object: plant_fiber, count: 2, consume: true}
            duration: 120

  # なめし革の衣類。裁った革を糸で縫い合わせる。骨針は道具なので減らない
  # （tools.yamlのbone_needle、voyage.yamlの帆と同じ要求の書き方）。
  tanned_leather_clothing:
    tags: [item, equippable]
    covers: [body]
    layer: base
    props:
      weight: {value: 1300}
      volume: {value: 3000}
    recipes:
      sewn:
        # 皮革の上位（docs/engine/SkillSystem.md 4.1節）。**スキルを積み上げず、同じ1本の上の段と
        # 別の1本の連言で表す**——なめし革が作れるだけでは足りず、糸を撚れることも要る。
        conditions:
          - reason: needs_leatherwork
            any:
              - {subject: agent, prop: skill_leatherwork, in_stage: skilled}
              - {subject: agent, prop: skill_leatherwork, in_stage: expert}
          - reason: needs_cordage
            any:
              - {subject: agent, prop: skill_cordage, in_stage: basic}
              - {subject: agent, prop: skill_cordage, in_stage: skilled}
              - {subject: agent, prop: skill_cordage, in_stage: expert}
        steps:
          - requires:
              - {object: tanned_leather, count: 2, consume: true}
              - {object: yarn, count: 3, consume: true}
              - {tag: sewing_tool, count: 1, consume: false}
            duration: 240
