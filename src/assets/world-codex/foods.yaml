# 食料のサンプル定義（GameElementDefinition.md参照）。栄養バランス（characters.yaml参照）の
# 3カテゴリそれぞれに、南国の無人島で採取しやすい食材を1種類ずつ用意する。
# 食べ物が名乗るのは**かさ（satiety、mL）と中身（糖質・たんぱく質・脂質はtick、ビタミンはmg）**で、
# 両者は別の数（docs/engine/DigestionSystem.md）。水気の多い物はかさだけ大きく、生肉はかさの割に
# 身にならない。値はいずれも仮のもの。
#
# foodタグは「そのカード自身を口に入れると体の値が動く物」に付ける（CardView.md 2.1節）。eatで食べる
# 物だけでなく、青いヤシの実（coconut.yaml）のようにcombinationで飲む物にも付く。加工すれば食べられる
# だけの物には付けない——熟したヤシの実は皮をはいでも自分は何も体へ入れない。

object_defs:
  # 空心菜（クウシンサイ）。熱帯の水辺に自生する、採取しやすい葉物野菜。
  water_spinach:
    tags: [item, food, plant_bait]
    props:
      weight: {value: 150}
      # 罠へ仕掛けると草食の卓が引かれやすくなる（docs/engine/TrapSystem.md 4節）。
      plant_bait: {value: 8}
      # 葉物の束も詰めて縮まないので、嵩そのままで見る。
      volume: {value: 3000}
    actions:
      eat:
        conditions:
          - reason: too_full
            not: {subject: actor, prop: satiety, in_stage: full}
        duration: 15
        add:
          actor:
            satiety: 300
            carbohydrate: 1
            vitamin: 83
        destroy: self

  # ヤシガニ。狩猟の道具がなくても「見つけて捕まえる」だけで採取できる大型の甲殻類。
  coconut_crab:
    tags: [item, food, meat_bait]
    props:
      weight: {value: 2000}
      meat_bait: {value: 12}
      volume: {value: 1900}
    actions:
      eat:
        conditions:
          - reason: too_full
            not: {subject: actor, prop: satiety, in_stage: full}
        duration: 15
        add:
          actor:
            satiety: 500
            protein: 25
            lipid: 8
            vitamin: 2
        destroy: self

  # タロイモ。東南アジア島嶼が原産の塊茎作物（docs/world/Animals.md 概要節）。野生形が自生している。
  taro:
    tags: [item, food, plant_bait]
    props:
      weight: {value: 800}
      plant_bait: {value: 12}
      volume: {value: 800}
    actions:
      eat:
        conditions:
          - reason: too_full
            not: {subject: actor, prop: satiety, in_stage: full}
        duration: 15
        add:
          actor:
            satiety: 600
            carbohydrate: 40
            protein: 2
            vitamin: 36
        destroy: self
