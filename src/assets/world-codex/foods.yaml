# 食料のサンプル定義（GameElementDefinition.md参照）。栄養バランス（characters.yaml参照）の
# 3カテゴリそれぞれに、南国の無人島で採取しやすい食材を1種類ずつ用意する。
# 食べ物が名乗るのは**かさ（satiety、mL）と中身（糖質・たんぱく質・脂質はtick、ビタミンはmg）**で、
# 両者は別の数（docs/engine/DigestionSystem.md）。水気の多い物はかさだけ大きく、生肉はかさの割に
# 身にならない。値はいずれも仮のもの。
#
# **かさ・中身とは別に、食べた喜び（happiness）も名乗る。** どの食べ物がどの値を名乗るかは
# docs/world/Characters.md 幸福度節の表が持ち、書き忘れは tests/world-codex/foodsYaml.test.ts が
# 全数で見張る。
#
# **食べる操作は明るさの条件を持たない**——口へ運ぶのは手が覚えている動作
# （docs/engine/IlluminationSystem.md 5節）。刃を当てる下ごしらえ（taroのchop）は手元を見る作業なので、
# そちらだけが条件を持つ。
#
# foodタグは「そのカード自身を口に入れると体の値が動く物」に付ける（CardView.md 2.1節）。eatで食べる
# 物だけでなく、青いヤシの実（coconut.yaml）のようにcombinationで飲む物にも付く。加工すれば食べられる
# だけの物には付けない——熟したヤシの実は皮をはいでも自分は何も体へ入れない。

# 腐敗（docs/engine/DurabilitySystem.md 3節）。**分類の違いは通常温度で減る速さ1つだけ**なので、
# 速さだけをtraitに分ける。durability本体と、屋外に置いたぶんの上乗せ（分類によらず-1）は
# perishableが持ち、食べ物は「腐ること」と「どれだけ速いか」を名乗る。
#
# 食べ物は他のファイル（coconut.yaml・fiber.yaml・animals.yaml）にも居るので、そこからも参照する。
#
# 保存は`cure`軸として食べ物の側が名乗る（値と、それを与える加工は保存の手ごとのファイルに在る）。軸を宣言した型に
# だけ加工を重ねられ、重ねると同じ個体が保存された版になる（3.5.1節）。**軸を持つのは生のままの物
# だけ**——焼くのは食べるための工程なので、焼いた物を保たせる形（塩漬けの焼き芋）は作らない。
#
# 傷んだ物を食べたときの吐き下しは、各eatの末尾のpickが引く（docs/engine/DigestionSystem.md 6.3節）。
# 重みは「無事100 : 吐く spoilage : 下す spoilage」で、**pickはaddより後ろに置く**——腹に
# 収めてから吐くので、順が逆だと吐いた後に食べたことになる（GameElementDefinition.md 9.7節）。
traits:
  perishable:
    # 腐る物であること。塩（salt.yaml）が重ねる相手を指すのに使う。**食べられるかとは別**なので
    # foodタグとは重ならない——生のヤシガニは食べられないが腐る。
    tags: [perishable]
    props:
      # 尽きると食べられなくなるので、満タン側がgood（CardView.md 8節）。上限は種類によらず960
      # （DurabilitySystem.md 1節）。
      durability:
        gauge: {min: bad, max: good}
        value: 960
        range: {min: 0, max: 960}
        # 腐りきった食べ物は残らない。**名乗らずに消す**——消え方の名前（9.3節）を出す先がまだ無い。
        on_min:
          destroy: self
        # 傷み具合（docs/engine/DigestionSystem.md 6.3節）。**境目は残りの割合で置く**——腐る速さは
        # 分類で違うが、durabilityは種類によらず960から始まるので、同じ数が全部の食べ物で
        # 「残り半分」「残り4分の1」を指す。
        stages:
          - name: rotten
            alert: danger
            passives:
              - modify: {self: {spoilage: 100}}
          - name: stale
            min: 240
            alert: caution
            passives:
              - modify: {self: {spoilage: 25}}
          - {name: sound, min: 480}
      # 食べたときに吐き下しを引く重み（同6.3節）。自分では動かず、上のdurabilityの段だけがmodifyで
      # 押し上げるのでvalueは0のまま——無事な物を食べても当たらない。
      spoilage: {value: 0}
    passives:
      # 屋外に置いたぶんの上乗せ。短命な素材と同じ速さ（同2節）で、腐敗とは別のaddとして加算的に
      # 重なる（8.4節）。守られている場所——蓋つきの入れ物・浅い洞窟——では成立しない
      # （ContainerSystem.md 6節）。**天気は見ない**: 雨のぶんは同5節の未決。
      - conditions:
          - {subject: ancestor, prop: sheltered, eq: 0}
        add:
          self:
            durability: -1

  # 保存された物の速さ。**腐敗の速さは既にある3段（docs/engine/DurabilitySystem.md 3節）のうち
  # 最も遅い段（芋と同じ-0.5＝通常温度で20日）で、新しいレートは持ち込まない。** 生の速さのほうは
  # 保存されている間だけ効かない（下のspoils_*）ので、ここが名乗る1つだけが残る。
  #
  # 屋外の上乗せ（分類によらず-1）は上のperishableが持ったままなので、保存しても外へ置けば6.7日に
  # 落ちる。**塩も日差しも温度と湿りの代わりにはならない。**
  #
  # **保存の仕方が増えても行き先はここ1つ。** cure軸の値がこのtraitを配るので、加工の側が名乗るのは
  # 名前だけになる。
  cured:
    tags: [cured]
    passives:
      - add: {self: {durability: -0.5}}

  # 生のままの速さ。どれも**保存されていない間だけ**効く（上のcured）——保存した物がどれだけ保つかは
  # 1箇所で名乗るので、ここで打ち消す量を書くことにはならない。
  #
  # 調理済み料理・生魚など。通常温度で2.5日（屋外なら2日）。
  spoils_fast:
    passives:
      - conditions:
          - not: {subject: self, matches: {tag: cured}}
        add: {self: {durability: -4}}

  # 野菜など。通常温度で5日（屋外なら3.3日）。
  spoils_normal:
    passives:
      - conditions:
          - not: {subject: self, matches: {tag: cured}}
        add: {self: {durability: -2}}

  # 芋など。通常温度で20日（屋外なら6.7日）。
  spoils_slow:
    passives:
      - conditions:
          - not: {subject: self, matches: {tag: cured}}
        add: {self: {durability: -0.5}}

  # 下ごしらえの済んだ物（docs/world/Skills.md 2.5節）。**料理の腕の入口はこの手**で、火にかける手には
  # どの腕も配れない——火にかけた後を進めるのは炉であって人ではないため（同節）。
  #
  # **払った手間が返るのは火の通り。** 炉が子のcooking_progressを進める（docs/engine/FireSystem.md 7節）
  # ので、下ごしらえが効ける先はその進みしかない。
  #
  # **宣言を持つのは食べ物の側**（干し場の上乗せと同じ向き、drying.yaml）。炉が渡す熱は枠の中の全部へ
  # 同じだけ渡るので、刻んであるかどうかを炉の側からは見分けられない。
  #
  # **prep軸の値が配るtraitはこれ1つ。** 刻む・串に刺す・皮を剥くのどれであっても、返るものは同じ
  # 火の通りなので、加工の側が名乗るのは名前だけになる（cureと同じ形）。
  prepped:
    # prep軸の受け皿（下ごしらえの操作が、ここを名乗る型へだけ相手を変える）。
    tags: [prepped]
    passives:
      # 火にかけているあいだ、炉が渡す熱へ上乗せする。**最もよく効くのは熾火**——加算なので、
      # 熾火（1/tick）では3倍になり、炎（3/tick）では5/3にしかならない。刻めば弱い火でも芯まで
      # 通る、という形でそのまま読める（加算から出る偏りは均さない、docs/world/Skills.md 7節）。
      - conditions:
          - {subject: parent, prop: heat, in_stage_or_above: coals}
        add: {self: {cooking_progress: 2}}
      # 切り口が外気に触れるぶん、腐るのが速くなる。**分類によらず-1**で、量は屋外に置いたぶんの
      # 上乗せ（上のperishable）から借りている。**門は持たない**——あちらは屋根の下なら成立しない
      # が、切り口は蓋つきの入れ物の中でも塞がらない。**下ごしらえは火にかける直前**という順序は、
      # ここが作る——先に刻んで溜めておくと、火にかける前に傷む。
      - add: {self: {durability: -1}}

object_defs:
  # 空心菜（クウシンサイ）。熱帯の水辺に自生する、採取しやすい葉物野菜。
  #
  # **火を通さずに食べられる。** 東南アジアでは実際に生のまま和えて食べる。危ないのは植物では
  # なく育った水のほう（寄生虫）なので、物としては生食に向く。ヤシガニとタロイモは違う（各項参照）。
  water_spinach:
    tags: [item, food, plant_bait]
    traits: [perishable, spoils_normal, dryable, smokable]
    props:
      weight: {value: 150}
      # 罠へ仕掛けると草食の卓が引かれやすくなる（docs/engine/TrapSystem.md 4節）。
      plant_bait: {value: 8}
      # 葉物の束も詰めて縮まないので、嵩そのままで見る。
      volume: {value: 3000}
    # 塩漬けにできる（salt.yaml）。漬けた葉物は5日から20日へ延びる。
    variation_axes:
      cure: {of: {tag: cured}}
    interactions:
      eat:
        trigger: menu
        conditions:
          - reason: too_full
            not: {subject: agent, prop: satiety, in_stage_or_above: full}
        duration: 15
        add:
          agent:
            satiety: 300
            carbohydrate: 1
            vitamin: 83
            happiness: 2
        pick:
          - weight: 100
          - weight: {prop: spoilage}
            set: {agent: {satiety: 0}}
            add: {agent: {carbohydrate: -40, protein: -40, lipid: -40}}
          - weight: {prop: spoilage}
            add: {agent: {carbohydrate: -40, protein: -40, lipid: -40, hydration: -48}}
        destroy: self

  # ベリー。木苺の熟した実をひと掴みぶん摘み取ったもの（locations.yamlのberry_bush）。
  #
  # **バナナ（fiber.yaml）と同じ、生でうまい果実。** 採り方だけが違う——あちらは一度実った茎が二度と
  # 実らないので株ごと切り倒すが、こちらは摘んでも株が残り、また実る。
  #
  # **餌にはならない**（plant_baitを持たない）。果実がそうでないのはバナナと同じ線で、罠と囲いの卓を
  # 押すのは芋と葉物（上のwater_spinach・下のtaro）に留める。
  berry:
    tags: [item, food]
    traits: [perishable, spoils_normal, dryable, smokable]
    props:
      # ひと掴みぶん。
      weight: {value: 250}
      # 粒の間に隙間が残るので、目方より嵩が勝つ。
      volume: {value: 350}
    # 塩漬けにできる（salt.yaml）。剥き身の段に居る点も、皮という境目を持たない点もバナナと同じ。
    variation_axes:
      cure: {of: {tag: cured}}
    interactions:
      eat:
        trigger: menu
        conditions:
          - reason: too_full
            not: {subject: agent, prop: satiety, in_stage_or_above: full}
        duration: 15
        add:
          agent:
            satiety: 250
            # 甘いが粒が小さく、身になる量はバナナ1本に届かない。ビタミンCはそのぶん濃い。
            carbohydrate: 2
            vitamin: 65
            happiness: 4
        pick:
          - weight: 100
          - weight: {prop: spoilage}
            set: {agent: {satiety: 0}}
            add: {agent: {carbohydrate: -40, protein: -40, lipid: -40}}
          - weight: {prop: spoilage}
            add: {agent: {carbohydrate: -40, protein: -40, lipid: -40, hydration: -48}}
        destroy: self

  # ヤシガニ。狩猟の道具がなくても「見つけて捕まえる」だけで採取できる大型の甲殻類。
  #
  # **生では食べられないので、foodタグを持たない**（ネズミの死体と同じ扱い、animals.yaml）。2kgの
  # 甲殻を素手で開けて生食する話にならないうえ、生の甲殻類そのものが危ない。殻ごと火にかけるのが
  # 現実の食べ方でもある。
  #
  # **現実には、加熱しても抜けない危険が別にある。** ヤシガニは食べたものの毒を身に溜め、ミフクラギ
  # （海マンゴー）などを食べた個体は肉ごと有毒になる。体調を崩す道は、腐敗の抽選（DigestionSystem.md
  # 6.3節）と生の物が抱えている菌（同6節）の2つだが、**調理で避けられない当たり**はどちらでもまだ
  # 書けないので入れていない（docs/world/Animals.md 1節）。
  coconut_crab:
    tags: [item, meat_bait, roastable]
    # 生の甲殻類。食べられなくても傷むのは同じなので、foodタグの有無とは関わりなく腐る。
    traits: [perishable, spoils_fast, dryable, smokable]
    props:
      weight: {value: 2000}
      meat_bait: {value: 12}
      volume: {value: 1900}
      # 2kgを殻ごと焼くので、生肉（500gで24）より長くかかる。炎（3/tick）なら12tick＝3時間。
      cooking_progress:
        value: 0
        range: {min: 0, max: 36}
        on_max:
          destroy: self
          spawn: {object: roasted_coconut_crab}
    # 塩漬けにできる（salt.yaml）。2.5日しか保たない生の甲殻が20日保つようになる——**焼くのは
    # 食べる直前**という順序が、これで初めて選べるようになる（焼いてから漬けることはできない）。
    variation_axes:
      cure: {of: {tag: cured}}

  # 丸焼きのヤシガニ。殻が器になるので、割って身を掻き出して食べる。
  roasted_coconut_crab:
    tags: [item, food, roastable]
    traits: [perishable, spoils_fast]
    props:
      # 水が飛んだぶん軽くなる。
      weight: {value: 1700}
      volume: {value: 1800}
      # 焦げるまでの猶予は生から焼きより短い。炎なら6tick＝1時間30分。
      cooking_progress:
        value: 0
        range: {min: 0, max: 18}
        on_max:
          destroy: self
          spawn: {object: charred_lump}
    interactions:
      eat:
        trigger: menu
        conditions:
          - reason: too_full
            not: {subject: agent, prop: satiety, in_stage_or_above: full}
        duration: 15
        add:
          agent:
            satiety: 460
            protein: 28
            lipid: 9
            vitamin: 1
            happiness: 6
        pick:
          - weight: 100
          - weight: {prop: spoilage}
            set: {agent: {satiety: 0}}
            add: {agent: {carbohydrate: -40, protein: -40, lipid: -40}}
          - weight: {prop: spoilage}
            add: {agent: {carbohydrate: -40, protein: -40, lipid: -40, hydration: -48}}
        destroy: self

  # タロイモ。東南アジア島嶼が原産の塊茎作物（docs/world/Animals.md 概要節）。野生形が自生している。
  #
  # **生では食べられないので、foodタグを持たない。** シュウ酸カルシウムの針状結晶を含み、生の塊茎は
  # 口と喉を刺して腫れさせる。「加熱したほうがおいしい」ではなく、加熱が食用の条件で、しかも自生の
  # 野生形は栽培種より強い。熾火に埋めて焼くのが太平洋の島々の調理法（茹でるほうが効くが、鍋は
  # 火より後に来る）。
  taro:
    tags: [item, plant_bait, roastable]
    # 土の中で育った塊茎そのもの。表の「芋など」はこれを指す。
    traits: [perishable, spoils_slow]
    props:
      weight: {value: 800}
      plant_bait: {value: 12}
      volume: {value: 800}
      # 刻むのにかかる時間。**どの腕がどの段からどれだけ縮めるかは、この操作が自分で宣言する**
      # （docs/world/Skills.md 7節）。**素がtickの刻み1つ分では腕の効きようが無い**ので、2つ分から
      # 始めて届いた段で半分になる——火にかけるたびに繰り返す手なので、撚る・解体すると同じ置き方。
      chop_minutes:
        value: 30
        passives:
          - conditions:
              - {subject: agent, prop: skill_cooking, in_stage_or_above: skilled}
            modify: {self: {chop_minutes: -15}}
      # **肉より長くかける。** 針状結晶を壊すには芯まで熱を通す必要があり、生焼けでは食べられない。
      # 炎（3/tick）なら10tick＝2時間30分。刻んであれば上乗せが乗る（上のprepped）ので6tick＝1時間30分。
      cooking_progress:
        value: 0
        range: {min: 0, max: 30}
        on_max:
          destroy: self
          spawn: {object: roasted_taro}
    # **塩漬けにはできない**（salt.yamlのcure軸を名乗らない）。海鳥の卵・殻の中のヤシの実と同じ線
    # （voyage.yaml・coconut.yaml）で、**上の遅さがそのまま理由**——土の中で眠る塊茎は皮が水を抱えた
    # ままにしているからこの段に居るので、隔てているものが既に塩の仕事をしている。
    #
    # **下ごしらえはできる**（下のchop）。**今のところ置けるのはこの芋だけ**で、線は2本重なっている。
    # **返るのが火の通りなので、置ける先は生のままで火にかける物だけ**（roastableでcooking_progressを
    # 持つ側）——青いヤシの実も海鳥の卵も、刻んで返るものが無い。**そのうち保存の軸を持たないのが
    # この芋だけ**で、軸の値の組は1本ずつしか作られない（変種の変種は作らない、
    # GameElementDefinition.md 3.5.1節）ため、干す・燻す・漬ける先を持つ生肉・死体・ヤシガニを
    # 刻むと、その先を丸ごと失う。
    variation_axes:
      prep: {of: {tag: prepped}}
    interactions:
      # 刻む。**料理の腕の入口**（docs/world/Skills.md 2.5節）で、火にかける手ではなくここが伸ばす。
      #
      # **要るのはcutting_tool**（tools.yaml）——刃を一線へ入れて断つ手つきなので、柄の先へ頭部を
      # 据えた石斧でも通る。皮を剥ぐ手（handheld_blade）と分けているのはそちら側の宣言。
      #
      # 刃を当てて押し切る手元の作業なので、明るさの条件が要る（docs/engine/IlluminationSystem.md 5節）。
      chop:
        trigger: {drag: {tag: cutting_tool}}
        duration: {prop: chop_minutes}
        conditions:
          - reason: too_dark
            subject: agent
            prop: hand_brightness
            in_stage_or_above: bright
          # **二度は刻めない。** 刻んだ芋にもこの操作は残り、`become`の行き先も自分自身として解ける
          # ——干した物へ塩を打てないのは行き先が無いからだが（drying.yaml）、同じ軸の同じ値へ移る
          # ここはそうならない。**塞がないと、1つを刻み直すだけで腕が伸び続ける。**
          - reason: already_prepped
            not: {subject: self, matches: {tag: prepped}}
        # 料理の腕（docs/engine/SkillSystem.md 3節の実行経路、量の置き方は
        # characters/player_character.yaml）。**今のところ料理を伸ばす唯一の操作。**
        #
        # **余分の卓は持たない。** 刻んでも芋は1つのままで、増えるのは切り口だけ
        # （docs/world/Skills.md 7節の、まとめて取れる物ではない側）。
        add: {agent: {skill_cooking: 2}}
        become: {prep: chopped}

  # prep軸の値。**traitsだけを宣言する**（3.5.1節）——変種へ配られるのは上のpreppedで、この型自身の
  # インスタンスは作られない。塩漬け・干物・燻製がcure軸で1つの行き先を分け合うのと同じ形。
  chopped:
    traits: [prepped]

  # 焼いたタロイモ。芯まで火が通って、初めて食べられる。
  roasted_taro:
    tags: [item, food, roastable]
    # **焼くと保たなくなる。** 20日保つ芋も、火を通せば調理済み料理の2.5日へ落ちる。まとめて焼いて
    # 置いておくことはできない。
    traits: [perishable, spoils_fast]
    props:
      # 水が飛んだぶん軽くなる。
      weight: {value: 600}
      volume: {value: 700}
      # 焦げるまでの猶予は生から焼きより短い。炎なら5tick＝1時間15分。
      cooking_progress:
        value: 0
        range: {min: 0, max: 15}
        on_max:
          destroy: self
          spawn: {object: charred_lump}
    interactions:
      eat:
        trigger: menu
        conditions:
          - reason: too_full
            not: {subject: agent, prop: satiety, in_stage_or_above: full}
        duration: 15
        add:
          agent:
            satiety: 550
            # 水が飛んで詰まったぶん、糖質は生より濃い。ビタミンCは熱で壊れるので逆に減る。
            carbohydrate: 48
            protein: 2
            vitamin: 24
            happiness: 6
        pick:
          - weight: 100
          - weight: {prop: spoilage}
            set: {agent: {satiety: 0}}
            add: {agent: {carbohydrate: -40, protein: -40, lipid: -40}}
          - weight: {prop: spoilage}
            add: {agent: {carbohydrate: -40, protein: -40, lipid: -40, hydration: -48}}
        destroy: self
