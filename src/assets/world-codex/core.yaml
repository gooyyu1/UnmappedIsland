# ゲーム全体の基本定義（docs/engine/GameElementDefinition.md参照）。シングルトンのworldと
# locationsスロット・locationトレイトのみを含む。個々のlocation種別と道はlocations.yaml、
# 地形生成はterrain_generation.yamlが持つ。

# プロパティのカテゴリ（GameElementDefinition.md 6.7節）。props側の`tags`はここで宣言した名前しか
# 使えない。宣言順がそのままUIでのタブの並び順になる。
property_tags:
  # ステータスエリアに常時バーで出すもの。他のカテゴリと重ねて付ける（満腹度はstatusでありnutrition
  # でもある）ため、「どのカテゴリか」ではなく「常に見せるか」だけを表すタグとして独立させている。
  status:
  health:
  nutrition:

# レシピ一覧の棚（docs/ui/Windows.md 9節）。完成品はこの並びで**最初に一致したタグ**の棚に
# だけ載るので、並びは「粗い分類ほど後ろ」にする。どれにも当たらない完成品は「その他」へ落ちる
# （tests/world-codex/purposeTags.test.tsが同梱データにそれが無いことを見張る）。
recipe_categories: [tool, container, fixture, item]

# タグが名乗った以上、それに要るプロパティは宣言されていなければならない
# （GameElementDefinition.md 4.2節）。**この世界の約束**であって、エンジンの規則ではない。
required_props:
  # 持ち歩ける物（docs/world/SurvivalItems.md）。担いだ人の負荷は重さから積み上がり、入れ物の
  # 容量はかさで決まる（ContainerSystem.md）。**どちらも書き忘れると静かに効く**——重さ0の物は
  # 無限に持ち運べ、かさ0の物は容量のある入れ物へ無限に詰め込める。
  item: [weight, volume]
  # **据えた物も目方を名乗る。** 動かせないからではなく、**この世界に実体として在るから**——炉を筏へ
  # 据えれば積荷として効き、中に入れた物の重さもそこを通って筏まで届く（ContainerSystem.md 1.1節）。
  # 名乗らない入れ物が間に挟まると、中身の重さはそこで消える。地形そのもの（道・洞窟の入口・湧き水）は
  # 0を宣言する——**0は宣言漏れではなく、そう決めたという印**になる。
  fixture: [weight]
  # 傷それ自体に目方は無いが、当てた治療具を抱える入れ物なので、中身の重さを負った本人へ渡す口が
  # 要る（ContainerSystem.md 1節）。
  injury: [weight]
  # 担いだ物の重さを受け取る口（同2節）。担ぐのはキャラクタだけ。**体重も名乗る**——筏に乗れば
  # 自分も積荷として効き、手に持った物の重さもそこを通る。
  character: [load, weight]

# 工程を進めるのに満たしていなければならない条件（GameElementDefinition.md 13.4節）。
# **全レシピに一律で掛かる。** レシピが表しているのは物を3つ以上組み合わせる複雑な作業なので、
# 手元が見えなければどれも進まない（docs/engine/IlluminationSystem.md 5節）。
#
# **レシピごとには書かない。** 書き分けると、条件の無いレシピが「暗くてもできると決めた」のか
# 「書き忘れた」のか見分けが付かなくなる。
#
# 手作業のうち`interactions`として宣言されているもの（打つ・剥ぐ・撚る）は、同じ段を自分の
# conditionsに書く。**火を熾すことだけは書かない**——摩擦発火は手と耳の作業で、熾は自分で光る。
# ここを塞ぐと、日が落ちた後に明かりを取り戻す道が無くなる。
#
# 段の名前で見るので、境目はキャラクタのhand_brightnessのstagesだけが持つ
# （characters/player_character.yaml、IlluminationSystem.md 5節）。
crafting_conditions:
  - reason: too_dark
    subject: actor
    prop: hand_brightness
    in_stage: bright

# 製作中オブジェクトが完成品から引き継ぐタグ（docs/engine/RecipeSystem.md 5節）。挙げてよいのは
# **どこに置けるかを言うタグ**だけで、何ができるかを言うタグ（tool・weapon・sail・pottery）は
# 挙げない——作りかけはまだその物ではないので、道具の枠にも操作の相手にも当てはまってはいけない。
in_progress_tags: [item, fixture]

traits:
  # あらゆる「場所」が探索の可否によらず共通して持つ構造（ExplorationSystem.md参照）。
  # worldのlocationsスロットの受け入れ判定用のタグ（GameElementDefinition.md 4.1節・7.2節）もこのtraitが配る。
  # スロットの宣言順に意味がある: spawn（9.4節）は配置先スロットを宣言順に走査し、
  # 配置失敗時のフォールバックは先頭スロットへ入るため、itemsを先頭に置く
  # （「持ちきれない物は地面に落ちる」を実現する）。
  location:
    tags: [location]
    slots:
      # アイテム用スロット。
      items:
        cell: {accept: {tag: item}}
      # 道・木・植物・建築物・家具・洞窟の入口など、持ち歩けないもののスロット。
      # 束ねるかどうかは物の側が決める（ObjectDefのstackable、SlotSystem.md 4節）——道は行き先が
      # 個体ごとに違うので束ねない。木は束ねてよい。
      fixtures:
        cell: {accept: {tag: fixture}}
      # キャラクタ用スロット。1枠だけ（枠数を決めると位置も安定する、SlotSystem.md 3節）。
      characters:
        cell_count: 1
        cell: {accept: {tag: character}}
    props:
      # その場を満たしている明るさ（IlluminationSystem.md 2節）。世界の明るさ（時刻と天気）を土台に、
      # 樹冠と地面の反射ぶんを足したもの。**据え付けの光源は入らない**（同3節）。
      # 底の-6は「これより暗い場所を区別しない」暗さの底で、光源より前に効く（同4節）。
      #
      # **valueを持たないので、場所ごとに必ず与える**（5節）。樹冠も反射も場所ごとに違い、
      # 既定値を置くと書き忘れがそのまま「開けた土地」として通る。内訳の表は
      # ContentSkeleton.md 8.1.2節が持ち、定義に書くのは合計だけ。
      ambient_brightness:
        base: {subject: ancestor}
        range: {min: -6, max: 17}
      # 手元の明るさ（同2節）。地面や炉に据えられた光源はここへ届く。
      #
      # **場所はlooking_brightnessを持たない。** これが「据え付けの光源は視界を明るくしない」の
      # 全部で、光源の側は自分がどちらに効くかを知らない（同3節）。
      hand_brightness:
        value: 0
        base: {subject: self, prop: ambient_brightness}

object_defs:
  world:
    singleton: true
    props:
      # 累積tick数（上限なし）。毎tick自分自身を+1する（プロパティレベルのpassives、8節）。
      tick:
        value: 0
        passives:
          - add:
              self:
                tick: 1
      # 1tickに相当するゲーム内時間（分）。ゲーム側（WorldSession）は実行時にこの値を読む。
      minutes_per_tick:
        value: 15
      # 現在の分（0-59）。溢れたらhourへ繰り上げ（6.3節のon_max）。setではなくaddで折り返すのは、
      # 1tickで複数span分溢れても超過分を保持できるため。毎tickの加算はゲーム側（WorldSession）が担う
      # （YAML側にもpassivesを持つと二重加算になるため、tick駆動のpassivesは持たない）。
      minute:
        value: 0
        range: {min: 0, max: 60}
        on_max:
          add:
            self:
              minute: -60
              hour: 1
      # 現在の時（0-23）。溢れたらdayへ繰り上げ。
      # stages（6.4節）+passives（8節）でambient_brightnessへ太陽高度ぶんの寄与を与える（天気の
      # 透過率はweather側。両者のmodifyが加算的に重なる）。赤道付近の島なので日の出6時・日没18時が
      # 年間ほぼ動かず（ContentSkeleton.md 8.1.3節）、太陽は1時間に15°動く。各段の値は
      # **その1時間の中央の太陽高度**での雲のまったく無い空の照度（125,000 lx × sin²高度）をEVへ直したもの
      # （EV = log2(照度 / 2.5 lx)、IlluminationSystem.md 1節）。
      # 夜は月あかりだけになるが、**半月固定**（ContentSkeleton.md 8.1.1.1節）なので底へ均される
      # ——半月の照度は満月の約1/10（中天で0.025 lx = -6.6）で、底の-6（0.039 lx）を下回るため、
      # 月の高度で刻んでも結果が変わらない。夜は0時をまたぐため、先頭のフォールバック段階（0-5時）と
      # night_late（18-23時）の2エントリで概念上1つの「夜」段階を表す。
      # valueは抽選前の既定値であって、実際の開始時刻ではない（新しいゲームはNewGameが8:00〜12:00から
      # 選び直す。SaveDataManagement.md）。昼の値を置くのは、抽選を通さずにworldを組んだときも
      # 暗さで何も成立しない状態から始めないため。
      hour:
        value: 12
        range: {min: 0, max: 24}
        on_max:
          add:
            self:
              hour: -24
              day: 1
        stages:
          - name: night            # 0-5時（フォールバック）・18-23時（night_late）: 底
            passives:
              - modify:
                  self:
                    ambient_brightness: -6
          - name: sunrise          # 6時: 高度7.5°（2,100 lx）
            min: 6
            passives:
              - modify:
                  self:
                    ambient_brightness: 10
          - name: early_morning    # 7時: 高度22.5°（18,300 lx）
            min: 7
            passives:
              - modify:
                  self:
                    ambient_brightness: 13
          - name: morning          # 8時: 高度37.5°（46,300 lx）
            min: 8
            passives:
              - modify:
                  self:
                    ambient_brightness: 14
          - name: late_morning     # 9-10時: 高度52.5°-67.5°（78,700-106,700 lx）
            min: 9
            passives:
              - modify:
                  self:
                    ambient_brightness: 15
          - name: noon             # 11-12時: 高度82.5°（122,900 lx）
            min: 11
            passives:
              - modify:
                  self:
                    ambient_brightness: 16
          - name: early_afternoon  # 13-14時: 朝の対称
            min: 13
            passives:
              - modify:
                  self:
                    ambient_brightness: 15
          - name: afternoon        # 15時: 朝の対称
            min: 15
            passives:
              - modify:
                  self:
                    ambient_brightness: 14
          - name: late_afternoon   # 16時: 朝の対称
            min: 16
            passives:
              - modify:
                  self:
                    ambient_brightness: 13
          - name: sunset           # 17時: 朝の対称
            min: 17
            passives:
              - modify:
                  self:
                    ambient_brightness: 10
          - name: night_late       # 18-23時: 夜と同じ
            min: 18
            passives:
              - modify:
                  self:
                    ambient_brightness: -6
      # 現在の日（1始まり、上限なし。GameElementDefinition.md 17節）。
      day:
        value: 1
      # 現在の天気。シンボル型プロパティ（6.6節）。storm/heavy_rain/light_rain/cloudy/clear/sunny/
      # scorchingの7段階で、clear（普通の晴れ）がこの島の標準的な天気。
      # 遷移はClimateSystem.md参照: weather_remainingが0になるたび、atmospheric_moistureのstages
      # （scorchingのみthermal_levelのhot stage）が駆動する*_weightを重みとするpickで次が選ばれる。
      # stagesはambient_brightnessへ**雲がどれだけ陽を遮るか**をmodifyで与える（太陽高度の寄与は
      # hour側。シンボル型のstagesはステージ名がそのまま比較対象）。値は雲のまったく無い空
      # （scorching、正午125,000 lx）を0として、そこから何段暗いか。ContentSkeleton.md 8.1.3節の
      # 正午の照度に合わせてある（曇り5,000 lx=-5・小雨2,000=-6・大雨749=-8・嵐187=-10）。
      # 雨系stageは毎tick atmospheric_moistureを自己減算し、雨が水分を使い尽くすと乾いた候補が
      # 選ばれやすくなる貯水池の循環を作る（ClimateSystem.md 3節）。減算量と雨季の季節レートの
      # 大小関係が雨季の降雨の止み方を決める（4.3節）。
      weather:
        value: clear
        stages:
          - name: storm
            passives:
              - modify:
                  self:
                    ambient_brightness: -10
              - add:
                  self:
                    atmospheric_moisture: -2
          - name: heavy_rain
            passives:
              - modify:
                  self:
                    ambient_brightness: -8
              - add:
                  self:
                    atmospheric_moisture: -1.3
          - name: light_rain
            passives:
              - modify:
                  self:
                    ambient_brightness: -6
              - add:
                  self:
                    atmospheric_moisture: -1.1
          - name: cloudy
            passives:
              - modify:
                  self:
                    ambient_brightness: -5
          - name: clear
            passives:
              - modify:
                  self:
                    ambient_brightness: -2
          - name: sunny
            passives:
              - modify:
                  self:
                    ambient_brightness: -1
          - name: scorching  # 雲のまったく無い空が基準（0）なので、寄与を持たない
      # 環境から守られているか（0/1。ContainerSystem.md 6節）。雨を見ている条件は、天気の前に
      # これを見る（fire.yamlの炉・liquid_containers.yamlの雨受け）。
      # **worldが0を宣言するのは、守る物が間に無いときもancestorがここまで解けるようにするため。**
      # 守る側（浅い洞窟・蓋のある入れ物・将来の屋根）だけが1を宣言し、守らない物は宣言しない。
      sheltered:
        value: 0
      # 樹冠も地面の反射も無い場所の明るさ（IlluminationSystem.md 2節）。EVスケール
      # （EV = log2(照度 / 2.5 lx)、同1節）で、hourとweather両方のmodifyが加算的に重なる、
      # 都度導出される実効値（8.3節）。
      # rangeの底-6は「これより暗い場所を区別しない」暗さの底（同4節）。上限+17は、雲のまったく無い空
      # （scorching）の正午（+16）に最も明るい地面（砂浜+1）を足した、太陽光だけで届く最大（同4節）。
      # ambient_temperatureへの補正はこのstages+WhenOwnStageゲート（6.4節・8.2節）が担う。境目は
      # 2つとも日射の強さで置いてある: 0は2.5 lxで**陽が地平線の下**、+11は曇りの正午（5,000 lx）で
      # **日射が空気を暖め始める明るさ**。補正量は仮の値。
      ambient_brightness:
        value: 0
        range: {min: -6, max: 17}
        stages:
          - name: dark        # 0未満（フォールバック、夜）: やや涼しい
            passives:
              - modify:
                  self:
                    ambient_temperature: -3
          - name: dim         # 0〜+10（朝夕と雨天の日中）: 補正なし
            min: 0
          - name: bright      # +11以上（曇り以上の日中）: やや暑い
            min: 11
            passives:
              - modify:
                  self:
                    ambient_temperature: 3
      # 現在の気温。体温と区別するための命名（ClimateSystem.md参照）。日射による補正は
      # ambient_brightness、季節による補正はthermal_level参照。
      ambient_temperature:
        value: 20

      # ===== 気候システム（ClimateSystem.md） =====
      # 季節・天気はいずれも専用オブジェクトではなくworld自身のプロパティ（現在値＋残り時間）で表現する。

      # 現在の季節。calm→wet→dry→calm…の固定順で巡回（ClimateSystem.md 2節）。各stageはフラグ
      # （season_is_*）と貯水池への季節レート（3節）を持つ。calmの水分+0.1は回復方向のレートで、
      # moderate閾値（30）付近を上下しながら1日1回前後の軽い雨を降らせる、序盤の生命線となる
      # 降雨サイクルを作る（3.1節・3.2節）。
      season:
        value: calm
        stages:
          - name: calm
            passives:
              - modify:
                  self:
                    season_is_calm: 1
                    # 風向きの重み（docs/world/Voyage.md 3.1節）。凪の季節は横風が多い。
                    tailwind_weight: 30
                    crosswind_weight: 45
                    headwind_weight: 25
              - add:
                  self:
                    atmospheric_moisture: 0.1
                    thermal_level: -1
                    monsoon_level: -1
          - name: wet
            passives:
              - modify:
                  self:
                    season_is_wet: 1
                    # 雨季は向かい風が増える。出航には最も向かない季節になる。
                    tailwind_weight: 20
                    crosswind_weight: 40
                    headwind_weight: 40
              - add:
                  self:
                    atmospheric_moisture: 1
                    thermal_level: -1
                    monsoon_level: 1
          - name: dry
            passives:
              - modify:
                  self:
                    season_is_dry: 1
                    # 乾季は追い風が多い。これが「出航に適した季節の窓」になる。
                    tailwind_weight: 50
                    crosswind_weight: 35
                    headwind_weight: 15
              - add:
                  self:
                    atmospheric_moisture: -0.2
                    thermal_level: 1
                    monsoon_level: -1
      # 「今の季節はどれか」の0/1フラグ。seasonのstageがmodifyで立て、season_remainingの遷移pickが
      # 重みとして参照する（0/1の重み=決定的な条件分岐）。
      season_is_calm:
        value: 0
      season_is_wet:
        value: 0
      season_is_dry:
        value: 0
      # 季節サイクルの周回数（0始まり、dry→calm遷移のたびに+1）。stagesが立てるフラグが
      # 「初回サイクルは30日固定・2周目以降はランダム」の分岐（ClimateSystem.md 2.3節）の重みになる。
      season_cycle:
        value: 0
        stages:
          - name: first
            passives:
              - modify:
                  self:
                    first_cycle_flag: 1
          - name: later
            min: 1
            passives:
              - modify:
                  self:
                    later_cycle_flag: 1
      first_cycle_flag:
        value: 0
      later_cycle_flag:
        value: 0
      # 現在の季節の残りtick数。0に達した瞬間（min:1を下回るon_min、6.3節）に3段のpick（10節）で
      # 遷移: (1)season_is_*で今の季節へ分岐、(2)初回サイクルか否かで分岐、(3)初回は30日（2880tick）固定、
      # 2周目以降は24/30/36日（2304/2880/3456tick）の等確率pick。dry→calm遷移だけがseason_cycleを+1する。
      season_remaining:
        value: 2880
        range: {min: 0, max: 999999}
        passives:
          - add:
              self:
                season_remaining: -1
        on_min:
          pick:
            - weight: {prop: season_is_calm}
              pick:
                - weight: {prop: first_cycle_flag}
                  set:
                    self: {season: wet, season_remaining: 2880}
                - weight: {prop: later_cycle_flag}
                  pick:
                    - weight: 1
                      set:
                        self: {season: wet, season_remaining: 2304}
                    - weight: 1
                      set:
                        self: {season: wet, season_remaining: 2880}
                    - weight: 1
                      set:
                        self: {season: wet, season_remaining: 3456}
            - weight: {prop: season_is_wet}
              pick:
                - weight: {prop: first_cycle_flag}
                  set:
                    self: {season: dry, season_remaining: 2880}
                - weight: {prop: later_cycle_flag}
                  pick:
                    - weight: 1
                      set:
                        self: {season: dry, season_remaining: 2304}
                    - weight: 1
                      set:
                        self: {season: dry, season_remaining: 2880}
                    - weight: 1
                      set:
                        self: {season: dry, season_remaining: 3456}
            - weight: {prop: season_is_dry}
              pick:
                - weight: {prop: first_cycle_flag}
                  set:
                    self: {season: calm, season_remaining: 2880}
                  add:
                    self: {season_cycle: 1}
                - weight: {prop: later_cycle_flag}
                  pick:
                    - weight: 1
                      set:
                        self: {season: calm, season_remaining: 2304}
                      add:
                        self: {season_cycle: 1}
                    - weight: 1
                      set:
                        self: {season: calm, season_remaining: 2880}
                      add:
                        self: {season_cycle: 1}
                    - weight: 1
                      set:
                        self: {season: calm, season_remaining: 3456}
                      add:
                        self: {season_cycle: 1}
      # 大気水分量（ClimateSystem.md 3節の貯水池）。季節レート＋降雨中の自己減算（weather参照）で駆動。
      # 基準レート（1/tick、GameElementDefinition.md 6.0節）は雨季の上昇。湿度が上がる季節を基準に置き、
      # calm/dryはその微変動として扱う。
      # stagesは天気候補ごとの重み（*_weight）をmodifyで駆動する（ClimateSystem.md 4.3節）: saturatedでは晴れ系の重みなし、dryでは
      # heavy_rain/stormの重み0。晴れ系の中ではclearを最も重くする。moderateまでの雨は必ずlight_rain
      # （序盤の「軽めの雨」要件、3.2節）。scorching_weightのみthermal_levelのhot stageが駆動する。
      atmospheric_moisture:
        value: 0
        range: {min: 0, max: 100}
        stages:
          - name: dry
            passives:
              - modify:
                  self:
                    sunny_weight: 25
                    clear_weight: 45
                    cloudy_weight: 20
                    light_rain_weight: 1
          - name: moderate
            min: 30
            passives:
              - modify:
                  self:
                    sunny_weight: 10
                    clear_weight: 30
                    cloudy_weight: 25
                    light_rain_weight: 20
          - name: humid
            min: 60
            passives:
              - modify:
                  self:
                    clear_weight: 4
                    cloudy_weight: 3
                    light_rain_weight: 40
                    heavy_rain_weight: 30
                    storm_weight: 3
          - name: saturated
            min: 85
            passives:
              - modify:
                  self:
                    cloudy_weight: 5
                    light_rain_weight: 20
                    heavy_rain_weight: 40
                    storm_weight: 40
      # 天気候補ごとの重み。atmospheric_moistureのstages（scorching_weightのみthermal_levelの
      # hot stage）がmodifyで維持する（ベース値0のため、modifyされない候補は選ばれない）。
      sunny_weight:
        value: 0
      clear_weight:
        value: 0
      cloudy_weight:
        value: 0
      light_rain_weight:
        value: 0
      heavy_rain_weight:
        value: 0
      storm_weight:
        value: 0
      scorching_weight:
        value: 0
      # 現在の天気の残りtick数。0に達した瞬間（min:1を下回るon_min、6.3節）に、外側のpickが
      # *_weightを重みに次の天気を、内側のpickが持続時間4/5/6時間（16/20/24tick）を等確率で選ぶ
      # （ClimateSystem.md 4節）。初期値20（5時間）はday1の最初の遷移までの猶予。
      weather_remaining:
        value: 20
        range: {min: 0, max: 999999}
        passives:
          - add:
              self:
                weather_remaining: -1
        on_min:
          pick:
            - weight: {prop: sunny_weight}
              pick:
                - weight: 1
                  set:
                    self: {weather: sunny, weather_remaining: 16}
                - weight: 1
                  set:
                    self: {weather: sunny, weather_remaining: 20}
                - weight: 1
                  set:
                    self: {weather: sunny, weather_remaining: 24}
            - weight: {prop: clear_weight}
              pick:
                - weight: 1
                  set:
                    self: {weather: clear, weather_remaining: 16}
                - weight: 1
                  set:
                    self: {weather: clear, weather_remaining: 20}
                - weight: 1
                  set:
                    self: {weather: clear, weather_remaining: 24}
            - weight: {prop: cloudy_weight}
              pick:
                - weight: 1
                  set:
                    self: {weather: cloudy, weather_remaining: 16}
                - weight: 1
                  set:
                    self: {weather: cloudy, weather_remaining: 20}
                - weight: 1
                  set:
                    self: {weather: cloudy, weather_remaining: 24}
            - weight: {prop: light_rain_weight}
              pick:
                - weight: 1
                  set:
                    self: {weather: light_rain, weather_remaining: 16}
                - weight: 1
                  set:
                    self: {weather: light_rain, weather_remaining: 20}
                - weight: 1
                  set:
                    self: {weather: light_rain, weather_remaining: 24}
            - weight: {prop: heavy_rain_weight}
              pick:
                - weight: 1
                  set:
                    self: {weather: heavy_rain, weather_remaining: 16}
                - weight: 1
                  set:
                    self: {weather: heavy_rain, weather_remaining: 20}
                - weight: 1
                  set:
                    self: {weather: heavy_rain, weather_remaining: 24}
            - weight: {prop: storm_weight}
              pick:
                - weight: 1
                  set:
                    self: {weather: storm, weather_remaining: 16}
                - weight: 1
                  set:
                    self: {weather: storm, weather_remaining: 20}
                - weight: 1
                  set:
                    self: {weather: storm, weather_remaining: 24}
            - weight: {prop: scorching_weight}
              pick:
                - weight: 1
                  set:
                    self: {weather: scorching, weather_remaining: 16}
                - weight: 1
                  set:
                    self: {weather: scorching, weather_remaining: 20}
                - weight: 1
                  set:
                    self: {weather: scorching, weather_remaining: 24}
      # 現在の風向き。シンボル型プロパティ（6.6節）で、本土へ向かう向きを基準に3つだけを区別する
      # （docs/world/Voyage.md 3.1節）。島の上での暮らしには効かず、今のところ航海の速さだけが読む。
      # 段を持たないのは、読む側が段ではなくシンボルの一致（`eq: tailwind`）で見るため。
      wind:
        value: crosswind
      # 風向きの候補ごとの重み。seasonのstagesがmodifyで維持する（ベース値0のため、modifyされない
      # 候補は選ばれない）。天気の*_weightと同じ仕組み（ClimateSystem.md 4.3節）。
      tailwind_weight:
        value: 0
      crosswind_weight:
        value: 0
      headwind_weight:
        value: 0
      # 今の風向きの残りtick数。0に達した瞬間（min:1を下回るon_min、6.3節）に、*_weightを
      # 重みとするpickで次の風向きを選ぶ。持続は一律8時間（32tick）——天気と違って向きしか無いので、
      # 長さまで振ると、どちらが変わったのかが読めなくなる。
      wind_remaining:
        value: 32
        range: {min: 0, max: 999999}
        passives:
          - add:
              self:
                wind_remaining: -1
        on_min:
          pick:
            - weight: {prop: tailwind_weight}
              set:
                self: {wind: tailwind, wind_remaining: 32}
            - weight: {prop: crosswind_weight}
              set:
                self: {wind: crosswind, wind_remaining: 32}
            - weight: {prop: headwind_weight}
              set:
                self: {wind: headwind, wind_remaining: 32}
      # 蓄熱量（ClimateSystem.md 3節のもう一つの貯水池）。季節レートをambient_temperatureへ直接
      # 加算すると±1/tickでも1季節で±2880になるため、atmospheric_moistureと同じ「スケールした
      # 貯水池のstagesが表向きの値をmodifyする」パターンを使う。dryで+1/tick（20日で0→上限1920）、
      # calm/wetで-1/tick。初期値1000は「開始時は補正なし（mild帯）」のため。
      # hot stageはscorching_weightも駆動する（乾季後半だけ灼熱が抽選に加わる。stageのminは
      # その値を含む判定のため、上限=hot閾値でもhotは有効）。
      # 上限をhot閾値1920と同値にするのは意図的: calmに入った最初のtickでmildへ落ち、灼熱と気温+8が
      # 乾季の終了と同時に消える（残暑を作らない。「暑さ=乾季」を体感と一致させるため）。
      thermal_level:
        value: 1000
        range: {min: 0, max: 1920}
        stages:
          - name: cool
            passives:
              - modify:
                  self:
                    ambient_temperature: -5
          - name: mild
            min: 960
          - name: hot
            min: 1920
            passives:
              - modify:
                  self:
                    ambient_temperature: 8
                    scorching_weight: 50
      # 雨季の深まり（ClimateSystem.md 4.3節）。thermal_levelと対称の貯水池で、wetで+1/tick
      # （20日で0→上限1920）、calm/dryで-1/tick。deepening帯（雨季10日目〜）・peak帯（20日目〜）が
      # heavy_rain_weight/storm_weightへ上乗せし、「雨季後半ほど嵐・大雨が増える」を保証する。
      # 上乗せは大気水分量が高いときにconditionsで限定する: 無条件だと、乾季序盤に水分が尽きた後まで
      # 大雨の重みが残ってしまうため。水分がまだ高い過渡の間は上乗せが生き、嵐の名残が表現される。
      monsoon_level:
        value: 0
        range: {min: 0, max: 1920}
        stages:
          - name: early
          - name: deepening
            min: 960
            passives:
              - modify:
                  self:
                    heavy_rain_weight: 15
                conditions:
                  - {subject: self, prop: atmospheric_moisture, gte: 60}
          - name: peak
            min: 1920
            passives:
              - modify:
                  self:
                    heavy_rain_weight: 30
                    storm_weight: 40
                conditions:
                  - {subject: self, prop: atmospheric_moisture, gte: 45}
      # 難易度の初期補正1: 経過tickを数える専用カウンタで、2日目（tick 96-191）だけ
      # atmospheric_moistureへ追加加算し、高確率で雨を降らせる（ClimateSystem.md 5.1節）。
      # 天気そのものは固定しない（5.3節）ため、晴れる可能性もある。
      early_rain_calibration:
        value: 0
        passives:
          - add:
              self:
                early_rain_calibration: 1
        stages:
          - name: idle
          - name: boosting
            min: 96
            passives:
              - add:
                  self:
                    atmospheric_moisture: 0.6
          - name: done
            min: 192
      # 難易度の初期補正2: 最初の乾季の10日目前後（71日目、tick 6720-6815）にdryのレートを大きく
      # 上回る+2/tickを加算し、高確率で雨を降らせる（5.2節）。6720/6816はseason_remainingの
      # 「初回サイクル30日固定」に依存した導出値であり、そちらを変えたらこちらも再計算が必要。
      first_dry_rain_calibration:
        value: 0
        passives:
          - add:
              self:
                first_dry_rain_calibration: 1
        stages:
          - name: idle
          - name: boosting
            min: 6720
            passives:
              - add:
                  self:
                    atmospheric_moisture: 2
          - name: done
            min: 6816
    slots:
      locations:
        # locationタグを持つobject_defのみを受け入れる。
        cell: {accept: {tag: location}}
