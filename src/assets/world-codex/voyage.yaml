# 島からの脱出（docs/concept/GameEndings.md・docs/world/Voyage.md）。
#
# 筏・海区・本土で、周回の終わりを表す。専用の文法は使わず、いずれも location（core.yaml）と
# explorable（locations.yaml）と、既存の passives/stages/move だけで書いている。
#
#   - 筏は設置物であり場所でもある。中にプレイヤーと積荷が入るので、筏を1つ動かせば全部が動く。
#   - 海は海区の連なりで、海区は探索できる場所そのもの。見張り（explore）を重ねると航路が現れ、
#     航路を渡ると次の海区へ移る。海区も本土も singleton（15節）なので、型の名前で行き先を指せる。
#   - **時間を進めるだけでは1海区も進まない**（GameEndings.md 12節）。風・海流・積載・帆は進みでは
#     なく、その海区を渡るのにかかる時間（crossing_minutes）へ効く。

traits:
  # 海区（GameEndings.md 12節）。**地上の土地と同じ場所**で、足しているのは海の側の3つだけ
  # ——浮かんでいるものを押す海流、浮いていることの配布、そしてここを渡るのにかかる時間。
  #
  # **8種類の顔ぶれ（ContentSkeleton.md 7節）は、この trait が持つ1つの見張りの卓と、その重みの
  # 配り方だけで表す。** 顔ぶれごとの型もタグも持たない。海区ごとに違うのは crossing_minutes と、
  # 見張り何回で航路が現れるか（exploration_progress の range.max）と、下のつまみの重みの3つ。
  sea_zone:
    tags: [sea]
    props:
      # この海区から次の海区へ渡るのにかかる時間（分）。**素の値は海区ごと**（距離）で、そこから
      # 筏の sail_speed の段が引く（筏の sail_speed 参照）。風・海流・積載・帆はすべてそこへ集まる
      # ので、ここに書くのは海区の側の事情だけになる。下限は、どれだけ条件が良くても渡り切るのに
      # 要る時間。
      crossing_minutes:
        range: {min: 120, max: 900}

      # 見張りの発見量のつまみ（ExplorationSystem.md 2節）。**素の重みは0＝その海区には無い**もので、
      # 海区の側が自分の海で見つかるものにだけ重みを与える。地上の土地が候補の並びそのもので
      # 顔ぶれを表すのに対し、海区は同じ卓を共有して重みだけを変える——顔ぶれが8種類あっても、
      # 見張りの仕組みは1つで済む。
      #
      # 何も見つからない海面。**地上と違い、海はハズレを持つ**（同2節の「1回の探索で必ず1個以上
      # 見つかる」は海では保たない）。実りの濃淡はこの重みの高さで表すので、専用の目盛りは要らない。
      barren_find: {value: 0}
      # 流木（太い枝2本）。
      driftwood_find: {value: 0}
      # 漂流物（太い枝とロープ）。
      flotsam_find: {value: 0}
      # 海藻2株。
      seaweed_find: {value: 0}
      # 海鳥の卵と羽。
      egg_find: {value: 0}
      # 沈んだ船から浮いてきた物。
      wreck_find: {value: 0}
      # 魚の群れ。**拾い物と違って海区へ湧く**（12.1節の「その場に湧くもの」）。
      shoal_find: {value: 0}
      # 海鳥の群れ。同じく海区へ湧く。
      seabird_find: {value: 0}
    passives:
      # 海流。浮かんでいるものを本土の方へ押し続ける。凪いでも渡れなくならないのはこれがあるためで、
      # 向かい風はこれを打ち消す量として書いてある（筏の sail_speed 参照）。
      - modify: {child: {sail_speed: 3}}
      # 浮いていること自体を子へ配る。組み込んだ部品が「陸では効かない」と言うために読む
      # （筏の afloat 参照）。
      - modify: {child: {afloat: 1}}
    interactions:
      # 見張り。**地上の探索そのもの**（ExplorationSystem.md 2節）で、1回15分＝1tick、進捗が1つ進む。
      # 進捗が上限に達した瞬間、その海区から出る航路が現れる（exploration_progress の on_max）。
      #
      # **航路が見えたら見張りは終わる。** 上限へ達した値は書き込みのたびに on_max を呼び直すので、
      # 止めないと同じ航路が湧き続ける。見えているかは湧いた結果そのもので見る——回数で書くと、
      # 上限と同じ数を2箇所に持つことになる。
      explore:
        trigger: menu
        conditions:
          - reason: route_already_sighted
            not: {slot: fixtures, matches: {tag: sea_route}}
        duration: 15
        add: {self: {exploration_progress: 1}}
        # 見張りが返すもの（GameEndings.md 12.1節）。次の行き先は航路（進捗の on_max）が受け持つので、
        # ここに並ぶのは拾えるものと、その場に湧くものだけ。
        #
        # **拾えるものは海面に置かず、見つけた時点で手に入る**（同12.7節）。手が塞がっていれば筏の
        # 積荷へこぼれ、そこも塞がっていれば手に入らない（spawn の into: actor、9.4節）。
        pick:
          # 何も見つからない。この候補だけは効果を持たない。
          - weight: {prop: barren_find}
          - weight: {prop: driftwood_find}
            spawn: {object: thick_branch, count: 2, into: actor}
          - weight: {prop: flotsam_find}
            spawn:
              - {object: thick_branch, into: actor}
              - {object: rope, into: actor}
          - weight: {prop: seaweed_find}
            spawn: {object: seaweed, count: 2, into: actor}
          - weight: {prop: egg_find}
            spawn:
              - {object: bird_egg, into: actor}
              - {object: feather, into: actor}
          - weight: {prop: wreck_find}
            spawn: {object: golden_chalice, into: actor}
          # 湧くものは海区の設置物になる（12.7節）。居る間だけ実り、しばらくすると去る。
          - weight: {prop: shoal_find}
            spawn: {object: fish_shoal, into: self}
          - weight: {prop: seabird_find}
            spawn: {object: seabird_flock, into: self}

  # 航路。海区から海区への繋がり1本で、見張りの成果として現れる設置物。
  #
  # **渡る手はここが持ち、行き先だけを型の側が書く。** 地上の道の travel と同じメニューの操作で、
  # 違うのは動かす物だけ——地上の道が歩く本人を動かすのに対し、航路は同じ海区に浮かんでいる筏を
  # 乗り手ごと動かす。筏を指すのに among を使うのは、航路から見て筏が親でも子でもなく、同じ海区に
  # 並ぶ兄弟だからで、候補は高々1つなので抽選にはならない。
  sea_route:
    # fixtureは「持ち歩けない」という置き場所の分類、sea_routeは「海区から出る道である」という役割。
    # 地上の道（path）とはタグを分ける——画面が path の札に出す行き先の土地名は、行き先を
    # インスタンスIDで持つ道のためのもので、型で行き先を指す航路には引くものが無い。
    tags: [fixture, sea_route]
    # 繋がる海区の無い航路は存在しない（7.9節）。海区から外せず、海区が消えれば一緒に消える。
    bound_to_owner: true
    props:
      # 航路は海そのものなので目方を持たない（地上の道と同じ、ContainerSystem.md 1節）。
      weight: {value: 0}
    interactions:
      cross:
        trigger: menu
        conditions:
          - reason: no_vessel_here
            subject: parent
            slot: fixtures
            matches: {object: raft}
        duration: {subject: parent, prop: crossing_minutes}

object_defs:
  # 筏。丸太を並べて縛った、島を出るための乗り物。
  #
  # **設置物（fixture）でありながら場所（location）でもある。** 中に積荷を載せ、プレイヤー自身も
  # 乗り込むため、土地と同じ items/fixtures/characters の3スロットを持つ。札へ重ねれば積める
  # （7.8節）——編み籠（containers.yaml）と同じ操作でよい。
  raft:
    tags: [fixture]
    traits: [location]
    # 積荷が個体ごとに違うので束ねない（SlotSystem.md 4節）。
    stackable: false
    # **外から見えるのは帆だけ**（7.11節）。積荷は重ねれば積めるが、何を積んだかは乗り込まないと
    # 分からない——中に入れば items がレーンに出る。土地から受け継いだ items/fixtures/characters を
    # 外から覗ける場所にすると、筏が「開けば中身が並ぶ箱」になってしまう。
    visible_slots: [structure]
    # 物を溜める入れ物（7.12節）。積荷の枠の詰まり具合をカードのバーに出す。
    storage: true
    slots:
      items:
        # 何種類積めるか。土地の items は上限を持たないので、筏だけが枠数とかさを決める。
        cell_count: 12
        # 積めるかさの合計（500L）。**縛りようの上限であって、実際の限界は重さ**——嵩いっぱいに
        # 積めば、その前に段（weight）が速さを削り始める。
        capacity: 500000
      # 組み込んだ部品（Dwellings.md 1節の構造スロットと同じ形）。積荷とは別の並びにする——
      # 帆は「積んである物」ではなく筏の一部で、外すまで効き続ける。
      #
      # **外からも中からも、この枠だけがタブに出る**（visible_slots）。積荷は中に入ったときだけ
      # レーンに出るので、2つは見える場所から分かれている。
      structure:
        cells:
          - {accept: {tag: sail}, max: 1}
    props:
      # 筏は何も遮らないので、居る場所の明るさがそのまま乗っている人まで届く
      # （docs/engine/IlluminationSystem.md 2節）。**場所を名乗る以上は明るさも名乗る**
      # ——書かなければ、乗った瞬間に明かりの継ぎ目が切れる。
      ambient_brightness: {value: 0}
      # 材料ぶんの自重（丸太6本120kg＋ロープ4本2.4kg）。中身の重さは実効値に足されるので（7.4節）、
      # 積むほど重くなる。**積むほど遅い**のは段が sail_speed を削るから（GameEndings.md 4節）。
      # 海の上で積荷を捨てれば段が下がり、そのぶん速くなる——専用の仕組みは要らない。
      #
      # **段の境目は自重＋乗員＋積荷で書く。** 段が見るのは実効値なので、積荷の量で言い表すには
      # 自重を足した値になる。**乗員1人（65kg）も足す**——航海中は必ず乗っているので、乗員を
      # 見込まないと積める量がそのぶん減る（characters/player_character.yaml）。自重や乗員の重さを
      # 変えるときは境目も一緒に動かすこと。
      weight:
        value: 122400
        stages:
          # 80kgまでの積荷。
          - name: light
          # 80〜160kg。
          - name: laden
            min: 267400
            passives:
              - modify: {self: {sail_speed: -1}}
          # 160〜240kg。
          - name: heavy
            min: 347400
            passives:
              - modify: {self: {sail_speed: -3}}
          # 240kg超。追い風でようやく進む。
          - name: overladen
            min: 427400
            passives:
              - modify: {self: {sail_speed: -6}}
      # 浮いているか。海区が子へ配る（sea_zone traitの modify）ので、海に出ている間だけ1になる。
      #
      # **帆のような部品が「陸では効かない」と言うための足場。** 筏自身の寄与は親の型で絞れるが
      # （下の passives の `parent matches sea`）、部品から見た海は親の親で、条件では指せない。
      afloat: {value: 0}
      # 航海の速さ（実効値）。素の値は0で、寄与は4つ——海区の海流（海区の modify）、
      # 風向き（下の passives）、積載の重さ（weight の段）、組み込んだ帆（rawhide_sail）。
      # 陸に居る間はどれも効かないので0になる。
      #
      # **速さは進みではなく、今居る海区を渡る時間へ効く**（GameEndings.md 12.3節）。段ごとに違う
      # 量を親（海区）の crossing_minutes から引く——`modify` の量はリテラルしか書けないので、
      # 可変の効き方を段で刻んでいる。陸の上の親は crossing_minutes を持たないので何も起きない。
      sail_speed:
        value: 0
        range: {min: 0, max: 20}
        stages:
          # 進まない（凪・向かい風・積みすぎ）。渡るのに丸々かかる。
          - name: becalmed
          - name: slow
            min: 2
            passives:
              - modify: {parent: {crossing_minutes: -30}}
          - name: moderate
            min: 4
            passives:
              - modify: {parent: {crossing_minutes: -60}}
          - name: steady
            min: 7
            passives:
              - modify: {parent: {crossing_minutes: -90}}
          - name: fast
            min: 10
            passives:
              - modify: {parent: {crossing_minutes: -120}}
    passives:
      # 風向きは world が持つ（core.yaml の wind）。祖先を遡って読むので、海区に居る間だけ
      # 親の型で絞る——陸に繋いだままの筏は風を受けない。
      - conditions:
          - {subject: parent, matches: {tag: sea}}
          - {subject: ancestor, prop: wind, eq: tailwind}
        modify: {self: {sail_speed: 6}}
      - conditions:
          - {subject: parent, matches: {tag: sea}}
          - {subject: ancestor, prop: wind, eq: crosswind}
        modify: {self: {sail_speed: 2}}
      - conditions:
          - {subject: parent, matches: {tag: sea}}
          - {subject: ancestor, prop: wind, eq: headwind}
        modify: {self: {sail_speed: -3}}
    # 解放条件（conditions、13.3節）はまだ置かない。建築スキルのプロパティと、それを伸ばす経路が
    # 未実装のため、今条件を置くと永久に作れなくなる（containers.yamlの編み籠と同じ）。
    recipes:
      lashed:
        steps:
          # 丸太を並べて桁を渡す。
          - requires:
              - {object: log, count: 6, consume: true}
            duration: 240
          # 交差するところをロープで縛る。
          - requires:
              - {object: rope, count: 4, consume: true}
            duration: 180
    interactions:
      # 乗り込む。**筏は場所なので、中の仕事は中に入らないとできない**——積荷を並べる・帆を張るは
      # 筏のスロットへの操作で、岸に立ったままでは届かない。
      #
      # 既に中に居るときは移動が空振りするだけなので、条件は置かない。そもそも中からは筏の札が
      # 見えない（現在地の札になる）ので、押す機会が無い。
      board:
        trigger: menu
        duration: 5
        move: {subject: actor, to: self}

      # 降りる。海の上では降りられない（泳いで戻る手はまだ無い）。
      disembark:
        trigger: menu
        conditions:
          - reason: at_sea
            not: {subject: parent, matches: {tag: sea}}
        duration: 5
        move: {subject: actor, to: parent}

      # 航海に出る。乗り込むところまでを1手に含める——岸から直に出せるほうが手数が少なく、
      # 既に乗っていれば移動が空振りするだけで結果は同じになる。
      #
      # 出る先は島に最も近い海区で、そこから先は航路を1つずつ渡る（GameEndings.md 12節）。
      set_sail:
        trigger: menu
        conditions:
          - reason: not_on_coast
            subject: parent
            matches: {tag: coast}
        duration: 60
        move:
          - {subject: actor, to: self}
          - {subject: self, to_object: coastal_waters}

  # 生皮の帆。筏の構造スロットへ組み込むと、風を受ける量が増える（sail_speed +2）。
  #
  # **段をちょうど1つ上げる最小の値が2。** 向かい風（海流+3、風-3）では素の筏が `becalmed` で
  # 止まるが、+2 で `slow` に届いて進み始める。+3 にしても向かい風の段は変わらず、盤面に差が
  # 出ない。後から入るなめし革の帆を+4にすれば、悪い日ほど差が開く伸び方になる。
  #
  # 質量は材料の和（生皮6×600 + 糸10×100 + 太い枝2×1000 + ロープ2×600 = 7800g）。
  rawhide_sail:
    tags: [item, sail]
    props:
      weight: {value: 7800}
      # 畳んでも枠と革はかさばる。筏の積載（500L）に対しては小さい。
      volume: {value: 15000}
    passives:
      # 効き先は親（＝組み込まれた筏）。積荷のスロットに置いても親は同じなので、構造スロットに
      # 入れることを強いているのは枠のaccept（tag: sail）であって、この宣言ではない。
      #
      # **浮いている間だけ効かせる。** 条件を付けないと、浜に置いた筏の sail_speed が2になって
      # 段が `slow` へ上がり、陸に繋いだままの筏が横断時間を縮め始める。
      - conditions:
          - {subject: parent, prop: afloat, gt: 0}
        modify: {parent: {sail_speed: 2}}
    # 解放条件（conditions、13.3節）はまだ置かない（筏・編み籠と同じ理由）。
    recipes:
      sewn:
        steps:
          # 帆柱と帆桁を組んで縛る。
          - requires:
              - {object: thick_branch, count: 2, consume: true}
              - {object: rope, count: 2, consume: true}
            duration: 120
          # 生皮を糸で縫い合わせ、枠へ張る。骨針は道具なので減らない。
          - requires:
              - {object: rawhide, count: 6, consume: true}
              - {object: yarn, count: 10, consume: true}
              - {tag: sewing_tool, count: 1, consume: false}
            duration: 300

  # ------------------------------------------------------------------
  # 海の産物。**獲れた身は獣と同じ生肉**（raw_meat、animals.yaml）——得られる素材は獲物の種類に
  # よらず同じで、獲物の大きさは個数で表す（HuntingSystem.md 1.5節）。魚と貝のために別の食材を
  # 足すと、焼く鎖もそのぶん増える。
  # ------------------------------------------------------------------

  # 海藻。帯になって漂うものを掬い上げたもの。生のまま食べられる。
  seaweed:
    tags: [item, food]
    # 水気を抱えた葉体なので、葉物野菜と同じ速さで傷む（foods.yaml・DurabilitySystem.md 3節）。
    traits: [perishable, spoils_normal]
    props:
      weight: {value: 200}
      # 濡れた葉体は詰めても縮まないので、嵩そのままで見る（plant_fiberと同じ扱い）。
      volume: {value: 1500}
    interactions:
      eat:
        trigger: menu
        conditions:
          - reason: too_full
            not: {subject: actor, prop: satiety, in_stage: full}
        duration: 15
        add:
          actor:
            satiety: 200
            carbohydrate: 1
            vitamin: 60
        destroy: self

  # 海鳥の卵。岩の窪みに産み落とされたもので、殻を割ればそのまま飲める。
  bird_egg:
    tags: [item, food]
    # 殻が中身を外気から隔てているぶん、芋と同じ遅さで傷む（foods.yaml・DurabilitySystem.md 3節）。
    traits: [perishable, spoils_slow]
    props:
      weight: {value: 60}
      volume: {value: 55}
    interactions:
      eat:
        trigger: menu
        conditions:
          - reason: too_full
            not: {subject: actor, prop: satiety, in_stage: full}
        duration: 15
        add:
          actor:
            satiety: 150
            protein: 6
            lipid: 5
            vitamin: 10
        destroy: self

  # 魚の群れ。海面まで上がってきた群れで、**居る間だけ実る**（GameEndings.md 12.1節）。
  # 銛も釣り具もまだ無いので、獲れるのは群れが水面に居る間だけ、という形にしてある。
  fish_shoal:
    tags: [fixture]
    # 海に浮かんでいるものなので、海区から外せない（7.9節）。
    bound_to_owner: true
    # 立ち去りまでの残りが個体ごとに違うので束ねない（SlotSystem.md 4節）。
    stackable: false
    props:
      # 群れは海そのものと同じく目方を持たない（航路と同じ、ContainerSystem.md 1節）。
      weight: {value: 0}
      # 立ち去りまでの残り。獣と同じ形（HuntingSystem.md 5.6節）だが、**人が居ても止まらない**
      # ——獣が目の前で消えないのは同じ土地に立っているからで、海では乗り手は筏の中に居る。
      stay_remaining:
        value: 24
        range: {min: 0, max: 24}
        passives:
          - add: {self: {stay_remaining: -1}}
        on_min:
          destroy: self
    interactions:
      # 掬う。1回で1切れぶん。
      net_fish:
        trigger: menu
        duration: 30
        spawn: {object: raw_meat, into: actor}

  # 海鳥の群れ。岩に集まって巣を作る鳥で、人を知らないので手が届く。
  seabird_flock:
    tags: [fixture]
    bound_to_owner: true
    stackable: false
    props:
      weight: {value: 0}
      stay_remaining:
        value: 24
        range: {min: 0, max: 24}
        passives:
          - add: {self: {stay_remaining: -1}}
        on_min:
          destroy: self
    interactions:
      catch_seabird:
        trigger: menu
        duration: 60
        spawn:
          - {object: raw_meat, into: actor}
          - {object: feather, into: actor}

  # 小島。海区で見つかる、上陸して探索できる陸地（ContentSkeleton.md 7節）。**設置物でありながら
  # 場所でもある**——浅い洞窟（locations.yaml）と同じ形で、筏を寄せれば中の仕事ができる。
  #
  # 今の小島が返すのは岩と流木と海鳥の巣だけで、遠征先の小島にしか無い材料（錫、
  # ContentSkeleton.md 7.1節）は青銅の鎖が入ってから（Voyage.md 未決事項）。
  offshore_islet:
    tags: [fixture]
    traits: [location, explorable]
    # 上陸したものが個体ごとに違うので束ねない（SlotSystem.md 4節）。
    stackable: false
    props:
      # 地形そのものなので、運べる目方を持たない（浅い洞窟と同じ、ContainerSystem.md 1節）。
      weight: {value: 0}
      # 遮るものの無い岩の島なので、空の明るさがそのまま届く（IlluminationSystem.md 2節）。
      ambient_brightness: {value: 0}
      exploration_progress:
        value: 0
        range: {min: 0, max: 8}
    interactions:
      # 島を歩いて調べる。**降りていないとできない**——筏に乗ったままでは岸から眺めているだけで、
      # 岩の窪みも波打ち際も見られない（筏の中の仕事を岸からできないのと同じ、Voyage.md 2節）。
      explore:
        trigger: menu
        conditions:
          - reason: not_ashore
            slot: characters
            matches: {tag: character}
          - reason: too_dark
            subject: actor
            prop: looking_brightness
            in_stage: bright
        duration: 15
        add: {self: {exploration_progress: 1}}
        pick:
          - weight: 25
            spawn: {object: stone, count: 2, into: self}
          - weight: 20
            spawn:
              - {object: thick_branch, into: self}
              - {object: stone, into: self}
          - weight: 20
            spawn: {object: seaweed, count: 2, into: self}
          - weight: 20
            spawn:
              - {object: bird_egg, into: self}
              - {object: feather, into: self}
          - weight: 15
            spawn: {object: thick_branch, count: 2, into: self}
      # 上陸。**航路を渡るのと同じ形**で、同じ海区に浮かんでいる筏を乗り手ごと引き寄せる。
      land:
        trigger: menu
        conditions:
          - reason: no_vessel_here
            subject: parent
            slot: fixtures
            matches: {object: raft}
        duration: 30
        pick:
          - weight: 1
            among: {subject: parent, slot: fixtures, matches: {object: raft}}
            move: {subject: picked, to: self}
      # 漕ぎ出す。**乗り込むところまでを1手に含める**（筏の set_sail と同じ）——降りたまま筏だけを
      # 押し出せると、小島に取り残される。
      launch:
        trigger: menu
        conditions:
          - reason: no_vessel_ashore
            slot: fixtures
            matches: {object: raft}
        duration: 30
        pick:
          - weight: 1
            among: {slot: fixtures, matches: {object: raft}}
            move:
              - {subject: actor, to: picked}
              - {subject: picked, to: parent}

  # ------------------------------------------------------------------
  # 海区（GameEndings.md 12節）。島と本土の間の海を、8種類の顔ぶれ（ContentSkeleton.md 7節）から
  # 配った14個の連なりとして持つ。海区そのものの作りは sea_zone trait（このファイルの先頭）が
  # 持ち、ここが書くのは海区ごとに違う3つだけ——渡るのにかかる時間・見張り何回で航路が現れるか・
  # 見張りの卓の重み（＝その海区の顔ぶれ）。
  #
  # **明るさはどの海区も0**（遮るものが何も無いので、空の明るさがそのまま届く、
  # IlluminationSystem.md 2節）。location trait が値を持たないので、海区ごとに名乗る。
  #
  # 並びは1本の鎖で、分岐はまだ無い。**最短の航路（空の海）が最も実りが薄く**、実りの濃い海区ほど
  # 渡るのに時間がかかる（GameEndings.md 12.1節）。
  # ------------------------------------------------------------------

  # 島影の海（沿岸）。島を離れてすぐの海区で、陸が見えているぶん自分の居場所が読みやすい。
  coastal_waters:
    singleton: true
    traits: [location, explorable, sea_zone]
    props:
      ambient_brightness: {value: 0}
      crossing_minutes: {value: 240}
      driftwood_find: {value: 30}
      seaweed_find: {value: 25}
      shoal_find: {value: 25}
      barren_find: {value: 20}
      exploration_progress:
        value: 0
        range: {min: 0, max: 2}
        on_max:
          spawn: {object: route_to_kelp_belt, into: self}

  # 海藻の帯。絡む海藻で進みが遅く、そのぶん帯そのものが目印になる。
  kelp_belt:
    singleton: true
    traits: [location, explorable, sea_zone]
    props:
      ambient_brightness: {value: 0}
      crossing_minutes: {value: 600}
      seaweed_find: {value: 55}
      barren_find: {value: 45}
      exploration_progress:
        value: 0
        range: {min: 0, max: 3}
        on_max:
          spawn: {object: route_to_tide_rip, into: self}

  # 潮目。流れのぶつかる帯で、波と鳥の集まりが目印になる。**補給が当てになる唯一の海区**。
  tide_rip:
    singleton: true
    traits: [location, explorable, sea_zone]
    props:
      ambient_brightness: {value: 0}
      crossing_minutes: {value: 420}
      shoal_find: {value: 80}
      barren_find: {value: 20}
      exploration_progress:
        value: 0
        range: {min: 0, max: 3}
        on_max:
          spawn: {object: route_to_reef_shallows, into: self}

  # 岩礁の海。波の砕ける瀬に漂流物が寄り、魚も付く。
  reef_shallows:
    singleton: true
    traits: [location, explorable, sea_zone]
    props:
      ambient_brightness: {value: 0}
      crossing_minutes: {value: 420}
      flotsam_find: {value: 35}
      shoal_find: {value: 20}
      barren_find: {value: 45}
      exploration_progress:
        value: 0
        range: {min: 0, max: 3}
        on_max:
          spawn: {object: route_to_gull_rock, into: self}

  # 海鳥の岩。鳥が巣を作る岩で、卵と羽が拾える。
  gull_rock:
    singleton: true
    traits: [location, explorable, sea_zone]
    props:
      ambient_brightness: {value: 0}
      crossing_minutes: {value: 360}
      egg_find: {value: 35}
      seabird_find: {value: 20}
      barren_find: {value: 45}
      exploration_progress:
        value: 0
        range: {min: 0, max: 3}
        on_max:
          spawn: {object: route_to_islet_waters, into: self}

  # 小島の海。海面には何も無く、実りは上陸した先にある。
  #
  # **小島は航路と一緒に現れる。** 卓の候補にすると同じ島が2つ湧きうるが、見張りを終えた印
  # （on_max）は海区ごとに1度しか通らない。
  islet_waters:
    singleton: true
    traits: [location, explorable, sea_zone]
    props:
      ambient_brightness: {value: 0}
      crossing_minutes: {value: 300}
      barren_find: {value: 100}
      exploration_progress:
        value: 0
        range: {min: 0, max: 3}
        on_max:
          spawn:
            - {object: route_to_open_water, into: self}
            - {object: offshore_islet, into: self}

  # 空の海。目印が何も無いので、航路を見つけるのに最も見張りを重ねることになる。
  # **最短の航路はここを通る**——渡る時間は最も短く、拾えるものは何も無い。
  open_water:
    singleton: true
    traits: [location, explorable, sea_zone]
    props:
      ambient_brightness: {value: 0}
      crossing_minutes: {value: 240}
      barren_find: {value: 100}
      exploration_progress:
        value: 0
        range: {min: 0, max: 5}
        on_max:
          spawn: {object: route_to_wreck_waters, into: self}

  # 沈船の海。折れた帆柱と綱が漂い、まれに船が積んでいた物が浮いてくる。
  wreck_waters:
    singleton: true
    traits: [location, explorable, sea_zone]
    props:
      ambient_brightness: {value: 0}
      crossing_minutes: {value: 300}
      # 1周回に0〜1個（ContentSkeleton.md 7節）。見張り4回で当たるのは2割ほど。
      wreck_find: {value: 5}
      flotsam_find: {value: 15}
      barren_find: {value: 80}
      exploration_progress:
        value: 0
        range: {min: 0, max: 4}
        on_max:
          spawn: {object: route_to_long_swell, into: self}

  # うねりの海（空の海）。大きなうねりだけが続く。
  long_swell:
    singleton: true
    traits: [location, explorable, sea_zone]
    props:
      ambient_brightness: {value: 0}
      crossing_minutes: {value: 240}
      barren_find: {value: 100}
      exploration_progress:
        value: 0
        range: {min: 0, max: 5}
        on_max:
          spawn: {object: route_to_outer_tide_rip, into: self}

  # 沖の潮目。島影の無い沖でも、流れのぶつかる帯には魚が集まる。
  outer_tide_rip:
    singleton: true
    traits: [location, explorable, sea_zone]
    props:
      ambient_brightness: {value: 0}
      crossing_minutes: {value: 420}
      shoal_find: {value: 80}
      barren_find: {value: 20}
      exploration_progress:
        value: 0
        range: {min: 0, max: 3}
        on_max:
          spawn: {object: route_to_black_reef, into: self}

  # 黒い岩礁。水面すれすれの黒い瀬が続く。
  black_reef:
    singleton: true
    traits: [location, explorable, sea_zone]
    props:
      ambient_brightness: {value: 0}
      crossing_minutes: {value: 420}
      flotsam_find: {value: 35}
      shoal_find: {value: 20}
      barren_find: {value: 45}
      exploration_progress:
        value: 0
        range: {min: 0, max: 3}
        on_max:
          spawn: {object: route_to_drifting_kelp, into: self}

  # 流れ藻の海（海藻の帯）。ちぎれた海藻が筋になって漂う。
  drifting_kelp:
    singleton: true
    traits: [location, explorable, sea_zone]
    props:
      ambient_brightness: {value: 0}
      crossing_minutes: {value: 600}
      seaweed_find: {value: 55}
      barren_find: {value: 45}
      exploration_progress:
        value: 0
        range: {min: 0, max: 3}
        on_max:
          spawn: {object: route_to_white_rock, into: self}

  # 白い岩（海鳥の岩）。糞で白く染まった岩で、遠くからでもそれと分かる。
  white_rock:
    singleton: true
    traits: [location, explorable, sea_zone]
    props:
      ambient_brightness: {value: 0}
      crossing_minutes: {value: 360}
      egg_find: {value: 35}
      seabird_find: {value: 20}
      barren_find: {value: 45}
      exploration_progress:
        value: 0
        range: {min: 0, max: 3}
        on_max:
          spawn: {object: route_to_mainland_shallows, into: self}

  # 本土の島影（沿岸）。本土の陸が見え始める海区で、島影の海と同じだけ実る。ここから本土へ渡る。
  mainland_shallows:
    singleton: true
    traits: [location, explorable, sea_zone]
    props:
      ambient_brightness: {value: 0}
      crossing_minutes: {value: 240}
      driftwood_find: {value: 30}
      seaweed_find: {value: 25}
      shoal_find: {value: 25}
      barren_find: {value: 20}
      exploration_progress:
        value: 0
        range: {min: 0, max: 2}
        on_max:
          spawn: {object: route_to_mainland, into: self}

  # ------------------------------------------------------------------
  # 航路。海区どうしを繋ぐ1本で、地上の道（locations.yamlのpath）と同じ設置物。渡る手そのものは
  # sea_route trait（このファイルの先頭）が1箇所で持ち、**型ごとに違うのは行き先の1行だけ**。
  #
  # 行き先を型で指す（to_object）ので、行き先ごとに型を分けるほかない——プロパティで指せるのは
  # インスタンスIDだけで、singletonの海区は定義の時点でそれを持たない。trigger を書き直しているのは、
  # どの操作も自分の trigger を名乗ることを文法が求めるため（WorldCodex.schema.json）。
  # ------------------------------------------------------------------
  route_to_kelp_belt:
    traits: [sea_route]
    interactions:
      cross:
        trigger: menu
        pick:
          - weight: 1
            among: {subject: parent, slot: fixtures, matches: {object: raft}}
            move: {subject: picked, to_object: kelp_belt}

  route_to_tide_rip:
    traits: [sea_route]
    interactions:
      cross:
        trigger: menu
        pick:
          - weight: 1
            among: {subject: parent, slot: fixtures, matches: {object: raft}}
            move: {subject: picked, to_object: tide_rip}

  route_to_reef_shallows:
    traits: [sea_route]
    interactions:
      cross:
        trigger: menu
        pick:
          - weight: 1
            among: {subject: parent, slot: fixtures, matches: {object: raft}}
            move: {subject: picked, to_object: reef_shallows}

  route_to_gull_rock:
    traits: [sea_route]
    interactions:
      cross:
        trigger: menu
        pick:
          - weight: 1
            among: {subject: parent, slot: fixtures, matches: {object: raft}}
            move: {subject: picked, to_object: gull_rock}

  route_to_islet_waters:
    traits: [sea_route]
    interactions:
      cross:
        trigger: menu
        pick:
          - weight: 1
            among: {subject: parent, slot: fixtures, matches: {object: raft}}
            move: {subject: picked, to_object: islet_waters}

  route_to_open_water:
    traits: [sea_route]
    interactions:
      cross:
        trigger: menu
        pick:
          - weight: 1
            among: {subject: parent, slot: fixtures, matches: {object: raft}}
            move: {subject: picked, to_object: open_water}

  route_to_wreck_waters:
    traits: [sea_route]
    interactions:
      cross:
        trigger: menu
        pick:
          - weight: 1
            among: {subject: parent, slot: fixtures, matches: {object: raft}}
            move: {subject: picked, to_object: wreck_waters}

  route_to_long_swell:
    traits: [sea_route]
    interactions:
      cross:
        trigger: menu
        pick:
          - weight: 1
            among: {subject: parent, slot: fixtures, matches: {object: raft}}
            move: {subject: picked, to_object: long_swell}

  route_to_outer_tide_rip:
    traits: [sea_route]
    interactions:
      cross:
        trigger: menu
        pick:
          - weight: 1
            among: {subject: parent, slot: fixtures, matches: {object: raft}}
            move: {subject: picked, to_object: outer_tide_rip}

  route_to_black_reef:
    traits: [sea_route]
    interactions:
      cross:
        trigger: menu
        pick:
          - weight: 1
            among: {subject: parent, slot: fixtures, matches: {object: raft}}
            move: {subject: picked, to_object: black_reef}

  route_to_drifting_kelp:
    traits: [sea_route]
    interactions:
      cross:
        trigger: menu
        pick:
          - weight: 1
            among: {subject: parent, slot: fixtures, matches: {object: raft}}
            move: {subject: picked, to_object: drifting_kelp}

  route_to_white_rock:
    traits: [sea_route]
    interactions:
      cross:
        trigger: menu
        pick:
          - weight: 1
            among: {subject: parent, slot: fixtures, matches: {object: raft}}
            move: {subject: picked, to_object: white_rock}

  route_to_mainland_shallows:
    traits: [sea_route]
    interactions:
      cross:
        trigger: menu
        pick:
          - weight: 1
            among: {subject: parent, slot: fixtures, matches: {object: raft}}
            move: {subject: picked, to_object: mainland_shallows}

  route_to_mainland:
    traits: [sea_route]
    interactions:
      cross:
        trigger: menu
        pick:
          - weight: 1
            among: {subject: parent, slot: fixtures, matches: {object: raft}}
            move: {subject: picked, to_object: mainland}

  # 本土。着いた時点で周回が終わる場所で、着いた後のことは描かない（GameEndings.md 3節）。
  # 世界に1つだけ在り、最後の海区から航路を渡ったときだけ、そこへ移る。
  mainland:
    singleton: true
    traits: [location]
    tags: [mainland]
    props:
      # 着いた後を描かない場所だが、場所である以上は明るさを名乗る。開けた土地と同じ。
      ambient_brightness: {value: 0}
