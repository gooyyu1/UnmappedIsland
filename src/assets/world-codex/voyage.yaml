# 島からの脱出（docs/concept/GameEndings.md・docs/world/Voyage.md）。
#
# 筏・海区・本土で、周回の終わりを表す。専用の文法は使わず、いずれも location（core.yaml）と
# explorable（locations.yaml）と、既存の passives/stages/move だけで書いている。
#
#   - 筏は設置物であり場所でもある。中にプレイヤーと積荷が入るので、筏を1つ動かせば全部が動く。
#   - 海は海区の連なりで、海区は探索できる場所そのもの。見張り（explore）を重ねると航路が現れ、
#     航路を渡ると次の海区へ移る。海区も本土も singleton（15節）なので、型の名前で行き先を指せる。
#   - **航路は方向を持たない。** 見張りは辺1本を見つけ、その両端——今いる海区と次の海区——へ1本ずつ
#     立てる。どちらも同じ1つの手（cross）で渡る。引き返しの代償が時間だけになるのも、渡り着いた先で
#     すぐ引き返せるのもこの形の帰結で、専用の規則は無い（GameEndings.md 12.5節）。**風の受け方だけは
#     向きで変わる**が、これも航路が向きを持つのではなく、行き先と今いる海区の「本土まであと何海区か」の
#     差から出る（sea_route の destination_zones_to_mainland）。
#   - **島と海を繋ぐ辺だけは、渡る手が航路ではなく出航（set_sail）。** 両端を立てるのは渡る手の
#     側なので、島側の端（route_to_shore）を立てるのも見張りではなく出航（set_sail 参照）。
#   - **その辺は海岸の数だけ在る。** どの海区へ着く辺なのかは海岸の側が名乗る（coast trait）ので、
#     出航地点を選ぶことが航海の距離と危険度を選ぶことになる（GameEndings.md 5節）。
#   - **時間を進めるだけでは1海区も進まない**（GameEndings.md 12節）。海流・積載・帆は進みではなく、
#     その海区を渡るのにかかる時間（crossing_minutes）へ効き、**風はその上に、航路ごとの受け方として
#     乗る**（同12.3節、sea_route の crossing_minutes）。**唯一の例外が荒天で、これは進みではなく
#     位置を動かす**——風下の隣へ押し流す（同12.4節、sea_zone の storm_drift）。

traits:
  # 海に面した土地（locations.yamlの砂浜・岩だらけの海岸・岸壁）。**足すのは海の側の事実1つだけ**
  # ——そこから漕ぎ出すとどの海区へ立つか（GameEndings.md 5節）。土地としての中身（探索の卓・
  # 明るさ・歩きにくさ）には触れない。
  #
  # **行き先を持つのは海岸の側。** 筏は「押し出してくれ」と頼むだけで、どの海に出るのかを知らない
  # ——出航のたびに変わる事実を持てるのは、そこに在り続ける海岸のほうだから。出航地点ごとに違うのは
  # この1点だけで、距離（本土までの残り海区数）も危険度（通ることになる海区の顔ぶれ）も、そこからの
  # 帰結として出る（同5節）。
  #
  # **素の重みは0＝その海岸はその海区に面していない。** 海区の見張りの卓（sea_zone）と同じ形で、
  # 面している海区にだけ重みを与える。今はどの海岸も1つだけ立てるので抽選にはならないが、
  # 「風向き次第でどちらへ出るか」を書きたくなっても同じ卓で足りる。
  #
  # **並ぶのは、島の海岸が面しうる海区だけ。** 本土の側へ行くほど島から遠い海なので、島の海岸がそこへ
  # 面することはない。この一覧が、そのまま出航の卓（筏の set_sail）の候補になる。
  coast:
    tags: [coast]
    props:
      offshore_coastal_waters: {value: 0}
      offshore_tide_rip: {value: 0}
      offshore_gull_rock: {value: 0}

  # 海区（GameEndings.md 12節）。**地上の土地と同じ場所**で、足しているのは海の側の4つだけ
  # ——浮かんでいるものを押す海流、浮いていることの配布、ここを渡るのにかかる時間、そして荒天が
  # 浮かんでいるものを風下へ押し流すこと（12.4節）。
  #
  # **8種類の顔ぶれ（ContentSkeleton.md 7節）は、この trait が持つ1つの見張りの卓と、その重みの
  # 配り方だけで表す。** 顔ぶれごとの型もタグも持たない。海区ごとに違うのは本土までの最短の残り
  # 海区数（zones_to_mainland。網のどこに居るか）と、辺で繋がった隣（zone_toward_mainland /
  # zone_toward_island）と、見張り何回で航路が現れるか（exploration_progress の range.max）と、
  # 下のつまみの重みと、荒天で流されるまでの長さ（storm_drift の range.max）の5つ。
  sea_zone:
    tags: [sea]
    # **海は物を置ける場所ではない**（GameEndings.md 12.7節）ので、location が配る items を落とす
    # （7.14節）。**海であることの側の事実**なので、海区ごとの型ではなくここで1度だけ言う。
    # 設置物（航路・魚の群れ・小島）は fixtures に立つので、落ちるのは拾い物の行き先だけ。
    remove_slots: [items]
    props:
      # この海区から次の海区へ渡るのにかかる時間（分）。**素の値はどの海区も同じ**なので、海区ごと
      # ではなくここで1度だけ言う。そこから筏の sail_speed の段が引く（筏の sail_speed 参照）。
      # 海流・積載・帆はすべてそこへ集まるので、ここに書くのは海区の側の事情だけになる。**風だけは
      # 航路ごとに受け方が違う**ので、ここではなく航路が持つ（sea_route の crossing_minutes）。
      # range の下限は、寄与がどれだけ重なっても横断時間が消えないための底。
      #
      # **揃っていることが、推定日数（GameEndings.md 9.3節）の立つ条件。** 海図が持つのは残りの
      # 海区数だけ（同12.6節）なので、日数はこれから渡る1区間の時間で全区間を代表して出すしかなく、
      # 海区ごとに違えば、最も遠い出航地点が最も短く見える。**距離の差は残りの海区数だけで表す。**
      crossing_minutes:
        value: 360
        range: {min: 120, max: 900}

      # その海区から本土まで、その海区を含めて**最短で**何区間あるか。**海図ではなく海の側の事実**
      # なので海区ごとに与える（島側の端が12、本土の手前が1）。海図が持つのはこの数の見当（次の2つ）
      # で、真値そのものはプレイヤーへ出さない。
      #
      # **分岐がある以上、1つの数で言えるのは最短だけ**（GameEndings.md 12.6節）。遠回りを選べば実際は
      # 延びるが、それは海図の粗さではなく針路の選択で、幅（次の2つ）が表すのは粗さのほうだけ。
      # **鎖ではなく網なので、隣がこの数で必ず1つ手前になるとは限らない**——遠回りの側の隣は自分より
      # 遠い（うねりの海4と沖の潮目5）。
      zones_to_mainland:
        range: {min: 1, max: 30}

      # 海図が言う「本土まであと何海区か」の下限と上限（GameEndings.md 12.6節）。**土台は真値**で、
      # 記入の粗さがそこへ幅として乗る（chart_crossed の段）。**海図が持つべき精度は海区数であって
      # 日数ではない**ので、時間へ直すのは読む側（同9.3節）。
      #
      # **valueは土台へ足す側なので0**（幅は下の段が modify で乗せる）。`range` は実体値も切るので
      # （6.3節「実体値と実効値、そして range が誰の端か」）、**0を含む範囲でなければならない**
      # ——下限を1にすると、土台へ足す0のほうが1へ繰り上がって海図が1海区ずれる。
      zones_to_mainland_min:
        value: 0
        base: {subject: self, prop: zones_to_mainland}
        range: {min: 0, max: 30}
      zones_to_mainland_max:
        value: 0
        base: {subject: self, prop: zones_to_mainland}
        range: {min: 0, max: 30}

      # 山頂から見定めたか（GameEndings.md 9.1節の段階）。島を見下ろす高さから海を見渡すと、海図の
      # 一区画に見当が付く（locations.yamlの山頂）。**上限が1なので、何度見渡しても記入は1度きり。**
      chart_sighted: {value: 0, range: {min: 0, max: 1}}

      # 渡って海図に残ったか（同12.6節）。**幅を配るのはこの段**——記入の細かさが1箇所に集まり、
      # 「どこまで分かっているか」を読むのに他のプロパティを覚えなくて済む。
      chart_crossed:
        value: 0
        range: {min: 0, max: 1}
        stages:
          # まだ渡っていない海区。幅は、山頂から見定めたかで決まる。
          - name: estimated
            passives:
              # 方角しか分からない（漂流物の流れ着く向き、鳥の飛ぶ方角）。
              - conditions:
                  - not: {prop: chart_sighted, gt: 0}
                modify: {self: {zones_to_mainland_min: -5, zones_to_mainland_max: 5}}
              # 山頂から見定めた。幅のある海区数が海図に入る（同9.1節）。
              - conditions:
                  - {prop: chart_sighted, gt: 0}
                modify: {self: {zones_to_mainland_min: -2, zones_to_mainland_max: 2}}
          # 渡った海区は海図に残る。**幅は無い**——戻りが既知で進みが推定なのはこれによる（同12.5節）。
          - name: crossed
            min: 1

      # 見張りの発見量のつまみ（ExplorationSystem.md 2節）。**素の重みは0＝その海区には無い**もので、
      # 海区の側が自分の海で見つかるものにだけ重みを与える。地上の土地が候補の並びそのもので
      # 顔ぶれを表すのに対し、海区は同じ卓を共有して重みだけを変える——顔ぶれが8種類あっても、
      # 見張りの仕組みは1つで済む。
      #
      # 何も見つからない海面。**地上と違い、海はハズレを持つ**（同2節の「1回の探索で必ず1個以上
      # 見つかる」は海では保たない）。実りの濃淡はこの重みの高さで表すので、専用の目盛りは要らない。
      barren_find: {value: 0}
      # 流木（太い枝2本）。
      driftwood_find: {value: 0}
      # 漂流物（太い枝とロープ）。
      flotsam_find: {value: 0}
      # 海藻2株。
      seaweed_find: {value: 0}
      # 海鳥の卵と羽。
      egg_find: {value: 0}
      # 沈んだ船から浮いてきた物。
      wreck_find: {value: 0}
      # 魚の群れ。**拾い物と違って海区へ湧く**（12.1節の「その場に湧くもの」）。
      #
      # **湧くものの2つだけが、見張る人の狩猟の腕を土台にする**（docs/world/Skills.md 5節）。ただし
      # **土台を書くのは海区の側**——ここに書くと、名乗っていない海区（素の0のまま）にも腕が積まれて
      # 群れが立つ。「海区が名乗らなかった候補は、その海には無い」（docs/world/Voyage.md 3.3節）は
      # 素の0で表しているので、腕を積むのは名乗った海区だけにする。
      shoal_find: {value: 0}
      # 海鳥の群れ。同じく海区へ湧く。
      seabird_find: {value: 0}

      # 荒天の押し流し（GameEndings.md 12.4節）の向き——風下が本土の側か島の側かを、重みで言う。
      # **`pick` の候補は条件を持てない**ので、風向きの見分けは条件ではなく重みへ移してある
      # （下の passives が風向きごとに片方だけを立てる）。素の値が0なので、立った側だけが選ばれる。
      #
      # **分かれ道と合流点では、その向きの隣が2つある**（うねりの海の本土側、流れ藻の海の島側）。同じ
      # 重みの候補を2つ並べるので、どちらへ流されるかは荒天が決める——選ぶのはプレイヤーではない。
      #
      # **ここで分けている「本土の側／島の側」は、航路が風をどう受けるか（sea_route）とは別の分け方。**
      # こちらが分けるのは鎖の先の隣か手前の隣かで、分かれ道では近道も遠回りも「先」。**航路の側から
      # 出せないのは、航路がまだ1本も立っていない海区でも荒天は流すから**——未知の海区へ流れ着くことが
      # 12.4節の眼目なので、隣は海区の側の事実として持つ（下の zone_toward_*、Voyage.md 3.8節）。
      drift_to_mainland_weight: {value: 0}
      drift_to_island_weight: {value: 0}

      # この海区で荒天にさらされた時間（tick）。上限に達すると1回押し流して0へ戻る（6.3節の折り返し）。
      # **さらされてから流されるまでの長さ（range.max）が顔ぶれの差**で、岩礁だけが短い
      # （ContentSkeleton.md 7節）。**押し流し方そのものはどの海区も同じ**なので、卓はここに1つだけ置く
      # ——海区の側が書くのは隣（zone_toward_*）だけで、流す手順は知らなくてよい。
      #
      # **行き先を持たない候補は、選ばれても何も起きない回になる**（10.1節）。鎖の端は片側の隣を
      # 持たないので、その風下を引いた回は何も起きない——端の海区のために卓を書き分けなくてよい。
      # **分かれ道と合流点だけが、遠回りの側の1本を足すためにこの卓を書き直す**（うねりの海・流れ藻の海）。
      storm_drift:
        value: 0
        range: {min: 0, max: 16}
        on_max:
          # 押し流したら0から数え直す。**`add` ではなく `set` なのは、range.max が海区ごとに違うから**
          # ——引く量を書くと、卓と一緒に折り返す点も海区ごとに書き写すことになる。
          set: {self: {storm_drift: 0}}
          pick:
            - weight: {prop: drift_to_mainland_weight}
              among: {slot: fixtures, matches: {object: raft}}
              move: {subject: picked, to_object: {prop: zone_toward_mainland}}
              signal: {picked: swept}
            - weight: {prop: drift_to_island_weight}
              among: {slot: fixtures, matches: {object: raft}}
              move: {subject: picked, to_object: {prop: zone_toward_island}}
              signal: {picked: swept}
    passives:
      # 海流。浮かんでいるものを本土の方へ押し続ける。**素の筏が何も積まずに進めるのはこれだけ**で、
      # 積載の段はこれを打ち消す量として書いてある（筏の sail_speed 参照）。
      - modify: {child: {sail_speed: 3}}
      # 浮いていること自体を子へ配る。組み込んだ部品が「陸では効かない」と言うために読む
      # （筏の afloat 参照）。
      - modify: {child: {afloat: 1}}
      # 立った海区は海図に残る（GameEndings.md 12.6節）。**記入するのは海区自身**——筏が浮かんで
      # いるかは自分の中を見れば分かるので、渡らせた側（航路・出航）が「渡った後にあれも書く」を
      # 覚えておく必要が無い。上限が1なので、何度浮かんでも記入は1度きり。
      - conditions:
          - {slot: fixtures, matches: {object: raft}}
        add: {self: {chart_crossed: 1}}
      # 風下がどちら側か（GameEndings.md 12.4節）。追い風なら本土の側、向かい風なら島の側。
      # **横風にはどちらも立たない**——分岐が入っても、辺で繋がった隣はどれも本土の側か島の側の
      # どちらかで、横風の風下に当たる海区はどれとも繋がっていない。
      - conditions:
          - {subject: ancestor, prop: wind, eq: tailwind}
        modify: {self: {drift_to_mainland_weight: 1}}
      - conditions:
          - {subject: ancestor, prop: wind, eq: headwind}
        modify: {self: {drift_to_island_weight: 1}}
      # 荒天にさらされた時間。**筏がこの海に浮いている間だけ進む**ので、海岸に繋いだままの筏は
      # 流されない。横風の間も進まない——押し流す先が無いので、待っても溜まらない。
      - conditions:
          - {slot: fixtures, matches: {object: raft}}
          - {subject: ancestor, prop: weather, eq: storm}
          - not: {subject: ancestor, prop: wind, eq: crosswind}
        add: {self: {storm_drift: 1}}
      # 荒天が去るか筏が出ていけば、貯まった時間はほどけていく（range.minの0で止まる）。
      # **同じ海区へ戻ってきた筏が、前の荒天の続きから流されることはない。**
      - conditions:
          - not:
              all:
                - {slot: fixtures, matches: {object: raft}}
                - {subject: ancestor, prop: weather, eq: storm}
        add: {self: {storm_drift: -1}}
    interactions:
      # 見張り。**地上の探索そのもの**（ExplorationSystem.md 2節）で、1回15分＝1tick、進捗が1つ進む。
      # 進捗が上限に達した瞬間、その海区から出る航路が現れる（exploration_progress の on_max）。
      # 現れるのは**辺1本の両端**——この海区に立つ「次の海区への航路」と、次の海区に立つ
      # 「この海区への航路」（GameEndings.md 12.5節）。どちらも同じ sea_route で、違うのは行き先だけ。
      #
      # **航路が現れても見張りは終わらない**（同12.1節・12.3節）。渡らずに待つことは、その海区を
      # 探索し続けること——拾い物も魚の群れも、航路が見えた後の見張りが返す。二重に湧かせないのは
      # 湧かせる側の仕事で、ここには条件を置かない（各海区の on_max 参照）。
      explore:
        trigger: menu
        duration: 15
        add: {self: {exploration_progress: 1}}
        # 見張りが返すもの（GameEndings.md 12.1節）。次の行き先は航路（進捗の on_max）が受け持つので、
        # ここに並ぶのは拾えるものと、その場に湧くものだけ。
        #
        # **拾えるものは海面に置かず、見つけた時点で手に入る**（同12.7節）。手が塞がっていれば筏の
        # 積荷へこぼれ、そこも塞がっていれば手に入らない（spawn の into: agent、9.4節）。
        pick:
          # 何も見つからない。この候補だけは効果を持たない。
          - weight: {prop: barren_find}
          - weight: {prop: driftwood_find}
            spawn: {object: thick_branch, count: 2, into: agent}
          - weight: {prop: flotsam_find}
            spawn:
              - {object: thick_branch, into: agent}
              - {object: rope, into: agent}
          - weight: {prop: seaweed_find}
            spawn: {object: seaweed, count: 2, into: agent}
          - weight: {prop: egg_find}
            spawn:
              - {object: bird_egg, into: agent}
              - {object: feather, into: agent}
          - weight: {prop: wreck_find}
            spawn: {object: golden_chalice, into: agent}
          # 湧くものは海区の設置物になる（12.7節）。居る間だけ実り、しばらくすると去る。
          #
          # **この2つには狩猟の腕（quarry_sense）が積まれる**（docs/world/Skills.md 5節）。地上で
          # 獣の候補へ積んでいるのとまったく同じ「出くわす機会」で、獲る手（下のspear_shoal・
          # catch_seabird）はどちらも狩猟の腕を配る。**拾えるもの（上）には積まない**
          # ——流木も海藻も卵も、居合わせるかどうかではなく海が返す実りだから。
          - weight: {prop: shoal_find}
            spawn: {object: fish_shoal, into: self}
          - weight: {prop: seabird_find}
            spawn: {object: seabird_flock, into: self}

  # 航路。海区から海区への繋がり1本で、見張りの成果として現れる設置物。
  #
  # **航路は方向を持たない——持つのは行き先の型だけ。** だから「島の側へ戻る航路」に別の仕組みは
  # 要らず、1つ戻る航路は多くが既に在る型そのものになる（潮目に置く「海藻の帯への航路」は、
  # 島影の海が持つのと同じ route_to_kelp_belt）。
  #
  # **渡る手はここが持ち、行き先だけを型の側が書く。** 地上の道の travel と同じメニューの操作で、
  # 違うのは動かす物だけ——地上の道が歩く本人を動かすのに対し、航路は同じ海区に浮かんでいる筏を
  # 乗り手ごと動かす。筏を指すのに among を使うのは、航路から見て筏が親でも子でもなく、同じ海区に
  # 並ぶ兄弟だからで、候補は高々1つなので抽選にはならない。
  sea_route:
    # fixtureは「持ち歩けない」という置き場所の分類、sea_routeは「海区から出る道である」という役割。
    # 地上の道（path）とはタグを分ける——画面が path の札に出す行き先の土地名は、行き先を
    # インスタンスIDで持つ道のためのもので、型で行き先を指す航路には引くものが無い。
    tags: [fixture, sea_route]
    # 16本の航路が1枚の絵を共有する（4.3節）。**行き先しか違わないものに、行き先の数だけ絵は要らない**
    # ——札が出すのは「ここから渡れる」という事実で、どこへ渡るかは名前が言う。
    art: sea_route
    # 繋がる海区の無い航路は存在しない（7.9節）。海区から外せず、海区が消えれば一緒に消える。
    bound_to_owner: true
    props:
      # 航路は海そのものなので目方を持たない（地上の道と同じ、ContainerSystem.md 1節）。
      weight: {value: 0}

      # 行き先の海区が名乗る「本土まであと何海区か」。**行き先は型ごとに1つに決まっている**ので、
      # 型の側の事実として書ける（値を持たないので、各航路が必ず名乗る。5節）。
      #
      # **これと今いる海区の同じ数との差が、この辺の伸びている方角**（GameEndings.md 12.3節）。
      # 行き先のほうが本土に近ければ本土の側へ、遠ければ沖の側へ伸びる辺で、風の受け方が反対になる。
      # **航路が向きを持たないまま向きが出るのはこのため**——同じ型が辺の両端に立っても、立つ海区が
      # 違えば差の符号が逆になる（引き返しの仕組みはそのまま、3.5節）。
      destination_zones_to_mainland: {}

      # この航路を渡るのにかかる時間（分）。**土台は今いる海区の横断時間**（筏の速さが引いた後の実効値）
      # で、そこへ風の受け方（下の passives）が乗る。
      #
      # **風だけが海区ではなく航路に乗る**（GameEndings.md 12.3節「風向きは速さの係数ではなく、どの航路が
      # 今いくらで渡れるかを決めます」）。海区に乗せると、同じ海区から出る2本の航路が同じ時間になり、
      # 分かれ道が「今なら短く渡れる航路」を出せない。
      #
      # range の下限は海区の側と同じ理由の底（寄与がどれだけ重なっても横断時間が消えないため）。
      crossing_minutes:
        value: 0
        base: {subject: parent, prop: crossing_minutes}
        range: {min: 120, max: 900}
    passives:
      # 風の受け方（GameEndings.md 12.3節）。**同じ風でも、辺の伸びている方角で追い風・横風・向かい風に
      # 分かれる。** 横風はどちらへ伸びる辺にも横から当たるので、方角を見ずに1本で書く。
      - conditions:
          - {subject: ancestor, prop: wind, eq: crosswind}
        modify: {self: {crossing_minutes: -30}}
      # 本土の側へ伸びる辺（行き先のほうが本土に近い）。世界の風向きがそのまま効く。
      - conditions:
          - {prop: destination_zones_to_mainland, lt: {subject: parent, prop: zones_to_mainland}}
          - {subject: ancestor, prop: wind, eq: tailwind}
        modify: {self: {crossing_minutes: -60}}
      - conditions:
          - {prop: destination_zones_to_mainland, lt: {subject: parent, prop: zones_to_mainland}}
          - {subject: ancestor, prop: wind, eq: headwind}
        modify: {self: {crossing_minutes: 30}}
      # 沖の側へ伸びる辺（行き先のほうが本土から遠い）。**同じ辺を逆に渡れば追い風は向かい風になる**
      # ——引き返しの代償が時間として出るのも、分かれ道の遠回りが向かい風の日に短く渡れるのもこれ
      # （GameEndings.md 12.5節・12.3節）。
      - conditions:
          - {prop: destination_zones_to_mainland, gt: {subject: parent, prop: zones_to_mainland}}
          - {subject: ancestor, prop: wind, eq: tailwind}
        modify: {self: {crossing_minutes: 30}}
      - conditions:
          - {prop: destination_zones_to_mainland, gt: {subject: parent, prop: zones_to_mainland}}
          - {subject: ancestor, prop: wind, eq: headwind}
        modify: {self: {crossing_minutes: -60}}
    interactions:
      cross:
        trigger: menu
        conditions:
          - reason: no_vessel_here
            subject: parent
            slot: fixtures
            matches: {object: raft}
        # **漕ぎ出すときに読み切る**（duration は効果より先に時計を進める、11.3節）ので、渡っている
        # 最中に風が変わっても伸び縮みしない（GameEndings.md 12.3節「針路の判断が博打にならない」）。
        duration: {prop: crossing_minutes}
        # 渡す手は**この1本だけ**。行き先は型の側が `destination_zone` に書き、ここはそれを引く
        # （6.9節）——型ごとに違うのが行き先1つなら、渡す手も型の数だけ要らない。
        pick:
          - weight: 1
            among: {subject: parent, slot: fixtures, matches: {object: raft}}
            move: {subject: picked, to_object: {prop: destination_zone}}

object_defs:
  # 筏。丸太を並べて縛った、島を出るための乗り物。
  #
  # **設置物（fixture）でありながら場所（location）でもある。** 中に積荷を載せ、プレイヤー自身も
  # 乗り込むため、土地と同じ items/fixtures/characters の3スロットを持つ。札へ重ねれば積める
  # （7.8節）——編み籠（containers.yaml）と同じ操作でよい。
  # boatは「海を渡る乗り物である」ことを言うタグ（ContentSkeleton.md 3節の系統12）。帆や航路と違って
  # 船そのものを指す語が無いと、遠出の絞り込みから船が消える（ScreenLayout.md 8.1.2節）。
  raft:
    tags: [fixture, boat]
    traits: [location]
    # 積荷が個体ごとに違うので束ねない（SlotSystem.md 4節）。
    stackable: false
    # **外から見えるのは帆だけ**（7.11節）。積荷は重ねれば積めるが、何を積んだかは乗り込まないと
    # 分からない——中に入れば items がレーンに出る。土地から受け継いだ items/fixtures/characters を
    # 外から覗ける場所にすると、筏が「開けば中身が並ぶ箱」になってしまう。
    visible_slots: [structure]
    # 物を溜める入れ物（7.12節）。積荷の枠の詰まり具合をカードのバーに出す。
    storage: true
    slots:
      items:
        # 何種類積めるか。土地の items は上限を持たないので、筏だけが枠数とかさを決める。
        cell_count: 12
        # 積めるかさの合計（500L）。**縛りようの上限であって、実際の限界は重さ**——嵩いっぱいに
        # 積めば、その前に段（weight）が速さを削り始める。
        capacity: 500000
      # 組み込んだ部品（Dwellings.md 1節の構造スロットと同じ形）。積荷とは別の並びにする——
      # 帆は「積んである物」ではなく筏の一部で、外すまで効き続ける。
      #
      # **外からも中からも、この枠だけがタブに出る**（visible_slots）。積荷は中に入ったときだけ
      # レーンに出るので、2つは見える場所から分かれている。
      structure:
        cells:
          - {accept: {tag: sail}, max: 1}
    props:
      # 筏は何も遮らないので、居る場所の明るさがそのまま乗っている人まで届く
      # （docs/engine/IlluminationSystem.md 2節）。**場所を名乗る以上は明るさも名乗る**
      # ——書かなければ、乗った瞬間に明かりの継ぎ目が切れる。
      ambient_brightness: {value: 0}
      # 材料ぶんの自重（丸太6本120kg＋ロープ4本2.4kg）。中身の重さは実効値に足されるので（7.4節）、
      # 積むほど重くなる。**積むほど遅い**のは段が sail_speed を削るから（GameEndings.md 4節）。
      # 海の上で積荷を捨てれば段が下がり、そのぶん速くなる——専用の仕組みは要らない。
      #
      # **段の境目は自重＋乗員＋積荷で書く。** 段が見るのは実効値なので、積荷の量で言い表すには
      # 自重を足した値になる。**乗員1人（65kg）も足す**——航海中は必ず乗っているので、乗員を
      # 見込まないと積める量がそのぶん減る（characters/player_character.yaml）。自重や乗員の重さを
      # 変えるときは境目も一緒に動かすこと。
      weight:
        value: 122400
        stages:
          # 80kgまでの積荷。
          - name: light
          # 80〜160kg。
          - name: laden
            min: 267400
            passives:
              - modify: {self: {sail_speed: -1}}
          # 160〜240kg。
          - name: heavy
            min: 347400
            passives:
              - modify: {self: {sail_speed: -3}}
          # 240kg超。海流を打ち消し切るので、帆を張っても止まったまま。
          - name: overladen
            min: 427400
            passives:
              - modify: {self: {sail_speed: -6}}
      # 出航した海岸のインスタンスID（出航時に書かれる、set_sail 参照）。**引き返す先はここ**で、
      # 島へ戻る航路（route_to_shore）がそのまま読む。**書かれる前に読まれることはない**
      # ——海へ出る道は set_sail しかなく、それが書き込みそのものだから。
      #
      # **覚えるのは筏の側。** 航路は海区に立つ設置物で、どの海岸から来た筏が浮いているかを知らない
      # ——出航のたびに変わることを覚えられるのは、出航する当人だけ。
      home_coast_id: {value: 0}
      # 浮いているか。海区が子へ配る（sea_zone traitの modify）ので、海に出ている間だけ1になる。
      #
      # **帆のような部品が「陸では効かない」と言うための足場。** 筏自身なら親の型（`parent` が
      # `sea` タグを持つか）で絞れるが、部品から見た海は親の親で、条件では指せない。
      afloat: {value: 0}
      # 航海の速さ（実効値）。素の値は0で、寄与は3つ——海区の海流（海区の modify）、積載の重さ
      # （weight の段）、組み込んだ帆（rawhide_sail）。陸に居る間はどれも効かないので0になる。
      #
      # **風はここへ集めない**（GameEndings.md 12.3節）。風は速さの係数ではなく、どの航路が今いくらで
      # 渡れるかを決めるものなので、航路の側が持つ（sea_route の crossing_minutes）。ここに集めると、
      # 同じ海区から出る2本の航路が必ず同じ時間になる。
      #
      # **速さは進みではなく、今居る海区を渡る時間へ効く。** 段ごとに違う量を親（海区）の
      # crossing_minutes から引く——`modify` の量はリテラルしか書けないので、可変の効き方を段で刻んで
      # いる。陸の上の親は crossing_minutes を持たないので何も起きない。
      sail_speed:
        value: 0
        range: {min: 0, max: 20}
        stages:
          # 進まない（積みすぎて海流を打ち消した）。渡るのに素の時間が丸々かかる。
          - name: becalmed
          - name: slow
            min: 2
            passives:
              - modify: {parent: {crossing_minutes: -30}}
          - name: moderate
            min: 4
            passives:
              - modify: {parent: {crossing_minutes: -60}}
    recipes:
      # **解放条件を持たない。** 丸太は斧でしか採れず（timber.yaml）、その斧が既に石器と繊維・編みの
      # 腕を要求している——素材チェーンが自分でゲートしている場所には置かない
      # （docs/engine/SkillSystem.md 4.2節）。
      lashed:
        steps:
          # 丸太を並べて桁を渡す。
          - requires:
              - {object: log, count: 6, consume: true}
            duration: 240
          # 交差するところをロープで縛る。
          - requires:
              - {object: rope, count: 4, consume: true}
            duration: 180
    interactions:
      # 乗り込む。**筏は場所なので、中の仕事は中に入らないとできない**——積荷を並べる・帆を張るは
      # 筏のスロットへの操作で、岸に立ったままでは届かない。
      #
      # 既に中に居るときは移動が空振りするだけなので、条件は置かない。そもそも中からは筏の札が
      # 見えない（現在地の札になる）ので、押す機会が無い。
      board:
        trigger: menu
        duration: 5
        move: {subject: agent, to: self}

      # 降りる。海の上では降りられない。**引き返しは泳ぐことではなく、来た航路を戻ること**
      # （GameEndings.md 12.5節）なので、海区から陸へ出る手はここではなく航路の側にある。
      disembark:
        trigger: menu
        conditions:
          - reason: at_sea
            not: {subject: parent, matches: {tag: sea}}
        duration: 5
        move: {subject: agent, to: parent}

      # 航海に出る。乗り込むところまでを1手に含める——岸から直に出せるほうが手数が少なく、
      # 既に乗っていれば移動が空振りするだけで結果は同じになる。
      #
      # **出る先を決めるのは海岸で、筏ではない**（coast trait）。ここが引くのは「この海岸はどの海区に
      # 面しているか」の重みだけで、行き先の海区も、そこから本土までが何区間あるかも知らない。
      # 出航地点を選ぶことがそのまま航海の距離と危険度を選ぶことになる（GameEndings.md 5節）。
      #
      # **押し出す前に、出た海岸を覚える**（home_coast_id）。順序がそのまま意味で、動いた後では
      # 親が海区に変わっている。
      #
      # **出航は島と海を繋ぐ辺を渡る手なので、向こう端（route_to_shore）を立てるのもこの手。**
      # 見張りが辺を見つけて両端へ1本ずつ立てるのと同じことで、島側の端が海区ではないぶん、立てる
      # のが見張りではなく出航になっている。**出航した瞬間から島へ引き返せる**（同12.5節）。立てる先を
      # 親（＝押し出した先の海区）で指すので、どの海区へ出ても帰り道は同じ1行で足りる。
      set_sail:
        trigger: menu
        conditions:
          - reason: not_on_coast
            subject: parent
            matches: {tag: coast}
        duration: 60
        set: {self: {home_coast_id: {subject: parent}}}
        move: {subject: agent, to: self}
        pick:
          - weight: {subject: parent, prop: offshore_coastal_waters}
            move: {subject: self, to_object: coastal_waters}
          - weight: {subject: parent, prop: offshore_tide_rip}
            move: {subject: self, to_object: tide_rip}
          - weight: {subject: parent, prop: offshore_gull_rock}
            move: {subject: self, to_object: gull_rock}
        spawn: {object: route_to_shore, into: parent}

      # 海へ突く。群れの居ない海面へ、筏の縁から真下を突く（Voyage.md 3.9.2節）。**皆無ではないのは
      # 筏そのものが漁礁になるから**で、60分に0.15切れ——当てにできる量ではない、という違いがここに出る。
      #
      # **浮いている間だけ**（afloat）。帆の寄与と同じ形で、条件を落とすと浜に繋いだままの筏の下から
      # 魚が獲れる。**群れへ突く手（fish_shoalのspear_shoal）はこの条件を持たない**——群れは海区に
      # しか立たないので、群れが在ること自体が海の上に居ることの証になる。
      spear_sea:
        trigger: {drag: {tag: fishing_tool}}
        conditions:
          - reason: not_afloat
            prop: afloat
            gt: 0
        duration: 60
        # 狩猟の腕（docs/engine/SkillSystem.md 3節の実行経路、量の置き方は
        # characters/player_character.yaml）。**獲物を獲る手は海でも同じ1本**——狩猟が広げるのは
        # 肉・生皮・獣骨へのアクセス（docs/world/Skills.md 2節）で、獲れる身は獣と同じ生肉。
        # 獣を殴るとき（animals.yamlのstrike）と同じく**pickの外**なので、突き損ねた回も伸びる。
        add: {agent: {skill_hunting: 2}}
        pick:
          - weight: 15
            spawn: {object: raw_meat, into: agent}
          # 突き損ね。この候補だけは効果を持たない。
          - weight: 83
          # 突いた魚に銛を持って行かれる（Voyage.md 3.9.4節）。群れを突くときと同じ確率で、失う理由は同じ。
          - weight: 2
            destroy: instrument

  # 生皮の帆。筏の構造スロットへ組み込むと、風を捉える量が増える（sail_speed +2）。
  #
  # **段をちょうど1つ上げる最小の値が2。** 素の筏は海流だけで `slow`、帆があれば `moderate` に届く。
  # +1 では段が動かない積載があり、+3 にしても上がる段は変わらないので、盤面に差が出るのは2だけ。
  # 後から入るなめし革の帆を+4にすれば、重く積んだ日ほど差が開く伸び方になる。
  #
  # 質量は材料の和（生皮6×600 + 糸10×100 + 太い枝2×1000 + ロープ2×600 = 7800g）。
  rawhide_sail:
    tags: [item, sail]
    props:
      weight: {value: 7800}
      # 畳んでも枠と革はかさばる。筏の積載（500L）に対しては小さい。
      volume: {value: 15000}
    passives:
      # 効き先は親（＝組み込まれた筏）。積荷のスロットに置いても親は同じなので、構造スロットに
      # 入れることを強いているのは枠のaccept（tag: sail）であって、この宣言ではない。
      #
      # **浮いている間だけ効かせる。** 条件を付けないと、浜に置いた筏の sail_speed が2になって
      # 段が `slow` へ上がり、陸に繋いだままの筏が横断時間を縮め始める。
      - conditions:
          - {subject: parent, prop: afloat, gt: 0}
        modify: {parent: {sail_speed: 2}}
    recipes:
      sewn:
        # なめし革の衣類と同じ縫製の大物（clothing.yaml）なので、解放条件も同じ形にする。
        conditions:
          - {reason: needs_leatherwork, subject: agent, prop: skill_leatherwork, in_stage_or_above: skilled}
          - {reason: needs_cordage, subject: agent, prop: skill_cordage, in_stage_or_above: basic}
        steps:
          # 帆柱と帆桁を組んで縛る。
          - requires:
              - {object: thick_branch, count: 2, consume: true}
              - {object: rope, count: 2, consume: true}
            duration: 120
          # 生皮を糸で縫い合わせ、枠へ張る。骨針は道具なので減らない。
          - requires:
              - {object: rawhide, count: 6, consume: true}
              - {object: yarn, count: 10, consume: true}
              - {tag: sewing_tool, count: 1, consume: false}
            duration: 300

  # ------------------------------------------------------------------
  # 海の産物。**獲れた身は獣と同じ生肉**（raw_meat、animals.yaml）——得られる素材は獲物の種類に
  # よらず同じで、獲物の大きさは個数で表す（HuntingSystem.md 1.5節）。魚と貝のために別の食材を
  # 足すと、焼く鎖もそのぶん増える。
  # ------------------------------------------------------------------

  # 海藻。帯になって漂うものを掬い上げたもの。生のまま食べられる。
  seaweed:
    tags: [item, food]
    # 水を抱えたまま剥き出しの葉体なので、葉物野菜より速く傷む（foods.yaml・DurabilitySystem.md 3節）。
    traits: [perishable, spoils_fast, dryable]
    props:
      weight: {value: 200}
      # 濡れた葉体は詰めても縮まないので、嵩そのままで見る（plant_fiberと同じ扱い）。
      volume: {value: 1500}
    # 塩漬けにできる（salt.yaml）。**隔てるものが無く、塩が葉体へ直に届く。** 2.5日が20日になるので、
    # 海で拾ったものを島へ持ち帰れるようになる。
    variation_axes:
      cure: {of: {tag: cured}}
    interactions:
      eat:
        trigger: menu
        conditions:
          - reason: too_full
            not: {subject: agent, prop: satiety, in_stage_or_above: full}
        duration: 15
        add:
          agent:
            satiety: 200
            carbohydrate: 1
            vitamin: 60
            happiness: 2
        pick:
          - weight: 100
          - weight: {prop: spoilage}
            set: {agent: {satiety: 0}}
            add: {agent: {carbohydrate: -40, protein: -40, lipid: -40}}
          - weight: {prop: spoilage}
            add: {agent: {carbohydrate: -40, protein: -40, lipid: -40, hydration: -48}}
        destroy: self

  # 海鳥の卵。岩の窪みに産み落とされたもので、殻を割ればそのまま飲める。
  bird_egg:
    tags: [item, food]
    # 殻が中身を外気から隔てているぶん、芋と同じ遅さで傷む（foods.yaml・DurabilitySystem.md 3節）。
    traits: [perishable, spoils_slow]
    # **塩漬けにはできない**（salt.yamlのcure軸を名乗らない）。殻の中のヤシの実を除いたのと同じ線
    # （coconut.yaml）で、塩をすり込む相手が殻になり、身へは届かない。上の遅さがその殻から出ている
    # ことがそのまま理由で、隔てているものが既に塩の仕事をしている。
    props:
      weight: {value: 60}
      volume: {value: 55}
    interactions:
      eat:
        trigger: menu
        conditions:
          - reason: too_full
            not: {subject: agent, prop: satiety, in_stage_or_above: full}
        duration: 15
        add:
          agent:
            satiety: 150
            protein: 6
            lipid: 5
            vitamin: 10
            # 殻を割ってそのまますすれば食べられるが、火を通した食事ではない
            # （docs/world/Characters.md 幸福度節の表）。
            happiness: 2
        pick:
          - weight: 100
          - weight: {prop: spoilage}
            set: {agent: {satiety: 0}}
            add: {agent: {carbohydrate: -40, protein: -40, lipid: -40}}
          - weight: {prop: spoilage}
            add: {agent: {carbohydrate: -40, protein: -40, lipid: -40, hydration: -48}}
        destroy: self

  # 魚の群れ。海面まで上がってきた群れで、**居る間だけ実る**（GameEndings.md 12.1節）。
  # 突くには銛が要る（fishing_tool、tools.yaml）。手では獲れない。
  fish_shoal:
    tags: [fixture]
    # 海に浮かんでいるものなので、海区から外せない（7.9節）。
    bound_to_owner: true
    # 立ち去りまでの残りが個体ごとに違うので束ねない（SlotSystem.md 4節）。
    stackable: false
    props:
      # 群れは海そのものと同じく目方を持たない（航路と同じ、ContainerSystem.md 1節）。
      weight: {value: 0}
      # 立ち去りまでの残り。獣と同じ形（HuntingSystem.md 5.6節）だが、**人が居ても止まらない**
      # ——獣が目の前で消えないのは同じ土地に立っているからで、海では乗り手は筏の中に居る。
      stay_remaining:
        value: 24
        range: {min: 0, max: 24}
        passives:
          - add: {self: {stay_remaining: -1}}
        on_min:
          destroy: self
    interactions:
      # 群れへ突く。**当たりが違うのは突く相手**（Voyage.md 3.9.2節）——水面に立った群れは密なので、
      # 30分に0.78切れが返る。群れの居ない海面（raftのspear_sea）との落差が、積むか釣るかの判断を
      # 作っているので、どちらか一方だけを動かさない。
      spear_shoal:
        trigger: {drag: {tag: fishing_tool}}
        duration: 30
        add: {agent: {skill_hunting: 2}}
        pick:
          - weight: 78
            spawn: {object: raw_meat, into: agent}
          # 突き損ね。この候補だけは効果を持たない。
          - weight: 20
          # 突いた魚に銛を持って行かれる（同3.9.4節）。**穂先の予備と紐を積む理由がこれ**——柄になる
          # 太い枝は海が返すが、石と紐は返らない。
          - weight: 2
            destroy: instrument

  # 海鳥の群れ。岩に集まって巣を作る鳥で、人を知らないので手が届く。
  seabird_flock:
    tags: [fixture]
    bound_to_owner: true
    stackable: false
    props:
      weight: {value: 0}
      stay_remaining:
        value: 24
        range: {min: 0, max: 24}
        passives:
          - add: {self: {stay_remaining: -1}}
        on_min:
          destroy: self
    interactions:
      catch_seabird:
        trigger: menu
        duration: 60
        add: {agent: {skill_hunting: 2}}
        spawn:
          - {object: raw_meat, into: agent}
          - {object: feather, into: agent}

  # 小島。海区で見つかる、上陸して探索できる陸地（ContentSkeleton.md 7節）。**設置物でありながら
  # 場所でもある**——浅い洞窟（locations.yaml）と同じ形で、筏を寄せれば中の仕事ができる。
  #
  # **立つのは小島の海と海鳥の岩の2つの顔ぶれ**（海鳥の岩は、鳥が巣を作るその「岩」が上陸できる
  # 小島そのもの）。**現れるのは航路と一緒**——見張りの卓の候補にすると同じ島が2つ湧きうるが、
  # 見張りを終えた印（on_max）は海区ごとに1度しか通らない。
  #
  # **錫鉱石はここでしか採れない**（ContentSkeleton.md 7.1節）。青銅の材料の片割れが海の向こうにあることが、
  # 最終航海より前に一度渡っておく理由になる（GameEndings.md 11節）。
  offshore_islet:
    tags: [fixture]
    traits: [location, explorable]
    # 上陸したものが個体ごとに違うので束ねない（SlotSystem.md 4節）。
    stackable: false
    props:
      # 地形そのものなので、運べる目方を持たない（浅い洞窟と同じ、ContainerSystem.md 1節）。
      weight: {value: 0}
      # 遮るものの無い岩の島なので、空の明るさがそのまま届く（IlluminationSystem.md 2節）。
      ambient_brightness: {value: 0}
      exploration_progress:
        value: 0
        range: {min: 0, max: 8}
    interactions:
      # 島を歩いて調べる。**降りていないとできない**——筏に乗ったままでは岸から眺めているだけで、
      # 岩の窪みも波打ち際も見られない（筏の中の仕事を岸からできないのと同じ、Voyage.md 2節）。
      explore:
        trigger: menu
        conditions:
          - reason: not_ashore
            slot: characters
            matches: {tag: character}
          - reason: too_dark
            subject: agent
            prop: looking_brightness
            in_stage_or_above: bright
        duration: 15
        add: {self: {exploration_progress: 1}}
        pick:
          - weight: 25
            spawn: {object: stone, count: 2, into: self}
          - weight: 20
            spawn:
              - {object: thick_branch, into: self}
              - {object: stone, into: self}
          - weight: 20
            spawn: {object: seaweed, count: 2, into: self}
          - weight: 20
            spawn:
              - {object: bird_egg, into: self}
              - {object: feather, into: self}
          - weight: 15
            spawn: {object: thick_branch, count: 2, into: self}
          # 錫鉱石。**どの候補も2個を返す**ので、1つ足しても1回あたりの平均（2個）は動かない
          # （地上の土地と同じ配り方、locations.yaml）。
          - weight: 20
            spawn: {object: tin_ore, count: 2, into: self}
      # 上陸。**航路を渡るのと同じ形**で、同じ海区に浮かんでいる筏を乗り手ごと引き寄せる。
      land:
        trigger: menu
        conditions:
          - reason: no_vessel_here
            subject: parent
            slot: fixtures
            matches: {object: raft}
        duration: 30
        pick:
          - weight: 1
            among: {subject: parent, slot: fixtures, matches: {object: raft}}
            move: {subject: picked, to: self}
      # 漕ぎ出す。**乗り込むところまでを1手に含める**（筏の set_sail と同じ）——降りたまま筏だけを
      # 押し出せると、小島に取り残される。
      launch:
        trigger: menu
        conditions:
          - reason: no_vessel_ashore
            slot: fixtures
            matches: {object: raft}
        duration: 30
        pick:
          - weight: 1
            among: {slot: fixtures, matches: {object: raft}}
            move:
              - {subject: agent, to: picked}
              - {subject: picked, to: parent}

  # 錫鉱石。小島の岩に混じる黒い塊で、**青銅の材料のうち、島では採れないほうの片割れ**
  # （ContentSkeleton.md 7.1節。銅は母島の山で採れる）。
  #
  # **使い道（製錬と青銅の道具）は刃物・打撃の系統が持つ**（同4節）ので、ここに置くのは物そのものだけ。
  tin_ore:
    tags: [item]
    props:
      # 石と同じ大きさの塊だが、金属を含むぶん重い（石は1000g・700mL、locations.yaml）。**持ち帰るには
      # 筏に積むことになる**ので、この重さがそのまま航海の速さを削る（筏の weight の段）。
      weight: {value: 1500}
      volume: {value: 700}

  # ------------------------------------------------------------------
  # 海区（GameEndings.md 12節）。島と本土の間の海を、8種類の顔ぶれ（ContentSkeleton.md 7節）から
  # 配った14個の連なりとして持つ。海区そのものの作りは sea_zone trait（このファイルの先頭）が
  # 持ち、ここが書くのは海区ごとに違う3つだけ——本土までの最短の残り海区数・見張り何回で航路が
  # 現れるか・見張りの卓の重み（＝その海区の顔ぶれ）。**渡るのにかかる時間は揃っている**
  # （sea_zone trait）。
  #
  # **明るさはどの海区も0**（遮るものが何も無いので、空の明るさがそのまま届く、
  # IlluminationSystem.md 2節）。location trait が値を持たないので、海区ごとに名乗る。
  #
  # **うねりの海で航路が二手に分かれ、流れ藻の海で合流する**（GameEndings.md 12.3節）。
  #
  #   島影の海 — 海藻の帯 — 潮目 — 岩礁の海 — 海鳥の岩 — 小島の海 — 空の海 — 沈船の海 — うねりの海
  #     近道　: うねりの海 — 流れ藻の海
  #     遠回り: うねりの海 — 沖の潮目 — 黒い岩礁 — 流れ藻の海
  #   流れ藻の海 — 白い岩 — 本土の島影 — 本土
  #
  # **近道のほうが実りが薄い**（同12.1節）。渡る時間はどの海区も同じなので、実りの濃淡は見張りの卓の
  # 重みだけで表し、経路の長短は**通る海区の数**で表す——近道は1区間で流れ藻の海へ着くかわりに、
  # 沖の潮目（実り0.8）と黒い岩礁（同0.55）の2区間ぶんの見張りを丸ごと飛ばす。遠回りは2区間ぶん
  # 長いが、その2つが返す。
  #
  # **辺で繋がった隣は、海区が `zone_toward_mainland`・`zone_toward_island` に1度だけ書く。** 航路を
  # 立てる先（`exploration_progress` の `on_max`）も、荒天が押し流す先（`storm_drift` の `on_max`）も
  # ここを引くので、**同じ隣を2箇所へ書き写すことはない**（行き先を型のまま持てる、6.9節）。分けている
  # 「本土の側／島の側」は鎖の先か手前かで、分かれ道では近道も遠回りも「先」（sea_zone trait 参照）。
  # 遠回りの側の1本だけ `_detour` を付ける——分かれ道（うねりの海）と合流点（流れ藻の海）にしか無い。
  #
  # **鎖の端では片側の隣が無いので、そのプロパティも持たない。** 島影の海に島の側の隣は無く、本土の
  # 島影の本土の側は海区ではない（本土への到達は航路が渡すもので、荒天が渡すものではない）。
  #
  # **on_max が湧かせるのは辺1本の両端**——この海区に立つ「次の海区への航路」と、次の海区に立つ
  # 「この海区への航路」（同12.5節）。地上の道が辺1本につき両端へ1個ずつ置く（`IslandSpawner`）のと
  # 同じことを、海では見張りの成果として実行時にやる。**戻る航路は隣の海区が立ててくれる**ので、
  # 自分では立てない——渡り着いたときには既に立っているので、見張らずに引き返せる（同12.5節）。
  #
  # **どの on_max も「その航路がまだ立っていないなら」で自分を守る**（6.3節の conditions）。上限へ
  # 達した値は書き込みのたびに on_max を呼び直すので、守らないと見張るたびに同じ航路が湧く。**見るのは
  # 進む先の航路そのもの**で、印は持たない——航路が在るかは海区の中を見れば分かる。`sea_route` タグでは
  # 見分けられない（渡り着いたばかりの海区には来た航路が既に立っている）ので、型を名指しする。
  # **条件を満たさない回は、range を書いただけのときと同じ既定のクランプが走る**ので、100%到達後も
  # 見張り続けられて（同12.1節）、進捗は上限に張り付いたままになる。
  #
  # **分かれ道の海区だけが、見張り切ったときに航路を2本立てる**（うねりの海）。どちらへ渡るかを
  # 選べることが分岐の眼目なので、片方だけ先に見えるようにはしない——見張りの進み具合は1つしか
  # 無いので、段階を分けるなら別のつまみが要る。
  #
  # 本土の側の端だけが見張りで両端を立てない（本土に着けば周回が終わるので折り返しは要らない）。島側は
  # 海区ではないので見張りの相手にならず、島へ帰る航路（route_to_shore）を立てるのは、その辺を渡る手
  # そのものである出航（筏の set_sail）。
  #
  # **島と繋がるのは島側の端だけではない。** 海岸が面した海区へ直に漕ぎ出せる（coast trait）ので、
  # 島影の海・潮目・海鳥の岩の3つが島と辺で繋がっている。本土までの最短の残り区間が12・10・8と
  # 変わるのが、出航地点ごとの距離そのもの（GameEndings.md 5節）。
  # ------------------------------------------------------------------

  # 島影の海（沿岸）。島を離れてすぐの海区で、陸が見えているぶん自分の居場所が読みやすい。
  coastal_waters:
    singleton: true
    traits: [location, explorable, sea_zone]
    props:
      ambient_brightness: {value: 0}
      zones_to_mainland: {value: 12}
      driftwood_find: {value: 30}
      seaweed_find: {value: 25}
      shoal_find: {value: 25, base: {subject: agent, prop: quarry_sense}}
      barren_find: {value: 20}
      # 島側の端なので、島の側の隣は無い。**荒天が岸へ乗り上げさせることはない**（zone_toward_island を
      # 持たないので、その風下を引いた回は何も起きない）。
      zone_toward_mainland: {value: {object: kelp_belt}}
      exploration_progress:
        value: 0
        range: {min: 0, max: 2}
        on_max:
          conditions:
            - not: {slot: fixtures, matches: {object: route_to_kelp_belt}}
          spawn:
            - {object: route_to_kelp_belt, into: self}
            - {object: route_to_coastal_waters, into_object: {prop: zone_toward_mainland}}

  # 海藻の帯。帯そのものが目印になり、掬えば海藻が採れる。
  kelp_belt:
    singleton: true
    traits: [location, explorable, sea_zone]
    props:
      ambient_brightness: {value: 0}
      zones_to_mainland: {value: 11}
      seaweed_find: {value: 55}
      barren_find: {value: 45}
      zone_toward_mainland: {value: {object: tide_rip}}
      zone_toward_island: {value: {object: coastal_waters}}
      exploration_progress:
        value: 0
        range: {min: 0, max: 3}
        on_max:
          conditions:
            - not: {slot: fixtures, matches: {object: route_to_tide_rip}}
          spawn:
            - {object: route_to_tide_rip, into: self}
            - {object: route_to_kelp_belt, into_object: {prop: zone_toward_mainland}}

  # 潮目。流れのぶつかる帯で、波と鳥の集まりが目印になる。**補給が当てになる唯一の海区**。
  tide_rip:
    singleton: true
    traits: [location, explorable, sea_zone]
    props:
      ambient_brightness: {value: 0}
      zones_to_mainland: {value: 10}
      shoal_find: {value: 80, base: {subject: agent, prop: quarry_sense}}
      barren_find: {value: 20}
      zone_toward_mainland: {value: {object: reef_shallows}}
      zone_toward_island: {value: {object: kelp_belt}}
      exploration_progress:
        value: 0
        range: {min: 0, max: 3}
        on_max:
          conditions:
            - not: {slot: fixtures, matches: {object: route_to_reef_shallows}}
          spawn:
            - {object: route_to_reef_shallows, into: self}
            - {object: route_to_tide_rip, into_object: {prop: zone_toward_mainland}}

  # 岩礁の海。波の砕ける瀬に漂流物が寄り、魚も付く。
  reef_shallows:
    singleton: true
    traits: [location, explorable, sea_zone]
    props:
      ambient_brightness: {value: 0}
      zones_to_mainland: {value: 9}
      flotsam_find: {value: 35}
      shoal_find: {value: 20, base: {subject: agent, prop: quarry_sense}}
      barren_find: {value: 45}
      zone_toward_mainland: {value: {object: gull_rock}}
      zone_toward_island: {value: {object: tide_rip}}
      exploration_progress:
        value: 0
        range: {min: 0, max: 3}
        on_max:
          conditions:
            - not: {slot: fixtures, matches: {object: route_to_gull_rock}}
          spawn:
            - {object: route_to_gull_rock, into: self}
            - {object: route_to_reef_shallows, into_object: {prop: zone_toward_mainland}}
      # **岩礁は荒天で押し流されやすい**（ContentSkeleton.md 7節）。顔ぶれの差は、さらされてから
      # 流されるまでの長さ（折り返す点）だけで表す——押し流し方そのものは他の海区と同じ。
      storm_drift:
        range: {min: 0, max: 8}

  # 海鳥の岩。鳥が巣を作る岩で、卵と羽が拾える。**その岩は上陸できる**（offshore_islet）。
  gull_rock:
    singleton: true
    traits: [location, explorable, sea_zone]
    props:
      ambient_brightness: {value: 0}
      zones_to_mainland: {value: 8}
      egg_find: {value: 35}
      seabird_find: {value: 20, base: {subject: agent, prop: quarry_sense}}
      barren_find: {value: 45}
      zone_toward_mainland: {value: {object: islet_waters}}
      zone_toward_island: {value: {object: reef_shallows}}
      exploration_progress:
        value: 0
        range: {min: 0, max: 3}
        on_max:
          conditions:
            - not: {slot: fixtures, matches: {object: route_to_islet_waters}}
          spawn:
            - {object: route_to_islet_waters, into: self}
            - {object: offshore_islet, into: self}
            - {object: route_to_gull_rock, into_object: {prop: zone_toward_mainland}}

  # 小島の海。海面には何も無く、実りは上陸した先にある。
  islet_waters:
    singleton: true
    traits: [location, explorable, sea_zone]
    props:
      ambient_brightness: {value: 0}
      zones_to_mainland: {value: 7}
      barren_find: {value: 100}
      zone_toward_mainland: {value: {object: open_water}}
      zone_toward_island: {value: {object: gull_rock}}
      exploration_progress:
        value: 0
        range: {min: 0, max: 3}
        on_max:
          conditions:
            - not: {slot: fixtures, matches: {object: route_to_open_water}}
          spawn:
            - {object: route_to_open_water, into: self}
            - {object: offshore_islet, into: self}
            - {object: route_to_islet_waters, into_object: {prop: zone_toward_mainland}}

  # 空の海。目印が何も無いので、航路を見つけるのに最も見張りを重ねることになる。
  # **最短の航路はここを通る**——渡る時間は最も短く、拾えるものは何も無い。
  open_water:
    singleton: true
    traits: [location, explorable, sea_zone]
    props:
      ambient_brightness: {value: 0}
      zones_to_mainland: {value: 6}
      barren_find: {value: 100}
      zone_toward_mainland: {value: {object: wreck_waters}}
      zone_toward_island: {value: {object: islet_waters}}
      exploration_progress:
        value: 0
        range: {min: 0, max: 5}
        on_max:
          conditions:
            - not: {slot: fixtures, matches: {object: route_to_wreck_waters}}
          spawn:
            - {object: route_to_wreck_waters, into: self}
            - {object: route_to_open_water, into_object: {prop: zone_toward_mainland}}

  # 沈船の海。折れた帆柱と綱が漂い、まれに船が積んでいた物が浮いてくる。
  wreck_waters:
    singleton: true
    traits: [location, explorable, sea_zone]
    props:
      ambient_brightness: {value: 0}
      zones_to_mainland: {value: 5}
      # 1周回に0〜1個（ContentSkeleton.md 7節）。見張り4回で当たるのは2割ほど。
      wreck_find: {value: 5}
      flotsam_find: {value: 15}
      barren_find: {value: 80}
      zone_toward_mainland: {value: {object: long_swell}}
      zone_toward_island: {value: {object: open_water}}
      exploration_progress:
        value: 0
        range: {min: 0, max: 4}
        on_max:
          conditions:
            - not: {slot: fixtures, matches: {object: route_to_long_swell}}
          spawn:
            - {object: route_to_long_swell, into: self}
            - {object: route_to_wreck_waters, into_object: {prop: zone_toward_mainland}}

  # うねりの海（空の海）。大きなうねりだけが続く。
  #
  # **ここで航路が二手に分かれる**（GameEndings.md 12.3節）——流れ藻の海へ直に渡る近道（1区間）と、
  # 沖の潮目・黒い岩礁を回る遠回り（3区間）。**見張り切ると2本とも現れる**ので、渡る前にどちらも
  # 盤面に出ている。見張りの進み具合は1つしか無いので、片方を先に見せるには別のつまみが要る。
  long_swell:
    singleton: true
    traits: [location, explorable, sea_zone]
    props:
      ambient_brightness: {value: 0}
      zones_to_mainland: {value: 4}
      barren_find: {value: 100}
      # 本土の側の隣が2つある（分かれ道なので）。**近道と遠回りの違いは、この2本の行き先だけ。**
      zone_toward_mainland: {value: {object: drifting_kelp}}
      zone_toward_mainland_detour: {value: {object: outer_tide_rip}}
      zone_toward_island: {value: {object: wreck_waters}}
      exploration_progress:
        value: 0
        range: {min: 0, max: 5}
        on_max:
          conditions:
            - not: {slot: fixtures, matches: {object: route_to_drifting_kelp}}
            - not: {slot: fixtures, matches: {object: route_to_outer_tide_rip}}
          spawn:
            - {object: route_to_drifting_kelp, into: self}
            - {object: route_to_long_swell, into_object: {prop: zone_toward_mainland}}
            - {object: route_to_outer_tide_rip, into: self}
            - {object: route_to_long_swell, into_object: {prop: zone_toward_mainland_detour}}
      # 遠回りの側の1本を足すために卓を書き直す（sea_zone の storm_drift）。**同じ重みで並ぶ**ので、
      # 近道と遠回りのどちらへ流されるかは荒天が決める。
      storm_drift:
        on_max:
          set: {self: {storm_drift: 0}}
          pick:
            - weight: {prop: drift_to_mainland_weight}
              among: {slot: fixtures, matches: {object: raft}}
              move: {subject: picked, to_object: {prop: zone_toward_mainland}}
              signal: {picked: swept}
            - weight: {prop: drift_to_mainland_weight}
              among: {slot: fixtures, matches: {object: raft}}
              move: {subject: picked, to_object: {prop: zone_toward_mainland_detour}}
              signal: {picked: swept}
            - weight: {prop: drift_to_island_weight}
              among: {slot: fixtures, matches: {object: raft}}
              move: {subject: picked, to_object: {prop: zone_toward_island}}
              signal: {picked: swept}

  # 沖の潮目。島影の無い沖でも、流れのぶつかる帯には魚が集まる。**遠回りの側の入口**で、うねりの海
  # （4）より遠い5なのは、ここを通ると本土まで2区間ぶん長くなるから（zones_to_mainland）。
  outer_tide_rip:
    singleton: true
    traits: [location, explorable, sea_zone]
    props:
      ambient_brightness: {value: 0}
      zones_to_mainland: {value: 5}
      shoal_find: {value: 80, base: {subject: agent, prop: quarry_sense}}
      barren_find: {value: 20}
      zone_toward_mainland: {value: {object: black_reef}}
      zone_toward_island: {value: {object: long_swell}}
      exploration_progress:
        value: 0
        range: {min: 0, max: 3}
        on_max:
          conditions:
            - not: {slot: fixtures, matches: {object: route_to_black_reef}}
          spawn:
            - {object: route_to_black_reef, into: self}
            - {object: route_to_outer_tide_rip, into_object: {prop: zone_toward_mainland}}

  # 黒い岩礁。水面すれすれの黒い瀬が続く。
  black_reef:
    singleton: true
    traits: [location, explorable, sea_zone]
    props:
      ambient_brightness: {value: 0}
      zones_to_mainland: {value: 4}
      flotsam_find: {value: 35}
      shoal_find: {value: 20, base: {subject: agent, prop: quarry_sense}}
      barren_find: {value: 45}
      zone_toward_mainland: {value: {object: drifting_kelp}}
      zone_toward_island: {value: {object: outer_tide_rip}}
      exploration_progress:
        value: 0
        range: {min: 0, max: 3}
        on_max:
          conditions:
            - not: {slot: fixtures, matches: {object: route_to_drifting_kelp}}
          spawn:
            - {object: route_to_drifting_kelp, into: self}
            - {object: route_to_black_reef, into_object: {prop: zone_toward_mainland}}
      # 岩礁（reef_shallows と同じ役割）。
      storm_drift:
        range: {min: 0, max: 8}

  # 流れ藻の海（海藻の帯）。ちぎれた海藻が筋になって漂う。**二手に分かれた航路はここで合流する**
  # ——近道（うねりの海から直に）と遠回り（黒い岩礁から）の両方から航路が立つ。
  drifting_kelp:
    singleton: true
    traits: [location, explorable, sea_zone]
    props:
      ambient_brightness: {value: 0}
      zones_to_mainland: {value: 3}
      seaweed_find: {value: 55}
      barren_find: {value: 45}
      zone_toward_mainland: {value: {object: white_rock}}
      # 島の側の隣が2つある（合流点なので）。近道で来た側と、遠回りで来た側。
      zone_toward_island: {value: {object: long_swell}}
      zone_toward_island_detour: {value: {object: black_reef}}
      exploration_progress:
        value: 0
        range: {min: 0, max: 3}
        on_max:
          conditions:
            - not: {slot: fixtures, matches: {object: route_to_white_rock}}
          spawn:
            - {object: route_to_white_rock, into: self}
            - {object: route_to_drifting_kelp, into_object: {prop: zone_toward_mainland}}
      # 遠回りの側の1本を足すために卓を書き直す（sea_zone の storm_drift）。**同じ重みで並ぶ**ので、
      # 荒天がどちらの経路へ押し戻すかは選べない——近道で来ても、遠回りの側へ戻されることがある。
      storm_drift:
        on_max:
          set: {self: {storm_drift: 0}}
          pick:
            - weight: {prop: drift_to_mainland_weight}
              among: {slot: fixtures, matches: {object: raft}}
              move: {subject: picked, to_object: {prop: zone_toward_mainland}}
              signal: {picked: swept}
            - weight: {prop: drift_to_island_weight}
              among: {slot: fixtures, matches: {object: raft}}
              move: {subject: picked, to_object: {prop: zone_toward_island}}
              signal: {picked: swept}
            - weight: {prop: drift_to_island_weight}
              among: {slot: fixtures, matches: {object: raft}}
              move: {subject: picked, to_object: {prop: zone_toward_island_detour}}
              signal: {picked: swept}

  # 白い岩（海鳥の岩）。糞で白く染まった岩で、遠くからでもそれと分かる。ここも上陸できる。
  white_rock:
    singleton: true
    traits: [location, explorable, sea_zone]
    props:
      ambient_brightness: {value: 0}
      zones_to_mainland: {value: 2}
      egg_find: {value: 35}
      seabird_find: {value: 20, base: {subject: agent, prop: quarry_sense}}
      barren_find: {value: 45}
      zone_toward_mainland: {value: {object: mainland_shallows}}
      zone_toward_island: {value: {object: drifting_kelp}}
      exploration_progress:
        value: 0
        range: {min: 0, max: 3}
        on_max:
          conditions:
            - not: {slot: fixtures, matches: {object: route_to_mainland_shallows}}
          spawn:
            - {object: route_to_mainland_shallows, into: self}
            - {object: offshore_islet, into: self}
            - {object: route_to_white_rock, into_object: {prop: zone_toward_mainland}}

  # 本土の島影（沿岸）。本土の陸が見え始める海区で、島影の海と同じだけ実る。ここから本土へ渡る。
  mainland_shallows:
    singleton: true
    traits: [location, explorable, sea_zone]
    props:
      ambient_brightness: {value: 0}
      zones_to_mainland: {value: 1}
      driftwood_find: {value: 30}
      seaweed_find: {value: 25}
      shoal_find: {value: 25, base: {subject: agent, prop: quarry_sense}}
      barren_find: {value: 20}
      # 本土側の端なので、本土の側に**海区は**無い（zone_toward_mainland を持たない）。**到達は本土へ
      # 移ることそのもの**（Voyage.md 4節）で、そこへ渡らせるのは航路であって荒天ではない。
      zone_toward_island: {value: {object: white_rock}}
      exploration_progress:
        value: 0
        range: {min: 0, max: 2}
        # 本土に着けば周回が終わるので、折り返しの1本は立てない（本土に航路は無い）。
        on_max:
          conditions:
            - not: {slot: fixtures, matches: {object: route_to_mainland}}
          spawn:
            - {object: route_to_mainland, into: self}

  # ------------------------------------------------------------------
  # 航路。海区どうしを繋ぐ1本で、地上の道（locations.yamlのpath）と同じ設置物。渡る手そのものは
  # sea_route trait（このファイルの先頭）が1箇所で持ち、**型ごとに書くのは行き先だけ**。
  #
  # **行き先ごとに型を分けるのは、行き先が型の名前そのものだから。** 海区は自分に立てる航路を
  # `route_to_<行き先>` と名指して湧かせ、既に立っているかもその名前で見る（exploration_progress の
  # on_max）ので、行き先の数だけ名前が要る。**渡す手はその名前を見ない**ので、型の数だけは要らない。
  #
  # **島の側へ戻る航路も、ここに並ぶ型そのもの**（GameEndings.md 12.5節）。航路が持つのは行き先だけで
  # 向きを持たないので、1つ戻る航路は隣の海区が進む先として使っている型と同じものになる。島の端の
  # 2本（route_to_coastal_waters・route_to_shore）だけが、進む側に相手を持たないぶん新しい。
  # ------------------------------------------------------------------

  # 島の海岸へ戻る航路（出航した先の海区に現れる）。**島側の端で、この先に海区は無い。**
  #
  # ここだけは行き先が型ではなく個体——**出航した当の海岸**（筏の home_coast_id）を引く。他の航路が
  # 行き先の型を書けるのは相手が singleton の海区だからで、島の海岸は島に何個も在る。岩の海岸からでも
  # 押し出せる筏は、押し出したその海岸へ戻る（砂浜が1つも無い島でも戻れる、Voyage.md 3.5節）。
  # **`destination_zone` を持たず、渡す手も自分で書く1本**（trait の cross を上書きする）。
  #
  # **この1本だけは渡ると消える。** 行き先が筏の覚えている海岸である以上、この航路が意味を持つのは
  # 筏が海に出ている間だけで、岸へ戻った時点で指す先が無くなる。次に出航すればまた立つ（set_sail）
  # ので、出航を何度繰り返しても、出た先の海区に並ぶのは1本のまま。
  route_to_shore:
    traits: [sea_route]
    props:
      # **島は海区の連なりの外**で、鎖の島側の端（島影の海、12）よりさらに向こうにある。どの海岸から
      # 出ていてもこの辺は沖から島へ戻る辺なので、海区が名乗れる最も遠い値（zones_to_mainland の
      # range.max）を書いて、どの海区から見ても本土から遠い側にしておく。**追い風で出た日ほど、戻りは
      # 向かい風で高くつく**（GameEndings.md 12.5節）。
      destination_zones_to_mainland: {value: 30}
    interactions:
      cross:
        trigger: menu
        pick:
          - weight: 1
            among: {subject: parent, slot: fixtures, matches: {object: raft}}
            move: {subject: picked, to: {subject: picked, prop: home_coast_id}}
        destroy: self

  route_to_coastal_waters:
    traits: [sea_route]
    props:
      destination_zone: {value: {object: coastal_waters}}
      destination_zones_to_mainland: {value: 12}

  route_to_kelp_belt:
    traits: [sea_route]
    props:
      destination_zone: {value: {object: kelp_belt}}
      destination_zones_to_mainland: {value: 11}

  route_to_tide_rip:
    traits: [sea_route]
    props:
      destination_zone: {value: {object: tide_rip}}
      destination_zones_to_mainland: {value: 10}

  route_to_reef_shallows:
    traits: [sea_route]
    props:
      destination_zone: {value: {object: reef_shallows}}
      destination_zones_to_mainland: {value: 9}

  route_to_gull_rock:
    traits: [sea_route]
    props:
      destination_zone: {value: {object: gull_rock}}
      destination_zones_to_mainland: {value: 8}

  route_to_islet_waters:
    traits: [sea_route]
    props:
      destination_zone: {value: {object: islet_waters}}
      destination_zones_to_mainland: {value: 7}

  route_to_open_water:
    traits: [sea_route]
    props:
      destination_zone: {value: {object: open_water}}
      destination_zones_to_mainland: {value: 6}

  route_to_wreck_waters:
    traits: [sea_route]
    props:
      destination_zone: {value: {object: wreck_waters}}
      destination_zones_to_mainland: {value: 5}

  route_to_long_swell:
    traits: [sea_route]
    props:
      destination_zone: {value: {object: long_swell}}
      destination_zones_to_mainland: {value: 4}

  route_to_outer_tide_rip:
    traits: [sea_route]
    props:
      destination_zone: {value: {object: outer_tide_rip}}
      destination_zones_to_mainland: {value: 5}

  route_to_black_reef:
    traits: [sea_route]
    props:
      destination_zone: {value: {object: black_reef}}
      destination_zones_to_mainland: {value: 4}

  route_to_drifting_kelp:
    traits: [sea_route]
    props:
      destination_zone: {value: {object: drifting_kelp}}
      destination_zones_to_mainland: {value: 3}

  route_to_white_rock:
    traits: [sea_route]
    props:
      destination_zone: {value: {object: white_rock}}
      destination_zones_to_mainland: {value: 2}

  route_to_mainland_shallows:
    traits: [sea_route]
    props:
      destination_zone: {value: {object: mainland_shallows}}
      destination_zones_to_mainland: {value: 1}

  route_to_mainland:
    traits: [sea_route]
    props:
      destination_zone: {value: {object: mainland}}
      destination_zones_to_mainland: {value: 0}

  # 本土。着いた時点で周回が終わる場所で、着いた後のことは描かない（GameEndings.md 3節）。
  # 世界に1つだけ在り、最後の海区から航路を渡ったときだけ、そこへ移る。
  mainland:
    singleton: true
    traits: [location]
    tags: [mainland]
    props:
      # 着いた後を描かない場所だが、場所である以上は明るさを名乗る。開けた土地と同じ。
      ambient_brightness: {value: 0}
