# 元船長。長い航海で水の配分と当直の眠気に慣れているが、蓄えは基準よりやや薄い。
# 各プロパティの意味・値の刻み方は docs/world/Characters.md 参照。

object_defs:
  captain:
    singleton: true
    traits: [player_character]
    slots:
      hand: {cell_count: 6}
    props:
      # 胃の中身（docs/engine/DigestionSystem.md 3節）。食べた物はまずここへ入り、腸へ送られてから
      # 体脂肪になる。maxが胃の大きさで、基準どおり8時間ぶん（32）を一度に詰め込める。
      #
      # **溜まっているほど速く出す。** 現実の胃排出が残量におよそ比例するのを段の階段で近似したもので、
      # 絞りすぎて溜まり続けることが起きない。段は満腹感（player_character trait）も押し上げる。
      #
      # 満杯の段fullはmaxちょうどではなく3/4に置く——残りは最後の一口があふれる余地で、
      # eatはこの段の名前で「もう食べられない」を見る（同2節）。初期値は最後の食事から数時間の位置で、
      # 腸（trait側）と合わせて満腹感が留意域から始まる（Characters.md 域の区分節）。
      # 限られた水で保たせる術が身についており、満水から3日半（336 tick）。
      # 尽きれば渇きで死ぬ。on_minが既定のクランプを置き換えるので、0を割った値はそのまま残り、
      # 死因（どの段で尽きたか）を後から読める（VitalsSystem.md 6節）。
      hydration:
        tags: [status, nutrition]
        value: 252
        range: {min: 0, max: 336}
        on_min:
          destroy: self
        stages:
          - {name: dehydrated, alert: fatal}
          - {name: parched, min: 24, alert: danger}
          - {name: thirsty, min: 96, alert: caution}
          - {name: dryish, min: 192, alert: watch}
          - {name: hydrated, min: 269}
          - {name: full, min: 336}
        passives:
          - add:
              self:
                hydration: -1
      # 体脂肪（docs/engine/DigestionSystem.md 4節）。腸から届いた分が積み上がり、基礎代謝で減る。
      # 尽きれば飢えで死ぬ（VitalsSystem.md 8節）。maxは最大限に肥えた状態から絶食で保つtick数。
      #
      # **減る速さを体格の段で変える。** 太っているほど基礎代謝が大きいので、食べ過ぎても際限なく
      # 太らない平衡点になる。1日に要る量の個体差（標準体格で96単位）はここに出る。
      body_fat:
        tags: [nutrition]
        value: 1320
        range: {min: 0, max: 5280}
        on_min:
          destroy: self
        stages:
          # 蓄えが尽きる域（残り1日ぶんを割った位置）。この段の名前が餓死の死因になる。
          - name: starved
            alert: fatal
            passives:
              - add: {self: {body_fat: -0.5}}
          - name: gaunt
            min: 88
            passives:
              - add: {self: {body_fat: -0.7}}
          - name: nourished
            min: 440
            passives:
              - add: {self: {body_fat: -1}}
          - name: stout
            min: 2640
            passives:
              - add: {self: {body_fat: -1.3}}
          - name: obese
            min: 3960
            passives:
              - add: {self: {body_fat: -1.6}}
      # 当直で刻む睡眠に慣れており、意識を保っていられるのは54時間（216 tick）。
      wakefulness:
        tags: [status, health]
        value: 216
        range: {min: 0, max: 216}
        stages:
          - {name: overtired, alert: danger}
          - {name: sleepy, min: 12, alert: caution}
          - {name: yawning, min: 48, alert: watch}
          - {name: rested, min: 173}
        passives:
          - add:
              self:
                wakefulness: -1
      # 甲板仕事で保った、基準どおりの体力。
      stamina:
        tags: [status, health]
        value: 100
        range: {min: 0, max: 100}
        stages:
          - {name: exhausted, alert: danger}
          - {name: tired, min: 20, alert: caution}
          - {name: winded, min: 60, alert: watch}
          - {name: fresh, min: 80}
      # 甲板仕事で担ぎ慣れた、基準どおりの持てる量。持ち物の重さ（g）は中身から導出されるので、valueは0のまま
      # （ContainerSystem.md 2節）。増える側が悪いプロパティなので、段はmaxからの割合で刻む
      # （docs/world/Characters.md）。
      load:
        tags: [status, health]
        value: 0
        range: {min: 0, max: 30000}
        stages:
          - {name: light}
          - {name: laden, min: 7500, alert: watch}
          - {name: heavy, min: 15000, alert: caution}
          - {name: too_heavy, min: 25000, alert: danger}
