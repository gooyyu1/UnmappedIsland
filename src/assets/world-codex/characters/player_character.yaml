# プレイヤーキャラクタに共通の骨組み。個体差を持つプロパティ（満腹度・水分・体脂肪・覚醒度・体力）は
# ここに置かず、キャラクタごとのファイル（同じディレクトリの1キャラ1ファイル）へ全部書く。
# 何を持っていなければならないか・各値の意味と刻み方は docs/world/Characters.md 参照。

traits:
  player_character:
    # 土地のcharactersスロットの枠が受け入れる型（core.yaml）。プレイヤーが操作するキャラクタだけが
    # 持つタグで、操作できない生物は持ち運べるならitem・持ち運べないならfixtureで表す。
    tags: [character]
    # 休息（docs/world/Characters.md 休息節）。4つの違いは長さと回復量だけで、眠るものだけが
    # 眠気（wakefulness）も戻す。1時間あたりの回復量を長いものほど大きくしてあるので、
    # 同じ6時間でも仮眠2回より睡眠1回のほうが多く戻る。
    #
    # 眠っている間も覚醒度は減り続ける（-1/tick）ため、実質の回復は経過ぶんを引いた値になる
    # ——睡眠は+96-24で18時間ぶん、仮眠は+36-12で6時間ぶん。睡眠1回では満タンに届かない。
    #
    # 身体の仕組みなので個体差を持たせず、この trait が配る（痛み・血と同じ扱い）。回復量は
    # 一律なので、体力のmaxが大きいキャラクタほど1回の休息で戻る割合は小さい。
    interactions:
      wait:
        trigger: menu
        duration: 15
        add: {self: {stamina: 2}}
      rest:
        trigger: menu
        duration: 60
        add: {self: {stamina: 10}}
      nap:
        trigger: menu
        duration: 180
        add: {self: {stamina: 36, wakefulness: 36}}
      sleep:
        trigger: menu
        duration: 360
        add: {self: {stamina: 90, wakefulness: 96}}
    # 外から見えるもの（7.11節）。**手持ちは入れない**——レーンに出ているので、タブにも出すと
    # 同じ札が画面に2枚出る（Windows.md 1.1節）。
    visible_slots: [equipment, injuries]
    slots:
      # 手持ち。枠数はキャラクタごとに決める（cell_count）。数を決めると持ち替えても枠の位置が
      # 動かない（ScreenLayout.md 7.3節・SlotSystem.md 3節）。
      hand:
        cell: {accept: {tag: item}}
      # 身につけているもの。枠数の上限はまだ決めていないため前詰めスロットにする（子ウィンドウ側は
      # はみ出した分を横スクロールで送る、Windows.md 1節 スロットの子ウィンドウ）。
      # 受け入れるのは身につけられることを名乗る物だけ（equippable、clothing.yaml）。
      # 上限の無いスロットなので、自動配置（7.7節）から外さないと、手持ちが埋まった時に作った衣類が
      # ここへ流れ込む（手元でクラフトした物が身につくことになる）。
      equipment:
        cell: {accept: {tag: equippable}}
        placement: [manual]
      # 怪我。プレイヤーが任意に出し入れするものではなく、ワールド側の効果だけが付け外しする
      # （UIからの移動・並び替えを許さない、Windows.md 2節）。中身はinjuries.yaml。
      injuries:
        cell: {accept: {tag: injury}}
    props:
      # 今感じている痛み。自分では動かず、外から負った怪我（injuries.yaml）と、内側の不調を表す段
      # （ビタミンのscurvy段）がmodifyで押し上げるので、valueは0のまま。増える側が悪いプロパティ
      # なので、段はmaxからの割合で刻む（docs/world/Characters.md）。
      #
      # **幸福度を削るのはこの段だけ**（docs/world/Characters.md 幸福度節）。怪我・壊血病・脂の欠乏は
      # どれも痛みへ合流しているので、ここから1本引くだけで内側の不調が残らず心へ届く。
      # 1段上がるごとに倍で、1日（96 tick）あたり-12・-24・-48。
      pain:
        tags: [status, health]
        value: 0
        range: {min: 0, max: 100}
        stages:
          - {name: painless}
          - name: sore
            min: 25
            alert: watch
            passives:
              - add: {self: {happiness: -0.125}}
          - name: hurting
            min: 50
            alert: caution
            passives:
              - add: {self: {happiness: -0.25}}
          - name: unbearable
            min: 83
            alert: danger
            passives:
              - add: {self: {happiness: -0.5}}
      # 行動の可否を決める2つの明るさ（docs/engine/IlluminationSystem.md 2節）。身体の仕組みでは
      # ないが、どのキャラクタでも同じなので、痛み・血と同じくこの trait が配る。
      #
      # **手元は場所の手元を継ぐ**ので、地面や炉に据えた光源も入る。**視界は場所の環境光を継ぐ**
      # ので、据えた光源は入らない——持ち歩ける明かりだけが道に付いてくる（同3節）。
      # どちらへも、持っている光源が自分の子として届く。
      #
      # **しきい値を持つのはこの2つのstagesだけで、条件の側は段の名前で見る**
      # （docs/engine/IlluminationSystem.md 5節）。行動が見るのはキャラクタ側の2つ（同2節）なので、
      # 場所の hand_brightness には段を置かない——誰も段の名前では読まないため。
      # 2つが同じ3段の名前を持つのは、同じEVスケールを同じ底（-6）から測っているから。境目は
      # 別々で、片方を動かすとそのプロパティを見る行動だけが動く——bright が手元は+5、視界は+3
      # なのは、屋外で採るのに要る明るさが、縫うのに要る明るさより低いため。
      #
      # 段が名乗る situation は状況アイコン（docs/ui/ScreenLayout.md 4.1.1節）。**手元は2段で同じ絵**
      # ——手元の作業に要るのは bright だけで、その下は「作れない」の一言に尽きる。視界は線が2本
      # （dim で採れなくなり、pitch_dark で歩けなくなる）なので、そちらだけ絵が分かれる。
      hand_brightness:
        value: 0
        base: {subject: ancestor, prop: hand_brightness}
        stages:
          - {name: pitch_dark, situation: too_dark_for_handwork}
          - {name: dim, min: -5, situation: too_dark_for_handwork}
          - {name: bright, min: 5}
      looking_brightness:
        value: 0
        base: {subject: ancestor, prop: ambient_brightness}
        stages:
          - {name: pitch_dark, situation: no_road}
          - {name: dim, min: -5, situation: too_dark_outside}
          - {name: bright, min: 3}
      # 雨や日差しから守られているか（docs/engine/ContainerSystem.md 6節）。**場所が持つ事実を映す**
      # ので、値は祖先から継ぐだけで自分では動かさない（上の明るさと同じ形）。
      #
      # **段を持つのはキャラクタ側だけ。** 守る側（浅い洞窟・将来の屋根）は今までどおり sheltered: 1 を
      # 宣言するだけでよく、状況アイコンを出すための宣言をそれぞれが覚えている必要が無い。
      sheltered:
        value: 0
        base: {subject: ancestor, prop: sheltered}
        stages:
          - name: sheltered
            min: 1
            situation: sheltered
            passives:
              # 屋根の下では風雨が当たらない（docs/world/ContentSkeleton.md 8.1.4節）。**採取の側は
              # 屋外かどうかを知らなくてよい**——止めているのは風雨そのものなので、屋根はその値を
              # 落とすだけでよい。引く量はいちばん強い嵐の風速で、下のrangeの底が余りを切る。
              - modify:
                  self:
                    wind_speed: -20
      # その身に当たっている風の強さ（m/s。docs/world/ContentSkeleton.md 8.1.5節）。**嵐の日に屋外の
      # 採取を止めているのはこの値**で、暗さではない（同8.1節）。値は上の明るさ・shelteredと同じく
      # 祖先から継ぐだけで、自分では動かさない——動かすのは屋根（上のstages）だけ。
      #
      # **境目を持つのはこのstagesだけ**で、条件の側は段の名前で見る（明るさと同じ形）。galeの
      # 17.2 m/sは台風の風速の定義（ビューフォート風力階級8の下限）そのもので、weatherの7段のうち
      # これを超えるのは嵐だけ。
      wind_speed:
        value: 0
        base: {subject: ancestor}
        range: {min: 0, max: 20}
        stages:
          - {name: calm}
          - {name: gale, min: 17.2}
      # 体重（g）。**筏に乗れば積載として効く**（voyage.yaml）ので、担ぐ側も担がれる側になる。
      # 血液量が体重のおよそ1/13という下の関係から、5,000mLはちょうど65kgにあたる。個体差は
      # まだ持たせず、血と同じくこの trait が配る。
      weight: {value: 65000}
      # 歩みの遅さの倍率（docs/world/Characters.md 荷重の効き方節）。素は1（等倍）で、担いでいる荷が
      # 重いほど、自分のloadの段がmodifyで押し上げる。道のtravelがdurationでtravel_minutesへ掛ける
      # ので、**長い道ほど遅れも大きい**——遅れの量を道ごとに書かずに済む。
      #
      # 荷の重さがどれだけ効くかは段の側（キャラクタごとのload）が持つので、ここは素の値だけ。
      # 身体の仕組みなので個体差を持たせず、痛み・血と同じくこの trait が配る。
      pace: {value: 1}
      # 体に残っている血（docs/engine/VitalsSystem.md 3節）。maxが体格そのもので、ヒトは体重の
      # およそ1/13。痛みと同じく身体の仕組みなので個体差を持たせず、この trait が配る。
      #
      # **自分で作り直す唯一のステータス**（+2/tick ＝ 1日およそ200mL、赤血球が作られる実際の速さ）。
      # 削るのは出血する怪我（injuries.yaml）で、削られるのは一瞬でも戻るのは桁違いに遅い
      # ——失った1,000mLが戻るのに5日かかる。
      #
      # 段は失った割合で刻む（出血性ショックの分類）。2割までが安全域なので、
      # docs/world/Characters.md の「maxの80%で安全域を外れる」とそのまま一致する。
      #
      # **尽きれば失血死する**（VitalsSystem.md 3節）。死因を名乗るのは消す宣言
      # （destroyのreason、9.3節）で、残った値からは推測しない（同6節）。
      #
      # 意識への寄与（VitalsSystem.md 3節）はまだ書かない。キャラクタは consciousness を持たず
      # （同7節）、気を失った手番をどう飛ばすかも決まっていない（同6節）。
      blood:
        tags: [status, health]
        value: 5000
        range: {min: 0, max: 5000}
        stages:
          - {name: exsanguinated, alert: fatal}
          - {name: hemorrhaging, min: 2000, alert: danger}
          - {name: bled, min: 3000, alert: caution}
          - {name: low, min: 3500, alert: watch}
          - {name: replete, min: 4000}
        on_min:
          destroy: {subject: self, reason: exsanguinated}
        passives:
          # **戻るのは水分と体脂肪がともに安全域にある間だけ**（VitalsSystem.md 3.1節）。深手を負った後の
          # 5日は、水と食べ物を切らさずに過ごした5日でなければならない。
          #
          # 判定は段の名前で行い、**閾値を条件の側へ書き写さない**——域（alert）そのものを条件から読む術が
          # 無いので、安全域の段をanyで束ねる。獣の側もまったく同じ形（animals.yaml）で、渇きと飢えを
          # 人と獣の両方が持つことが、この1つの宣言を両方へ配れるようにしている（同節）。
          - conditions:
              - any:
                  - {prop: hydration, in_stage: hydrated}
                  - {prop: hydration, in_stage: full}
              - any:
                  - {prop: body_fat, in_stage: gaunt}
                  - {prop: body_fat, in_stage: nourished}
                  - {prop: body_fat, in_stage: stout}
                  - {prop: body_fat, in_stage: obese}
            add:
              self:
                blood: 2
      # 体に残っている熱（docs/engine/VitalsSystem.md 8.3節）。**単位はkcal**で、maxが体格そのもの
      # ——深部体温37℃から心臓が止まる25℃までに失える熱。血と同じく個体差を持たせず、この trait が配る。
      #
      # **尽きれば凍死する**（4本目の死に方、同8節）。段の境目は深部体温で置いてある
      # （175=28℃・350=31℃・560=34.6℃）。
      #
      # **寒いかどうかは、気温と下のchill_pointの比較1つで決まる。** 火は気温の側を上げ、衣服・寝床は
      # 境目の側を下げる（同8.3節）ので、防ぐ手段がどれだけ増えてもこの3ブロックは増えない。
      # 雨は気温ではなく削る速さに効く——濡れた体から熱が抜けるのは空気の温度の話ではないため。
      warmth:
        tags: [status, health]
        value: 700
        range: {min: 0, max: 700}
        stages:
          - {name: frozen, alert: fatal}
          - {name: hypothermic, min: 175, alert: danger}
          - {name: shivering, min: 350, alert: caution}
          - {name: chilled, min: 560, alert: watch}
          - {name: warm, min: 700}
        on_min:
          destroy: {subject: self, reason: frozen}
        passives:
          # 寒い所に居る間の削り。雨に打たれていなければこちら。
          - conditions:
              - {subject: ancestor, prop: ambient_temperature, lt: {prop: chill_point}}
              - any:
                  - {prop: sheltered, gte: 1}
                  # 天候の概念を持たない祖先の下では「降っていない」に倒れる否定形で書く（14.1節）。
                  - {subject: ancestor, prop: weather, not_in: [light_rain, heavy_rain, storm]}
            add: {self: {warmth: -2}}
          # 屋根も蓋も無い所で雨に打たれている間（docs/engine/ContainerSystem.md 6節）。
          - conditions:
              - {subject: ancestor, prop: ambient_temperature, lt: {prop: chill_point}}
              - {prop: sheltered, eq: 0}
              - {subject: ancestor, prop: weather, in: [light_rain, heavy_rain, storm]}
            add: {self: {warmth: -6}}
          # 境目より上に居る間は戻る。**血と違って熱は取り返せる**ので、凍死は「一晩をどう越すか」の
          # 死に方になる——濡れた一晩（48 tick）で失う288 kcalが、火のそばの9時間で戻る。
          - conditions:
              - {subject: ancestor, prop: ambient_temperature, gte: {prop: chill_point}}
            add: {self: {warmth: 8}}
      # 寒さの入口（docs/engine/VitalsSystem.md 8.3節）。これを下回る気温の場所に居る間だけ、
      # 上のwarmthが削られる。
      # 素は16℃で、衣服・寝床が入ればそれらがmodifyで押し下げる。
      chill_point: {value: 16}
      # 満腹感（docs/engine/DigestionSystem.md 2節）。**単位はmL——胃に入っているかさそのもの**で、
      # エネルギーではない。食べたかさぶん増え、tickで減る。
      #
      # 「これ以上食べられない」もここが持つ（段full）。fullをmaxではなく6割に置いてあるのは、
      # 最大の食料（600mL）を足しても溢れないようにするため——溢れた分は捨てられる（同2節）。
      #
      # 感じ方に個体差は持たせず、この trait が配る。減りは一定で、1日1,536mL（3食×512mL）が
      # ちょうど食べる量と釣り合う。
      satiety:
        tags: [status, nutrition]
        value: 300
        range: {min: 0, max: 1500}
        stages:
          - {name: starving, alert: danger}
          - {name: hungry, min: 50, alert: caution}
          - {name: peckish, min: 200, alert: watch}
          - {name: fed, min: 400}
          - {name: full, min: 900}
        passives:
          - add:
              self:
                satiety: -16
      # 体内に残っているエネルギー（同3節）。**単位はtick——1 = 15分ぶんの生命維持**で、
      # 体脂肪と同じ物差し。食べ物が名乗るのはかさ（satiety）とこの3本で、かさと中身は別の数
      # （水気の多い物はかさだけ大きく、生肉はかさの割に身にならない）。
      #
      # 3本を分けているのは、**吸収の速さが違う**ことと、**欠乏したときに起きることが違う**ため
      # （同4節）。在庫がある間は体脂肪へ流れ続け、尽きれば体脂肪が削られる。
      #
      # 身体の仕組みなので個体差を持たせず、この trait が配る。
      carbohydrate:
        tags: [nutrition]
        value: 40
        range: {min: 0, max: 120}
        passives:
          - transfer: {from_prop: carbohydrate, to_prop: body_fat, amount: 2}
      protein:
        tags: [nutrition]
        value: 30
        range: {min: 0, max: 120}
        passives:
          - transfer: {from_prop: protein, to_prop: body_fat, amount: 1}
      # 脂質だけが段を持つ（同7節）。3本のうちここだけ、尽きたときに固有の弊害が出る。
      lipid:
        tags: [nutrition]
        value: 30
        range: {min: 0, max: 120}
        stages:
          # 脂の在庫が尽きた域。境目の1は「15分ぶんも残っていなければ尽きたとみなす」で、
          # 輸送の刻み（0.5）に依らずに読める。壊血病（同4節）と同じ形で、内側の不調を原因の値の段が持つ。
          # **死に方は増えない**——削るのは既にあるhydrationとbody_fatで、終わり方は脱水と餓死のまま
          # （VitalsSystem.md 8節）。statusタグを持たないので、画面に行も増えない。
          - name: fat_starved
            alert: caution
            passives:
              # 余ったたんぱく質は尿素として捨てるしかなく、その排泄に水が要る。水分の保ちが半分になり
              # （-1/tickが-2/tick）、捨てられる分は身にならない。**肉を食べ足すほど悪化する**
              # ——ゲートがたんぱく質の在庫なので、脂の無い肉を足すほど水が減る。
              - conditions: [{prop: protein, gte: 1}]
                add: {self: {hydration: -1, protein: -2}}
              # 必須脂肪酸の欠乏（肌が荒れ、傷が治らない）。modifyなので可逆——脂を摂って段を抜ければ
              # その場で引く。壊血病の60に対して半分。
              - modify: {self: {pain: 30}}
          - {name: stocked, min: 1}
        passives:
          - transfer: {from_prop: lipid, to_prop: body_fat, amount: 0.5}
      # 体内のビタミン（同4節）。**単位はmg——ビタミンC相当**で、エネルギーの3本とは物差しが違う。
      # 葉物はエネルギーをほとんど持たないので、エネルギーの在庫にすると常に0に張り付き、
      # 「食べていない」と区別が付かない。だから量を別に持つ。
      #
      # ヒトのプールは飽和で約1,500mg、300mgを割ると壊血病が出る。代謝回転は1日およそ48mg。
      #
      # **壊血病は、この値の一番下の段が持つ**（同4節）。怪我のカードは作らない——身体の外から
      # 負ったものだけを怪我にする（docs/concept/DesignPrinciples.md）。
      #
      # 段の境目は現実の量で置く。壊血病が出るのは300mgを割ったときで、残りは1日48mgの回転から
      # 読める日数（1,200＝残り25日で安全域を外れる80%規約、600＝残り12.5日）。
      vitamin:
        tags: [status, nutrition]
        value: 900
        range: {min: 0, max: 1500}
        stages:
          # 壊血病。古傷が開き、歯が抜ける。痛みは刺し傷・牙の傷と並ぶ60で、この島で最も重い段。
          # modifyなので可逆——葉物を食べて段を抜ければ、その場で引く。
          - name: scurvy
            alert: danger
            passives:
              - modify:
                  self:
                    pain: 60
          - {name: deficient, min: 300, alert: caution}
          - {name: waning, min: 600, alert: watch}
          - {name: replete, min: 1200}
        passives:
          - add:
              self:
                vitamin: -0.5
      # 幸福度（docs/world/Characters.md 幸福度節）。**メンタルの不調を代表する1本**で、ストレス・退屈・
      # 孤独をそれぞれ値にはしない（docs/concept/DesignPrinciples.md）。**現実の単位が無い**ので
      # （痛み・体力と同じ抽象の0〜100）、確かめられるのは大小の関係だけ。
      #
      # **押し引きはすべてadd。** modifyを1本も刺さないので実効値が実体値と一致し、0に達したときの
      # 強制休息をon_minで書ける（まだ入っていない）。意味の面でも、効くのは「快適な寝床で寝た今夜」で
      # あって寝床を持っていること自体ではない。
      #
      # **上げるのは口にした物だけ**（各eatのベース値）で、**下げるのは痛みの段だけ**（上のpain）。
      # 時間そのものから生える圧（ホームシック）・寝床や住居からの寄与・免疫への寄与は、まだ入って
      # いない。増える側が良い値なので、段は下から上へ深刻さが下がる並び（血・熱と同じ形）。
      #
      # 感じ方の個体差はまだ持たせず、痛み・血と同じくこの trait が配る。
      happiness:
        tags: [status, health]
        value: 75
        range: {min: 0, max: 100}
        stages:
          - {name: miserable, alert: danger}
          - {name: dejected, min: 20, alert: caution}
          - {name: glum, min: 50, alert: watch}
          - {name: content, min: 80}
      # ------------------------------------------------------------------
      # 腕前（docs/engine/SkillSystem.md、粒度と一覧は docs/world/Skills.md 2節）。レシピの解放条件は
      # 段の名前で読む（同4節）ので、境目を条件の側へ書き写さない。
      #
      # **段は11本で共通**（0/20/60/180。4段・比3で、SkillSystem.md 6節の目安そのまま）。本ごとに
      # 境目を変えると、同じ`basic`が本ごとに違う遠さになり、連言で並べた条件（Skills.md 3節）を
      # 読み比べられなくなる。
      #
      # **一番下の段も下端を名乗る**（`min: 0`）。他のプロパティの最下段は受け皿なので下端を書かないが、
      # 腕前は0より下へ行かないうえ、**下端の無い段は段内進捗の区間が定まらずバーが出ない**
      # （docs/ui/StatusArea.md 9節）——素人でいるあいだ、伸びているのに何も動かないことになる。
      #
      # **個体差を持たせない。** 4人とも漂着した素人として始まるので、痛み・血と同じくこの trait が配る。
      #
      # **解放条件の「その段以上」は、段の名前をanyで束ねて書く**（上のbloodの安全域と同じ形）。
      # `in_stage`は今いる段ちょうどの判定なので（GameElementDefinition.md 14.1節）、1つだけ書くと
      # 腕が上がった時点で条件が偽へ戻り、レシピが閉じ直す。境目の数を条件の側へ書き写さないための
      # 形で、tests/world-codex/skillsYaml.test.tsが「上の段でも満たし続ける」ことを見張る。
      #
      # **伸ばすのは実行経路だけ**（同3節の3経路のうち中）。その腕を使う操作が自分の`add`で`agent`へ
      # +2を配る。**量は作業の長さに依らず一律**で、繰り返しの稼ぎを抑えるのは時間のコストだけ
      # （同7節）。発見・集中の2経路は、契機と対価が未決のため持たない（同8節）。
      #
      # **配るのは、Skills.md 2節がその腕の技術として挙げている作業だけ。** 打ち欠く（knap）、繊維を
      # 採って撚って編む（strip・ret・spin・ply・weave）、刃で木を断って削り出す（fell・buck・whittle）、
      # 皮を剥ぐ（butcher）、獲物を獲る（strike・spear_*・catch_seabird）、火を起こす（light）、
      # 保たせる加工（cure）の7組で全部。
      #
      # **出す物がそっくり同じ操作は、同じ腕を同じだけ配る。** 同じ仕事に入口が2つあるということなので
      # （植物繊維はfiber.yamlのstripとcoconut.yamlのret、編んだ葉はweaveとsplit_and_weave）、片方だけに
      # 配ると、**どの島に流れ着いたかが腕の伸びに化ける**。tests/world-codex/skillsYaml.test.tsが、
      # 出す物がそっくり同じ組で揃っていることを見張る。
      #
      # **出す物が重なるだけでは同じ仕事ではない。** 解体（animals.yamlのbutcher、皮革）と漁
      # （voyage.yamlのspear_*、狩猟）はどちらも生肉を出すが、剥ぐ手と突く手は別の腕で、配る腕も違う
      # ——この2つは上の検査の同じ組に入らないし、入れてはいけない。
      #
      # **配らないもの。** 食べる・歩く・休む（身体の動きで、腕は関わらない）。くべる・入れる・据える・
      # 汲む・移す（1手の受け渡し。**量が一律なので、ここへ配ると最も速い伸ばし方になる**——1分の
      # `add_fuel`が1時間の`knap`と同じだけ伸びる）。素材を採るだけの操作（草を刈るfell・葉を採る
      # pick_frond・樹皮を剥ぐstrip_bark・実を割るcrack）。土地を調べるexplore（発見経路そのもので、
      # 未決のまま置いてある）。
      #
      # **伸ばす行動をまだ持たない本がある**（指物・接合、建築、料理、採鉱・製錬）。開ける物が世界に
      # 1つも無く、伸ばす操作の置き場も無いため。**それらは解放条件にも書かない**——書けば永久に
      # 開かないレシピになる（SkillSystem.md 3.2節）。
      # ------------------------------------------------------------------
      # 石を打ち欠く（locations.yamlのknap）。柄付けの刃（tools.yaml）を開ける。
      skill_knapping:
        tags: [skill]
        value: 0
        stages:
          - {name: novice, min: 0}
          - {name: basic, min: 20}
          - {name: skilled, min: 60}
          - {name: expert, min: 180}
      # 掻き取る・撚る・編む（fiber.yaml・weaving.yaml）。編み籠・くくり罠・葉の衣類と、柄付けの紐を開ける。
      skill_cordage:
        tags: [skill]
        value: 0
        stages:
          - {name: novice, min: 0}
          - {name: basic, min: 20}
          - {name: skilled, min: 60}
          - {name: expert, min: 180}
      # 削る・伐る（timber.yamlのfell/buck、animals.yamlのwhittle）。開けるレシピはまだ無い
      # ——木の箱・そり・板（Skills.md 2節）が世界に1つも無い。
      skill_woodwork:
        tags: [skill]
        value: 0
        stages:
          - {name: novice, min: 0}
          - {name: basic, min: 20}
          - {name: skilled, min: 60}
          - {name: expert, min: 180}
      # 削り合わせて組む。伸ばす行動も開ける物もまだ無い（スツール・テーブル・車輪が世界に無い）。
      skill_joinery:
        tags: [skill]
        value: 0
        stages:
          - {name: novice, min: 0}
          - {name: basic, min: 20}
          - {name: skilled, min: 60}
          - {name: expert, min: 180}
      # 住居を建てる。伸ばす行動も開ける物もまだ無い（住居は docs/world/Dwellings.md の検討段階）。
      skill_building:
        tags: [skill]
        value: 0
        stages:
          - {name: novice, min: 0}
          - {name: basic, min: 20}
          - {name: skilled, min: 60}
          - {name: expert, min: 180}
      # 皮を剥ぐ（animals.yamlのbutcher）。なめし革と、それを縫った物（clothing.yaml・voyage.yamlの帆）を開ける。
      skill_leatherwork:
        tags: [skill]
        value: 0
        stages:
          - {name: novice, min: 0}
          - {name: basic, min: 20}
          - {name: skilled, min: 60}
          - {name: expert, min: 180}
      # 調理する。伸ばす行動がまだ無い——焼くのは炉が子のcooking_progressを進めるだけで
      # （docs/engine/FireSystem.md 7節）、人が行う操作になっていない。
      skill_cooking:
        tags: [skill]
        value: 0
        stages:
          - {name: novice, min: 0}
          - {name: basic, min: 20}
          - {name: skilled, min: 60}
          - {name: expert, min: 180}
      # 得た食を保たせる（salt.yamlのcure）。開けるレシピはまだ無い——干し場・燻し場が世界に無い。
      skill_preserving:
        tags: [skill]
        value: 0
        stages:
          - {name: novice, min: 0}
          - {name: basic, min: 20}
          - {name: skilled, min: 60}
          - {name: expert, min: 180}
      # 火を起こす（fire.yamlのlight）。**レシピは開けない**——効き先は着火の重みだけ
      # （docs/engine/FireSystem.md 10節）。
      skill_firecraft:
        tags: [skill]
        value: 0
        stages:
          - {name: novice, min: 0}
          - {name: basic, min: 20}
          - {name: skilled, min: 60}
          - {name: expert, min: 180}
      # 獣を狩る（animals.yamlのstrike）。**レシピは開けない**——開けるのは素材と機会で（Skills.md 2節）、
      # 罠を作るのは繊維・編みの腕（同節のくくり罠）。
      skill_hunting:
        tags: [skill]
        value: 0
        stages:
          - {name: novice, min: 0}
          - {name: basic, min: 20}
          - {name: skilled, min: 60}
          - {name: expert, min: 180}
      # 鉱石を採って製錬する。伸ばす行動も開ける物もまだ無い（青銅器が世界に無い）。
      skill_smelting:
        tags: [skill]
        value: 0
        stages:
          - {name: novice, min: 0}
          - {name: basic, min: 20}
          - {name: skilled, min: 60}
          - {name: expert, min: 180}
