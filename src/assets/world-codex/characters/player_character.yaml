# プレイヤーキャラクタに共通の骨組み。個体差を持つプロパティ（満腹度・水分・体脂肪・覚醒度・体力）は
# ここに置かず、キャラクタごとのファイル（同じディレクトリの1キャラ1ファイル）へ全部書く。
# 何を持っていなければならないか・各値の意味と刻み方は docs/world/Characters.md 参照。

traits:
  player_character:
    # 土地のcharactersスロットの枠が受け入れる型（core.yaml）。プレイヤーが操作するキャラクタだけが
    # 持つタグで、操作できない生物は持ち運べるならitem・持ち運べないならfixtureで表す。
    tags: [character]
    # 休息（docs/world/Characters.md 休息節）。違いは長さと回復量だけで、眠るものだけが
    # 眠気（wakefulness）も戻す。1時間あたりの回復量を長いものほど大きくしてあるので、
    # 同じ6時間でも仮眠2回より睡眠1回のほうが多く戻る。
    #
    # 眠っている間も覚醒度は減り続ける（-1/tick）ため、実質の回復は経過ぶんを引いた値になる
    # ——睡眠は+96-24で18時間ぶん、仮眠は+36-12で6時間ぶん。睡眠1回では満タンに届かない。
    #
    # 身体の仕組みなので個体差を持たせず、この trait が配る（痛み・血と同じ扱い）。回復量は
    # 一律なので、体力のmaxが大きいキャラクタほど1回の休息で戻る割合は小さい。
    interactions:
      wait:
        trigger: menu
        duration: 15
        add: {self: {stamina: 2}}
      rest:
        trigger: menu
        duration: 60
        add: {self: {stamina: 10}}
      nap:
        trigger: menu
        duration: 180
        add: {self: {stamina: 36, wakefulness: 36}}
      sleep:
        trigger: menu
        duration: 360
        add: {self: {stamina: 90, wakefulness: 96}}
      # 限界に達した値が起こす、強制的な時間経過（docs/world/Characters.md 限界節）。どれも上の休息と
      # 同じ形で、**違うのは見る値・長さ・戻る量だけ**。プレイヤーが押す機会は無い
      # （trigger: tick、11.1節）ので、手が出せないまま時間だけが過ぎる。
      #
      # **見るのは「下限に居る間」で、達した瞬間ではない。** 一度で限界を抜けられなければ、次に
      # 時間が動いたときにまた起きる。
      #
      # 起きるのは操作の切れ目で、進行中の操作は中断しない（11.5節）——歩き終わってから倒れる。
      #
      # 戻る量は、その値を戻せる自発の操作に合わせる。眠気を戻せるのは睡眠だけなので、眠り込むのは
      # sleep と同じ中身。体力と幸福度は rest と同じ割（10/時間）で2時間ぶん——倒れ込むのは休み方を
      # 選んだことにならないので、まとめて休んだ割増し（nap・sleep）は付かない。
      collapse:
        trigger: tick
        conditions:
          - {prop: stamina, lte: 0}
        duration: 120
        add: {self: {stamina: 20}}
      fall_asleep:
        trigger: tick
        conditions:
          - {prop: wakefulness, lte: 0}
        duration: 360
        add: {self: {stamina: 90, wakefulness: 96}}
      despair:
        trigger: tick
        conditions:
          - {prop: happiness, lte: 0}
        duration: 120
        add: {self: {happiness: 20}}
    # 外から見えるもの（7.11節）。**手持ちは入れない**——レーンに出ているので、タブにも出すと
    # 同じ札が画面に2枚出る（Windows.md 1.1節）。
    visible_slots: [equipment, injuries]
    slots:
      # 手持ち。枠数はキャラクタごとに決める（cell_count）。数を決めると持ち替えても枠の位置が
      # 動かない（ScreenLayout.md 7.3節・SlotSystem.md 3節）。
      hand:
        cell: {accept: {tag: item}}
      # 身につけているもの。枠数の上限はまだ決めていないため前詰めスロットにする（子ウィンドウ側は
      # はみ出した分を横スクロールで送る、Windows.md 1節 スロットの子ウィンドウ）。
      # 受け入れるのは身につけられることを名乗る物だけ（equippable、clothing.yaml）。
      # 上限の無いスロットなので、自動配置（7.7節）から外さないと、手持ちが埋まった時に作った衣類が
      # ここへ流れ込む（手元でクラフトした物が身につくことになる）。
      equipment:
        cell: {accept: {tag: equippable}}
        placement: [manual]
      # 怪我。プレイヤーが任意に出し入れするものではなく、ワールド側の効果だけが付け外しする
      # （UIからの移動・並び替えを許さない、Windows.md 2節）。中身はinjuries.yaml。
      injuries:
        cell: {accept: {tag: injury}}
    props:
      # 今感じている痛み。自分では動かず、外から負った怪我（injuries.yaml）と、内側の不調を表す段
      # （ビタミンのscurvy段）がmodifyで押し上げるので、valueは0のまま。増える側が悪いプロパティ
      # なので、段はmaxからの割合で刻む（docs/world/Characters.md）。
      #
      # **幸福度を削るのはこの段だけ**（docs/world/Characters.md 幸福度節）。怪我・壊血病・脂の欠乏は
      # どれも痛みへ合流しているので、ここから1本引くだけで内側の不調が残らず心へ届く。
      # 1段上がるごとに倍で、1日（96 tick）あたり-12・-24・-48。
      pain:
        tags: [status, health]
        value: 0
        range: {min: 0, max: 100}
        stages:
          - {name: painless}
          - name: sore
            min: 25
            alert: watch
            passives:
              - add: {self: {happiness: -0.125}}
          - name: hurting
            min: 50
            alert: caution
            passives:
              - add: {self: {happiness: -0.25}}
          - name: unbearable
            min: 83
            alert: danger
            passives:
              - add: {self: {happiness: -0.5}}
      # 行動の可否を決める2つの明るさ（docs/engine/IlluminationSystem.md 2節）。身体の仕組みでは
      # ないが、どのキャラクタでも同じなので、痛み・血と同じくこの trait が配る。
      #
      # **手元は場所の手元を継ぐ**ので、地面や炉に据えた光源も入る。**視界は場所の環境光を継ぐ**
      # ので、据えた光源は入らない——持ち歩ける明かりだけが道に付いてくる（同3節）。
      # どちらへも、持っている光源が自分の子として届く。
      #
      # **しきい値を持つのはこれらのstagesだけで、条件の側は段の名前で見る**
      # （docs/engine/IlluminationSystem.md 5節）。行動が見るのはキャラクタ側の2つ（同2節）なので、
      # 場所の hand_brightness には段を置かない——誰も段の名前では読まないため。
      # 2つが同じ3段の名前を持つのは、同じEVスケールを同じ底（-6）から測っているから。境目は
      # 別々で、片方を動かすとそのプロパティを見る行動だけが動く——bright が手元は+5、視界は+3
      # なのは、屋外で採るのに要る明るさが、縫うのに要る明るさより低いため。
      #
      # 段が名乗る situation は状況アイコン（docs/ui/ScreenLayout.md 4.1.1節）。**手元は2段で同じ絵**
      # ——手元の作業に要るのは bright だけで、その下は「作れない」の一言に尽きる。視界は線が2本
      # （dim で採れなくなり、pitch_dark で歩けなくなる）なので、そちらだけ絵が分かれる。
      hand_brightness:
        value: 0
        base: {subject: ancestor, prop: hand_brightness}
        stages:
          - {name: pitch_dark, situation: too_dark_for_handwork}
          - {name: dim, min: -5, situation: too_dark_for_handwork}
          - {name: bright, min: 5}
      looking_brightness:
        value: 0
        base: {subject: ancestor, prop: ambient_brightness}
        stages:
          - {name: pitch_dark, situation: no_road}
          - {name: dim, min: -5, situation: too_dark_outside}
          - {name: bright, min: 3}
      # 雨や日差しから守られているか（docs/engine/ContainerSystem.md 6節）。**場所が持つ事実を映す**
      # ので、値は祖先から継ぐだけで自分では動かさない（上の明るさと同じ形）。
      #
      # **段を持つのはキャラクタ側だけ。** 守る側（浅い洞窟・将来の屋根）は今までどおり sheltered: 1 を
      # 宣言するだけでよく、状況アイコンを出すための宣言をそれぞれが覚えている必要が無い。
      sheltered:
        value: 0
        base: {subject: ancestor, prop: sheltered}
        stages:
          - name: sheltered
            min: 1
            situation: sheltered
            passives:
              # 屋根の下では風雨が当たらない（docs/world/ContentSkeleton.md 8.1.4節）。**採取の側は
              # 屋外かどうかを知らなくてよい**——止めているのは風雨そのものなので、屋根はその値を
              # 落とすだけでよい。引く量はいちばん強い嵐の風速で、下のrangeの底が余りを切る。
              - modify:
                  self:
                    wind_speed: -20
      # その身に当たっている風の強さ（m/s。docs/world/ContentSkeleton.md 8.1.5節）。**嵐の日に屋外の
      # 採取を止めているのはこの値**で、暗さではない（同8.1節）。値は上の明るさ・shelteredと同じく
      # 祖先から継ぐだけで、自分では動かさない——動かすのは屋根（上のstages）だけ。
      #
      # **境目を持つのはこのstagesだけ**で、条件の側は段の名前で見る（明るさと同じ形）。galeの
      # 17.2 m/sは台風の風速の定義（ビューフォート風力階級8の下限）そのもので、weatherの7段のうち
      # これを超えるのは嵐だけ。
      wind_speed:
        value: 0
        base: {subject: ancestor}
        range: {min: 0, max: 20}
        stages:
          - {name: calm}
          - {name: gale, min: 17.2}
      # 体重（g）。**筏に乗れば積載として効く**（voyage.yaml）ので、担ぐ側も担がれる側になる。
      # 血液量が体重のおよそ1/13という下の関係から、5,000mLはちょうど65kgにあたる。個体差は
      # まだ持たせず、血と同じくこの trait が配る。
      weight: {value: 65000}
      # 歩みの遅さの倍率（docs/world/Characters.md 荷重の効き方節）。素は1（等倍）で、担いでいる荷が
      # 重いほど、自分のloadの段がmodifyで押し上げる。道のtravelがdurationでtravel_minutesへ掛ける
      # ので、**長い道ほど遅れも大きい**——遅れの量を道ごとに書かずに済む。
      #
      # 荷の重さがどれだけ効くかは段の側（キャラクタごとのload）が持つので、ここは素の値だけ。
      # 身体の仕組みなので個体差を持たせず、痛み・血と同じくこの trait が配る。
      pace: {value: 1}
      # 体に残っている血（docs/engine/VitalsSystem.md 3節）。maxが体格そのもので、ヒトは体重の
      # およそ1/13。痛みと同じく身体の仕組みなので個体差を持たせず、この trait が配る。
      #
      # **自分で作り直す唯一のステータス**（+2/tick ＝ 1日およそ200mL、赤血球が作られる実際の速さ）。
      # 削るのは出血する怪我（injuries.yaml）で、削られるのは一瞬でも戻るのは桁違いに遅い
      # ——失った1,000mLが戻るのに5日かかる。
      #
      # 段は失った割合で刻む（出血性ショックの分類）。2割までが安全域なので、
      # docs/world/Characters.md の「maxの80%で安全域を外れる」とそのまま一致する。
      #
      # **尽きれば失血死する**（VitalsSystem.md 3節）。死因を名乗るのは消す宣言
      # （destroyのreason、9.3節）で、残った値からは推測しない（同6節）。
      #
      # 意識への寄与（VitalsSystem.md 3節）はまだ書かない。キャラクタは consciousness を持たず
      # （同7節）、気を失った手番をどう飛ばすかも決まっていない（同6節）。
      blood:
        tags: [status, health]
        value: 5000
        range: {min: 0, max: 5000}
        stages:
          - {name: exsanguinated, alert: fatal}
          - {name: hemorrhaging, min: 2000, alert: danger}
          - {name: bled, min: 3000, alert: caution}
          - {name: low, min: 3500, alert: watch}
          - {name: replete, min: 4000}
        on_min:
          destroy: {subject: self, reason: exsanguinated}
        passives:
          # **戻るのは水分と体脂肪がともに安全域にある間だけ**（VitalsSystem.md 3.1節）。深手を負った後の
          # 5日は、水と食べ物を切らさずに過ごした5日でなければならない。
          #
          # 判定は段の名前で行い、**閾値を条件の側へ書き写さない**——域（alert）そのものを条件から読む術が
          # 無いので、安全域の下端の段を名指す。獣の側もまったく同じ形（animals.yaml）で、渇きと飢えを
          # 人と獣の両方が持つことが、この1つの宣言を両方へ配れるようにしている（同節）。
          - conditions:
              - {prop: hydration, in_stage_or_above: hydrated}
              - {prop: body_fat, in_stage_or_above: gaunt}
            add:
              self:
                blood: 2
      # 体に残っている熱（docs/engine/VitalsSystem.md 8.3節）。**単位はkcal**で、maxが体格そのもの
      # ——深部体温37℃から心臓が止まる25℃までに失える熱。血と同じく個体差を持たせず、この trait が配る。
      #
      # **尽きれば凍死する**（4本目の死に方、同8節）。段の境目は深部体温で置いてある
      # （175=28℃・350=31℃・560=34.6℃）。
      #
      # **寒いかどうかは、気温と下のchill_pointの比較1つで決まる。** 火は気温の側を上げ、衣服・寝床は
      # 境目の側を下げる（同8.3節）ので、防ぐ手段がどれだけ増えてもこの3ブロックは増えない。
      # 雨は気温ではなく削る速さに効く——濡れた体から熱が抜けるのは空気の温度の話ではないため。
      warmth:
        tags: [status, health]
        value: 700
        range: {min: 0, max: 700}
        stages:
          - {name: frozen, alert: fatal}
          - {name: hypothermic, min: 175, alert: danger}
          - {name: shivering, min: 350, alert: caution}
          - {name: chilled, min: 560, alert: watch}
          - {name: warm, min: 700}
        on_min:
          destroy: {subject: self, reason: frozen}
        passives:
          # 寒い所に居る間の削り。雨に打たれていなければこちら。
          - conditions:
              - {subject: ancestor, prop: ambient_temperature, lt: {prop: chill_point}}
              - any:
                  - {prop: sheltered, gte: 1}
                  # 天候の概念を持たない祖先の下では「降っていない」に倒れる否定形で書く（14.1節）。
                  - {subject: ancestor, prop: weather, not_in: [light_rain, heavy_rain, storm]}
            add: {self: {warmth: -2}}
          # 屋根も蓋も無い所で雨に打たれている間（docs/engine/ContainerSystem.md 6節）。
          - conditions:
              - {subject: ancestor, prop: ambient_temperature, lt: {prop: chill_point}}
              - {prop: sheltered, eq: 0}
              - {subject: ancestor, prop: weather, in: [light_rain, heavy_rain, storm]}
            add: {self: {warmth: -6}}
          # 境目より上に居る間は戻る。**血と違って熱は取り返せる**ので、凍死は「一晩をどう越すか」の
          # 死に方になる——濡れた一晩（48 tick）で失う288 kcalが、火のそばの9時間で戻る。
          - conditions:
              - {subject: ancestor, prop: ambient_temperature, gte: {prop: chill_point}}
            add: {self: {warmth: 8}}
      # 寒さの入口（docs/engine/VitalsSystem.md 8.3節）。これを下回る気温の場所に居る間だけ、
      # 上のwarmthが削られる。
      # 素は16℃で、衣服・寝床が入ればそれらがmodifyで押し下げる。
      chill_point: {value: 16}
      # 満腹感（docs/engine/DigestionSystem.md 2節）。**単位はmL——胃に入っているかさそのもの**で、
      # エネルギーではない。食べたかさぶん増え、tickで減る。
      #
      # 「これ以上食べられない」もここが持つ（段full）。fullをmaxではなく6割に置いてあるのは、
      # 最大の食料（600mL）を足しても溢れないようにするため——溢れた分は捨てられる（同2節）。
      #
      # 感じ方に個体差は持たせず、この trait が配る。減りは一定で、1日1,536mL（3食×512mL）が
      # ちょうど食べる量と釣り合う。
      satiety:
        tags: [status, nutrition]
        value: 300
        range: {min: 0, max: 1500}
        stages:
          # 腹に何も無い間は免疫が落ちる（docs/engine/DigestionSystem.md 6.2節）。押し下げるのはビタミン・
          # 空腹・寝不足・気の塞ぎの4つで、**空腹はビタミンに次いで重い**。modifyなので、食べればその場で戻る。
          - name: starving
            alert: danger
            passives:
              - modify: {self: {immunity: -20}}
          - {name: hungry, min: 50, alert: caution}
          - {name: peckish, min: 200, alert: watch}
          - {name: fed, min: 400}
          - {name: full, min: 900}
        passives:
          - add:
              self:
                satiety: -16
      # 体内に残っているエネルギー（同3節）。**単位はtick——1 = 15分ぶんの生命維持**で、
      # 体脂肪と同じ物差し。食べ物が名乗るのはかさ（satiety）とこの3本で、かさと中身は別の数
      # （水気の多い物はかさだけ大きく、生肉はかさの割に身にならない）。
      #
      # 3本を分けているのは、**吸収の速さが違う**ことと、**欠乏したときに起きることが違う**ため
      # （同4節）。在庫がある間は体脂肪へ流れ続け、尽きれば体脂肪が削られる。
      #
      # 身体の仕組みなので個体差を持たせず、この trait が配る。
      carbohydrate:
        tags: [nutrition]
        value: 40
        range: {min: 0, max: 120}
        passives:
          - transfer: {from_prop: carbohydrate, to_prop: body_fat, amount: 2}
      protein:
        tags: [nutrition]
        value: 30
        range: {min: 0, max: 120}
        passives:
          - transfer: {from_prop: protein, to_prop: body_fat, amount: 1}
      # 脂質だけが段を持つ（同7節）。3本のうちここだけ、尽きたときに固有の弊害が出る。
      lipid:
        tags: [nutrition]
        value: 30
        range: {min: 0, max: 120}
        stages:
          # 脂の在庫が尽きた域。境目の1は「15分ぶんも残っていなければ尽きたとみなす」で、
          # 輸送の刻み（0.5）に依らずに読める。壊血病（同4節）と同じ形で、内側の不調を原因の値の段が持つ。
          # **死に方は増えない**——削るのは既にあるhydrationとbody_fatで、終わり方は脱水と餓死のまま
          # （VitalsSystem.md 8節）。statusタグを持たないので、画面に行も増えない。
          - name: fat_starved
            alert: caution
            passives:
              # 余ったたんぱく質は尿素として捨てるしかなく、その排泄に水が要る。水分の保ちが半分になり
              # （-1/tickが-2/tick）、捨てられる分は身にならない。**肉を食べ足すほど悪化する**
              # ——ゲートがたんぱく質の在庫なので、脂の無い肉を足すほど水が減る。
              - conditions: [{prop: protein, gte: 1}]
                add: {self: {hydration: -1, protein: -2}}
              # 必須脂肪酸の欠乏（肌が荒れ、傷が治らない）。modifyなので可逆——脂を摂って段を抜ければ
              # その場で引く。壊血病の60に対して半分。
              - modify: {self: {pain: 30}}
          - {name: stocked, min: 1}
        passives:
          - transfer: {from_prop: lipid, to_prop: body_fat, amount: 0.5}
      # 体内のビタミン（同4節）。**単位はmg——ビタミンC相当**で、エネルギーの3本とは物差しが違う。
      # 葉物はエネルギーをほとんど持たないので、エネルギーの在庫にすると常に0に張り付き、
      # 「食べていない」と区別が付かない。だから量を別に持つ。
      #
      # ヒトのプールは飽和で約1,500mg、300mgを割ると壊血病が出る。代謝回転は1日およそ48mg。
      #
      # **壊血病は、この値の一番下の段が持つ**（同4節）。怪我のカードは作らない——身体の外から
      # 負ったものだけを怪我にする（docs/concept/DesignPrinciples.md）。
      #
      # 段の境目は現実の量で置く。壊血病が出るのは300mgを割ったときで、残りは1日48mgの回転から
      # 読める日数（1,200＝残り25日で安全域を外れる80%規約、600＝残り12.5日）。
      vitamin:
        tags: [status, nutrition]
        value: 900
        range: {min: 0, max: 1500}
        stages:
          # 壊血病。古傷が開き、歯が抜ける。痛みは刺し傷・牙の傷と並ぶ60で、この島で最も重い段。
          # modifyなので可逆——葉物を食べて段を抜ければ、その場で引く。
          # 免疫も押し下げる（docs/engine/DigestionSystem.md 6.2節）。**押し下げる4つのうちビタミンが
          # 最も重く、しかもここと下のdeficientの2段で押す**——壊血病の創傷治癒不全が現実で最も確かめ
          # られているから。上の「古傷が開く」と同じ現象を、傷ではなく菌の側から見たものにあたる。
          - name: scurvy
            alert: danger
            passives:
              - modify:
                  self:
                    pain: 60
                    immunity: -40
          # ビタミンが押す2段のうち浅いほう。発症前から免疫だけは落ち始める。**多く摂っても強くは
          # ならない**（過剰側に寄与は無い）ので、押すのはこの段と上のscurvyだけ。
          - name: deficient
            min: 300
            alert: caution
            passives:
              - modify: {self: {immunity: -15}}
          - {name: waning, min: 600, alert: watch}
          - {name: replete, min: 1200}
        passives:
          - add:
              self:
                vitamin: -0.5
      # 孤独（docs/world/Characters.md ホームシック節）。**漂着してからの日数そのもの**で、世界の日数を
      # 場所ごしに継ぐだけ（ambient_brightness・shelteredと同じ形のbase）。**独立した値としては溜めない**
      # ——時間の単調増加関数でしかないものを別に持つと、同じ数が2箇所に立つ。将来「他の生存者に会う」で
      # 下げる余地は、baseにしてあるぶんmodifyで開いている。
      #
      # **画面には出さない**（statusタグを持たない）。プレイヤーが読むのは下のホームシックのほうなので、
      # 見えない値が結果だけを変える形にはならない。
      #
      # 段が持つのはホームシックの溜まる速さで、境目は**日数**で置く（初回の季節がちょうど各30日
      # なので、雨季と乾季の入口に重なる。docs/engine/ClimateSystem.md 2.3節）。**漂着した最初の
      # ひと月は溜まらない**——生き延びるだけで手一杯のあいだに里心は付かない。
      # 速さは段ごとに倍で、1日（96 tick）あたり+0.96・+1.92・+3.84。
      loneliness:
        value: 0
        base: {subject: ancestor, prop: day}
        stages:
          - {name: occupied}
          - name: restless
            min: 30
            passives:
              - add: {self: {homesickness: 0.01}}
          - name: lonely
            min: 60
            passives:
              - add: {self: {homesickness: 0.02}}
          - name: forsaken
            min: 90
            passives:
              - add: {self: {homesickness: 0.04}}
      # ホームシック（docs/world/Characters.md ホームシック節）。**後半の難度を担う1本**で、上の孤独が
      # 溜め、下の居心地と連れが引く。増える側が悪いプロパティなので、段はmaxからの割合で刻む
      # （痛み・荷重と同じ1/4・1/2・5/6）。
      #
      # **maxが120なのは、顕在化する日のほう先に決まっているから**（同節）。目盛りに現実の単位が無く、
      # 決まっているのは「60日目に表へ出る」——1日0.96で30日ぶん溜めた28.8が、60日目のうちに留意域
      # （max の1/4 ＝ 30）を越える位置がここ。100に置くと4日早まる。
      #
      # **幸福度を削るのは痛みとここの2本だけ。** 1段上がるごとに倍で、1日あたり-12・-24・-48
      # ——火を通した3食（+18/日）で追いつくのは最初の段までで、里心が深まれば食事では埋まらない。
      #
      # 対策を何も打たなければ、最良の食事を通しても91日目に初めて打ちひしがれ、以後は繰り返す
      # （同節・限界節）。**0は終点ではない**ので、削り続けた先に出るのは死ではなく、手から離れる時間。
      homesickness:
        tags: [status, health]
        value: 0
        range: {min: 0, max: 120}
        stages:
          - {name: settled}
          - name: wistful
            min: 30
            alert: watch
            passives:
              - add: {self: {happiness: -0.125}}
          - name: yearning
            min: 60
            alert: caution
            passives:
              - add: {self: {happiness: -0.25}}
          - name: despondent
            min: 100
            alert: danger
            passives:
              - add: {self: {happiness: -0.5}}
      # 今いる場所の居心地（docs/world/Characters.md ホームシック節）。**場所が持つ事実を映す**ので、
      # 値は祖先から継ぐだけで自分では動かさない（明るさ・shelteredと同じ形）。押し上げるのは住居の部品
      # （docs/world/Dwellings.md 2節）。
      #
      # **段が持つのはホームシックの引き**で、1日あたり-1.92・-3.84。60日目からの増えを止めるには
      # homely（20）、90日目からの増えを止めるにはsnug（50）が要る。
      # **継ぐのは今居る場所の居心地だけなので、遠征に出れば何も効かない。**
      comfort:
        value: 0
        base: {subject: ancestor}
        stages:
          - {name: bare}
          - name: homely
            min: 20
            passives:
              - add: {self: {homesickness: -0.02}}
          - name: snug
            min: 50
            passives:
              - add: {self: {homesickness: -0.04}}
      # 今いる場所に在る、世話をしている獣の居る囲いの数（同節）。上のcomfortと同じく祖先から継ぐだけで、
      # 押し上げるのは飼葉の残っている囲い（farming.yaml）が1つにつき1。
      #
      # **段は1つだけ**で、囲いをいくつ並べても効き目は増えない（理由は同節）。**引くのは1日-1.92で、
      # 60日目からの増えをちょうど止める**が、90日目からは家畜だけでは足りない。
      company:
        value: 0
        base: {subject: ancestor}
        stages:
          - {name: alone}
          - name: kept
            min: 1
            passives:
              - add: {self: {homesickness: -0.02}}
      # 幸福度（docs/world/Characters.md 幸福度節）。**メンタルの不調を代表する1本**で、心の不調が
      # 行き着く先はここへ集める——分けるのは原因の側だけ（docs/concept/DesignPrinciples.md）。
      # **現実の単位が無い**ので
      # （痛み・体力と同じ抽象の0〜100）、確かめられるのは大小の関係だけ。
      #
      # **押し引きはすべてadd。** modifyを1本も刺さないので実効値が実体値と一致し、0に達したときの
      # 強制休息をon_minで書ける（まだ入っていない）。意味の面でも、効くのは「快適な寝床で寝た今夜」で
      # あって寝床を持っていること自体ではない。
      #
      # **上げるのは口にした物だけ**（各eatのベース値）で、**下げるのは痛みとホームシックの段の2本**
      # （上のpain・homesickness）。寝床や住居からの寄与は、まだ入っていない。
      # 増える側が良い値なので、段は下から上へ深刻さが下がる並び（血・熱と同じ形）。
      #
      # 感じ方の個体差はまだ持たせず、痛み・血と同じくこの trait が配る。
      happiness:
        tags: [status, health]
        value: 75
        range: {min: 0, max: 100}
        stages:
          # 心が折れている間は免疫も落ちる（docs/engine/DigestionSystem.md 6.2節）。**押し下げる4つのうち
          # 気の塞ぎが最も軽い**——現実で最も裏付けの弱い経路なので、順位の一番下に置く。
          - name: miserable
            alert: danger
            passives:
              - modify: {self: {immunity: -10}}
          - {name: dejected, min: 20, alert: caution}
          - {name: glum, min: 50, alert: watch}
          - {name: content, min: 80}
      # 全身の菌（docs/engine/DigestionSystem.md 6節）。**単位は log₁₀ CFU**——菌の数そのものではなく、
      # その常用対数で持つ。対数目盛では指数増殖が定数のaddになるので、「細菌が自分で自分を押し上げる」を
      # 近似せずに書ける（明るさをEVで持っているのと同じ形、IlluminationSystem.md 2節）。
      #
      # **0は菌ゼロではなく菌1個**なので、増殖を無条件に置くと感染していない体でも菌が増える。
      # 最下段sterileには置かず、そこを抜けている間だけ増やす。
      #
      # **増殖は定数1つ（+0.15/tick）。** 倍加あたりの上昇は log₁₀2 ≒ 0.30 なので、これは倍加時間30分に
      # あたる。引くのは免疫の段（下のimmunity）で、**除去が増殖を上回れば0へ着地して止まり、下回れば
      # 上限へ暴走する**——分かれ目は2つの定数の大小1つに畳まれている。
      #
      # **対数上の足し算は線形では掛け算**なので、続けて食べた分は過大に見える。向き（続けて食べるほど
      # 危ない）は正しいので、罰としてそのまま許容する（docs/concept/DesignPrinciples.md）。
      #
      # **死に方は増えない**（VitalsSystem.md 8節）。上の2段が水と血を削り、既存の脱水・失血へ流す。
      # **削るのはここだけ**で、押し上げる側——口から入る生肉（animals.yamlのraw_meat）も、膿んだ傷
      # （injuries.yamlのopen_wound）も——はこの値を押すところまでしかしない。潜伏期のうちは下2段が
      # alertを持たないので、ステータスエリアには行が出ない（StatusArea.md 3節）。
      pathogen:
        tags: [status, health]
        value: 0
        range: {min: 0, max: 9}
        stages:
          - {name: sterile}
          - {name: latent, min: 0.1}
          - name: feverish
            min: 5
            alert: caution
            passives:
              # 熱で水が余計に要る。飲めば追いつくので、ここだけなら水で凌げる（VitalsSystem.md 8.1節）。
              - add: {self: {hydration: -1}}
          - name: septicemic
            min: 7
            alert: danger
            passives:
              # 菌が血へ回れば血漿が循環の外へ漏れ出す。**飲んでも循環へは戻らない**ので、免疫が
              # 追いつくか、菌を送り込んでいる側を断つ以外に止まらない。
              - add: {self: {hydration: -2, blood: -40}}
        passives:
          # 菌が居る間だけ増え、同じ間だけ免疫が上がる（獲得免疫）。**潜伏期は、免疫が段を1つ上げるのに
          # 要る時間そのもの**——0.25/tickなので、weakenedの下端25からrobustの40までを60 tick（15時間）で
          # 登る。
          - conditions: [{not: {prop: pathogen, in_stage: sterile}}]
            add: {self: {pathogen: 0.15, immunity: 0.25}}
      # 免疫（同6節）。**現実の単位を持たない**抽象の目盛り（痛み・幸福度と同じ）なので、確かめられるのは
      # 上の菌の増殖（+0.15/tick）との大小だけ。段ごとの定数で菌を引く。
      #
      # **押し下げるのは生活の側だけ**で、どれもmodify（可逆）。重い順に、壊血病 -40（上のvitamin）・
      # 空腹 -20（上のsatiety）・ビタミン不足 -15（同）・寝不足 -15（キャラクタごとのwakefulness）・
      # 惨め -10（上のhappiness）。宣言は原因の段の側が持つ（壊血病が痛みを押し上げるのと同じ形）。
      # **過剰側に寄与は無い**——ビタミンを多く摂れば感染に強くなる、は現実で否定されている。
      # **体温も入れない**——寒さそのものが感染を増やすという裏付けは弱い。
      #
      # **段の境目は「いくつ重なったか」で置く。** 素の60から、押し下げが1つまでならrobustに留まり
      # （壊血病を除けばいちばん重い空腹の-20でちょうど40）、2つ重なるとweakened、3つ重なるか壊血病1つで
      # failingへ落ちる。こう置かないと、いちばん軽い-10でも段が落ちて、重い順に並べた意味が消える。
      #
      # **range.minは、押し下げが重なっても残る守りの底。** 全部重ねても（-85）ここより下へは行かない。
      # **素の60（value）とは別の数**で、こちらは「何も抱えていない体の高さ」、20は「どこまで落ちても
      # 残る高さ」。
      #
      # **上がるのは感染している間だけ**（上のpathogenが+0.25/tick）。いちばん上の段だけが自分を引き
      # 戻すので、**罹って治った体は素の60より高い所（70の少し下）で止まる**——それが獲得免疫そのもので、
      # 押し下げ-30までは段を保てる余力になる（素のままなら-20まで）。
      #
      # 身体の仕組みなので個体差を持たせず、痛み・血と同じくこの trait が配る。
      #
      # **statusは持たない**——常時見せるのは症状（上のpathogen）のほうで、免疫そのものは開いて見る値。
      # 体脂肪と同じ扱いで、分類のタグだけを持ってカードのタブには並ぶ（docs/world/Characters.md）。
      immunity:
        tags: [health]
        value: 60
        range: {min: 20, max: 100}
        stages:
          - name: failing
            passives:
              - add: {self: {pathogen: -0.05}}
          - name: weakened
            min: 25
            passives:
              - add: {self: {pathogen: -0.1}}
          # ここから上が増殖（+0.15）を上回る。健康な体はこの段の中から始まるので、生肉1食ぶんの菌は
          # 症状が出ないまま引いていく。
          - name: robust
            min: 40
            passives:
              - add: {self: {pathogen: -0.2}}
          - name: primed
            min: 70
            passives:
              - add: {self: {pathogen: -0.3, immunity: -0.05}}
      # ------------------------------------------------------------------
      # 腕前（docs/engine/SkillSystem.md、粒度と一覧は docs/world/Skills.md 2節）。レシピの解放条件は
      # 段の名前で読む（同4節）ので、境目を条件の側へ書き写さない。
      #
      # **段はどの本でも共通**（0/20/60/180。比3で、SkillSystem.md 6節の目安そのまま）。本ごとに
      # 境目を変えると、同じ`basic`が本ごとに違う遠さになり、連言で並べた条件（Skills.md 3節）を
      # 読み比べられなくなる。
      #
      # **一番下の段も下端を名乗る**（`min: 0`）。他のプロパティの最下段は受け皿なので下端を書かないが、
      # 腕前は0より下へ行かないうえ、**下端の無い段は段内進捗の区間が定まらずバーが出ない**
      # （docs/ui/StatusArea.md 9節）——素人でいるあいだ、伸びているのに何も動かないことになる。
      #
      # **個体差を持たせない。** 4人とも漂着した素人として始まるので、痛み・血と同じくこの trait が配る。
      #
      # **解放条件の「その段以上」は`in_stage_or_above`で書く**（上のbloodの安全域と同じ形）。
      # `in_stage`は今いる段ちょうどの判定なので（GameElementDefinition.md 14.1節）、そちらで書くと
      # 腕が上がった時点で条件が偽へ戻り、レシピが閉じ直す。
      # tests/world-codex/skillsYaml.test.tsが「上の段でも満たし続ける」ことを見張る。
      #
      # **伸ばすのは実行経路だけ**（同3節の3経路のうち中）。その腕を使う操作が自分の`add`で`agent`へ
      # +2を配る。**量は作業の長さに依らず一律**で、繰り返しの稼ぎを抑えるのは時間のコストだけ
      # （同7節）。発見・集中の2経路は、契機と対価が未決のため持たない（同8節）。
      #
      # **配るのは、Skills.md 2節がその腕の技術として挙げている作業だけ。** 打ち欠く（knap）、繊維を
      # 採って撚って編む（strip・ret・spin・ply・weave）、刃で木を断って削り出す（fell・buck・whittle）、
      # 皮を剥ぐ（butcher）、獲物を獲る（strike・spear_*・catch_seabird）、火を起こす（light）、
      # 保たせる加工（cure）で全部。
      #
      # **出す物がそっくり同じ操作は、同じ腕を同じだけ配る。** 同じ仕事に入口が2つあるということなので
      # （植物繊維はfiber.yamlのstripとcoconut.yamlのret、編んだ葉はweaveとsplit_and_weave）、片方だけに
      # 配ると、**どの島に流れ着いたかが腕の伸びに化ける**。tests/world-codex/skillsYaml.test.tsが、
      # 出す物がそっくり同じ組で揃っていることを見張る。
      #
      # **出す物が重なるだけでは同じ仕事ではない。** 解体（animals.yamlのbutcher、皮革）と漁
      # （voyage.yamlのspear_*、狩猟）はどちらも生肉を出すが、剥ぐ手と突く手は別の腕で、配る腕も違う
      # ——これらは上の検査の同じ組に入らないし、入れてはいけない。
      #
      # **配らないもの。** 食べる・歩く・休む（身体の動きで、腕は関わらない）。くべる・入れる・据える・
      # 汲む・移す（1手の受け渡し。**量が一律なので、ここへ配ると最も速い伸ばし方になる**——1分の
      # `add_fuel`が1時間の`knap`と同じだけ伸びる）。素材を採るだけの操作（草を刈るfell・葉を採る
      # pick_frond・樹皮を剥ぐstrip_bark・実を割るcrack）。土地を調べるexplore（発見経路そのもので、
      # 未決のまま置いてある）。
      #
      # **伸ばす行動をまだ持たない本がある**（指物・接合、建築、料理、採鉱・製錬）。開ける物が世界に
      # 1つも無く、伸ばす操作の置き場も無いため。**それらは解放条件にも書かない**——書けば永久に
      # 開かないレシピになる（SkillSystem.md 3.2節）。
      # ------------------------------------------------------------------
      # 石を打ち欠く（locations.yamlのknap）。柄付けの刃（tools.yaml）を開ける。
      skill_knapping:
        tags: [skill]
        value: 0
        stages:
          - {name: novice, min: 0}
          - {name: basic, min: 20}
          - {name: skilled, min: 60}
          - {name: expert, min: 180}
      # 掻き取る・撚る・編む（fiber.yaml・weaving.yaml）。編み籠・くくり罠・葉の衣類と、柄付けの紐を開ける。
      skill_cordage:
        tags: [skill]
        value: 0
        stages:
          - {name: novice, min: 0}
          - {name: basic, min: 20}
          - {name: skilled, min: 60}
          - {name: expert, min: 180}
      # 削る・伐る（timber.yamlのfell/buck、animals.yamlのwhittle）。開けるレシピはまだ無い
      # ——木の箱・そり・板（Skills.md 2節）が世界に1つも無い。
      skill_woodwork:
        tags: [skill]
        value: 0
        stages:
          - {name: novice, min: 0}
          - {name: basic, min: 20}
          - {name: skilled, min: 60}
          - {name: expert, min: 180}
      # 削り合わせて組む。伸ばす行動も開ける物もまだ無い（スツール・テーブル・車輪が世界に無い）。
      skill_joinery:
        tags: [skill]
        value: 0
        stages:
          - {name: novice, min: 0}
          - {name: basic, min: 20}
          - {name: skilled, min: 60}
          - {name: expert, min: 180}
      # 住居を建てる。伸ばす行動も開ける物もまだ無い（住居は docs/world/Dwellings.md の検討段階）。
      skill_building:
        tags: [skill]
        value: 0
        stages:
          - {name: novice, min: 0}
          - {name: basic, min: 20}
          - {name: skilled, min: 60}
          - {name: expert, min: 180}
      # 皮を剥ぐ（animals.yamlのbutcher）。なめし革と、それを縫った物（clothing.yaml・voyage.yamlの帆）を開ける。
      skill_leatherwork:
        tags: [skill]
        value: 0
        stages:
          - {name: novice, min: 0}
          - {name: basic, min: 20}
          - {name: skilled, min: 60}
          - {name: expert, min: 180}
      # 調理する。伸ばす行動がまだ無い——焼くのは炉が子のcooking_progressを進めるだけで
      # （docs/engine/FireSystem.md 7節）、人が行う操作になっていない。
      skill_cooking:
        tags: [skill]
        value: 0
        stages:
          - {name: novice, min: 0}
          - {name: basic, min: 20}
          - {name: skilled, min: 60}
          - {name: expert, min: 180}
      # 得た食を保たせる（salt.yamlのcure）。開けるレシピはまだ無い——干し場・燻し場が世界に無い。
      skill_preserving:
        tags: [skill]
        value: 0
        stages:
          - {name: novice, min: 0}
          - {name: basic, min: 20}
          - {name: skilled, min: 60}
          - {name: expert, min: 180}
      # 火を起こす（fire.yamlのlight）。**レシピは開けない**——効き先は着火の重みだけ
      # （docs/engine/FireSystem.md 10節）。段が押し上げるのは下のignition_easeで、火口の
      # ignition_chanceがそれをbaseの土台にする（fire.yaml）。
      skill_firecraft:
        tags: [skill]
        value: 0
        stages:
          - {name: novice, min: 0}
          - name: basic
            min: 20
            passives:
              - modify: {self: {ignition_ease: 20}}
          - name: skilled
            min: 60
            passives:
              - modify: {self: {ignition_ease: 50}}
          - name: expert
            min: 180
            passives:
              - modify: {self: {ignition_ease: 120}}
      # 獣を狩る（animals.yamlのstrike）。**レシピは開けない**——開けるのは素材と機会で（Skills.md 2節）、
      # 罠を作るのは繊維・編みの腕（同節のくくり罠）。段が押し上げるのは下のquarry_senseで、
      # 土地の<動物>_find・海区のshoal_find/seabird_find（探索で出くわす機会）がそれをbaseの
      # 土台にする（locations.yaml・voyage.yaml）。
      #
      # **上乗せは2本**——出くわす側のquarry_senseと、当てる側のhunting_aim（下）。**桁が違うので
      # 分けている**（獣のつまみは2〜4、当てる側は15〜78）。
      #
      # **罠には効かない。** 罠の抽選は誰も操作していない場面で走るので、罠から腕の持ち主が見えない
      # （docs/engine/TrapSystem.md 8節）。
      skill_hunting:
        tags: [skill]
        value: 0
        stages:
          - {name: novice, min: 0}
          - name: basic
            min: 20
            passives:
              - modify: {self: {quarry_sense: 1, hunting_aim: 10}}
          - name: skilled
            min: 60
            passives:
              - modify: {self: {quarry_sense: 2, hunting_aim: 20}}
          - name: expert
            min: 180
            passives:
              - modify: {self: {quarry_sense: 4, hunting_aim: 40}}
      # 鉱石を採って製錬する。伸ばす行動も開ける物もまだ無い（青銅器が世界に無い）。
      skill_smelting:
        tags: [skill]
        value: 0
        stages:
          - {name: novice, min: 0}
          - {name: basic, min: 20}
          - {name: skilled, min: 60}
          - {name: expert, min: 180}
      # ------------------------------------------------------------------
      # アクセス系の腕が押し上げる上乗せ（刻みとその理由は docs/world/Skills.md 5節）。**素は0で、
      # 自分では動かず、上の腕前の段がmodifyで押し上げる。**使う側はこれを`base`の土台にする
      # ——痛みが怪我を土台にするのと同じで、合成はどちらも加算。
      #
      # **刻みが違うのは、上乗せする先の桁が違うから**（着火の重みは60前後、獣のつまみは2〜4、
      # 当てる側は15〜78）。倍率なら1本の刻みで済むが、掛け算はこの世界の文法に無い
      # （GameElementDefinition.md 10.2節）。**桁の合わない先へ同じ上乗せを積むと、片方は効かず
      # もう片方は塗り潰す。**
      #
      # **statusタグを持たないので、ステータスの行にはならない**（paceと同じ）。見せるのは腕前
      # そのもので、効きの大きさは段から読む（docs/world/Skills.md 5.1節）。
      # ------------------------------------------------------------------
      # 火の移りやすさ。火口のignition_chance（fire.yaml）が、火を起こしている間これを土台にする。
      ignition_ease: {value: 0}
      # 獲物の気配に気づく目。土地の<動物>_findと、海区のshoal_find・seabird_find（locations.yaml・
      # voyage.yaml）が、探索している間これを土台にする。
      quarry_sense: {value: 0}
      # 狙いの確かさ。武器の当たり所の重み（tools.yaml）と、突き漁のcatch_chance（voyage.yaml）が、
      # 打ちかかっている間これを土台にする。**上と分けているのは桁が違うから**（上の注記）。
      hunting_aim: {value: 0}
