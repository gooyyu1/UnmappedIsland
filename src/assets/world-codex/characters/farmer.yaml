# 元農家。畑仕事で作った丈夫な体と厚い蓄えを持つが、その体を動かすだけの量を食べないと保たない。
# 各プロパティの意味・値の刻み方は docs/world/Characters.md 参照。

object_defs:
  farmer:
    singleton: true
    traits: [player_character]
    slots:
      hand: {cell_count: 6}
    props:
      # 尽きれば渇きで死ぬ。死因を名乗るのは消す宣言（destroyのreason、9.3節）で、残った値からは
      # 推測しない（VitalsSystem.md 6節）。
      hydration:
        tags: [status, nutrition]
        value: 216
        range: {min: 0, max: 288}
        on_min:
          destroy: {subject: self, reason: dehydrated}
        stages:
          - {name: dehydrated, alert: fatal}
          - {name: parched, min: 24, alert: danger}
          - {name: thirsty, min: 96, alert: caution}
          - {name: dryish, min: 192, alert: watch}
          - {name: hydrated, min: 230}
          - {name: full, min: 288}
        passives:
          - add:
              self:
                hydration: -1
      # 体脂肪（docs/engine/DigestionSystem.md 5節）。3本のエネルギーから届いた分が積み上がり、基礎代謝で減る。
      # 尽きれば飢えで死ぬ（VitalsSystem.md 8節）。
      #
      # **減る速さを体格の段で変える。** 太っているほど基礎代謝が大きいので、食べ過ぎても際限なく
      # 太らない平衡点になる。1日に要る量の個体差はここに出る。
      body_fat:
        tags: [nutrition]
        value: 1620
        range: {min: 0, max: 6480}
        on_min:
          destroy: {subject: self, reason: starved}
        stages:
          # 蓄えが尽きる域。
          - name: starved
            alert: fatal
            passives:
              - add: {self: {body_fat: -0.6}}
          - name: gaunt
            min: 108
            passives:
              - add: {self: {body_fat: -0.9}}
          - name: nourished
            min: 540
            passives:
              - add: {self: {body_fat: -1.25}}
          - name: stout
            min: 3240
            passives:
              - add: {self: {body_fat: -1.6}}
          - name: obese
            min: 4860
            passives:
              - add: {self: {body_fat: -2}}
      # 日の出とともに働く暮らしのまま、意識を保っていられるのは48時間（192 tick）。
      wakefulness:
        tags: [status, health]
        value: 192
        range: {min: 0, max: 192}
        stages:
          # 限界まで起きていると免疫が落ちる（docs/engine/DigestionSystem.md 6.2節）。**押し下げるものの
          # 中で寝不足は空腹より軽い**。量はキャラクタに依らず同じ——寝ずにいられる長さの個体差は段の境目に出る。
          - name: overtired
            alert: danger
            passives:
              - modify: {self: {immunity: -15}}
          - {name: sleepy, min: 12, alert: caution}
          - {name: yawning, min: 48, alert: watch}
          - {name: rested, min: 154}
        passives:
          - add:
              self:
                wakefulness: -1
      # 重い物を担ぎ慣れた、基準より高い体力。
      stamina:
        tags: [status, health]
        value: 120
        range: {min: 0, max: 120}
        stages:
          - {name: exhausted, alert: danger}
          - {name: tired, min: 24, alert: caution}
          - {name: winded, min: 72, alert: watch}
          - {name: fresh, min: 96}
      # 重い物を担ぎ慣れた、基準より多い持てる量。持ち物の重さ（g）は中身から導出されるので、valueは0のまま
      # （ContainerSystem.md 2節）。増える側が悪いプロパティなので、段はmaxからの割合で刻む
      # （docs/world/Characters.md）。
      #
      # **段が駆動するのは移動の可否だけではない**——歩みの遅れ（travel_delay）と体力の削りも同じ段が
      # 持つ（docs/world/Characters.md 荷重の効き方節）。遅れと削りはキャラクタに依らず同じで、
      # 個人差は段の境目だけに出る。
      load:
        tags: [status, health]
        value: 0
        range: {min: 0, max: 36000}
        stages:
          - {name: light}
          - name: laden
            min: 9000
            alert: watch
            passives:
              - add: {self: {stamina: -0.3}}
              - modify: {self: {travel_delay: 15}}
          - name: heavy
            min: 18000
            alert: caution
            passives:
              - add: {self: {stamina: -1}}
              - modify: {self: {travel_delay: 30}}
          # 通れない段なので歩みの遅れは押し上げない。立っているだけで削られる。
          - name: too_heavy
            min: 30000
            alert: danger
            passives:
              - add: {self: {stamina: -2}}
