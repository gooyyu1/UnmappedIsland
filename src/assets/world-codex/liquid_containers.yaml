# 液体容器の定義。**液体は独立した物ではなく、容器の変種として存在する**——「水入りの水筒」は
# 水筒と水の親子2つではなく、ロード時に生成される1つの型（GameElementDefinition.md 3.5節の軸）。
# 容器が variation_axes で「中身」の軸を宣言し、液体の側は配られる trait の束として宣言する。
# 設計の全体像はLiquidContainerSystem.mdを参照。
#
# 固形物を入れる容器（containers.yaml）とは構造が別。あちらは中身をスロットへそのまま入れるが、
# こちらは中身が容器自身のfillになり、注ぎ移しは量の移送（transfer）になる。

traits:
  # 液体を入れられること自体のタグ（固形物を入れるcontainerタグと対になる、containers.yaml）。
  # 空の容器も中身入りの変種もこのタグを持つ。空かどうかはfillの有無で見る（下のpour_in）。
  liquid_container:
    tags: [liquid_container]

  # 液体に共通する、量としての振る舞い。中身入りの変種へ配られる。
  liquid:
    tags: [liquid]
    props:
      # 単位量あたりの重さ（g/mL）。水は1で、油のように軽い液体は0.92のように書く。
      # fill × density がそのまま重さ（g）になる（ContainerSystem.md 1節）。
      density:
        value: 1
    # 見た目の色（color、0xRRGGBB）は種類ごとのtraitが宣言する。何色に見えるかは液体そのものの
    # 性質で、共通の既定値には意味が無いため。容器カードの中身のバーがこの色で塗られる
    # （CardView.md 8節 カードの状態バー）。

  wide_open_container:
    tags: [wide_open_container]

  narrow_open_container:
    tags: [narrow_open_container]

  # 空けたまま置いて雨を受けられる容器（LiquidContainerSystem.md 7節）。溜め始めるのは操作で、
  # 増えるのは自動（rain_filled_liquid）。中身入りの変種はfillを持つので条件で弾かれ、
  # 空の容器にだけボタンが出る。
  rain_catching_container:
    interactions:
      collect_rain:
        trigger: menu
        conditions:
          - reason: not_raining
            subject: ancestor
            prop: weather
            in: [light_rain, heavy_rain, storm]
          # 雨が届く場所に置かれていること（ContainerSystem.md 6節）。降ってはいるが当たらない、が
          # 降っていないと同じ文言にならないよう、理由を分けている。
          - reason: sheltered
            subject: ancestor
            prop: sheltered
            eq: 0
          # 中身のある容器では雨を受け始められない（既にある中身が水に置き換わってしまう）。
          - {reason: not_empty, subject: self, prop: fill, eq: 0}
        become: {content: water_liquid}
        # 溜め始めた瞬間の量は「まだほとんど無い」を表す最少値（LiquidContainerSystem.md 7節）。
        # 実際に溜まる量は降り方が決めるので、以後はrain_filled_liquidが増やす。
        set: {self: {fill: 1}}

  water_liquid:
    # この液体を保持していることを表すタグ。注ぎ移しの相手を種類ごとに指す（pour_in）。
    #
    # cleansingは傷を洗える液体の印（injuries.yamlのopen_wound、docs/engine/InjurySystem.md 6.2節）。
    # **海水は名乗らない**——海に囲まれた島で無尽蔵の水源を認めると、洗う代償（1杯を飲まずに捨てる）が
    # まるごと消える。
    tags: [water, cleansing]
    props:
      color: {value: 0x2f86d8}
    interactions:
      # 空の容器へ注ぐ。**宣言はこちら側（中身入り）にしか無いので、どちらの札をどちらへ重ねても
      # selfは中身入り・instrumentは空になる**（12.3節）。相手を水入りの変種にしてから移すので、
      # becomeをtransferより先に書く（transferは相手がfillを持たないと何もしない）。
      pour_into_empty:
        trigger: {drag: {tag: liquid_container}}
        conditions:
          - {reason: not_empty, subject: instrument, prop: fill, eq: 0}
        become: {subject: instrument, content: water_liquid}
        transfer:
          amount: 999999
          from: self
          from_prop: fill
          to: instrument
          to_prop: fill
      # 水入りの容器同士。入るだけ入り、入りきらない分は注ぎ元に残る（transferの両側のクランプ）。
      # 異種の液体はこのタグに合致しないので、混ぜる組み合わせがそもそも現れない。
      pour_into_filled:
        trigger: {drag: {tag: water}}
        transfer:
          amount: 999999
          from: instrument
          from_prop: fill
          to: self
          to_prop: fill
      # 1回の飲用 = 250mL。残量が足りなければ残っている分だけ飲む（transferの在庫クランプ）。
      # 満水では何も移らない操作になるため、実行自体をさせない。境目はキャラクターのhydrationの
      # full段が持つ（Characters.md）。
      #
      # 水分はtick数で持つので（6.0節）、mLからの換算率はto_amountが持つ: 体は25mL/tickを失うため、
      # 250mLは10 tick分にあたる。寄与の小さい液体（酒）はこの比を小さくするだけで表せる。
      drink:
        trigger: menu
        conditions:
          - reason: not_thirsty
            not: {subject: agent, prop: hydration, in_stage_or_above: full}
        duration: 3
        transfer:
          amount: 250
          to_amount: 10
          from_prop: fill
          to: agent
          to_prop: hydration

  # 沸かした湯。焼け石を落として作る（fire.yamlのhot_stone、docs/engine/FireSystem.md 9.1節）。
  # **水とは別のタグを持つ**ので、湯へさらに焼け石は落とせず、水と混ぜて薄まることもない。
  hot_water_liquid:
    # **真水と同じcleansingを名乗る。** 落とすのは傷口に入った汚れなので、沸かしてあるかどうかは
    # 効き目を変えない——洗う宣言が傷の側に1つで済むのはこのため（InjurySystem.md 6.2節）。
    tags: [hot_water, cleansing]
    props:
      color: {value: 0x8fc4ea}
      # 器の中に残っている熱。抜け切れば普通の水に戻る。石の蓄熱（fire.yaml）と同じ名前だが、
      # 溜める手段は持たない——湯が沸くのは石が熱を使い切る一度きり。
      heat_soak:
        value: 12
        range: {min: 0, max: 12}
        passives:
          - add: {self: {heat_soak: -1}}
        on_min:
          become: {content: water_liquid}
    # **注ぎ移しは持たない。** 注いだ先の湯が何度から始まるかを書けない——heat_soakは量ではなく
    # 熱さそのもので、量に比例して移す transfer では表せず、注ぎ元の値を読んで代入する術も無い。
    # 移せるようにすると、ぬるくなった湯を注ぎ分けるたびに沸かし直しになる
    # （docs/engine/FireSystem.md 9.1節）。
    interactions:
      drink:
        trigger: menu
        conditions:
          - reason: not_thirsty
            not: {subject: agent, prop: hydration, in_stage_or_above: full}
        duration: 3
        transfer:
          amount: 250
          to_amount: 10
          from_prop: fill
          to: agent
          to_prop: hydration

  tea_liquid:
    tags: [tea]
    props:
      color: {value: 0x6f8f3c}
    interactions:
      pour_into_empty:
        trigger: {drag: {tag: liquid_container}}
        conditions:
          - {reason: not_empty, subject: instrument, prop: fill, eq: 0}
        become: {subject: instrument, content: tea_liquid}
        transfer:
          amount: 999999
          from: self
          from_prop: fill
          to: instrument
          to_prop: fill
      pour_into_filled:
        trigger: {drag: {tag: tea}}
        transfer:
          amount: 999999
          from: instrument
          from_prop: fill
          to: self
          to_prop: fill
      drink:
        trigger: menu
        conditions:
          - reason: not_thirsty
            not: {subject: agent, prop: hydration, in_stage_or_above: full}
        duration: 3
        transfer:
          amount: 250
          to_amount: 10
          from_prop: fill
          to: agent
          to_prop: hydration
          linked_add:
            agent:
              wakefulness: 2

  # 飲めない液体はdrinkを定義しないだけでよい。
  oil_liquid:
    tags: [oil]
    props:
      color: {value: 0xe0b422}
    interactions:
      pour_into_empty:
        trigger: {drag: {tag: liquid_container}}
        conditions:
          - {reason: not_empty, subject: instrument, prop: fill, eq: 0}
        become: {subject: instrument, content: oil_liquid}
        transfer:
          amount: 999999
          from: self
          from_prop: fill
          to: instrument
          to_prop: fill
      pour_into_filled:
        trigger: {drag: {tag: oil}}
        transfer:
          amount: 999999
          from: instrument
          from_prop: fill
          to: self
          to_prop: fill

  # 開いた容器から蒸発する。日射に依らない基礎の蒸発と、ambient_brightnessのしきい値で決まる上乗せの和
  # （LiquidContainerSystem.md 6節）。密閉容器はどちらのゲートも成立しないため蒸発しない。
  # 量が尽きた変種は空の容器へ戻る（fillのon_min）。
  #
  # **口の開き方は自分自身のタグで見る**——容器と中身が同じ1つのオブジェクトなので、親を辿らない。
  evaporating_liquid:
    passives:
      # 基礎。湿度が未実装のため、雨天は「湿度が高くて乾かない」の代理として除外する。
      - conditions:
          - {subject: self, matches: {tag: wide_open_container}}
          - {subject: ancestor, prop: weather, not_in: [light_rain, heavy_rain, storm]}
        add:
          self:
            fill: -1
      - conditions:
          - {subject: self, matches: {tag: narrow_open_container}}
          - {subject: ancestor, prop: weather, not_in: [light_rain, heavy_rain, storm]}
        add:
          self:
            fill: -2
      # 日射による上乗せ。読むのは**器が居る場所の環境光**で、樹冠と地面の反射が入り、据え付けの
      # 光源は入らない（IlluminationSystem.md 2節・3節）。しきい値はEV（同1節）＝器へ届いている
      # 照度そのもので、+12は約10,000 lx。夜は底の-6になる（core.yamlのhour）ため成立せず、雨天は
      # 最も明るい小雨の正午でも届かないため、天候を見る必要がない。土地ごとの効き方は
      # LiquidContainerSystem.md 6節。
      - conditions:
          - {subject: self, matches: {tag: narrow_open_container}}
          - {subject: ancestor, prop: ambient_brightness, gte: 12}
        add:
          self:
            fill: -2
      - conditions:
          - {subject: self, matches: {tag: wide_open_container}}
          - {subject: ancestor, prop: ambient_brightness, gte: 14}
        add:
          self:
            fill: -1
      - conditions:
          - {subject: self, matches: {tag: narrow_open_container}}
          - {subject: ancestor, prop: ambient_brightness, gte: 14}
        add:
          self:
            fill: -2
      - conditions:
          - {subject: self, matches: {tag: wide_open_container}}
          - {subject: ancestor, prop: ambient_brightness, gte: 16}
        add:
          self:
            fill: -1
      - conditions:
          - {subject: self, matches: {tag: narrow_open_container}}
          - {subject: ancestor, prop: ambient_brightness, gte: 16}
        add:
          self:
            fill: -2

  # 開いた容器に置かれている間、降っている雨のぶんだけ増える（LiquidContainerSystem.md 7節）。
  # ゲートは「容器の開き方」「天候」「雨が届く場所か（sheltered、ContainerSystem.md 6節）」の3つ。
  # 雨の強さは3段しかないので、蒸発のような基礎＋上乗せの形は取らず、1行が1つの降り方の量そのものを
  # 表す。満杯を超えた分はrangeが受け止める（fillの上限は容器のcapacity）。
  rain_filled_liquid:
    passives:
      - conditions:
          - {subject: self, matches: {tag: wide_open_container}}
          - {subject: ancestor, prop: sheltered, eq: 0}
          - {subject: ancestor, prop: weather, eq: light_rain}
        add:
          self:
            fill: 10
      - conditions:
          - {subject: self, matches: {tag: wide_open_container}}
          - {subject: ancestor, prop: sheltered, eq: 0}
          - {subject: ancestor, prop: weather, eq: heavy_rain}
        add:
          self:
            fill: 20
      - conditions:
          - {subject: self, matches: {tag: wide_open_container}}
          - {subject: ancestor, prop: sheltered, eq: 0}
          - {subject: ancestor, prop: weather, eq: storm}
        add:
          self:
            fill: 40
      - conditions:
          - {subject: self, matches: {tag: narrow_open_container}}
          - {subject: ancestor, prop: sheltered, eq: 0}
          - {subject: ancestor, prop: weather, eq: light_rain}
        add:
          self:
            fill: 20
      - conditions:
          - {subject: self, matches: {tag: narrow_open_container}}
          - {subject: ancestor, prop: sheltered, eq: 0}
          - {subject: ancestor, prop: weather, eq: heavy_rain}
        add:
          self:
            fill: 40
      - conditions:
          - {subject: self, matches: {tag: narrow_open_container}}
          - {subject: ancestor, prop: sheltered, eq: 0}
          - {subject: ancestor, prop: weather, eq: storm}
        add:
          self:
            fill: 80

object_defs:
  # 中身入りの変種（水入りの水筒など）はロード時に生成される（3.5節）。**一度に入る液体は1種類だけ**
  # ——軸が1本しかないので、水の入った水筒へ茶は注げない。
  # 甕。粘土を焼いて作る（pottery.yaml）。**汲み置きできる唯一の容器**で、これが入るまで運べる水は
  # 青いヤシの実だけだった（docs/world/Voyage.md）。
  jar:
    # fragileは、動物がぶつかって壊しうる物（docs/engine/HuntingSystem.md 5.4節）。素焼きは
    # 落とせば割れる。potteryは覆い焼きの炉の枠が見るタグで、焼き上がりがその枠に残るために要る
    # （pottery.yaml）。
    tags: [item, fragile, pottery]
    traits: [liquid_container, narrow_open_container, rain_catching_container]
    props:
      # 抱えられる量（mL）。**空の容器も持つ**——空とは量が0であることで、増やせるのは中身の
      # traitを配られた変種だけ。尽きたら中身の軸を落として空の容器へ戻る
      # （LiquidContainerSystem.md 1節）。
      fill:
        value: 0
        range: {min: 0, max: 4000}
        on_min:
          become: {content: none}
      weight: {value: 1200}
      volume: {value: 15000}
    variation_axes:
      content: {of: {tag: liquid}}

  # ヤシの殻。割ったヤシの実から果肉を掻き出すと残る（coconut.yaml）。
  coconut_bowl:
    # fragileは、動物がぶつかって壊しうる物（docs/engine/HuntingSystem.md 5.4節）。薄い殻の器は
    # 踏まれれば割れ、入っていた液体は残らない（中身は容器自身のfillなので、割れれば一緒に消える）。
    tags: [item, fragile]
    traits: [liquid_container, wide_open_container, rain_catching_container]
    props:
      # 抱えられる量（mL）。**空の容器も持つ**——空とは量が0であることで、増やせるのは中身の
      # traitを配られた変種だけ。尽きたら中身の軸を落として空の容器へ戻る
      # （LiquidContainerSystem.md 1節）。
      fill:
        value: 0
        range: {min: 0, max: 250}
        on_min:
          become: {content: none}
      weight: {value: 100}
      # 半球の殻は重ねて入るので、1個ぶんの外寸より小さく見る。
      volume: {value: 200}
    variation_axes:
      content: {of: {tag: liquid}}

  # 液体は軸の値であり、配られるtraitの束。インスタンスは作られないので、traits以外は宣言しない
  # （axisVariants.tsが検査する）。
  #
  # 雨として降るのは水なので、rain_filled_liquidを持つのは水だけ。茶・油が入った容器は、
  # 開いていても雨で増えない。
  water_liquid:
    traits: [liquid, water_liquid, evaporating_liquid, rain_filled_liquid]

  # 雨は水として降るので、rain_filled_liquidは持たない（茶・油と同じ）。開いた器に置けば
  # 湯のまま蒸発する。
  hot_water_liquid:
    traits: [liquid, hot_water_liquid, evaporating_liquid]

  tea_liquid:
    traits: [liquid, tea_liquid, evaporating_liquid]

  oil_liquid:
    traits: [liquid, oil_liquid, evaporating_liquid]
