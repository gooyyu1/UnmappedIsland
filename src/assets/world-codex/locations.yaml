          - weight: 12
            spawn: {object: clay, count: 2, into: self}
          # 3個
          - weight: 18
            spawn:
              - {object: twig, count: 2, into: self}
              - {object: taro, into: self}
          - weight: 12
            spawn: {object: twig, count: 3, into: self}

  # 密林。湿って鬱蒼としており、探索し切るまでが最も長いが、食料は最も豊か。
