      rat_catch: {value: 6}
      # 檻（farming.yamlのpen）に掛かる大型。**探索の重みより低い**——姿を見かけるのと、
      # 自分から檻へ入るのは別の頻度で、探索の`_find`とは別のつまみになっている（同3節）。
      wild_boar_catch: {value: 2}
      # 探索で出くわす獣の重み（docs/world/Animals.md 8節）。
      rat_find: {value: 3}
      monkey_find: {value: 4}
      wild_boar_find: {value: 3}
      # 木苺の茂みが見つかる候補の重み。
      berry_find:
        value: 15
      # 湧き水が見つかる候補の重み。
      spring_find:
        value: 10
      # 斧で倒せる木が1本見つかる候補の重み（timber.yaml）。丸太の出どころなので、森を特徴づける。
      tree_find:
        value: 15
    interactions:
      explore:
        trigger: menu
        conditions:
          - reason: too_dark
            subject: agent
            prop: looking_brightness
            in_stage_or_above: bright
        duration: 15
        add: {self: {exploration_progress: 1}}
        pick:
          # 1個
