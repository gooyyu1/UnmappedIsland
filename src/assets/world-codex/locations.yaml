# 土地（location）と道（path）の定義（TerrainGeneration.md・ExplorationSystem.md・
# GameElementDefinition.md参照）。地形生成そのもの（どの土地がいくつ・どう繋がって生成されるか）は
# terrain_generation.yamlとDomain/Generationの生成パイプラインが担う。
#
# すべての土地は location trait（core.yaml参照）と、このファイルで定義する explorable trait を
# 実装する。「探索で何が見つかるか」「探索率100%までの探索回数」は地形ごとに異なるため、explorable
# traitには持たせず、各土地のobject_defが探索アクション（explore）として個別に定義する。

traits:
  # 探索できる場所だけが追加で持つ構造。
  explorable:
    slots:
      # 生成時に設置物を隠しておくスロット。探索の進捗が設置物のrequired_progressへ達すると、
      # Location（Views）がfixturesスロットへ移して「発見」させる。UI側は表示しない。
      #
      # locationのfixturesスロットより後に宣言すること。探索でその場に湧く設置物（explore内の
      # spawn）は宣言順で最初に受け入れたスロットへ入るため、先に置くと湧いた側まで隠れてしまう。
      undiscovered_fixtures:
        cell: {accept: {tag: fixture}}
        # **誰にも入れさせない**（7.7節）。生成が名指しで入れ、発見で fixtures へ移るだけ。fixtureを
        # 無条件に受け入れるうえ外からは見えないので、行き先の無い設置物がここへ落ちると、探索する
        # まで画面から消えたままになる。
        placement: []
    props:
      # 探索の進捗。値なし（{}）のため、各土地のobject_def側でvalue/range（探索率100%=range.max）
      # を必ず与える（5節の「traitでvalueなし=継承先で必須」の規約）。
      exploration_progress: {}

object_defs:
  # ------------------------------------------------------------------
  # 道（path）。土地と土地の繋がり1本の片方向分。地形生成が辺1本につき両端へ1個ずつ生成し、
  # destination_idが相手側を指す（発見の進み方は両端で非対称になりうる）。
  # 持ち歩けないものなので設置物（fixture）の一種として、木や建物と同じfixturesスロットに並ぶ。
  # - travel_minutes: 移動時間（分）。距離と移動難易度から生成時に計算され、インスタンスごとに
  #   上書きされる（TerrainGeneration.md 3.5節）。
  # - required_progress: 親の土地のexploration_progressがこの値に達すると発見される。
  # - destination_id: 移動先LocationのインスタンスID。生成時に確定する個体への参照のため、
  #   object_def参照ではなくインスタンスIDのプロパティで持つ（moveの規約）。
  # ------------------------------------------------------------------
  path:
    # fixtureは「持ち歩けない」という置き場所の分類、pathは「移動手段である」という役割。
    # 画面側は後者を見て、道のカードだけ移動先の土地名を表示する。
    tags: [fixture, path]
    # 繋がる土地の無い道は存在しない（7.9節）。土地から外せず、土地が消えれば一緒に消える。
    bound_to_owner: true
    # 行き先が個体ごとに違うので束ねない。束ねると代表の行き先しかカードに出せなくなる（4節）。
    stackable: false
    props:
      # 道は地形そのものなので目方を持たない（浅い洞窟と同じ、ContainerSystem.md 1節）。
      # 筏から岸への道のように、重さを持つ物へ繋ぐ道もありうるため、0を明示する。
      weight: {value: 0}
      travel_minutes:
        value: 60
      required_progress:
        value: 1
      destination_id:
        value: 0
      # 移動先の土地にある、こちらへ戻る道のインスタンスID。辺1本の両端の道が互いを指す
      # （生成時に相互に書き込まれる）。片方が見つかったらもう片方も一緒に見つかることで、
      # 渡った先から必ず戻れる（ExplorationSystem.md 3.1節）。
      return_path_id:
        value: 0
    interactions:
      travel:
        trigger: menu
        conditions:
          - {in_slot: fixtures}   # 未発見（undiscovered_fixtures側）の間は実行できない
          # 荷が重すぎると動けない。段の名前で見るので、境目はキャラクタのloadのstagesだけが持つ
          # （ContainerSystem.md 5節）。
          - reason: too_heavy
            not: {subject: agent, prop: load, in_stage_or_above: too_heavy}
          # 暗ければ道は歩けない（IlluminationSystem.md 5節）。**出発する土地の明るさで決まる**
          # ——道は自分の明るさを持たず、条件から行き先の土地は辿れない。見るのは視界の側なので、
          # 持ち歩ける光源だけが効く（据えた焚き火のそばから夜の道へは出られない、同3節）。
          # 荷と同じく段の名前で見るので、境目はキャラクタのlooking_brightnessのstagesだけが持つ。
          - reason: too_dark
            not: {subject: agent, prop: looking_brightness, in_stage: pitch_dark}
        # 道ごとの所要時間へ、担ぎ手の遅れ（pace、素は1）を掛ける（Characters.md 荷重の効き方節）。
        # 和ではなく積なので、長い道ほど遅れも大きくなり、遅れの量を道ごとに書かずに済む。
        duration: {prop: travel_minutes, times: {subject: agent, prop: pace}}
        move:
          subject: agent
          to_prop: destination_id

  # ------------------------------------------------------------------
  # 探索で見つかる発見物（アイテム）。itemタグによって土地のitemsスロットへ振り分けられる。
  # thick_branch/stone/twigは工作・燃料などの素材。枯れ草（dry_grass）はfire.yamlが定義する。
  # exploreが湧かせるヤシの実（coconut）はcoconut.yamlが定義する。
  # ------------------------------------------------------------------

  # 太い枝。腕ほどの太さで70cmほど、削れば道具の柄になる大きさ（小枝は柄にすると折れる）。
  # 建材の丸太はこれとは別の物として後から入るので、ここを丸太まで大きくしない。
  thick_branch:
    tags: [item]
    # 燃料としての量はfire.yamlのburnable traitが持つ。
    traits: [burnable]
    props:
      weight: {value: 1000}
      volume: {value: 1300}
      # 太い枝1本で、炎を100分ほど保てる（docs/engine/FireSystem.md 2.3節）。
      fuel: {value: 20}

  # 石。石同士を打ち合わせると、片方が割れて尖った石（tools.yaml）になる。
  # 打ち合わせる相手（instrument）は槌として残り、割られる側（self）だけが尖った石へ置き換わる。
  # 炉の火の中の枠へも入り、熱を溜め切ると焼け石（fire.yamlのhot_stone）になる
  # （docs/engine/FireSystem.md 9.1節）。**炉の札へ重ねると石を積む操作になる**ので、火の中へ
  # 入れるのは開いた枠へ落とす側（docs/ui/CardInteraction.md 2節）。
  stone:
    tags: [item]
    traits: [heat_soaking]
    props:
      weight: {value: 1000}
      volume: {value: 700}
      heat_soak:
        on_max:
          destroy: self
          spawn: {object: hot_stone}
    interactions:
      knap:
        trigger: {drag: {object: stone}}
        # 狙った縁を打ち欠く手元の作業（IlluminationSystem.md 5節）。据え付けの光源も効くので、
        # 焚き火のそばなら夜でも打てる。
        conditions:
          - reason: too_dark
            subject: agent
            prop: hand_brightness
            in_stage_or_above: bright
        duration: 60
        # 石器の腕はここから立ち上がる（docs/engine/SkillSystem.md 3節の実行経路、量の置き方は
        # characters/player_character.yaml）。道具を要求しないので、何も持たない状態から回る。
        add: {agent: {skill_knapping: 2}}
        destroy: self
        spawn: {object: sharp_stone}

  # 小枝。指の太さの細い枝を拾い集めたもので、焚き付け・結びに使う。柄にすると折れる。
  # 槍や銛の柄になる2mほどの長い棒は、拾う物ではなく若木を刃物で切って採る別の物として後から入る
  # （docs/world/SurvivalItems.md 0節）。ここを長くして兼ねさせない。
  twig:
    tags: [item]
    # 火口にも燃料にもなる（docs/engine/FireSystem.md 3.2節）。火起こし具へ重ねれば焚き付けとして
    # 燃え、炉へ重ねれば燃料。摩擦の熾を受け止めるには太すぎるので、火口タグは持たない。
    traits: [burnable]
    props:
      weight: {value: 300}
      volume: {value: 500}
      # 小枝1本で、熾火を1時間半ほど保てる。
      fuel: {value: 3}

  # ------------------------------------------------------------------
  # 探索で見つかる設置物。fixtureタグによって土地のfixturesスロットへ振り分けられる。
  # ベリーの茂みと湧き水は発見されるだけのプレースホルダ（採取の振る舞いは今後の課題）。
  # exploreが湧かせるヤシの木（palm_tree）はcoconut.yamlが定義する。
  # ------------------------------------------------------------------

  # ベリーの茂み。定期的に実を付ける採取ポイントになる想定。
  berry_bush:
    tags: [fixture]
    props:
      # 根の張った低木1株ぶん。
      weight: {value: 15000}

  # 浅い洞窟。岩肌が奥へ少しえぐれただけの空洞で、奥へ続く道は持たない（【いつか: 洞窟内部】、
  # docs/Someday.md）。雨をしのげて物を置ける、見つければ無料で手に入る拠点（Dwellings.md 5節）。
  #
  # **設置物（fixture）でありながら場所（location）でもある**——筏（voyage.yaml）と同じ形で、
  # 中へ入れば location traitのitems/fixtures/charactersがそのまま拠点の枠になる。
  # 土地と同じく枠数もかさの上限も置かない（storageを名乗らない）ので、置ける量で洞窟を絞らない。
  # shelterは「雨風をしのげる住まいである」ことを言うタグ（ContentSkeleton.md 3節の系統10）。
  # 岩屋根が雨を防ぐという事実（下のsheltered）を、物の側の名乗りとして持つ。
  shallow_cave:
    tags: [fixture, shelter]
    traits: [location]
    # 中へ置いた物が個体ごとに違うので束ねない（SlotSystem.md 4節）。
    stackable: false
    props:
      # **地形そのものなので、運べる目方を持たない。** 0は宣言漏れではなく、そう決めた印である
      # （ContainerSystem.md 1節）。以下の湧き水・道も同じ。
      weight: {value: 0}
      # 岩陰ぶんの暗さ（IlluminationSystem.md 2節）。土台は親の土地なので、外が暮れれば中も暮れる。
      # **-6は暗さの底ではなく外との差**——空を継がない真っ暗（同7節）は奥の洞窟の値で、ここは
      # 日の差さない岩陰にすぎない。この差だと境目が世界の環境光+11（曇りの正午、同8節のbright段の
      # 下端）に載るので、**外が曇りの正午より明るければ中でも手元の作業ができる**（しきい値+5、同5節）。
      ambient_brightness: {value: -6}
      # 岩屋根が雨を防ぐ（ContainerSystem.md 6節）。雨を見ている条件（fire.yamlの炉・
      # liquid_containers.yamlの雨受け）は`ancestor`＝同名を宣言している最初の祖先で止まるため、
      # 中の物には雨が当たらない（GameElementDefinition.md 8.6節）。
      # **天気そのものは外と同じ**——中で空が曇るわけではないので、外が雨なら中でも雨天のまま
      # 暗く、蒸発も雨天として止まる。
      sheltered: {value: 1}
    interactions:
      # 入る。**洞窟は場所なので、中の仕事は中に入らないとできない**（筏のboardと同じ）。
      # 既に中に居るときは移動が空振りするだけなので、条件は置かない。
      enter:
        trigger: menu
        duration: 5
        move: {subject: agent, to: self}

      # 出る。**明るさの条件は置かない**——置くと、夜に入った者が朝まで出られなくなる。
      leave:
        trigger: menu
        duration: 5
        move: {subject: agent, to: parent}

  # 湧き水。飲用・補水ポイントになる想定。
  spring:
    tags: [fixture]
    props:
      weight: {value: 0}

  # ------------------------------------------------------------------
  # 土地。すべて traits: [location, explorable]。
  # - exploration_progress.range.max = 探索率100%に達するまでの探索回数（10〜20）。100%に達しても
  #   探索は続けられ（進捗はrangeの上限に張り付く）、生成時に仕込まれた道がそれ以上見つからなくなるだけ。
  # - exploreのpickは「その土地で何が見つかるか」の確率テーブル。進捗+1（add self）は
  #   どの候補が選ばれても起こるので、pickの外に1つだけ置く（9.7節）。
  # - どの候補も1個以上を必ず見つける（ハズレの候補は置かない）。1回で見つかる数は候補ごとに1〜3個で、
  #   実りの多い土地は平均2個、荒野・山頂・岸壁のような乏しい土地は平均1.6個になるよう重みを配る
  #   （tests/world-codex/explorationYield.test.tsが検証する）。設置物（木・茂み・洞窟の入口など）は
  #   1回に1つまでにし、数で増えるのはアイテムだけにする。
  # - 生きた獣（animals.yaml）は**単独の候補**にする。収穫ではなく出くわすものなので、他の物と一緒に
  #   見つかると「実り」に混ざってしまう（docs/engine/ExplorationSystem.md 2.1節）。
  # - 獣の候補の重みには、**探索する人の狩猟の腕（quarry_sense）を掛ける**
  #   （docs/world/Skills.md 5節）。土地が持つのは素の重みで、腕は倍率だけを持つ——**獣が増える
  #   のではなく、居る獣に気づけるようになる**。掛けるのは獣の候補だけで、実りの候補には掛けない。
  # - ambient_brightnessは樹冠と地面の反射の合計（core.yamlのlocation traitが土台と底を持つ）。
  #   内訳はContentSkeleton.md 8.1.2節の表で、ここに書くのは合計だけ。
  # - exploreは視界の明るさを要求する（IlluminationSystem.md 5節）。据え付けの光源は視界に効かない
  #   ため、**夜の採取は光源を持って出るしかない**。
  # - durationは1回の探索にかかる時間（分）。全土地で1tick（minutes_per_tick、core.yaml）に揃える。
  #   土地ごとの探索の重さは、回数（exploration_progress.range.max）だけで表す。
  # - `weight: {prop: ...}`の候補は**発見量のつまみ**。valueが素の重みで、亜種
  #   （terrain_generation.yamlのvariants、TerrainGeneration.md 3.6節）が個体ごとに上書きする。
  #   亜種で変えたい候補にだけ足す。つまみを増やすほど「この土地らしさ」の調整点も増えるので、
  #   その土地を特徴づける候補（洞窟・水場・実りなど）に絞る。
  # ------------------------------------------------------------------

  # 砂浜。開けていて歩きやすく、漂着物とヤシの実に恵まれる。
  sandy_beach:
    # 海に面した土地。ここからだけ航海に出られる（voyage.yamlのcoast trait）。
    traits: [location, explorable, coast]
    props:
      # 遠浅の浜からは、陸がまだ見えている海へそのまま漕ぎ出す。**本土まで14区間で最も遠いが、
      # 序盤に補給の当てになる海区が続く**（voyage.yamlのcoast trait）。
      offshore_coastal_waters: {value: 1}
      # 遮るものが無く、乾いた砂がよく返す。**島で最も明るい地面**で、上限+17の根拠でもある
      # （IlluminationSystem.md 4節）。
      ambient_brightness: {value: 1}
      exploration_progress:
        value: 0
        range: {min: 0, max: 10}
      # 罠に掛かる重み（docs/engine/TrapSystem.md 3節）。宣言した動物だけが、その土地の
      # 罠の候補に載る。どの型の罠に載るかは、罠の側が並べた候補の一覧が決める（同1.1節）。
      rat_catch: {value: 4}
      # 探索で出くわす獣の重み（docs/world/Animals.md 8節）。
      rat_find: {value: 2}
      monkey_find: {value: 4}
      # ヤシの木が1本だけ見つかる候補の重み。亜種が上書きする（terrain_generation.yaml）。
      palm_find:
        value: 13
      # 打ち上げられた流木の幹が1本だけ見つかる候補の重み。**下の`driftwood_find`とは別のつまみ**
      # ——あちらが出すのは枝ぶりの流木で、幹はこちら。亜種（流木の浜）は両方を増やす。
      driftwood_trunk_find:
        value: 6
      # ヤシガニが1匹だけ見つかる候補の重み。
      crab_find:
        value: 7
      # 太い枝2本とヤシガニが見つかる候補の重み。
      driftwood_find:
        value: 12
    interactions:
      explore:
        trigger: menu
        conditions:
          - reason: too_dark
            subject: agent
            prop: looking_brightness
            in_stage_or_above: bright
        duration: 15
        add: {self: {exploration_progress: 1}}
        pick:
          # 1個
          - weight: {prop: palm_find}
            spawn: {object: palm_tree, into: self}
          # 打ち上げられた流木の幹（timber.yaml）。海岸3種すべてに寄る。
          - weight: {prop: driftwood_trunk_find}
            spawn: {object: driftwood_trunk, into: self}
          - weight: 5
            spawn: {object: woven_basket, into: self}
          - weight: {prop: crab_find}
            spawn: {object: coconut_crab, into: self}
          # 出くわす獣（収穫ではないので、単独で出る）
          - weight: {prop: rat_find, times: {subject: agent, prop: quarry_sense}}
            spawn: {object: rat, into: self}
          - weight: {prop: monkey_find, times: {subject: agent, prop: quarry_sense}}
            spawn: {object: monkey, into: self}
          # 2個
          - weight: 20
            spawn: {object: coconut, count: 2, into: self}
          - weight: 15
            spawn:
              - {object: coconut, into: self}
              - {object: thick_branch, into: self}
          - weight: 10
            spawn:
              - {object: thick_branch, into: self}
              - {object: coconut_crab, into: self}
          # 3個
          - weight: 18
            spawn:
              - {object: coconut, count: 2, into: self}
              - {object: thick_branch, into: self}
          - weight: {prop: driftwood_find}
            spawn:
              - {object: thick_branch, count: 2, into: self}
              - {object: coconut_crab, into: self}

  # 岩だらけの海岸。石とヤシガニが多いが、足場が悪い。
  rocky_coast:
    # 海に面した土地。ここからだけ航海に出られる（voyage.yamlのcoast trait）。
    traits: [location, explorable, coast]
    props:
      # 岩の鼻に潮が当たるので、漕ぎ出せばすぐ流れのぶつかる帯に出る。**本土まで12区間で、島影の海と
      # 海藻の帯を跨ぐ**（voyage.yamlのcoast trait）。
      offshore_tide_rip: {value: 1}
      # 遮るものが無く、地面は基準の明るさ。
      ambient_brightness: {value: 0}
      exploration_progress:
        value: 0
        range: {min: 0, max: 12}
      # 罠に掛かる重み（docs/engine/TrapSystem.md 3節）。宣言した動物だけが、その土地の
      # 罠の候補に載る。どの型の罠に載るかは、罠の側が並べた候補の一覧が決める（同1.1節）。
      rat_catch: {value: 4}
      # 探索で出くわす獣の重み（docs/world/Animals.md 8節）。
      rat_find: {value: 2}
      monkey_find: {value: 4}
      # 洞窟の入口が見つかる候補の重み。
      cave_find:
        value: 13
      # ヤシガニが1匹だけ見つかる候補の重み。
      crab_find:
        value: 12
      # 打ち上げられた流木の幹が1本だけ見つかる候補の重み。
      driftwood_trunk_find:
        value: 8
    interactions:
      explore:
        trigger: menu
        conditions:
          - reason: too_dark
            subject: agent
            prop: looking_brightness
            in_stage_or_above: bright
        duration: 15
        add: {self: {exploration_progress: 1}}
        pick:
          # 1個
          - weight: {prop: cave_find}
            spawn: {object: shallow_cave, into: self}
          - weight: {prop: crab_find}
            spawn: {object: coconut_crab, into: self}
          # 打ち上げられた流木の幹（timber.yaml）。海岸3種すべてに寄る。
          - weight: {prop: driftwood_trunk_find}
            spawn: {object: driftwood_trunk, into: self}
          # 出くわす獣（収穫ではないので、単独で出る）
          - weight: {prop: rat_find, times: {subject: agent, prop: quarry_sense}}
            spawn: {object: rat, into: self}
          - weight: {prop: monkey_find, times: {subject: agent, prop: quarry_sense}}
            spawn: {object: monkey, into: self}
          # 2個
          # 漂着物。ヤシの実は海を渡って流れ着くので、ヤシの生えない岩場にも寄る。
          - weight: 12
            spawn:
              - {object: coconut, into: self}
              - {object: thick_branch, into: self}
          - weight: 20
            spawn: {object: stone, count: 2, into: self}
          - weight: 15
            spawn:
              - {object: stone, into: self}
              - {object: coconut_crab, into: self}
          - weight: 10
            spawn:
              - {object: stone, into: self}
              - {object: thick_branch, into: self}
          # 3個
          - weight: 18
            spawn:
              - {object: stone, count: 2, into: self}
              - {object: thick_branch, into: self}
          - weight: 12
            spawn:
              - {object: stone, count: 2, into: self}
              - {object: coconut_crab, into: self}

  # 岸壁。切り立った崖の海岸。得られるものは少ないが、洞窟が口を開けていることがある。
  cliff_coast:
    # 海に面した土地。ここからだけ航海に出られる（voyage.yamlのcoast trait）。
    traits: [location, explorable, coast]
    props:
      # 崖の下はすぐ深く、海鳥の集まる岩へそのまま続いている。**本土まで10区間で最も近いが、その先は
      # 補給の当てが無い海区が続く**（voyage.yamlのcoast trait）。
      offshore_gull_rock: {value: 1}
      # 遮るものが無く、地面は基準の明るさ。
      ambient_brightness: {value: 0}
      exploration_progress:
        value: 0
        range: {min: 0, max: 10}
      # 罠に掛かる重み（docs/engine/TrapSystem.md 3節）。宣言した動物だけが、その土地の
      # 罠の候補に載る。どの型の罠に載るかは、罠の側が並べた候補の一覧が決める（同1.1節）。
      rat_catch: {value: 4}
      # 探索で出くわす獣の重み（docs/world/Animals.md 8節）。
      rat_find: {value: 2}
      monkey_find: {value: 4}
      # 洞窟の入口が見つかる候補の重み。
      cave_find:
        value: 20
      # 金の聖杯が見つかる候補の重み（artifacts.yaml）。**一度見つけたらその土地では二度と出ない**
      # ——候補自身が自分の重みを0にする。島に幾つも転がっていては、持ち帰る意味が薄れる。
      chalice_find:
        value: 4
      # 打ち上げられた流木の幹が1本だけ見つかる候補の重み。
      driftwood_trunk_find:
        value: 8
    interactions:
      explore:
        trigger: menu
        conditions:
          - reason: too_dark
            subject: agent
            prop: looking_brightness
            in_stage_or_above: bright
        duration: 15
        add: {self: {exploration_progress: 1}}
        pick:
          # 1個
          - weight: {prop: cave_find}
            spawn: {object: shallow_cave, into: self}
          - weight: {prop: chalice_find}
            set: {self: {chalice_find: 0}}
            spawn: {object: golden_chalice, into: self}
          - weight: 30
            spawn: {object: stone, into: self}
          # 打ち上げられた流木の幹（timber.yaml）。海岸3種すべてに寄る。
          - weight: {prop: driftwood_trunk_find}
            spawn: {object: driftwood_trunk, into: self}
          # 出くわす獣（収穫ではないので、単独で出る）
          - weight: {prop: rat_find, times: {subject: agent, prop: quarry_sense}}
            spawn: {object: rat, into: self}
          - weight: {prop: monkey_find, times: {subject: agent, prop: quarry_sense}}
            spawn: {object: monkey, into: self}
          # 2個
          # 漂着物。ヤシの実は海を渡って流れ着くので、ヤシの生えない崖下にも寄る。
          - weight: 12
            spawn:
              - {object: coconut, into: self}
              - {object: thick_branch, into: self}
          - weight: 25
            spawn: {object: stone, count: 2, into: self}
          - weight: 17
            spawn:
              - {object: stone, into: self}
              - {object: thick_branch, into: self}
          # 3個
          - weight: 8
            spawn:
              - {object: stone, count: 2, into: self}
              - {object: thick_branch, into: self}

  # 草原。見通しがよく歩きやすい。食べられる野草と水場に恵まれる。
  grassland:
    traits: [location, explorable]
    props:
      # 遮るものが無く、地面は基準の明るさ。
      ambient_brightness: {value: 0}
      exploration_progress:
        value: 0
        range: {min: 0, max: 12}
      # 罠に掛かる重み（docs/engine/TrapSystem.md 3節）。宣言した動物だけが、その土地の
      # 罠の候補に載る。どの型の罠に載るかは、罠の側が並べた候補の一覧が決める（同1.1節）。
      rat_catch: {value: 6}
      junglefowl_catch: {value: 10}
      # 探索で出くわす獣の重み（docs/world/Animals.md 8節）。
      rat_find: {value: 3}
      junglefowl_find: {value: 4}
      # 木苺の茂みが見つかる候補の重み。
      berry_find:
        value: 15
      # 湧き水が見つかる候補の重み。
      spring_find:
        value: 10
    interactions:
      explore:
        trigger: menu
        conditions:
          - reason: too_dark
            subject: agent
            prop: looking_brightness
            in_stage_or_above: bright
        duration: 15
        add: {self: {exploration_progress: 1}}
        pick:
          # 1個
          - weight: {prop: berry_find}
            spawn: {object: berry_bush, into: self}
          - weight: {prop: spring_find}
            spawn: {object: spring, into: self}
          # 出くわす獣（収穫ではないので、単独で出る）
          - weight: {prop: rat_find, times: {subject: agent, prop: quarry_sense}}
            spawn: {object: rat, into: self}
          - weight: {prop: junglefowl_find, times: {subject: agent, prop: quarry_sense}}
            spawn: {object: junglefowl, into: self}
          # 2個
          - weight: 18
            spawn: {object: water_spinach, count: 2, into: self}
          - weight: 17
            spawn:
              - {object: water_spinach, into: self}
              - {object: taro, into: self}
          - weight: 10
            spawn: {object: taro, count: 2, into: self}
          - weight: 12
            spawn:
              - {object: dry_grass, into: self}
              - {object: water_spinach, into: self}
          # 粘土は水際に堆積するので、水気のある土地（草地・森林・密林）にだけ置く（pottery.yaml）。
          # 壺1つ分をまとめて掘り取る。**2個の候補なので、足しても1回あたりの平均個数（約2個）は
          # ほとんど動かない**——上の「平均2個」の配りは、既存の重みを触らずに保てる。
          - weight: 14
            spawn: {object: clay, count: 2, into: self}
          # 3個
          - weight: 18
            spawn:
              - {object: water_spinach, count: 2, into: self}
              - {object: taro, into: self}
          - weight: 12
            spawn:
              - {object: taro, count: 2, into: self}
              - {object: water_spinach, into: self}

  # 森林。木々に囲まれ、小枝・木の実・水場が見つかる。
