      ambient_brightness: {value: -9}
      exploration_progress:
        value: 0
        range: {min: 0, max: 18}
      # 罠に掛かる重み（docs/engine/TrapSystem.md 3節）。宣言した動物だけが、その土地の
      # 罠の候補に載る。どの型の罠に載るかは、罠の側が並べた候補の一覧が決める（同1.1節）。
      rat_catch: {value: 6}
      junglefowl_catch: {value: 8}
      # 檻（farming.yamlのpen）に掛かる大型。森と同じ重み——イノシシの居方は
      # `wild_boar_find`が両方3で並んでいるとおりで、檻の側で差を付ける理由が無い。
      wild_boar_catch: {value: 2}
      # 探索で出くわす獣の重み（docs/world/Animals.md 8節）。
      rat_find: {value: 3}
      junglefowl_find: {value: 3}
      monkey_find: {value: 4}
      wild_boar_find: {value: 3}
      # ヤシの木が1本だけ見つかる候補の重み。
      palm_find:
        value: 15
      # タロイモが1つだけ見つかる候補の重み。
      taro_find:
        value: 10
      # 斧で倒せる木が1本見つかる候補の重み（timber.yaml）。
      tree_find:
        value: 12
    interactions:
