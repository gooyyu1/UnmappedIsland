          - weight: {prop: monkey_find, times: {subject: agent, prop: quarry_sense}}
            spawn: {object: monkey, into: self}
          - weight: {prop: wild_boar_find, times: {subject: agent, prop: quarry_sense}}
            spawn: {object: wild_boar, into: self}
          # 2個
