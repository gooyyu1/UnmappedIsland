# シンボル型プロパティの値（GameElementDefinition.md 6.6節）。天気は状況エリアの空の窓に名前として
# 出るので、絵だけでは見分けられない晴天どうし（晴れ・快晴・灼熱）を名前が区別する。
# 天気の名前には次の2つを使わない。
# ・「暑」の字（酷暑・猛暑など）。天気が表すのは日射そのもの（＝原因）で、気温の暑さはそこから
#   生まれる結果であり、別のプロパティ（ambient_temperature）が持つ。灼熱の「熱」は日射の熱さ。
# ・気象庁の定義を持つ語（猛暑日=35℃以上、真夏日=30℃以上）。気温を決める値はいずれも仮の値なので、
#   数値の定義を持つ名前は調整のたびに実態とずれる。
symbol_texts:
  # 天気（ClimateSystem.md 4節）。日射の弱い順。
  storm:
    display_name: 嵐
  heavy_rain:
    display_name: 大雨
  light_rain:
    display_name: 小雨
  cloudy:
    display_name: 曇り
  clear:
    display_name: 晴れ
  sunny:
    display_name: 快晴
  scorching:
    display_name: 灼熱
  # 季節（ClimateSystem.md 2節）。calm→wet→dryの固定順で巡回する。
  calm:
    display_name: 穏やかな季節
  wet:
    display_name: 雨季
  dry:
    display_name: 乾季
  # 風向き（docs/world/Voyage.md 3.1節）。本土へ向かう向きを基準にした3つ。
  tailwind:
    display_name: 追い風
  crosswind:
    display_name: 横風
  headwind:
    display_name: 向かい風

