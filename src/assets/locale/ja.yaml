# 日本語の表示文字列（docs/engine/Localization.md 参照）。
#
# キーはWorldCodexの識別子で、値が画面に出す文字列。WorldCodex側は識別子だけを持ち、
# 表示文字列はこのファイルにだけ書く。ここに無い識別子は、そのまま識別子が表示される。
#
# defaultエントリは、オブジェクト側に定義が無かったときのメンバー（props/actions/combinations）の
# フォールバック。同じ名前のプロパティ・アクションを多くのオブジェクトが共有するため、
# 「特に断らなければこの文字列」をここへ1回だけ書く。

# スロットの表示文字列（子ウィンドウの見出し）。スロットは必ず持ち主のものなので、持ち主込みの
# 言い方をdefaultの書式から組み立てる（中身入りの入れ物の名前と同じ考え方）。
slot_texts:
  default:
    # {slot}がスロットの名前、{owner}が持ち主の名前。
    display_name_with_owner: '{owner}の{slot}'
  contents:
    display_name: 中身
  # 土地・筏（voyage.yaml）が持つアイテムのスロット。子ウィンドウで開くのは筏だけなので、
  # 「筏の積荷」と読める言葉を当てる（土地のアイテムはレーンに出るので見出しを持たない）。
  items:
    display_name: 積荷
  # 場所へ組み込まれている部品（筏の帆、Dwellings.md 1節の住居の壁）。中へ入って現在地の札を
  # 押すと開く。
  structure:
    display_name: 部品
  # 製作中オブジェクトの材料スロット（レシピから自動生成される、inProgressObjects.ts）。
  materials:
    display_name: 材料
  treatment:
    display_name: 手当て
    # 枠へ入れる操作の吹き出し（ドラッグ中に出す）。スロットの名前が場所を指すのに対し、こちらは行為。
    put_in:
      display_name: 手当てする
      description: 治療具を当てる。当てている間だけ効き、外せば効き目も消える。
  equipment:
    display_name: 装備
  injuries:
    display_name: 怪我
  spoils:
    display_name: くわえた物
  # 畑に実ったもの（farming.yaml）。撒くのは畑のカードへ重ねる操作なので、枠へ入れる口は持たない。
  crop:
    display_name: 実り
  # 罠に掛かった獣と、囲いの中の獣（traps.yaml・farming.yaml）。**檻と家畜の囲いは1つの型**
  # （docs/engine/TrapSystem.md 1.2節）で、枠も1つなので見出しも1つ。死体も同じ枠に残る。
  catch:
    display_name: 獣
  # 干し場に掛けてある食べ物（drying.yaml）。
  drying:
    display_name: 干している物

object_texts:
  # 全オブジェクト共通のメンバー。ここにdisplay_name/descriptionを書いても、
  # オブジェクト自身の表示名としては使われない（Localization.md 参照）。
  default:
    # 変種（GameElementDefinition.md 3.5.1節）の名前。軸の名前ごとに書式を持つ。
    # {base}が素の型の名前、{value}がその軸の値の名前。言い方を変えたい型だけが自分のエントリで上書きする。
    variation_names:
      content: '{value}入りの{base}'
      # 保存加工（salt.yaml）。**加工の名前を前へ置くだけ**にして、加工の種類が増えても書式を
      # 増やさない（「塩漬けの空心菜」「燻製の空心菜」）。
      cure: '{value}の{base}'
      # 製作中オブジェクト（レシピの軸）。**完成品と同じ名前にする。** カード名は枠の中の1行
      # （全角10文字）に収まる長さで書いてあり、そこへ「作りかけの」の5文字を足すと4文字より長い名前は
      # すべてはみ出す。作りかけであることは青い覆いが示す（CardView.md 10節）ので、名前で言い直さない。
      recipe: '{base}'
    props:
      # iconは、ステータスの行の左に名前の代わりに出す絵（docs/ui/StatusArea.md 3節）。
      # キャラクタのプロパティはどれも固定表示にできる＝ステータスエリアへ出せるので、全部が持つ。
      # 今は絵文字だが、絵が用意でき次第そちらへ差し替える。
      exploration_progress:
        display_name: 探索の進み具合
        description: この土地をどれだけ調べ尽くしたか。100%に達しても探索は続けられるが、隠された道はもう見つからない。
      size:
        display_name: 量
      # 干し上がるまでの残り（drying.yaml）。**食べ物11種が同じ名前で持つ**ので既定に置く。
      # 塩田は同じ名前で別のもの（次の1杯が塩になるまで）を数えるので、自分のエントリで上書きする。
      drying_remaining:
        display_name: 干し上がるまで
        description: 干物になるまでに、あとどれだけ強い日差しが要るか。日の当たる地面に並べるか、干し場に掛けている間だけ減る。
      travel_minutes:
        display_name: 移動時間
      crossing_minutes:
        display_name: 横断にかかる時間
        description: 次の海区へ渡るのにかかる時間。海流・積んだ重さ・帆で伸び縮みし、そこへ航路ごとの風の受け方が加わる。
      storm_drift:
        display_name: 荒天にさらされた時間
        description: この海区で筏が荒天に叩かれ続けた長さ。溜まり切ると風下の海区へ押し流される。横風の間は溜まらない。
      required_progress:
        display_name: 発見に必要な探索の進み具合
      weight:
        display_name: 重さ
        icon: ⚖️
        description: その物と、中に入れている物とを合わせた目方。
      load:
        display_name: 荷重
        icon: 🎒
        description: 今の担ぎ方で感じている、持ち物と装備の重さ。重すぎると歩けなくなる。
      pace:
        display_name: 歩みの遅さ
        icon: 👣
        description: 道を渡るのにかかる時間の倍率。荷が重いほど大きくなり、長い道ほど遅れも開く。
      ambient_brightness:
        display_name: 明るさ
        description: その場を満たしている明るさ。空の明るさに、樹冠と地面の照り返しが効く。
      hand_brightness:
        display_name: 手元の明るさ
        icon: 🕯️
        description: 手元の細かい作業ができるかを決める明るさ。据えた炉の火も、持っている明かりも効く。
      looking_brightness:
        display_name: 視界の明るさ
        icon: 👁️
        description: 屋外で採れるか、道を歩けるかを決める明るさ。持ち歩ける明かりだけが効く。
      sheltered:
        display_name: 雨よけ
        icon: 🛖
        description: 屋根や岩陰に守られていて、雨に打たれず日も差さない場所に居るかどうか。
      wind_speed:
        display_name: 風雨
        icon: 🌪️
        description: その身に当たっている風の強さ。嵐になると屋外では採れなくなる。屋根の下では止む。
      pain:
        display_name: 痛み
        icon: 💢
        description: 今感じている痛みの強さ。負っている怪我と体調の不良が重なるほど強くなり、因が引けば戻る。
      durability:
        display_name: 耐久
      heavy_blow:
        display_name: 強打
        description: この武器で打ちかかったとき、打ち砕く一撃になりやすさ。
      light_blow:
        display_name: 浅打
        description: この武器で打ちかかったとき、浅く当たるだけになりやすさ。
      thrust:
        display_name: 刺突
        description: この武器で打ちかかったとき、深く突き通しやすさ。
      whiff:
        display_name: 空振り
        description: この武器で打ちかかったとき、空を切りやすさ。
      severity:
        display_name: 傷の重さ
        description: 残っている傷。時間とともに引いていき、尽きれば治る。
      bleeding:
        display_name: 出血
        description: この傷から流れている血の勢い。押さえれば早く、放っておいてもいずれ固まって止まる。
      infection:
        display_name: 化膿
        description: 開いた傷口に入った汚れ。放っておくほど進み、熱で水が余計に要るようになり、回れば血が漏れ出す。水を掛けて洗えば落ちる。
      blood:
        display_name: 血液量
        icon: 🩸
        description: 体に残っている血。傷から流れ出た分は戻らず、失いすぎれば意識が薄れ、尽きれば死ぬ。
      warmth:
        display_name: 体熱
        icon: 🔥
        description: 体に残っている熱。寒い場所に居ると減り、雨に打たれればなお速い。暖かい所へ戻れば戻り、尽きれば凍えて死ぬ。
      chill_point:
        display_name: 寒さの入口
        icon: 🥶
        description: これを下回る気温の場所に居ると、体の熱が奪われ始める。
      vulnerability:
        display_name: 無防備さ
        description: 狙って急所を打てる度合い。気を失っている相手ほど大きい。
      lurk:
        display_name: 様子見
        description: 1手の重み配分のうち、何もせず様子をうかがう回の重み。
      bite:
        display_name: 噛みつき
        description: 1手の重み配分のうち、同じ土地に居る相手へ噛みつく回の重み。
      gore:
        display_name: 牙
        description: 1手の重み配分のうち、牙を突き上げる回の重み。大型だけが持つ。
      crush:
        display_name: 圧し掛かり
        description: 1手の重み配分のうち、相手へ体ごと圧し掛かる回の重み。大型だけが持ち、骨を折る。
      snatch:
        display_name: 持ち去り
        description: 1手の重み配分のうち、足元の物をくわえて自分のものにする回の重み。
      devour:
        display_name: 盗み食い
        description: 1手の重み配分のうち、くわえている食べ物を食べてしまう回の重み。
      smash:
        display_name: 破壊
        description: 1手の重み配分のうち、足元の物にぶつかって壊す回の重み。
      flee:
        display_name: 逃走
        description: 1手の重み配分のうち、隣の土地へ逃げる回の重み。深手を負うほど太くなる。
      stay_remaining:
        display_name: 立ち去りまで
        description: この場に留まる残り。誰も居ない土地でだけ減っていき、尽きた動物はどこかへ行ってしまう。
      wariness:
        display_name: 警戒
        description: この動物がどれだけ気を立てているか。傷を負わされれば上がり、放っておけば下がる。
      consciousness:
        display_name: 意識
        description: 起きていて動けるかどうか。痛み・衝撃・失血で薄れ、原因が引けば戻る。
      shock:
        display_name: 衝撃
        description: 殴られた身体の揺れ。当たった瞬間に跳ね上がり、時間とともに引いていく。
      satiety:
        display_name: 満腹度
        icon: 🍔
        description: 胃に入っている物のかさ。食べれば増え、時が経つほど減る。いっぱいのときはもう食べられない。
      hydration:
        display_name: 水分
        icon: 💧
        description: 体に残っている水。汗と呼気で絶えず失われ、飲めば戻る。尽きれば渇きで死ぬ。
      body_fat:
        display_name: 体脂肪
        icon: 🫃🏻
        description: 体に蓄えた脂肪。食べた物が身になって積み上がり、何もしなくても少しずつ減る。尽きれば飢えで死ぬ。
      wakefulness:
        display_name: 覚醒度
        icon: 💤
        description: 意識を保っていられる残り。起きている限り減り続け、眠れば戻る。
      stamina:
        display_name: 体力
        icon: 💪
        description: 今すぐ動ける余力。働けば減り、休めば戻る。
      carbohydrate:
        display_name: 糖質
        icon: 🌾
        description: 体に残っている糖質。最も速く力になるが、蓄えとしては長く保たない。
      protein:
        display_name: たんぱく質
        icon: 🍖
        description: 体に残っているたんぱく質。体を作り直すのに要る。
      lipid:
        display_name: 脂質
        icon: 🧈
        description: 体に残っている脂質。同じかさで最も大きな力になり、最も長く保つ。
      vitamin:
        display_name: ビタミン
        icon: 🥬
        description: 体に残っているビタミン。力にはならないが、尽きると壊血病になり、古傷が開き歯が抜ける。葉物を口にすれば戻る。
      happiness:
        display_name: 幸福度
        icon: 😊
        description: 心の張り。痛みを抱えている間は落ちていき、うまい物を口にすれば戻る。火を通した食事ほど大きく戻す。
      # 腕前（docs/engine/SkillSystem.md、一覧は docs/world/Skills.md 2節）。**説明にはその腕を伸ばす
      # 行動を書く**——伸ばす行動を持たない本では、どうにもならないことがそこで分かる。
      skill_knapping:
        display_name: 石器
        icon: 🪨
        description: 石を打ち欠いて刃を作る腕。石へ石を重ねて打つほど上がる。
      skill_cordage:
        display_name: 繊維・編み
        icon: 🧶
        description: 繊維を撚り、葉を編む腕。掻き取り・撚り・編みのどれでも上がる。
      skill_woodwork:
        display_name: 木材加工
        icon: 🪵
        description: 木を伐り、刃を当てて削り出す腕。木を倒し、流木を玉切りし、骨を削るほど上がる。
      skill_joinery:
        display_name: 指物・接合
        icon: 🪑
        description: 材を削り合わせて組む腕。今のこの島には、伸ばす手立ても使い道もまだ無い。
      skill_building:
        display_name: 建築
        icon: 🏠
        description: 住まいを建てる腕。今のこの島には、伸ばす手立ても使い道もまだ無い。
      skill_leatherwork:
        display_name: 皮革
        icon: 🧥
        description: 皮を剥ぎ、なめし、縫う腕。獣を捌くほど上がる。
      skill_cooking:
        display_name: 料理
        icon: 🍳
        description: 食材を調理する腕。今のこの島には、伸ばす手立てがまだ無い（焼くのは火が進める）。
      skill_preserving:
        display_name: 保存
        icon: 🧂
        description: 得た食を乾季まで保たせる腕。塩を打つほど上がる。
      skill_firecraft:
        display_name: 火
        icon: ♨️
        description: 火を起こし、保つ腕。きりもみ式で火口に向かうほど上がる。
      skill_hunting:
        display_name: 狩猟
        icon: 🏹
        description: 獣を狩る腕。武器を手に打ちかかるほど上がる。
      skill_smelting:
        display_name: 採鉱・製錬
        icon: ⛏️
        description: 鉱石を見つけ、金属を取り出す腕。今のこの島には、伸ばす手立ても使い道もまだ無い。
      afloat:
        display_name: 浮いている
        description: 水に浮かんでいるか。帆のような部品は、浮いている間だけ効く。
      fuel:
        display_name: 薪
        description: 炉に載っている燃えるもの。尽きれば火は弱っていく。
      heat:
        display_name: 火力
        description: 今どれだけ燃えているか。一番下は種火で、料理はできないが薪を足せば育つ。
      stones:
        display_name: 積んだ石
      cooking_progress:
        display_name: 加熱の進み
        description: 火にかけられている度合い。火から出せば止まり、戻せば続きから進む。
      heat_soak:
        display_name: 蓄えた熱
        description: 火の中で溜め込んだ熱。火から離せば抜けていき、抜け切れば元の姿に戻る。
      ignition_chance:
        display_name: 火の付きやすさ
      life:
        display_name: 残り
    interactions:
      turn:
        display_name: 手番
        description: 時間の経過で回ってくる動物の1手。プレイヤーが起こすものではない。
      explore:
        display_name: 探索する
        description: あたりを調べて、アイテム・設置物・他の土地へ続く道を探す。何度でも続けられる。
      travel:
        display_name: 移動する
        description: この道を通って、繋がっている土地へ向かう。
      cross:
        display_name: 渡る
        description: この航路を取って、筏ごと次の海区へ渡る。かかる時間は漕ぎ出すときの風と積荷で決まる。
      eat:
        display_name: 食べる
        description: その場で食べる。かさのぶん腹が満ち、含まれている栄養と水分が身体に入る。
      drink:
        display_name: 飲む
        description: 一口（250mL）飲む。残りが少なければ、残っている分だけ飲む。
      collect_rain:
        display_name: 雨を貯める
        description: 空のまま置いて、降っている雨を受ける。降り続くかぎり、雨の強さのぶんだけ溜まっていく。
      wait:
        display_name: 待機
        description: 手を止めて時が過ぎるのを待つ。息が整うぶんだけ体力が戻る。
      rest:
        display_name: 休憩
        description: 腰を下ろして休む。まとめて休むほど、同じ時間でも体力の戻りは大きい。
      nap:
        display_name: 仮眠
        description: 短く眠る。体力に加えて眠気も引くが、通しで眠るほどには戻らない。
      sleep:
        display_name: 睡眠
        description: 通しで眠る。最も効率よく体力と眠気が戻るが、それでも一晩では眠気は戻り切らない。
      pour_in:
        display_name: 注ぎ移す
        description: 中身を相手の容器へ移す。入る分だけ移り、あふれる分は元の容器に残る。
      knap:
        display_name: 打ち割る
        description: 石を打ち合わせて割り、鋭い縁を作る。
      add_fuel:
        display_name: くべる
        description: 火にくべる。燃える物は炉の薪へ溶けて、そのぶん火が長くもつ。
      ignite:
        display_name: 火をつける
        description: 火種を落として種火を立てる。そこから先は、くべた薪が火を育てる。
      add_stone:
        display_name: 石を積む
        description: 炉のまわりへ石を据える。必要な数が揃うと、炉が組み直される。
      strike:
        display_name: 殴る
        description: 手にした武器で打ちかかる。一撃がどう入るかは武器の性格が決め、外しても相手は気を立てる。
      wash:
        display_name: 傷を洗う
        description: 水を1杯（250mL）掛けて傷口の汚れを流す。掛けた水は戻らない。手当てを当てたままでも洗える。
  # プレイヤーキャラクタ（characters/）。プロパティの表示名は全員共通なのでdefaultへ置く。
  # 表示名は肖像の札に載る名前。どういう人物かは説明の頭の肩書きで示す（選択画面の吹き出しに出る）。
  farmer:
    display_name: トマス
    description: 陽気な元農家。畑仕事で作った丈夫な体と厚い蓄えを持つが、その体を動かすだけの量を食べないと保たない。
  engineer:
    display_name: リナ
    description: 手先の器用な元エンジニア。道具を持ち替えながら夜通し作業する暮らしが体に残っている。歩き回る体力と蓄えは乏しい。
  captain:
    display_name: グレン
    description: 冷静な元船長。長い航海で水の配分と当直の眠気に慣れている。蓄えは人並みよりやや薄い。
  medic:
    display_name: マルコ
    description: 頼れる元衛生兵。どこも欠けたところのない体と、現場を歩き回って培った体力を持つ。

  # 道（locations.yaml）。
  path:
    display_name: 道
    description: 他の土地へ続く道。通れば、その先の土地へ移れる。

  # ヤシの実の加工の連鎖（coconut.yaml）。
  palm_tree:
    display_name: ヤシの木
    description: 高く伸びたヤシ。幹を登れば、まだ落ちない青い実と枯れ葉が採れる。
    interactions:
      pick_green_coconut:
        display_name: 実を採る
        description: 幹を登って、まだ落ちない青い実を切り落とす。
      pick_frond:
        display_name: 葉を採る
        description: 幹を登って、垂れ下がった枯れ葉を引き落とす。
  green_coconut:
    display_name: 青いヤシの実
    description: まだ熟していない実。皮も殻も柔らかく、中に飲める水を抱えている。
    interactions:
      bore:
        display_name: 穴を開けて飲む
        description: 皮の上から殻まで刃先を通し、中の水を飲む。開けた水は保たないので、その場で飲みきる。
  drained_green_coconut:
    display_name: 水を飲んだ青い実
    description: 水の抜けた青い実。薄い殻は刃物だけで割れ、内側にゼリー状の果肉が張り付いている。
    interactions:
      split:
        display_name: 割る
        description: 刃物で薄い殻を割り、ゼリー状の果肉を取り出す。器になる殻は残らない。
  coconut_jelly:
    display_name: ヤシのゼリー
    description: 青い実の柔らかい果肉。匙で掬えるほど柔らかく、ほとんどが水分。
  coconut:
    display_name: 熟したヤシの実
    description: 厚い繊維の皮に覆われた実。刃物ではがさないと中の殻に届かない。飲める水は残っていない。
    interactions:
      husk:
        display_name: 皮をはぐ
        description: 刃物で繊維の皮を削ぎ落とし、中の実を取り出す。
  coconut_husk:
    display_name: ヤシの実の皮
    description: はぎ取った繊維の塊。硬く、ほぐれば長い繊維になる。
    interactions:
      ret:
        display_name: 叩いて繊維を採る
        description: 水に漬けて柔らかくし、石で叩いて繊維を解す。漬けておくぶん、時間がかかる。
  husked_coconut:
    display_name: 皮を剥いだヤシの実
    description: 皮を落として殻がむき出しになった実。殻は硬いが、叩くかこじれば二つに割れる。
    interactions:
      crack:
        display_name: 叩き割る
        description: 石を打ちつけ、走った割れ目で二つに割る。
      pry_open:
        display_name: こじ開ける
        description: 殻の継ぎ目へ刃をねじ込み、こじって二つに割る。
  coconut_half:
    display_name: 割れたヤシの実
    description: 半分になった実。殻の内側に白い果肉が張り付いている。
    interactions:
      scrape:
        display_name: 果肉を削り取る
        description: 刃物で内側の果肉を掻き出す。あとには器になる殻が残る。
  coconut_meat:
    display_name: ヤシの果肉
    description: 殻から掻き出した白く硬い果肉。脂が多く、腹に残る。

  # 怪我（injuries.yaml）。
  sprained_ankle:
    display_name: 足首の捻挫
    description: 踏み外した足首の腫れ。体重をかけるたびに痛みが走る。
  laceration:
    display_name: 裂傷
    description: 鈍い刃で裂かれた傷。潰れた縁が血を早く止めるが、しばらくは流れ続ける。
  snare_laceration:
    display_name: 縄の傷
    description: 締まった縄が食い込んで裂けた傷。浅く掛かれば血はすぐ止まり、深ければそうもいかない。
  bruise:
    display_name: 打ち身
    description: 丸太や穴の底へ体を打ちつけて負った傷。血は流れないので、どんなに大きな獣も生きたまま残る。
  puncture_wound:
    display_name: 刺し傷
    description: 穂先が深く突き通した傷。開いたままの深部から、裂傷とは桁違いの速さで血が流れる。
  bite_wound:
    display_name: 噛み傷
    description: 歯が並んで食い込んだ傷。裂傷より浅いが、放っておけばしばらく血が流れ続ける。
  gore_wound:
    display_name: 牙の傷
    description: 下から突き上げた牙が深部まで裂いた傷。この島で最も速く血が流れる。手当てが間に合わなければ、その場を離れても倒れる。
  fracture:
    display_name: 骨折
    description: 重さに押し潰されて折れた骨。血は流れないが痛みは絶えず、繋がるまでの半月、荷を担げば身動きが取れない。

  # 動物（animals.yaml）。
  monkey:
    display_name: サル
    description: 群れで暮らす小柄なサル。目を離すと、足元に置いたものを持っていく。
  junglefowl:
    display_name: ヤケイ
    description: 藪をつつく野生の鶏。飛ぶのは下手で、地面に降りているところを狙える。
  junglefowl_carcass:
    display_name: ヤケイの死体
    description: 仕留めたヤケイ。刃物を当てれば肉が取れる。
    interactions:
      butcher:
        display_name: 解体する
        description: 羽をむしり、肉を外し、細い骨を抜く。肉は獣のものと同じ1枚になる。
  rat:
    display_name: ネズミ
    description: どこにでも湧く小さな齧歯類。貯めた食料を狙って寄ってくる。
  wild_boar:
    display_name: イノシシ
    description: 藪を割って進む大きな獣。生半可な得物では傷を増やすだけで、倒れる気配もない。
  wild_boar_carcass:
    display_name: イノシシの死体
    description: 仕留めたイノシシ。丸ごと運べる重さではないので、その場で解体するしかない。
    # 「塩漬けのイノシシの死体」は枠の1行（全角10文字）を越えるので、この型だけ書式を上書きする。
    # 加工の名前を前へ置く形は変えないので、燻製が入っても書き足すものは無い。
    variation_names:
      cure: '{value}のイノシシ'
    interactions:
      butcher:
        display_name: 解体する
        description: 皮を剥ぎ、肉を外し、骨を落とす。半日仕事だが、取れる量も桁が違う。
  rat_carcass:
    display_name: ネズミの死体
    description: 仕留めたネズミ。肉を外すには小さすぎるので、丸ごと火にかける。
  roasted_rat:
    display_name: 丸焼きのネズミ
    description: 串に刺して火にかけたネズミ。骨からこそぎ落とすように食べる。ひと口で終わる。
  feather:
    display_name: 羽
    description: 鳥1羽ぶんの羽をまとめた1枚。軽くて嵩ばる。
  small_bone:
    display_name: 小さな骨
    description: 小動物から取れた細い骨。道具の頭部を支える太さはないが、割って削れば針になる。
    interactions:
      whittle:
        display_name: 削って針にする
        description: 刃物で細く削り、糸を通す穴を開ける。
  monkey_carcass:
    display_name: サルの死体
    description: 仕留めたサル。丸ごとでは重いが、刃物を当てれば肉と骨と皮に分けられる。
    interactions:
      butcher:
        display_name: 解体する
        description: 皮を剥ぎ、肉を外し、骨を落とす。血と内臓はその場に残す。
  raw_meat:
    display_name: 生肉
    description: 獲物から外した肉。火が無いので、生のまま食べるしかない。
  roasted_meat:
    display_name: 焼けた肉
    description: 火が通って締まった肉。生より腹に残る。出し忘れると焦げる。
  charred_lump:
    display_name: 焦げた塊
    description: 焼きすぎて炭になったもの。腹は少し膨れるが、身になるものは何も残っていない。
  animal_bone:
    display_name: 獣骨
    description: 1頭ぶんの骨。硬く、削れば針にも道具の頭にもなる。
  rawhide:
    display_name: 生皮
    description: 剥いだままの皮。乾けば板のように固まり、濡らせば傷む。

  # 罠（traps.yaml）。
  snare:
    display_name: くくり罠
    description: 繊維で編んだ輪。地面に仕掛けて待つと、そのうち何かが掛かる。開けるまで中は分からない。
    props:
      catch_remaining:
        display_name: 次の見込み
      plant_bait:
        display_name: 草の餌
      meat_bait:
        display_name: 肉の餌
    interactions:
      add_plant_bait:
        display_name: 草の餌を仕掛ける
        description: 草食の獲物を寄せる。仕掛けてある間だけ効き、時間で傷んで切れる。
      add_meat_bait:
        display_name: 肉の餌を仕掛ける
        description: 肉食の獲物を寄せる。自分が食べられる肉を先に賭けることになる。
  pitfall:
    display_name: 落とし穴
    description: 獣の道へ掘った深い穴。落ちた獣は骨を折って出られない。埋め戻せないので、掘る土地がそのまま賭けになる。
    variation_names:
      # 杭（traps.yamlのstake軸）。**打った物を前へ置くだけ**にして、穴の側の書式は増やさない。
      stake: '{value}を打った{base}'
    props:
      catch_remaining:
        display_name: 次の見込み
      plant_bait:
        display_name: 草の餌
    interactions:
      add_plant_bait:
        display_name: 草の餌を仕掛ける
        description: 草食の獲物を寄せる。持ち歩く罠と違って時間では傷まないので、置いたまま待てる。
      drive_stake:
        display_name: 杭を打つ
        description: 穴の底へ棒を立てる。落ちた獣は骨を折る代わりに貫かれ、生かしては捕らえられなくなる。
  staked:
    display_name: 杭

  # 栽培と飼育（farming.yaml）。罠と同じ「留守番の設備」で、賭けるのは時間と食料。
  field:
    display_name: 畑
    description: 掘り返して均した土。種を撒いて放っておくと、そのうち実る。撒いたぶんだけで終わる。
    props:
      growth_remaining:
        display_name: 次の実り
      taro_sown:
        display_name: 撒いた芋
      water_spinach_sown:
        display_name: 撒いた葉物
    interactions:
      sow_taro:
        display_name: 芋を撒く
        description: 種芋として1株植える。自分が食べられる芋を先に賭けることになる。
      sow_water_spinach:
        display_name: 葉物を撒く
        description: 挿し穂として1株植える。自分が食べられる葉物を先に賭けることになる。
  pen:
    display_name: 囲い
    description: 丸太を縄で結んだ柵。空けておけば大型の獣が生きたまま掛かり、入れておけば飼葉が続く間だけ増える。
    props:
      catch_remaining:
        display_name: 次の見込み
      fodder:
        display_name: 飼葉
      drinking_water:
        display_name: 飲み水
        description: 桶に入れてある水。中の獣が飲む。切らせば3日半で渇いて死ぬ。頭数が多いほど速く尽きる。
    interactions:
      feed:
        display_name: 飼葉をやる
        description: 草の食べ物を入れておく。空なら獣を寄せ、居れば食われる。頭数が多いほど速く尽きる。
      water:
        display_name: 水をやる
        description: 水の入った器を空ける。器は空になって戻る。入りきらない分は器に残る。
  # 治療具（treatments.yaml）。
  bandage:
    display_name: 包帯
    description: 細長く裂いた布。傷口に巻いて清潔に保つ。長く当てておける。
  splint:
    display_name: 添え木
    description: 削った副木を紐で巻き留める固定具。折れた骨を挟んで支え、担いだ荷の重さを和らげる。
    recipes:
      lashed:
        display_name: 副木を縛る
        description: 枝を割って平らな木を2枚こしらえ、傷を挟んで紐で巻き留める。

  # 探索で見つかるアイテム（locations.yaml・foods.yaml）。
  thick_branch:
    display_name: 太い枝
    description: 腕ほどの太さの枝。折れ口が生々しく、削れば道具の柄になる。
  stone:
    display_name: 石
    description: 手のひらに収まる硬い石。同じ石で打ち合わせると割れて、鋭い縁ができる。
  twig:
    display_name: 小枝
    description: 地面から拾い集めた細い枝。よく乾いていて、焚き付けにちょうどよい。
  water_spinach:
    display_name: 空心菜
    description: 水辺に生える葉野菜。茎は空洞で、火を通さずそのまま食べられる。
  coconut_crab:
    display_name: ヤシガニ
    description: 陸に住む大型の甲殻類。道具が無くても捕まえられるが、殻ごと火にかけないと食べられない。
  roasted_coconut_crab:
    display_name: 丸焼きのヤシガニ
    description: 殻ごと焼いたヤシガニ。割って身を掻き出す。出し忘れると焦げる。
  taro:
    display_name: タロイモ
    description: 太平洋の島々で主食とされてきた塊茎。生のままかじると、口も喉も刺すように痛む。
  roasted_taro:
    display_name: 焼いたタロイモ
    description: 熾火に埋めて芯まで焼いた芋。ここまでやって、初めて食べられる。出し忘れると焦げる。

  # 製塩と塩蔵（salt.yaml）。
  salt:
    display_name: 塩
    description: 天日で干し上げた粗塩。ひと掴みで食べ物1つを漬けられる。舐めても腹の足しにはならない。
    interactions:
      cure:
        display_name: 塩漬けにする
        description: 塩をすり込んで水気を抜く。腐るのがずっと遅くなるが、傷んだ物は元に戻らない。
  # cure軸の値（salt.yaml）。変種の名前にだけ出る（下のvariation_names）。
  salted:
    display_name: 塩漬け
  salt_pan:
    display_name: 塩田
    description: 海水を張って日に干す浅い盤。晴れた日が続くほど塩が採れる。雨に降られると振り出しに戻る。
    props:
      drying_remaining:
        display_name: 次の塩
      brine:
        display_name: 張った海水
    interactions:
      draw_seawater:
        display_name: 海水を汲む
        description: 波打ち際から1杯ぶんを汲んで張る。干し上がれば塩1つになる。

  # 天日干しと干し場（drying.yaml）。
  # cure軸の値。塩漬けと同じ書式（上のvariation_names）に乗るので、名前だけを持つ。
  dried:
    display_name: 日干し
  drying_rack:
    display_name: 干し場
    description: 立てた枝に縄を張った棚。掛けた食べ物は日差しだけで干上がり、地面に並べるより速い。雨に降られると戻る。
    recipes:
      lashed:
        display_name: 組んで張る
        description: 太い枝を立て、渡した縄で結わえる。刃物も掘る物も要らない。

  # 道具（tools.yaml）。
  sharp_stone:
    display_name: 尖った石
    description: 石を打ち割って作った刃物。切る作業に使えるが、握って殴るだけでは大きな獲物に届かない。
  stone_axe:
    display_name: 石斧
    description: 石の頭部を枝の柄へ縛りつけた斧。柄が乗せる勢いで、獲物を一撃で打ち倒せる。
    recipes:
      hafted:
        display_name: 柄を付ける
        description: 枝を削って柄をこしらえ、刃を溝へ据えて紐で締め上げる。
  spear:
    display_name: 槍
    description: 長い棒の先に石の穂先を固定した武器。突けば深く刺さるが、外すことも多く、解体には使えない。
  bone_needle:
    display_name: 骨針
    description: 小さな骨を削って穴を開けた縫い針。皮を縫い合わせるのに要る。使っても減らない。
  fishing_harpoon:
    display_name: 突き銛
    description: 枝の先へ石の穂先を締め上げた漁具。海の上で魚を突くのに要る。稀に魚に持って行かれる。
    recipes:
      hafted:
        display_name: 柄を付ける
        description: 枝を削って柄をこしらえ、穂先を溝へ据えて紐で締め上げる。

  # 葉を編む連鎖（weaving.yaml）。
  palm_frond:
    display_name: ヤシの葉
    description: 長い軸に細長い小葉が並んだ大きな葉。かさばるが、編めば小さくまとまる。
    interactions:
      weave:
        display_name: 編む
        description: 中軸を残したまま、左右の小葉を互い違いに組む。
      split_and_weave:
        display_name: 割って編む
        description: 中軸を縦に割り、左右をそれぞれ編む。同じ葉から2枚とれる。
  woven_leaf:
    display_name: 編んだ葉
    description: ヤシの葉を編んだ平たいパネル。籠にも壁にも屋根にも使える。

  # 繊維を撚る連鎖（fiber.yaml）。
  abaca:
    display_name: アバカ
    description: バナナによく似た草。実は種ばかりで食べられないが、茎から丈夫な繊維が大量に採れる。
    interactions:
      fell:
        display_name: 切り倒す
        description: 根元を刃物で断ち、運べる長さに切り分ける。株立ちなので何本も採れる。
  banana_plant:
    display_name: バナナの株
    description: 実を付けたバナナ。一度実った茎は二度と実らないので、房を採るには切り倒すことになる。
    interactions:
      fell:
        display_name: 切り倒す
        description: 根元を刃物で断ち、房を外して茎を切り分ける。
  banana:
    display_name: バナナ
    description: 野生のバナナ。栽培種と違って硬い種が多く、果肉は少ない。
  banana_stem:
    display_name: バナナの茎
    description: 木のように見えて、葉鞘が巻き重なっただけの茎。水を含んで重く、繊維はこの葉鞘にある。
    interactions:
      strip:
        display_name: 繊維を掻き取る
        description: 葉鞘を1枚ずつ剥ぎ、刃を立てて引き抜いて肉を落とす。髄と水はその場に捨てる。
  plant_fiber:
    display_name: 植物繊維
    description: 掻き取って干した繊維のひと束。細く長いが、1本では何も縛れない。
    interactions:
      spin:
        display_name: 撚る
        description: 2束を手のひらで転がして1本に撚る。撚りに入りきらない短い屑は落ちる。
  yarn:
    display_name: 糸
    description: 繊維を撚った糸。細いが長く、縫うにも縛るにも使える。
    interactions:
      ply:
        display_name: 撚り合わせる
        description: 2本を撚りとは逆向きに撚り合わせる。互いの撚りが噛んで解けなくなる。
  cord:
    display_name: 紐
    description: 糸を撚り合わせた太さのあるひも。道具の頭を柄に縛りつけられる。
  rope:
    display_name: ロープ
    description: 紐3本を逆撚りに組んだ縄。太く、体重を預けても切れない。

  # 火の連鎖（fire.yaml）。
  fire_drill:
    display_name: 火起こし具
    description: きりもみ式の火起こし具。両手で錐を揉んで、火口へ移す熾を作る。
  dry_grass:
    display_name: 枯れ草
    description: よく乾いた草の束。細くほぐれていて、摩擦の熾を受け止められる数少ない素材。
    interactions:
      light:
        display_name: 火をつける
        description: 錐を揉んで熾を落とし、息を吹き込んで炎に育てる。外せば火口だけが無駄になる。
  burning_tinder:
    display_name: 火種
    description: 炎を上げている火口。すぐ燃え尽きるので、炉まで運ぶ以外にできることはない。
  torch:
    display_name: 松明
    description: 枝の先に繊維を巻いた明かり。手に持っている間だけ足元の道まで照らし、二時間で燃え尽きる。
    props:
      lit:
        display_name: 灯り
      life:
        display_name: 燃え残り
    interactions:
      light:
        display_name: 火を移す
        description: 火種を押し当てて灯す。灯した松明は、置いた場所ではなく持ち歩く人を照らす。
  campfire:
    display_name: 焚き火
    description: 小枝を組んだだけの火。器を載せる場所は無く、放っておけば種火もすぐ死ぬ。
  three_stone_hearth:
    display_name: 三石のかまど
    description: 石を三つ据えた炉。石が支点になって、器を火にかけられる。
  stone_hearth:
    display_name: 石囲いの炉
    description: 石で囲った炉。風を防ぎ、灰をかぶった種火が翌朝まで生きる。
  hot_stone:
    display_name: 焼け石
    description: 炉で熱を溜め込んだ石。水を張った器へ落とせば、器を焦がさずに湯が沸く。冷めれば元の石に戻る。
    interactions:
      boil:
        display_name: 湯を沸かす
        description: 水を張った器へ落とし、溜めた熱を一度に渡す。石はその場で冷めて普通の石に戻る。

  # 土器づくり（pottery.yaml）。
  clay:
    display_name: 粘土
    description: 水際から掘り取った、よく練れる土。乾かして焼けば水を通さなくなる。
  unfired_jar:
    display_name: 素焼き前の壺
    description: 形を作っただけの壺。まだ土のままで、水を入れれば崩れる。乾かしてから焼けば甕になる。
    props:
      moisture:
        display_name: 残った水
        description: 練り土に残っている水。日陰に置けば抜けていく。濡れたまま焼くと、水蒸気で割れる。
    recipes:
      coiled:
        display_name: 壺を成形する
        description: 粘土の紐を底から巻き上げ、口をすぼめて壺の形にする。乾かすのはこのあと。
  earth_kiln:
    display_name: 覆い焼きの炉
    description: 器と薪をまとめて土で覆った、一度きりの炉。ここでしか土器は焼けず、料理はできない。
    recipes:
      heaped:
        display_name: 炉を築く
        description: 焼く器と薪を積み、練った粘土でまるごと覆って、空気の通り道を突く。
    interactions:
      break_open:
        display_name: 覆いを壊す
        description: 冷めた土の殻を崩して、中の焼き物を取り出す。炉は二度と使えない。

  # 入れ物（containers.yaml）。
  woven_basket:
    display_name: 編み籠
    description: 編んだ葉を綴じ合わせた入れ物。中に入れた物をまとめて持ち運べる。

  # 衣類（clothing.yaml）。
  tanned_leather:
    display_name: なめし革
    description: 樹皮の液に漬けてなめした革。生皮と違って乾いても固くならず、濡れても傷まない。
    recipes:
      tanned:
        display_name: 皮をなめす
        description: 毛と肉を掻き落とし、砕いた樹皮の渋に漬けて、揉みながら乾かす。一日がかりの仕事になる。
  bundled_leaf_clothing:
    display_name: 束ねた葉の服
    description: ヤシの小葉を繊維で腰に束ねただけの腰蓑。何も要らずに作れる、最初の一着。
    recipes:
      bundled:
        display_name: 葉を束ねる
        description: 中軸から外した小葉を揃え、繊維で腰へ結わえる。
  rawhide_clothing:
    display_name: 生皮の服
    description: 剥いだ皮に穴を開けて羽織るだけの一着。縫わないので早いが、固く、濡らせば傷む。
    recipes:
      draped:
        display_name: 皮を羽織る
        description: 頭と腕を通す穴を開け、そのまま身にまとう。
  woven_leaf_clothing:
    display_name: 編んだ葉の服
    description: 編んだ葉を綴じ合わせた一着。束ねただけの葉と違って形が崩れない。
    recipes:
      stitched:
        display_name: 葉を綴じる
        description: 編んだパネルを身頃の形に並べ、繊維で綴じ合わせる。
  tanned_leather_clothing:
    display_name: なめし革の服
    description: 裁った革を糸で縫い合わせた一着。柔らかく、長く着られる。
    recipes:
      sewn:
        display_name: 革を縫う
        description: 革を裁って合わせ、骨針と糸で縫い上げる。

  # 探索で見つかる設置物（locations.yaml）。
  berry_bush:
    display_name: ベリーの茂み
    description: 小さな実を付ける低木の茂み。
  shallow_cave:
    display_name: 浅い洞窟
    description: 岩肌が少しだけえぐれた空洞。奥へは続いていないが、雨をしのいで寝起きできる。
    interactions:
      enter:
        display_name: 入る
        description: 洞窟の中へ移る。物を置いたり火を焚いたりは、入ってからになる。
      leave:
        display_name: 出る
        description: 洞窟から外へ戻る。
  spring:
    display_name: 湧き水
    description: 地面から湧き出す水。汲めば飲み水になる。

  # 液体容器とその中身（liquid_containers.yaml）。
  jar:
    display_name: 甕
    description: 口の狭い大きな容器。据え置いて水を溜めておける。
  coconut_bowl:
    display_name: ヤシの殻
    description: 果肉を掻き出したあとの半球の殻。器として使える。口が広いので、中身は日にあたると蒸発する。
  water_liquid:
    display_name: 水
    description: 飲めばのどの渇きが癒える。
  hot_water_liquid:
    display_name: 湯
    description: 焼け石で沸かした湯。放っておけば冷めて水に戻る。
  tea_liquid:
    display_name: お茶
    description: 葉を煮出した飲み物。渇きを癒し、眠気を覚ます。
  oil_liquid:
    display_name: 油
    description: 燃料や調理に使う液体。飲むものではない。

  # 木を伐って丸太を採る（timber.yaml）。
  broadleaf_tree:
    display_name: 広葉樹
    description: 幹の太い木。斧があれば倒して丸太にでき、刃物があれば立ったまま樹皮を剥げる。
    interactions:
      fell:
        display_name: 伐り倒す
        description: 根元を斧で断ち、倒した幹を運べる長さに切り分ける。半日がかりの仕事になる。
      strip_bark:
        display_name: 樹皮を剥ぐ
        description: 幹に縦の切れ目を入れ、内樹皮ごと帯で剥がす。木は立ったまま残る。
  driftwood_trunk:
    display_name: 流木の幹
    description: 波に打ち上げられた幹。枝も樹皮も落ちているが、玉切りにすれば丸太が採れる。
    interactions:
      buck:
        display_name: 玉切りにする
        description: 運べる長さに斧で切り分ける。倒す手間が無いぶん、伐り倒すより早い。
  log:
    display_name: 丸太
    description: 幹を2mほどに切ったもの。1本でも相当に重いが、水に浮く。
  tree_bark:
    display_name: 樹皮
    description: 剥いだ樹皮を丸めたひと巻き。含まれる渋が、生皮を革に変える。

  # 島からの脱出（voyage.yaml、docs/world/Voyage.md）。
  raft:
    display_name: 筏
    description: 丸太を縛り合わせた乗り物。中へ積んだ物とともに、海を渡ることができる。
    props:
      sail_speed:
        display_name: 進み足
        description: 今この筏が出している速さ。海流・積んだ重さ・張った帆で決まり、速いほど海区を短く渡れる。
    interactions:
      board:
        display_name: 乗り込む
        description: 筏の上へ移る。積荷を並べたり帆を張ったりは、乗ってからになる。
      disembark:
        display_name: 降りる
        description: 筏から岸へ戻る。
      set_sail:
        display_name: 航海に出る
        description: 乗り込んで、この海岸が面した海へ漕ぎ出す。出た海岸へはいつでも引き返せる。
      spear_sea:
        display_name: 海へ突く
        description: 筏の縁から真下の海を突く。群れが居ないので当たりは薄く、丸一日粘っても数切れ。
  rawhide_sail:
    display_name: 生皮の帆
    description: 生皮を縫い合わせて枠へ張った帆。筏に組み込めば、風をつかんで進みが増す。
    recipes:
      sewn:
        display_name: 帆を張る
        description: 枝と縄で枠を組み、生皮を縫い合わせて張る。
  # 海で採れるもの（voyage.yaml）。
  seaweed:
    display_name: 海藻
    description: 海面を漂う藻を掬い上げたもの。生のまま食べられる。
  bird_egg:
    display_name: 海鳥の卵
    description: 岩の窪みから採った卵。殻を割ればそのまま飲める。
  fish_shoal:
    display_name: 魚の群れ
    description: 水面まで上がってきた群れ。居るあいだだけ獲れて、しばらくすると去る。
    interactions:
      spear_shoal:
        display_name: 群れへ突く
        description: 密に集まった群れへ銛を入れる。よく当たるが、稀に魚に持って行かれる。
  seabird_flock:
    display_name: 海鳥の群れ
    description: 岩に集まって巣を作る鳥。人を知らないので手が届く。
    interactions:
      catch_seabird:
        display_name: 獲る
        description: 巣に居る鳥へ近づいて捕まえる。肉と羽が採れる。
  offshore_islet:
    display_name: 小島
    description: 海区の中に浮かぶ、上陸して歩ける岩の島。
    interactions:
      explore:
        display_name: 島を調べる
        description: 岩の窪みと波打ち際を歩いて回って、岩や流木、鳥の巣、黒い塊の混じった岩を探す。筏から降りていないとできない。
      land:
        display_name: 上陸する
        description: 筏を小島へ寄せる。積荷も乗り手も一緒に着く。
      launch:
        display_name: 漕ぎ出す
        description: 乗り込んで、小島から海へ押し出す。
  tin_ore:
    display_name: 錫鉱石
    description: 小島の岩に混じっていた黒い塊。銅と合わせれば青銅になる。

  # 海区と、海区どうしを繋ぐ航路（GameEndings.md 12節）。海区は8種類の顔ぶれから配った14個で、
  # **名前はそこから何が見えるかで付ける**（同12.2節）——見分けが付かないと、進んでいるのか
  # 戻っているのかも読めなくなる。
  #
  # 海で見つかるのは航路と、拾えるもの・湧くもの（同12.1節）。見張りの1行は、その海区で何が
  # 見つかるかを言う。
  coastal_waters:
    display_name: 島影の海
    description: 島がまだ背後に見えている海。流木と海藻が寄り、魚も来る。陸が目印になる。
    props:
      exploration_progress:
        display_name: 見張りの進み具合
        description: この海区をどれだけ見渡したか。見渡し切ると、次の海区へ続く航路が見える。
    interactions:
      explore:
        display_name: 見張り
        description: 海面と空をひとしきり見渡して、次の海区へ続く航路と、拾えるものを探す。
  kelp_belt:
    display_name: 海藻の帯
    description: 絡む海藻で進みが遅い海。帯そのものが目印になり、海藻はいくらでも採れる。
    props:
      exploration_progress:
        display_name: 見張りの進み具合
        description: この海区をどれだけ見渡したか。見渡し切ると、次の海区へ続く航路が見える。
    interactions:
      explore:
        display_name: 見張り
        description: 藻の切れ目を辿って、次の海区へ続く航路と、掬える海藻を探す。
  tide_rip:
    display_name: 潮目
    description: 流れのぶつかる帯。波が立ち、鳥が集まる。魚が寄るので、補給が当てになる。
    props:
      exploration_progress:
        display_name: 見張りの進み具合
        description: この海区をどれだけ見渡したか。見渡し切ると、次の海区へ続く航路が見える。
    interactions:
      explore:
        display_name: 見張り
        description: 潮の筋をたどって、次の海区へ続く航路と、寄っている魚の群れを探す。
  reef_shallows:
    display_name: 岩礁の海
    description: 波の砕ける瀬が続く海。漂流物が引っかかり、魚も付く。
    props:
      exploration_progress:
        display_name: 見張りの進み具合
        description: この海区をどれだけ見渡したか。見渡し切ると、次の海区へ続く航路が見える。
    interactions:
      explore:
        display_name: 見張り
        description: 瀬の周りを見て回り、次の海区へ続く航路と、引っかかった漂流物を探す。
  gull_rock:
    display_name: 海鳥の岩
    description: 鳥が巣を作る岩。卵と羽が拾え、鳥そのものも手が届く。
    props:
      exploration_progress:
        display_name: 見張りの進み具合
        description: この海区をどれだけ見渡したか。見渡し切ると、次の海区へ続く航路が見える。
    interactions:
      explore:
        display_name: 見張り
        description: 岩の周りを回って、次の海区へ続く航路と、手の届く巣を探す。
  islet_waters:
    display_name: 小島の海
    description: 小島の浮かぶ海。海面には何も無く、実りは上陸した先にある。
    props:
      exploration_progress:
        display_name: 見張りの進み具合
        description: この海区をどれだけ見渡したか。見渡し切ると、次の海区へ続く航路が見える。
    interactions:
      explore:
        display_name: 見張り
        description: 島影の方を見渡して、次の海区へ続く航路と、寄れる岸を探す。
  open_water:
    display_name: 空の海
    description: 目印の何も無い海。拾えるものは何も無いが、渡るのは最も短い。
    props:
      exploration_progress:
        display_name: 見張りの進み具合
        description: この海区をどれだけ見渡したか。見渡し切ると、次の海区へ続く航路が見える。
    interactions:
      explore:
        display_name: 見張り
        description: 空と波だけを頼りに、次の海区へ続く航路を探す。
  wreck_waters:
    display_name: 沈船の海
    description: 折れた帆柱と綱が漂う海。まれに、船が積んでいた物が浮いてくる。
    props:
      exploration_progress:
        display_name: 見張りの進み具合
        description: この海区をどれだけ見渡したか。見渡し切ると、次の海区へ続く航路が見える。
    interactions:
      explore:
        display_name: 見張り
        description: 浮いている物を拾い上げながら、次の海区へ続く航路を探す。
  # 航路が二手に分かれる海区（GameEndings.md 12.3節）。**分かれることを言うのはここだけ**なので、
  # 見張りの1行も「次の海区へ続く航路」ではなく2本あることを伝える。
  long_swell:
    display_name: うねりの海
    description: 大きなうねりだけが続く海。見えるものは何も無いが、うねりの筋が二手に分かれている。
    props:
      exploration_progress:
        display_name: 見張りの進み具合
        description: この海区をどれだけ見渡したか。見渡し切ると、二手に分かれた航路が見える。
    interactions:
      explore:
        display_name: 見張り
        description: うねりの向きを読んで、二手に分かれる航路を探す。
  outer_tide_rip:
    display_name: 沖の潮目
    description: 島影の無い沖の潮目。ここにも流れが集まり、魚が寄る。
    props:
      exploration_progress:
        display_name: 見張りの進み具合
        description: この海区をどれだけ見渡したか。見渡し切ると、次の海区へ続く航路が見える。
    interactions:
      explore:
        display_name: 見張り
        description: 潮の筋をたどって、次の海区へ続く航路と、寄っている魚の群れを探す。
  black_reef:
    display_name: 黒い岩礁
    description: 水面すれすれに黒い瀬が続く海。漂流物が引っかかり、魚も付く。
    props:
      exploration_progress:
        display_name: 見張りの進み具合
        description: この海区をどれだけ見渡したか。見渡し切ると、次の海区へ続く航路が見える。
    interactions:
      explore:
        display_name: 見張り
        description: 瀬の周りを見て回り、次の海区へ続く航路と、引っかかった漂流物を探す。
  drifting_kelp:
    display_name: 流れ藻の海
    description: ちぎれた海藻が筋になって漂う海。進みは遅いが、海藻は採り放題。
    props:
      exploration_progress:
        display_name: 見張りの進み具合
        description: この海区をどれだけ見渡したか。見渡し切ると、次の海区へ続く航路が見える。
    interactions:
      explore:
        display_name: 見張り
        description: 藻の切れ目を辿って、次の海区へ続く航路と、掬える海藻を探す。
  white_rock:
    display_name: 白い岩
    description: 糞で白く染まった岩。遠くからでもそれと分かり、卵と羽が拾える。
    props:
      exploration_progress:
        display_name: 見張りの進み具合
        description: この海区をどれだけ見渡したか。見渡し切ると、次の海区へ続く航路が見える。
    interactions:
      explore:
        display_name: 見張り
        description: 岩の周りを回って、次の海区へ続く航路と、手の届く巣を探す。
  mainland_shallows:
    display_name: 本土の島影
    description: 本土の陸が見え始める海。島影の海と同じように、流木も海藻も魚も寄る。
    # この先に海区は無い（route_to_mainland）ので、見つかる航路の行き先を名指しできる。
    props:
      exploration_progress:
        display_name: 見張りの進み具合
        description: この海区をどれだけ見渡したか。見渡し切ると、本土へ渡る航路が見える。
    interactions:
      explore:
        display_name: 見張り
        description: 近づいてくる陸を見ながら、本土へ渡る航路と、拾えるものを探す。
  route_to_shore:
    display_name: 出た海岸への航路
    description: 漕ぎ出したときから在る、出た海岸へ引き返す針路。渡り着けば筏を岸へ上げられる。
  route_to_coastal_waters:
    display_name: 島影の海への航路
    description: 見張りで見つけた、島影の海へ引き返す針路。
  route_to_kelp_belt:
    display_name: 海藻の帯への航路
    description: 見張りで見つけた、海藻の帯へ抜ける針路。
  route_to_tide_rip:
    display_name: 潮目への航路
    description: 見張りで見つけた、潮目へ抜ける針路。
  route_to_reef_shallows:
    display_name: 岩礁の海への航路
    description: 見張りで見つけた、岩礁の海へ抜ける針路。
  route_to_gull_rock:
    display_name: 海鳥の岩への航路
    description: 見張りで見つけた、海鳥の岩へ抜ける針路。
