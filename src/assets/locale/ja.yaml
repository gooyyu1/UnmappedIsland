# 操作を実行できない理由（GameElementDefinition.md 14.6節のreason）。実行できないアクションのボタンを
# 押している間、吹き出しに出る。
reason_texts:
  trap_baited: 罠にはもう餌が仕掛けてある。これ以上は入らない。
  field_sown: この畑はもう植わっている。空くまでは撒けない。
  pen_fed: 囲いにはもう飼葉がある。これ以上は入らない。
  salt_pan_full: 塩田は海水で満ちている。干し上がるまでは足せない。
  no_seawater: 海に面していない土地では、汲む海水がない。
  already_cured: これはもう塩漬けにしてある。
  too_spoiled: もう傷んでいる。塩を打っても、進んだぶんは戻らない。
  too_heavy: 荷が重すぎて歩けない。まず何かを置いていく必要がある。
  not_thirsty: 喉はまったく渇いていない。これ以上は飲めない。
  not_raining: 雨は降っていない。溜められる雨がない。
  sheltered: ここには雨が当たらない。溜めるなら外へ出す必要がある。
  not_empty: 中身が入っている。まず空にする必要がある。
  too_full: 腹がいっぱいで、これ以上は入らない。
  not_on_coast: 海に面していない土地からは漕ぎ出せない。
  at_sea: 海の上では降りられない。
  route_already_sighted: この海区から出る航路はもう見えている。
  no_vessel_here: この海区に筏がない。渡る乗り物が要る。
  no_vessel_ashore: 小島に筏がない。漕ぎ出す乗り物が要る。
  not_ashore: 筏から降りていない。島は歩いて回るしかない。
  too_worn: この道具はもう使いものにならない。
  not_hot_enough: 石の熱が足りない。湯は沸かせない。
  no_fuel: 燃やす物が入っていない。火種だけでは燃え続けない。
  too_dark: 暗すぎて手が付けられない。明かりが要る。

# 段（GameElementDefinition.md 6.4節のstages）のうち、UIが名前を読んで画面に出すもの。カードの上へ
# 覆いとして出る（CardView.md 9.1節）ほか、死亡ダイアログが死因として出し（VitalsSystem.md 6節）、
# ステータス詳細ウィンドウが今いる段として出す（Windows.md 8節）。
#
# 段の名前はプロパティごとの名前空間だが、対応表は平らなので、同じ名前の段には同じ言葉が出る
# （怪我の傷の`sore`とキャラクタの痛みの`sore`は同じ語で通る）。
stage_texts:
  # カードの覆いとして出るもの。離れて見ても読める短い語にする（全角3文字まで）。
  unconscious: 気絶
  # 命を絶つ値が最後に通る段（VitalsSystem.md 6節）。まだ生きている域なので、ステータス詳細に
  # 今いる段として出る。死んだと伝える文言は別の名前空間（destroy_reason_texts）が持つ。
  # 渇きは水分の段（parched・thirsty）が使うので、こちらは尽きた先を医学の語で名乗る。
  dehydrated: 脱水
  starved: 飢え
  exsanguinated: 失血

  # 痛み。
  painless: 無痛
  sore: 疼く
  hurting: 痛む
  unbearable: 激痛
  # 血。
  replete: 十分
  low: 不足
  bled: 出血
  hemorrhaging: 大出血
  # 満腹度。
  starving: 飢餓
  hungry: 空腹
  peckish: 小腹
  fed: 足りる
  # 満水と満腹の両方に出る（どちらも「もう入らない」）。
  full: 満ちる
  # 水分。
  parched: 水切れ
  thirsty: 渇き
  dryish: 乾き
  hydrated: 潤い
  # 体脂肪。
  gaunt: 痩せ
  nourished: 標準
  stout: 太め
  obese: 肥満
  # 覚醒度。
  overtired: 限界
  sleepy: 眠い
  yawning: あくび
  rested: 休めた
  # 体力。
  exhausted: 消耗
  tired: 疲れ
  winded: 息切れ
  fresh: 元気
  # 荷重。
  light: 身軽
  laden: 荷持ち
  heavy: 重い
  too_heavy: 重すぎ
  # 未焼成の壺に残った水（pottery.yaml）。
  bone_dry: 乾いた
  leather_hard: 半乾き
  wet: 生乾き
  # 食べ物の傷み具合（foods.yaml）。食べて当たるのはこの段（DigestionSystem.md 6節）。
  rotten: 腐った
  stale: 傷んだ
  sound: 無事

# 消し方の名乗り（GameElementDefinition.md 9.3節のdestroyのreason）。死亡ダイアログが「渇きで死んだ。」
# のように死因として出す（VitalsSystem.md 6節）。
#
# 段（stage_texts）と同じ語を当てているものがあるが、名前空間は別。段は「今どこに居るか」で、
# こちらは「どう消したか」を消す宣言が名乗ったもの。
destroy_reason_texts:
  dehydrated: 渇き
  starved: 飢え
  exsanguinated: 失血

# 起きたことを告げる出来事（GameElementDefinition.md 9.8節のsignal）。起きた札の上に一瞬だけ浮かぶ
# ので、離れて見ても読める短い語にする（CardView.md 14節）。
signal_texts:
  bit: 噛みつき
  cracked: 割れた
  devoured: 食べた
  fired: 焼けた
  fled: 逃げた
  gored: 突き上げ
  grazed: 浅手
  hit: 手応え
  killed: 仕留めた
  lit: 点いた
  missed: 空振り
  not_lit: 点かず
  pierced: 深手
  smashed: 踏み壊し
  snatched: 持ち去り

# 画面の地の文（src/locale/uiTexts.ts）。**ワールド定義に由来しない、画面そのものの語**なので、
# キーはWorldCodexの識別子ではなく画面側の名前。ここに無いキーは、そのままキーが表示される。
ui_texts:
  close: 閉じる
  map: 地図
  # オブジェクトの子ウィンドウのタブ（Windows.md 1節）。
  description: 説明
  properties: 状態
  exploration: 探索
  # 実行できない操作を押したときに、理由（reason）が宣言されていない場合の文。
  cannot_do_now: 今はできない。
  no_description: これについて分かっていることはまだ無い。
  # ステータスの詳細窓（StatusArea.md）。寄与が1つも無いときに出す。
  no_influence: 無し
  given_influence: 与えている影響
  received_influence: 受けている影響
  # 名前の付いていない土地（IslandMapが個体名を持たない場合）。
  unnamed_location: 名もなき土地
  # レシピ一覧（Windows.md 9節）。未解放の理由が宣言されていない場合と、棚に載らないレシピの見出し。
  recipe_locked: まだ作り方が分からない
  recipe_other: その他
