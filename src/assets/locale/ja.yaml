ui_texts:
  close: 閉じる
  map: 地図
  cancel: キャンセル
  ok: OK
  # 名乗らずに終わったものの呼び名（エラー報告に載る死因・エラーの文言）。
  unknown: 不明
  # 名前を並べるときの区切り。**つなぎ方も語と同じく言語のもの**（英語なら `, `）なので、
  # コードではなくここが持つ。
  list_separator: '、'
  # オブジェクトの子ウィンドウのタブ（Windows.md 1節）。
  description: 説明
  properties: 状態
  exploration: 探索
  # 実行できない操作を押したときに、理由（reason）が宣言されていない場合の文。
  cannot_do_now: 今はできない。
  no_description: これについて分かっていることはまだ無い。
  # ステータスの詳細窓（StatusArea.md）。寄与が1つも無いときに出す。
  no_influence: 無し
  given_influence: 与えている影響
  received_influence: 受けている影響
  # 名前の付いていない土地（IslandMapが個体名を持たない場合）。
  unnamed_location: 名もなき土地
  # レシピ一覧（Windows.md 9節）。未解放の理由が宣言されていない場合と、棚に載らないレシピの見出し。
  recipe_locked: まだ作り方が分からない。
  recipe_other: その他

  # タイトル画面（StartScreen.md 画面構成 1）。**画面の名前は、開くボタンと見出しで同じ語**——
  # 押した先の見出しが違う語だと、同じ場所へ来たのか分からない。
