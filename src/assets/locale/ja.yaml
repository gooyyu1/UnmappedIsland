  cracked: 割れた
  crushed: 押し潰し
  devoured: 食べた
  fired: 焼けた
  fled: 逃げた
  gored: 突き上げ
  grazed: 浅手
  hit: 手応え
  killed: 仕留めた
  lit: 点いた
  missed: 空振り
  not_lit: 点かず
  pierced: 深手
  smashed: 踏み壊し
  snatched: 持ち去り
  swept: 押し流された

# 画面の地の文（src/locale/uiTexts.ts）。**ワールド定義に由来しない、画面そのものの語**なので、
