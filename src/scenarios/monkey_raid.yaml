# 狩猟（docs/engine/HuntingSystem.md）を試すための開始状態。密林に警戒したサルが居て、足元には
# サルが狙うアイテムが転がっている。手元の尖った石をサルのカードへ重ねると殴れる。
#
# 書式はsrc/scenario/Scenario.ts、位置づけはSaveDataManagement.md「テスト用シナリオ」節を参照。

title: サルと尖った石

# 7は島に密林があるシード。サルはジャングル・森・砂浜に居る（docs/world/Animals.md 4節）。
seed: 7

player:
  # 武器（weaponタグ）。これをサルへ重ねるのが攻撃（HuntingSystem.md 1.2節）。
  hand: [sharp_stone]

location:
  type: jungle
  # 先頭がサル。残りはサルが持ち去る候補になるもの（HuntingSystem.md 5.4節）で、狙われやすさは
  # かさで決まるため、かさの違うものを混ぜてある。
  items: [monkey, coconut, woven_basket, thick_branch]
