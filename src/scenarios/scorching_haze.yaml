# 陽炎（ScreenLayout.md 空の演出節）の見え方を確かめるための開始状態。
# 乾季後半の灼熱の日中から始め、フィールドエリアの3レーンがそれぞれゆらいでいることを見る。
#
# 書式はsrc/scenario/Scenario.ts、位置づけはSaveDataManagement.md「テスト用シナリオ」節を参照。

title: 灼熱の砂浜

# 3は開始地点が砂浜になるシード。
seed: 3

player:
  hand: [coconut_bowl]

location:
  # 現在地カードと区切り線を境に段差が出ないことを見るため、設置物レーンにもカードを置く。
  fixtures: [palm_tree, palm_tree]
  # 砂にはまっすぐな輪郭が無く、地面だけではゆらぎを読み取れない。カードの縁が波打つのを見る。
  # レーンから溢れる数にして、送っている間も歪みが付いてこないことを確かめられるようにする。
  items: [stone, stone, stone, thick_branch, thick_branch, coconut, sharp_stone, woven_basket, taro]

world:
  props:
    # 陽炎が立つのは気温27度から。気温は基準20に日射（明るいと+3）と季節（暑いと+8）が重なるので、
    # 灼熱だけでも、暑い季節だけでも届かない。開始時刻は必ず8〜12時（NewGame）なので日射は足りる。
    weather: scorching
    thermal_level: 1920
    # 乾季はthermal_levelを毎tick+1して上限へ貼り付けておく。calmのままだと毎tick-1され、
    # 1tick後には暑い季節を外れて陽炎が消える。
    season: dry
