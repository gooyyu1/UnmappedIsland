<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>UnmappedIsland 画面モック</title>
  <style>
    /*
      レイアウト単位: 1u = 画面短辺 / 1080（CSS では vmin ベース）。
      縦型・横型どちらでも短辺を基準にするため、同一端末ならカードの実寸が向きによらず一致する。
      各寸法の根拠は ScreenLayout.md を参照。
    */
    :root {
      --u: calc(100vmin / 1080);
      --card-w: calc(210 * var(--u));
      --card-h: calc(322 * var(--u));
      --lane-h: calc(352 * var(--u));
      --gap: calc(12 * var(--u));
      --margin: calc(6 * var(--u));
      --bar-h: calc(96 * var(--u));
      --situation-h: calc(176 * var(--u));
      --portrait-w: calc(260 * var(--u));
      --portrait-h: calc(399 * var(--u));
      --tile-h: calc(80 * var(--u));
      --radius: calc(12 * var(--u));
    }

    @font-face {
      font-family: "Noto Sans JP";
      src: local("Noto Sans CJK JP");
      font-weight: 400;
    }
    @font-face {
      font-family: "Noto Sans JP";
      src: local("Noto Sans CJK JP");
      font-weight: 700;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: "Noto Sans JP", "Noto Sans CJK JP", sans-serif;
      overflow: hidden;
    }

    .label {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
      font-size: calc(20 * var(--u));
      line-height: 1.2;
      color: #000;
      background: rgba(255, 255, 255, 0.8);
      pointer-events: none;
    }

    .screen {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      background: #f6f6f6;
    }

    .dashboard-column {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }

    /* ---- カード ---- */

    .card {
      --card-icon: "🃏";
      width: var(--card-w);
      height: var(--card-h);
      flex-shrink: 0;
      border: 1px solid #000;
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.85);
      position: relative;
      overflow: hidden;
      color: #111;
    }

    .card::before {
      content: var(--card-icon);
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: calc(96 * var(--u));
      line-height: 1;
      opacity: 0.95;
      z-index: 0;
    }

    .card-name {
      position: absolute;
      top: calc(6 * var(--u));
      left: calc(8 * var(--u));
      right: calc(8 * var(--u));
      z-index: 1;
      font-size: calc(30 * var(--u));
      font-weight: 700;
      line-height: 1.15;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      overflow: hidden;
      text-shadow: 0 0 calc(3 * var(--u)) rgba(255, 255, 255, 0.9);
    }

    .location-lane .card { --card-icon: "🗺️"; }
    .field-item-lane .card { --card-icon: "🪓"; }
    .hand-lane .card { --card-icon: "🍲"; }
    .portrait-card { --card-icon: "🧍"; }

    /* ---- キャラクターエリア ---- */

    .character-area {
      position: relative;
      flex: 1;
      min-height: 0;
      display: flex;
      background: #ffe5d1;
    }

    .character-display {
      position: relative;
      width: calc(460 * var(--u));
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--gap);
      background: #d9f6ff;
    }

    .portrait-wrap { position: relative; }

    .portrait-card {
      width: var(--portrait-w);
      height: var(--portrait-h);
    }

    /* 条件チップ・装備/怪我タイルをまとめる列。ポートレイトカードには重ねない */
    .side-info {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--gap);
      width: 100%;
    }

    .condition-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: calc(8 * var(--u));
    }

    .condition-chip {
      display: flex;
      align-items: center;
      gap: calc(6 * var(--u));
      height: calc(48 * var(--u));
      padding: 0 calc(14 * var(--u));
      border: 1px solid #000;
      border-radius: calc(24 * var(--u));
      background: #fff;
      font-size: calc(22 * var(--u));
      font-weight: 700;
      white-space: nowrap;
    }

    .equip-injury-row {
      display: flex;
      gap: var(--gap);
      width: 100%;
      padding: 0 calc(12 * var(--u));
    }

    /* 装備・怪我はカードではなくタップ可能なタイル。子ウィンドウを開くための
       タップ領域として --tile-h を最小高さに保つ */
    .tile {
      flex: 1;
      display: flex;
      align-items: center;
      gap: calc(10 * var(--u));
      height: var(--tile-h);
      padding: 0 calc(16 * var(--u));
      border: 1px solid #000;
      border-radius: calc(12 * var(--u));
      font: inherit;
      text-align: left;
    }

    .tile-icon { font-size: calc(44 * var(--u)); line-height: 1; flex-shrink: 0; }

    .tile-name {
      font-size: calc(22 * var(--u));
      font-weight: 700;
      line-height: 1.15;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
    }

    .equipment-tile { background: #d6fff0; }
    .injury-tile { background: #ffe0d6; }

    .status-area {
      position: relative;
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: calc(16 * var(--u));
      padding: calc(24 * var(--u));
      background: #e3ffe0;
    }

    .icon-button {
      width: calc(88 * var(--u));
      height: calc(88 * var(--u));
      flex-shrink: 0;
      border: 1px solid #000;
      border-radius: var(--radius);
      background: #ffffff;
      font-size: calc(52 * var(--u));
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: calc(12 * var(--u));
    }

    .status-name {
      width: calc(140 * var(--u));
      flex-shrink: 0;
      font-size: calc(30 * var(--u));
      font-weight: 700;
    }

    .status-bar-container {
      flex: 1;
      height: calc(36 * var(--u));
      background: #ddd;
      border: 1px solid #999;
      border-radius: calc(8 * var(--u));
      overflow: hidden;
    }

    .status-bar {
      height: 100%;
      background: #4caf50;
    }

    /* ---- 状況エリア（日めくりカレンダー・天候） ---- */

    .situation-area {
      position: relative;
      height: var(--situation-h);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: calc(24 * var(--u));
      padding: 0 calc(32 * var(--u));
      background: #e8e2d4;
    }

    .flip-calendar {
      flex-shrink: 0;
      border: none;
      background: none;
      padding: 0;
      font: inherit;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: calc(28 * var(--u));
      line-height: 1;
    }

    .calendar-row {
      display: flex;
      align-items: center;
      gap: calc(8 * var(--u));
    }

    /* 各桁のフリップカード。上部の留具（リング）だけで吊り下がる */
    .flip-digit {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #3a3a3a;
      color: #fff;
      border-radius: calc(6 * var(--u));
      font-weight: 700;
      position: relative;
      box-shadow: 0 calc(2 * var(--u)) calc(3 * var(--u)) rgba(0, 0, 0, 0.3);
    }

    .flip-digit::before,
    .flip-digit::after {
      content: "";
      position: absolute;
      top: calc(-8 * var(--u));
      width: calc(14 * var(--u));
      height: calc(14 * var(--u));
      border-radius: 50%;
      border: calc(3 * var(--u)) solid #6b6b6b;
      box-sizing: border-box;
    }

    .flip-digit::before { left: calc(6 * var(--u)); }
    .flip-digit::after { right: calc(6 * var(--u)); }

    .calendar-row-day .flip-digit {
      width: calc(64 * var(--u));
      height: calc(88 * var(--u));
      font-size: calc(56 * var(--u));
    }

    .calendar-row-time .flip-digit {
      width: calc(44 * var(--u));
      height: calc(60 * var(--u));
      font-size: calc(36 * var(--u));
    }

    .calendar-day-unit {
      font-size: calc(26 * var(--u));
      font-weight: 700;
      color: #333;
    }

    .calendar-colon {
      font-size: calc(32 * var(--u));
      font-weight: 700;
      color: #333;
    }

    .weather-chip {
      display: flex;
      align-items: center;
      gap: calc(10 * var(--u));
      height: calc(88 * var(--u));
      padding: 0 calc(24 * var(--u));
      border: 1px solid #000;
      border-radius: calc(44 * var(--u));
      background: #fff2e0;
      font-size: calc(36 * var(--u));
      font-weight: 700;
      white-space: nowrap;
    }

    /* ---- オプションバー ---- */
    /* 縦型: 画面上部に固定（order:-1）。横型: 画面下部（order は横型メディアクエリで上書き） */

    .options-bar {
      position: relative;
      order: -1;
      height: var(--bar-h);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: var(--gap);
      padding: 0 calc(24 * var(--u));
      background: #f5e9d5;
    }

    /* ---- フィールドエリア ---- */

    .field-area {
      position: relative;
      height: calc(1080 * var(--u));
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: var(--margin);
      padding: var(--margin) 0;
      background: #d6d6ff;
    }

    .lane {
      position: relative;
      height: var(--lane-h);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      padding: 0 var(--margin);
    }

    .location-lane { background: #ffe1b3; }
    .field-item-lane { background: #d9ffd5; }
    .hand-lane { background: #e1dbff; }

    .pinned-slot {
      display: flex;
      align-items: center;
      gap: var(--gap);
      flex-shrink: 0;
    }

    .lane-divider {
      width: calc(4 * var(--u));
      height: var(--card-h);
      background: rgba(0, 0, 0, 0.35);
      border-radius: calc(2 * var(--u));
    }

    .lane-scroll {
      display: flex;
      align-items: center;
      gap: var(--gap);
      overflow-x: auto;
      min-width: 0;
      height: 100%;
      padding-left: var(--gap);
      scrollbar-width: none;
    }

    .lane-scroll::-webkit-scrollbar { display: none; }

    .field-item-lane .lane-scroll,
    .hand-lane .lane-scroll { padding-left: 0; }

    /* ---- 横型 ---- */

    @media (orientation: landscape) {
      .screen { flex-direction: row; }

      .situation-area { order: -1; }

      .character-area {
        flex-direction: column;
        flex: 1;
        min-height: 0;
      }

      .character-display {
        width: 100%;
        height: calc(488 * var(--u));
        flex-direction: row;
        justify-content: center;
      }

      .side-info {
        width: auto;
        flex: 1;
        align-items: flex-start;
      }

      .condition-row { justify-content: flex-start; }

      .status-area {
        flex: 1;
        min-height: 0;
        justify-content: center;
        gap: calc(10 * var(--u));
        padding: calc(24 * var(--u));
      }

      .options-bar {
        order: 1;
        justify-content: space-evenly;
        padding: 0;
      }

      .field-area { width: calc(1350 * var(--u)); height: auto; }
    }
  </style>
</head>
<body>
  <div class="screen">
    <div class="dashboard-column">
      <section class="character-area">
        <div class="character-display">
          <div class="label">キャラクター表示エリア</div>
          <div class="portrait-wrap">
            <div class="card portrait-card"><span class="card-name">主人公</span></div>
          </div>
          <div class="side-info">
            <div class="condition-row">
              <div class="condition-chip">💭 高揚</div>
              <div class="condition-chip">🥶 寒気</div>
              <div class="condition-chip">😪 疲労</div>
              <div class="condition-chip">🍽️ 空腹</div>
            </div>
            <div class="equip-injury-row">
              <button class="tile equipment-tile" type="button"><span class="tile-icon">🪑</span><span class="tile-name">折りたたみ椅子</span></button>
              <button class="tile injury-tile" type="button"><span class="tile-icon">🩹</span><span class="tile-name">擦り傷</span></button>
            </div>
          </div>
        </div>
        <div class="status-area">
          <div class="label">ステータスエリア</div>
          <div class="status-item">
            <div class="status-name">HP</div>
            <div class="status-bar-container"><div class="status-bar" style="width:80%"></div></div>
          </div>
          <div class="status-item">
            <div class="status-name">スタミナ</div>
            <div class="status-bar-container"><div class="status-bar" style="width:65%"></div></div>
          </div>
          <div class="status-item">
            <div class="status-name">水分</div>
            <div class="status-bar-container"><div class="status-bar" style="width:45%"></div></div>
          </div>
          <div class="status-item">
            <div class="status-name">食料</div>
            <div class="status-bar-container"><div class="status-bar" style="width:30%"></div></div>
          </div>
          <div class="status-item">
            <div class="status-name">体温</div>
            <div class="status-bar-container"><div class="status-bar" style="width:70%"></div></div>
          </div>
          <div class="status-item">
            <div class="status-name">精神</div>
            <div class="status-bar-container"><div class="status-bar" style="width:55%"></div></div>
          </div>
        </div>
      </section>
      <section class="situation-area">
        <div class="label">状況エリア</div>
        <button class="flip-calendar" type="button" aria-label="時間経過アクション" title="時間経過アクション">
          <span class="calendar-row calendar-row-day">
            <span class="flip-digit">0</span>
            <span class="flip-digit">1</span>
            <span class="flip-digit">1</span>
            <span class="calendar-day-unit">日目</span>
          </span>
          <span class="calendar-row calendar-row-time">
            <span class="flip-digit">1</span>
            <span class="flip-digit">0</span>
            <span class="calendar-colon">:</span>
            <span class="flip-digit">1</span>
            <span class="flip-digit">5</span>
          </span>
        </button>
        <div class="weather-chip">☀️ 灼熱の快晴</div>
      </section>
      <section class="options-bar">
        <div class="label">オプションバー</div>
        <button class="icon-button" type="button" aria-label="設定" title="設定">⚙️</button>
        <button class="icon-button" type="button" aria-label="図鑑" title="図鑑">📖</button>
        <button class="icon-button" type="button" aria-label="日記" title="日記">📓</button>
        <button class="icon-button" type="button" aria-label="メニュー" title="メニュー">☰</button>
      </section>
    </div>
    <main class="field-area">
      <div class="lane location-lane">
        <div class="label">ロケーションレーン</div>
        <div class="pinned-slot">
          <div class="card"><span class="card-name">流木だらけの海岸線</span></div>
          <div class="lane-divider"></div>
        </div>
        <div class="lane-scroll">
          <div class="card"><span class="card-name">白砂の浜</span></div>
          <div class="card"><span class="card-name">崩れかけた岩場の洞窟入口</span></div>
          <div class="card"><span class="card-name">浅瀬</span></div>
          <div class="card"><span class="card-name">ヤシ林</span></div>
          <div class="card"><span class="card-name">潮だまり</span></div>
          <div class="card"><span class="card-name">濃霧の湿地帯</span></div>
        </div>
      </div>
      <div class="lane field-item-lane">
        <div class="label">フィールドアイテムレーン</div>
        <div class="lane-scroll">
          <div class="card"><span class="card-name">石斧</span></div>
          <div class="card"><span class="card-name">未調理のヤギ肉のシチュー</span></div>
          <div class="card"><span class="card-name">火打ち石</span></div>
          <div class="card"><span class="card-name">雨水を集めた竹筒</span></div>
          <div class="card"><span class="card-name">ロープ</span></div>
          <div class="card"><span class="card-name">割れたコンパス</span></div>
        </div>
      </div>
      <div class="lane hand-lane">
        <div class="label">ハンドレーン</div>
        <div class="lane-scroll">
          <div class="card"><span class="card-name">焼き魚</span></div>
          <div class="card"><span class="card-name">椰子の実スープ</span></div>
          <div class="card"><span class="card-name">干し肉</span></div>
          <div class="card"><span class="card-name">果実串</span></div>
          <div class="card"><span class="card-name">貝の蒸し焼き</span></div>
          <div class="card"><span class="card-name">塩ゆで芋</span></div>
          <div class="card"><span class="card-name">木の実の盛り合わせ</span></div>
          <div class="card"><span class="card-name">海藻サラダ</span></div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
