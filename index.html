<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>UnmappedIsland</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        /* 端まで送ったあとの引っ張り（オーバースクロール・引き下げて再読込）を出さない。 */
        overscroll-behavior: none;
      }
      /*
       * PhaserがDOM要素（TextInput）のために作る入れ物は、ゲームの座標系＝物理ピクセルの寸法で
       * 置かれ、見た目だけを縮小変換で合わせる（DeviceScreen参照）。位置指定の要素で囲って
       * 切り取らないと、この寸法が文書の大きさとして残り、画面のdevicePixelRatio倍のページに
       * ゲームが左上だけ描かれた状態になる。スマートフォンではその余白をスワイプでたどれてしまう。
       */
      #game {
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      /*
       * タッチ操作はすべてゲームが解釈する。既定（auto）のままだと横スワイプをブラウザが
       * ページのパンや「戻る」として扱ってしまい、レーンを横スクロールしようとすると
       * 画面全体が動く。Phaserはcanvasにtouch-actionを設定しないため、ここで指定する。
       */
      #game,
      #game canvas {
        touch-action: none;
      }
      /* インライン要素のままだと行ボックスの余白が付き、表示先の高さと一致しない。 */
      #game canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
