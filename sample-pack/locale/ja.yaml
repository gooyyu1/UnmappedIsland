# サンプルアセットパックの表示文字列（AssetPack.md 3節）。同梱の対応表と同じ書き方で、
# このパックが足す型のぶんだけを書く。
object_texts:
  # 飲む操作は、同梱のdefaultの「飲む」が液体容器の一口を指すので、どちらも自分で言い直す。
  poison_potion:
    display_name: 毒薬
    description: 黒く澱んだ液の入った小瓶。ひと口で血の残らない体になる。
    interactions:
      drink:
        display_name: あおる
        description: 中身を一息に飲み干す。持っている血を残らず失う。
  healing_potion:
    display_name: 回復ポーション
    description: 赤く澄んだ液の入った小瓶。どれだけ失っていても血が満ちる。
    interactions:
      drink:
        display_name: あおる
        description: 中身を一息に飲み干す。失った血がすべて戻る。
