# 飲むと血（player_character.yaml）だけが動く薬。入手経路はまだ無く、どこにも湧かない。
#
# 効き目の±9999は、blood の幅（0〜5000）を必ず振り切る大きさで選んである——回復ポーションは
# どれだけ失っていても満タンに戻し、毒薬はどれだけ満ちていても下限へ届かせて失血死させる
# （VitalsSystem.md 3節、bloodのon_min）。量を見比べて飲む物ではないので、幅に収まる値にしない。
#
# foodタグは付けない。付ける条件は本人の satiety か hydration を動かすこと（CardView.md 2.1節）で、
# 薬はどちらも動かさない。

object_defs:
  # 毒薬。一口で失血死する。
  poison_potion:
    tags: [item]
    props:
      weight: {value: 200}
      volume: {value: 250}
    interactions:
      drink:
        trigger: menu
        add:
          actor:
            blood: -9999
        destroy: self

  # 回復ポーション。失った血が一息に満ちる。
  healing_potion:
    tags: [item]
    props:
      weight: {value: 200}
      volume: {value: 250}
    interactions:
      drink:
        trigger: menu
        add:
          actor:
            blood: 9999
        destroy: self

# 入手経路。同梱の土地の探索結果へ、自分のアイテムを差し込む（GameElementDefinition.md 3.4節）。
# 重みは相対値なので、足したぶんだけ既存の出目が薄まる。砂浜・ジャングルとも合計はおよそ100あり、
# ここの2は「たまに見つかる漂着物」くらいの重さ。
patch_object_defs:
  # 回復ポーションは砂浜へ流れ着く。
  - append: sandy_beach.interactions.explore.pick
    value:
      weight: 2
      spawn: {object: healing_potion, into: self}

  # 毒薬はジャングルの奥に落ちている。
  - append: jungle.interactions.explore.pick
    value:
      weight: 2
      spawn: {object: poison_potion, into: self}
