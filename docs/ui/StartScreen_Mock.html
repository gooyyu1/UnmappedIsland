<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>UnmappedIsland スタート・セーブ選択モック</title>
  <style>
    /*
      レイアウト単位（u）・カード意匠は ScreenLayout_Mock.html と共通のトークンを流用する。
      詳細は StartScreen.md を参照。
    */
    :root {
      --u: calc(100vmin / 1080);
      --gap: calc(12 * var(--u));
      --margin: calc(6 * var(--u));
      --radius: calc(12 * var(--u));
    }

    @font-face {
      font-family: "Noto Sans JP";
      src: local("Noto Sans CJK JP");
      font-weight: 400;
    }
    @font-face {
      font-family: "Noto Sans JP";
      src: local("Noto Sans CJK JP");
      font-weight: 700;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: "Noto Sans JP", "Noto Sans CJK JP", sans-serif;
      overflow: hidden;
    }

    button { font-family: inherit; }

    .label {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
      font-size: calc(20 * var(--u));
      line-height: 1.2;
      color: #000;
      background: rgba(255, 255, 255, 0.8);
      pointer-events: none;
    }

    /* 画面（タイトル／スロット選択／新規ゲーム作成）は同じ領域に重ね、
       .active が付いたものだけを表示する簡易な画面遷移。 */
    .app {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .screen-state {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      min-height: 0;
    }

    .screen-state.active { display: flex; }

    /* ---- 共通: ヘッダーバー・アイコンボタン ---- */

    .screen-header {
      position: relative;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: calc(16 * var(--u));
      padding: calc(20 * var(--u)) calc(24 * var(--u));
      background: #f5e9d5;
    }

    .header-title {
      flex: 1;
      font-size: calc(30 * var(--u));
      font-weight: 700;
    }

    .icon-button {
      flex-shrink: 0;
      width: calc(72 * var(--u));
      height: calc(72 * var(--u));
      border: 1px solid #000;
      border-radius: var(--radius);
      background: #fff;
      font-size: calc(32 * var(--u));
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      cursor: pointer;
    }

    /* ---- タイトル画面 ---- */

    .title-screen {
      align-items: center;
      justify-content: center;
      gap: calc(56 * var(--u));
      padding: calc(48 * var(--u));
      background: linear-gradient(180deg, #123544 0%, #2f7480 55%, #d9c48a 100%);
      color: #fff;
      text-align: center;
    }

    .title-logo {
      display: flex;
      flex-direction: column;
      gap: calc(12 * var(--u));
    }

    .title-logo-sub {
      font-size: calc(26 * var(--u));
      letter-spacing: 0.08em;
      opacity: 0.9;
    }

    .title-logo-main {
      font-size: calc(60 * var(--u));
      font-weight: 700;
      line-height: 1.2;
      text-shadow: 0 calc(2 * var(--u)) calc(6 * var(--u)) rgba(0, 0, 0, 0.35);
    }

    .title-menu {
      display: flex;
      flex-direction: column;
      gap: calc(20 * var(--u));
      width: min(560px, 84vw);
    }

    .title-button {
      height: calc(92 * var(--u));
      border-radius: calc(46 * var(--u));
      border: none;
      font-size: calc(30 * var(--u));
      font-weight: 700;
      cursor: pointer;
    }

    .title-button--primary { background: #ffd77a; color: #1b3a4b; }
    .title-button--secondary {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    /* ---- スロット選択画面 ---- */

    .slot-select-screen { background: #f6f6f6; }

    /* 縦型: 4スロットを縦に1列積み。横型: 2×2グリッド（メディアクエリで切り替え）。
       スロット数は4固定のため、スロット追加時のスクロールは考慮しない。 */
    .slot-grid {
      position: relative;
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: repeat(4, 1fr);
      gap: var(--gap);
      padding: calc(20 * var(--u));
    }

    .save-slot {
      position: relative;
      display: flex;
      align-items: center;
      gap: calc(20 * var(--u));
      padding: calc(20 * var(--u));
      border: 1px solid #000;
      border-radius: var(--radius);
      background: #fff;
      cursor: pointer;
      min-width: 0;
      min-height: 0;
    }

    .save-slot--empty {
      justify-content: center;
      border-style: dashed;
      background: rgba(255, 255, 255, 0.5);
      color: #666;
    }

    .slot-portrait {
      flex-shrink: 0;
      width: calc(140 * var(--u));
      height: calc(140 * var(--u));
      border: 1px solid #000;
      border-radius: var(--radius);
      background: #ffe5d1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: calc(72 * var(--u));
    }

    .slot-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: calc(8 * var(--u));
    }

    .slot-name {
      font-size: calc(32 * var(--u));
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .slot-days { font-size: calc(24 * var(--u)); color: #444; }

    .slot-delete {
      position: absolute;
      top: calc(12 * var(--u));
      right: calc(12 * var(--u));
      width: calc(56 * var(--u));
      height: calc(56 * var(--u));
      font-size: calc(26 * var(--u));
      background: #fff0f0;
    }

    .empty-slot-body {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: calc(8 * var(--u));
    }

    .empty-slot-icon { font-size: calc(56 * var(--u)); opacity: 0.6; }
    .empty-slot-label { font-size: calc(28 * var(--u)); font-weight: 700; }

    /* ---- 新規ゲーム作成画面 ---- */

    .newgame-screen { background: #f6f6f6; }

    .newgame-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: calc(28 * var(--u));
      display: flex;
      flex-direction: column;
      gap: calc(32 * var(--u));
    }

    .form-field { display: flex; flex-direction: column; gap: calc(10 * var(--u)); }
    .form-field-label { font-size: calc(26 * var(--u)); font-weight: 700; }

    .form-field-row {
      display: flex;
      align-items: center;
      gap: calc(12 * var(--u));
    }

    .form-input {
      flex: 1;
      min-width: 0;
      height: calc(72 * var(--u));
      border: 1px solid #000;
      border-radius: var(--radius);
      padding: 0 calc(16 * var(--u));
      font-size: calc(28 * var(--u));
      font-family: inherit;
    }

    .random-button {
      flex-shrink: 0;
      width: calc(72 * var(--u));
      height: calc(72 * var(--u));
      border: 1px solid #000;
      border-radius: var(--radius);
      background: #fff2e0;
      font-size: calc(32 * var(--u));
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
    }

    .character-select-row {
      display: flex;
      gap: var(--gap);
      overflow-x: auto;
      padding-bottom: calc(6 * var(--u));
      scrollbar-width: none;
    }

    .character-select-row::-webkit-scrollbar { display: none; }

    .character-option {
      flex-shrink: 0;
      width: calc(160 * var(--u));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: calc(8 * var(--u));
      padding: calc(12 * var(--u));
      border: calc(2 * var(--u)) solid transparent;
      border-radius: var(--radius);
      background: #fff;
      cursor: pointer;
    }

    .character-option--selected {
      border-color: #1b7a5c;
      background: #e3fff0;
    }

    .character-portrait {
      width: 100%;
      aspect-ratio: 1;
      border: 1px solid #000;
      border-radius: var(--radius);
      background: #ffe5d1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: calc(56 * var(--u));
    }

    .character-name {
      font-size: calc(20 * var(--u));
      text-align: center;
      line-height: 1.25;
    }

    .newgame-footer {
      flex-shrink: 0;
      display: flex;
      gap: calc(16 * var(--u));
      padding: calc(20 * var(--u)) calc(28 * var(--u));
      background: #f0f0f0;
    }

    .footer-button {
      flex: 1;
      height: calc(80 * var(--u));
      border-radius: var(--radius);
      border: 1px solid #000;
      font-size: calc(28 * var(--u));
      font-weight: 700;
      cursor: pointer;
    }

    .footer-button--primary { background: #ffd77a; }
    .footer-button--secondary { background: #fff; }

    /* ---- 削除確認モーダル ---- */

    .modal-overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.5);
      z-index: 10;
      padding: calc(24 * var(--u));
    }

    .modal-overlay.active { display: flex; }

    .modal-card {
      width: min(520px, 88vw);
      background: #fff;
      border-radius: var(--radius);
      padding: calc(32 * var(--u));
      display: flex;
      flex-direction: column;
      gap: calc(24 * var(--u));
      text-align: center;
    }

    .modal-title { font-size: calc(28 * var(--u)); font-weight: 700; }
    .modal-body { font-size: calc(24 * var(--u)); color: #333; }

    .modal-actions { display: flex; gap: calc(16 * var(--u)); }

    .modal-button {
      flex: 1;
      height: calc(72 * var(--u));
      border-radius: var(--radius);
      border: 1px solid #000;
      font-size: calc(26 * var(--u));
      font-weight: 700;
      cursor: pointer;
    }

    .modal-button--danger { background: #ff5252; color: #fff; border-color: #ff5252; }
    .modal-button--cancel { background: #fff; }

    /* ---- 横型: スロット選択を2×2グリッドに ---- */

    @media (orientation: landscape) {
      .slot-grid {
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: repeat(2, 1fr);
      }

      .newgame-body { padding: calc(28 * var(--u)) calc(96 * var(--u)); }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- タイトル画面 -->
    <section class="screen-state title-screen active" id="screen-title">
      <div class="label">タイトル画面</div>
      <div class="title-logo">
        <div class="title-logo-sub">Charting the</div>
        <div class="title-logo-main">Unmapped Island</div>
      </div>
      <div class="title-menu">
        <button class="title-button title-button--primary" type="button" data-goto="screen-slots">はじめる</button>
        <button class="title-button title-button--secondary" type="button" title="モックでは未実装">設定</button>
      </div>
    </section>

    <!-- セーブスロット選択画面 -->
    <section class="screen-state slot-select-screen" id="screen-slots">
      <header class="screen-header">
        <button class="icon-button" type="button" data-goto="screen-title" aria-label="タイトルへ戻る" title="タイトルへ戻る">←</button>
        <div class="header-title">セーブデータを選択</div>
      </header>
      <div class="label" style="top: calc(112 * var(--u));">スロット選択画面（4スロット固定）</div>
      <div class="slot-grid" id="slot-grid"></div>
    </section>

    <!-- 新規ゲーム作成画面 -->
    <section class="screen-state newgame-screen" id="screen-newgame">
      <header class="screen-header">
        <button class="icon-button" type="button" data-goto="screen-slots" aria-label="スロット選択へ戻る" title="スロット選択へ戻る">←</button>
        <div class="header-title">新規ゲーム作成</div>
      </header>
      <div class="newgame-body">
        <div class="form-field">
          <div class="form-field-label">島の名前</div>
          <div class="form-field-row">
            <input class="form-input" id="input-name" type="text" maxlength="20" placeholder="例: 霧深い孤島">
            <button class="random-button" type="button" id="btn-random-name" aria-label="島の名前をランダム生成" title="ランダム生成">🎲</button>
          </div>
        </div>
        <div class="form-field">
          <div class="form-field-label">乱数シード</div>
          <div class="form-field-row">
            <input class="form-input" id="input-seed" type="text" inputmode="numeric" maxlength="10" placeholder="例: 1837462519">
            <button class="random-button" type="button" id="btn-random-seed" aria-label="乱数シードをランダム生成" title="ランダム生成">🎲</button>
          </div>
        </div>
        <div class="form-field">
          <div class="form-field-row" style="justify-content: space-between;">
            <div class="form-field-label">キャラクター選択</div>
            <button class="random-button" type="button" id="btn-random-character" aria-label="キャラクターをランダム選択" title="ランダム選択">🎲</button>
          </div>
          <div class="character-select-row" id="character-select-row"></div>
        </div>
      </div>
      <footer class="newgame-footer">
        <button class="footer-button footer-button--secondary" type="button" data-goto="screen-slots">もどる</button>
        <button class="footer-button footer-button--primary" type="button" id="btn-start-newgame">はじめる</button>
      </footer>
    </section>
  </div>

  <!-- 削除確認モーダル -->
  <div class="modal-overlay" id="modal-delete">
    <div class="modal-card">
      <div class="modal-title">セーブデータを削除しますか？</div>
      <div class="modal-body" id="modal-delete-body"></div>
      <div class="modal-actions">
        <button class="modal-button modal-button--cancel" type="button" id="btn-delete-cancel">キャンセル</button>
        <button class="modal-button modal-button--danger" type="button" id="btn-delete-confirm">削除する</button>
      </div>
    </div>
  </div>

  <script>
    // このモックのキャラクターはプレースホルダー（本ゲームのキャラクター仕様は別途検討）。
    const CHARACTERS = [
      { id: 'farmer', icon: '🧑‍🌾', name: '陽気な元農家' },
      { id: 'engineer', icon: '🧑‍🔧', name: '手先の器用な元エンジニア' },
      { id: 'captain', icon: '🧑‍✈️', name: '冷静な元船長' },
      { id: 'medic', icon: '🧑‍⚕️', name: '頼れる元衛生兵' },
    ];

    const NAME_ADJECTIVES = ['霧深い', '陽だまりの', '忘れられた', '静寂の', '潮騒の', '名もなき', '漂着の', '蒼い'];
    const NAME_NOUNS = ['孤島', '岬', '入江', '岩礁', '浜辺', '島'];

    // スロットは4固定。null は空きスロットを表す（モック内のメモリ上の状態であり、
    // 実際の永続化方式は SaveDataManagement.md を参照）。
    let slots = [
      { islandName: '霧深い孤島', days: 12, characterIcon: CHARACTERS[0].icon },
      null,
      { islandName: '名もなき入江', days: 3, characterIcon: CHARACTERS[3].icon },
      null,
    ];

    let currentSlotIndex = null;
    let selectedCharacterId = null;
    let deleteTargetIndex = null;

    function showScreen(id) {
      document.querySelectorAll('.screen-state').forEach((el) => el.classList.toggle('active', el.id === id));
    }

    function renderSlots() {
      const grid = document.getElementById('slot-grid');
      grid.innerHTML = '';
      slots.forEach((slot, index) => {
        const el = document.createElement('div');
        if (slot) {
          el.className = 'save-slot';
          el.innerHTML = `
            <div class="slot-portrait">${slot.characterIcon}</div>
            <div class="slot-info">
              <div class="slot-name">${slot.islandName}</div>
              <div class="slot-days">生存 ${slot.days} 日目</div>
            </div>
            <button class="icon-button slot-delete" type="button" aria-label="このセーブデータを削除" title="削除">🗑️</button>
          `;
          el.addEventListener('click', () => resumeSlot(index));
          el.querySelector('.slot-delete').addEventListener('click', (e) => {
            e.stopPropagation();
            openDeleteModal(index);
          });
        } else {
          el.className = 'save-slot save-slot--empty';
          el.innerHTML = `
            <div class="empty-slot-body">
              <div class="empty-slot-icon">＋</div>
              <div class="empty-slot-label">新規作成</div>
            </div>
          `;
          el.addEventListener('click', () => openNewGame(index));
        }
        grid.appendChild(el);
      });
    }

    function resumeSlot(index) {
      const slot = slots[index];
      alert(`「${slot.islandName}」を再開します（モックのためゲーム画面へは遷移しません）`);
    }

    function openDeleteModal(index) {
      deleteTargetIndex = index;
      document.getElementById('modal-delete-body').textContent =
        `「${slots[index].islandName}」を削除します。この操作は取り消せません。`;
      document.getElementById('modal-delete').classList.add('active');
    }

    function closeDeleteModal() {
      deleteTargetIndex = null;
      document.getElementById('modal-delete').classList.remove('active');
    }

    function randomIslandName() {
      const adj = NAME_ADJECTIVES[Math.floor(Math.random() * NAME_ADJECTIVES.length)];
      const noun = NAME_NOUNS[Math.floor(Math.random() * NAME_NOUNS.length)];
      return adj + noun;
    }

    // シードは Pcg32（src/domain/generation/Pcg32.ts）が seed >>> 0 で消費する値域に合わせ、
    // 符号なし32bit整数（0〜2^32-1）の範囲で生成する。
    function randomSeed() {
      return Math.floor(Math.random() * 4294967296);
    }

    function renderCharacterOptions() {
      const row = document.getElementById('character-select-row');
      row.innerHTML = '';
      CHARACTERS.forEach((c) => {
        const el = document.createElement('div');
        el.className = 'character-option' + (c.id === selectedCharacterId ? ' character-option--selected' : '');
        el.innerHTML = `
          <div class="character-portrait">${c.icon}</div>
          <div class="character-name">${c.name}</div>
        `;
        el.addEventListener('click', () => {
          selectedCharacterId = c.id;
          renderCharacterOptions();
        });
        row.appendChild(el);
      });
    }

    function openNewGame(index) {
      currentSlotIndex = index;
      selectedCharacterId = null;
      document.getElementById('input-name').value = '';
      document.getElementById('input-seed').value = String(randomSeed());
      renderCharacterOptions();
      showScreen('screen-newgame');
    }

    document.getElementById('btn-random-name').addEventListener('click', () => {
      document.getElementById('input-name').value = randomIslandName();
    });

    document.getElementById('btn-random-seed').addEventListener('click', () => {
      document.getElementById('input-seed').value = String(randomSeed());
    });

    document.getElementById('btn-random-character').addEventListener('click', () => {
      selectedCharacterId = CHARACTERS[Math.floor(Math.random() * CHARACTERS.length)].id;
      renderCharacterOptions();
    });

    document.getElementById('btn-start-newgame').addEventListener('click', () => {
      const name = document.getElementById('input-name').value.trim();
      if (!name) { alert('島の名前を入力してください（ランダムボタンでも入力できます）'); return; }
      if (!selectedCharacterId) { alert('キャラクターを選択してください'); return; }
      const character = CHARACTERS.find((c) => c.id === selectedCharacterId);
      slots[currentSlotIndex] = { islandName: name, days: 0, characterIcon: character.icon };
      renderSlots();
      showScreen('screen-slots');
    });

    document.getElementById('btn-delete-cancel').addEventListener('click', closeDeleteModal);
    document.getElementById('btn-delete-confirm').addEventListener('click', () => {
      slots[deleteTargetIndex] = null;
      renderSlots();
      closeDeleteModal();
    });

    document.querySelectorAll('[data-goto]').forEach((el) => {
      el.addEventListener('click', () => showScreen(el.dataset.goto));
    });

    renderSlots();
  </script>
</body>
</html>
