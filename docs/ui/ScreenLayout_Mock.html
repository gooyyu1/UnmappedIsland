<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>UnmappedIsland 画面モック</title>
  <style>
    /*
      レイアウト単位: 1u = 画面短辺 / 1080（CSS では vmin ベース）。
      縦型・横型どちらでも短辺を基準にするため、同一端末ならカードの実寸が向きによらず一致する。
      各寸法の根拠は ScreenLayout.md を参照。
    */
    :root {
      --u: calc(100vmin / 1080);
      --card-w: calc(205 * var(--u));
      --card-h: calc(320 * var(--u));
      --lane-h: calc(352 * var(--u));
      --gap: calc(12 * var(--u));
      --margin: calc(6 * var(--u));
      --bar-gap: calc(20 * var(--u));
      --portrait-w: var(--card-w);
      --portrait-h: var(--card-h);
      --icon-button-size: calc(88 * var(--u));
      --radius: calc(12 * var(--u));
    }

    @font-face {
      font-family: "Noto Sans JP";
      src: local("Noto Sans CJK JP");
      font-weight: 400;
    }
    @font-face {
      font-family: "Noto Sans JP";
      src: local("Noto Sans CJK JP");
      font-weight: 700;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: "Noto Sans JP", "Noto Sans CJK JP", sans-serif;
      overflow: hidden;
    }

    .label {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
      font-size: calc(20 * var(--u));
      line-height: 1.2;
      color: #000;
      background: rgba(255, 255, 255, 0.8);
      pointer-events: none;
    }

    /* 画面全体は4つの領域（オプション・ダッシュボード・フィールド・フィルター）を
       持つグリッド。各領域は grid-area で名指しし、向きが変わっても同じ要素を
       使い回せるようにする。縦型/横型の配置差は grid-template-areas の違いだけで表現する。
       縦型: オプション上部→ダッシュボード→フィールド→フィルター下部の縦積み。
       横型: ダッシュボード｜フィールド｜オプション+フィルターの縦列（右上/右下）の3列。 */
    .screen {
      display: grid;
      width: 100%;
      height: 100%;
      grid-template-columns: 1fr;
      grid-template-rows: auto auto 1fr calc(1080 * var(--u)) auto;
      grid-template-areas:
        "options"
        "situation"
        "dashboard"
        "field"
        "filter";
      background: #f6f6f6;
    }

    .dashboard-column {
      grid-area: dashboard;
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
    }

    /* ---- カード ---- */

    .card {
      --card-icon: "🃏";
      width: var(--card-w);
      height: var(--card-h);
      flex-shrink: 0;
      border: 1px solid #000;
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.85);
      position: relative;
      overflow: hidden;
      color: #111;
    }

    .card::before {
      content: var(--card-icon);
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: calc(96 * var(--u));
      line-height: 1;
      opacity: 0.95;
      z-index: 0;
    }

    .card-name {
      position: absolute;
      top: calc(6 * var(--u));
      left: calc(8 * var(--u));
      right: calc(8 * var(--u));
      z-index: 1;
      font-size: calc(30 * var(--u));
      font-weight: 700;
      line-height: 1.15;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      overflow: hidden;
      text-shadow: 0 0 calc(3 * var(--u)) rgba(255, 255, 255, 0.9);
    }

    .location-lane .card { --card-icon: "🗺️"; }
    .field-item-lane .card { --card-icon: "🪓"; }
    .hand-lane .card { --card-icon: "🍲"; }
    .portrait-card { --card-icon: "🧍"; }

    /* ---- キャラクターエリア ---- */

    .character-area {
      position: relative;
      flex: 1;
      min-height: 0;
      display: flex;
      background: #ffe5d1;
    }

    /* 1行目は「ポートレイト｜地図・装備・怪我の縦列」、2行目は両列にまたがる条件の行。
       このエリアで最も背の高いポートレイト（320u）の高さをボタンが使い切るので、下へ積むより
       1つあたりを大きく取れる。縦型・横型で同じ組み方（横型は幅だけが変わる） */
    .character-display {
      position: relative;
      width: calc(460 * var(--u));
      flex-shrink: 0;
      display: grid;
      grid-template-columns: var(--portrait-w) 1fr;
      grid-template-rows: var(--portrait-h) auto;
      gap: var(--gap);
      /* 下だけ広いのは、この辺が背景のページの下端（表紙の縁）に当たるため。縁ぎりぎりに置くと
         中身が縁に載って見えるので、紙の余白（32u）より広く取る（横型メディアクエリで戻す） */
      padding: calc(16 * var(--u)) calc(16 * var(--u)) calc(48 * var(--u));
      background: #d9f6ff;
    }

    .portrait-card {
      width: var(--portrait-w);
      height: var(--portrait-h);
    }

    /* 地図・装備・怪我。並びは持ち物の近さの順で、押す頻度が最も低い地図が端に来る */
    .slot-button-column {
      display: flex;
      flex-direction: column;
      gap: var(--gap);
      min-width: 0;
    }

    .slot-button-column .icon-button { flex: 1; width: 100%; }

    /* 条件はポートレイトの真下に1行で左詰め。キャラクターの状態なので、カードの下に
       続けて置くと持ち主が読み取れる */
    .condition-row {
      grid-column: 1 / -1;
      display: flex;
      gap: calc(8 * var(--u));
    }

    /* ラベルなしのアイコンのみボタン（オプション・フィルター）。最小タップ領域として
       --icon-button-size（88u）を確保する。条件は状態を示すだけなので一回り小さい */
    .icon-button {
      width: var(--icon-button-size);
      height: var(--icon-button-size);
      flex-shrink: 0;
      border: 1px solid #000;
      border-radius: var(--radius);
      background: #ffffff;
      font-size: calc(52 * var(--u));
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .icon-button--condition {
      --icon-button-size: calc(48 * var(--u));
      font-size: calc(28 * var(--u));
    }

    /* 地図・装備・怪我は種別が分かるよう固定ラベルをアイコンの右に付ける（アイテム名は
       表示せず、タップ先の子ウィンドウで確認する想定）。縦積みで横幅が余るので、
       3つの左端が揃うように左詰めにする */
    .icon-button--map,
    .icon-button--equipment,
    .icon-button--injury {
      justify-content: flex-start;
      gap: calc(12 * var(--u));
      padding: 0 calc(20 * var(--u));
      height: auto;
    }

    .icon-button-icon { font-size: calc(56 * var(--u)); line-height: 1; }

    .icon-button-label {
      font-size: calc(28 * var(--u));
      font-weight: 700;
      line-height: 1;
    }

    .icon-button--map { background: #dbe7ff; }
    .icon-button--equipment { background: #d6fff0; }
    .icon-button--injury { background: #ffe0d6; }

    /* 表示するステータスの数は可変（変化があったもの・要注意なもの・ユーザーが固定した
       ものだけを表示する想定）なので、中央寄せにはせず上端に揃える。
       件数が変わってもレイアウトが飛ばないようにするため */
    .status-area {
      position: relative;
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: calc(16 * var(--u));
      padding: calc(24 * var(--u));
      background: #e3ffe0;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: calc(12 * var(--u));
    }

    .status-name {
      width: calc(140 * var(--u));
      flex-shrink: 0;
      font-size: calc(30 * var(--u));
      font-weight: 700;
    }

    .status-bar-container {
      flex: 1;
      height: calc(36 * var(--u));
      background: #ddd;
      border: 1px solid #999;
      border-radius: calc(8 * var(--u));
      overflow: hidden;
    }

    .status-bar {
      height: 100%;
      background: #4caf50;
    }

    /* ---- 状況エリア（空を敷いた1本の帯。日時と天候名がその上に載る） ---- */

    /* 本の外に置く帯なので、オプションバーと同じく角を丸めず、周囲に余白も残さない。
       高さは載せ物の分しか取らない（日時の上に空を広く余らせても情報が増えないため） */
    .situation-area {
      grid-area: situation;
      position: relative;
      flex-shrink: 0;
      height: calc(128 * var(--u));
    }

    /* 天気ごとの絵を敷く窓。絵だけでは晴天どうしを区別できないため、名前はラベルが受け持つ。
       絵の主題（太陽・雲）は右上に描く約束なので、載せ物はそこを空ける
       （縦型は日時を左下・天候名を右下、横型は天候名を左上・日時を下端。横型メディアクエリ参照） */
    .weather-panel {
      position: relative;
      width: 100%;
      height: 100%;
      background: #7d94a4;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: calc(24 * var(--u));
      padding: calc(16 * var(--u)) calc(24 * var(--u));
    }

    .weather-name {
      font-size: calc(38 * var(--u));
      font-weight: 700;
      color: #fff;
      line-height: 1;
      white-space: nowrap;
      text-shadow: 0 calc(2 * var(--u)) calc(6 * var(--u)) rgba(0, 0, 0, 0.7);
    }

    .flip-calendar {
      flex-shrink: 0;
      border: none;
      background: none;
      padding: 0;
      font: inherit;
      display: flex;
      flex-direction: row;
      align-items: flex-end;
      gap: calc(14 * var(--u));
      line-height: 1;
    }

    /* 日数と時刻は桁の高さが違うため、背の高い日数の桁を基準に下端で揃える
       （中央で揃えると、小さい時刻の桁が宙に浮いて見える） */
    .calendar-row {
      display: flex;
      align-items: flex-end;
      gap: calc(2 * var(--u));
    }

    /* 各桁のフリップカード。上部の留具（リング）だけで吊り下がる。
       実装は穴・リング・影まで描き込んだ白い紙の画像（flip_digit.png）で、ここの疑似要素は近似 */
    .flip-digit {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      color: #111;
      border-radius: calc(6 * var(--u));
      font-weight: 700;
      position: relative;
      box-shadow: 0 calc(2 * var(--u)) calc(3 * var(--u)) rgba(0, 0, 0, 0.3);
    }

    .flip-digit::before,
    .flip-digit::after {
      content: "";
      position: absolute;
      top: calc(-8 * var(--u));
      width: calc(14 * var(--u));
      height: calc(14 * var(--u));
      border-radius: 50%;
      border: calc(3 * var(--u)) solid #6b6b6b;
      box-sizing: border-box;
    }

    .flip-digit::before { left: calc(6 * var(--u)); }
    .flip-digit::after { right: calc(6 * var(--u)); }

    .calendar-row-day .flip-digit {
      width: calc(64 * var(--u));
      height: calc(88 * var(--u));
      font-size: calc(56 * var(--u));
    }

    .calendar-row-time .flip-digit {
      width: calc(44 * var(--u));
      height: calc(60 * var(--u));
      font-size: calc(36 * var(--u));
    }

    /* 幅は固定（COLON_WIDTH）で取り、高さは時刻の桁に合わせる（桁は下端で揃うので、
       日数の桁を含む行の中央とは一致しない） */
    .calendar-colon {
      width: calc(10 * var(--u));
      height: calc(60 * var(--u));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: calc(32 * var(--u));
      font-weight: 700;
      color: #333;
    }

    /* ---- オプションバー ---- */
    /* 縦型: 画面最上部の横長バー。横型: 画面右上の縦積み列（横型メディアクエリ参照） */

    .options-bar {
      grid-area: options;
      position: relative;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: var(--bar-gap);
      padding: calc(16 * var(--u)) calc(24 * var(--u));
      background: #f5e9d5;
    }

    /* ---- フィルターバー ---- */
    /* フィールドエリアに表示するカードをタグで絞り込むボタン列。ラベルなしのアイコンのみで、
       オプションボタンと同じ最小タップ領域（icon-button）を共有する。
       縦型: フィールドエリア下部の横スクロール行。横型: 画面右下の縦積み列
       （横型メディアクエリ参照）。選択中のタグは filter-button--active で強調する */
    .filter-bar {
      grid-area: filter;
      position: relative;
      display: flex;
      align-items: center;
      gap: var(--bar-gap);
      padding: calc(16 * var(--u)) calc(20 * var(--u));
      overflow-x: auto;
      min-width: 0;
      background: #e6dcf5;
      scrollbar-width: none;
    }

    .filter-bar::-webkit-scrollbar { display: none; }

    .filter-button--active {
      background: #3a3a3a;
      color: #fff;
    }

    /* ---- フィールドエリア ---- */

    .field-area {
      grid-area: field;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: var(--margin);
      padding: var(--margin) 0;
      background: #d6d6ff;
      min-height: 0;
      min-width: 0;
    }

    .lane {
      position: relative;
      height: var(--lane-h);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      padding: 0 var(--margin);
    }

    .location-lane { background: #ffe1b3; }
    .field-item-lane { background: #d9ffd5; }
    .hand-lane { background: #e1dbff; }

    .pinned-slot {
      display: flex;
      align-items: center;
      gap: var(--gap);
      flex-shrink: 0;
    }

    .lane-divider {
      width: calc(4 * var(--u));
      height: var(--card-h);
      background: rgba(0, 0, 0, 0.35);
      border-radius: calc(2 * var(--u));
    }

    .lane-scroll {
      display: flex;
      align-items: center;
      gap: var(--gap);
      overflow-x: auto;
      min-width: 0;
      height: 100%;
      padding-left: var(--gap);
      scrollbar-width: none;
    }

    .lane-scroll::-webkit-scrollbar { display: none; }

    .field-item-lane .lane-scroll,
    .hand-lane .lane-scroll { padding-left: 0; }

    /* ---- 横型 ---- */

    @media (orientation: landscape) {
      /* 3列グリッドに変える: ダッシュボード｜フィールド｜オプション+フィルターの縦列。
         右列は上下2行（オプション=画面右上、フィルター=画面右下）で、
         ダッシュボード・フィールドはその2行にまたがる（縦型は1列の縦積み）。
         キャラクター表示エリアの組み方は縦型と同じで、幅だけが列いっぱいに広がる */
      .screen {
        grid-template-columns: calc(484 * var(--u)) 1fr calc(120 * var(--u));
        grid-template-rows: auto auto 1fr;
        grid-template-areas:
          "situation field options"
          "dashboard  field options"
          "dashboard  field filter";
      }

      /* 幅が日時1つ分しかないので、天候名を上・日時を下端へ分ける。そのぶん縦型より高い */
      .situation-area {
        grid-area: situation;
        height: calc(184 * var(--u));
      }

      /* 横型の縁は右辺にあり、ダッシュボード列の幅が既に引いている。下は通常のパディングでよい */
      .character-display { padding-bottom: calc(16 * var(--u)); }

      .weather-panel {
        flex-direction: column;
        align-items: stretch;
        justify-content: space-between;
        padding: calc(16 * var(--u)) calc(20 * var(--u));
      }

      .weather-panel .flip-calendar { justify-content: center; }

      .character-area {
        flex-direction: column;
        flex: 1;
        min-height: 0;
      }

      .character-display { width: 100%; }

      .status-area {
        flex: 1;
        min-height: 0;
        justify-content: flex-start;
        gap: calc(10 * var(--u));
        padding: calc(24 * var(--u));
      }

      /* オプションは画面右上の縦積み列に切り替える */
      .options-bar {
        flex-direction: column;
        height: auto;
        width: 100%;
        justify-content: center;
        padding: calc(16 * var(--u));
      }

      /* フィルターも画面右下の縦積み列に切り替える（ボタン自体はオプションボタンと
         同じ正方形サイズのまま、並び方向だけ変える） */
      .filter-bar {
        flex-direction: column;
        justify-content: flex-start;
        overflow-x: visible;
        overflow-y: auto;
        padding: calc(16 * var(--u));
      }
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="situation-area">
      <div class="label">状況エリア</div>
      <div class="weather-panel">
        <button class="flip-calendar" type="button" aria-label="時間経過アクション" title="時間経過アクション">
          <span class="calendar-row calendar-row-day">
            <span class="flip-digit">0</span>
            <span class="flip-digit">1</span>
            <span class="flip-digit">1</span>
          </span>
          <span class="calendar-row calendar-row-time">
            <span class="flip-digit">1</span>
            <span class="flip-digit">0</span>
            <span class="calendar-colon">:</span>
            <span class="flip-digit">1</span>
            <span class="flip-digit">5</span>
          </span>
        </button>
        <div class="weather-name">灼熱</div>
      </div>
    </section>
    <div class="dashboard-column">
      <section class="character-area">
        <div class="character-display">
          <div class="label">キャラクター表示エリア</div>
          <div class="card portrait-card"><span class="card-name">主人公</span></div>
          <div class="slot-button-column">
            <button class="icon-button icon-button--map" type="button" aria-label="地図" title="地図">
              <span class="icon-button-icon">🗺️</span>
            </button>
            <button class="icon-button icon-button--equipment" type="button" aria-label="装備" title="装備">
              <span class="icon-button-icon">👕</span>
            </button>
            <button class="icon-button icon-button--injury" type="button" aria-label="怪我" title="怪我">
              <span class="icon-button-icon">🩹</span>
            </button>
          </div>
          <div class="condition-row">
            <button class="icon-button icon-button--condition" type="button" aria-label="高揚" title="高揚">💭</button>
            <button class="icon-button icon-button--condition" type="button" aria-label="寒気" title="寒気">🥶</button>
            <button class="icon-button icon-button--condition" type="button" aria-label="疲労" title="疲労">😪</button>
            <button class="icon-button icon-button--condition" type="button" aria-label="空腹" title="空腹">🍽️</button>
          </div>
        </div>
        <!-- 表示するステータスの数は可変（変化があった／要注意／ユーザー固定のみ表示）想定。
             ここでは6項目中4項目だけが該当し表示されている状態を例示する -->
        <div class="status-area">
          <div class="label">ステータスエリア</div>
          <div class="status-item">
            <div class="status-name">HP</div>
            <div class="status-bar-container"><div class="status-bar" style="width:80%"></div></div>
          </div>
          <div class="status-item">
            <div class="status-name">スタミナ</div>
            <div class="status-bar-container"><div class="status-bar" style="width:65%"></div></div>
          </div>
          <div class="status-item">
            <div class="status-name">食料</div>
            <div class="status-bar-container"><div class="status-bar" style="width:30%"></div></div>
          </div>
          <div class="status-item">
            <div class="status-name">精神</div>
            <div class="status-bar-container"><div class="status-bar" style="width:55%"></div></div>
          </div>
        </div>
      </section>
    </div>
    <section class="options-bar">
      <div class="label">オプションバー</div>
      <button class="icon-button" type="button" aria-label="設定" title="設定">⚙️</button>
      <button class="icon-button" type="button" aria-label="図鑑" title="図鑑">📖</button>
      <button class="icon-button" type="button" aria-label="日記" title="日記">📓</button>
      <button class="icon-button" type="button" aria-label="メニュー" title="メニュー">☰</button>
    </section>
    <main class="field-area">
      <div class="lane location-lane">
        <div class="label">ロケーションレーン</div>
        <div class="pinned-slot">
