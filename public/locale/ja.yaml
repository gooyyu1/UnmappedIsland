# 日本語の表示文字列（docs/engine/Localization.md 参照）。
#
# キーはWorldCodexの識別子で、値が画面に出す文字列。WorldCodex側は識別子だけを持ち、
# 表示文字列はこのファイルにだけ書く。ここに無い識別子は、そのまま識別子が表示される。
#
# defaultエントリは、オブジェクト側に定義が無かったときのメンバー（props/actions/combinations）の
# フォールバック。同じ名前のプロパティ・アクションを多くのオブジェクトが共有するため、
# 「特に断らなければこの文字列」をここへ1回だけ書く。

# スロットの表示文字列（子ウィンドウの見出し）。スロットは必ず持ち主のものなので、持ち主込みの
# 言い方をdefaultの書式から組み立てる（中身入りの入れ物の名前と同じ考え方）。
slot_texts:
  default:
    # {slot}がスロットの名前、{owner}が持ち主の名前。
    display_name_with_owner: '{owner}の{slot}'
  contents:
    display_name: 中身
  # 製作中オブジェクトの材料スロット（レシピから自動生成される、inProgressObjects.ts）。
  materials:
    display_name: 材料
  treatment:
    display_name: 手当て
    # 枠へ入れる操作の吹き出し（ドラッグ中に出す）。スロットの名前が場所を指すのに対し、こちらは行為。
    put_in:
      display_name: 手当てする
      description: 治療具を当てる。当てている間だけ効き、外せば効き目も消える。
  equipment:
    display_name: 装備
  injuries:
    display_name: 怪我

object_texts:
  # 全オブジェクト共通のメンバー。ここにdisplay_name/descriptionを書いても、
  # オブジェクト自身の表示名としては使われない（Localization.md 参照）。
  default:
    # 中身を代表にしているオブジェクト（水入りの水筒など）の名前。
    # {container}が入れ物、{content}が中身。言い方を変えたい入れ物だけが、自分のエントリで上書きする。
    display_name_with_content: '{content}入りの{container}'
    # 製作中オブジェクト（レシピから自動生成される型）の名前。{product}が完成品。
    # この型は自動生成なので自分のエントリを持てず、必ずこの書式から組み立てる。
    #
    # **完成品と同じ名前にする。** カード名は枠の中の1行（全角10文字）に収まる長さで書いてあり、
    # そこへ「作りかけの」の5文字を足すと、4文字より長い名前はすべてはみ出す。作りかけであることは
    # 青い覆いが示す（CardView.md 10節）ので、名前で言い直す必要はない。
    display_name_in_progress: '{product}'
    props:
      exploration_progress:
        display_name: 探索の進み具合
        description: この土地をどれだけ調べ尽くしたか。100%に達しても探索は続けられるが、隠された道はもう見つからない。
      size:
        display_name: 量
      travel_minutes:
        display_name: 移動時間
      required_progress:
        display_name: 発見に必要な探索の進み具合
      load:
        display_name: 荷重
        description: 今の担ぎ方で感じている、持ち物と装備の重さ。重すぎると歩けなくなる。
      pain:
        display_name: 痛み
        description: 今感じている痛みの強さ。負っている怪我が重なるほど強くなり、治れば引く。
      durability:
        display_name: 耐久
      severity:
        display_name: 傷の重さ
        description: 残っている傷。時間とともに引いていき、尽きれば治る。
      wariness:
        display_name: 警戒
        description: この動物がどれだけ気を立てているか。傷を負わされれば上がり、放っておけば下がる。
      consciousness:
        display_name: 意識
        description: 起きていて動けるかどうか。痛みと衝撃で薄れ、どちらも引けば戻る。
      shock:
        display_name: 衝撃
        description: 殴られた身体の揺れ。当たった瞬間に跳ね上がり、時間とともに引いていく。
      satiety:
        display_name: 満腹度
      hydration:
        display_name: 水分
      body_fat:
        display_name: 体脂肪
      wakefulness:
        display_name: 覚醒度
      stamina:
        display_name: 体力
      vegetable_nutrition:
        display_name: 野菜の栄養
      meat_nutrition:
        display_name: 肉の栄養
      grain_tuber_nutrition:
        display_name: 穀物・イモの栄養
    actions:
      explore:
        display_name: 探索する
        description: あたりを調べて、アイテム・設置物・他の土地へ続く道を探す。何度でも続けられる。
      travel:
        display_name: 移動する
        description: この道を通って、繋がっている土地へ向かう。
      eat:
        display_name: 食べる
        description: その場で食べる。腹が満ち、含まれている栄養と水分が身体に入る。
      drink:
        display_name: 飲む
        description: 一口（250mL）飲む。残りが少なければ、残っている分だけ飲む。
      collect_rain:
        display_name: 雨を貯める
        description: 空のまま置いて、降っている雨を受ける。降り続くかぎり、雨の強さのぶんだけ溜まっていく。
    combinations:
      pour_in:
        display_name: 注ぎ移す
        description: 中身を相手の容器へ移す。入る分だけ移り、あふれる分は元の容器に残る。
      knap:
        display_name: 打ち割る
        description: 石を打ち合わせて割り、鋭い縁を作る。
      strike:
        display_name: 殴る
        description: 手にした武器で打ちかかる。当たれば傷を負わせられるが、外しても相手は気を立てる。

  # プレイヤーキャラクタ（characters/）。プロパティの表示名は全員共通なのでdefaultへ置く。
  # 表示名は肖像の札に載る名前。どういう人物かは説明の頭の肩書きで示す（選択画面の吹き出しに出る）。
  farmer:
    display_name: トマス
    description: 陽気な元農家。畑仕事で作った丈夫な体と厚い蓄えを持つが、その体を動かすだけの量を食べないと保たない。
  engineer:
    display_name: リナ
    description: 手先の器用な元エンジニア。道具を持ち替えながら夜通し作業する暮らしが体に残っている。歩き回る体力と蓄えは乏しい。
  captain:
    display_name: グレン
    description: 冷静な元船長。長い航海で水の配分と当直の眠気に慣れている。蓄えは人並みよりやや薄い。
  medic:
    display_name: マルコ
    description: 頼れる元衛生兵。どこも欠けたところのない体と、現場を歩き回って培った体力を持つ。

  # 道（locations.yaml）。
  path:
    display_name: 道
    description: 他の土地へ続く道。通れば、その先の土地へ移れる。

  # ヤシの実の加工の連鎖（coconut.yaml）。
  palm_tree:
    display_name: ヤシの木
    description: 高く伸びたヤシ。幹を登れば、まだ落ちない青い実と枯れ葉が採れる。
    actions:
      pick_green_coconut:
        display_name: 実を採る
        description: 幹を登って、まだ落ちない青い実を切り落とす。
      pick_frond:
        display_name: 葉を採る
        description: 幹を登って、垂れ下がった枯れ葉を引き落とす。
  green_coconut:
    display_name: 青いヤシの実
    description: まだ熟していない実。皮も殻も柔らかく、中に飲める水を抱えている。
    combinations:
      bore:
        display_name: 穴を開けて飲む
        description: 皮の上から殻まで刃先を通し、中の水を飲む。開けた水は保たないので、その場で飲みきる。
  drained_green_coconut:
    display_name: 水を飲んだ青い実
    description: 水の抜けた青い実。薄い殻は刃物だけで割れ、内側にゼリー状の果肉が張り付いている。
    combinations:
      split:
        display_name: 割る
        description: 刃物で薄い殻を割り、ゼリー状の果肉を取り出す。器になる殻は残らない。
  coconut_jelly:
    display_name: ヤシのゼリー
    description: 青い実の柔らかい果肉。匙で掬えるほど柔らかく、ほとんどが水分。
  coconut:
    display_name: 熟したヤシの実
    description: 厚い繊維の皮に覆われた実。刃物ではがさないと中の殻に届かない。飲める水は残っていない。
    combinations:
      husk:
        display_name: 皮をはぐ
        description: 刃物で繊維の皮を削ぎ落とし、中の実を取り出す。
  coconut_husk:
    display_name: ヤシの実の皮
    description: はぎ取った繊維の塊。硬く、ほぐれば長い繊維になる。
  husked_coconut:
    display_name: 皮を剥いだヤシの実
    description: 皮を落として殻がむき出しになった実。殻は硬いが、叩くかこじれば二つに割れる。
    combinations:
      crack:
        display_name: 叩き割る
        description: 石を打ちつけ、走った割れ目で二つに割る。
      pry_open:
        display_name: こじ開ける
        description: 殻の継ぎ目へ刃をねじ込み、こじって二つに割る。
  coconut_half:
    display_name: 割れたヤシの実
    description: 半分になった実。殻の内側に白い果肉が張り付いている。
    combinations:
      scrape:
        display_name: 果肉を削り取る
        description: 刃物で内側の果肉を掻き出す。あとには器になる殻が残る。
  coconut_meat:
    display_name: ヤシの果肉
    description: 殻から掻き出した白く硬い果肉。脂が多く、腹に残る。

  # 怪我（injuries.yaml）。
  sprained_ankle:
    display_name: 足首の捻挫
    description: 踏み外した足首の腫れ。体重をかけるたびに痛みが走る。
  laceration:
    display_name: 切り傷
    description: 刃物で切られた傷。浅いので捻挫より早く塞がる。

  # 動物（animals.yaml）。
  monkey:
    display_name: サル
    description: 群れで暮らす小柄なサル。目を離すと、足元に置いたものを持っていく。

  # 治療具（treatments.yaml）。
  bandage:
    display_name: 包帯
    description: 細長く裂いた布。傷口に巻いて清潔に保つ。長く当てておける。

  # 探索で見つかるアイテム（locations.yaml・foods.yaml）。
  thick_branch:
    display_name: 太い枝
    description: 腕ほどの太さの枝。折れ口が生々しく、削れば道具の柄になる。
  stone:
    display_name: 石
    description: 手のひらに収まる硬い石。同じ石で打ち合わせると割れて、鋭い縁ができる。
  branch:
    display_name: 枝
    description: 木から落ちた枝。細く、まだ加工されていない。
  water_spinach:
    display_name: 空心菜
    description: 水辺に生える葉野菜。茎は空洞で、そのまま食べられる。
  coconut_crab:
    display_name: ヤシガニ
    description: 陸に住む大型の甲殻類。道具が無くても、見つけて捕まえるだけで採れる。
  taro:
    display_name: タロイモ
    description: 太平洋の島々で主食とされてきた塊茎。腹持ちがよい。

  # 道具（tools.yaml）。
  sharp_stone:
    display_name: 尖った石
    description: 石を打ち割って作った刃物。切る作業に使える。

  # 葉を編む連鎖（weaving.yaml）。
  palm_frond:
    display_name: ヤシの葉
    description: 長い軸に細長い小葉が並んだ大きな葉。かさばるが、編めば小さくまとまる。
    actions:
      weave:
        display_name: 編む
        description: 中軸を残したまま、左右の小葉を互い違いに組む。
    combinations:
      split_and_weave:
        display_name: 割って編む
        description: 中軸を縦に割り、左右をそれぞれ編む。同じ葉から2枚とれる。
  woven_leaf:
    display_name: 編んだ葉
    description: ヤシの葉を編んだ平たいパネル。籠にも壁にも屋根にも使える。

  # 入れ物（containers.yaml）。
  woven_basket:
    display_name: 編み籠
    description: 編んだ葉を綴じ合わせた入れ物。中に入れた物をまとめて持ち運べる。

  # 探索で見つかる設置物（locations.yaml）。
  berry_bush:
    display_name: ベリーの茂み
    description: 小さな実を付ける低木の茂み。
  cave_entrance:
    display_name: 洞窟の入口
    description: 岩肌に開いた暗い穴。奥がどこまで続いているかは分からない。
  spring:
    display_name: 湧き水
    description: 地面から湧き出す水。汲めば飲み水になる。

  # 液体容器とその中身（liquid_containers.yaml）。
  canteen:
    display_name: 水筒
    description: 蓋の閉まる携帯用の容器。中身は蒸発しない。
  pot:
    display_name: 鍋
    description: 火にかけられる蓋付きの容器。
  bottle:
    display_name: 瓶
    description: 口を塞げる容器。水筒より多く入る。
  jar:
    display_name: 甕
    description: 口の狭い大きな容器。据え置いて水を溜めておける。
  coconut_bowl:
    display_name: ヤシの殻
    description: 果肉を掻き出したあとの半球の殻。器として使える。口が広いので、中身は日にあたると蒸発する。
  water_liquid:
    display_name: 水
    description: 飲めばのどの渇きが癒える。
  tea_liquid:
    display_name: お茶
    description: 葉を煮出した飲み物。渇きを癒し、眠気を覚ます。
  oil_liquid:
    display_name: 油
    description: 燃料や調理に使う液体。飲むものではない。

# プロパティのカテゴリ（GameElementDefinition.md 6.7節、public/world-codex/core.yamlのproperty_tags）。
# キャラクターのプロパティウィンドウのタブ名として使う。
property_tag_texts:
  status:
    display_name: 状態
  health:
    display_name: 健康
  nutrition:
    display_name: 栄養

# シンボル型プロパティの値（GameElementDefinition.md 6.6節）。天気は状況エリアの空の窓に名前として
# 出るので、絵だけでは見分けられない晴天どうし（晴れ・快晴・灼熱）を名前が区別する。
# 天気の名前には次の2つを使わない。
# ・「暑」の字（酷暑・猛暑など）。天気が表すのは日射そのもの（＝原因）で、気温の暑さはそこから
#   生まれる結果であり、別のプロパティ（ambient_temperature）が持つ。灼熱の「熱」は日射の熱さ。
# ・気象庁の定義を持つ語（猛暑日=35℃以上、真夏日=30℃以上）。気温を決める値はいずれも仮の値なので、
#   数値の定義を持つ名前は調整のたびに実態とずれる。
symbol_texts:
  # 天気（ClimateSystem.md 4節）。日射の弱い順。
  storm:
    display_name: 嵐
  heavy_rain:
    display_name: 大雨
  light_rain:
    display_name: 小雨
  cloudy:
    display_name: 曇り
  clear:
    display_name: 晴れ
  sunny:
    display_name: 快晴
  scorching:
    display_name: 灼熱
  # 季節（ClimateSystem.md 2節）。calm→wet→dryの固定順で巡回する。
  calm:
    display_name: 穏やかな季節
  wet:
    display_name: 雨季
  dry:
    display_name: 乾季

# 土地の名前（TerrainGeneration.md 3.6節）。同じ型が島に1つだけならdisplay_nameが、複数あるなら
# 亜種（variants）の名前がその土地の名前になる。亜種の名前は型の名前へ足すのではなく、置き換える。
location_texts:
  default:
    # 亜種を使い切ったときだけ名前に付く通し番号の書式（{n}が番号）。variantsが足りない印なので、
    # これが画面に出たらterrain_generation.yamlへ亜種を足す。
    ordinal_suffix: '（第{n}）'
  sandy_beach:
    display_name: 砂浜
    variants:
      palm: { display_name: ヤシの浜 }
      crab: { display_name: ヤシガニの浜 }
      driftwood: { display_name: 流木の浜 }
      white_sand: { display_name: 白砂の浜 }
      shallow: { display_name: 遠浅の浜 }
      rough_surf: { display_name: 荒波の浜 }
      quiet: { display_name: 静かな浜 }
  rocky_coast:
    display_name: 岩だらけの海岸
    variants:
      cave: { display_name: 洞のある海岸 }
      crab: { display_name: ヤシガニの海岸 }
      boulder: { display_name: 丸石の海岸 }
      black_rock: { display_name: 黒岩の海岸 }
      tide_pool: { display_name: 潮だまりの海岸 }
      wave_washed: { display_name: 波洗いの海岸 }
      crumbling: { display_name: 崩れ岩の海岸 }
      mossy: { display_name: 苔むした海岸 }
      white_rock: { display_name: 白岩の海岸 }
  cliff_coast:
    display_name: 岸壁
    variants:
      cave: { display_name: 洞のある岸壁 }
      layered: { display_name: 層なす岸壁 }
      sheared: { display_name: 断ち切れた岸壁 }
      windy: { display_name: 風鳴りの岸壁 }
  grassland:
    display_name: 草原
    variants:
      berry: { display_name: 木苺の草原 }
      spring: { display_name: 湧き水の草原 }
      tall_grass: { display_name: 丈高い草原 }
      flowering: { display_name: 花咲く草原 }
      windswept: { display_name: 風わたる草原 }
      withered: { display_name: 枯れ色の草原 }
      dewy: { display_name: 露の草原 }
      low_grass: { display_name: 低草の草原 }
      rippling: { display_name: 波打つ草原 }
      quiet: { display_name: 静かな草原 }
      wide: { display_name: 広い草原 }
      rough: { display_name: 荒れた草原 }
      insects: { display_name: 虫の声の草原 }
  forest:
    display_name: 森林
    variants:
      berry: { display_name: 木苺の森 }
      spring: { display_name: 湧き水の森 }
      tall_trees: { display_name: 高木の森 }
      undergrowth: { display_name: 下草の森 }
      mossy: { display_name: 苔の森 }
      fallen_trees: { display_name: 倒木の森 }
      young_trees: { display_name: 若木の森 }
      dark: { display_name: 暗い森 }
      dappled: { display_name: 木漏れ日の森 }
      deep: { display_name: 深い森 }
      silent: { display_name: しじまの森 }
      leaf_litter: { display_name: 枯葉の森 }
      thin_trees: { display_name: 細い木の森 }
  jungle:
    display_name: 密林
    variants:
      palm: { display_name: ヤシの密林 }
      taro: { display_name: 芋の密林 }
      humid: { display_name: 蒸れた密林 }
      broad_leaf: { display_name: 大葉の密林 }
      vines: { display_name: 蔓の密林 }
      dense: { display_name: 濃い密林 }
      damp: { display_name: 湿った密林 }
      birds: { display_name: 鳥の声の密林 }
  rocky_field:
    display_name: 岩場
    variants:
      cave: { display_name: 洞のある岩場 }
      scattered: { display_name: 転石の岩場 }
      cracked: { display_name: 割れ岩の岩場 }
      flat: { display_name: 平岩の岩場 }
      mossy: { display_name: 苔岩の岩場 }
      white_rock: { display_name: 白岩の岩場 }
  wasteland:
    display_name: 荒野
    variants:
      stone: { display_name: 石ころの荒野 }
      deadwood: { display_name: 枯れ枝の荒野 }
      cracked: { display_name: ひび割れた荒野 }
      dusty: { display_name: 砂塵の荒野 }
