# 日本語の表示文字列（docs/engine/Localization.md 参照）。
#
# キーはWorldCodexの識別子で、値が画面に出す文字列。WorldCodex側は識別子だけを持ち、
# 表示文字列はこのファイルにだけ書く。ここに無い識別子は、そのまま識別子が表示される。
#
# defaultエントリは、オブジェクト側に定義が無かったときのメンバー（props/actions/combinations）の
# フォールバック。同じ名前のプロパティ・アクションを多くのオブジェクトが共有するため、
# 「特に断らなければこの文字列」をここへ1回だけ書く。

object_texts:
  # 全オブジェクト共通のメンバー。ここにdisplay_name/descriptionを書いても、
  # オブジェクト自身の表示名としては使われない（Localization.md 参照）。
  default:
    props:
      exploration_progress:
        display_name: 探索の進み具合
        description: この土地をどれだけ調べ尽くしたか。100%に達しても探索は続けられるが、隠された道はもう見つからない。
      size:
        display_name: 量
      travel_minutes:
        display_name: 移動時間
      required_progress:
        display_name: 発見に必要な探索の進み具合
    actions:
      explore:
        display_name: 探索する
        description: あたりを調べて、アイテム・設置物・他の土地へ続く道を探す。何度でも続けられる。
      travel:
        display_name: 移動する
        description: この道を通って、繋がっている土地へ向かう。
      eat:
        display_name: 食べる
        description: その場で食べる。腹が満ち、含まれている栄養と水分が身体に入る。
      drink:
        display_name: 飲む
        description: 一口（250mL）飲む。残りが少なければ、残っている分だけ飲む。
    combinations:
      pour_in:
        display_name: 注ぎ移す
        description: 中身を相手の容器へ移す。入る分だけ移り、あふれる分は元の容器に残る。
      knap:
        display_name: 打ち割る
        description: 石を打ち合わせて割り、鋭い縁を作る。
      put_in:
        display_name: 中に入れる
        description: この入れ物の中へしまう。持ち歩けるようになるが、取り出すまで使えない。

  character:
    display_name: 主人公
    props:
      satiety:
        display_name: 満腹度
      hydration:
        display_name: 水分
      body_fat:
        display_name: 体脂肪
      wakefulness:
        display_name: 覚醒度
      stamina:
        display_name: 体力
      vegetable_nutrition:
        display_name: 野菜の栄養
      meat_nutrition:
        display_name: 肉の栄養
      grain_tuber_nutrition:
        display_name: 穀物・イモの栄養

  # 道（locations.yaml）。
  path:
    display_name: 道
    description: 他の土地へ続く道。通れば、その先の土地へ移れる。

  # 探索で見つかるアイテム（locations.yaml・foods.yaml）。
  coconut:
    display_name: ヤシの実
    description: 硬い殻に覆われた実。中の果肉と水で、飢えと渇きの両方をしのげる。
  thick_branch:
    display_name: 太い枝
    description: 腕ほどの太さの枝。折れ口が生々しく、削れば道具の柄になる。
  stone:
    display_name: 石
    description: 手のひらに収まる硬い石。同じ石で打ち合わせると割れて、鋭い縁ができる。
  branch:
    display_name: 枝
    description: 木から落ちた枝。細く、まだ加工されていない。
  water_spinach:
    display_name: 空心菜
    description: 水辺に生える葉野菜。茎は空洞で、そのまま食べられる。
  coconut_crab:
    display_name: ヤシガニ
    description: 陸に住む大型の甲殻類。道具が無くても、見つけて捕まえるだけで採れる。
  taro:
    display_name: タロイモ
    description: 太平洋の島々で主食とされてきた塊茎。腹持ちがよい。

  # 道具（tools.yaml）。
  sharp_stone:
    display_name: 尖った石
    description: 石を打ち割って作った刃物。切る作業に使える。

  # 入れ物（containers.yaml）。
  woven_basket:
    display_name: 編み籠
    description: 蔓や草を編んだ入れ物。中に入れた物をまとめて持ち運べる。

  # 探索で見つかる設置物（locations.yaml）。
  palm_tree:
    display_name: ヤシの木
    description: 高く伸びたヤシ。実を落とす。
  berry_bush:
    display_name: ベリーの茂み
    description: 小さな実を付ける低木の茂み。
  cave_entrance:
    display_name: 洞窟の入口
    description: 岩肌に開いた暗い穴。奥がどこまで続いているかは分からない。
  spring:
    display_name: 湧き水
    description: 地面から湧き出す水。汲めば飲み水になる。

  # 液体容器とその中身（liquid_containers.yaml）。
  canteen:
    display_name: 水筒
    description: 蓋の閉まる携帯用の容器。中身は蒸発しない。
  pot:
    display_name: 鍋
    description: 火にかけられる蓋付きの容器。
  bottle:
    display_name: 瓶
    description: 口を塞げる容器。水筒より多く入る。
  jar:
    display_name: 甕
    description: 口の狭い大きな容器。据え置いて水を溜めておける。
  coconut_bowl:
    display_name: ヤシの実の器
    description: ヤシの実の殻で作った器。口が広いので、中身は日にあたると蒸発する。
  water_liquid:
    display_name: 水
    description: 飲めばのどの渇きが癒える。
  tea_liquid:
    display_name: お茶
    description: 葉を煮出した飲み物。渇きを癒し、眠気を覚ます。
  oil_liquid:
    display_name: 油
    description: 燃料や調理に使う液体。飲むものではない。

# プロパティのカテゴリ（GameElementDefinition.md 6.7節、public/world-codex/core.yamlのproperty_tags）。
# キャラクターのプロパティウィンドウのタブ名として使う。
property_tag_texts:
  status:
    display_name: 状態
  health:
    display_name: 健康
  nutrition:
    display_name: 栄養
