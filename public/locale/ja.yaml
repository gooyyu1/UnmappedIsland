# 日本語の表示文字列（docs/engine/Localization.md 参照）。
#
# キーはWorldCodexの識別子で、値が画面に出す文字列。WorldCodex側は識別子だけを持ち、
# 表示文字列はこのファイルにだけ書く。ここに無い識別子は、そのまま識別子が表示される。
#
# defaultエントリは、オブジェクト側に定義が無かったときのメンバー（props/actions/combinations）の
# フォールバック。同じ名前のプロパティ・アクションを多くのオブジェクトが共有するため、
# 「特に断らなければこの文字列」をここへ1回だけ書く。

object_texts:
  # 全オブジェクト共通のメンバー。ここにdisplay_name/descriptionを書いても、
  # オブジェクト自身の表示名としては使われない（Localization.md 参照）。
  default:
    props:
      exploration_progress:
        display_name: 探索の進み具合
        description: この土地をどれだけ調べ尽くしたか。100%に達しても探索は続けられるが、隠された道はもう見つからない。
      size:
        display_name: 量
      travel_minutes:
        display_name: 移動時間
      required_progress:
        display_name: 発見に必要な探索の進み具合
    actions:
      explore:
        display_name: 探索する
        description: あたりを調べて、アイテム・設置物・他の土地へ続く道を探す。何度でも続けられる。
      travel:
        display_name: 移動する
        description: この道を通って、繋がっている土地へ向かう。
      eat:
        display_name: 食べる
      drink:
        display_name: 飲む
    combinations:
      pour_in:
        display_name: 注ぎ移す
        description: 中身を相手の容器へ移す。入る分だけ移り、あふれる分は元の容器に残る。
      knap:
        display_name: 打ち割る
        description: 石を打ち合わせて割り、鋭い縁を作る。
      put_in:
        display_name: 中に入れる
        description: この入れ物の中へしまう。持ち歩けるようになるが、取り出すまで使えない。

  character:
    display_name: 主人公
    props:
      satiety:
        display_name: 満腹度
      hydration:
        display_name: 水分
      body_fat:
        display_name: 体脂肪
      wakefulness:
        display_name: 覚醒度
      stamina:
        display_name: 体力
      vegetable_nutrition:
        display_name: 野菜の栄養
      meat_nutrition:
        display_name: 肉の栄養
      grain_tuber_nutrition:
        display_name: 穀物・イモの栄養

  # 道（locations.yaml）。
  path:
    display_name: 道

  # 探索で見つかるアイテム（locations.yaml・foods.yaml）。
  coconut:
    display_name: ヤシの実
  driftwood:
    display_name: 流木
  stone:
    display_name: 石
  branch:
    display_name: 枝
  water_spinach:
    display_name: 空心菜
  coconut_crab:
    display_name: ヤシガニ
  taro:
    display_name: タロイモ

  # 道具（tools.yaml）。
  sharp_stone:
    display_name: 尖った石

  # 入れ物（containers.yaml）。
  woven_basket:
    display_name: 編み籠

  # 探索で見つかる設置物（locations.yaml）。
  palm_tree:
    display_name: ヤシの木
  berry_bush:
    display_name: ベリーの茂み
  cave_entrance:
    display_name: 洞窟の入口
  spring:
    display_name: 湧き水

  # 液体容器とその中身（liquid_containers.yaml）。
  canteen:
    display_name: 水筒
  pot:
    display_name: 鍋
  bottle:
    display_name: 瓶
  jar:
    display_name: 甕
  coconut_bowl:
    display_name: ヤシの実の器
  water_liquid:
    display_name: 水
  tea_liquid:
    display_name: お茶
  oil_liquid:
    display_name: 油

# プロパティのカテゴリ（GameElementDefinition.md 6.9節、public/world-codex/core.yamlのproperty_tags）。
# キャラクターのプロパティウィンドウのタブ名として使う。
property_tag_texts:
  status:
    display_name: 状態
  health:
    display_name: 健康
  nutrition:
    display_name: 栄養
