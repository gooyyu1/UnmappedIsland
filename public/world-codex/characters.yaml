# プレイヤーキャラクターの定義（GameElementDefinition.md参照）。worldと同様、常に1体だけ存在する
# シングルトン。実行文脈上の役割である`actor`（11節以降）は実行時にこのobject_defのインスタンスを
# 指す想定だが、object_defの名前でactorを解決する仕組みは無い。

object_defs:
  character:
    singleton: true
    # 土地のcharactersスロットのaccepts判定用。将来のNPC・動物も同じタグで同じスロットへ入れる。
    tags: [character]
    slots:
      # 手持ち。枠の位置が持ち替えのたびに動かないよう固定型（fixed_positions）の6枠にする
      # （ScreenLayout.md ハンドレーン・SlotSystem.md 3節）。
      hand:
        accepts:
          - {tag: item, max: 9999}
        unit_capacity: 6
        fixed_positions: true
      # 身につけているもの。枠数の上限はまだ決めていないため前詰めスロットにする（子ウィンドウ側は
      # はみ出した分を横スクロールで送る、ScreenLayout.md スロットの子ウィンドウ節）。
      # 「何を装備できるか」の語彙（equippableタグ・部位）は未検討のため、暫定でitemを受け入れる。
      equipment:
        accepts:
          - {tag: item, max: 9999}
      # 怪我。プレイヤーが任意に出し入れするものではなく、ワールド側の効果だけが付け外しする
      # （UIからの移動・並び替えを許さない、ScreenLayout.md 参照）。怪我のobject_defはまだ無い。
      injuries:
        accepts:
          - {tag: injury, max: 9999}
    props:
      # 満腹度。0でも即死せず体調不良につながる想定（未実装。致死性はbody_fat参照）。
      # 満腹から1日（96 tick）で空になる。桁の余裕のため-100/tickで減衰し、max=96*100=9600。
      satiety:
        value: 9600
        range: {min: 0, max: 9600}
        passives:
          - accumulate:
              self:
                satiety: -100
      # 水分。0で脱水。「水なしでは3日」の経験則から、3日（288 tick）で空になる。satietyと同じく
      # -100/tickで減衰し、max=288*100=28800。
      # 現実の水との換算: 1日分の消費(9600単位) = 飲料約2L → 1L ≈ 4800単位（容器の容量の基準）。
      hydration:
        value: 28800
        range: {min: 0, max: 28800}
        passives:
          - accumulate:
              self:
                hydration: -100
      # 体脂肪。尽きると餓死する致死的パラメータ（餓死の実処理は未実装）。現実の絶食は1.5〜2ヶ月
      # 保つとされるが、サバイバル性のため「最大限に肥満した状態」を60日（5760 tick）分に縮める。
      # 初期値は標準体格を想定した15日分＝maxの1/4。-100/tickで減衰し、max=576000、初期値=144000。
      # 食事による回復（食料ごとの体脂肪への配分）は未実装。
      body_fat:
        value: 144000
        range: {min: 0, max: 576000}
        passives:
          - accumulate:
              self:
                body_fat: -100
      # 覚醒度。0で強制的に眠りに入る想定（未実装。致死性は無い）。約24時間（96 tick）で
      # 抗えない眠気が始まるとされる。-100/tickで減衰し、max=96*100=9600。
      wakefulness:
        value: 9600
        range: {min: 0, max: 9600}
        passives:
          - accumulate:
              self:
                wakefulness: -100
      # 体力（疲労の逆）。0で疲労困憊の状態を表す。
      stamina:
        value: 100
        range: {min: 0, max: 100}
      # 栄養バランス（野菜/肉/穀物・イモの3カテゴリ）。「飽き」（短スパンの繰り返しペナルティ、
      # 別途検討）とは別に、「あるカテゴリを長期間摂っていない」ことを検出する。経過tickの
      # カウンタでなく数値の増減なのは、食料ごとのカロリー密度・栄養密度の差や、料理の複数カテゴリ
      # への部分加算を表現するため。食べると回復し毎tick減る、satiety等と同じ構造。
      # 減少時の体調不良は未実装。maxと減衰量（1週間で空になる想定）は仮の値。
      vegetable_nutrition:
        value: 67200
        range: {min: 0, max: 67200}
        passives:
          - accumulate:
              self:
                vegetable_nutrition: -100
      meat_nutrition:
        value: 67200
        range: {min: 0, max: 67200}
        passives:
          - accumulate:
              self:
                meat_nutrition: -100
      grain_tuber_nutrition:
        value: 67200
        range: {min: 0, max: 67200}
        passives:
          - accumulate:
              self:
                grain_tuber_nutrition: -100
