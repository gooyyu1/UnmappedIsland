# 地形生成の定義（TerrainGeneration.md参照）。土地・道そのもののobject_defsはlocations.yamlが持ち、
# このファイルは軸・LocationType・生成スコープだけを定義する。ルートキー axes / location_types /
# generation_scopes は地形生成専用のトップレベルキー（WorldCodexYamlLoader.Generation.cs が解釈する）。
#
# 数値の規約: 軸の値は 0〜100 の整数（百分率）。「プロパティ値は32bit整数のみ」の規約
# （GameElementDefinition.md 6節）に合わせ、YAMLにfloatを書かせない。ノイズ等の計算の内部だけ
# 実数を使い、サイトへ値を与える時点で整数へ量子化する。weight・move_cost も整数（100=等倍）。

# ------------------------------------------------------------------
# axes: 地点が持つ連続値パラメータ（TerrainGeneration.md 3.1節）。
# generatorは汎用プリミティブの重み合成（blend）:
# - distance_field: 島の縁からの距離（reference: edge。中心=100、縁=0）
# - layered_noise: シード付き格子値ノイズ（octaves/frequency/seed_offset）
# blob_scatter・modifiers（3.1節）は未実装。
# ------------------------------------------------------------------
axes:
  # 標高。内陸ほど高くなる距離場を主成分に、ノイズで起伏を加える。「海岸に囲まれた島で、
  # 内陸に山がある」という島の基本形はこの軸が作る。
  elevation:
    range: {min: 0, max: 100}
    generator:
      blend:
        - {type: distance_field, reference: edge, weight: 70}
        - {type: layered_noise, octaves: 3, frequency: 2, seed_offset: 11, weight: 30}

  # 湿り気。純粋なノイズで、島のどこが湿りどこが乾くかをシードごとに変える。
  # 草原（中庸）・密林（高湿）・荒野（乾燥）の配置を分ける。
  humidity:
    range: {min: 0, max: 100}
    generator:
      blend:
        - {type: layered_noise, octaves: 2, frequency: 3, seed_offset: 23, weight: 100}

  # 海岸からの距離（縁=0、中心=100）。海岸帯の判定（coast_band）とhard_limitsに使う。
  coastal_distance:
    range: {min: 0, max: 100}
    generator:
      blend:
        - {type: distance_field, reference: edge, weight: 100}

  # 岩がちさ。海岸のバリエーション（砂浜/岩海岸/岸壁）と、内陸の岩場の判別に使う。
  ruggedness:
    range: {min: 0, max: 100}
    generator:
      blend:
        - {type: layered_noise, octaves: 4, frequency: 4, seed_offset: 37, weight: 100}

# ------------------------------------------------------------------
# location_types: 軸空間上の「理想点+許容範囲」としてのLocationType定義
# （TerrainGeneration.md 3.2節）。マッチングは正規化した重み付き距離の最近傍探索:
#   D = sqrt( Σ w_i * ((v_i - ideal_i) / tolerance_i)^2 / Σ w_i )
# 言及した軸だけで正規化するため、言及軸が少ない型が有利になる次元数バイアスは生じない。
# toleranceは距離のスケールであり、超えたら除外というゲートではない。絶対的な除外は
# hard_limitsだけが担う（3.2〜3.3節）。
#
# - object_def: この型が実体化するときのobject_defs（locations.yaml）のid。Build時に存在検証する。
# - display_name: 命名処理（3.6節）に使う表示名。同じ型が島に1つだけなら、これがそのまま名前になる。
# - name_pool: 同じ型が複数あるときに配る名前の候補。**島のどこに在るかが分かる語を入れないこと。**
#   地形の把握はプレイヤー自身の仕事なので、方角や「島の奥の」のような語を名前に出すと、行き先の
#   名前を見ただけで島の形が割れてしまう。1つの島で使うのはmax_sites_per_type個までだが、それより
#   多く書いておくと島ごとに違う名前が出る。足りない分は漢数字の接尾辞で埋まる。
# - move_cost: 移動コスト（100=等倍）。道のtravel_minutes = 距離 × base_minutes_per_distance ×
#   両端move_costの平均/100 で決まる（3.5節）。
# - is_fallback/priority: どの型もhard_limitsで弾かれたサイトの受け皿（3.3節）。
#   priorityが最も高いfallbackが選ばれる。
# - 海岸過多の防止: 海岸3種はhard_limits(coastal_distance.max=coast_band)で海岸帯にしか出ず、
#   内陸型はmin=coast_band+1で海岸帯に出ない。海岸帯のサイト数自体を絞るのはサイト配置側
#   （generation_scopes.island.interior_bias と hull_coast）。
# ------------------------------------------------------------------
location_types:
  sandy_beach:
    object_def: sandy_beach
    display_name: 砂浜
    name_pool: [白砂の浜, 貝殻の浜, 流木の浜, 遠浅の浜, 荒波の浜, 細砂の浜, 静かな浜]
    applicable_scopes: [island]
    move_cost: 100
    axis_preferences:
      ruggedness: {ideal: 15, tolerance: 30, weight: 100}
    hard_limits:
      coastal_distance: {max: 15}

  rocky_coast:
    object_def: rocky_coast
    display_name: 岩だらけの海岸
    name_pool: [丸石の海岸, 黒岩の海岸, 潮だまりの海岸, 藻の海岸, 波洗いの海岸, 崩れ岩の海岸, 苔むした海岸, 貝の海岸, 白岩の海岸]
    applicable_scopes: [island]
    move_cost: 130
    axis_preferences:
      ruggedness: {ideal: 60, tolerance: 30, weight: 100}
      elevation:  {ideal: 10, tolerance: 30, weight: 60}
    hard_limits:
      coastal_distance: {max: 15}

  cliff_coast:
    object_def: cliff_coast
    display_name: 岸壁
    name_pool: [層なす岸壁, 断ち切れた岸壁, 風鳴りの岸壁]
    applicable_scopes: [island]
    move_cost: 170
    axis_preferences:
      ruggedness: {ideal: 90, tolerance: 25, weight: 100}
      elevation:  {ideal: 45, tolerance: 25, weight: 80}
    hard_limits:
      coastal_distance: {max: 15}

  grassland:
    object_def: grassland
    display_name: 草原
    name_pool: [丈高い草原, 花咲く草原, 風わたる草原, 枯れ色の草原, 露の草原, 低草の草原, 波打つ草原, 静かな草原, 広い草原, 荒れた草原, 虫の声の草原]
    applicable_scopes: [island]
    move_cost: 100
    axis_preferences:
      humidity:  {ideal: 45, tolerance: 20, weight: 100}
      elevation: {ideal: 30, tolerance: 25, weight: 80}
    hard_limits:
      coastal_distance: {min: 16}
      elevation: {max: 60}

  forest:
    object_def: forest
    display_name: 森林
    name_pool: [高木の森, 下草の森, 苔の森, 倒木の森, 若木の森, 暗い森, 木漏れ日の森, 深い森, しじまの森, 枯葉の森, 実りの森, 細い木の森]
    applicable_scopes: [island]
    move_cost: 120
    axis_preferences:
      humidity:  {ideal: 65, tolerance: 20, weight: 100}
      elevation: {ideal: 40, tolerance: 30, weight: 80}
    hard_limits:
      coastal_distance: {min: 16}
      elevation: {max: 70}

  jungle:
    object_def: jungle
    display_name: 密林
    name_pool: [蒸れた密林, 大葉の密林, 蔓の密林, 濃い密林, 湿った密林, 鳥の声の密林]
    applicable_scopes: [island]
    move_cost: 160
    axis_preferences:
      humidity:  {ideal: 90, tolerance: 20, weight: 120}
      elevation: {ideal: 30, tolerance: 30, weight: 60}
    hard_limits:
      coastal_distance: {min: 16}
      humidity: {min: 65}
      elevation: {max: 65}

  rocky_field:
    object_def: rocky_field
    display_name: 岩場
    name_pool: [転石の岩場, 割れ岩の岩場, 平岩の岩場, 苔岩の岩場, 白岩の岩場]
    applicable_scopes: [island]
    move_cost: 140
    axis_preferences:
      ruggedness: {ideal: 85, tolerance: 25, weight: 100}
      humidity:   {ideal: 35, tolerance: 30, weight: 50}
    hard_limits:
      coastal_distance: {min: 16}
      elevation: {max: 75}

  wasteland:
    object_def: wasteland
    display_name: 荒野
    name_pool: [ひび割れた荒野, 砂塵の荒野, 枯れ枝の荒野, 石ころの荒野, 白茶けた荒野, 果てない荒野, 静まった荒野]
    applicable_scopes: [island]
    is_fallback: true
    priority: 0
    move_cost: 110
    axis_preferences:
      humidity: {ideal: 10, tolerance: 25, weight: 100}
    hard_limits:
      coastal_distance: {min: 16}

  mountainside:
    object_def: mountainside
    display_name: 山腹
    name_pool: [がれ場の山腹, 灌木の山腹, 急な山腹, 崩れた山腹, 岩肌の山腹, 草付きの山腹, 石だらけの山腹]
    applicable_scopes: [island]
    move_cost: 200
    axis_preferences:
      elevation: {ideal: 75, tolerance: 15, weight: 100}
    hard_limits:
      coastal_distance: {min: 16}
      elevation: {min: 55}

  mountain_peak:
    object_def: mountain_peak
    display_name: 山頂
    name_pool: [裸岩の山頂, 風の山頂, 平らな山頂]
    applicable_scopes: [island]
    move_cost: 250
    axis_preferences:
      elevation: {ideal: 100, tolerance: 15, weight: 100}
    hard_limits:
      coastal_distance: {min: 16}
      elevation: {min: 80}

# ------------------------------------------------------------------
# generation_scopes: 生成スコープごとのパラメータプリセット（TerrainGeneration.md 3.7節）。
# 島の生成と構造物内部の生成は同一の生成ロジックを共有し、違いはこのプリセットの差だけにする。
# structure_interiorは洞窟内部の再帰生成とあわせて今後の課題。
# ------------------------------------------------------------------
generation_scopes:
  island:
    # 生成する土地の数（この範囲からシードで抽選）。
    site_count: {min: 10, max: 20}
    # coastal_distanceがこの値以下のサイトを「海岸帯」とみなす（海岸型のhard_limitsと対で使う）。
    coast_band: 15
    # 外周リング（島を囲む海岸候補の配置枠、SitePlacer参照）のサイトのcoastal_distanceを
    # 海岸帯へクランプし、島が必ず海岸で囲まれることを保証する。
    hull_coast: true
    # サイト配置の内陸バイアス（0=一様、100=最大）。島の縁に張り付くサイトを減らし、
    # 海岸が多くなりすぎないようにする（普通に円盤へ一様散布すると面積比で外周が多数になるため）。
    interior_bias: 60
    # MST以外のDelaunay辺を復活させる迂回率の閾値（%）。現グラフでの2点間最短距離が
    # 直結距離のこの割合を超えるなら、その辺を近道として復活させる。上げるほど道は減る
    # （下限は全土地を繋ぐMSTの平均次数≒1.9）。200で平均次数2.5・行き止まり15%ほど。
    # 変えたら docs/diagnostics/TerrainStats.md を再生成する（npm run stats:terrain）。
    extra_edge_detour_factor: 200
    # 同じ土地を何個まで置いてよいか（0で無制限）。同じ地形は環境も発見物も見た目も同じなので、
    # 並べても島は広くならない。海岸帯のサイトは最大7個で海岸型は3種類、内陸は最大13個で内陸型は
    # 7種類あるので、3なら数の上で必ず収まる（実測はTerrainStats.md）。
    max_sites_per_type: 3
    # 同じ型が1個増えるごとにマッチング距離へ乗せる割増（%）。上限に当たる前から他の型へ譲らせ、
    # 「上限で打ち切られた」島ばかりにならないようにする。
    crowding_penalty: 60
    # 抽象座標の距離1あたりの基準移動時間（分）。島の直径=200単位を想定
    # （隣接する土地の典型的な距離は40前後 → 移動コスト等倍でおよそ45分）。
    base_minutes_per_distance: 1
    # カバレッジ保証（TerrainGeneration.md 3.4節・6節）。軸の分布だけでは個数を保証できないため、
    # 「指定軸が最大/最小のサイトへこの型を強制割当する」処理をマッチングの前に行う。
    # 島には必ず山がひとつある。
    guarantees:
      - {location_type: mountain_peak, count: 1, axis: elevation, pick: max}
