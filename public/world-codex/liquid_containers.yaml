# 液体容器の定義。液体は個数ではなく量で存在し（quantitative、GameElementDefinition.md 7.6節）、
# 量は液体自身がsizeとして持つ。上限は容器のcontentスロットのcapacityが決める。
# 設計の全体像はLiquidContainerSystem.mdを参照。
#
# 固形物を入れる容器（containers.yaml）とは構造が別。あちらは中身をスロットへそのまま入れるだけで、
# こちらは中身が量を持ち、注ぎ移しが量の移動になる。

traits:
  # 液体を1つ入れる容器。中身が代表（represented_by）となり、操作もスタック判定も中身へ委譲する。
  liquid_container:
    represented_by: content
    combinations:
      # 受け側が空のとき、代表は容器自身なのでこちらが発火する（中身入りならliquid側が発火する）。
      # 空いている量だけ入り、入りきらない分は注ぎ元に残る（quantitativeの規定）。
      pour_in:
        with: liquid
        move: {object: dragged, to: self}

  # 液体に共通する、量としての振る舞い。
  liquid:
    tags: [liquid]
    quantitative: true
    props:
      # 量。単位はmL（1 = 1mL、LiquidContainerSystem.md 5節）。
      # 上限は容器のcontentスロットのcapacityが決めるため、ここではrangeを持たない。
      size:
        value: 0
      # 単位量あたりの重さ。水を100とする＝100が1g/mL（ContainerSystem.md）。
      density:
        value: 100
    # 見た目の色（color、0xRRGGBB）は種類ごとのtraitが宣言する。何色に見えるかは液体そのものの
    # 性質で、共通の既定値には意味が無いため。容器カードの中身のバーがこの色で塗られる
    # （ScreenLayout.md カードの状態バー節）。
    combinations:
      # 受け側が中身入りのとき、代表は中身の液体自身。移し先は自分ではなく容器なのでto: parent。
      # 異種の液体はcontentのaccepts（max 1）が拒むため、条件を書く必要がない。
      pour_in:
        with: liquid
        move: {object: dragged, to: parent}

  sealed_container:
    tags: [sealed_container]

  wide_open_container:
    tags: [wide_open_container]

  narrow_open_container:
    tags: [narrow_open_container]

  water_liquid:
    tags: [water_liquid]
    props:
      color: {value: 0x2f86d8}
    actions:
      # 1回の飲用 = 250mL。残量が足りなければ残っている分だけ飲む（transferの在庫クランプ）。
      # 満水では何も移らない操作になるため、実行自体をさせない。境目はキャラクターのhydrationの
      # full段が持つ（Characters.md）。
      drink:
        conditions:
          - reason: not_thirsty
            not: {object: actor, prop: hydration, in_stage: full}
        transfer:
          amount: 250
          from_prop: size
          to_object: actor
          to_prop: hydration

  tea_liquid:
    tags: [tea_liquid]
    props:
      color: {value: 0x6f8f3c}
    actions:
      drink:
        conditions:
          - reason: not_thirsty
            not: {object: actor, prop: hydration, in_stage: full}
        transfer:
          amount: 250
          from_prop: size
          to_object: actor
          to_prop: hydration
          linked_add:
            actor:
              wakefulness: 200

  # 飲めない液体はdrinkを定義しないだけでよい。
  oil_liquid:
    tags: [oil_liquid]
    props:
      color: {value: 0xe0b422}

  # 開いた容器から蒸発する。日射に依らない基礎の蒸発と、sunlightのしきい値で決まる上乗せの和
  # （LiquidContainerSystem.md 6節）。密閉容器はどちらのゲートも成立しないため蒸発しない。
  # 量が尽きたインスタンスはエンジンが消す（quantitativeの規定）。
  evaporating_liquid:
    passives:
      # 基礎。湿度が未実装のため、雨天は「湿度が高くて乾かない」の代理として除外する。
      - conditions:
          - {object: parent, tag: wide_open_container}
          - {object: ancestor, prop: weather, not_in: [light_rain, heavy_rain, storm]}
        accumulate:
          self:
            size: -1
      - conditions:
          - {object: parent, tag: narrow_open_container}
          - {object: ancestor, prop: weather, not_in: [light_rain, heavy_rain, storm]}
        accumulate:
          self:
            size: -2
      # 日射による上乗せ。夜はsunlightが0になる（core.yamlのhour）ため成立せず、雨天のsunlightは
      # 最大6で最も低いしきい値10に届かないため、天候を見る必要がない。
      - conditions:
          - {object: parent, tag: narrow_open_container}
          - {object: ancestor, prop: sunlight, gte: 10}
        accumulate:
          self:
            size: -2
      - conditions:
          - {object: parent, tag: wide_open_container}
          - {object: ancestor, prop: sunlight, gte: 12}
        accumulate:
          self:
            size: -1
      - conditions:
          - {object: parent, tag: narrow_open_container}
          - {object: ancestor, prop: sunlight, gte: 12}
        accumulate:
          self:
            size: -2
      - conditions:
          - {object: parent, tag: wide_open_container}
          - {object: ancestor, prop: sunlight, gte: 15}
        accumulate:
          self:
            size: -1
      - conditions:
          - {object: parent, tag: narrow_open_container}
          - {object: ancestor, prop: sunlight, gte: 15}
        accumulate:
          self:
            size: -2

object_defs:
  # 容量はcontentスロットのcapacityで持つ。単位はmLなので、1L = 1000。
  canteen:
    traits: [liquid_container, sealed_container]
    props:
      weight: {value: 300}
    slots:
      content:
        accepts: [{tag: liquid, max: 1}]
        capacity: 1000

  pot:
    traits: [liquid_container, sealed_container]
    props:
      weight: {value: 1500}
    slots:
      content:
        accepts: [{tag: liquid, max: 1}]
        capacity: 1000

  bottle:
    traits: [liquid_container, sealed_container]
    props:
      weight: {value: 500}
    slots:
      content:
        accepts: [{tag: liquid, max: 1}]
        capacity: 2000

  jar:
    traits: [liquid_container, narrow_open_container]
    props:
      weight: {value: 1200}
    slots:
      content:
        accepts: [{tag: liquid, max: 1}]
        capacity: 4000

  # ヤシの殻。割ったヤシの実から果肉を掻き出すと残る（coconut.yaml）。カードとして持ち歩けるよう、
  # 容器の中では唯一itemタグを持つ（他の容器はまだ入手手段が無い）。
  coconut_bowl:
    tags: [item]
    traits: [liquid_container, wide_open_container]
    props:
      weight: {value: 200}
    slots:
      content:
        accepts: [{tag: liquid, max: 1}]
        capacity: 250

  water_liquid:
    traits: [liquid, water_liquid, evaporating_liquid]

  tea_liquid:
    traits: [liquid, tea_liquid, evaporating_liquid]

  oil_liquid:
    traits: [liquid, oil_liquid, evaporating_liquid]
