# 液体容器の定義。液体は個数ではなく量で存在し（quantitative、GameElementDefinition.md 7.6節）、
# 量は液体自身がvolumeとして持つ。上限は容器のcontentスロットのcapacityが決める。
# 設計の全体像はLiquidContainerSystem.mdを参照。
#
# 固形物を入れる容器（containers.yaml）とは構造が別。あちらは中身をスロットへそのまま入れるだけで、
# こちらは中身が量を持ち、注ぎ移しが量の移動になる。

traits:
  # 液体を1つ入れる容器。中身が代表（represented_by）となり、操作もスタック判定も中身へ委譲する。
  liquid_container:
    represented_by: content
    combinations:
      # 受け側が空のとき、代表は容器自身なのでこちらが発火する（中身入りならliquid側が発火する）。
      # 空いている量だけ入り、入りきらない分は注ぎ元に残る（quantitativeの規定）。
      pour_in:
        with: liquid
        move: {object: dragged, to: self}

  # 液体に共通する、量としての振る舞い。
  liquid:
    tags: [liquid]
    quantitative: true
    # 器の無い水は存在しない（7.9節）。器から出せず、器が壊れれば一緒に失われる。
    bound_to_owner: true
    props:
      # 量。単位はmL（1 = 1mL、LiquidContainerSystem.md 5節）。
      # 上限は容器のcontentスロットのcapacityが決めるため、ここではrangeを持たない。
      # 値が効くのはspawnで生まれたときだけ（注ぎ移しで生まれたインスタンスは移った量で上書きされる）。
      # 0にできないのは、量が0の量的オブジェクトは存在しないため（quantitativeの不変条件）。
      volume:
        value: 1
      # 単位量あたりの重さ（g/mL）。水は1で、油のように軽い液体は0.92のように書く。
      # volume × density がそのまま重さ（g）になる（ContainerSystem.md 1節）。
      density:
        value: 1
    # 見た目の色（color、0xRRGGBB）は種類ごとのtraitが宣言する。何色に見えるかは液体そのものの
    # 性質で、共通の既定値には意味が無いため。容器カードの中身のバーがこの色で塗られる
    # （ScreenLayout.md カードの状態バー節）。
    combinations:
      # 受け側が中身入りのとき、代表は中身の液体自身。移し先は自分ではなく容器なのでto: parent。
      # 異種の液体はcontentの枠が1つしかないため入らず、条件を書く必要がない。
      pour_in:
        with: liquid
        move: {object: dragged, to: parent}

  sealed_container:
    tags: [sealed_container]

  wide_open_container:
    tags: [wide_open_container]

  narrow_open_container:
    tags: [narrow_open_container]

  # 空けたまま置いて雨を受けられる容器（LiquidContainerSystem.md 7節）。中身が入っている容器は
  # 代表が中身の液体へ移る（3節）ため、このアクションは空のときにしか現れない。溜まり始めたあとの量は
  # 水自身が増やす（rain_filled_liquid）。
  rain_catching_container:
    actions:
      collect_rain:
        conditions:
          - reason: not_raining
            object: ancestor
            prop: weather
            in: [light_rain, heavy_rain, storm]
        spawn: {object: water_liquid, into: self}

  water_liquid:
    tags: [water_liquid]
    props:
      color: {value: 0x2f86d8}
    actions:
      # 1回の飲用 = 250mL。残量が足りなければ残っている分だけ飲む（transferの在庫クランプ）。
      # 満水では何も移らない操作になるため、実行自体をさせない。境目はキャラクターのhydrationの
      # full段が持つ（Characters.md）。
      #
      # 水分はtick数で持つので（6.0節）、mLからの換算率はto_amountが持つ: 体は25mL/tickを失うため、
      # 250mLは10 tick分にあたる。寄与の小さい液体（酒）はこの比を小さくするだけで表せる。
      drink:
        conditions:
          - reason: not_thirsty
            not: {object: actor, prop: hydration, in_stage: full}
        transfer:
          amount: 250
          to_amount: 10
          from_prop: volume
          to_object: actor
          to_prop: hydration

  tea_liquid:
    tags: [tea_liquid]
    props:
      color: {value: 0x6f8f3c}
    actions:
      drink:
        conditions:
          - reason: not_thirsty
            not: {object: actor, prop: hydration, in_stage: full}
        transfer:
          amount: 250
          to_amount: 10
          from_prop: volume
          to_object: actor
          to_prop: hydration
          linked_add:
            actor:
              wakefulness: 2

  # 飲めない液体はdrinkを定義しないだけでよい。
  oil_liquid:
    tags: [oil_liquid]
    props:
      color: {value: 0xe0b422}

  # 開いた容器から蒸発する。日射に依らない基礎の蒸発と、sunlightのしきい値で決まる上乗せの和
  # （LiquidContainerSystem.md 6節）。密閉容器はどちらのゲートも成立しないため蒸発しない。
  # 量が尽きたインスタンスはエンジンが消す（quantitativeの規定）。
  evaporating_liquid:
    passives:
      # 基礎。湿度が未実装のため、雨天は「湿度が高くて乾かない」の代理として除外する。
      - conditions:
          - {object: parent, tag: wide_open_container}
          - {object: ancestor, prop: weather, not_in: [light_rain, heavy_rain, storm]}
        accumulate:
          self:
            volume: -1
      - conditions:
          - {object: parent, tag: narrow_open_container}
          - {object: ancestor, prop: weather, not_in: [light_rain, heavy_rain, storm]}
        accumulate:
          self:
            volume: -2
      # 日射による上乗せ。夜はsunlightが0になる（core.yamlのhour）ため成立せず、雨天のsunlightは
      # 最大6で最も低いしきい値10に届かないため、天候を見る必要がない。
      - conditions:
          - {object: parent, tag: narrow_open_container}
          - {object: ancestor, prop: sunlight, gte: 10}
        accumulate:
          self:
            volume: -2
      - conditions:
          - {object: parent, tag: wide_open_container}
          - {object: ancestor, prop: sunlight, gte: 12}
        accumulate:
          self:
            volume: -1
      - conditions:
          - {object: parent, tag: narrow_open_container}
          - {object: ancestor, prop: sunlight, gte: 12}
        accumulate:
          self:
            volume: -2
      - conditions:
          - {object: parent, tag: wide_open_container}
          - {object: ancestor, prop: sunlight, gte: 15}
        accumulate:
          self:
            volume: -1
      - conditions:
          - {object: parent, tag: narrow_open_container}
          - {object: ancestor, prop: sunlight, gte: 15}
        accumulate:
          self:
            volume: -2

  # 開いた容器に置かれている間、降っている雨のぶんだけ増える（LiquidContainerSystem.md 7節）。
  # 蒸発の裏返しで、ゲートは同じ「容器の開き方」と「天候」の2つ。雨の強さは3段しかないので、
  # 蒸発のような基礎＋上乗せの形は取らず、1行が1つの降り方の量そのものを表す。
  # capacityを超えた分はあふれて失われる（エンジンが戻す不変条件、GameElementDefinition.md 7.6節）。
  rain_filled_liquid:
    passives:
      - conditions:
          - {object: parent, tag: wide_open_container}
          - {object: ancestor, prop: weather, eq: light_rain}
        accumulate:
          self:
            volume: 10
      - conditions:
          - {object: parent, tag: wide_open_container}
          - {object: ancestor, prop: weather, eq: heavy_rain}
        accumulate:
          self:
            volume: 20
      - conditions:
          - {object: parent, tag: wide_open_container}
          - {object: ancestor, prop: weather, eq: storm}
        accumulate:
          self:
            volume: 40
      - conditions:
          - {object: parent, tag: narrow_open_container}
          - {object: ancestor, prop: weather, eq: light_rain}
        accumulate:
          self:
            volume: 20
      - conditions:
          - {object: parent, tag: narrow_open_container}
          - {object: ancestor, prop: weather, eq: heavy_rain}
        accumulate:
          self:
            volume: 40
      - conditions:
          - {object: parent, tag: narrow_open_container}
          - {object: ancestor, prop: weather, eq: storm}
        accumulate:
          self:
            volume: 80

object_defs:
  # 容量はcontentスロットのcapacityで持つ。単位はmLなので、1L = 1000。
  canteen:
    traits: [liquid_container, sealed_container]
    props:
      weight: {value: 300}
      volume: {value: 1000}
    slots:
      content:
        # 一度に入る液体は1種類だけ。水の入った水筒へ茶は注げない。
        cell_count: 1
        cell: {accept: {tag: liquid}}
        capacity: 1000

  pot:
    traits: [liquid_container, sealed_container]
    props:
      weight: {value: 1500}
      volume: {value: 4700}
    slots:
      content:
        # 一度に入る液体は1種類だけ。水の入った水筒へ茶は注げない。
        cell_count: 1
        cell: {accept: {tag: liquid}}
        capacity: 1000

  bottle:
    traits: [liquid_container, sealed_container]
    props:
      weight: {value: 500}
      volume: {value: 2800}
    slots:
      content:
        # 一度に入る液体は1種類だけ。水の入った水筒へ茶は注げない。
        cell_count: 1
        cell: {accept: {tag: liquid}}
        capacity: 2000

  jar:
    traits: [liquid_container, narrow_open_container, rain_catching_container]
    props:
      weight: {value: 1200}
      volume: {value: 15000}
    slots:
      content:
        # 一度に入る液体は1種類だけ。水の入った水筒へ茶は注げない。
        cell_count: 1
        cell: {accept: {tag: liquid}}
        capacity: 4000

  # ヤシの殻。割ったヤシの実から果肉を掻き出すと残る（coconut.yaml）。カードとして持ち歩けるよう、
  # 容器の中では唯一itemタグを持つ（他の容器はまだ入手手段が無い）。
  coconut_bowl:
    tags: [item]
    traits: [liquid_container, wide_open_container, rain_catching_container]
    props:
      weight: {value: 100}
      # 半球の殻は重ねて入るので、1個ぶんの外寸より小さく見る。
      volume: {value: 200}
    slots:
      content:
        # 一度に入る液体は1種類だけ。水の入った水筒へ茶は注げない。
        cell_count: 1
        cell: {accept: {tag: liquid}}
        capacity: 250

  # 雨として降るのは水なので、rain_filled_liquidを持つのは水だけ。茶・油が入っている容器は、
  # 開いていても雨で増えない（異種は混ざらない、4節）。
  water_liquid:
    traits: [liquid, water_liquid, evaporating_liquid, rain_filled_liquid]

  tea_liquid:
    traits: [liquid, tea_liquid, evaporating_liquid]

  oil_liquid:
    traits: [liquid, oil_liquid, evaporating_liquid]
