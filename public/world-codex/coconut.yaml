# ヤシの実の加工の連鎖（GameElementDefinition.md 11節・12節参照）。ヤシの木から実を採り、
# 皮をはぎ、穴を開け、割り、果肉を掻き出すまでの一続きを1ファイルにまとめる。
#
# 生の実は食べられない。食べられるのは連鎖の終端の果肉（coconut_meat）だけで、実1個ぶんの
# 満腹度・水分・栄養は、そこから採れる果肉2個へ等分してある。
#
# 液体の入れ物になる殻（coconut_bowl）は液体容器の一員なので、liquid_containers.yamlが持つ。

object_defs:
  # ヤシの木。実を採る採取ポイント。探索で見つかる設置物（locations.yamlのexplore）。
  palm_tree:
    tags: [fixture]
    actions:
      # 幹を登って実をもぎ取る。採れる数に上限は設けていない（採取ポイントの枯渇は今後の課題）。
      # 足場の無い幹を登る以上、たまに踏み外す。失敗した回は実も採れない。
      pick_coconut:
        showMenu: always
        duration: 30
        pick:
          - weight: 90
            spawn: {object: coconut, into: actor}
          - weight: 10
            spawn: {object: sprained_ankle, into: actor}

  # 皮のついたヤシの実。厚い繊維質の皮に覆われていて、このままでは食べられない。
  # 皮をはぐと、中の実（husked_coconut）と皮（coconut_husk）に分かれる。
  coconut:
    tags: [item]
    props:
      weight: {value: 1400}
    combinations:
      husk:
        with: cutting_tool
        duration: 30
        destroy: self
        spawn:
          - {object: husked_coconut}
          - {object: coconut_husk}

  # ヤシの実の皮。はぎ取った繊維の塊（縄・火口などへの利用は今後の課題）。
  coconut_husk:
    tags: [item]
    props:
      weight: {value: 400}

  # 皮を剥いだヤシの実。刃物の先で殻に穴を開けられる。
  husked_coconut:
    tags: [item]
    props:
      weight: {value: 1000}
    combinations:
      bore:
        with: cutting_tool
        duration: 15
        destroy: self
        spawn: {object: holed_coconut}

  # 穴を開けたヤシの実。穴が入った殻は衝撃で素直に割れる。石で叩いても刃物をこじ入れてもよいので、
  # 道具のタグごとに1つずつcombinationを持つ（withは1つのタグしか取らないため）。
  #
  # 割れた実は2つ生まれるが、同種は1スタックにまとまるため、2つとも元の実が居た場所へ置き換わる。
  holed_coconut:
    tags: [item]
    props:
      weight: {value: 1000}
    combinations:
      crack:
        with: stone
        duration: 15
        destroy: self
        spawn:
          - {object: coconut_half}
          - {object: coconut_half}
      pry_open:
        with: cutting_tool
        duration: 15
        destroy: self
        spawn:
          - {object: coconut_half}
          - {object: coconut_half}

  # 割れたヤシの実。刃物で果肉を掻き出すと、果肉と器になる殻が残る。
  coconut_half:
    tags: [item]
    props:
      weight: {value: 450}
    combinations:
      scrape:
        with: cutting_tool
        duration: 30
        destroy: self
        spawn:
          - {object: coconut_meat}
          - {object: coconut_bowl}

  # ヤシの果肉。実1個から2個採れる。満腹度・水分・栄養は実1個ぶんの半分。
  coconut_meat:
    tags: [item]
    props:
      weight: {value: 300}
    actions:
      eat:
        add:
          actor:
            satiety: 6
            hydration: 480
            vegetable_nutrition: 2500
        destroy: self
