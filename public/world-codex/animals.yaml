# 動物の定義。どんな動物をどの土地にどんな役割で置くかは docs/world/Animals.md、動物と対峙する
# 仕組みは docs/engine/HuntingSystem.md 参照。
#
# 動物はitemタグを持ち、土地のitemsスロットへ普通のカードとして並ぶ（HuntingSystem.md 1.1節）。
# 専用のレーンも専用の画面も持たない。狩猟専用の数値（体力・命中率）も作らず、攻撃は怪我
# （injuries.yaml）を1つ足すことで表す（同3節）。
#
# 死体と、それを解体して得られる素材（同1.5節）も、獲物から続く一続きの連鎖なのでこのファイルが持つ。

traits:
  # 獣が共通して持つもの。**体格に依らない値だけ**をここへ置く（VitalsSystem.md 7節）。体格が
  # 決めるもの——weight・volume・blood（maxが体格）・shock（maxが体格）——と、仕留めたときに
  # 何になるかは、動物ごとに宣言する。
  beast:
    # animalは枠の色を決める種別（CardView.md 2節 枠の色は種別で変える）。itemと兼ねるのは、
    # 動物が「持ち運べるか」ではなく「動かせるか」でitemsに並ぶため（HuntingSystem.md 1.1節）。
    #
    # quarryは「狩りの成果として数える物」——生きた獲物と死体の両方が持つ。罠の枠がこれを受け、
    # タイマーのゲートがこれで「何か入っているか」を問う（docs/engine/TrapSystem.md 1.1節）。
    # 掛かった獲物がその場で死んでも、死体は罠の中に残る。
    tags: [item, animal, quarry]
    # 押すと刺さっている怪我が並ぶ（7.8節）。キャラクタの怪我と同じ見え方になる（同3節）。
    main_item_slot: injuries
    # 気を失っている間は、絵が倒れた姿へ変わる（consciousnessのunconscious段、CardView.md 5.1節）。
    art_by_stage: consciousness
    slots:
      # 負っている怪我。プレイヤーは出し入れできず、付けるのは攻撃・外すのは怪我自身
      # （characters/player_character.yamlのinjuriesと同じ扱い）。
      injuries:
        cell: {accept: {tag: injury}}
    props:
      # 警戒（HuntingSystem.md 3.1節）。攻撃してくるか逃げるかを乱数の分岐にせず、この1つの
      # 連続量で駆動する。安全域を外れている間はカードの輪郭が明滅する
      # （CardView.md 3節 警戒している動物は輪郭を明滅させる）。
      #
      # **野生の個体は警戒した状態で現れる。** 放っておけば落ち着くが、減り方は自然治癒と同じ
      # 基準レート（-1/tick、docs/engine/InjurySystem.md 2節の値の決め方）なので10時間かかる。
      # 待つより追い払うほうが速い、が値だけで成り立つ。
      wariness:
        value: 40
        range: {min: 0, max: 100}
        stages:
          - {name: calm}
          - {name: wary, min: 20, alert: caution}
          - {name: enraged, min: 70, alert: danger}
        passives:
          - add:
              self:
                wariness: -1
      # 今感じている痛み（VitalsSystem.md 2節）。自分では動かず、刺さっている怪我がmodifyで
      # 押し上げる。段が意識へ寄与する——ただし痛みだけでは気絶させない（最も深い段でもdazedに
      # 留める）。刻みはキャラクタと同じ規約（docs/world/Characters.md 値の刻み方節）。
      pain:
        value: 0
        range: {min: 0, max: 100}
        stages:
          - {name: painless}
          - {name: sore, min: 25, alert: watch}
          - name: hurting
            min: 50
            alert: caution
            passives:
              - modify: {self: {consciousness: -20}}
          - name: unbearable
            min: 83
            alert: danger
            passives:
              - modify: {self: {consciousness: -45}}
      # 無防備さ（HuntingSystem.md 1.4節）。仕留めの候補の重みそのもので、自分では動かず、状態が
      # 押し上げる。起きている間も0にはしない——暴れる相手でも、まれに急所へ入る。
      vulnerability: {value: 5}
      # 意識（VitalsSystem.md 2節）。自分では動かず、痛み・衝撃・失血の段が押し下げる。安全域を外れると
      # カードにバーが出る（CardView.md 8節）。unconsciousの段の名前は固定（同6節）。
      consciousness:
        value: 100
        range: {min: 0, max: 100}
        stages:
          # 気を失っている間はカードに覆いが出て（CardView.md 9.1節）、絵も倒れた姿へ差し替わる
          # （art_by_stage、beast trait・GameElementDefinition.md 6.4節）。
          #
          # 警戒はここで打ち消す。気を失った動物は警戒しておらず、放っておいてよい相手なので、
          # 縁の明滅（CardView.md 3節）も止まる。実効値への寄与なので、目覚めれば元の警戒へ戻る。
          - name: unconscious
            alert: danger
            art: unconscious
            passives:
              # 気を失った相手は狙って急所を打てる。仕留めの重みが跳ね上がり、警戒は消える。
              - modify: {self: {wariness: -100, vulnerability: 200}}
          - {name: dazed, min: 25, alert: caution}
          - {name: foggy, min: 60, alert: watch}
          - {name: clear, min: 80}

object_defs:
  # サル。物を持ち去る中型（Animals.md 4.1節）。危険は低いが、放っておくと足元の物を持っていく。
  monkey:
    traits: [beast]
    props:
      weight: {value: 5000}
      volume: {value: 12000}
      # 殴られた衝撃（VitalsSystem.md 2.1節）。攻撃がaddで即座に上げ、自分で引いていく。
      # maxが体格で、サルは小さいので石1つでも一撃で気を失う。
      shock:
        value: 0
        range: {min: 0, max: 100}
        stages:
          - {name: steady}
          - name: rattled
            min: 30
            passives:
              - modify: {self: {consciousness: -30}}
          - name: reeling
            min: 70
            passives:
              - modify: {self: {consciousness: -80}}
        passives:
          - add:
              self:
                shock: -4
      # 体に残っている血（VitalsSystem.md 3節）。**maxが体格**で、5kgのサルは体重のおよそ1/13＝
      # 400mL——ヒトの1/12しかないので、同じ傷でもよく効く。段のしきい値は失った割合（出血性
      # ショックの分類）から引くので、ヒトの5,000mLと同じ比率になる。
      #
      # 戻る速さも体格に比例する（ヒトの+2/tickに対し400/5000で+0.16）。餌をやる仕組みがまだ無いので
      # 条件は付けず、常に戻す——手負いのまま逃げた個体は、追いつけなければ癒えてしまう。
      blood:
        value: 400
        # 0に達した瞬間にon_shortfallを発火させるため、下限は0ではなく1（6.3節）。
        range: {min: 1, max: 400}
        stages:
          # 助からない域。ここまで失えば意識は無い——最も深い段が最も強く奪う。
          - name: exsanguinated
            alert: fatal
            passives:
              - modify: {self: {consciousness: -100}}
          - name: hemorrhaging
            min: 160
            alert: danger
            passives:
              - modify: {self: {consciousness: -70}}
          - name: bled
            min: 240
            alert: caution
            passives:
              - modify: {self: {consciousness: -30}}
          - {name: low, min: 280, alert: watch}
          - {name: replete, min: 320}
        # 失血死。仕留めの一撃（HuntingSystem.md 1.4節）と同じく、自分が居た枠がそのまま死体に変わる
        # （destroyをspawnより先に書く、9.4節）。こちらは**逃げられた個体が後で倒れる道**。
        on_shortfall:
          destroy: self
          spawn: {object: monkey_carcass}
        passives:
          - add:
              self:
                blood: 0.16
    combinations:
      # 武器を重ねて殴る（HuntingSystem.md 1.2節）。当たれば怪我が1つ刺さる。
      #
      # 警戒の上がりと刃の摩耗は当たり外れによらず起きるが、pickとaddを併記できないため
      # 各候補へ複製している（issue #415。動詞を順に並べられるようになったら1箇所へ寄せる）。
      #
      # どちらの回もsignal（9.8節）で結果を告げる。当たった回の傷は押して開くinjuriesスロットへ
      # 入り、外した回は世界の形が何も変わらないため、どちらもレーンの上では見分けが付かない。
      #
      # 当たれば衝撃で気を失う（VitalsSystem.md 5節）。狩りの決着は死ではなく気絶で付くので、
      # 当たった瞬間に効かなければならない——addは実体値への即時の書き込みで、そこから意識への
      # 寄与（shockの段）が同じ瞬間に立つ。
      #
      # **打撲の成分はこのshockが持ち、怪我としては表さない。** 尖った石は切れ味が悪いぶん打撲が
      # 強く出るが、一撃で「裂傷」と「打撲」の2枚を刺すと怪我スロットが溢れる。裂けた皮膚が
      # 傷（injuries.yamlのlaceration）、殴られた揺れがshock、という分け方で足りる。
      strike:
        with: weapon
        duration: 15
        pick:
          - weight: 70
            add:
              self: {wariness: 25, shock: 80}
              dragged: {durability: -20}
            spawn: {object: laceration, into: self}
            signal: hit
          # 外した回。傷は付かないが、殴られたこと自体で警戒は上がる。
          - weight: 30
            add:
              self: {wariness: 25}
              dragged: {durability: -20}
            signal: missed
          # 仕留めた回（HuntingSystem.md 1.4節）。急所——首・後頭部——へ入れば、傷が残る間もなく
          # 死ぬ。**怪我としては表さない**（手当てできず、残らないものだから。InjurySystem.md 4節）。
          # 重みは無防備さそのものなので、気を失っている相手ではここが最も太くなる。
          - weight: {prop: vulnerability}
            add:
              dragged: {durability: -20}
            destroy: self
            spawn: {object: monkey_carcass}
            signal: killed

  # サルの死体。仕留めた個体が、その枠のまま置き換わる（destroyをspawnより先に書く、9.4節）。
  # 刺さっていた傷は持ち主から離れられないので道連れに消え、当てていた治療具だけが地面へ落ちる。
  #
  # 腐敗はまだ無いので、置いたままでも傷まない（HuntingSystem.md 8節）。
  monkey_carcass:
    tags: [item, quarry]
    props:
      weight: {value: 5000}
      volume: {value: 12000}
    combinations:
      # 刃物を重ねて解体する（HuntingSystem.md 1.5節）。
      #
      # 5000gの内訳: 生肉500g×4 + 獣骨500g + 生皮600g = 3100g。残る1900gは血と内臓・頭で、
      # 使い道が無いのでカードにしない。値を変えるときはこの内訳を崩さないこと。
      butcher:
        with: cutting_tool
        duration: 60
        destroy: self
        spawn:
          - {object: raw_meat, count: 4}
          - {object: animal_bone}
          - {object: rawhide}

  # ヤケイ。くくり罠で捕れる中型（Animals.md 3節）。危険が低く、飼いならしの学習台になる。
  # 草の実をついばむので、罠では草食の卓に載る（TrapSystem.md 4節）。
  junglefowl:
    traits: [beast]
    props:
      weight: {value: 1000}
      volume: {value: 2400}
      # maxが体格（サル5kgの100に対して1kg）。石1つ（shock 80）で必ず気を失う大きさ。
      shock:
        value: 0
        range: {min: 0, max: 20}
        stages:
          - {name: steady}
          - name: rattled
            min: 6
            passives:
              - modify: {self: {consciousness: -30}}
          - name: reeling
            min: 14
            passives:
              - modify: {self: {consciousness: -80}}
        passives:
          - add:
              self:
                shock: -4
      # maxが体格（体重のおよそ1/13＝80mL）。段のしきい値も戻る速さも、サルと同じ割合で刻む。
      #
      # **くくり罠の傷（injuries.yamlのsnare_laceration）が奪うのは30〜60mL**なので、浅く掛かれば
      # 生き延び、深く食い込めば死ぬ。ロールが分かれ目になる唯一の大きさ（TrapSystem.md 5.1節）。
      blood:
        value: 80
        range: {min: 1, max: 80}
        stages:
          - name: exsanguinated
            alert: fatal
            passives:
              - modify: {self: {consciousness: -100}}
          - name: hemorrhaging
            min: 32
            alert: danger
            passives:
              - modify: {self: {consciousness: -70}}
          - name: bled
            min: 48
            alert: caution
            passives:
              - modify: {self: {consciousness: -30}}
          - {name: low, min: 56, alert: watch}
          - {name: replete, min: 64}
        on_shortfall:
          destroy: self
          spawn: {object: junglefowl_carcass}
        passives:
          - add:
              self:
                blood: 0.032
    combinations:
      strike:
        with: weapon
        duration: 15
        pick:
          - weight: 70
            add:
              self: {wariness: 25, shock: 80}
              dragged: {durability: -20}
            spawn: {object: laceration, into: self}
            signal: hit
          - weight: 30
            add:
              self: {wariness: 25}
              dragged: {durability: -20}
            signal: missed
          - weight: {prop: vulnerability}
            add:
              dragged: {durability: -20}
            destroy: self
            spawn: {object: junglefowl_carcass}
            signal: killed

  # ネズミ。罠の最小単位（Animals.md 3節）。何でも齧るので、罠では草食・肉食どちらの卓にも載る
  # （TrapSystem.md 4.1節の雑食）。血が6mLしかないので、罠に掛かればまず死ぬ。
  rat:
    traits: [beast]
    props:
      weight: {value: 80}
      volume: {value: 200}
      shock:
        value: 0
        range: {min: 0, max: 2}
        stages:
          - {name: steady}
          - name: rattled
            min: 0.6
            passives:
              - modify: {self: {consciousness: -30}}
          - name: reeling
            min: 1.4
            passives:
              - modify: {self: {consciousness: -80}}
        passives:
          - add:
              self:
                shock: -4
      blood:
        value: 6
        range: {min: 1, max: 6}
        stages:
          - name: exsanguinated
            alert: fatal
            passives:
              - modify: {self: {consciousness: -100}}
          - name: hemorrhaging
            min: 2.4
            alert: danger
            passives:
              - modify: {self: {consciousness: -70}}
          - name: bled
            min: 3.6
            alert: caution
            passives:
              - modify: {self: {consciousness: -30}}
          - {name: low, min: 4.2, alert: watch}
          - {name: replete, min: 4.8}
        on_shortfall:
          destroy: self
          spawn: {object: rat_carcass}
        passives:
          - add:
              self:
                blood: 0.0024
    combinations:
      strike:
        with: weapon
        duration: 15
        pick:
          - weight: 70
            add:
              self: {wariness: 25, shock: 80}
              dragged: {durability: -20}
            spawn: {object: laceration, into: self}
            signal: hit
          - weight: 30
            add:
              self: {wariness: 25}
              dragged: {durability: -20}
            signal: missed
          - weight: {prop: vulnerability}
            add:
              dragged: {durability: -20}
            destroy: self
            spawn: {object: rat_carcass}
            signal: killed

  # ヤケイの死体。1000gの内訳: 生肉500g + 羽40g + 小さな骨10g = 550g。残る450gは残りの骨と内臓・血で、
  # 使い道が無いのでカードにしない。値を変えるときはこの内訳を崩さないこと（monkey_carcassと同じ規約）。
  #
  # **鶏肉も獣肉も同じ生肉になる**（HuntingSystem.md 1.5節）。栄養と味の違いが実際に効くように
  # なるまでは、獲物の種類で肉を分けない——分けると、それを使う側（料理）が獲物の数だけ分岐する。
  junglefowl_carcass:
    tags: [item, quarry]
    props:
      weight: {value: 1000}
      volume: {value: 2400}
    combinations:
      butcher:
        with: cutting_tool
        duration: 20
        destroy: self
        spawn:
          - {object: raw_meat}
          - {object: feather}
          - {object: small_bone}

  # ネズミの死体。**解体しない**——80gの体から肉の塊は取れないので、丸ごと火にかけて、骨から
  # こそぎ落とすように食べる（roasted_rat）。
  #
  # 小さすぎる肉を1枚のカードにすると、料理で生肉と競合する。同じ「肉」でありながら大きさが違うと、
  # レシピは「どちらでもよい」と書けない（HuntingSystem.md 1.5節が獲物の大きさを個数で表すのと同じ理由で、
  # 刻みを増やさない）。
  rat_carcass:
    tags: [item, quarry]
    props:
      weight: {value: 80}
      volume: {value: 200}
      # 小さいので早く焼ける。炎（3/tick）なら2tick＝30分。
      cooking_progress:
        value: 0
        range: {min: 0, max: 6}
        on_overflow:
          destroy: self
          spawn: {object: roasted_rat}

  # 丸焼きのネズミ。食べると小さな骨が残る（骨針の材料、docs/world/SurvivalItems.md 1.2節の
  # 繊維 → 罠 → 小動物 → 小骨 → 骨針）。**罠だけを起点に、刃物を1つも経由せず縫製へ届く。**
  roasted_rat:
    tags: [item, food]
    props:
      weight: {value: 60}
      volume: {value: 160}
      cooking_progress:
        value: 0
        range: {min: 0, max: 4}
        on_overflow:
          destroy: self
          spawn: {object: charred_lump}
    actions:
      eat:
        conditions:
          - reason: too_full
            not: {object: actor, prop: stomach, in_stage: full}
        add:
          actor:
            stomach: 2
            meat_nutrition: 25
        # 食べ終わって残る骨。actorの手が塞がっていれば足元へ落ちる（9.4節のフォールバック）。
        spawn: {object: small_bone, into: actor}
        destroy: self

  # 羽。鳥1羽ぶんをまとめた1枚。**使い道はまだ無い**が、獣骨（animal_bone）と同じく素材として
  # 溜まる——飾り・矢羽・火口・詰め物のいずれへ延ばすかは docs/world/Animals.md 10節。
  feather:
    tags: [item]
    props:
      weight: {value: 40}
      # ばらけた羽は詰めても縮まないので、嵩そのままで見る（plant_fiberと同じ扱い）。
      volume: {value: 1200}

  # 小さな骨。削れば針になる細い骨1本ぶん。獣骨（animal_bone、500g）のように道具の頭部にはできない
  # ——荷重のかかる頭部に向かないのが、細い骨と中空の鳥骨に共通する制約。
  #
  # **鳥からも出す。** 得られる素材は獲物の種類によらず同じ（HuntingSystem.md 1.5節）で、中空で薄壁の
  # 鳥骨はむしろ割って針にしやすい。獲物の大きさは個数で表すので、より大きい鳥を足すときは数を増やす。
  small_bone:
    tags: [item]
    props:
      weight: {value: 10}
      volume: {value: 15}

  # 解体して得られる素材。獲物の種類によらず同じ物が出て、獲物の大きさは個数で表す
  # （HuntingSystem.md 1.5節）。骨と皮の使い道は docs/world/SurvivalItems.md 参照。

  # 生肉。1切れで4時間の腹持ちと、ヤシガニ1匹分の肉の栄養——ヤシガニ2kgのうち食べられるのが
  # およそこの1切れぶん、という対応で揃えている。
  #
  # 炉の火にかけると焼ける（docs/engine/FireSystem.md 7節）。**炉のことは何も知らない**——
  # 加熱の進み（cooking_progress）を持つだけで、進めるのは炉の側。
  raw_meat:
    tags: [item, food, meat_bait]
    props:
      weight: {value: 500}
      # 罠へ仕掛けると肉食の卓が引かれやすくなる（docs/engine/TrapSystem.md 4節）。
      meat_bait: {value: 12}
      volume: {value: 500}
      # 炎（3/tick）なら8tick＝2時間で焼き上がる。火から出せば止まり、戻せば続きから進む。
      cooking_progress:
        value: 0
        range: {min: 0, max: 24}
        on_overflow:
          destroy: self
          spawn: {object: roasted_meat}
    actions:
      eat:
        conditions:
          - reason: too_full
            not: {object: actor, prop: stomach, in_stage: full}
        add:
          actor:
            stomach: 16
            meat_nutrition: 200
        destroy: self

  # 焼けた肉。生より腹に残り、栄養も出る。焼き上がっても火の中の枠に居続けるので、
  # 放っておくと焦げる（docs/engine/FireSystem.md 7.2節）。
  roasted_meat:
    tags: [item, food]
    props:
      # 水が飛んだぶん軽くなる。
      weight: {value: 400}
      volume: {value: 450}
      # 焦げるまでの猶予は生から焼きより短い。炎なら4tick＝1時間。
      cooking_progress:
        value: 0
        range: {min: 0, max: 12}
        on_overflow:
          destroy: self
          spawn: {object: charred_lump}
    actions:
      eat:
        conditions:
          - reason: too_full
            not: {object: actor, prop: stomach, in_stage: full}
        add:
          actor:
            stomach: 20
            meat_nutrition: 260
        destroy: self

  # 焦げた塊。加熱の進みを持たないので、ここで鎖が終わる。食べられはするが、ほとんど何も残らない。
  charred_lump:
    tags: [item, food]
    props:
      weight: {value: 250}
      volume: {value: 300}
    actions:
      eat:
        conditions:
          - reason: too_full
            not: {object: actor, prop: stomach, in_stage: full}
        add:
          actor:
            stomach: 4
            meat_nutrition: 20
        destroy: self

  # 獣骨。1頭ぶんの骨をまとめた1枚。
  animal_bone:
    tags: [item]
    props:
      weight: {value: 500}
      # 形の揃わない骨の束なので、詰めても縮まない嵩で見る（ヤシの実の皮と同じ扱い）。
      volume: {value: 700}

  # 生皮。剥いだままの皮で、なめす工程はまだ無い。
  rawhide:
    tags: [item]
    props:
      weight: {value: 600}
      volume: {value: 1500}
