# 物を入れて持ち運ぶ入れ物（コンテナ）の定義。
#
# 液体の容器（liquid_containers.yaml）とは別物として扱う。あちらは「中身の液体オブジェクトが容器を代表し、
# 量は中身自身がsizeとして持つ」構造で、こちらは「中身をスロットへそのまま入れる」構造。
# 共通化できるのは名前だけなので、trait・タグとも分けている。

traits:
  # 中身をスロットに持つ入れ物。containerタグが付いたカードは、タップすると中身の子ウィンドウが開く
  # （ScreenLayout.md スロットの子ウィンドウ節）。
  item_container:
    tags: [container]
    # かごを代表する物のスロット（7.8節）。カードを押すとここの中身が並ぶ。
    main_item_slot: contents
    combinations:
      # 中へ入れる。カードを重ねるだけの操作なので時間はかからない（durationを持たない）。
      # 入るかどうかはcontentsスロットの枠とcapacityが決めるので、ここでは条件を書かない。
      put_in:
        with: item
        move: {object: dragged, to: self}
    slots:
      # 中身。前詰めスロットなので、出し入れしても詰まって並ぶ。
      # capacityは中身のsizeの合計の上限（GameElementDefinition.md 7.3節）。sizeの単位も、
      # 各アイテムのsizeもまだ決めていないため、当面この上限は効かない（どのアイテムもsize=0扱い）。
      # 値は「石や枝が十分入る」という想定の仮置きで、単位が決まったら見直す。
      contents:
        cell: {accept: {tag: item}}
        capacity: 1000

object_defs:
  # 編み籠。編んだヤシの葉（weaving.yaml）を綴じ合わせて作る、最初の運搬用の入れ物。
  # itemとfixtureを兼ねるので、持ち歩くことも地面へ据えることもできる（設置物レーンと
  # アイテムレーンの間を端の▲▼で行き来する）。
  woven_basket:
    tags: [item, fixture]
    # 中身が個体ごとに違うので束ねない。束ねると代表の中身しか開けなくなる（SlotSystem.md 4節）。
    stackable: false
    traits: [item_container]
    props:
      weight: {value: 800}
    # 解放条件（conditions、GameElementDefinition.md 13.3節）はまだ置かない。繊維・編みスキルの
    # プロパティと、それを伸ばす経路が未実装のため、今条件を置くと永久に作れなくなる。
    recipes:
      woven:
        steps:
          - requires:
              - {object: woven_leaf, quantity: 6, consume: true}
            duration: 120
