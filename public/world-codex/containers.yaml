# 物を入れて持ち運ぶ入れ物（コンテナ）の定義。
#
# 液体の容器（liquid_containers.yaml）とは別物として扱う。あちらは「中身の液体オブジェクトが容器を代表し、
# 量は中身自身がvolumeとして持つ」構造で、こちらは「中身をスロットへそのまま入れる」構造。
# 共通化できるのは名前だけなので、trait・タグとも分けている。

traits:
  # 中身をスロットに持つ入れ物。containerタグが付いたカードは、タップすると中身の子ウィンドウが開く
  # （ScreenLayout.md スロットの子ウィンドウ節）。
  item_container:
    tags: [container]
    # かごを代表する物のスロット（7.8節）。カードを押すとここの中身が並び、カードへ重ねた物は
    # ここへ入る（ScreenLayout.md カードのドラッグ＆ドロップ節）。投入のcombinationは要らない。
    main_item_slot: contents
    slots:
      # 中身。何種類（cell_count）とどれだけのかさ（capacity）が入るかは入れ物ごとに違うので、
      # trait側では宣言しない。
      contents:
        cell: {accept: {tag: item}}

object_defs:
  # 編み籠。編んだヤシの葉（weaving.yaml）を綴じ合わせて作る、最初の運搬用の入れ物。
  # itemとfixtureを兼ねるので、持ち歩くことも地面へ据えることもできる（設置物レーンと
  # アイテムレーンの間を端の▲▼で行き来する）。
  woven_basket:
    tags: [item, fixture]
    # 中身が個体ごとに違うので束ねない。束ねると代表の中身しか開けなくなる（SlotSystem.md 4節）。
    stackable: false
    traits: [item_container]
    props:
      weight: {value: 800}
      # 自分の容量（20L）より大きいので、籠の入れ子は物理的に成立しない。
      volume: {value: 35000}
    slots:
      contents:
        # 何種類入るか。手持ちの6枠を必ず上回る（docs/world/Containers.md 1節）——籠を持つと手が
        # 1枠塞がるので、超えていなければ入れ物を持つ意味が出ない。
        cell_count: 10
        # 中身のかさの合計の上限（7.3節）。手に提げる籠の内容積そのままで20L。
        # 入る物のvolumeは外接直方体で見積もる（ContainerSystem.md 7節）ため、実際に入る数は
        # 20Lぶんより少なくなる——それが「隙間なく詰められない」ことの表現になっている。
        capacity: 20000
    # 解放条件（conditions、GameElementDefinition.md 13.3節）はまだ置かない。繊維・編みスキルの
    # プロパティと、それを伸ばす経路が未実装のため、今条件を置くと永久に作れなくなる。
    recipes:
      woven:
        steps:
          - requires:
              - {object: woven_leaf, count: 6, consume: true}
            duration: 120
