# 食料のサンプル定義（GameElementDefinition.md参照）。栄養バランス（characters.yaml参照）の
# 3カテゴリそれぞれに、南国の無人島で採取しやすい食材を1種類ずつ用意する。
# satietyは「1食で何tick分の腹持ちか」（6.0節）。値はいずれも仮のもの。

object_defs:
  # 空心菜（クウシンサイ）。熱帯の水辺に自生する、採取しやすい葉物野菜。
  water_spinach:
    tags: [item]
    props:
      weight: {value: 150}
      # 葉物の束も詰めて縮まないので、嵩そのままで見る。
      volume: {value: 3000}
    actions:
      eat:
        add:
          actor:
            satiety: 4
            vegetable_nutrition: 200
        destroy: self

  # ヤシガニ。狩猟の道具がなくても「見つけて捕まえる」だけで採取できる大型の甲殻類。
  coconut_crab:
    tags: [item]
    props:
      weight: {value: 2000}
      volume: {value: 1900}
    actions:
      eat:
        add:
          actor:
            satiety: 16
            meat_nutrition: 200
        destroy: self

  # タロイモ。太平洋の島々で主食とされてきた塊茎作物。自生しているものを採取できる。
  taro:
    tags: [item]
    props:
      weight: {value: 800}
      volume: {value: 800}
    actions:
      eat:
        add:
          actor:
            satiety: 20
            grain_tuber_nutrition: 200
        destroy: self
