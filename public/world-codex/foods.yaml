# 食料のサンプル定義（GameElementDefinition.md参照）。栄養バランス（characters.yaml参照）の
# 3カテゴリそれぞれに、南国の無人島で採取しやすい食材を1種類ずつ用意する。
# satiety・各カテゴリへの加算量はいずれも仮の値。

object_defs:
  # 空心菜（クウシンサイ）。熱帯の水辺に自生する、採取しやすい葉物野菜。
  water_spinach:
    display_name: 空心菜
    tags: [item]
    actions:
      eat:
        add:
          actor:
            satiety: 8
            vegetable_nutrition: 20000
        destroy: self

  # ヤシガニ。狩猟の道具がなくても「見つけて捕まえる」だけで採取できる大型の甲殻類。
  coconut_crab:
    display_name: ヤシガニ
    tags: [item]
    actions:
      eat:
        add:
          actor:
            satiety: 15
            meat_nutrition: 20000
        destroy: self

  # タロイモ。太平洋の島々で主食とされてきた塊茎作物。自生しているものを採取できる。
  taro:
    display_name: タロイモ
    tags: [item]
    actions:
      eat:
        add:
          actor:
            satiety: 20
            grain_tuber_nutrition: 20000
        destroy: self
