# プレイヤーキャラクタに共通の骨組み。個体差を持つプロパティ（満腹度・水分・体脂肪・覚醒度・体力）は
# ここに置かず、キャラクタごとのファイル（同じディレクトリの1キャラ1ファイル）へ全部書く。
# 何を持っていなければならないか・各値の意味と刻み方は docs/world/Characters.md 参照。

traits:
  player_character:
    # 土地のcharactersスロットの枠が受け入れる型（core.yaml）。プレイヤーが操作するキャラクタだけが
    # 持つタグで、操作できない生物は持ち運べるならitem・持ち運べないならfixtureで表す。
    tags: [character]
    # 休息（docs/world/Characters.md 休息節）。4つの違いは長さと回復量だけで、眠るものだけが
    # 眠気（wakefulness）も戻す。1時間あたりの回復量を長いものほど大きくしてあるので、
    # 同じ6時間でも仮眠2回より睡眠1回のほうが多く戻る。
    #
    # 眠っている間も覚醒度は減り続ける（-1/tick）ため、実質の回復は経過ぶんを引いた値になる
    # ——睡眠は+96-24で18時間ぶん、仮眠は+36-12で6時間ぶん。睡眠1回では満タンに届かない。
    #
    # 身体の仕組みなので個体差を持たせず、この trait が配る（痛み・血と同じ扱い）。回復量は
    # 一律なので、体力のmaxが大きいキャラクタほど1回の休息で戻る割合は小さい。
    actions:
      wait:
        showMenu: always
        duration: 15
        add: {self: {stamina: 2}}
      rest:
        showMenu: always
        duration: 60
        add: {self: {stamina: 10}}
      nap:
        showMenu: always
        duration: 180
        add: {self: {stamina: 36, wakefulness: 36}}
      sleep:
        showMenu: always
        duration: 360
        add: {self: {stamina: 90, wakefulness: 96}}
    slots:
      # 手持ち。枠数はキャラクタごとに決める（cell_count）。数を決めると持ち替えても枠の位置が
      # 動かない（ScreenLayout.md 7.3節・SlotSystem.md 3節）。
      hand:
        cell: {accept: {tag: item}}
      # 身につけているもの。枠数の上限はまだ決めていないため前詰めスロットにする（子ウィンドウ側は
      # はみ出した分を横スクロールで送る、Windows.md 1節 スロットの子ウィンドウ）。
      # 「何を装備できるか」の語彙（equippableタグ・部位）は未検討のため、暫定でitemを受け入れる。
      # 上限の無いitemスロットなので、自動配置（7.7節）から外さないと、手持ちが埋まった時の
      # 行き先を全部吸い込んでしまう（手元でクラフトした物が身につくことになる）。
      equipment:
        cell: {accept: {tag: item}}
        auto_placement: false
      # 怪我。プレイヤーが任意に出し入れするものではなく、ワールド側の効果だけが付け外しする
      # （UIからの移動・並び替えを許さない、Windows.md 2節）。中身はinjuries.yaml。
      injuries:
        cell: {accept: {tag: injury}}
    props:
      # 今感じている痛み。自分では動かず、injuriesスロットの中の怪我がmodifyで押し上げる
      # （injuries.yaml）ので、valueは0のまま。増える側が悪いプロパティなので、段はmaxからの
      # 割合で刻む（docs/world/Characters.md）。
      pain:
        tags: [status, health]
        value: 0
        range: {min: 0, max: 100}
        stages:
          - {name: painless}
          - {name: sore, min: 25, alert: watch}
          - {name: hurting, min: 50, alert: caution}
          - {name: unbearable, min: 83, alert: danger}
      # 体に残っている血（docs/engine/VitalsSystem.md 3節）。maxが体格そのもので、ヒトは体重の
      # およそ1/13。痛みと同じく身体の仕組みなので個体差を持たせず、この trait が配る。
      #
      # **自分で作り直す唯一のステータス**（+2/tick ＝ 1日およそ200mL、赤血球が作られる実際の速さ）。
      # 削るのは出血する怪我（injuries.yaml）で、削られるのは一瞬でも戻るのは桁違いに遅い
      # ——失った1,000mLが戻るのに5日かかる。
      #
      # 段は失った割合で刻む（出血性ショックの分類）。2割までが安全域なので、
      # docs/world/Characters.md の「maxの80%で安全域を外れる」とそのまま一致する。
      #
      # **尽きれば失血死する**（VitalsSystem.md 3節）。on_shortfallが既定のクランプを置き換えるので、
      # 0を割った値はそのまま残り、死因（どの段で尽きたか）を後から読める（同6節）。
      #
      # 意識への寄与（VitalsSystem.md 3節）はまだ書かない。キャラクタは consciousness を持たず
      # （同7節）、気を失った手番をどう飛ばすかも決まっていない（同6節）。
      blood:
        tags: [status, health]
        value: 5000
        range: {min: 0, max: 5000}
        stages:
          - {name: exsanguinated, alert: fatal}
          - {name: hemorrhaging, min: 2000, alert: danger}
          - {name: bled, min: 3000, alert: caution}
          - {name: low, min: 3500, alert: watch}
          - {name: replete, min: 4000}
        on_shortfall:
          destroy: self
        passives:
          - add:
              self:
                blood: 2
      # 栄養バランス（野菜/肉/穀物・イモの3カテゴリ）。食の好みではなく身体の仕組みを表すため、
      # 満腹度などと違って個体差を持たせず全キャラクタで共通にする。
      #
      # エネルギーの配管（胃→腸→体脂肪）には載せない。載せるとカテゴリの数だけ腸が要る
      # （docs/engine/DigestionSystem.md 6節）。
      vegetable_nutrition:
        tags: [nutrition]
        value: 672
        range: {min: 0, max: 672}
        passives:
          - add:
              self:
                vegetable_nutrition: -1
      meat_nutrition:
        tags: [nutrition]
        value: 672
        range: {min: 0, max: 672}
        passives:
          - add:
              self:
                meat_nutrition: -1
      grain_tuber_nutrition:
        tags: [nutrition]
        value: 672
        range: {min: 0, max: 672}
        passives:
          - add:
              self:
                grain_tuber_nutrition: -1
      # 空腹感（docs/engine/DigestionSystem.md 2節）。**自分では動かない**——胃の伸展（胃の段）と
      # 血糖（腸の段）が modify で押し上げる合流点で、痛みや意識と同じ実効値。だから食べた直後だけで
      # なく、胃が空になっても腸が残っている間は保たれる。
      #
      # maxは容量ではなく感じ方の頂点なので、段は「maxの80%で安全域を外れる」規約ではなく
      # 実際に取る値の分布から刻む（同3.3節）。感じ方に個体差は持たせず、この trait が配る。
      satiety:
        tags: [status, nutrition]
        value: 0
        range: {min: 0, max: 100}
        stages:
          - {name: starving, alert: danger}
          - {name: hungry, min: 15, alert: caution}
          - {name: peckish, min: 30, alert: watch}
          - {name: fed, min: 65}
      # 腸の中身（同3.2節）。胃から届いた分がここで初めて体脂肪になる。
      #
      # **胃より遅く出す。** その差がそのまま在庫になり、「食後しばらく空腹が戻らない」と
      # 「下痢で失える量」の両方をこの在庫が持つ（8.4.1節）。吸収率（to_amount）は書かない
      # ——健康なら食べた分がそのまま身になり、下がるのは下痢・感染のときだけにする。
      intestine:
        tags: [nutrition]
        value: 16
        range: {min: 0, max: 64}
        stages:
          - name: fasting
            passives:
              - transfer: {from_prop: intestine, to_prop: body_fat, amount: 0.5}
          - name: trickle
            min: 2
            passives:
              - modify: {self: {satiety: 10}}
              - transfer: {from_prop: intestine, to_prop: body_fat, amount: 0.5}
          - name: absorbing
            min: 8
            passives:
              - modify: {self: {satiety: 20}}
              - transfer: {from_prop: intestine, to_prop: body_fat, amount: 1}
          - name: loaded
            min: 16
            passives:
              - modify: {self: {satiety: 30}}
              - transfer: {from_prop: intestine, to_prop: body_fat, amount: 1}
          - name: heavy
            min: 32
            passives:
              - modify: {self: {satiety: 40}}
              - transfer: {from_prop: intestine, to_prop: body_fat, amount: 2}
