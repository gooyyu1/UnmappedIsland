# 元船長。長い航海で水の配分と当直の眠気に慣れているが、蓄えは基準よりやや薄い。
# 各プロパティの意味・値の刻み方は docs/world/Characters.md 参照。

object_defs:
  captain:
    singleton: true
    traits: [player_character]
    slots:
      hand: {cell_count: 6}
    props:
      # 満腹から1日（96 tick）。
      satiety:
        tags: [status, nutrition]
        value: 72
        range: {min: 0, max: 96}
        stages:
          - {name: starving, alert: danger}
          - {name: hungry, min: 12, alert: caution}
          - {name: peckish, min: 48, alert: watch}
          - {name: fed, min: 77}
        passives:
          - add:
              self:
                satiety: -1
      # 限られた水で保たせる術が身についており、満水から3日半（336 tick）。
      # 尽きれば渇きで死ぬ。on_shortfallが既定のクランプを置き換えるので、0を割った値はそのまま残り、
      # 死因（どの段で尽きたか）を後から読める（VitalsSystem.md 6節）。
      hydration:
        tags: [status, nutrition]
        value: 252
        range: {min: 0, max: 336}
        on_shortfall:
          destroy: self
        stages:
          - {name: dehydrated, alert: fatal}
          - {name: parched, min: 24, alert: danger}
          - {name: thirsty, min: 96, alert: caution}
          - {name: dryish, min: 192, alert: watch}
          - {name: hydrated, min: 269}
          - {name: full, min: 336}
        passives:
          - add:
              self:
                hydration: -1
      # 最大限に肥えた状態から55日（5280 tick）。尽きれば飢えで死ぬ（水分と同じ形）。
      body_fat:
        tags: [nutrition]
        value: 1320
        range: {min: 0, max: 5280}
        on_shortfall:
          destroy: self
        stages:
          # 蓄えが尽きる域。残り1日（96 tick）を割ったらここへ入り、この段の名前が死因になる。
          - {name: starved, alert: fatal}
          - {name: nourished, min: 96}
        passives:
          - add:
              self:
                body_fat: -1
      # 当直で刻む睡眠に慣れており、眠らずにいられるのは27時間（108 tick）。
      wakefulness:
        tags: [status, health]
        value: 108
        range: {min: 0, max: 108}
        stages:
          - {name: overtired, alert: danger}
          - {name: sleepy, min: 12, alert: caution}
          - {name: yawning, min: 48, alert: watch}
          - {name: rested, min: 86}
        passives:
          - add:
              self:
                wakefulness: -1
      # 甲板仕事で保った、基準どおりの体力。
      stamina:
        tags: [status, health]
        value: 100
        range: {min: 0, max: 100}
        stages:
          - {name: exhausted, alert: danger}
          - {name: tired, min: 20, alert: caution}
          - {name: winded, min: 60, alert: watch}
          - {name: fresh, min: 80}
      # 甲板仕事で担ぎ慣れた、基準どおりの持てる量。持ち物の重さ（g）は中身から導出されるので、valueは0のまま
      # （ContainerSystem.md 2節）。増える側が悪いプロパティなので、段はmaxからの割合で刻む
      # （docs/world/Characters.md）。
      load:
        tags: [status, health]
        value: 0
        range: {min: 0, max: 30000}
        stages:
          - {name: light}
          - {name: laden, min: 7500, alert: watch}
          - {name: heavy, min: 15000, alert: caution}
          - {name: too_heavy, min: 25000, alert: danger}
