# 元エンジニア。道具を持ち替えながら夜通し作業する暮らしが体に残っている代わりに、
# 現場を歩き回る体力と蓄えは乏しい。
# 各プロパティの意味・値の刻み方は docs/world/Characters.md 参照。

object_defs:
  engineer:
    singleton: true
    traits: [player_character]
    slots:
      # 道具を並べて持ち替えるのに慣れており、手持ちが1枠多い。
      hand: {cell_count: 7}
    props:
      # 小食で、満腹から21時間（84 tick）。少ない食料で満たせる。
      satiety:
        tags: [status, nutrition]
        value: 63
        range: {min: 0, max: 84}
        stages:
          - {name: starving, alert: danger}
          - {name: hungry, min: 12, alert: caution}
          - {name: peckish, min: 48, alert: watch}
          - {name: fed, min: 67}
        passives:
          - accumulate:
              self:
                satiety: -1
      # 満水から3日（288 tick）。
      hydration:
        tags: [status, nutrition]
        value: 216
        range: {min: 0, max: 288}
        stages:
          - {name: dehydrated, alert: fatal}
          - {name: parched, min: 24, alert: danger}
          - {name: thirsty, min: 96, alert: caution}
          - {name: dryish, min: 192, alert: watch}
          - {name: hydrated, min: 230}
          - {name: full, min: 288}
        passives:
          - accumulate:
              self:
                hydration: -1
      # 痩せ型で蓄えが薄い。最大限に肥えた状態から50日（4800 tick）。
      body_fat:
        tags: [nutrition]
        value: 1200
        range: {min: 0, max: 4800}
        passives:
          - accumulate:
              self:
                body_fat: -1
      # 徹夜に慣れており、眠らずにいられるのは27時間（108 tick）。
      wakefulness:
        tags: [status, health]
        value: 108
        range: {min: 0, max: 108}
        stages:
          - {name: overtired, alert: danger}
          - {name: sleepy, min: 12, alert: caution}
          - {name: yawning, min: 48, alert: watch}
          - {name: rested, min: 86}
        passives:
          - accumulate:
              self:
                wakefulness: -1
      # 机に向かう時間が長かったぶん、基準より1割低い体力。
      stamina:
        tags: [status, health]
        value: 90
        range: {min: 0, max: 90}
        stages:
          - {name: exhausted, alert: danger}
          - {name: tired, min: 18, alert: caution}
          - {name: winded, min: 54, alert: watch}
          - {name: fresh, min: 72}
      # 机に向かう時間が長かったぶん、基準より1割少ない持てる量。持ち物の重さ（g）は中身から導出されるので、valueは0のまま
      # （ContainerSystem.md 2節）。増える側が悪いプロパティなので、段はmaxからの割合で刻む
      # （docs/world/Characters.md）。
      load:
        tags: [status, health]
        value: 0
        range: {min: 0, max: 27000}
        stages:
          - {name: light}
          - {name: laden, min: 6750, alert: watch}
          - {name: heavy, min: 13500, alert: caution}
          - {name: too_heavy, min: 22500, alert: danger}
