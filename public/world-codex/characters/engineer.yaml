# 元エンジニア。道具を持ち替えながら夜通し作業する暮らしが体に残っている代わりに、
# 現場を歩き回る体力と蓄えは乏しい。
# 各プロパティの意味・値の刻み方は docs/world/Characters.md 参照。

object_defs:
  engineer:
    singleton: true
    traits: [player_character]
    slots:
      # 道具を並べて持ち替えるのに慣れており、手持ちが1枠多い。
      hand: {unit_capacity: 7}
    props:
      # 小食で、満腹から21時間（84 tick）。少ない食料で満たせる。
      satiety:
        tags: [status, nutrition]
        value: 8400
        range: {min: 0, max: 8400}
        stages:
          - {name: starving, alert: danger}
          - {name: hungry, min: 1200, alert: caution}
          - {name: peckish, min: 4800, alert: watch}
          - {name: fed, min: 6720}
        passives:
          - accumulate:
              self:
                satiety: -100
      # 満水から3日（288 tick）。
      hydration:
        tags: [status, nutrition]
        value: 7200
        range: {min: 0, max: 7200}
        stages:
          - {name: dehydrated, alert: fatal}
          - {name: parched, min: 600, alert: danger}
          - {name: thirsty, min: 2400, alert: caution}
          - {name: dryish, min: 4800, alert: watch}
          - {name: hydrated, min: 5760}
        passives:
          - accumulate:
              self:
                hydration: -25
      # 痩せ型で蓄えが薄い。最大限に肥えた状態から50日（4800 tick）。
      body_fat:
        tags: [nutrition]
        value: 120000
        range: {min: 0, max: 480000}
        passives:
          - accumulate:
              self:
                body_fat: -100
      # 徹夜に慣れており、眠らずにいられるのは27時間（108 tick）。
      wakefulness:
        tags: [status, health]
        value: 10800
        range: {min: 0, max: 10800}
        stages:
          - {name: overtired, alert: danger}
          - {name: sleepy, min: 1200, alert: caution}
          - {name: yawning, min: 4800, alert: watch}
          - {name: rested, min: 8640}
        passives:
          - accumulate:
              self:
                wakefulness: -100
      # 机に向かう時間が長かったぶん、基準より1割低い体力。
      stamina:
        tags: [status, health]
        value: 90
        range: {min: 0, max: 90}
        stages:
          - {name: exhausted, alert: danger}
          - {name: tired, min: 18, alert: caution}
          - {name: winded, min: 54, alert: watch}
          - {name: fresh, min: 72}
