# 怪我（injuryタグ）の定義。キャラクタのinjuriesスロットにだけ入る（characters/player_character.yaml）。
# 種類ごとの値の決め方は docs/world/Injuries.md 参照。

traits:
  # 手当てのできる怪我。治療具（treatments.yaml）を1つだけ当てておける。
  treatable:
    # 怪我を代表する物のスロット（7.8節）。カードを押すと治療具が並ぶ——付け外しの唯一の経路。
    main_item_slot: treatment
    slots:
      # 当てている治療具。**1枠に1つだけ**——包帯の上から添え木を、のような重ね掛けは、効き目の
      # 足し合わせ方が決まっていない（docs/world/Injuries.md 手当て節）。maxが要るのは、包帯は
      # 手持ちでは束ねたい物（stackable）だから。当てる場所は1つしかない。
      treatment:
        cell_count: 1
        cell: {accept: {tag: treatment}, max: 1}
        # 当てるのに手間がかかる（7.10節）。どの経路で入れても同じ値段になるので、怪我のカードへ
        # 重ねても子ウィンドウの枠へ落としても30分。外すのは一瞬（枠は入る側にしか時間を課さない）。
        put_in: {duration: 30}

object_defs:
  # 足首の捻挫。ヤシの木から降りそこねたときに負う（coconut.yamlのpick_green_coconut）。
  sprained_ankle:
    tags: [injury]
    traits: [treatable]
    # 身体から離れた「捻挫」は存在しない（7.9節）。負った本人から剥がせず、本人が消えれば
    # 一緒に消える。当てていた治療具は道連れにならず、こぼれ出る。
    bound_to_owner: true
    props:
      # 残っている傷の重さ。自然に治る速さを基準レートに置き（-1/tick、6.0節）、maxが「その速さで
      # 何tickぶんか」＝ 960 tick（10日）を表す。
      severity:
        value: 960
        # 0に達した瞬間にon_shortfallを発火させるため、下限は0ではなく1（6.3節）。
        range: {min: 1, max: 960}
        # 段はそのまま怪我カードのバーの色になる（ScreenLayout.md カードの状態バー節）。捻挫は
        # 負った直後でも要注意域までで、危険域は骨折のようなより重い怪我のために空けておく。
        stages:
          - {name: mending}
          - {name: sore, min: 320, alert: watch}
          - {name: acute, min: 640, alert: caution}
        passives:
          - accumulate:
              self:
                severity: -1
        on_shortfall:
          destroy: self
    passives:
      # 怪我はinjuriesスロットにしか入らないので、親は常にそれを負ったキャラクタ。
      - modify:
          parent:
            pain: 40
