# 怪我（injuryタグ）の定義。キャラクタのinjuriesスロットにだけ入る（characters/player_character.yaml）。
# 種類ごとの値の決め方は docs/world/Injuries.md 参照。

traits:
  # 手当てのできる怪我。治療具（treatments.yaml）を1つだけ当てておける。
  treatable:
    # 怪我のカードを押したら、当てている治療具を並べる（7.8節）。付け外しの唯一の経路。
    main_slot: treatment
    slots:
      # 当てている治療具。**1つだけ**——包帯の上から添え木を、のような重ね掛けは、効き目の
      # 足し合わせ方が決まっていない（docs/world/Injuries.md 手当て節）。
      treatment:
        accepts:
          - {tag: treatment, max: 1}
    combinations:
      # 治療具を当てる。何を当てられるかはtreatmentスロットのacceptsが決めるので、条件は書かない。
      #
      # **durationは持たない。** 子ウィンドウのスロットへ落としても当てられる（そちらは通常のスロット
      # 移動なので時間を取らない）ため、こちらだけ時間を取ると同じことが経路で違う値段になる。
      # 手当てに時間をかけたくなったら、スロット移動の側にも時間を課す語彙が要る。
      treat:
        with: treatment
        move: {object: dragged, to: self}

object_defs:
  # 足首の捻挫。ヤシの木から降りそこねたときに負う（coconut.yamlのpick_coconut）。
  sprained_ankle:
    tags: [injury]
    traits: [treatable]
    props:
      # 残っている傷の重さ。自然に治る速さを基準レートに置き（-100/tick、6.0節の量のクラス）、
      # maxが「その速さで何tickぶんか」＝ 960 tick（10日）を表す。
      severity:
        value: 96000
        # 0に達した瞬間にon_shortfallを発火させるため、下限は0ではなく1（6.3節）。
        range: {min: 1, max: 96000}
        # 段はそのまま怪我カードのバーの色になる（ScreenLayout.md カードの状態バー節）。捻挫は
        # 負った直後でも要注意域までで、危険域は骨折のようなより重い怪我のために空けておく。
        stages:
          - {name: mending}
          - {name: sore, min: 32000, alert: watch}
          - {name: acute, min: 64000, alert: caution}
        passives:
          - accumulate:
              self:
                severity: -100
        on_shortfall:
          destroy: self
    passives:
      # 怪我はinjuriesスロットにしか入らないので、親は常にそれを負ったキャラクタ。
      - modify:
          parent:
            pain: 40
