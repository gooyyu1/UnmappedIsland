# ゲーム全体の基本定義（docs/engine/GameElementDefinition.md参照）。シングルトンのworldと
# locationsスロット・locationトレイトのみを含む。個々のlocation種別と道はlocations.yaml、
# 地形生成はterrain_generation.yamlが持つ。

# プロパティのカテゴリ（GameElementDefinition.md 6.7節）。props側の`tags`はここで宣言した名前しか
# 使えない。宣言順がそのままUIでのタブの並び順になる。
property_tags:
  # ステータスエリアに常時バーで出すもの。他のカテゴリと重ねて付ける（満腹度はstatusでありnutrition
  # でもある）ため、「どのカテゴリか」ではなく「常に見せるか」だけを表すタグとして独立させている。
  status:
  health:
  nutrition:
  # 中身のバー（液体の残量）の塗り色を宣言するもの（CardView.md 8.2節、LiquidContainerSystem.md 2節）。
  # カードにバーとして出すかどうかはタグではなくprops側の`gauge`が宣言する（6.8節）。
  fill_color:

traits:
  # あらゆる「場所」が探索の可否によらず共通して持つ構造（ExplorationSystem.md参照）。
  # worldのlocationsスロットの受け入れ判定用のタグ（GameElementDefinition.md 4.1節・7.2節）もこのtraitが配る。
  # スロットの宣言順に意味がある: spawn（9.4節）は配置先スロットを宣言順に走査し、
  # 配置失敗時のフォールバックは先頭スロットへ入るため、itemsを先頭に置く
  # （「持ちきれない物は地面に落ちる」を実現する）。
  location:
    tags: [location]
    slots:
      # アイテム用スロット。
      items:
        cell: {accept: {tag: item}}
      # 道・木・植物・建築物・家具・洞窟の入口など、持ち歩けないもののスロット。
      # 束ねるかどうかは物の側が決める（ObjectDefのstackable、SlotSystem.md 4節）——道は行き先が
      # 個体ごとに違うので束ねない。木は束ねてよい。
      fixtures:
        cell: {accept: {tag: fixture}}
      # キャラクタ用スロット。1枠だけ（枠数を決めると位置も安定する、SlotSystem.md 3節）。
      characters:
        cell_count: 1
        cell: {accept: {tag: character}}

object_defs:
  world:
    singleton: true
    props:
      # 累積tick数（上限なし）。毎tick自分自身を+1する（プロパティレベルのpassives、8節）。
      tick:
        value: 0
        passives:
          - add:
              self:
                tick: 1
      # 1tickに相当するゲーム内時間（分）。ゲーム側（WorldSession）は実行時にこの値を読む。
      minutes_per_tick:
        value: 15
      # 現在の分（0-59）。溢れたらhourへ繰り上げ（6.3節のon_overflow）。setではなくaddで折り返すのは、
      # 1tickで複数span分溢れても超過分を保持できるため。毎tickの加算はゲーム側（WorldSession）が担う
      # （YAML側にもpassivesを持つと二重加算になるため、tick駆動のpassivesは持たない）。
      minute:
        value: 0
        range: {min: 0, max: 59}
        on_overflow:
          add:
            self:
              minute: -60
              hour: 1
      # 現在の時（0-23）。溢れたらdayへ繰り上げ。
      # stages（6.4節）+passives（8節）でsunlightへ時間帯の寄与を与える（天候による寄与はweather側。
      # 両者のmodifyが加算的に重なる）。夜の-100は、weatherの寄与をsunlightのrange（min:0）クランプで
      # 必ず0まで打ち消すための値。夜は0時をまたぐため、先頭のフォールバック段階とnight_lateの
      # 2エントリで概念上1つの「夜」段階を表す。区切り時刻・補正量はいずれも仮の値。
      hour:
        value: 0
        range: {min: 0, max: 23}
        on_overflow:
          add:
            self:
              hour: -24
              day: 1
        stages:
          - name: night          # 0-5時（フォールバック）・22-23時（night_late）:
            passives:            # weatherの寄与をsunlightのrangeクランプ経由で無効化する
              - modify:
                  self:
                    sunlight: -100
          - name: morning        # 6-9時: sunlightへ最低限の寄与
            min: 6
            passives:
              - modify:
                  self:
                    sunlight: 2
          - name: day            # 10-17時: sunlightへより強い寄与
            min: 10
            passives:
              - modify:
                  self:
                    sunlight: 5
          - name: evening        # 18-21時: 朝と同じsunlightへの寄与
            min: 18
            passives:
              - modify:
                  self:
                    sunlight: 2
          - name: night_late     # 22-23時: 夜と同じ
            min: 22
            passives:
              - modify:
                  self:
                    sunlight: -100
      # 現在の日（1始まり、上限なし。GameElementDefinition.md 17節）。
      day:
        value: 1
      # 現在の天気。シンボル型プロパティ（6.6節）。storm/heavy_rain/light_rain/cloudy/clear/sunny/
      # scorchingの7段階で、clear（普通の晴れ）がこの島の標準的な天気。
      # 遷移はClimateSystem.md参照: weather_remainingが0になるたび、atmospheric_moistureのstages
      # （scorchingのみthermal_levelのhot stage）が駆動する*_weightを重みとするpickで次が選ばれる。
      # stagesはsunlightへ「晴れているほど追加で明るくなる」寄与をmodifyで与える（時間帯の寄与と
      # 夜の無効化はhour側。シンボル型のstagesはステージ名がそのまま比較対象）。数値は仮の値。
      # 雨系stageは毎tick atmospheric_moistureを自己減算し、雨が水分を使い尽くすと乾いた候補が
      # 選ばれやすくなる貯水池の循環を作る（ClimateSystem.md 3節）。減算量と雨季の季節レートの
      # 大小関係が雨季の降雨の止み方を決める（4.3節）。
      weather:
        value: clear
        stages:
          - name: storm
            passives:
              - add:
                  self:
                    atmospheric_moisture: -2
          - name: heavy_rain
            passives:
              - add:
                  self:
                    atmospheric_moisture: -1.3
          - name: light_rain
            passives:
              - modify:
                  self:
                    sunlight: 1
              - add:
                  self:
                    atmospheric_moisture: -1.1
          - name: cloudy
            passives:
              - modify:
                  self:
                    sunlight: 2
          - name: clear
            passives:
              - modify:
                  self:
                    sunlight: 5
          - name: sunny
            passives:
              - modify:
                  self:
                    sunlight: 7
          - name: scorching
            passives:
              - modify:
                  self:
                    sunlight: 10
      # 太陽光の強さ。hourとweather両方のmodifyが加算的に重なる、都度導出される実効値（8.3節）。
      # min:0のクランプで、夜（hour側の-100）はweatherの寄与によらず必ず0になる。max:20は現状の
      # 最大値（10）に対する余裕。ambient_temperatureへの補正はこのstages+WhenOwnStageゲート
      # （6.4節・8.2節）が担う。しきい値・補正量は仮の値。
      sunlight:
        value: 0
        range: {min: 0, max: 20}
        stages:
          - name: dark    # sunlight=0（フォールバック）: やや涼しい
            passives:
              - modify:
                  self:
                    ambient_temperature: -3
          - name: dim     # sunlight 1-6: 補正なし
            min: 1
          - name: bright  # sunlight 7以上: やや暑い
            min: 7
            passives:
              - modify:
                  self:
                    ambient_temperature: 3
      # 現在の気温。体温と区別するための命名（ClimateSystem.md参照）。日照による補正はsunlight、
      # 季節による補正はthermal_level参照。
      ambient_temperature:
        value: 20

      # ===== 気候システム（ClimateSystem.md） =====
      # 季節・天気はいずれも専用オブジェクトではなくworld自身のプロパティ（現在値＋残り時間）で表現する。

      # 現在の季節。calm→wet→dry→calm…の固定順で巡回（ClimateSystem.md 2節）。各stageはフラグ
      # （season_is_*）と貯水池への季節レート（3節）を持つ。calmの水分+0.1は回復方向のレートで、
      # moderate閾値（30）付近を上下しながら1日1回前後の軽い雨を降らせる、序盤の生命線となる
      # 降雨サイクルを作る（3.1節・3.2節）。
      season:
        value: calm
        stages:
          - name: calm
            passives:
              - modify:
                  self:
                    season_is_calm: 1
              - add:
                  self:
                    atmospheric_moisture: 0.1
                    thermal_level: -1
                    monsoon_level: -1
          - name: wet
            passives:
              - modify:
                  self:
                    season_is_wet: 1
              - add:
                  self:
                    atmospheric_moisture: 1
                    thermal_level: -1
                    monsoon_level: 1
          - name: dry
            passives:
              - modify:
                  self:
                    season_is_dry: 1
              - add:
                  self:
                    atmospheric_moisture: -0.2
                    thermal_level: 1
                    monsoon_level: -1
      # 「今の季節はどれか」の0/1フラグ。seasonのstageがmodifyで立て、season_remainingの遷移pickが
      # 重みとして参照する（0/1の重み=決定的な条件分岐）。
      season_is_calm:
        value: 0
      season_is_wet:
        value: 0
      season_is_dry:
        value: 0
      # 季節サイクルの周回数（0始まり、dry→calm遷移のたびに+1）。stagesが立てるフラグが
      # 「初回サイクルは30日固定・2周目以降はランダム」の分岐（ClimateSystem.md 2.3節）の重みになる。
      season_cycle:
        value: 0
        stages:
          - name: first
            passives:
              - modify:
                  self:
                    first_cycle_flag: 1
          - name: later
            min: 1
            passives:
              - modify:
                  self:
                    later_cycle_flag: 1
      first_cycle_flag:
        value: 0
      later_cycle_flag:
        value: 0
      # 現在の季節の残りtick数。0に達した瞬間（min:1を下回るon_shortfall、6.3節）に3段のpick（10節）で
      # 遷移: (1)season_is_*で今の季節へ分岐、(2)初回サイクルか否かで分岐、(3)初回は30日（2880tick）固定、
      # 2周目以降は24/30/36日（2304/2880/3456tick）の等確率pick。dry→calm遷移だけがseason_cycleを+1する。
      season_remaining:
        value: 2880
        range: {min: 1, max: 999999}
        passives:
          - add:
              self:
                season_remaining: -1
        on_shortfall:
          pick:
            - weight: {prop: season_is_calm}
              pick:
                - weight: {prop: first_cycle_flag}
                  set:
                    self: {season: wet, season_remaining: 2880}
                - weight: {prop: later_cycle_flag}
                  pick:
                    - weight: 1
                      set:
                        self: {season: wet, season_remaining: 2304}
                    - weight: 1
                      set:
                        self: {season: wet, season_remaining: 2880}
                    - weight: 1
                      set:
                        self: {season: wet, season_remaining: 3456}
            - weight: {prop: season_is_wet}
              pick:
                - weight: {prop: first_cycle_flag}
                  set:
                    self: {season: dry, season_remaining: 2880}
                - weight: {prop: later_cycle_flag}
                  pick:
                    - weight: 1
                      set:
                        self: {season: dry, season_remaining: 2304}
                    - weight: 1
                      set:
                        self: {season: dry, season_remaining: 2880}
                    - weight: 1
                      set:
                        self: {season: dry, season_remaining: 3456}
            - weight: {prop: season_is_dry}
              pick:
                - weight: {prop: first_cycle_flag}
                  set:
                    self: {season: calm, season_remaining: 2880}
                  add:
                    self: {season_cycle: 1}
                - weight: {prop: later_cycle_flag}
                  pick:
                    - weight: 1
                      set:
                        self: {season: calm, season_remaining: 2304}
                      add:
                        self: {season_cycle: 1}
                    - weight: 1
                      set:
                        self: {season: calm, season_remaining: 2880}
                      add:
                        self: {season_cycle: 1}
                    - weight: 1
                      set:
                        self: {season: calm, season_remaining: 3456}
                      add:
                        self: {season_cycle: 1}
      # 大気水分量（ClimateSystem.md 3節の貯水池）。季節レート＋降雨中の自己減算（weather参照）で駆動。
      # 基準レート（1/tick、GameElementDefinition.md 6.0節）は雨季の上昇。湿度が上がる季節を基準に置き、
      # calm/dryはその微変動として扱う。
      # stagesは天気候補ごとの重み（*_weight）をmodifyで駆動する（ClimateSystem.md 4.3節）: saturatedでは晴れ系の重みなし、dryでは
      # heavy_rain/stormの重み0。晴れ系の中ではclearを最も重くする。moderateまでの雨は必ずlight_rain
      # （序盤の「軽めの雨」要件、3.2節）。scorching_weightのみthermal_levelのhot stageが駆動する。
      atmospheric_moisture:
        value: 0
        range: {min: 0, max: 100}
        stages:
          - name: dry
            passives:
              - modify:
                  self:
                    sunny_weight: 25
                    clear_weight: 45
                    cloudy_weight: 20
                    light_rain_weight: 1
          - name: moderate
            min: 30
            passives:
              - modify:
                  self:
                    sunny_weight: 10
                    clear_weight: 30
                    cloudy_weight: 25
                    light_rain_weight: 20
          - name: humid
            min: 60
            passives:
              - modify:
                  self:
                    clear_weight: 4
                    cloudy_weight: 3
                    light_rain_weight: 40
                    heavy_rain_weight: 30
                    storm_weight: 3
          - name: saturated
            min: 85
            passives:
              - modify:
                  self:
                    cloudy_weight: 5
                    light_rain_weight: 20
                    heavy_rain_weight: 40
                    storm_weight: 40
      # 天気候補ごとの重み。atmospheric_moistureのstages（scorching_weightのみthermal_levelの
      # hot stage）がmodifyで維持する（ベース値0のため、modifyされない候補は選ばれない）。
      sunny_weight:
        value: 0
      clear_weight:
        value: 0
      cloudy_weight:
        value: 0
      light_rain_weight:
        value: 0
      heavy_rain_weight:
        value: 0
      storm_weight:
        value: 0
      scorching_weight:
        value: 0
      # 現在の天気の残りtick数。0に達した瞬間（min:1を下回るon_shortfall、6.3節）に、外側のpickが
      # *_weightを重みに次の天気を、内側のpickが持続時間4/5/6時間（16/20/24tick）を等確率で選ぶ
      # （ClimateSystem.md 4節）。初期値20（5時間）はday1の最初の遷移までの猶予。
      weather_remaining:
        value: 20
        range: {min: 1, max: 999999}
        passives:
          - add:
              self:
                weather_remaining: -1
        on_shortfall:
          pick:
            - weight: {prop: sunny_weight}
              pick:
                - weight: 1
                  set:
                    self: {weather: sunny, weather_remaining: 16}
                - weight: 1
                  set:
                    self: {weather: sunny, weather_remaining: 20}
                - weight: 1
                  set:
                    self: {weather: sunny, weather_remaining: 24}
            - weight: {prop: clear_weight}
              pick:
                - weight: 1
                  set:
                    self: {weather: clear, weather_remaining: 16}
                - weight: 1
                  set:
                    self: {weather: clear, weather_remaining: 20}
                - weight: 1
                  set:
                    self: {weather: clear, weather_remaining: 24}
            - weight: {prop: cloudy_weight}
              pick:
                - weight: 1
                  set:
                    self: {weather: cloudy, weather_remaining: 16}
                - weight: 1
                  set:
                    self: {weather: cloudy, weather_remaining: 20}
                - weight: 1
                  set:
                    self: {weather: cloudy, weather_remaining: 24}
            - weight: {prop: light_rain_weight}
              pick:
                - weight: 1
                  set:
                    self: {weather: light_rain, weather_remaining: 16}
                - weight: 1
                  set:
                    self: {weather: light_rain, weather_remaining: 20}
                - weight: 1
                  set:
                    self: {weather: light_rain, weather_remaining: 24}
            - weight: {prop: heavy_rain_weight}
              pick:
                - weight: 1
                  set:
                    self: {weather: heavy_rain, weather_remaining: 16}
                - weight: 1
                  set:
                    self: {weather: heavy_rain, weather_remaining: 20}
                - weight: 1
                  set:
                    self: {weather: heavy_rain, weather_remaining: 24}
            - weight: {prop: storm_weight}
              pick:
                - weight: 1
                  set:
                    self: {weather: storm, weather_remaining: 16}
                - weight: 1
                  set:
                    self: {weather: storm, weather_remaining: 20}
                - weight: 1
                  set:
                    self: {weather: storm, weather_remaining: 24}
            - weight: {prop: scorching_weight}
              pick:
                - weight: 1
                  set:
                    self: {weather: scorching, weather_remaining: 16}
                - weight: 1
                  set:
                    self: {weather: scorching, weather_remaining: 20}
                - weight: 1
                  set:
                    self: {weather: scorching, weather_remaining: 24}
      # 蓄熱量（ClimateSystem.md 3節のもう一つの貯水池）。季節レートをambient_temperatureへ直接
      # 加算すると±1/tickでも1季節で±2880になるため、atmospheric_moistureと同じ「スケールした
      # 貯水池のstagesが表向きの値をmodifyする」パターンを使う。dryで+1/tick（20日で0→上限1920）、
      # calm/wetで-1/tick。初期値1000は「開始時は補正なし（mild帯）」のため。
      # hot stageはscorching_weightも駆動する（乾季後半だけ灼熱が抽選に加わる。stageのminは
      # その値を含む判定のため、上限=hot閾値でもhotは有効）。
      # 上限をhot閾値1920と同値にするのは意図的: calmに入った最初のtickでmildへ落ち、灼熱と気温+8が
      # 乾季の終了と同時に消える（残暑を作らない。「暑さ=乾季」を体感と一致させるため）。
      thermal_level:
        value: 1000
        range: {min: 0, max: 1920}
        stages:
          - name: cool
            passives:
              - modify:
                  self:
                    ambient_temperature: -5
          - name: mild
            min: 960
          - name: hot
            min: 1920
            passives:
              - modify:
                  self:
                    ambient_temperature: 8
                    scorching_weight: 50
      # 雨季の深まり（ClimateSystem.md 4.3節）。thermal_levelと対称の貯水池で、wetで+1/tick
      # （20日で0→上限1920）、calm/dryで-1/tick。deepening帯（雨季10日目〜）・peak帯（20日目〜）が
      # heavy_rain_weight/storm_weightへ上乗せし、「雨季後半ほど嵐・大雨が増える」を保証する。
      # 上乗せは大気水分量が高いときにconditionsで限定する: 無条件だと、乾季序盤に水分が尽きた後まで
      # 大雨の重みが残ってしまうため。水分がまだ高い過渡の間は上乗せが生き、嵐の名残が表現される。
      monsoon_level:
        value: 0
        range: {min: 0, max: 1920}
        stages:
          - name: early
          - name: deepening
            min: 960
            passives:
              - modify:
                  self:
                    heavy_rain_weight: 15
                conditions:
                  - {object: self, prop: atmospheric_moisture, gte: 60}
          - name: peak
            min: 1920
            passives:
              - modify:
                  self:
                    heavy_rain_weight: 30
                    storm_weight: 40
                conditions:
                  - {object: self, prop: atmospheric_moisture, gte: 45}
      # 難易度の初期補正1: 経過tickを数える専用カウンタで、2日目（tick 96-191）だけ
      # atmospheric_moistureへ追加加算し、高確率で雨を降らせる（ClimateSystem.md 5.1節）。
      # 天気そのものは固定しない（5.3節）ため、晴れる可能性もある。
      early_rain_calibration:
        value: 0
        passives:
          - add:
              self:
                early_rain_calibration: 1
        stages:
          - name: idle
          - name: boosting
            min: 96
            passives:
              - add:
                  self:
                    atmospheric_moisture: 0.6
          - name: done
            min: 192
      # 難易度の初期補正2: 最初の乾季の10日目前後（71日目、tick 6720-6815）にdryのレートを大きく
      # 上回る+2/tickを加算し、高確率で雨を降らせる（5.2節）。6720/6816はseason_remainingの
      # 「初回サイクル30日固定」に依存した導出値であり、そちらを変えたらこちらも再計算が必要。
      first_dry_rain_calibration:
        value: 0
        passives:
          - add:
              self:
                first_dry_rain_calibration: 1
        stages:
          - name: idle
          - name: boosting
            min: 6720
            passives:
              - add:
                  self:
                    atmospheric_moisture: 2
          - name: done
            min: 6816
    slots:
      locations:
        # locationタグを持つobject_defのみを受け入れる。
        cell: {accept: {tag: location}}
