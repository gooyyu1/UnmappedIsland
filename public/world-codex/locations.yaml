# 土地（location）と道（path）の定義（TerrainGeneration.md・ExplorationSystem.md・
# GameElementDefinition.md参照）。地形生成そのもの（どの土地がいくつ・どう繋がって生成されるか）は
# terrain_generation.yamlとDomain/Generationの生成パイプラインが担う。
#
# すべての土地は location trait（core.yaml参照）と、このファイルで定義する explorable trait を
# 実装する。「探索で何が見つかるか」「探索率100%までの探索回数」は地形ごとに異なるため、explorable
# traitには持たせず、各土地のobject_defが探索アクション（explore）として個別に定義する。

traits:
  # 探索できる場所だけが追加で持つ構造。
  explorable:
    slots:
      # 生成時に設置物を隠しておくスロット。探索の進捗が設置物のrequired_progressへ達すると、
      # Location（Views）がfixturesスロットへ移して「発見」させる。UI側は表示しない。
      #
      # locationのfixturesスロットより後に宣言すること。探索でその場に湧く設置物（explore内の
      # spawn）は宣言順で最初に受け入れたスロットへ入るため、先に置くと湧いた側まで隠れてしまう。
      undiscovered_fixtures:
        accepts:
          - {tag: fixture, max: 9999}
        stackable: false
    props:
      # 探索の進捗。値なし（{}）のため、各土地のobject_def側でvalue/range（探索率100%=range.max）
      # を必ず与える（5節の「traitでvalueなし=継承先で必須」の規約）。
      exploration_progress: {}

object_defs:
  # ------------------------------------------------------------------
  # 道（path）。土地と土地の繋がり1本の片方向分。地形生成が辺1本につき両端へ1個ずつ生成し、
  # destination_idが相手側を指す（発見の進み方は両端で非対称になりうる）。
  # 持ち歩けないものなので設置物（fixture）の一種として、木や建物と同じfixturesスロットに並ぶ。
  # - travel_minutes: 移動時間（分）。距離と移動難易度から生成時に計算され、インスタンスごとに
  #   上書きされる（TerrainGeneration.md 3.5節）。
  # - required_progress: 親の土地のexploration_progressがこの値に達すると発見される。
  # - destination_id: 移動先LocationのインスタンスID。生成時に確定する個体への参照のため、
  #   object_def参照ではなくインスタンスIDのプロパティで持つ（moveの規約）。
  # ------------------------------------------------------------------
  path:
    # fixtureは「持ち歩けない」という置き場所の分類、pathは「移動手段である」という役割。
    # 画面側は後者を見て、道のカードだけ移動先の土地名を表示する。
    tags: [fixture, path]
    props:
      travel_minutes:
        value: 60
      required_progress:
        value: 1
      destination_id:
        value: 0
    actions:
      travel:
        showMenu: always
        conditions:
          - {in_slot: fixtures}   # 未発見（undiscovered_fixtures側）の間は実行できない
        duration: {prop: travel_minutes}
        move:
          object: actor
          to_prop: destination_id

  # ------------------------------------------------------------------
  # 探索で見つかる発見物（アイテム）。itemタグによって土地のitemsスロットへ振り分けられる。
  # thick_branch/stone/branchは工作・燃料などの素材の想定（レシピは今後の課題）。
  # exploreが湧かせるヤシの実（coconut）はcoconut.yamlが定義する。
  # ------------------------------------------------------------------

  # 太い枝。細い枝（branch）とは別のアイテム。
  thick_branch:
    tags: [item]

  # 石。石同士を打ち合わせると、片方が割れて尖った石（tools.yaml）になる。
  # 打ち合わせる相手（dragged）は槌として残り、割られる側（self）だけが尖った石へ置き換わる。
  stone:
    tags: [item, stone]
    combinations:
      knap:
        with: stone
        duration: 60
        destroy: self
        spawn: {object: sharp_stone}

  # 枝。
  branch:
    tags: [item]

  # ------------------------------------------------------------------
  # 探索で見つかる設置物。fixtureタグによって土地のfixturesスロットへ振り分けられる。
  # 発見されるだけのプレースホルダ（採取・内部生成などの振る舞いは今後の課題）。
  # exploreが湧かせるヤシの木（palm_tree）はcoconut.yamlが定義する。
  # ------------------------------------------------------------------

  # ベリーの茂み。定期的に実を付ける採取ポイントになる想定。
  berry_bush:
    tags: [fixture]

  # 洞窟の入口。内部に子Locationグラフを持つ構造物（TerrainGeneration.md 3.7節）の入口となる想定。
  cave_entrance:
    tags: [fixture]

  # 湧き水。飲用・補水ポイントになる想定。
  spring:
    tags: [fixture]

  # ------------------------------------------------------------------
  # 土地。すべて traits: [location, explorable]。
  # - exploration_progress.range.max = 探索率100%に達するまでの探索回数（10〜20）。100%に達しても
  #   探索は続けられ（進捗はrangeの上限に張り付く）、生成時に仕込まれた道がそれ以上見つからなくなるだけ。
  # - exploreのpickは「その土地で何が見つかるか」の確率テーブル。進捗+1（add self）は
  #   addとpickが排他という文法上、全候補に含める（10節）。
  # - どの候補も1個以上を必ず見つける（ハズレの候補は置かない）。1回で見つかる数は候補ごとに1〜3個で、
  #   実りの多い土地は平均2個、荒野・山頂・岸壁のような乏しい土地は平均1.6個になるよう重みを配る
  #   （tests/worldCodex/explorationYield.test.tsが検証する）。設置物（木・茂み・洞窟の入口など）は
  #   1回に1つまでにし、数で増えるのはアイテムだけにする。
  # - durationは1回の探索にかかる時間（分）。全土地で1tick（minutes_per_tick、core.yaml）に揃える。
  #   土地ごとの探索の重さは、回数（exploration_progress.range.max）だけで表す。
  # ------------------------------------------------------------------

  # 砂浜。開けていて歩きやすく、漂着物とヤシの実に恵まれる。
  sandy_beach:
    traits: [location, explorable]
    props:
      exploration_progress:
        value: 0
        range: {min: 0, max: 10}
    actions:
      explore:
        showMenu: always
        duration: 15
        pick:
          # 1個
          - weight: 13
            add: {self: {exploration_progress: 1}}
            spawn: {object: palm_tree, into: self}
          - weight: 5
            add: {self: {exploration_progress: 1}}
            spawn: {object: woven_basket, into: self}
          - weight: 7
            add: {self: {exploration_progress: 1}}
            spawn: {object: coconut_crab, into: self}
          # 2個
          - weight: 20
            add: {self: {exploration_progress: 1}}
            spawn:
              - {object: coconut, into: self}
              - {object: coconut, into: self}
          - weight: 15
            add: {self: {exploration_progress: 1}}
            spawn:
              - {object: coconut, into: self}
              - {object: thick_branch, into: self}
          - weight: 10
            add: {self: {exploration_progress: 1}}
            spawn:
              - {object: thick_branch, into: self}
              - {object: coconut_crab, into: self}
          # 3個
          - weight: 18
            add: {self: {exploration_progress: 1}}
            spawn:
              - {object: coconut, into: self}
              - {object: coconut, into: self}
              - {object: thick_branch, into: self}
          - weight: 12
            add: {self: {exploration_progress: 1}}
            spawn:
              - {object: thick_branch, into: self}
              - {object: thick_branch, into: self}
              - {object: coconut_crab, into: self}

