# 土地（location）と道（path）の定義（TerrainGeneration.md・ExplorationSystem.md・
# GameElementDefinition.md参照）。地形生成そのもの（どの土地がいくつ・どう繋がって生成されるか）は
# terrain_generation.yamlとDomain/Generationの生成パイプラインが担う。
#
# すべての土地は location trait（core.yaml参照）と、このファイルで定義する explorable trait を
# 実装する。「探索で何が見つかるか」「探索率100%までの探索回数」は地形ごとに異なるため、explorable
# traitには持たせず、各土地のobject_defが探索アクション（explore）として個別に定義する。

traits:
  # 探索できる場所だけが追加で持つ構造。
  explorable:
    slots:
      # 生成時に設置物を隠しておくスロット。探索の進捗が設置物のrequired_progressへ達すると、
      # Location（Views）がfixturesスロットへ移して「発見」させる。UI側は表示しない。
      #
      # locationのfixturesスロットより後に宣言すること。探索でその場に湧く設置物（explore内の
      # spawn）は宣言順で最初に受け入れたスロットへ入るため、先に置くと湧いた側まで隠れてしまう。
      undiscovered_fixtures:
        cell: {accept: {tag: fixture}}
        # 自動配置（7.7節）から外す。fixtureを無条件に受け入れるうえUIに出さないので、
        # 行き先の無い設置物がここへ落ちると、探索するまで画面から消えたままになる。
        auto_placement: false
    props:
      # 探索の進捗。値なし（{}）のため、各土地のobject_def側でvalue/range（探索率100%=range.max）
      # を必ず与える（5節の「traitでvalueなし=継承先で必須」の規約）。
      exploration_progress: {}

object_defs:
  # ------------------------------------------------------------------
  # 道（path）。土地と土地の繋がり1本の片方向分。地形生成が辺1本につき両端へ1個ずつ生成し、
  # destination_idが相手側を指す（発見の進み方は両端で非対称になりうる）。
  # 持ち歩けないものなので設置物（fixture）の一種として、木や建物と同じfixturesスロットに並ぶ。
  # - travel_minutes: 移動時間（分）。距離と移動難易度から生成時に計算され、インスタンスごとに
  #   上書きされる（TerrainGeneration.md 3.5節）。
  # - required_progress: 親の土地のexploration_progressがこの値に達すると発見される。
  # - destination_id: 移動先LocationのインスタンスID。生成時に確定する個体への参照のため、
  #   object_def参照ではなくインスタンスIDのプロパティで持つ（moveの規約）。
  # ------------------------------------------------------------------
  path:
    # fixtureは「持ち歩けない」という置き場所の分類、pathは「移動手段である」という役割。
    # 画面側は後者を見て、道のカードだけ移動先の土地名を表示する。
    tags: [fixture, path]
    # 繋がる土地の無い道は存在しない（7.9節）。土地から外せず、土地が消えれば一緒に消える。
    bound_to_owner: true
    # 行き先が個体ごとに違うので束ねない。束ねると代表の行き先しかカードに出せなくなる（4節）。
    stackable: false
    props:
      travel_minutes:
        value: 60
      required_progress:
        value: 1
      destination_id:
        value: 0
      # 移動先の土地にある、こちらへ戻る道のインスタンスID。辺1本の両端の道が互いを指す
      # （生成時に相互に書き込まれる）。片方が見つかったらもう片方も一緒に見つかることで、
      # 渡った先から必ず戻れる（ExplorationSystem.md 3.1節）。
      return_path_id:
        value: 0
    actions:
      travel:
        showMenu: always
        conditions:
          - {in_slot: fixtures}   # 未発見（undiscovered_fixtures側）の間は実行できない
          # 荷が重すぎると動けない。段の名前で見るので、境目はキャラクタのloadのstagesだけが持つ
          # （ContainerSystem.md 5節）。
          - reason: too_heavy
            not: {object: actor, prop: load, in_stage: too_heavy}
        duration: {prop: travel_minutes}
        move:
          object: actor
          to_prop: destination_id

  # ------------------------------------------------------------------
  # 探索で見つかる発見物（アイテム）。itemタグによって土地のitemsスロットへ振り分けられる。
  # thick_branch/stone/twigは工作・燃料などの素材。枯れ草（dry_grass）はfire.yamlが定義する。
  # exploreが湧かせるヤシの実（coconut）はcoconut.yamlが定義する。
  # ------------------------------------------------------------------

  # 太い枝。腕ほどの太さで70cmほど、削れば道具の柄になる大きさ（小枝は柄にすると折れる）。
  # 建材の丸太はこれとは別の物として後から入るので、ここを丸太まで大きくしない。
  thick_branch:
    tags: [item]
    # 燃料としての量はfire.yamlのburnable traitが持つ。
    traits: [burnable]
    props:
      weight: {value: 1000}
      volume: {value: 1300}
      # 太い枝1本で、炎を100分ほど保てる（docs/engine/FireSystem.md 2.3節）。
      fuel: {value: 20}

  # 石。石同士を打ち合わせると、片方が割れて尖った石（tools.yaml）になる。
  # 打ち合わせる相手（dragged）は槌として残り、割られる側（self）だけが尖った石へ置き換わる。
  stone:
    tags: [item, stone]
    props:
      weight: {value: 1000}
      volume: {value: 700}
    combinations:
      knap:
        with: stone
        duration: 60
        destroy: self
        spawn: {object: sharp_stone}

  # 小枝。指の太さの細い枝を拾い集めたもので、焚き付け・結びに使う。柄にすると折れる。
  # 槍や銛の柄になる2mほどの長い棒は、拾う物ではなく若木を刃物で切って採る別の物として後から入る
  # （docs/world/SurvivalItems.md 0節）。ここを長くして兼ねさせない。
  twig:
    tags: [item]
    # 火口にも燃料にもなる（docs/engine/FireSystem.md 3.2節）。火起こし具へ重ねれば焚き付けとして
    # 燃え、炉へ重ねれば燃料。摩擦の熾を受け止めるには太すぎるので、火口タグは持たない。
    traits: [burnable]
    props:
      weight: {value: 300}
      volume: {value: 500}
      # 小枝1本で、熾火を1時間半ほど保てる。
      fuel: {value: 3}

  # ------------------------------------------------------------------
  # 探索で見つかる設置物。fixtureタグによって土地のfixturesスロットへ振り分けられる。
  # 発見されるだけのプレースホルダ（採取・内部生成などの振る舞いは今後の課題）。
  # exploreが湧かせるヤシの木（palm_tree）はcoconut.yamlが定義する。
  # ------------------------------------------------------------------

  # ベリーの茂み。定期的に実を付ける採取ポイントになる想定。
  berry_bush:
    tags: [fixture]

  # 洞窟の入口。内部に子Locationグラフを持つ構造物（TerrainGeneration.md 3.7節）の入口となる想定。
  cave_entrance:
    tags: [fixture]

  # 湧き水。飲用・補水ポイントになる想定。
  spring:
    tags: [fixture]

  # ------------------------------------------------------------------
  # 土地。すべて traits: [location, explorable]。
  # - exploration_progress.range.max = 探索率100%に達するまでの探索回数（10〜20）。100%に達しても
  #   探索は続けられ（進捗はrangeの上限に張り付く）、生成時に仕込まれた道がそれ以上見つからなくなるだけ。
  # - exploreのpickは「その土地で何が見つかるか」の確率テーブル。進捗+1（add self）は
  #   どの候補が選ばれても起こるので、pickの外に1つだけ置く（9.7節）。
  # - どの候補も1個以上を必ず見つける（ハズレの候補は置かない）。1回で見つかる数は候補ごとに1〜3個で、
  #   実りの多い土地は平均2個、荒野・山頂・岸壁のような乏しい土地は平均1.6個になるよう重みを配る
  #   （tests/worldCodex/explorationYield.test.tsが検証する）。設置物（木・茂み・洞窟の入口など）は
  #   1回に1つまでにし、数で増えるのはアイテムだけにする。
  # - durationは1回の探索にかかる時間（分）。全土地で1tick（minutes_per_tick、core.yaml）に揃える。
  #   土地ごとの探索の重さは、回数（exploration_progress.range.max）だけで表す。
  # - `weight: {prop: ...}`の候補は**発見量のつまみ**。valueが素の重みで、亜種
  #   （terrain_generation.yamlのvariants、TerrainGeneration.md 3.6節）が個体ごとに上書きする。
  #   亜種で変えたい候補にだけ足す。つまみを増やすほど「この土地らしさ」の調整点も増えるので、
  #   その土地を特徴づける候補（洞窟・水場・実りなど）に絞る。
  # ------------------------------------------------------------------

  # 砂浜。開けていて歩きやすく、漂着物とヤシの実に恵まれる。
  sandy_beach:
    traits: [location, explorable]
    props:
      exploration_progress:
        value: 0
        range: {min: 0, max: 10}
      # くくり罠で掛かる重み（docs/engine/TrapSystem.md 3節）。宣言した動物だけが、その土地の
      # 罠の候補に載る。
      rat_catch: {value: 4}
      # ヤシの木が1本だけ見つかる候補の重み。亜種が上書きする（terrain_generation.yaml）。
      palm_find:
        value: 13
      # ヤシガニが1匹だけ見つかる候補の重み。
      crab_find:
        value: 7
      # 太い枝2本とヤシガニが見つかる候補の重み。
      driftwood_find:
        value: 12
    actions:
      explore:
        showMenu: always
        duration: 15
        add: {self: {exploration_progress: 1}}
        pick:
          # 1個
          - weight: {prop: palm_find}
            spawn: {object: palm_tree, into: self}
          - weight: 5
            spawn: {object: woven_basket, into: self}
          - weight: {prop: crab_find}
            spawn: {object: coconut_crab, into: self}
          # 2個
          - weight: 20
            spawn: {object: coconut, count: 2, into: self}
          - weight: 15
            spawn:
              - {object: coconut, into: self}
              - {object: thick_branch, into: self}
          - weight: 10
            spawn:
              - {object: thick_branch, into: self}
              - {object: coconut_crab, into: self}
          # 3個
          - weight: 18
            spawn:
              - {object: coconut, count: 2, into: self}
              - {object: thick_branch, into: self}
          - weight: {prop: driftwood_find}
            spawn:
              - {object: thick_branch, count: 2, into: self}
              - {object: coconut_crab, into: self}

  # 岩だらけの海岸。石とヤシガニが多いが、足場が悪い。
  rocky_coast:
    traits: [location, explorable]
    props:
      exploration_progress:
        value: 0
        range: {min: 0, max: 12}
      # くくり罠で掛かる重み（docs/engine/TrapSystem.md 3節）。宣言した動物だけが、その土地の
      # 罠の候補に載る。
      rat_catch: {value: 4}
      # 洞窟の入口が見つかる候補の重み。
      cave_find:
        value: 13
      # ヤシガニが1匹だけ見つかる候補の重み。
      crab_find:
        value: 12
    actions:
      explore:
        showMenu: always
        duration: 15
        add: {self: {exploration_progress: 1}}
        pick:
          # 1個
          - weight: {prop: cave_find}
            spawn: {object: cave_entrance, into: self}
          - weight: {prop: crab_find}
            spawn: {object: coconut_crab, into: self}
          # 2個
          - weight: 20
            spawn: {object: stone, count: 2, into: self}
          - weight: 15
            spawn:
              - {object: stone, into: self}
              - {object: coconut_crab, into: self}
          - weight: 10
            spawn:
              - {object: stone, into: self}
              - {object: thick_branch, into: self}
          # 3個
          - weight: 18
            spawn:
              - {object: stone, count: 2, into: self}
              - {object: thick_branch, into: self}
          - weight: 12
            spawn:
              - {object: stone, count: 2, into: self}
              - {object: coconut_crab, into: self}

  # 岸壁。切り立った崖の海岸。得られるものは少ないが、洞窟が口を開けていることがある。
  cliff_coast:
    traits: [location, explorable]
    props:
      exploration_progress:
        value: 0
        range: {min: 0, max: 10}
      # くくり罠で掛かる重み（docs/engine/TrapSystem.md 3節）。宣言した動物だけが、その土地の
      # 罠の候補に載る。
      rat_catch: {value: 4}
      # 洞窟の入口が見つかる候補の重み。
      cave_find:
        value: 20
    actions:
      explore:
        showMenu: always
        duration: 15
        add: {self: {exploration_progress: 1}}
        pick:
          # 1個
          - weight: {prop: cave_find}
            spawn: {object: cave_entrance, into: self}
          - weight: 30
            spawn: {object: stone, into: self}
          # 2個
          - weight: 25
            spawn: {object: stone, count: 2, into: self}
          - weight: 17
            spawn:
              - {object: stone, into: self}
              - {object: thick_branch, into: self}
          # 3個
          - weight: 8
            spawn:
              - {object: stone, count: 2, into: self}
              - {object: thick_branch, into: self}

  # 草原。見通しがよく歩きやすい。食べられる野草と水場に恵まれる。
  grassland:
    traits: [location, explorable]
    props:
      exploration_progress:
        value: 0
        range: {min: 0, max: 12}
      # くくり罠で掛かる重み（docs/engine/TrapSystem.md 3節）。宣言した動物だけが、その土地の
      # 罠の候補に載る。
      rat_catch: {value: 6}
      junglefowl_catch: {value: 10}
      # 木苺の茂みが見つかる候補の重み。
      berry_find:
        value: 15
      # 湧き水が見つかる候補の重み。
      spring_find:
        value: 10
    actions:
      explore:
        showMenu: always
        duration: 15
        add: {self: {exploration_progress: 1}}
        pick:
          # 1個
          - weight: {prop: berry_find}
            spawn: {object: berry_bush, into: self}
          - weight: {prop: spring_find}
            spawn: {object: spring, into: self}
          # 2個
          - weight: 18
            spawn: {object: water_spinach, count: 2, into: self}
          - weight: 17
            spawn:
              - {object: water_spinach, into: self}
              - {object: taro, into: self}
          - weight: 10
            spawn: {object: taro, count: 2, into: self}
          - weight: 12
            spawn:
              - {object: dry_grass, into: self}
              - {object: water_spinach, into: self}
          # 3個
          - weight: 18
            spawn:
              - {object: water_spinach, count: 2, into: self}
              - {object: taro, into: self}
          - weight: 12
            spawn:
              - {object: taro, count: 2, into: self}
              - {object: water_spinach, into: self}

  # 森林。木々に囲まれ、小枝・木の実・水場が見つかる。
  forest:
    traits: [location, explorable]
    props:
      exploration_progress:
        value: 0
        range: {min: 0, max: 15}
      # くくり罠で掛かる重み（docs/engine/TrapSystem.md 3節）。宣言した動物だけが、その土地の
      # 罠の候補に載る。
      rat_catch: {value: 6}
      # 木苺の茂みが見つかる候補の重み。
      berry_find:
        value: 15
      # 湧き水が見つかる候補の重み。
      spring_find:
        value: 10
    actions:
      explore:
        showMenu: always
        duration: 15
        add: {self: {exploration_progress: 1}}
        pick:
          # 1個
          - weight: {prop: berry_find}
            spawn: {object: berry_bush, into: self}
          - weight: {prop: spring_find}
            spawn: {object: spring, into: self}
          # 2個
          - weight: 20
            spawn: {object: twig, count: 2, into: self}
          - weight: 15
            spawn:
              - {object: twig, into: self}
              - {object: taro, into: self}
          - weight: 10
            spawn:
              - {object: twig, into: self}
              - {object: berry_bush, into: self}
          - weight: 12
            spawn:
              - {object: banana_plant, into: self}
              - {object: twig, into: self}
          # 3個
          - weight: 18
            spawn:
              - {object: twig, count: 2, into: self}
              - {object: taro, into: self}
          - weight: 12
            spawn: {object: twig, count: 3, into: self}

  # 密林。湿って鬱蒼としており、探索し切るまでが最も長いが、食料は最も豊か。
  jungle:
    traits: [location, explorable]
    props:
      exploration_progress:
        value: 0
        range: {min: 0, max: 18}
      # くくり罠で掛かる重み（docs/engine/TrapSystem.md 3節）。宣言した動物だけが、その土地の
      # 罠の候補に載る。
      rat_catch: {value: 6}
      junglefowl_catch: {value: 8}
      # ヤシの木が1本だけ見つかる候補の重み。
      palm_find:
        value: 15
      # タロイモが1つだけ見つかる候補の重み。
      taro_find:
        value: 10
    actions:
      explore:
        showMenu: always
        duration: 15
        add: {self: {exploration_progress: 1}}
        pick:
          # 1個
          - weight: {prop: palm_find}
            spawn: {object: palm_tree, into: self}
          - weight: {prop: taro_find}
            spawn: {object: taro, into: self}
          # 2個
          - weight: 17
            spawn:
              - {object: twig, into: self}
              - {object: coconut, into: self}
          - weight: 15
            spawn: {object: coconut, count: 2, into: self}
          - weight: 13
            spawn:
              - {object: twig, into: self}
              - {object: water_spinach, into: self}
          - weight: 12
            spawn:
              - {object: abaca, into: self}
              - {object: twig, into: self}
          - weight: 10
            spawn:
              - {object: banana_plant, into: self}
              - {object: twig, into: self}
          # 3個
          - weight: 18
            spawn:
              - {object: twig, into: self}
              - {object: coconut, into: self}
              - {object: water_spinach, into: self}
          - weight: 12
            spawn:
              - {object: coconut, count: 2, into: self}
              - {object: taro, into: self}

  # 岩場。ごろごろした岩の間に、石材と洞窟が見つかる。
  rocky_field:
    traits: [location, explorable]
    props:
      exploration_progress:
        value: 0
        range: {min: 0, max: 12}
      # くくり罠で掛かる重み（docs/engine/TrapSystem.md 3節）。宣言した動物だけが、その土地の
      # 罠の候補に載る。
      rat_catch: {value: 4}
      # 洞窟の入口が見つかる候補の重み。
      cave_find:
        value: 18
    actions:
      explore:
        showMenu: always
        duration: 15
        add: {self: {exploration_progress: 1}}
        pick:
          # 1個
          - weight: {prop: cave_find}
            spawn: {object: cave_entrance, into: self}
          - weight: 7
            spawn: {object: twig, into: self}
          # 2個
          - weight: 22
            spawn: {object: stone, count: 2, into: self}
          - weight: 15
            spawn:
              - {object: stone, into: self}
              - {object: twig, into: self}
          - weight: 8
            spawn: {object: twig, count: 2, into: self}
          # 3個
          - weight: 20
            spawn:
              - {object: stone, count: 2, into: self}
              - {object: twig, into: self}
          - weight: 10
            spawn: {object: stone, count: 3, into: self}

  # 荒野。乾いてひび割れた不毛の土地。得られるものは少ない。
  wasteland:
    traits: [location, explorable]
    props:
      exploration_progress:
        value: 0
        range: {min: 0, max: 10}
      # くくり罠で掛かる重み（docs/engine/TrapSystem.md 3節）。宣言した動物だけが、その土地の
      # 罠の候補に載る。
      rat_catch: {value: 4}
      # 石が1つだけ見つかる候補の重み。
      stone_find:
        value: 30
      # 小枝が1つだけ見つかる候補の重み。
      wood_find:
        value: 20
    actions:
      explore:
        showMenu: always
        duration: 15
        add: {self: {exploration_progress: 1}}
        pick:
          # 1個
          - weight: {prop: stone_find}
            spawn: {object: stone, into: self}
          - weight: {prop: wood_find}
            spawn: {object: twig, into: self}
          # 2個
          - weight: 25
            spawn: {object: stone, count: 2, into: self}
          - weight: 17
            spawn:
              - {object: stone, into: self}
              - {object: twig, into: self}
          - weight: 12
            spawn:
              - {object: dry_grass, into: self}
              - {object: twig, into: self}
          # 3個
          - weight: 8
            spawn:
              - {object: stone, count: 2, into: self}
              - {object: twig, into: self}

  # 山腹。山の中腹の斜面。石と小枝のほか、洞窟の入口が見つかりやすい。
  mountainside:
    traits: [location, explorable]
    props:
      exploration_progress:
        value: 0
        range: {min: 0, max: 15}
      # くくり罠で掛かる重み（docs/engine/TrapSystem.md 3節）。宣言した動物だけが、その土地の
      # 罠の候補に載る。
      rat_catch: {value: 4}
      # 洞窟の入口が見つかる候補の重み。
      cave_find:
        value: 15
      # 木苺の茂みが見つかる候補の重み。
      berry_find:
        value: 10
    actions:
      explore:
        showMenu: always
        duration: 15
        add: {self: {exploration_progress: 1}}
        pick:
          # 1個
          - weight: {prop: cave_find}
            spawn: {object: cave_entrance, into: self}
          - weight: {prop: berry_find}
            spawn: {object: berry_bush, into: self}
          # 2個
          - weight: 20
            spawn: {object: stone, count: 2, into: self}
          - weight: 15
            spawn:
              - {object: stone, into: self}
              - {object: twig, into: self}
          - weight: 10
            spawn: {object: twig, count: 2, into: self}
          # 3個
          - weight: 18
            spawn:
              - {object: stone, count: 2, into: self}
              - {object: twig, into: self}
          - weight: 12
            spawn:
              - {object: stone, into: self}
              - {object: twig, into: self}
              - {object: berry_bush, into: self}

  # 山頂。島で最も高い場所。風が強く得られるものは少ない（島を見渡す効果は今後の課題）。
  mountain_peak:
    traits: [location, explorable]
    props:
      exploration_progress:
        value: 0
        range: {min: 0, max: 10}
      # くくり罠で掛かる重み（docs/engine/TrapSystem.md 3節）。宣言した動物だけが、その土地の
      # 罠の候補に載る。
      rat_catch: {value: 4}
    actions:
      explore:
        showMenu: always
        duration: 15
        add: {self: {exploration_progress: 1}}
        pick:
          # 1個
          - weight: 25
            spawn: {object: cave_entrance, into: self}
          - weight: 25
            spawn: {object: stone, into: self}
          # 2個
          - weight: 30
            spawn: {object: stone, count: 2, into: self}
          - weight: 12
            spawn:
              - {object: cave_entrance, into: self}
              - {object: stone, into: self}
          # 3個
          - weight: 8
            spawn: {object: stone, count: 3, into: self}
